<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知所栖 135 · AI 时代要学的每一件事</title>
<!-- 知所栖 135 · 公网快照 2026-9-13 03:26:50
     概念地图与内参是烘焙好的静态数据，不依赖服务端。
     公网无服务端时，交卷判定退回机械覆盖检查（只标 mech，不冒充「过了」）。 -->
<style>
/* ══ 知所栖 135 · Linear 式三栏外壳 ══════════════════════════════
   参考：所有者 09-12 05:03–05:38 提供的 Linear Agent 页截图。
   Linear 的骨架是**三栏**：导航栏 | 列表栏 | 详情栏。
   之前那版是「全屏画布 + 滑出抽屉」——中间那一栏没有，所以没有 Linear 的味道。
   配色也按 Linear 收：近黑、低对比边、无光晕、无渐变。 */
:root{
  --bg:#08090a; --panel:#0e0f10; --panel2:#0b0c0d; --line:#1b1c1e; --line2:#232426;
  --fg:#f7f8f8; --fg2:#8a8f98; --fg3:#62666d; --fg4:#3c3f44;
  --accent:#5e6ad2; --accent2:#7c86e8;
  --ok:#4cb782; --bad:#eb5757; --warn:#f2c94c; --read:#9b7fe8;
  --row:30px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── 三栏 ───────────────────────────────────────────── */
#app{display:grid;grid-template-columns:224px 302px 1fr;height:100vh;overflow:hidden}

/* 导航栏 */
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;padding:10px 8px 8px;min-height:0;overflow:hidden}
.r-brand{display:flex;align-items:center;gap:7px;padding:4px 8px 12px;font-size:13.5px;
  font-weight:600;letter-spacing:.01em}
.r-brand span{font-size:10.5px;font-weight:500;color:var(--fg3);border:1px solid var(--line2);
  border-radius:5px;padding:0 5px;line-height:16px}
.r-brand .pubtag{border-color:#2b3a5c;color:#7c93c9}
.r-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;margin-bottom:8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg3);font-size:12.5px}
.r-search input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-size:12.5px;
  font-family:inherit;min-width:0}
.r-search input::placeholder{color:var(--fg4)}
.r-list{display:flex;flex-direction:column;gap:1px}
.r-item{display:flex;align-items:center;gap:8px;width:100%;height:var(--row);padding:0 8px;
  background:none;border:0;border-radius:6px;cursor:pointer;color:var(--fg2);
  text-align:left;font-size:13px}
.r-item:hover{background:#161719;color:var(--fg)}
.r-item.on{background:#1d1e21;color:var(--fg)}
.r-item .ic{width:14px;text-align:center;font-size:12px;opacity:.75;flex:0 0 14px}
.r-item b{font-weight:450;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-item i{font-style:normal;font-size:11px;color:var(--fg4);white-space:nowrap}
.r-item.on i{color:var(--fg3)}
.r-lines{overflow:auto;min-height:0;flex:1 1 auto;scrollbar-width:none;display:flex;
  flex-direction:column;gap:1px;margin-top:10px}   /* 减法后原本由 .r-sec 撑开的间距，改由这里给 */
.r-lines::-webkit-scrollbar{display:none}
.lrow{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:5px;
  cursor:pointer;color:var(--fg3);font-size:12px}
.lrow:hover{background:#161719;color:var(--fg2)}
.lrow.off{opacity:.32}
.lrow .n{margin-left:auto;font-size:10.5px;color:var(--fg4);font-variant-numeric:tabular-nums}
#myrow{font-size:11px;color:var(--fg4);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#myrow .n{margin-left:2px;color:var(--fg3)}
#myrow>span{display:inline-flex;align-items:center;gap:4px}
#myrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.r-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;
  align-items:center;gap:6px;color:var(--fg4);font-size:11.5px}
.r-foot .spacer{flex:1}

/* 列表栏 */
#list{background:var(--panel2);border-right:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0;min-width:0}
.lp-head{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;
  border-bottom:1px solid var(--line);flex:0 0 44px}
.lp-head b{font-size:13px;font-weight:550}
.lp-head .cnt{font-size:11.5px;color:var(--fg4)}
.lp-head .spacer{flex:1}
.lp-head button{background:none;border:0;color:var(--fg4);cursor:pointer;font-size:12px;
  padding:3px 5px;border-radius:5px}
.lp-head button:hover{background:#1a1b1e;color:var(--fg2)}
.lp-body{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 6px 12px;scrollbar-width:thin}
.lp-body::-webkit-scrollbar{width:8px}
.lp-body::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
.row{display:flex;align-items:center;gap:8px;height:var(--row);padding:0 8px;border-radius:6px;
  cursor:pointer;color:var(--fg2);font-size:12.5px}
.row:hover{background:#161719;color:var(--fg)}
.row.on{background:#1d1e21;color:var(--fg)}
.row .rd{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.row .rn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:11px;color:var(--fg4);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .st{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.lp-empty{color:var(--fg4);font-size:12px;padding:22px 10px;text-align:center;line-height:1.9}

/* 主区 */
#main{position:relative;background:var(--bg);overflow:hidden;min-width:0}
/* 详情打开时主区让出 412px，画布跟着缩——盖住图就不是 Linear 了 */
#main.pinned #c{right:412px}
#main.pinned .mtools{right:412px}
#main.pinned #hero-mini{max-width:290px}
#c{position:absolute;inset:0;display:block;cursor:grab;touch-action:none;transition:right .14s}
#c.drag{cursor:grabbing}
.mtools{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
  gap:6px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);z-index:4;
  background:linear-gradient(180deg,rgba(8,9,10,.92),rgba(8,9,10,.55));backdrop-filter:blur(6px)}
.mtools .spacer{flex:1}
.tab{background:none;border:1px solid var(--line);color:var(--fg3);font-size:11.5px;height:24px;
  padding:0 11px;border-radius:5px;cursor:pointer}
.tab:hover{color:var(--fg2);border-color:var(--line2)}
.tab.on{background:#1d1e21;color:var(--fg);border-color:var(--line2)}
.mtools .mm{font-size:11.5px;color:var(--fg4)}
#hero-mini{position:absolute;left:0;top:44px;z-index:3;pointer-events:none;max-width:330px;
  padding:12px 26px 14px 18px;
  background:linear-gradient(100deg,rgba(8,9,10,.94) 45%,rgba(8,9,10,0))}
#hero-mini .kicker{font-size:10.5px;color:var(--fg4);letter-spacing:.04em}
#hero-mini .stats{font-size:11.5px;color:var(--fg3);line-height:1.75;margin-top:5px}
#hero-mini .stats b{color:var(--fg2);font-weight:500}

/* 详情栏：停靠在主区右侧，不再滑出全屏 */
#panel{position:absolute;top:0;right:0;bottom:0;width:412px;background:var(--panel);
  border-left:1px solid var(--line);padding:20px 20px 28px;z-index:6;overflow-y:auto;
  transform:translateX(6px);opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;
  scrollbar-width:thin}
#panel.on{transform:none;opacity:1;pointer-events:auto}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
#panel .close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:6px;
  background:none;border:0;color:var(--fg4);cursor:pointer;font-size:13px;line-height:1}
#panel .close:hover{background:#1a1b1e;color:var(--fg2)}
#panel .src{font-size:11px;color:var(--fg3);margin-bottom:9px;padding-right:32px;line-height:1.7}
#panel h2{font-size:19px;font-weight:550;line-height:1.35;margin-bottom:12px;letter-spacing:-.01em}
#panel .gloss{font-size:13px;line-height:1.85;color:var(--fg2);margin-bottom:20px}
#panel .deep{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 18px;background:#141518}
#panel .deep summary{cursor:pointer;font-size:11.5px;color:var(--fg4);outline:none}
#panel .deep h5{margin-top:12px}
#panel .deep .mut{font-size:12px;line-height:1.8;color:var(--fg3);white-space:pre-wrap}
#panel .deep ul{margin:6px 0 0;padding-left:16px}
#panel .deep li{font-size:12px;line-height:1.75;color:var(--fg3);margin:3px 0}
#nei-body .nm .tomap{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-align:left;border-bottom:1px dashed var(--line2)}
#nei-body .nm .tomap:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
#nei-body .nm .tomap i{font-style:normal;font-size:10.5px;color:var(--fg4);margin-left:4px}
#panel .metrics{display:flex;gap:20px;padding:12px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:18px}
#panel .m{flex:1}
#panel .m b{display:block;font-size:17px;font-weight:500;color:var(--fg);line-height:1.2}
#panel .m span{font-size:10.5px;color:var(--fg4)}
#panel h5{font-size:11px;color:var(--fg4);margin:18px 0 8px;font-weight:500}
#panel ul{list-style:none}
#panel li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);
  padding:5px 7px;border-radius:5px;cursor:pointer}
#panel li:hover{background:#161719;color:var(--fg)}
#panel li em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--fg4)}
.mut{color:var(--fg3);font-size:12px;line-height:1.8}
.markrow{display:flex;gap:6px;flex-wrap:wrap}
.mk{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11.5px;height:26px;padding:0 10px;cursor:pointer}
.mk:hover{background:#1d1e21;color:var(--fg)}
.mk.on{background:#20263f;border-color:#39406b;color:#b9c0f0}
.mk.quiet{color:var(--fg4)}

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

/* 倒逼区 */
.dpane{background:#101113;border:1px solid var(--line2);border-radius:8px;padding:13px 14px;margin:16px 0}
.dpane h5{margin:0 0 7px}
.dpane textarea{width:100%;min-height:84px;background:#0a0b0c;border:1px solid var(--line2);
  border-radius:6px;padding:9px 10px;color:var(--fg);font-size:12.5px;line-height:1.75;
  outline:none;font-family:inherit;resize:vertical;margin-top:8px}
.dpane textarea:focus{border-color:#3a4058}
.dpane.quiet{background:#131020;border-color:#2c2545}
.jrow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.jbtn{background:var(--accent);border:0;border-radius:6px;color:#fff;font-size:12px;height:28px;
  padding:0 13px;cursor:pointer;font-weight:500}
.jbtn:hover{background:var(--accent2)}
.jbtn.ghost{background:#17181b;border:1px solid var(--line2);color:var(--fg2);font-weight:400}
.jbtn.ghost:hover{background:#1d1e21;color:var(--fg)}
.jerr{font-size:11px;color:var(--warn)}
.jverdict{border-radius:7px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.75}
.jverdict.ok{background:#0e1a14;border:1px solid #2b4a37;color:#b6e3ca}
.jverdict.mech{background:#1c1810;border:1px solid #5c4a26;color:#e2cf9e}
.jverdict.bad{background:#1c1110;border:1px solid #5c2f2b;color:#efc3bf}
.jverdict.read{background:#151228;border:1px solid #3b3163;color:#c3b8ea}
.jmiss{margin-top:6px;font-size:12px}
.backto{margin-top:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.backto button{background:#241715;border:1px solid #57302a;border-radius:5px;color:#e8bdb6;
  font-size:11.5px;height:24px;padding:0 9px;cursor:pointer}
.backto button:hover{background:#2e1c19}
.nexthint{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;
  color:var(--fg3);line-height:2.1}

.keyrow{display:flex;gap:6px;margin:8px 0 4px}
.keyrow input{flex:1;background:#0a0b0c;border:1px solid var(--line2);border-radius:6px;
  padding:7px 10px;color:var(--fg);font-size:11.5px;outline:none;font-family:inherit;min-width:0}
.keyrow button{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11px;padding:0 11px;cursor:pointer;white-space:nowrap}
.keyrow button:hover{background:#1d1e21;color:var(--fg)}
code{background:#161719;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--fg2)}


#tip{position:fixed;padding:5px 9px;background:#161719;border:1px solid var(--line2);
  border-radius:6px;font-size:11.5px;color:var(--fg);pointer-events:none;opacity:0;
  transition:opacity .1s;z-index:9;max-width:280px;line-height:1.6}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);
  color:var(--fg4);font-size:12.5px;z-index:20;transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#app{height:100vh}

@media (max-width:1100px){
  #app{grid-template-columns:200px 1fr}
  #list{display:none}
  #panel{width:100%}
}

/* ── 内参（第六格）：AI 内参图文格式的阅读区 ─────────────────────────
   主区原来只有画布。内参是「读」的界面，所以它盖在画布上，不影响图谱布局。 */
#reader{position:absolute;inset:0;z-index:18;background:var(--bg);overflow:auto;display:none}
#reader.on{display:block}
.nei{max-width:768px;margin:0 auto;padding:20px 30px 90px}
.nei-crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg3)}
.nei-crumb b{color:var(--fg2);font-weight:500}
.nei-crumb .sp{flex:1}
.nei-title{font-size:26px;line-height:1.3;font-weight:600;margin:12px 0 10px;letter-spacing:-.01em}
.nei-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--fg2);font-size:12.5px}
.nei-meta .stars{color:#f2c94c;letter-spacing:1.5px}
.nei-meta .tag{border:1px solid var(--line2);border-radius:5px;padding:1px 7px;color:var(--fg2);font-size:11.5px}
.nei-meta .why{color:var(--fg4)}
.nei-hero{margin:16px 0 8px;border-radius:9px;overflow:hidden;border:1px solid var(--line);height:296px}
.nei-hero svg{display:block;width:100%;height:100%}
.nei-cap{color:var(--fg3);font-size:11.5px}
.nei-card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px 14px;margin:14px 0}
.nei-card h5{margin-bottom:6px}
.nei-card p{color:var(--fg2);line-height:1.7}
.nei-link{margin:14px 0 0;font-size:12.5px;color:var(--fg2)}
.nei-link a{color:var(--accent2);text-decoration:none}
.nei-link a:hover{text-decoration:underline}
.nei-tabs{display:flex;gap:2px;margin:20px 0 0;border-bottom:1px solid var(--line)}
.nei-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);
  font-size:12.5px;padding:8px 11px;cursor:pointer;margin-bottom:-1px}
.nei-tabs button:hover{color:var(--fg)}
.nei-tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.nei-body{padding-top:14px;font-size:13.5px;line-height:1.78}
.nei-body h2,.nei-body h3{font-size:15px;margin:20px 0 8px;color:var(--fg)}
.nei-body h4,.nei-body h5,.nei-body h6{font-size:13px;margin:16px 0 6px;color:var(--fg2)}
.nei-body p{margin:8px 0}
.nei-body ul{margin:6px 0 10px 18px}
.nei-body li{margin:3px 0}
.nei-body li.s{margin-left:14px;color:var(--fg2)}
.nei-body blockquote{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:8px 0;color:var(--fg2)}
.nei-body hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.nei-body code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.nei-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;overflow:auto;margin:10px 0}
.nei-body pre code{border:0;background:none;padding:0}
.concept{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:12px 0;background:var(--panel2)}
.concept .nm{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.concept .q{border-left:2px solid var(--line2);padding-left:10px;color:var(--fg2);margin:7px 0;font-size:12.5px;line-height:1.7}
.concept .fy{margin-top:9px;font-size:13px;line-height:1.75}
.concept .fy i{color:var(--accent2);font-style:normal;font-size:11.5px;margin-right:6px}
.fybox{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
.fybox .k{font-size:11.5px;color:var(--accent2);margin-bottom:7px}
.fybox .mut{color:var(--fg3);font-size:11.5px;margin-bottom:8px}
.fybox ul{margin:6px 0 0 18px}
.fybox li{margin:4px 0;line-height:1.7}
.fybox li b{color:var(--fg)}
.nei-foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:var(--fg3);font-size:11.5px}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="r-brand">知所栖<span>135</span><span class="pubtag" id="pubtag" title="公网快照：概念地图与内参都是 2026-9-13 03:26:50 烘焙好的静态数据；静态站上没有服务端，交卷走机械覆盖检查">公网快照</span></div>
    <label class="r-search">⌕<input id="q-filter" placeholder="筛选…" oninput="renderList()"></label>
    <nav class="r-list">
      <button class="r-item on" data-view="graph" onclick="setView('graph')"><span class="ic">◧</span><b>知识体系</b><i id="r-all"></i></button>
      <button class="r-item" data-view="neican" onclick="setView('neican')"><span class="ic">▤</span><b>内参</b><i id="r-nei"></i></button>
    </nav>
    <div class="r-lines" id="lrows"></div>
    <div class="r-foot">
      <span id="myrow" style="flex:1"></span>
      <span id="rhint"></span>
    </div>
  </aside>

  <section id="list">
    <header class="lp-head">
      <b id="lp-title">知识体系</b><span class="cnt" id="lp-count"></span>
      <span class="spacer"></span>
      <button onclick="setView('graph')" title="回到全图">全图</button>
    </header>
    <div class="lp-body" id="lp-body"></div>
  </section>

  <main id="main">
    <canvas id="c"></canvas>
    <div class="mtools">
      <button class="tab on" data-mode="grid">图谱</button>
      <button class="tab" data-mode="sphere">星球</button>
      <span class="spacer"></span>
      <span class="mm" id="main-meta"></span>
    </div>
    <div id="hero-mini"><div class="kicker" id="kicker"></div><div class="stats" id="stats"></div></div>
    <div id="reader"><div class="nei" id="nei-wrap"></div></div>
    <aside id="panel">
      <button class="close" onclick="closePanel()">✕</button>
      <div id="pbody"></div>
    </aside>
  </main>
</div>

<div id="tip"></div>

你能算出这段文本的 {{name}} 并估算成本吗？","origin":["notion"],"mentionCount":1},{"id":"cm_cc101992","name":"按需加载","src":"neican","type":"CONCEPTUAL","gloss":"技能按需加载：起初只加载名称与描述，请求匹配时才加载正文，不占满上下文。","level":1,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能与 CLAUDE.md、斜杠命令的加载方式做对比","nameEn":"","centrality":0.308,"stage":"now","feynman":"按需加载是技能的上下文策略。Claude 最初只加载名称和描述，只有当请求匹配时，才加载技能正文。它不同于 CLAUDE.md 那种每次对话都加载的方式，因此能让很多专业知识存在，而不会一直占满上下文窗口。","evidence":["能与 CLAUDE.md、斜杠命令的加载方式做对比","能解释 PR 审阅清单只在真正审阅时才进入上下文"],"ap":"相比 CLAUDE.md 每次加载，{{name}} 省下了什么？","origin":["neican"],"mentionCount":2},{"id":"cm_9ed037b8","name":"Sandbox","src":"harness","type":"CONCEPTUAL","gloss":"解决代码在哪跑的隔离执行环境，可叠加命令白名单与网络隔离，按需创建、扇出、用完销毁。","level":0,"ci":2,"tags":["tools-sandbox"],"k":"use","kwhy":"能说明本地跑 agent 代码与大规模负载各自的风险","nameEn":"","centrality":0.308,"stage":"when-needed","feynman":"给 agent 一间一次性实验室——它可以在里面随便炸，炸完把房间扔掉再开一间新的。安全和扩展性其实是同一件事的两面：因为环境是隔离且可抛弃的，所以既能放心让它折腾，也能同时开一百间。","evidence":["能说明本地跑 agent 代码与大规模负载各自的风险","能为一个 agent 任务设计可销毁的隔离执行环境"],"ap":"你的 {{name}} 是否做到按需创建、用完即毁并限制网络？","origin":["harness"],"mentionCount":2},{"id":"cm_30201f36","name":"上下文工程","src":"multi","type":"CONCEPTUAL","gloss":"对模型上下文窗口的审慎构建与管理，把原始上下文与目标任务映射为可组合的上下文处理函数。","level":1,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能把一个任务拆成采集、存储、表示、选择、压缩等上下文操作","nameEn":"context engineering","centrality":0.298,"stage":"now","feynman":"它不是\"写好提示词\"的高级说法，而是\"如何把人脑里的情境和目的，整理成机器接得住的形状\"这个问题的统称。技术会换，问题不换。","evidence":["能把一个任务拆成采集、存储、表示、选择、压缩等上下文操作","能针对具体 Agent 说明每一步该把哪些信息放进窗口"],"ap":"按 {{name}}，当前这一步该给模型看哪些信息？","origin":["context","harness"],"mentionCount":14},{"id":"cm_200893a2","name":"skills 字段","src":"neican","type":"REPRESENTATIONAL","gloss":"自定义子代理前置元数据中列出待加载技能的 skills 字段，委派时应用。","level":0,"ci":3,"tags":["harness-runtime"],"k":"use","kwhy":"能在 .claude/agents 的代理 markdown 前置元数据里写出 skills 字段","nameEn":"","centrality":0.298,"stage":"now","feynman":"`skills:` 这一行就是隔离规则的解药——只有在自定义子代理的前置元数据里点名写出技能，它才会加载，并在每次被委派时都应用。它的前置条件是技能已存在于 `.claude/skills`；操作上可以用 `/agents` 交互生成，也可以往已有的代理 markdown 里补字段。作者点出它的价值在于\"强制执行标准，而不依赖于提示\"：把规则沉淀成技能并绑定到代理上，比每次在提示里重申更可靠。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TB\n  subgraph L1[分发层：技能怎么到达使用者]\n    A[\"仓库提交<br/>.claude/skills · Git 自动共享\"]\n    B[\"插件与市场<br/>skills 目录 + SKILL.md\"]\n    C[\"企业托管设置<br/>strictKnownMarketplaces 限来源\"]\n  end\n  subgraph L2[优先级层]\n    D[\"企业技能：最高优先级<br/>覆盖同名个人／项目／插件技能\"]\n  end\n  subgraph L3[子代理访问层：谁能用技能]\n    E[\"技能隔离<br/>不自动继承 · 全新干净上下文\"]\n    F[\"内置代理 Explorer／Plan／Verify<br/>完全无法访问技能\"]\n    G[\"自定义子代理 .claude/agents<br/>需显式授权\"]\n    H[\"skills 字段<br/>列出要加载的技能\"]\n  end\n  C --> D\n  D -->|同名时覆盖| A\n  D -->|同名时覆盖| B\n  E --> F\n  E -->|故必须显式列出| G\n  G --> H\n  H -->|每次委派时加载并应用| G\n```\n\n图中三层的划分依据是功能角色：分发层决定技能以何种渠道、何种范围到达使用者；优先级层裁决同名冲突；子代理访问层处理\"委派出去的工作能不能用上技能\"。企业托管设置单独指向优先级层，是因为它同时具备部署方式与最高优先级两重身份。","evidence":["能在 .claude/agents 的代理 markdown 前置元数据里写出 skills 字段","能说明该字段的前提是技能已存在于 .claude/skills"],"ap":"{{name}} 写在哪里？生效前提是什么？","origin":["neican"],"mentionCount":14},{"id":"cm_036f0092","name":"前缀匹配","src":"context","type":"CONCEPTUAL","gloss":"缓存命中依赖请求前缀完全一致，语义相近不等于前缀一致，前缀稳定性直接决定命中率。","level":0,"ci":1,"tags":["caching-cost"],"k":"judge","kwhy":"能区分『语义差不多』与『前缀一致』两种情况","nameEn":"Prefix Matching","centrality":0.29,"stage":"when-needed","feynman":"模型缓存不是按“意思相近”来找回忆，而是看前面的请求结构和内容是否对得上。意思差不多但顺序、字段、动态内容变了，缓存仍然可能 miss。","evidence":["能区分『语义差不多』与『前缀一致』两种情况","能指出改动哪一段会打破前缀一致导致缓存失效"],"ap":"这里缓存没命中，是{{name}}被破坏了吗？","origin":["context"],"mentionCount":1},{"id":"cm_a4f9a7e3","name":"循环工程","src":"context","type":"PROCEDURAL","gloss":"把频繁的手动收尾固化为可重复循环的方法：挑动作、试验证、写流程、封装成技能、调用并迭代、再链式化。","level":2,"ci":1,"tags":["loop-autonomy"],"k":"use","kwhy":"能按顺序复述从挑手动动作到链式化的六步","nameEn":"loop engineering","centrality":0.29,"stage":"now","feynman":"把「让机器自己检查自己」当成一门可以反复练的手艺，而不是一次性的小聪明。每次都用同一套固定招式：找到最烦人的重复动作，写成规则，装上，试跑，再串起来。招式不变，能自动化的东西越来越多。","evidence":["能按顺序复述从挑手动动作到链式化的六步","能在新任务上跑通一次并说出下一轮要改哪里"],"ap":"按{{name}}，你会先挑哪个手动动作做第一环？","origin":["context"],"mentionCount":1},{"id":"cm_05146d91","name":"注意力预算","src":"context","type":"CONCEPTUAL","gloss":"把 LLM 注意力类比为有限的工作记忆预算，每新增一个 token 都要从中支取，故上下文是有限资源。","level":1,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能据此解释长上下文的边际收益递减","nameEn":"attention budget","centrality":0.29,"stage":"now","feynman":"把模型的注意力想成一天的体力。每往它眼前多放一份材料，就要花掉一点体力去看、去比对。材料堆到一定量，人还在，但已经开始眼花——不是不认字了，是顾不过来了。","evidence":["能据此解释长上下文的边际收益递减","能对给定任务判断上下文该留多少"],"ap":"你能用 {{name}} 说明为何塞满窗口反而更差吗？","origin":["context"],"mentionCount":1},{"id":"cm_51de352d","name":"Tool Calling","src":"context","type":"CONCEPTUAL","gloss":"模型通过工具调用来对外行动，工具可用 bash、skills、代码执行等原语构造。","level":1,"ci":1,"tags":["tools-sandbox"],"k":"use","kwhy":"能说明模型本身不执行动作、而是发出工具调用","nameEn":"","centrality":0.29,"stage":"now","feynman":"Claude 与外部世界交互的唯一方式。模型不能直接操作环境，而是通过“调用工具”这个标准接口来行动。bash、code execution、skills 都是不同类型的工具原语。","evidence":["能说明模型本身不执行动作、而是发出工具调用","能列举至少两种构造工具的原语"],"ap":"要让模型真正动手改文件，{{name}} 在其中扮演什么角色？","origin":["context"],"mentionCount":1},{"id":"cm_e56f1e8b","name":"Harness 工程","src":"multi","type":"CONCEPTUAL","gloss":"围绕模型构建的完整系统，使 Agent 能够自主行动。","level":1,"ci":4,"tags":["harness-runtime"],"k":"judge","kwhy":"能举出把人类先验注入 Agent 系统的具体做法","nameEn":"Harness Engineering","centrality":0.281,"stage":"when-needed","feynman":"Harness 工程比提示词和上下文更大。它把工具、状态、错误、验证、安全和生命周期都放进同一个执行架构里，使模型不仅能回答，还能行动。","evidence":["能举出把人类先验注入 Agent 系统的具体做法","能说明模型升级后如何定位并替换 Harness 中过时的部分"],"ap":"{{name}} 的两个作用是什么？举一个注入先验的例子。","origin":["context","harness"],"mentionCount":13},{"id":"cm_d78a3680","name":"SKILL.md 与 YAML 前置元数据","src":"neican","type":"REPRESENTATIONAL","gloss":"SKILL.md 的 YAML 前置元数据以 name 与 description 为必需字段，是技能的发现层。","level":0,"ci":3,"tags":["context-engineering"],"k":"use","kwhy":"能写出符合字符与命名规则的前置元数据","nameEn":"SKILL.md / YAML frontmatter","centrality":0.263,"stage":"now","feynman":"SKILL.md 是每个技能的入口文件，YAML 前置元数据是技能的“发现层”。其中 `name` 和 `description` 是必需字段，而 `description` 必须同时说明技能做什么、Claude 什么时候该用它。原因是 Claude 靠这段元数据判断是否触发技能。元数据之外的 SKILL.md 正文才承载具体工作流程和指南。字段限制则构成技能定义文件的边界。","evidence":["能写出符合字符与命名规则的前置元数据","能说明 description 必须同时写清功能与使用时机"],"ap":"{{name}} 中 description 为什么必须同时写清功能与使用时机？","origin":["neican"],"mentionCount":12},{"id":"cm_10cbe746","name":"持久化执行","src":"harness","type":"CONCEPTUAL","gloss":"把每次 LLM 或工具调用变成一个可独立重试的 step，进程崩溃后从已持久化的检查点继续。","level":0,"ci":2,"tags":["state-persistence"],"k":"judge","kwhy":"能说出第 N 轮崩溃时哪些轮次已经落盘","nameEn":"durable execution","centrality":0.253,"stage":"now","feynman":"像玩游戏时每过一关自动存档。第五关挂了，你从第五关重开，前四关不用重打。持久化执行就是把这套存档机制装进程序的每一步。","evidence":["能说出第 N 轮崩溃时哪些轮次已经落盘","能解释为何丢失沙箱容器不等于丢失整个 run"],"ap":"进程在第五轮挂掉，{{name}} 为什么还能让这次 run 继续？","origin":["harness"],"mentionCount":2},{"id":"cm_b55ff5c3","name":"记忆","src":"multi","type":"CONCEPTUAL","gloss":"在不同时间尺度上运作的存储：会话内、跨会话、长期沉淀，各层服务于不同的取回需求。","level":0,"ci":4,"tags":["memory-retrieval"],"k":"judge","kwhy":"能区分几种时间尺度各自该存什么","nameEn":"Memory","centrality":0.253,"stage":"now","feynman":"记忆不是一个单一存储，而是短期对话历史和长期跨会话信息的组合。Harness 要让模型既能延续当前任务，也能调用过去保存的知识。","evidence":["能区分几种时间尺度各自该存什么","能说明某条经验该落在哪一层记忆"],"ap":"这条经验该进哪一层 {{name}}，为什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_01d6a01e","name":"长上下文窗口","src":"multi","type":"CONCEPTUAL","gloss":"模型一次能装下的文本量，如 1M token 可装下整套《指环王》与《霍比特人》。","level":0,"ci":4,"tags":["context-engineering"],"k":"judge","kwhy":"能说出上下文窗口的规模量级（如 1M token）","nameEn":"","centrality":0.253,"stage":"now","feynman":"Context Window 是 LLM 在一次对话中能\"看到\"的全部信息总量，相当于人类的工作记忆。它有上限，超出就会遗忘；它很昂贵，内容越多模型越容易分心。核心原则：Context 的质量远比数量重要。","evidence":["能说出上下文窗口的规模量级（如 1M token）","能解释为何上下文越满准确性越可能下降"],"ap":"{{name}} 越大，为什么不一定让结果更好？","origin":["notion","context"],"mentionCount":2},{"id":"cm_f45e5118","name":"Agentic Engineering","src":"multi","type":"CONCEPTUAL","gloss":"协调可错、随机而强大的 agent 快速产出，同时守住正确性、安全、品味与可维护性的工程纪律。","level":1,"ci":4,"tags":["code-engineering"],"k":"judge","kwhy":"能说出设计 spec、查 diff、写测试、建评测循环等做法","nameEn":"","centrality":0.253,"stage":"now","feynman":"Agentic Engineering 是「骑马出行」这件事本身。由 Andrej Karpathy（2026.01）命名，对标的是 Vibe Coding。核心变化是工程师的角色从「写代码的人」变成「编排 Agent 组合、定义目标和护栏、审查输出的人」——从 creator 变为 curator。它关注的是委派、审查、所有权等工作流问题。","evidence":["能说出设计 spec、查 diff、写测试、建评测循环等做法","能用一个具体反例说明为何要工程师坚守底层概念"],"ap":"{{name}} 与 vibe coding 的分界在哪里？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_4a78d263","name":"Subagent","src":"multi","type":"CONCEPTUAL","gloss":"把一整个 session 工作封装、只回流浓缩结果的子代理，拥有全新而小的上下文窗口与指令预算。","level":1,"ci":4,"tags":["multi-agent"],"k":"use","kwhy":"能解释子代理如何靠多个上下文窗口拼出一个问题的解","nameEn":"","centrality":0.253,"stage":"when-needed","feynman":"主 agent 生成的子任务执行者。就像一个项目经理把工作分派给团队成员——每个 subagent 独立工作，但需要共享状态和协调进度。Task Tool 就是为解决 subagent 间协作而设计的。","evidence":["能解释子代理如何靠多个上下文窗口拼出一个问题的解","能指出派发方只看提示与最终结果这一边界"],"ap":"你能否用 {{name}} 并行解一个超长任务并只回收结论？","origin":["context","harness"],"mentionCount":2},{"id":"cm_dc9a27be","name":"安全审计与受信任来源","src":"neican","type":"CONCEPTUAL","gloss":"技能等同要安装的软件：只用可信来源，并审计包内全部文件以防恶意指令与代码。","level":0,"ci":3,"tags":["safety-governance"],"k":"judge","kwhy":"能说出恶意技能可能造成数据外泄或未授权访问","nameEn":"Security Considerations / Trusted Sources","centrality":0.248,"stage":"now","feynman":"安全边界来自技能能通过指令和代码给 Claude 新能力。恶意技能可能让 Claude 以不符合声明目的的方式调用工具、执行代码，导致数据外泄或未授权访问。本文把技能当作要安装的软件来对待，强调来源可信，并要求审计技能包中的所有文件，包括 SKILL.md、脚本、图片和其他资源。外部 URL 风险、工具滥用、数据暴露是这条防御结构里的几个关键边界。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TB\n  subgraph 基础对象层\n    AS[\"代理技能 Agent Skills\"]\n    PC[\"预构建技能 / 自定义技能\"]\n    SM[\"SKILL.md / YAML 前置元数据\"]\n    FS[\"文件系统型代码执行环境\"]\n  end\n  subgraph 加载运行层\n    TR[\"技能触发与自动使用\"]\n    PD[\"渐进式披露\"]\n    CT[\"三类内容：说明 / 代码 / 资源\"]\n  end\n  subgraph 边界治理层\n    RT[\"运行时限制、权限与数据保留边界\"]\n    SS[\"跨产品面同步与共享边界\"]\n    SEC[\"安全审计与受信任来源\"]\n  end\n  AS -->|\"包含\"| PC\n  AS -->|\"必须包含\"| SM\n  AS -->|\"以目录形式存在于\"| FS\n  SM -->|\"description 用于判断\"| TR\n  TR -->|\"触发后读取 SKILL.md\"| PD\n  PD -->|\"分阶段加载\"| CT\n  FS -->|\"提供 bash 与代码执行\"| CT\n  FS -->|\"受约束于\"| RT\n  SS -->|\"决定上传与共享\"| PC\n  SEC -->|\"约束使用\"| AS\n  SEC -->|\"审计文件与脚本\"| SM\n  SEC -->|\"关注工具滥用\"| FS\n```","evidence":["能说出恶意技能可能造成数据外泄或未授权访问","能列出需审计的文件类型：SKILL.md、脚本、图片及其他资源"],"ap":"按 {{name}}，拿到第三方技能应先做什么？","origin":["neican"],"mentionCount":8},{"id":"cm_1d5a247c","name":"多时间尺度记忆与「记忆只是 hint」","src":"harness","type":"CONCEPTUAL","gloss":"短期为单会话历史，长期跨会话持久化并分层索引；agent 应把记忆当提示，行动前校验真实状态。","level":0,"ci":2,"tags":["memory-retrieval"],"k":"judge","kwhy":"能说出常驻轻量索引／按需主题文件／可搜索 transcript 三层","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"笔记本上写着「钥匙在抽屉里」，出门前还是要拉开抽屉看一眼。记忆是线索，不是事实。","evidence":["能说出常驻轻量索引／按需主题文件／可搜索 transcript 三层","能指出记忆可能过期，行动前须对真实状态做校验"],"ap":"面对 {{name}} 里的旧记忆，动手前要不要核对？","origin":["harness"],"mentionCount":1},{"id":"cm_698b655e","name":"奖励攻击与多样性坍塌","src":"harness","type":"CONCEPTUAL","gloss":"自改进回路会过拟合给定信号（测试、裁判、基准），并压榨已知高回报模式导致种群坍缩。","level":1,"ci":2,"tags":["model-training"],"k":"judge","kwhy":"能举出对单元测试过拟合、针对裁判模型取巧的具体失败案例","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"考什么就练什么，甚至练怎么骗监考；而且一旦发现某条捷径能拿分，所有人就都走那条路，别的路再也没人试。","evidence":["能举出对单元测试过拟合、针对裁判模型取巧的具体失败案例","能说明为何开放式研究需要防止种群坍缩的机制"],"ap":"{{name}} 的两种失灵分别怎么识别？","origin":["harness"],"mentionCount":1},{"id":"cm_588433b7","name":"品味与「不接受够用就行」","src":"harness","type":"CONCEPTUAL","gloss":"人工迭代阶段的纪律：不满足于 AI 产出的『够用就行』，苛刻地把关质量，这是人的责任与价值。","level":1,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"复盘时能指出自己曾放过的『够用就行』产出并说明差在哪","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"AI 把「做出来」变便宜了，于是「值不值得做成这样」成了唯一稀缺的判断。你的品味不再是装饰，它成了产品质量的最后一道闸门。","evidence":["复盘时能指出自己曾放过的『够用就行』产出并说明差在哪","能给出对 AI 产出逐轮加严的具体验收标准"],"ap":"这份产出你是直接收下，还是按{{name}}再驳一轮？","origin":["harness"],"mentionCount":1},{"id":"cm_f5944e33","name":"提示词缓存（Prompt Caching）","src":"notion","type":"PROCEDURAL","gloss":"把稳定前缀放在 prompt 前部并尽量保持不变，以命中供应商缓存。","level":0,"ci":0,"tags":["caching-cost"],"k":"use","kwhy":"能重排 prompt 顺序以提高缓存命中","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"- 大模型 API 的一种省钱机制：**如果两次请求的前缀（系统提示词部分）一字不差，供应商可以复用上次的计算结果**——价格更便宜、延迟更低。","evidence":["能重排 prompt 顺序以提高缓存命中","能解释前缀一改动缓存为何失效"],"ap":"怎么让 {{name}} 的命中率最大化？","origin":["notion"],"mentionCount":1},{"id":"cm_f50a09c9","name":"有限的工作记忆","src":"context","type":"CONCEPTUAL","gloss":"模型能装载的上下文信息量有限，因此「往里面放什么」必须做取舍，这是上下文工程的物理前提。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能指出上下文空间有限是必须取舍的原因","nameEn":"limited working memory","centrality":0.236,"stage":"now","feynman":"模型的注意力像一张放不大的桌子。资料再多也只能摊开一部分，所以问题从「有没有资料」变成「这一刻该把哪几份摊在最上面」。","evidence":["能指出上下文空间有限是必须取舍的原因","能举出 agent 场景下工作记忆被装填的具体对象"],"ap":"为什么{{name}}是上下文工程之所以是「工程」的前提？","origin":["context"],"mentionCount":1},{"id":"cm_be951649","name":"状态子系统与进度持久化","src":"harness","type":"PROCEDURAL","gloss":"用 progress.md、feature_list、git log 等把做了什么、在做什么、下一步是什么持久化到磁盘，让下次会话接着做。","level":1,"ci":2,"tags":["state-persistence"],"k":"use","kwhy":"能在项目里落地一份进度文件并在新会话中续接","nameEn":"","centrality":0.236,"stage":"now","feynman":"agent 的记忆在会话结束时就清零了。想让它接着干，就不能指望它「记得」，只能让它「读得到」——把进度写在纸上放在桌面正中间，下次开工第一件事就是读那张纸。","evidence":["能在项目里落地一份进度文件并在新会话中续接","能用 git log 与会话交接笔记还原任务状态"],"ap":"你的 {{name}} 里写清了下一步是什么吗？","origin":["harness"],"mentionCount":1},{"id":"cm_44a5e9cc","name":"Agent vs Harness","src":"harness","type":"CONCEPTUAL","gloss":"agent 是用户交互的涌现行为实体，harness 是产生该行为的机器。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能用一句话分别定义 agent 与 harness","nameEn":"","centrality":0.236,"stage":"now","feynman":"**agent 是台前**——用户看到的那个会干活的智能体；**harness 是台后**——让那个智能体能干活的那套机器。说 \"我做了个 agent\" 本质是 \"我造了个 harness，把它对准了一个模型\"。","evidence":["能用一句话分别定义 agent 与 harness","能对一个具体项目指认哪部分属于 harness"],"ap":"{{name}}的区别是什么？举例说明。","origin":["harness"],"mentionCount":1},{"id":"cm_b9224922","name":"AI 作为新同事","src":"notion","type":"CONCEPTUAL","gloss":"用同事而非工具来比喻 AI：被授权、被记录、被审计、可能犯错、需要边界。","level":0,"ci":0,"tags":["agent-org"],"k":"judge","kwhy":"能说出同事比喻比工具比喻多出的要求","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"","evidence":["能说出同事比喻比工具比喻多出的要求","能用该比喻为 AI 划定使用边界"],"ap":"{{name}} 的比喻比'工具'多要求了什么？","origin":["notion"],"mentionCount":1},{"id":"cm_968e8f3d","name":"AI-First","src":"harness","type":"CONCEPTUAL","gloss":"不是员工都使用 AI 工具，而是让 AI 主导生产力，围绕 AI 能力重构工作流、组织结构与对齐机制。","level":2,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"能区分'员工都用 AI 工具'与 AI-First","nameEn":"","centrality":0.236,"stage":"now","feynman":"不是“人照旧工作，只是旁边多了一个 AI 助手”，而是“公司默认由 AI 推动任务流转，人主要负责设定方向、搭系统和验收结果”。","evidence":["能区分'员工都用 AI 工具'与 AI-First","能指出需要被重构的三类机制"],"ap":"{{name}} 与'员工都用 AI 工具'的差别在哪？","origin":["harness"],"mentionCount":1},{"id":"cm_e09e7cfa","name":"coding agent","src":"context","type":"LANGUAGE","gloss":"由 harness 包裹的 LLM，并借工具获得读写代码等额外能力的代理。","level":1,"ci":1,"tags":["harness-runtime"],"k":"judge","kwhy":"能说明 harness 与模型在编码代理中的分工","nameEn":"","centrality":0.236,"stage":"now","feynman":"coding agent 不是“一个会写代码的模型”，而是一套把模型接到文件系统、终端、代码执行器和项目上下文上的软件系统。","evidence":["能说明 harness 与模型在编码代理中的分工","能举出编码代理借工具获得的具体能力"],"ap":"{{name}} 由哪两部分构成，工具起什么作用？","origin":["context"],"mentionCount":1},{"id":"cm_285b2834","name":"Guardrails","src":"harness","type":"CONCEPTUAL","gloss":"在 Agent 执行的同时并行做输入输出校验与安全检查，不通过就快速失败。","level":2,"ci":2,"tags":["safety-governance"],"k":"use","kwhy":"能说明护栏与 Agent 执行是并行而非串行","nameEn":"","centrality":0.236,"stage":"when-needed","feynman":"护栏不是排在主流程前面挡路的关卡，而是与主流程同时跑的一条检查线。一旦检查不过就立刻中止，不让错误输入白白消耗一整轮推理。","evidence":["能说明护栏与 Agent 执行是并行而非串行","能指出 fail fast 在实际流程中的表现"],"ap":"{{name}} 在检查不通过时会怎样，它与 Agent 执行是什么关系？","origin":["harness"],"mentionCount":1},{"id":"cm_5103a6a6","name":"Human in the loop","src":"harness","type":"CONCEPTUAL","gloss":"在 Agent 运行过程中引入人类参与的机制，与 Guardrails、Tracing 并列构成控制面能力。","level":1,"ci":2,"tags":["safety-governance"],"k":"use","kwhy":"能指出可以在哪几个环节插入人工介入","nameEn":"","centrality":0.236,"stage":"now","feynman":"不是所有决定都该让 agent 自己拍板。人在环中是框架预留的插入点，让人在运行过程中确认、修正或叫停，而不是只能在事后看结果。","evidence":["能指出可以在哪几个环节插入人工介入","能说明它与 Guardrails、Tracing 各自的分工"],"ap":"{{name}} 在控制面里承担什么角色？","origin":["harness"],"mentionCount":1},{"id":"cm_8e93fc18","name":"Intelligence Factory 智能工厂","src":"notion","type":"CONCEPTUAL","glo ness-runtime"],"k":"judge","kwhy":"能说出三个产品面之间技能不自动同步","nameEn":"Surface-specific Sync and Sharing","centrality":0.211,"stage":"when-needed","feynman":"技能在不同产品面之间不会自动同步。上传到 claude.ai 的技能不会自动出现在 API，API 上传的也不会出现在 claude.ai，Claude Code 的技能则基于文件系统，和两者分开。共享范围也不同：claude.ai 是个人级，API 是工作区级，Claude Code 是个人或项目级。理解“技能在哪里可用、谁能看到”必须看这个边界，不能假设一次上传处处可用。","evidence":["能说出三个产品面之间技能不自动同步","能指出各面共享范围分别是个人级、工作区级或项目级"],"ap":"上传到 claude.ai 的 {{name}} 会自动出现在 API 吗？","origin":["neican"],"mentionCount":9},{"id":"cm_94fa45bf","name":"跨轮次记忆与连贯策略","src":"multi","type":"CONCEPTUAL","gloss":"保留推理历史后模型更能随时间学习并使用连贯策略；两处失忆叠加解释了它此前为何学不会。","level":3,"ci":4,"tags":["memory-retrieval"],"k":"judge","kwhy":"能指出此前模型难以随时间学习的原因","nameEn":"","centrality":0.198,"stage":"when-needed","feynman":"能不能把每一步的经验累积成一套打法，是探索型任务的胜负手。没有记忆，模型只是在做一串互不相关的单步决策；有了记忆，这些决策才连成策略。","evidence":["能指出此前模型难以随时间学习的原因","能对比保留与不保留推理历史的任务表现"],"ap":"为什么保留推理历史之后，{{name}} 会变好？","origin":["context","harness"],"mentionCount":2},{"id":"cm_f3b13df1","name":"外包思考，但不外包理解","src":"notion","type":"CONCEPTUAL","gloss":"调研、计算、写代码可以外包给 agent，但理解必须留在自己脑中，否则无法指挥。","level":2,"ci":0,"tags":["thinking-method"],"k":"judge","kwhy":"能举出因缺乏理解而放过 agent 可疑结果的例子","nameEn":"","centrality":0.198,"stage":"now","feynman":"","evidence":["能举出因缺乏理解而放过 agent 可疑结果的例子","能说明理解为何是 directorship 的前提"],"ap":"为什么说 {{name}}，判断什么值得 build 靠的是哪一半？","origin":["notion"],"mentionCount":2},{"id":"cm_7cd7335d","name":"验证闭环","src":"multi","type":"PROCEDURAL","gloss":"把产出后必做的检查固化成可自动执行的一环，让 Claude 自己验证自己的产物。","level":1,"ci":4,"tags":["verification-eval"],"k":"use","kwhy":"能为一个重复任务写出对应的验证步骤 skill","nameEn":"verification loop","centrality":0.198,"stage":"now","feynman":"就像工厂流水线末端的质检工位。以前每做完一件产品你都得亲自拿卡尺量一遍；验证闭环就是把这道质检工序标准化、装到流水线上，让它自动量、自动挑出次品，你只在它报警时才出面。","evidence":["能为一个重复任务写出对应的验证步骤 skill","能说明为何验证不应依赖人每次记着做"],"ap":"{{name}} 建成后，谁来触发这次检查？","origin":["context","harness"],"mentionCount":2},{"id":"cm_b6da7e6e","name":"执行主体从人变成 Agent","src":"neican","type":"CONCEPTUAL","gloss":"流程步骤不变，但分析、设计、编码 cription` 的匹配情况自动触发。触发之后，Claude 才会用 bash 读取 SKILL.md，把正文指令带进上下文。这个机制解释了为什么描述必须同时写“功能”和“使用时机”：描述本身就是触发判断的依据。","evidence":["能解释触发判断依据是技能描述而非正文","能描述触发后正文才进入上下文窗口"],"ap":"{{name}} 发生在读取 SKILL.md 之前还是之后？","origin":["neican"],"mentionCount":3},{"id":"cm_f986a343","name":"确认环节可以合并，但不能省略","src":"neican","type":"CONCEPTUAL","gloss":"确认环节可以合并加速，但绝不能跳过人的判断。","level":0,"ci":3,"tags":["verification-eval"],"k":"judge","kwhy":"能列举哪些确认可合并、哪些不能取消","nameEn":"","centrality":0.161,"stage":"now","feynman":"需求、原型、UI 等确认可以合并成一次，流程可以简化；但可行性、技术方向、原型／UI、测试这些确认不能取消。它划出 AI 原生开发中可优化和绝对禁止的边界。","evidence":["能列举哪些确认可合并、哪些不能取消","能指出人的判断力不可替代是这条边界的依据"],"ap":"{{name}} 的边界在哪里：什么能省、什么不能省？","origin":["neican"],"mentionCount":3},{"id":"cm_78356595","name":"让 Agent 自行验证","src":"neican","type":"PROCEDURAL","gloss":"给 Agent 一个自己的反馈循环，让它在你看到结果前先自检。","level":2,"ci":3,"tags":["verification-eval"],"k":"use","kwhy":"能描述 Agent 自行跑测试、调试、截图确认的过程","nameEn":"","centrality":0.161,"stage":"when-needed","feynman":"Agent 写代码后自己跑测试、调试、截图确认，形成内部反馈循环。人拿到的不是粗糙初稿，而是已自检结果。它解释了为什么可以合并确认而不牺牲太多质量。","evidence":["能描述 Agent 自行跑测试、调试、截图确认的过程","能说明这为何让合并确认环节相对安全"],"ap":"{{name}} 为什么能减少人的介入次数？","origin":["neican"],"mentionCount":3},{"id":"cm_67483624","name":"\"If you're not the model, you're the harness.\"","src":"harness","type":"CONCEPTUAL","gloss":"Vivek Trivedy 的划界公式：模型权重是一侧，其余全部工程都归为 harness。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能对任一 agent 系统把组件分成模型侧与 harness 侧","nameEn":"","centrality":0.144,"stage":"when-needed","feynman":"agentic AI 世界里，万物二分。你做的要么是训练模型，要么是做 harness。**没有第三条路**。","evidence":["能对任一 agent 系统把组件分成模型侧与 harness 侧","在争论某能力归属时能引用这条划界"],"ap":"按 {{name}}，这个功能算模型还是算 harness？","origin":["harness"],"mentionCount":2},{"id":"cm_dee9d8f3","name":"笨循环","src":"multi","type":"CONCEPTUAL","gloss":"循环本身不含智能，只负责反复调用模型；所有判断与决策都来自模型的输出。","level":0,"ci":4,"tags":["loop-autonomy"],"k":"judge","kwhy":"能区分循环里哪部分是模型智能、哪部分只是调度代码","nameEn":"Dumb Loop","centrality":0.144,"stage":"now","feynman":"笨循环不是说系统粗糙，而是说 Har 608","name":"共享产品系统","src":"context","type":"CONCEPTUAL","gloss":"承载反馈、意图、决策、计划与代码的载体，让人与 agent 能共同在其中工作。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能指出 Linear 把自身定位为人与 agent 共同工作的系统","nameEn":"shared product system","centrality":0.126,"stage":"when-needed","feynman":"不是给人一个系统、给 agent 另一个系统，而是让两者共用同一个工作台。人在上面提需求、拍决策，agent 在同一处读取这些信息、接着往下做。共享的意思是：同一份上下文，人和机器都看得见、都能动手。","evidence":["能指出 Linear 把自身定位为人与 agent 共同工作的系统","能列出该系统承载的几类内容"],"ap":"{{name}} 承载哪些内容，其定位是什么？","origin":["context"],"mentionCount":1},{"id":"cm_492ee3e8","name":"共享理解","src":"context","type":"CONCEPTUAL","gloss":"人与 LLM 在设计树上逐步推进、最终就设计达成一致的过程。","level":0,"ci":1,"tags":["spec-intent"],"k":"judge","kwhy":"能说明 Grill Me 的目标是达成共同理解","nameEn":"shared understanding","centrality":0.126,"stage":"when-needed","feynman":"共享理解就是双方对“要做什么、为什么这么做、哪些选择互相依赖”有同一张脑内地图。","evidence":["能说明 Grill Me 的目标是达成共同理解","能描述在设计树上逐步收敛的做法"],"ap":"{{name}} 在 Grill Me 里是怎么达成的？","origin":["context"],"mentionCount":1},{"id":"cm_a966ce15","name":"共享文件加锁的协调机制","src":"harness","type":"CONCEPTUAL","gloss":"所有 agent 地位平等，通过共享文件查看状态、认领任务、更新状态，用锁防抢。","level":3,"ci":2,"tags":["multi-agent"],"k":"use","kwhy":"能描述共享文件加锁的认领流程","nameEn":"","centrality":0.126,"stage":"now","feynman":"像一块公共白板加一支唯一的笔，谁写谁先拿笔。规则很简单，但只要有人拿了笔不还、或者拿着笔晕过去，整块白板就停摆。","evidence":["能描述共享文件加锁的认领流程","能指出该机制防止两个 agent 抢同一任务"],"ap":"{{name}} 如何避免两个 agent 抢同一个任务？","origin":["harness"],"mentionCount":1},{"id":"cm_75392c01","name":"护栏与判断力的取舍","src":"context","type":"CONCEPTUAL","gloss":"规则数量应是模型能力的函数：旧模型需显式护栏避免最坏情况，新模型判断力足够时可减少规则让位给判断。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能说明某条规则当初为防哪种最坏情况","nameEn":"guardrail tradeoff","centrality":0.126,"stage":"when-needed","feynman":"护栏是一笔交易——用\"在少数场景下做错\"换\"绝不出大事\"。当对方本事变强，这笔交易就不划算了，该退掉。","evidence":["能说明某条规则当初为防哪种最坏情况","能判断该规则在新模型上是否仍有必要"],"ap":"能否对某条规则说明 {{name}} 下该留还是该删？","origin":["context"],"mentionCount":1},{"id":"cm_68c53198","name":"缓存断点","src":"context","type":"CONCEPTUAL","gloss":"缓存从请求开头延伸到 利息一样越滚越多，而不是每次归零。","evidence":["能把一个重复工作流写成可复用技能","能说出手动斜杠触发与自动应用两种调用方式"],"ap":"把哪个重复工作流做成{{name}}后，下次能直接复用？","origin":["context"],"mentionCount":1},{"id":"cm_2733c0ea","name":"检索池 vs 引用","src":"notion","type":"CONCEPTUAL","gloss":"页面进入检索池不等于被引用，模型还要再筛选哪些内容值得写进最终回答。","level":1,"ci":0,"tags":["memory-retrieval"],"k":"judge","kwhy":"能引用约 15% 被引用、85% 从未被引用说明这一落差","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"AI 引用是两阶段 —— 先被检索到（进入候选池），再被模型选中作答。85% 进了池子也用不上。提升 AI 可见性 = 同时优化两关：进得去 + 配得上被引用。llms.txt 和 Markdown 路由有效的本质就是：给模型一个干净、明确的信号说明这个页面是什么。","evidence":["能引用约 15% 被引用、85% 从未被引用说明这一落差","能区分检索召回与引用选择是两个独立环节"],"ap":"{{name}} 的落差对评估检索系统意味着什么？","origin":["notion"],"mentionCount":1},{"id":"cm_5caaad9a","name":"检索器-阅读器配置","src":"context","type":"REPRESENTATIONAL","gloss":"开放域问答的标准架构：检索器取回前 k 篇文档，语言模型作为阅读器基于这些文档作答。","level":0,"ci":1,"tags":["memory-retrieval"],"k":"use","kwhy":"能画出 retriever-reader 两段式的数据流","nameEn":"retriever-reader","centrality":0.126,"stage":"when-needed","feynman":"一个负责找资料，一个负责答题。这项研究测的是：找回来的资料变多以后，答题的那个到底还能不能吃得下。","evidence":["能画出 retriever-reader 两段式的数据流","能用该配置设计更多上下文是否更好的对照实验"],"ap":"用 {{name}} 搭问答系统，检索器与阅读器各负责什么？","origin":["context"],"mentionCount":1},{"id":"cm_026f933a","name":"简洁规范","src":"neican","type":"REPRESENTATIONAL","gloss":"简短的项目规范文档，只回答为什么做、做什么、怎么做，用简短逼团队划清范围。","level":0,"ci":3,"tags":["spec-intent"],"k":"use","kwhy":"能写出不超过一页、含 why/what/how 的项目简报","nameEn":"","centrality":0.126,"stage":"now","feynman":"规范的价值在短，不在全。它只回答三个问题——为什么做、做什么、怎么做。作者把\"简洁\"当成强制划范围的手段：正因为写不下细节，团队才被迫把范围想清楚，进而排好优先级、避免做错东西。它是\"单一负责人\"的产物。","evidence":["能写出不超过一页、含 why/what/how 的项目简报","能指出简报写长会模糊工作范围与优先级"],"ap":"能否用 {{name}} 一页写清你手上项目的为什么、是什么、怎么做？","origin":["neican"],"mentionCount":1},{"id":"cm_67e2a43e","name":"局部最优","src":"context","type":"CONCEPTUAL","gloss":"承认所分享的模式只是自家迭代过程抵达的局部最优，而非普适真理。","level":0,"ci":1,"tags":["thinking-method"],"k":"judge","kwhy":"能说出该经验来自什么具体迭代过程与约束条件","nameEn":"local optima","centrality":0.126,"stage":"when-needed","feynman":" ","name":"判定程序化写法","src":"context","type":"PROCEDURAL","gloss":"把每条规则写成可执行的判定（明确判据＋已发生的失败示例），而非语气偏好，使规则可被机械执行。","level":1,"ci":1,"tags":["spec-intent"],"k":"use","kwhy":"能把一条语气式要求改写成含判据的判定语句","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"普通规范说\"要谨慎\"，这份文件说\"谨慎具体等于哪一步查什么、查到什么就停\"。前者靠执行者的悟性，后者把悟性外化成流程。写给 agent 的规则必须是后者，因为 agent 不会在半夜自己琢磨你的言外之意。","evidence":["能把一条语气式要求改写成含判据的判定语句","能为每条规则附上一个真实失败示例"],"ap":"把「回答要谨慎」改写为{{name}}式规则，判据是什么？","origin":["context"],"mentionCount":1},{"id":"cm_10f48272","name":"漂移与隧道视野","src":"harness","type":"CONCEPTUAL","gloss":"长时程自治中的两种典型退化：偏离原始目标的漂移，与只盯局部而丢失全局的隧道视野。","level":4,"ci":2,"tags":["loop-autonomy"],"k":"judge","kwhy":"能举出一次长任务中目标逐渐偏移的具体例子","nameEn":"drift & tunnel vision","centrality":0.126,"stage":"now","feynman":"跑得太久，agent 要么慢慢偏离原本的目标（漂移），要么钻进一个局部越挖越深、看不见全局（隧道视野）。两者都不会报错，只会安静地浪费掉几天算力。","evidence":["能举出一次长任务中目标逐渐偏移的具体例子","能解释周期性重启与角色分离分别针对哪一种退化"],"ap":"这个长跑任务目标跑偏了，属于{{name}}里的哪一种？","origin":["harness"],"mentionCount":1},{"id":"cm_2440f85e","name":"企业技能的最高优先级","src":"neican","type":"CONCEPTUAL","gloss":"同名技能并存时企业版生效，覆盖个人、项目与插件版本","level":2,"ci":3,"tags":["safety-governance"],"k":"judge","kwhy":"能指出企业技能在所有作用域中优先级最高","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"它解决的理解难点是\"同名技能谁说了算\"。答案是：当个人、项目、插件、企业各存在一份同名技能时，企业版生效，其余被覆盖。（原文只交代了企业技能对其他三类的覆盖，没有进一步说明这三者彼此之间的次序。）正因为有这条强制覆盖，企业托管才可能承载\"强制性标准\"——否则组织无法保证所有人跑的是同一套规则。","evidence":["能指出企业技能在所有作用域中优先级最高","能说明该强制覆盖是承载强制性标准的前提"],"ap":"{{name}}与同名的个人技能冲突时，结果如何？","origin":["neican"],"mentionCount":1},{"id":"cm_fb6ae85a","name":"前沿实验室","src":"notion","type":"CONCEPTUAL","gloss":"处在能力最前线的少数实验室（如 Anthropic 与 OpenAI），其长期真正的对手是开源模型。","level":2,"ci":0,"tags":["economy-business"],"k":"accept","kwhy":"能指认当下哪些实验室算前沿实验室","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"把模型推到能力边界的那一小撮实验室——主要是 **Anthropic** 和 **OpenAI**。它们的位置很特殊：","evidence":["能指认当下哪些实验室算前沿实验室","能解释为何长期竞争来自开源而非彼此"],"ap":"长期看，{{name}}真正的对手是谁？","origin":["notion"],"mentionCount":1},{"id":"cm_8bb611ea","name":"人在关键路径确认","src":"neican","type":"CONCEPTUAL","gloss":"人只在关键节点拍板：做不做、选哪个方案、交互是否友好。","level":1,"ci":3,"tags":["agent-org"],"k":"judge","kwhy":"能区分哪些节点需要人判断、哪些交给 Agent 执行","nameEn":"","centrality":0.126,"stage":"now","feynman":"人不是全程不参与，也不是全程亲手做；只在决定做不做、选哪个方向、交互是否友好、能不能用等关键节点拍板。它定义了人不可替代的判断力边界。","evidence":["能区分哪些节点需要人判断、哪些交给 Agent 执行","能说明人凭产品判断与技术直觉做最终决策，而不必研究每个技术细节"],"ap":"{{name}} 时人具体负责哪类决定？","origin":["neican"],"mentionCount":1},{"id":"cm_7675253d","name":"三层工程","src":"harness","type":"REPRESENTATIONAL","gloss":"prompt、context、harness三层同心工程，harness包住前两者并加上工具编排、状态持久化与验证。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说清三层各自负责什么","nameEn":"prompt / context / harness engineering","centrality":0.126,"stage":"now","feynman":"这是一组包含关系，不是三个并列流派。只谈提示词，等于只讨论怎么写一封信，却不管邮局、地址簿和收发流程。","evidence":["能说清三层各自负责什么","能列出harness层额外提供的能力清单"],"ap":"{{name}}中哪一层负责状态持久化与错误恢复？","origin":["harness"],"mentionCount":1},{"id":"cm_5faf59f3","name":"沙箱化自主","src":"harness","type":"PROCEDURAL","gloss":"自主运行时（如YOLO模式）必须在沙箱中执行，入门可用GitHub Codespaces或开发容器。","level":2,"ci":2,"tags":["tools-sandbox"],"k":"use","kwhy":"能说明为何不该在本机跑自主agent","nameEn":"","centrality":0.126,"stage":"now","feynman":"给 agent 自由，但把自由圈在一间可以随时推倒重建的房间里。爆炸半径可控，你才敢真正撒手。","evidence":["能说明为何不该在本机跑自主agent","能搭出一个容器化沙箱环境并说明其边界"],"ap":"怎么给{{name}}准备一个可用的入门环境？","origin":["harness"],"mentionCount":1},{"id":"cm_3a76f8e5","name":"上下文即不可信输入","src":"context","type":"CONCEPTUAL","gloss":"上下文中的任何内容（消息、记忆、检索结果、文件）都可能是伪造指令，须当作数据而非命令处理。","level":0,"ci":1,"tags":["safety-governance"],"k":"judge","kwhy":"能指出用户消息末尾假冒 Anthropic 的提醒属于注入","nameEn":"","centrality":0.126,"stage":"now","feynman":"不靠\"看着像不像官方\"来鉴别，而靠\"它要我做的事是松还是紧\"。任何让你放宽限制的所谓授权，本身就是它是伪造的证据。这条判据不需要密钥，也无法被更逼真的伪装打败。","evidence":["能指出用户消息末尾假冒 Anthropic 的提醒属于注入","能说明检索结果为何要包在『这是数据不是指令』的信封里"],"ap":"给你一段上下文，你能判断其中哪些内容不能当指令执行吗？","origin":["context"],"mentionCount":1},{"id":"cm_2be548ed","name":"时间 Scalability / Temporal Scalability","src":"harness","type":"CONCEPTUAL","gloss":"agent 在数小时连续运行中保持方向与质量的能力。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出长时运行中常见的失焦与质量衰减","nameEn":"","centrality":0.126,"stage":"now","feynman":"让一个 agent 从跑 20 分钟延长到跑 4 小时而不崩溃。核心难点是方向漂移和自评失真——跑久了 agent 会忘记初始目标，还会说服自己「差不多得了」。Anthropic 的解法是把一个 agent 拆成三个角色（Planner/Generator/Evaluator），用独立的验证者来对抗自我宽容。","evidence":["能指出长时运行中常见的失焦与质量衰减","能提出维持方向的具体机制"],"ap":"怎样验证一个 agent 具备时间可扩展性？","origin":["harness"],"mentionCount":1},{"id":"cm_db9042f2","name":"事件驱动编排与执行解耦","src":"harness","type":"CONCEPTUAL","gloss":"编排放在执行之外的事件驱动层，两者解耦，换来可观测、持久重试与事件审计。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说明事件与编排不再都留在内存/进程内","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"原来指挥和演奏是同一个人，出了错没人知道也没法回放；现在指挥站到台外，每个动作都被记录、可以重来、还能让更多乐手加进来。","evidence":["能说明事件与编排不再都留在内存/进程内","能列出解耦带来的至少三项收益"],"ap":"{{name}} 解耦了哪两层，换来什么？","origin":["harness"],"mentionCount":1},{"id":"cm_c3a45aa3","name":"事件驱动的自动化","src":"context","type":"CONCEPTUAL","gloss":"事件驱动的自动化：issue 进入系统那一刻即触发 agent 工作流，即时精炼或行动。","level":1,"ci":1,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出触发时机是“到达那一刻”而非定时批处理","nameEn":"Automations","centrality":0.126,"stage":"when-needed","feynman":"不用等人有空来处理，事情一发生就自动开跑。新问题一进来，系统立刻去归类、去查重、去补充关联信息，甚至直接动手。把\"人来了才处理\"变成\"事一来就处理\"，等待时间被压到接近零。","evidence":["能说出触发时机是“到达那一刻”而非定时批处理","能举出一个事件触发工作流的实例"],"ap":"{{name}} 用什么时机触发 agent 工作流？","origin":["context"],"mentionCount":1},{"id":"cm_18997927","name":"数据中心","src":"notion","type":"CONCEPTUAL","gloss":"AI 的物理基础设施：装满联网计算机的大仓库，吃电、吃水冷却、占地。","level":0,"ci":0,"tags":["geo-infrastructure"],"k":"accept","kwhy":"能说出数据中心耗电、耗水、占地三项特征","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"","evidence":["能说出数据中心耗电、耗水、占地三项特征","能把“AI 烧水”话题对应回数据中心"],"ap":"{{name}} 由什么构成、消耗什么？","origin":["notion"],"mentionCount":1},{"id":"cm_058c8106","name":"四类故障分类框架","src":"neican","type":"CONCEPTUAL","gloss":"把技能故障归为四类：无法触发、无法加载、存在冲突、运行时失败。","level":2,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy": 环状态落在 git 中获得显式持久性，从而支持系统重启后的崩溃恢复。","level":1,"ci":2,"tags":["state-persistence"],"k":"use","kwhy":"能对比 git-backed state 与假设终端常开的差别","nameEn":"","centrality":0.126,"stage":"when-needed","feynman":"loop 要长期运行，就不能只靠当前窗口里的记忆。把状态存进 git，就像每一步都留下可恢复的存档。","evidence":["能对比 git-backed state 与假设终端常开的差别","能设计一次崩溃后的状态恢复流程"],"ap":"{{name}} 如何支撑崩溃恢复？","origin":["harness"],"mentionCount":1},{"id":"cm_14ba4d5c","name":"harness 的过时假设","src":"harness","type":"CONCEPTUAL","gloss":"harness 编码的是“Claude 做不到什么”的假设，模型变强后这些假设会陈旧，反过来成为性能瓶颈。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能举出一个因模型变强而失效的 harness 假设","nameEn":"","centrality":0.126,"stage":"now","feynman":"你给新人写的防呆手册，写的是他刚入职时的短板。人成长了，手册没改，手册本身就成了绊脚石。","evidence":["能举出一个因模型变强而失效的 harness 假设","能解释陈旧假设为何会 bottleneck 表现"],"ap":"{{name}} 为什么会随模型变强而变成瓶颈？","origin":["harness"],"mentionCount":1},{"id":"cm_3e211f91","name":"harness 厚薄","src":"harness","type":"CONCEPTUAL","gloss":"架构决策：多少逻辑住在 harness、多少留给模型；Anthropic 押薄 harness，图式框架押显式控制。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出薄与厚 harness 各自押注的前提","nameEn":"thin vs thick","centrality":0.126,"stage":"now","feynman":"这是一场关于「信任模型到什么程度」的赌注。押模型会变强，就少写代码；押要可控，就把流程钉死在代码里。押错了要么脆弱，要么臃肿。","evidence":["能说出薄与厚 harness 各自押注的前提","能举出混合路线的代表做法"],"ap":"{{name}} 这个决策要权衡的两端分别是什么？","origin":["harness"],"mentionCount":1},{"id":"cm_7fdc01a5","name":"Harness level feature","src":"harness","type":"CONCEPTUAL","gloss":"模型开箱做不到、必须由 harness 提供的能力：跨交互持久状态、执行代码、访问实时知识、搭环境装依赖。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能完整列出四项框架级能力","nameEn":"","centrality":0.126,"stage":"now","feynman":"一个判断归属的分诊标准。遇到 agent 做不到的事，先问它属于「模型不够聪明」还是「没人给它这个能力」。绝大多数看起来像智力问题的失败，其实是第二类——那就不该等模型升级，而该动手改框架。","evidence":["能完整列出四项框架级能力","能判断某项能力是否属于框架级"],"ap":"{{name}} 包含哪四项，各自为什么模型开箱做不到？","origin":["harness"],"mentionCount":1},{"id":"cm_a5b42ae5","name":"harness–compute separation","src":"harness","type":"CONCEPTUAL","gloss":"把 Agent 骨架与执行计算的沙箱环境分离，使模型生成的代码触不到凭证等敏感信息。","level" in":["notion","harness"],"mentionCount":3},{"id":"cm_a72ef18d","name":"工具","src":"multi","type":"CONCEPTUAL","gloss":"Agent 的『双手』：它得以对外部世界施加动作的调用能力。","level":1,"ci":4,"tags":["tools-sandbox"],"k":"use","kwhy":"能为一个 Agent 列出它必须具备的工具清单","nameEn":"Tools","centrality":0.107,"stage":"now","feynman":"工具是模型触达外部世界的手。Harness 把工具用名称、描述和参数结构暴露给模型，并负责校验、执行、捕获结果和返回观察。","evidence":["能为一个 Agent 列出它必须具备的工具清单","能说明每个工具的输入输出与失败模式"],"ap":"这个 Agent 需要哪些 {{name}}，缺了哪个就跑不动？","origin":["context","harness"],"mentionCount":3},{"id":"cm_ac2e95b3","name":"瓶颈转移到代码两侧","src":"neican","type":"CONCEPTUAL","gloss":"编码已不是瓶颈，瓶颈移到设计确认与测试验证部署两侧。","level":1,"ci":3,"tags":["agent-org"],"k":"judge","kwhy":"能分别说出左侧与右侧瓶颈的内容","nameEn":"","centrality":0.107,"stage":"now","feynman":"编码被 Agent 加速后，不再是拖慢流程的中心。真正慢的是编码前的设计确认和编码后的测试验证部署。它是全文重新分配注意力的框架，也解释为什么重点谈可行性、原型和测试。","evidence":["能分别说出左侧与右侧瓶颈的内容","能指出这些环节仍以人类速度运行"],"ap":"{{name}} 之后，注意力应该重新放在哪里？","origin":["neican"],"mentionCount":3},{"id":"cm_5a687800","name":"请求驱动与事件驱动","src":"neican","type":"CONCEPTUAL","gloss":"Skills 由请求内容激活，Hooks 由文件保存、工具调用等事件触发。","level":2,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能区分请求驱动与事件驱动的触发条件","nameEn":"","centrality":0.107,"stage":"when-needed","feynman":"这一对概念讲的是“什么导致功能被激活”。Skills 由请求内容匹配触发；Hooks 由文件保存、工具调用等事件触发。因此，影响 Claude 如何处理请求的知识适合做成 skill，而每次保存都要执行的操作、工具调用前的验证适合做成 hook。它决定了自动化的边界在哪里。","evidence":["能区分请求驱动与事件驱动的触发条件","能判断某自动化该做成 skill 还是 hook"],"ap":"{{name}} 讲的是什么被激活的方式？各自举例。","origin":["neican"],"mentionCount":3},{"id":"cm_4b8163f5","name":"压缩","src":"multi","type":"PROCEDURAL","gloss":"对对话或观察做压缩凝聚的机制：压得太狠会凝成『自信但错误』的理论，压不动则停在分散的可能性里。","level":0,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能说明 compaction 与滚动截断的区别","nameEn":"Compaction","centrality":0.107,"stage":"when-needed","feynman":"把一堆零散观察提炼成一个紧凑、可执行的解释。「压缩不了」= 假设满天飞但不收敛；「压缩错了」= 收敛到一个自信却错误的理论。智能的关键不是观察多，而是能不能把观察压成一句「事情其实是这样的」。","evidence":["能说明 compaction 与滚动截断的区别","能识别压缩过度产生的『自信但错误』的理论"],"ap":"接近窗口上限时，{{name}} 该保留什么、丢掉什么？","origin":["notion","context","harness"],"mentionCount":3},{"id":"cm_cbbe3f8e","name":"亚稳态故障与 LIFO/FIFO 连接重用","src":"neican","type":"CONCEPTUAL","gloss":"压力消失后进程仍卡在降级状态；aiohttp 默认 LIFO 重用连接，把流量越推越集中在慢 Pod 上。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能描述过载 Pod 接收请求越来越多、直到重启才恢复的失控降级现象","nameEn":"","centrality":0.107,"stage":"when-needed","feynman":"亚稳态故障是指外部触发压力消失后，系统仍卡在坏状态。这里，慢 Pod 最后才把连接归还连接池，而 LIFO 又优先重用最近归还的连接，于是后续请求更频繁地打向慢 Pod，流量越来越集中。FIFO 打破这个正反馈，使连接和工作负载更公平地分配。它是理解连接池为什么会影响尾部延迟和稳定性的机制边界。","evidence":["能描述过载 Pod 接收请求越来越多、直到重启才恢复的失控降级现象","能解释 LIFO 更频繁复用慢服务器归还的连接、改成 FIFO 可打破该正反馈"],"ap":"{{name}} 是怎样把流量越推越集中到慢 Pod 的？","origin":["neican"],"mentionCount":3},{"id":"cm_6c8463ad","name":"约束型 API 与成本不平衡","src":"neican","type":"CONCEPTUAL","gloss":"不开放任意 SQL，用简单 NoSQL API 让请求成本可预测，避免写得便宜、跑得昂贵的失衡。","level":1,"ci":3,"tags":["caching-cost"],"k":"judge","kwhy":"能解释“写 SQL 便宜、跑 SQL 昂贵”的成本不平衡","nameEn":"","centrality":0.107,"stage":"when-needed","feynman":"写一条 SQL 查询很便宜，但让它高效运行可能很贵；一条热路径上的昂贵查询就可能拖垮数据库。Habitat 不开放任意 SQL，而提供简单 NoSQL API，使请求成本可预测、工作量恒定。这个约束是 Python 服务能扩展到很大规模的原因之一，也是 Habitat 设计中的明确取舍。","evidence":["能解释“写 SQL 便宜、跑 SQL 昂贵”的成本不平衡","能说明约束型 API 为何是 Python 服务能扩到很大规模的原因之一"],"ap":"{{name}} 如何把昂贵查询在客户端变得显而易见？","origin":["neican"],"mentionCount":3},{"id":"cm_db455b2f","name":"运行时失败的三类原因","src":"neican","type":"CONCEPTUAL","gloss":"运行时失败查三类：缺外部依赖、脚本无执行权限、路径未统一用正斜杠。","level":1,"ci":3,"tags":["tools-sandbox"],"k":"judge","kwhy":"能列出三类原因并对应修复动作","nameEn":"","centrality":0.107,"stage":"when-needed","feynman":"技能能加载、却在执行过程中失败时，主要查三件事：外部软件包是否已安装（并把依赖信息写进描述，让 Claude 知道需要什么）；脚本是否有执行权限（对引用的脚本 `chmod +x`）；路径是否统一用正斜杠（即使在 Windows 上也不用反斜杠）。这三条划定了\"运行时失败\"的排查边界。","evidence":["能列出三类原因并对应修复动作","能对给定执行失败现象指出该查哪一类"],"ap":"技能能加载却执行失败，按 {{name}} 该查哪三件事？","origin":["neican"],"mentionCount":3},{"id":"cm_01671cb1","name":"Ralph Loop","src":"harness","type":"PROCEDURAL","gloss":"一种 harness 模式：用 hook 拦截模型退出企图，在干净上下文中重注入原始 prompt，逼 Agent 继续。","level":2,"ci":2,"tags":["loop-autonomy"],"k":"use","kwhy":"能说明它靠文件系统承接跨迭代的状态","nameEn":"","centrality":0.107,"stage":"deep-dive","feynman":"模型想收工时，框架把它叫回来，递上同一份任务书和一张干净的桌子，说「接着干」。它把「长时间工作」拆成了许多次短时间工作，靠磁盘上的状态接力——连贯性不来自记忆，来自留在外部的痕迹。","evidence":["能说明它靠文件系统承接跨迭代的状态","能实现一次 prompt 重注入的单 agent 长任务循环"],"ap":"{{name}} 为什么能跑很久？靠什么记住上一轮？","origin":["harness"],"mentionCount":3},{"id":"cm_a5573df7","name":"SKILL.md 与前置信息","src":"neican","type":"REPRESENTATIONAL","gloss":"SKILL.md 上为前置信息（名称、描述），下为任务说明，如审阅清单或格式偏好。","level":0,"ci":3,"tags":["harness-runtime"],"k":"use","kwhy":"能写出含名称与描述的前置信息示例","nameEn":"","centrality":0.107,"stage":"now","feynman":"SKILL.md 是技能的文件形态。它上面有前置信息，至少包含名称和描述；下面是真正的任务说明，比如审阅清单或格式偏好。这个结构很重要，因为 Claude 一开始只用前置信息来发现和匹配技能，不必先加载完整正文。","evidence":["能写出含名称与描述的前置信息示例","能指出 Claude 起初只用前置信息发现技能"],"ap":"{{name}} 中前置信息下方应该写什么内容？","origin":["neican"],"mentionCount":3},{"id":"cm_a63808b6","name":"按需加载与始终加载","src":"neican","type":"CONCEPTUAL","gloss":"CLAUDE.md 每条对话都加载，适合作通用标准；Skills 按需加载，适合作特定任务知识。","level":2,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能判断一条内容该放 CLAUDE.md 还是 skill","nameEn":"","centrality":0.089,"stage":"now","feynman":"这一对概念讲的是内容什么时候进入上下文。始终加载适用于任何请求都必须遵守的标准；按需加载适用于只在某些情况下才相关的知识。PR 审查清单在写新代码时不需要占用上下文，所以适合放进 skill；TypeScript 严格模式则适合放进 CLAUDE.md。它是判断某个内容该放哪里的边界规则。","evidence":["能判断一条内容该放 CLAUDE.md 还是 skill","能举出 PR 审查清单与严格模式的分工例子"],"ap":"给定一条内容，按 {{name}} 该放 CLAUDE.md 还是 skill？","origin":["neican"],"mentionCount":2},{"id":"cm_629e8fdc","name":"编排循环","src":"multi","type":"PROCEDURAL","gloss":"以“思考—行动—观察”为一轮，把模型输出变成可重复推进的任务循环。","level":1,"ci":4,"tags":["loop-autonomy"],"k":"use","kwhy":"能画出一次 TAO 循环的完整状态流转","nameEn":"Orchestration Loop / TAO / ReAct","centrality":0.089,"stage":"now","feynman":"编排循环是 Agent 的节拍器。模型先推理，Harness 执行动作，再把结果作为观察反馈给模型；这个循环不断重复，直到任务结束。","evidence":["能画出一次 TAO 循环的完整状态流转","能说明观察结果如何回灌进下一轮思考"],"ap":"用 {{name}} 走一遍：从用户请求到完成，每一步分别是什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_3ff5d50f","name":"插件技能缺失","src":"neican","type":"PROCEDURAL","gloss":"插件技能不显示时：清缓存、重启 Claude Code、重装，仍无则判为插件结构问题。","level":1,"ci":3,"tags":["harness-runtime"],"k":"use","kwhy":"能按顺序说出清缓存、重启、重装三步","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"插件装了却看不到它的技能，是一条独立的排查支线，修复有固定顺序——先清缓存、重启 Claude Code、再重新安装；如果仍不出现，就判断为插件结构问题，此时交给验证器工具处理。\n\n## 二、概念架构图\n\n```mermaid\ngraph TD\n    subgraph L1[手段层：先行的诊断工具]\n        V[技能验证器<br/>agent skills verifier]\n        D[claude --debug]\n    end\n\n    subgraph L2[框架层：故障分类]\n        F[四类故障]\n    end\n\n    subgraph L3[机制层：各类故障的成因与修复]\n        M1[语义匹配 → 触发短语]\n        M2[SKILL.md 结构性要求]\n        M3[描述区分度]\n        M4[技能优先级层级结构]\n        M5[运行时失败三类原因]\n        M6[插件技能缺失]\n    end\n\n    V -->|先捕获结构性问题| F\n    F -->|分解为\"无法触发\"| M1\n    F -->|分解为\"无法加载\"| M2\n    F -->|分解为\"使用了错误的技能\"| M3\n    F -->|分解为\"个人技能被遮蔽\"| M4\n    F -->|分解为\"运行时失败\"| M5\n    F -->|分解为\"插件技能缺失\"| M6\n    D -->|诊断加载错误| M2\n    V -->|排查插件结构| M6\n```","evidence":["能按顺序说出清缓存、重启、重装三步","能说明仍不出现时交给验证器工具处理"],"ap":"{{name}} 的修复顺序是什么？最后交给谁？","origin":["neican"],"mentionCount":2},{"id":"cm_fccba9a9","name":"对象-边模型与分区","src":"neican","type":"CONCEPTUAL","gloss":"客户端预定义对象与边、只查直接边、不支持图遍历的 NoSQL 模型，对象与其边同分区存储。","level":0,"ci":3,"tags":["state-persistence"],"k":"judge","kwhy":"能说出对象与边放在同一分区、远程对象不保证同区","nameEn":"","centrality":0.089,"stage":"deep-dive","feynman":"Habitat 的数据模型像图：客户端预先定义对象和边，但只能查某个对象的直接边，不支持典型图遍历。分区时，每个对象和它的边放在同一存储分区，便于水平扩展；但不保证远程对象也同区，所以跨对象跳转可能跨区域，图遍历效率低。这解释了约束 API 的边界在哪里。","evidence":["能说出对象与边放在同一分区、远程对象不保证同区","能指出不支持典型图遍历查询带来的效率边界"],"ap":"{{name}} 为什么让跨对象跳转可能变成跨区域操作？","origin":["neican"],"mentionCount":2},{"id":"cm_857d56ba","name":"分解为小颗粒度工作","src":"neican","type":"PROCEDURAL","gloss":"把大任务切成小颗粒，每部分建一个问题，小改动既带来完成感也便于审查。","level":0,"ci":3,"tags":["code-engineering"],"k":"use","kwhy":"能把一个大任务拆成每周可完成数个的问题列表","nameEn":"","centrality":0.089,"stage":"now","feynman":"把大任务切小，有两个作用：一是让人看得见进展、获得完成感、维持动力；二是让审查变容易——小任务对应小 diff，小改动好审。作者用\"查看差异\"作为判断完成的最直接办法，反过来要求改动别太大。这条机制同时服务于动力和可审查性。","evidence":["能把一个大任务拆成每周可完成数个的问题列表","能用代码或设计文件的差异判断任务是否完成"],"ap":"按 {{name}}，你手上这个大任务能拆出几个一周内可完成的问题？","origin":["neican"],"mentionCount":2},{"id":"cm_ef696870","name":"高精度原型设计","src":"neican","type":"PROCEDURAL","gloss":"把需求、原型、UI 合成一步，产出含交互与视觉的高保真原型。","level":1,"ci":3,"tags":["spec-intent"],"k":"use","kwhy":"能把需求、原型、UI 三个环节合并为一次高精度原型设计","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"把需求、原型、UI 设计合成一步，产出接近成品、包含交互和视觉的高保真原型。AI 把过去成本极高的事变快。它让确认环节可以合并，也让修改发生在低成本阶段。","evidence":["能把需求、原型、UI 三个环节合并为一次高精度原型设计","能说明确认应发生在修改成本低的原型阶段"],"ap":"{{name}} 把原来的哪几个步骤合并了？","origin":["neican"],"mentionCount":2},{"id":"cm_ca26306b","name":"古德哈特定律","src":"multi","type":"CONCEPTUAL","gloss":"当指标成为目标它就不再是好指标；Agent 会针对验证器优化而非真实目标，比如删掉失败测试。","level":0,"ci":4,"tags":["verification-eval"],"k":"judge","kwhy":"能举出 Agent 绕过验证的具体手法","nameEn":"","centrality":0.089,"stage":"now","feynman":"你考什么，系统就会只优化什么。如果考核设计得不好，AI 会很快找到钻空子的办法。","evidence":["能举出 Agent 绕过验证的具体手法","能设计一个不易被针对性优化的验收标准"],"ap":"怎么判断 {{name}} 正在发生，而不只是模型做错了？","origin":["context","harness"],"mentionCount":2},{"id":"cm_5b033c9f","name":"管理 Agent","src":"multi","type":"CONCEPTUAL","gloss":"Loop Engineering 的核心竞争力在管理而非纯工程：目标清晰、资源充足、反馈及时，也是好 loop 的条件。","level":0,"ci":4,"tags":["agent-org"],"k":"judge","kwhy":"能把管理动作映射成 loop 的具体配置","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"管 AI 很像带团队。你不能只说“做好一点”，要说清楚做成什么样、有什么工具、怎么验收。","evidence":["能把管理动作映射成 loop 的具体配置","能诊断一个 loop 失败是管理问题还是工程问题"],"ap":"如果把 Agent 当团队带，{{name}} 每天要做哪几件事？","origin":["context","harness"],"mentionCount":2},{"id":"cm_69fd0c3c","name":"基准测试的捆绑测量性","src":"multi","type":"CONCEPTUAL","gloss":"基准很少单独测量模型，它同时测了 API 设置、harness 设计与提示词等不可见选择。","level":0,"ci":4,"tags":["verification-eval"],"k":"judge","kwhy":"能指出某次跑分里除模型以外的变量","nameEn":"","centrality":0.089,"stage":"now","feynman":"你以为分数是模型的体检报告，其实它是模型加上一整套工程默认值的联考成绩。想从分数里读出模型能力，必须先知道监考规则；否则你比较的可能只是两套脚手架。","evidence":["能指出某次跑分里除模型以外的变量","能设计一个区分模型能力与 harness 贡献的对照"],"ap":"同一个模型分数不同，{{name}} 提醒我们还要问什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_622b0b3b","name":"即时检索","src":"multi","type":"PROCEDURAL","gloss":"上下文里只保留轻量级标识符（路径、ID、链接），需要时再取全文，而不是把内容全塞进去。","level":0,"ci":4,"tags":["memory-retrieval"],"k":"use","kwhy":"能为一批内容设计标识符命名规则","nameEn":"Just-in-time Retrieval","centrality":0.089,"stage":"when-needed","feynman":"即时检索把上下文窗口当作缓存，而不是仓库。Harness 只放必要线索，等模型真正需要时再加载具体内容。","evidence":["能为一批内容设计标识符命名规则","能说明何时从标识符按需取回内容"],"ap":"上下文里只放标识符时，{{name}} 靠什么把需要的内容取回来？","origin":["context","harness"],"mentionCount":2},{"id":"cm_ba882963","name":"记忆即提示","src":"multi","type":"CONCEPTUAL","gloss":"把记忆当作一种提示来管理：写入什么、何时注入上下文，都由提示工程的原则决定。","level":0,"ci":4,"tags":["memory-retrieval"],"k":"judge","kwhy":"能把一条记忆改写成可直接注入的提示片段","nameEn":"Memory as Prompt","centrality":0.089,"stage":"when-needed","feynman":"记忆不是事实本身，而是给模型的线索。Agent 不能盲信记忆，行动前仍要用当前环境验证它是否还成立。","evidence":["能把一条记忆改写成可直接注入的提示片段","能判断哪些记忆值得写入、哪些是噪音"],"ap":"既然 {{name}}，这条记录该怎么写才在被取回时管用？","origin":["context","harness"],"mentionCount":2},{"id":"cm_ae03bb56","name":"技能描述","src":"neican","type":"CONCEPTUAL","gloss":"技能描述是 Claude 判断是否使用该技能的依据，请求与描述匹配后激活。","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能解释 Claude 把请求与所有可用技能描述逐一比较","nameEn":"","centrality":0.089,"stage":"now","feynman":"技能描述不是技能正文，而是让 Claude 判断“这个请求该不该用这个技能”的匹配依据。用户发出请求后，Claude 把请求与可用技能描述比较，匹配成功才激活技能。没有清楚描述，自动匹配就无法可靠发生。","evidence":["能解释 Claude 把请求与所有可用技能描述逐一比较","能写出一条让 Claude 可靠匹配的描述"],"ap":"{{name}} 对技能能否被自动匹配起什么作用？","origin":["neican"],"mentionCount":2},{"id":"cm_43781275","name":"技能优先级层级结构","src":"neican","type":"CONCEPTUAL","gloss":"技能按来源分层，企业级高于个人、项目和插件，同名时高优先级者每次胜出。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出同名撞车时高优先级技能每次胜出","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"技能按来源分层，企业级高于个人、项目和插件。当同名技能撞车时，高优先级的那个每次都赢，于是你的个人技能会被\"遮蔽\"而看似失效。对应的选择通常是给技能改成更具区分度的名字（作者认为这通常更简单）。","evidence":["能说出同名撞车时高优先级技能每次胜出","能给出把技能改成更具区分度名字的做法"],"ap":"个人技能被忽略时，{{name}} 如何解释？怎么办？","origin":["neican"],"mentionCount":2},{"id":"cm_40b450ca","name":"脚本执行","src":"neican","type":"CONCEPTUAL","gloss":"脚本不必读入上下文即可运行，只有输出消耗 token，SKILL.md 应写'运行脚本'","level":0,"ci":3,"tags":["caching-cost"],"k":"judge","kwhy":"能区分'运行脚本'与'读取脚本'两类指令","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"脚本是\"运行\"的对象，不是\"阅读\"的对象：它不必被读进上下文就能执行，执行完只有输出消耗令牌。因此 SKILL.md 里的写法关键是让克劳德去运行脚本，而不是去读取脚本内容。边界在于——省掉的是脚本正文进入上下文，而不是省掉脚本本身。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TD\n  subgraph L1[\"触发层｜决定技能是否被选中\"]\n    N[\"name（必填）<br/>小写字母·数字·连字符，≤64 字符\"]\n    D[\"description（必填）<br/>≤1024 字符\"]\n    M[\"匹配：克劳德据此判断请求是否相关\"]\n    DN[\"技能目录名\"]\n  end\n  subgraph L2[\"激活层｜技能被激活\"]\n    ACT[\"技能激活\"]\n  end\n  subgraph L3[\"边界层｜激活时生效的限制\"]\n    AT[\"allowed-tools 白名单\"]\n    LIM[\"白名单内免请求许可；不能编辑/写入\"]\n    PERM[\"不限制：正常权限模型\"]\n    CTX[\"共享上下文窗口：SKILL.md 内容被载入\"]\n  end\n  subgraph L4[\"管理层｜控制上下文占用\"]\n    PD[\"逐步披露：SKILL.md ≤500 行\"]\n    SF[\"支持文件：只在需要时才读\"]\n    SC[\"脚本执行：内容不入上下文\"]\n    OUT[\"只有输出消耗令牌\"]\n  end\n  N -->|须与目录名一致| DN\n  D --> M --> ACT\n  ACT -->|限制生效| AT --> LIM\n  AT -.->|完全省略| PERM\n  ACT -->|载入 SKILL.md| CTX\n  CTX -->|为省上下文| PD\n  CTX -->|同一目的| SC\n  PD -->|链接 + 说明何时加载| SF\n  SC --> OUT\n```","evidence":["能区分'运行脚本'与'读取脚本'两类指令","能说明省下的是脚本正文入上下文，不是脚本本身"],"ap":"{{name}}会把脚本正文塞进上下文吗？什么才消耗 token？","origin":["neican"],"mentionCount":2},{"id":"cm_c2dd0286","name":"连接器","src":"multi","type":"CONCEPTUAL","gloss":"MCP、GitHub、飞书、数据库等外部接口，让 Agent 接入真实工作环境，形成发现—修改—通知的闭环。","level":0,"ci":4,"tags":["tools-sandbox"],"k":"use","kwhy":"能为一个任务配齐所需的连接器","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"连接器就是 AI 的手和眼睛。没有它，AI 只能在本地文件里想办法；有了它，AI 才能去真实系统里查、改、提交和反馈。","evidence":["能为一个任务配齐所需的连接器","能画出从发现问题到通知人的完整链路"],"ap":"要让这个 loop 闭环，{{name}} 里至少得接上哪几个系统？","origin":["context","harness"],"mentionCount":2},{"id":"cm_f8c2e9ae","name":"连接扇入","src":"neican","type":"CONCEPTUAL","gloss":"Python 进程增多导致连接暴涨压垮下游；用 Envoy 升 HTTP/2、连接池与长连接收拢扇入。","level":1,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出进程规模扩大容易形成“雷霆之群”，压垮下游依赖项","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"为了降低 asyncio 延迟，Habitat 增加了很多 Python 进程，但进程一多，连接数会暴涨，容易形成雷霆之群，压垮下游依赖或 NAT 网关。Envoy 把 HTTP/1 连接升级为 HTTP/2，利用多路复用、连接池和更长连接寿命，把相同请求合并到更少连接上，并集中实现限流和熔断。它保护下游，也支撑了 Python 服务的大规模进程模型。","evidence":["能说出进程规模扩大容易形成“雷霆之群”，压垮下游依赖项","能说明 Envoy 把 HTTP/1 升级为 HTTP/2 以多路复用、池化并延长连接寿命，集中做限流与熔断"],"ap":"{{name}} 解决的是多进程模型带来的什么问题？","origin":["neican"],"mentionCount":2},{"id":"cm_4b769318","name":"名称与描述","src":"neican","type":"CONCEPTUAL","gloss":"名称是技能标识，描述是匹配条件；请求先与描述做语义匹配，允许意图重叠","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能说出请求匹配的是描述而非整份 SKILL.md","nameEn":"name / description","centrality":0.089,"stage":"now","feynman":"名称和描述不是同一类东西。名称是技能的身份标识，用来在列表、冲突优先级里识别技能。描述是匹配条件，告诉 Claude 什么时候该使用这个技能。用户请求不是直接匹配完整技能内容，而是先匹配描述，而且匹配是语义上的，允许意图重叠。所以描述写的是使用场景，不是技能内容摘要。这个区分是本文匹配机制的核心。","evidence":["能说出请求匹配的是描述而非整份 SKILL.md","能举例'解释这个函数'命中'用图表解释代码'因意图重叠"],"ap":"{{name}}分别解决什么问题？请求匹配的到底是哪一个？","origin":["neican"],"mentionCount":2},{"id":"cm_e243f570","name":"目标—项目—日常工作的连接","src":"neican","type":"CONCEPTUAL","gloss":"把日常工作通过项目挂到更大目标上，启动会审目标日期，排周期计划时回看项目。","level":1,"ci":3,"tags":["agent-org"],"k":"use","kwhy":"能画出目标→项目→日常工作的挂接关系","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"这是把\"远大目标\"和\"今天在干什么\"缝在一起的结构。目标是方向，项目是抓手，日常工作通过项目挂到目标上——而不是各自漂浮。作者还给出操作点：启动会上审目标日期、排周期计划时回看项目。承重之处在于它回答了\"怎么保证琐碎工作不偏离长期方向\"。","evidence":["能画出目标→项目→日常工作的挂接关系","能在项目启动会上说出该项目对应的目标与目标日期"],"ap":"你今天做的哪几件事挂在 {{name}} 的哪个目标上？","origin":["neican"],"mentionCount":2},{"id":"cm_4eb02f12","name":"内置代理与自定义子代理的技能访问边界","src":"neican","type":"CONCEPTUAL","gloss":"内置代理（Explorer、Plan、Verify）无法访问技能，只有 .claude/agents 中明确列出技能的自定义子代理可用。","level":1,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出 Explorer、Plan、Verify 内置代理对技能是完全无法访问","nameEn":"","centrality":0.089,"stage":"now","feynman":"内置代理（Explorer、Plan、Verify）对技能是\"完全无法访问\"，这是一道靠配置打不开的硬边界；有资格使用技能的只有写在 `.claude/agents` 里的自定义子代理，而且还得满足\"明确列出\"这个条件。这条边界决定了\"给代理配技能\"这件事的有效范围：不是给任意代理加配置，而是专门走自定义子代理这条路。","evidence":["能指出 Explorer、Plan、Verify 内置代理对技能是完全无法访问","能说明自定义子代理还须满足“明确列出技能”这一条件"],"ap":"按 {{name}}，哪些代理能用技能？还要满足什么条件？","origin":["neican"],"mentionCount":2},{"id":"cm_80dfaf37","name":"匹配后的确认与完整加载","src":"neican","type":"CONCEPTUAL","gloss":"匹配成功后先弹出确认，确认后才读取整个 SKILL.md 并执行其中指令","level":2,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能指出确认前完整技能内容尚未进入上下文","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"语义匹配成功不等于立即执行。Claude 会先要求确认；确认前，完整技能内容还没有进入上下文。确认后，整个 SKILL.md 才被读取，里面的指令才被执行。这个确认提示是加载机制的边界：用户能知道 Claude 将要获取哪些技能内容。","evidence":["能指出确认前完整技能内容尚未进入上下文","能说明确认提示让用户知道将要获取哪些上下文"],"ap":"{{name}}发生之前，完整技能内容是否已进入上下文？","origin":["neican"],"mentionCount":2},{"id":"cm_28c258d9","name":"启动时仅加载名称和描述","src":"neican","type":"CONCEPTUAL","gloss":"Claude Code 启动时扫描技能位置，只加载名称与描述，不载入 SKILL.md 全文","level":1,"ci":3,"tags":["context-engineering"],"k":"accept","kwhy":"能说明启动阶段不加载完整技能内容","nameEn":"","centrality":0.089,"stage":"now","feynman":"Claude Code 启动时会扫描技能所在位置，但只把技能名称和描述放进可用列表，不把每个 SKILL.md 的完整说明塞进上下文。完整说明要等某个请求匹配到技能后才可能加载。因此启动阶段很轻，匹配阶段依赖描述。这个设计也解释了为什么技能文件改动后需要重启才生效。","evidence":["能说明启动阶段不加载完整技能内容","能解释技能改动为何需重启才生效"],"ap":"启动时 {{name}} 的内容进了上下文吗？为什么？","origin":["neican"],"mentionCount":2},{"id":"cm_3cd29e1b","name":"上下文占用率与性能衰减","src":"multi","type":"CONCEPTUAL","gloss":"上下文窗口越满，模型性能越容易被轻微拖累；压缩通过腾出空间缓解这一衰减。","level":1,"ci":4,"tags":["context-engineering"],"k":"judge","kwhy":"能说明滚动截断为何让模型长期运行在更满的窗口下","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"上下文窗口不是装满了才算用好，越满往往越迟钝。给模型留出余量，本身就是一种性能优化。","evidence":["能说明滚动截断为何让模型长期运行在更满的窗口下","能解释 compaction 为何同时缓解性能衰减"],"ap":"为什么说 {{name}} 是压缩上下文带来的一项附带收益？","origin":["context","harness"],"mentionCount":2},{"id":"cm_8897d219","name":"通用 harness 的公平性张力","src":"multi","type":"CONCEPTUAL","gloss":"通用 harness 让模型对比更公平、缺陷更可见，但也让评测偏离真实部署形态。","level":1,"ci":4,"tags":["verification-eval"],"k":"judge","kwhy":"能复述 ARC 采用通用 harness 的理由","nameEn":"","centrality":0.089,"stage":"deep-dive","feynman":"统一考场对所有考生一视同仁，却也剥夺了每个人惯用的工具。公平和代表性在这里是一对拉扯：越标准化，越可比；越贴近真实，越有预测力。","evidence":["能复述 ARC 采用通用 harness 的理由","能指出公平性与真实部署形态之间的取舍"],"ap":"{{name}} 的代价是什么，评测因此损失了什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_079fba1c","name":"项目知识体系","src":"multi","type":"CONCEPTUAL","gloss":"loop 需要完整知识管理：规则、记忆、文档、经验沉淀与过期信息清理，启动时读对上下文。","level":1,"ci":4,"tags":["memory-retrieval"],"k":"use","kwhy":"能列出知识体系至少四个组成部分","nameEn":"","centrality":0.089,"stage":"now","feynman":"这就像给每天上班的员工准备一份准确的公司手册。手册过期，员工越勤快，犯错越快。","evidence":["能列出知识体系至少四个组成部分","能说明过期信息清理为何是体系的一部分"],"ap":"在 {{name}} 里，自动运行的 Agent 最该在何时读到正确上下文？","origin":["context","harness"],"mentionCount":2},{"id":"cm_b0946442","name":"语义匹配（semantic matching）与触发短语","src":"neican","type":"CONCEPTUAL","gloss":"Claude 靠请求与技能描述在含义上的重叠决定是否触发，重叠不足就不匹配。","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能解释触发靠语义重叠而非关键词精确命中","nameEn":"","centrality":0.089,"stage":"now","feynman":"Claude 决定是否使用某个技能，靠的不是关键词精确命中，而是你的请求与技能描述在\"含义\"上的重叠。重叠不足就不触发。由此推出修复方法：用你实际会说的各种说法去测试（\"帮我分析一下这个性能\"\"为什么这个这么慢？\"等），把没触发的措辞作为触发短语补进描述里。这是\"技能无法触发\"几乎总是描述问题的原因。","evidence":["能解释触发靠语义重叠而非关键词精确命中","能把没触发的说法作为触发短语补进描述"],"ap":"{{name}} 里重叠不足会怎样？该怎么修？","origin":["neican"],"mentionCount":2},{"id":"cm_226cbc01","name":"预构建技能与自定义技能","src":"neican","type":"CONCEPTUAL","gloss":"技能分两类：Anthropic 预置文档技能与用户自定义技能，运行方式相同，来源与共享范围不同。","level":1,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出预构建与自定义技能在运行方式上没有区别","nameEn":"Pre-built vs Custom Skills","centrality":0.089,"stage":"when-needed","feynman":"技能按来源分成两类：Anthropic 提供的预构建文档技能，以及用户自己打包组织经验的自定义技能。关键点是，两类技能在运行方式上没有区别；一旦进入某个环境，Claude 都会在相关时自动使用。但它们的来源、上传方式和后续的共享范围不同，这会影响“谁能用、在哪里用”。","evidence":["能说出预构建与自定义技能在运行方式上没有区别","能指出自定义技能可在 Claude Code、API 或 claude.ai 中创建与上传"],"ap":"{{name}} 与预构建技能在运行方式上有什么区别？","origin":["neican"],"mentionCount":2},{"id":"cm_1db64a00","name":"执行可靠性机制","src":"multi","type":"CONCEPTUAL","gloss":"让执行中断可恢复、错误不滚雪球、越界立即停止的机制集合：状态、错误、护栏、验证。","level":0,"ci":4,"tags":["harness-runtime"],"k":"use","kwhy":"能说出中断后恢复依赖哪类状态","nameEn":"State / Error / Guardrails / Verification","centrality":0.089,"stage":"now","feynman":"执行可靠性机制是一组让 Agent 可恢复、可约束、可检查的系统能力。状态和存档点保证任务不中断即归零；错误处理防止失败累积；护栏和验证循环把模型行动放进可控边界。","evidence":["能说出中断后恢复依赖哪类状态","能举出一个错误滚雪球以致必须停止的场景"],"ap":"在 {{name}} 里，哪一环负责阻止错误继续放大？","origin":["context","harness"],"mentionCount":2},{"id":"cm_7098bed1","name":"自动记忆","src":"context","type":"CONCEPTUAL","gloss":"记忆保存从用户手动 # 写入 CLAUDE.md，变成系统自动保存与工作和你相关的记忆。","level":1,"ci":1,"tags":["memory-retrieval"],"k":"use","kwhy":"能说出过去用 # 热键保存记忆的做法","nameEn":"auto-memory","centrality":0.089,"stage":"when-needed","feynman":"过去要自己写便利贴贴在显示器上，现在助手自己记得住。人不必再兼任自己的档案员。","evidence":["能说出过去用 # 热键保存记忆的做法","能说明自动记忆与会话间上下文通道的关系"],"ap":"{{name}} 之后，用户还需要手动保存记忆吗？","origin":["context"],"mentionCount":2},{"id":"cm_253ad423","name":"Agent = Model + Harness","src":"harness","type":"CONCEPTUAL","gloss":"Agent = Model + Harness：模型只有在 harness 提供状态、工具执行、反馈回路与约束后才成为 agent。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出 raw model 为什么不算 agent","nameEn":"","centrality":0.089,"stage":"now","feynman":"把「agent」这个模糊的词做了一次因式分解。以后评价一个 agent 好不好，可以分开问两个问题：模型这一项有多强？框架这一项做了多少事？两项是可以独立优化、也可以独立归因的。","evidence":["能指出 raw model 为什么不算 agent","能列出 harness 至少四项能力中的三项"],"ap":"在 {{name}} 里，缺了状态和反馈回路会怎样？","origin":["harness"],"mentionCount":2},{"id":"cm_2b63a21c","name":"AI 原生开发","src":"neican","type":"CONCEPTUAL","gloss":"AI 原生开发不是新流程，而是用新方式跑旧的软件开发流程。","level":1,"ci":3,"tags":["agent-org"],"k":"judge","kwhy":"能复述可行性、设计、原型、编码、测试这些步骤一个都没少","nameEn":"AI-native development","centrality":0.089,"stage":"now","feynman":"在本文里，AI 原生开发不是让 AI 写代码的同义词，也不是一套全新流程。它指旧的软件开发流程照跑，但每个环节的执行方式和承担者变了。它是全文的起点，因为只有先接受这个定义，读者才会把注意力从编码移到代码之外。","evidence":["能复述可行性、设计、原型、编码、测试这些步骤一个都没少","能指出 AI 原生开发不等于用 AI 写代码，也不等于发明了新流程"],"ap":"{{name}} 到底改变了流程的什么、没改变什么？","origin":["neican"],"mentionCount":2},{"id":"cm_0c98a6cf","name":"AI Agent","src":"multi","type":"CONCEPTUAL","gloss":"用户感知到的行为体现：Agent 的对外表现，而非其内部实现。","level":1,"ci":4,"tags":["harness-runtime"],"k":"judge","kwhy":"能区分 Agent 的内部实现与用户感知行为","nameEn":"","centrality":0.089,"stage":"now","feynman":"AI Agent 是用户看到的“会做事的东西”。它看起来有目标、会用工具、会纠错，但这种行为不是裸模型单独产生的，而是 Harness 把模型组织进执行系统之后的外在表现。","evidence":["能区分 Agent 的内部实现与用户感知行为","能举出一个用户可观察的 Agent 行为"],"ap":"从外部看，我们凭什么判断 {{name}} 是否符合预期？","origin":["context","harness"],"mentionCount":2},{"id":"cm_6a2b80d9","name":"compaction","src":"multi","type":"PROCEDURAL","gloss":"上下文接近窗口上限时，把对话摘要后重新初始化新窗口，保留关键决策与未解决 bug。","level":2,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能说出压缩会保留与丢弃哪些内容","nameEn":"","centrality":0.089,"stage":"now","feynman":"会开到一半白板写满了，就把结论和未决事项誊到新白板上，其余擦掉重来。难的不是誊写，是判断哪条「现在看着没用、过会儿才发现关键」——擦得太狠，代价往往过很久才浮现。","evidence":["能说出压缩会保留与丢弃哪些内容","能说明没有压缩时超出窗口会发生什么"],"ap":"{{name}} 触发后，哪些内容必须被带进新窗口？","origin":["context","harness"],"mentionCount":2},{"id":"cm_5d1ba3e1","name":"Harness 与 Loop 的配合","src":"multi","type":"CONCEPTUAL","gloss":"Harness 提供约束护栏、Loop 提供驱动力，二者配合让任务可持续自动推进。","level":1,"ci":4,"tags":["loop-autonomy"],"k":"judge","kwhy":"能分别指出自己系统中护栏与驱动力的部分","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"Loop 是油门，Harness 是护栏。只有油门没有护栏，车会跑偏；只有护栏没有油门，系统跑不起来。","evidence":["能分别指出自己系统中护栏与驱动力的部分","能为一循环同时写出完成标准与不可越过的边界条件"],"ap":"你的 {{name}} 是否同时具备完成标准与不可越过的边界条件？","origin":["context","harness"],"mentionCount":2},{"id":"cm_de3faada","name":"Latent vs Deterministic","src":"multi","type":"CONCEPTUAL","gloss":"系统每一步要么在潜空间要么是确定性的，混淆二者是 Agent 设计中最常见的错误。","level":0,"ci":4,"tags":["harness-runtime"],"k":"judge","kwhy":"能逐个标注流程中每步属于潜空间还是确定性","nameEn":"","centrality":0.089,"stage":"now","feynman":"agent 系统里每一步都必须落在其中一边。","evidence":["能逐个标注流程中每步属于潜空间还是确定性","能指出把判断交给确定性代码或反之导致的具体故障"],"ap":"你能指出 {{name}} 的实例中哪些步骤属于哪一类吗？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_6db0527f","name":"MCP servers","src":"neican","type":"REPRESENTATIONAL","gloss":"MCP servers 提供外部工具和集成，与 skills 是完全不同的类别。","level":0,"ci":3,"tags":["tools-sandbox"],"k":"accept","kwhy":"能说明 MCP 负责外部工具而非注入任务知识","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"MCP servers 在本文里负责外部工具和集成，是另一类能力来源，不是用来给当前对话注入任务知识的。理解这一点，读者才不会把“接入外部工具”误当成“写一个 skill”，也才能看清为什么作者说每种功能各有专长。","evidence":["能说明 MCP 负责外部工具而非注入任务知识","能指出它与 skills 不是同一类能力来源"],"ap":"{{name}} 在文中负责什么？和 skills 有何区别？","origin":["neican"],"mentionCount":2},{"id":"cm_186ee145","name":"Resolver","src":"multi","type":"CONCEPTUAL","gloss":"上下文的路由表：任务类型 X 出现时优先加载文档 Y，规定加载什么与何时加载。","level":2,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能为若干任务类型写出对应的加载文档映射","nameEn":"","centrality":0.089,"stage":"when-needed","feynman":"resolver 是「何时加载哪份文档 / 哪个能力」的路由器。","evidence":["能为若干任务类型写出对应的加载文档映射","能区分 skills 管怎么做、resolver 管加载什么"],"ap":"能否为 {{name}} 写出任务类型到文档的映射表并解释优先级？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_75e723cc","name":"Thin Harness, Fat Skills","src":"multi","type":"CONCEPTUAL","gloss":"设计原则：harness 保持薄，把厚度与智能放进 skills（thin harness, fat skills）。","level":1,"ci":4,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出当前 harness 中该被上推或下推的逻辑","nameEn":"","centrality":0.089,"stage":"now","feynman":"Garry Tan 给 AI agent 架构提出的**方向性原则**，一句话写得下：","evidence":["能指出当前 harness 中该被上推或下推的逻辑","能说明该原则为何让模型升级自动惠及所有 skills"],"ap":"按 {{name}} 原则，你现在该把哪部分逻辑移出 harness？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_60061253","name":"Tic Word","src":"notion","type":"CONCEPTUAL","gloss":"模型在不该出现的语境下仍反复使用的词，是奖励信号系统性偏差的可量化指纹。","level":2,"ci":0,"tags":["model-training"],"k":"judge","kwhy":"能用出现与不出现某词的同一任务输出比较奖励偏向","nameEn":"","centrality":0.089,"stage":"deep-dive","feynman":"","evidence":["能用出现与不出现某词的同一任务输出比较奖励偏向","能区分抽动词与合理使用（如作品里的专有名词）"],"ap":"你能否用 {{name}} 的诊断法找出一个被奖励偏置植入的词？","origin":["notion"],"mentionCount":2},{"id":"cm_d793c38e","name":"名称冲突优先级与技能作用域","src":"neican","type":"CONCEPTUAL","gloss":"同名技能按企业→个人→项目→插件排优先级，企业版生效并覆盖其他作用域","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能按序排出企业版最高、插件版最低","nameEn":"","centrality":0.087,"stage":"when-needed","feynman":"同名技能不是简单由后来者覆盖，而是按作用域排优先级。材料顶部给出的完整顺序是企业版最高，其后是个人版、项目版，插件版最低；后面的局部列表再次明确企业级最高、插件最低，并把个人技能定位在主目录。这样企业可以用企业级技能强制执行标准，个人定制不能覆盖企业版本。理解这个优先级，才能判断同名技能最终哪个生效。材料后面的局部列表没有列出项目版，但顶部顺序已经把项目版放在个人版之后、插件版之前。","evidence":["能按序排出企业版最高、插件版最低","能判断同名企业技能与个人技能并存时哪个生效"],"ap":"同名的企业技能与个人技能并存时，{{name}}是哪一版？","origin":["neican"],"mentionCount":5},{"id":"cm_80fd0c67","name":"“SaaS 已死”叙事与护城河蒸发","src":"context","type":"CONCEPTUAL","gloss":"市场认为 SaaS 护城河消失、未来现金流更不确定的叙事，但“人人自攒 CRM”的版本被指过于简化。","level":1,"ci":1,"tags":["economy-business"],"k":"judge","kwhy":"能说明该叙事对投资人现金流与上市公司的冲击","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"“SaaS 已死”像一句好用的口号，但它把两件事混为一谈。真命题是：当 AI 让软件更易被替代，靠锁定和惯性收租的旧护城河确实在退潮。假命题是：所以每家公司都会自己写掉所有软件。退潮冲垮的是站在浅滩、动作迟缓的大船，而不是所有船；灵活的新船反而能借这股水位变化重新出海。","evidence":["能说明该叙事对投资人现金流与上市公司的冲击","能指出更可能是灵活新公司冒出而非用户自建全栈"],"ap":"你如何用 {{name}} 判断某 SaaS 公司的护城河是否真的蒸发？","origin":["context"],"mentionCount":1},{"id":"cm_143bc730","name":"「垃圾回收」型 agent","src":"harness","type":"CONCEPTUAL","gloss":"harness 的第三类组件：周期性运行的 agent，专找文档不一致与架构约束违规，对抗熵增腐化。","level":1,"ci":2,"tags":["harness-runtime"],"k":"use","kwhy":"能说出它周期性运行而非随任务触发的特点","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"软件不会自己变好，只会自己变乱。这类 agent 相当于给代码库雇了个巡道工：不产出新功能，只在后台不断把跑偏的地方拨回来，让熵增的速度慢于修复的速度。","evidence":["能说出它周期性运行而非随任务触发的特点","能列出它要扫的两类目标：文档不一致与架构违规"],"ap":"你能否配置一个 {{name}} 定期扫出文档与架构的不一致？","origin":["harness"],"mentionCount":1},{"id":"cm_d26c5950","name":"2026 版约束理论","src":"harness","type":"CONCEPTUAL","gloss":"承认模型有强弱约束，与其赌灯灭式跃迁，不如在约束内优化系统并读代码。","level":1,"ci":2,"tags":["thinking-method"],"k":"judge","kwhy":"能说出模型当前的具体约束","nameEn":"","centrality":0.072,"stage":"now","feynman":"与其无视自己体力和心肺的极限硬冲马拉松配速最终受伤退赛，不如先摸清楚自己今天的真实状态，在这个状态允许的范围内跑出一个可持续、能完赛的配速。","evidence":["能说出模型当前的具体约束","能给出在约束内找杠杆的做法"],"ap":"按 {{name}}，你会在哪些约束里找杠杆？","origin":["harness"],"mentionCount":1},{"id":"cm_d261b319","name":"安全路由与能力分层","src":"context","type":"CONCEPTUAL","gloss":"能力分层与安全路由：高敏能力限受信组织使用，受限查询被改路由到低风险模型。","level":0,"ci":1,"tags":["safety-governance"],"k":"judge","kwh r 强制；更狠的是 linter 报错本身就是\"给 AI 的修复指令\"，让 Agent 自己读了就能改。这是把工具链彻底改造成\"AI 友好\"的范例。","evidence":["能写出一条带具体替代写法的 Agent 可读 lint 报错","能说明层级约束如何降低 Agent 越界改动"],"ap":"你项目里 {{name}} 的报错，Agent 能据此直接改对吗？","origin":["harness"],"mentionCount":1},{"id":"cm_36605218","name":"差一点就通过的输出","src":"harness","type":"CONCEPTUAL","gloss":"最危险的是差一点就通过的输出：偏离约束、编造合理值、守字面破精神，不崩不报错，直接上线。","level":1,"ci":2,"tags":["verification-eval"],"k":"judge","kwhy":"能列举三种典型的『差一点就通过』输出","nameEn":"","centrality":0.072,"stage":"now","feynman":"明显错的东西会被门口的保安拦下；穿得体面、证件齐全但心怀不轨的才会混进去。质检真正要防的，不是离谱，而是「像样」。","evidence":["能列举三种典型的『差一点就通过』输出","能说明它为何比明显崩溃更危险"],"ap":"你会怎么设计门禁拦住 {{name}} 这类输出？","origin":["harness"],"mentionCount":1},{"id":"cm_3a2cd7d5","name":"产品记忆平台","src":"context","type":"CONCEPTUAL","gloss":"Karri 对 Linear 的定位：不做通用 agent 平台，而做产品上下文与产品记忆的所在地，是通往产品思考的 API。","level":1,"ci":1,"tags":["agent-org"],"k":"accept","kwhy":"能对比 Linear 与 Claude/ChatGPT 在上下文供给上的差别","nameEn":"product memory platform","centrality":0.072,"stage":"when-needed","feynman":"通用 agent 像一个每天失忆的临时工，你每次都得从头交代背景。产品记忆平台像一个跟了你多年的老同事，你只说半句，他就知道你指的是哪个项目、上次卡在哪、客户要什么。价值不在“更聪明的大脑”，而在“共享且长期沉淀的记忆”——上下文本就活在那里，不必每次重新搬运。","evidence":["能对比 Linear 与 Claude/ChatGPT 在上下文供给上的差别","能说明『产品记忆平台』与『通用 agent 平台』的定位差异"],"ap":"{{name}} 和通用 agent 平台的区别是什么？","origin":["context"],"mentionCount":1},{"id":"cm_d59c122f","name":"持久化代码图谱","src":"context","type":"REPRESENTATIONAL","gloss":"把代码库每个函数、类、导入、调用、继承与测试映射成图谱，构建后持久保存在本地，供查询与增量更新。","level":3,"ci":1,"tags":["state-persistence"],"k":"use","kwhy":"能说明图谱覆盖哪些代码关系","nameEn":"structural map / graph","centrality":0.072,"stage":"when-needed","feynman":"不是每次都临时给代码拍一张快照，而是造一张一直存在、可以反复查阅、还会自己更新的\"代码关系网地图\"。","evidence":["能说明图谱覆盖哪些代码关系","能解释持久保存与每次任务临时生成的区别与收益"],"ap":"{{name}} 更新一次要多久，能支撑后续增量查询吗？","origin":["context"],"mentionCount":1},{"id":"cm_b73dd02f","name":"触发模式谱系","src":"harness","type":"REPRESENTATIONAL","gloss":"Agent 常见触发方式四分类：事件触发、定时触发、发射后不管、长时程自主，各自对应不同在环程度。","level":0,"ci":2,"tags":["loop-autonomy"],"k":"use","kwhy":"能说出四
