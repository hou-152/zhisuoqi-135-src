":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能指出一段 prompt 是过硬编码还是过空泛","nameEn":"the right altitude","centrality":0.017,"stage":"when-needed","feynman":"交代事情的颗粒度。说「客人进门第 3 秒说你好，第 7 秒递菜单」是把人当机器；说「让客人感到宾至如归」又等于没说。好的交代是「先问清楚客人的需求再推荐，拿不准就叫店长」——有判断依据，但不替对方做每一步决定。","evidence":["能指出一段 prompt 是过硬编码还是过空泛","能为一个任务写出处于恰当高度的系统指令"],"ap":"这段 system prompt 处在{{name}}上吗，偏哪一端？","origin":["context"],"mentionCount":1},{"id":"cm_29cc1536","name":"嵌入","src":"context","type":"PROCEDURAL","gloss":"第二种接入方式：检查作为 skill 产出物的一部分自动触发，无需开口，如生成组件后自动跑 eslint。","level":0,"ci":1,"tags":["harness-runtime"],"k":"use","kwhy":"能在 skill body 末尾加一行让检查随产出自动执行","nameEn":"Embedded","centrality":0.017,"stage":"when-needed","feynman":"把质检直接焊进生产工序里——工人组装完最后一步，顺手就把自检做了，不需要另派一个人在旁边喊「记得检查」。检查和生产变成同一个动作。","evidence":["能在 skill body 末尾加一行让检查随产出自动执行","能在全新任务上调用该 skill 并看到新步骤自动跑出来"],"ap":"这个检查流程该做成显式调用，还是做成{{name}}？","origin":["context"],"mentionCount":1},{"id":"cm_d8aa34b6","name":"轻量引用","src":"context","type":"PROCEDURAL","gloss":"大块信息留在外部存储，模型窗口里只暴露简短引用的上下文隔离手法。","level":0,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能画出沙箱输出→引用→按需取回的数据流","nameEn":"lightweight references","centrality":0.017,"stage":"now","feynman":"桌上只放索引卡，资料放柜子里。要用哪份再去取，桌面不会被淹。","evidence":["能画出沙箱输出→引用→按需取回的数据流","能说明 schema 化状态对象只上浮选定字段的做法"],"ap":"{{name}}如何在降低 token 开销的同时保持完整上下文可达？","origin":["context"],"mentionCount":1},{"id":"cm_b226afb7","name":"全文覆盖式编辑","src":"harness","type":"PROCEDURAL","gloss":"大改动时不用增量 Edit，直接 Write 覆盖整个文件，以绕过精确打补丁的困难。","level":0,"ci":2,"tags":["code-engineering"],"k":"use","kwhy":"能说明 Edit 规格中「大改动请用 Write 覆盖」的建议","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"与其教模型精确地做外科手术，不如让它把整份文件重抄一遍。笨、贵，但可靠得多——很多工程难题的最优解就是用算力换掉一个必须训练的模型。","evidence":["能说明 Edit 规格中「大改动请用 Write 覆盖」的建议","能权衡覆盖写法多耗 token 与正确率之间的取舍"],"ap":"什么情况下{{name}}比逐行增量编辑更划算？","origin":["harness"],"mentionCount":1},{"id":"cm_122b687d","name":"确定性工程基础设施","src":"harness","type":"CONCEPTUAL","gloss":"确定性工程基础设施具体指四类：权限网关、上下文管理、工具路由、错误恢复。","level":0,"ci":2,"tags":["harness-runtime"],"k":"use","kwhy":"能说出四类基础设施各自的职责","nameEn":"deterministic engineering infrastructure","centrality":0.017,"stage":"now","feynman":"那 98.4% 的具体构成。\"确定性\"是核心修饰词——这些代码不依赖 AI 推理，给定输入永远给出相同输出，因此能用来约束、兜底那个不确定的模型。四大件：权限网关、上下文管理、工具路由、错误恢复。","evidence":["能说出四类基础设施各自的职责","能在实际项目里指出这四类的对应实现"],"ap":"一个 Agent 系统缺了{{name}}中的哪一类会最先崩？","origin":["harness"],"mentionCount":1},{"id":"cm_98e749f2","name":"人的手感与产品手艺","src":"context","type":"CONCEPTUAL","gloss":"产品构建仍是靠直觉与对问题的理解的手艺，不把 A/B 测试与纯数据当决策依据。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能说出哪些产品决策数据给不出答案","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"数据能告诉你“哪个按钮点击更多”，却告诉不了你“这个产品该有怎样的灵魂”。A/B 测试擅长在既定选项里择优，不擅长凭空想出那个更好的选项。当 agent 接管了执行和择优，人剩下的、也最不可替代的，恰恰是那份说不清道不明的手感——判断什么有趣、什么值得做、什么能让产品真正变好。","evidence":["能说出哪些产品决策数据给不出答案","能举出一个凭手感判断「什么有趣」的实例"],"ap":"哪些决策上{{name}}应当压过纯数据驱动？","origin":["context"],"mentionCount":1},{"id":"cm_8d443f8b","name":"人类上移到更高抽象层","src":"harness","type":"CONCEPTUAL","gloss":"人应在栈上往上移动，在正确时机与正确抽象层级提供监督，而非被移出回路。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出系统应在哪些触点设置人工监督","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"不是把人赶出车间，而是让人从拧螺丝的位置换到画图纸和验收的位置。人还在，只是站得更高。","evidence":["能指出系统应在哪些触点设置人工监督","能说明为何技术是为人类更好未来而造"],"ap":"在什么抽象层级上，{{name}}才是有效的监督？","origin":["harness"],"mentionCount":1},{"id":"cm_600a5349","name":"软件工厂","src":"harness","type":"REPRESENTATIONAL","gloss":"把软件开发看作从需求、建造、评审、上线到反馈的完整反馈环，术语可追溯到1968年NATO会议。","level":0,"ci":2,"tags":["code-engineering"],"k":"use","kwhy":"能画出2022年AI之前的基线反馈环","nameEn":"Software Factory","centrality":0.017,"stage":"when-needed","feynman":"把开发一款软件想象成一条工厂流水线——想法进料，经过设计、制造、质检、发货、返修几道工序，循环往复。这个比喻本身没有对错，关键是\"AI 进场后，流水线上哪道工序被替换、哪道工序被直接砍掉\"。","evidence":["能画出2022年AI之前的基线反馈环","能指出AI之后反馈环的哪一环被改变"],"ap":"用{{name}}画出AI之前那条完整反馈环。","origin":["harness"],"mentionCount":1},{"id":"cm_26914899","name":"软件即有向图","src":"context","type":"CONCEPTUAL","gloss":"软件可表示为有向图（DG/DAG），程序曾以流程图表示，是重述agent演化史的起点。","level":0,"ci":1,"tags":["code-engineering"],"k":"accept","kwhy":"能区分DG与DAG","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"任何程序说到底都是「从这一步走到那一步」的箭头集合。流程图之所以能表示程序，是因为程序本来就长那样。理解这一点后再看 agent，你会发现所谓的智能决策，不过是把「谁来决定下一支箭头指向哪」这个权限，从程序员手里挪给了模型。","evidence":["能区分DG与DAG","能解释为何当年用流程图表示程序"],"ap":"{{name}}这一说法为什么和DAG有关？","origin":["context"],"mentionCount":1},{"id":"cm_2458ffe3","name":"熵减","src":"context","type":"CONCEPTUAL","gloss":"上下文工程的本质是把高熵的上下文与意图压缩成低熵表示，该成本与机器智能水平成反比。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能解释人靠共有知识与情境补全省略信息","nameEn":"entropy reduction","centrality":0.017,"stage":"now","feynman":"跟人说话可以省略一半，跟机器说话不能。省略掉的那一半，得有人补上——现在补的是你。机器越笨，你补得越多。","evidence":["能解释人靠共有知识与情境补全省略信息","能说明模型变强后这份effort如何变化"],"ap":"为什么{{name}}是上下文工程的核心成本？","origin":["context"],"mentionCount":1},{"id":"cm_3a51a33e","name":"熵与腐化","src":"harness","type":"CONCEPTUAL","gloss":"老代码库往往非标准化、充满熵，是判断能否补harness进行改造的依据，也是垃圾回收agent的对手。","level":0,"ci":2,"tags":["code-engineering"],"k":"judge","kwhy":"能判断某个老应用补harness是否划算","nameEn":"entropy and decay","centrality":0.017,"stage":"when-needed","feynman":"熵在这里是很具体的东西：文档和代码对不上、模块边界越界、同一件事有五种写法。它不会一次性爆发，只会日积月累，直到没人能说清系统的真实结构——那时你想加任何自动化都无处下手。","evidence":["能判断某个老应用补harness是否划算","能说明熵与垃圾回收agent之间的关系"],"ap":"怎么用{{name}}判断老代码库值不值得改造？","origin":["harness"],"mentionCount":1},{"id":"cm_343d14e9","name":"上下文（Context）：模型生成之前看到的一切","src":"context","type":"CONCEPTUAL","gloss":"上下文是模型生成响应之前看到的一切，含系统提示、用户提示、记忆、检索、工具与输出定义七类。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能完整列出七类上下文","nameEn":"","centrality":0.017,"stage":"now","feynman":"模型答题时能看到的整张桌面就是上下文——题目、规则、笔记本、参考书、计算器、答题卡格式，全都算。只盯着「题目怎么写」，等于只擦干净了桌面的一角。","evidence":["能完整列出七类上下文","能指出日常最容易被忽略的那几类"],"ap":"列出{{name}}所包含的七类内容。","origin":["context"],"mentionCount":1},{"id":"cm_a25937b3","name":"上下文骨架","src":"context","type":"CONCEPTUAL","gloss":"把issue tracking看作可依赖的骨架，负责收集信号、问题与决策，而非厨房点单系统。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能对比点单隐喻与骨架隐喻的差别","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"当你能同时指挥一百万个 agent 干活，真正稀缺的不是“手”，而是“该干什么”的清晰指令和背景。骨架就是那套让所有 agent 站得住、对得齐的中轴：它不亲自砌砖，但决定了砖往哪儿砌。工单系统只管“把菜端出去”，骨架管的是“这家店为什么做这道菜、接下来该上什么”。","evidence":["能对比点单隐喻与骨架隐喻的差别","能说明骨架如何为agent提供引导性上下文"],"ap":"{{name}}这个隐喻与厨房点单系统差在哪里？","origin":["context"],"mentionCount":1},{"id":"cm_fd9f7a87","name":"上下文缺口","src":"notion","type":"CONCEPTUAL","gloss":"交互双方各掌握对方不知道的上下文，承认自己不擅长的部分反而能更好服务同一用户。","level":0,"ci":0,"tags":["context-engineering"],"k":"use","kwhy":"能举出调用方与系统各自不知道什么的例子","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"- 双方 Agent 各有信息盲区。**差的设计把缺口甩给用户**（\"自己从 150 个 GL code 里选一个\"），**好的设计反向去要对方手里的上下文**（\"这是客户餐还是个人？\"），自己再补完归类。","evidence":["能举出调用方与系统各自不知道什么的例子","能在协作中主动声明自己缺少的上下文"],"ap":"面对一个任务，你能说清缺口在哪、该怎么补吗？","origin":["notion"],"mentionCount":1},{"id":"cm_0e10a538","name":"上下文协作","src":"context","type":"CONCEPTUAL","gloss":"从『你在哪就做什么』的条件—动作，转向主动理解用户正在做什么并协作达成共同目标。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能对比 1.0 规则式与 2.0 协作式的差别","nameEn":"context-cooperative","centrality":0.017,"stage":"deep-dive","feynman":"从\"感应到你进屋就开灯\"，变成\"看你在写论文就帮你想下一段\"。前者响应状态，后者参与工作。","evidence":["能对比 1.0 规则式与 2.0 协作式的差别","能举例说明系统如何推断写作意图并建议下一节"],"ap":"它与 context-aware 的关键差别是什么？","origin":["context"],"mentionCount":1},{"id":"cm_afd87770","name":"昇腾","src":"notion","type":"REPRESENTATIONAL","gloss":"华为的国产 AI 加速芯片系列，被视作中国本土算力承载前沿模型推理的平台。","level":0,"ci":0,"tags":["geo-infrastructure"],"k":"accept","kwhy":"能说出昇腾对标的是哪类硬件","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"","evidence":["能说出昇腾对标的是哪类硬件","能说明模型适配昇腾对算力封锁威慑的影响"],"ap":"昇腾若稳定承载前沿模型，会改变什么？","origin":["notion"],"mentionCount":1},{"id":"cm_5daa0620","name":"示例的探索空间约束","src":"context","type":"CONCEPTUAL","gloss":"给示例会把模型约束在某个特定探索空间：弱模型上是脚手架，强模型上变成天花板。","level":0,"ci":1,"tags":["spec-intent"],"k":"judge","kwhy":"能引用原文“constrains them to a certain exploration space”","nameEn":"","c ","能指出自己工作流中一处可压缩的等待"],"ap":"你身边哪个流程可以靠 {{name}} 省掉一周迟滞？","origin":["context"],"mentionCount":1},{"id":"cm_964615a4","name":"所有权原则","src":"context","type":"CONCEPTUAL","gloss":"自己掌控提示词、上下文窗口与控制流，不把关键环节外包给框架。","level":0,"ci":1,"tags":["harness-runtime"],"k":"judge","kwhy":"能列出三处 Own your 分别指什么","nameEn":"","centrality":0.017,"stage":"now","feynman":"prompt、上下文、控制流，是决定 agent 行为的三个开关。凡是你没握在手里的开关，出问题时你就修不了。所谓生产可用，很大程度上就是这三样东西的产权是否清晰地归你。","evidence":["能列出三处 Own your 分别指什么","能说明被框架封装后为何难以调试与优化"],"ap":"{{name}} 要求你保留哪三样东西的控制权？","origin":["context"],"mentionCount":1},{"id":"cm_f6bd0ed2","name":"锁竞争与乐观并发控制","src":"harness","type":"CONCEPTUAL","gloss":"agent 持锁过久、忘释放、乱加解锁；试过显式等待工具与无锁乐观并发控制。","level":0,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能复述三类锁误用表现","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"锁是并发编程里最容易写错的东西之一，正确的写法往往只有很窄的一条路。人类程序员都常写错，指望模型靠 prompt 学会拿捏锁的语义，是把难度放错了地方。","evidence":["能复述三类锁误用表现","能比较显式等待工具与乐观并发控制各自的代价"],"ap":"{{name}} 中乐观并发控制解决了什么、又没解决什么？","origin":["harness"],"mentionCount":1},{"id":"cm_99eaee44","name":"拓扑作为新抽象层","src":"harness","type":"CONCEPTUAL","gloss":"若 harness 设计模式被普遍掌握，拓扑结构或成新的抽象层，而非自然语言。","level":0,"ci":2,"tags":["harness-runtime"],"k":"accept","kwhy":"能说出稳定数据结构与强制模块边界两个抓手","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"抽象层是我们思考系统时真正操作的那一层。流行叙事说以后大家用自然语言编程，这一问反过来讲：真正决定系统能不能被 AI 维护的，也许不是你怎么描述它，而是它被切成了什么形状、边界画在哪里。","evidence":["能说出稳定数据结构与强制模块边界两个抓手","能讨论拓扑抽象与自然语言抽象的取舍"],"ap":"为什么 {{name}} 可能比自然语言更适合做抽象层？","origin":["harness"],"mentionCount":1},{"id":"cm_0696197e","name":"探针","src":"notion","type":"REPRESENTATIONAL","gloss":"架在模型某一层的轻量神经网络，强行从该层数据推测原始属性。","level":0,"ci":0,"tags":["model-training"],"k":"judge","kwhy":"能说明探针抠得出原图属性即该层未有效压缩","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"","evidence":["能说明探针抠得出原图属性即该层未有效压缩","能描述探针的放置层级与训练方式"],"ap":"{{name}} 能还原原图属性说明了什么？","origin":["notion"],"mentionCount":1},{"id":"cm_963c2230","name":"提示词即行为程序","src":"harness","type":"CONCEPTUAL","gloss":"p arness 与工具链成型","nameEn":"no manually typed code at all","centrality":0.017,"stage":"when-needed","feynman":"把自己的退路堵死，才会认真造工具。只要允许「实在不行我自己上手改一行」，那些本该外化成规则和检查的东西就永远停在人的脑子里。禁止手打代码不是为了炫技，是为了把隐性能力逼成显性装置。","evidence":["能说明这条规则如何迫使 harness 与工具链成型","能引用五个月、一百万行代码这一结果作支撑"],"ap":"{{name}} 为什么是 forcing function，而不只是洁癖？","origin":["harness"],"mentionCount":1},{"id":"cm_f23a5dfb","name":"稀疏反馈推断规则","src":"notion","type":"CONCEPTUAL","gloss":"从稀疏反馈中推断规则、以此构建世界模型的能力。","level":0,"ci":0,"tags":["thinking-method"],"k":"judge","kwhy":"能从少量成败案例归纳出一条可复用规则","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"环境只给极少、间接、嘈杂的成功/失败信号，智能体必须靠这些零星反馈反推出背后的完整规则。这是把「奖励 = 规则」翻译成「先反推规则、再去拿奖励」的能力。","evidence":["能从少量成败案例归纳出一条可复用规则","能说明该规则如何用来预测下一步"],"ap":"只有几次稀疏反馈时，{{name}} 该怎么用？","origin":["notion"],"mentionCount":1},{"id":"cm_48fd3852","name":"习惯变契约","src":"context","type":"CONCEPTUAL","gloss":"把靠自觉维持的习惯写成链条步骤，变成由系统保证执行的契约，人只在被升级回来时介入。","level":0,"ci":1,"tags":["loop-autonomy"],"k":"use","kwhy":"能指出某个习惯写进链条后由谁保证执行","nameEn":"habit → contract","centrality":0.017,"stage":"when-needed","feynman":"口头约定「我尽量记得锁门」和装一把「关门就自动上锁」的弹簧锁，是两回事。前者靠你自律，后者靠机制；链式就是把靠自律的习惯，换成靠机制兜底的契约。","evidence":["能指出某个习惯写进链条后由谁保证执行","能举出 /simplify 结束必跑 /verify 这类例子"],"ap":"{{name}} 之后，谁负责保证这一步一定被执行？","origin":["context"],"mentionCount":1},{"id":"cm_b8aa3676","name":"系统 prompt 的体量差","src":"harness","type":"CONCEPTUAL","gloss":"claude code 的 system prompt 约 13k 字符，cursor 不到 6k。","level":0,"ci":2,"tags":["context-engineering"],"k":"accept","kwhy":"能给出两者 prompt 的体量对比","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"prompt 的长度是一个可观测的用心程度指标。它相当于给员工写的入职手册——手册越细，说明产品越清楚自己要什么行为，而不是把一切交给模型即兴发挥。","evidence":["能给出两者 prompt 的体量对比","能列出这份 prompt 详尽规定的几类内容"],"ap":"{{name}} 主要差在哪几类规定上？","origin":["harness"],"mentionCount":1},{"id":"cm_743bdcd9","name":"先收窄、后读取","src":"context","type":"PROCEDURAL","gloss":"先用 grep/glob 定位候选文件与符号，路径行号明确后才用 view 读取精确证据，避免盲目全文读取。","level":0,"ci":1,"tags":["context-engineering"],"k":"use","kwhy": man":"不是过了某条线就报废，而是像开车上坡：坡越陡越费力，速度一点点掉，但车没熄火。所以问题不是「多长算太长」，而是「值不值得为这段内容付出精度」。","evidence":["能列出 n² 关系、短序列训练分布、位置插值三类叠加因素","能在选上下文长度时按梯度而非悬崖来留余量"],"ap":"按{{name}}，长上下文到什么程度才算不能用？","origin":["context"],"mentionCount":1},{"id":"cm_9b54eda3","name":"虚荣指标","src":"context","type":"CONCEPTUAL","gloss":"度量产出却不度量价值的指标，如 agent 写了多少代码、合并多少 PR、消耗多少 token。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能举出至少两个虚荣指标并说明它不反映价值","nameEn":"vanity metrics","centrality":0.017,"stage":"when-needed","feynman":"体重秤上多出的数字，可能是肌肉，也可能是脂肪，还可能是没上厕所。只盯着“产出了多少”，就像只盯着体重秤——数字在动，却说不清你到底变好还是变差。虚荣指标让人感觉良好、便于汇报，但真正该问的是那个不好看的、滞后的问题：产品真的更好了吗？","evidence":["能举出至少两个虚荣指标并说明它不反映价值","能为每个虚荣指标配一个滞后但真实的替代指标"],"ap":"举一个{{name}}的例子，并给出它的真实替代指标。","origin":["context"],"mentionCount":1},{"id":"cm_65eea963","name":"序列位置效应","src":"context","type":"CONCEPTUAL","gloss":"认知心理学经典发现：自由回忆时列表首尾最易记住，被借来解释模型上下文中的 U 型表现。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能描述自由回忆实验中的首尾优势现象","nameEn":"serial-position effect","centrality":0.017,"stage":"when-needed","feynman":"人背单词表也是头尾记得牢、中间容易忘。模型本来不该有这个毛病，可它偏偏有。","evidence":["能描述自由回忆实验中的首尾优势现象","能解释为何自注意力本可平权取用却仍出现该效应"],"ap":"{{name}}出现在自注意力模型上，为什么算意外？","origin":["context"],"mentionCount":1},{"id":"cm_4fa6863f","name":"遗漏式隐私","src":"context","type":"PROCEDURAL","gloss":"判据是「同事在设置页看到这条，用户会不自在吗」；敏感类别整段省略、不留占位符，被要求记录时说明哪类不能存即停。","level":0,"ci":1,"tags":["safety-governance"],"k":"use","kwhy":"能用判据判断某条记忆该不该存","nameEn":"","centrality":0.017,"stage":"now","feynman":"打码还是泄露，因为方框的位置和大小就说明了被遮住的是什么。真正的隐私保护是让那一格根本不存在。占位符是隐私工程里最常见的自我安慰。","evidence":["能用判据判断某条记忆该不该存","能说出遇到敏感记录请求时的正确反应"],"ap":"按 {{name}}，什么内容必须整段省掉、不留占位符？","origin":["context"],"mentionCount":1},{"id":"cm_e4fb81cb","name":"以项目创建者为中心","src":"neican","type":"CONCEPTUAL","gloss":"工具设计以最终用户即项目创建者为中心，个人高效优先于完美报告。","level":0,"ci":3,"tags":["agent-org"],"k":"judge","kwhy":"能指出衡量标准是创建项目的人能否高效工作","nameEn":"","centrality":0.017,"stage":"now","feynman":"这是全文的出发点。工具为谁而造？作者的回答是\"做活的人\"——即创建项目的那个人，而不是查看报告的管理者。它决定了衡量标准：个人能否高效工作，优先于报表是否漂亮。拿掉这一条，后面\"简洁\"\"小颗粒度\"\"工具为你服务\"都会失去依据。","evidence":["能指出衡量标准是创建项目的人能否高效工作","能反对以报表和查看者为中心的设计取向"],"ap":"按 {{name}}，衡量项目管理工具的标准是什么？","origin":["neican"],"mentionCount":1},{"id":"cm_85804ebb","name":"意识流输入","src":"context","type":"CONCEPTUAL","gloss":"对漫谈内容的反向要求：允许 total mess、跑题、重复与自我否定，即 full stream of consciousness。","level":0,"ci":1,"tags":["spec-intent"],"k":"use","kwhy":"能复述原文对漫谈内容的三项允许","nameEn":"full stream of consciousness","centrality":0.017,"stage":"when-needed","feynman":"这十分钟的目标不是讲得好，而是讲得全；先把脑子倒空，整理的活交给下一步。","evidence":["能复述原文对漫谈内容的三项允许","能说明为何不要求用户先整理再输入"],"ap":"{{name}} 允许输入里出现跑题和自相矛盾吗？","origin":["context"],"mentionCount":1},{"id":"cm_b728a002","name":"意图翻译者","src":"context","type":"CONCEPTUAL","gloss":"1.0 时代设计者的角色：把复杂人类意图转成结构化、机器可读的格式，因机器无法理解语义也无法推理。","level":0,"ci":1,"tags":["spec-intent"],"k":"judge","kwhy":"能说出设计者当时必须做的拆解动作","nameEn":"intention translator","centrality":0.017,"stage":"when-needed","feynman":"那个年代做产品设计，本质是当人机之间的口译。今天模型能自己听懂一部分，但只要它听不懂的部分还在，这个岗位就还在，只是换了名字。","evidence":["能说出设计者当时必须做的拆解动作","能解释为何当时需要预定义程序逻辑"],"ap":"{{name}} 的职责是把什么转成什么？","origin":["context"],"mentionCount":1},{"id":"cm_d2597b53","name":"隐式 code context","src":"harness","type":"CONCEPTUAL","gloss":"作者观察到 Claude Code 接到指令后自动把相关文件放入上下文，但既无 tool use 记录，也找不到本地代码索引。","level":0,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能描述 Claude Code 在无 tool use、无额外模型总结的情况下自动纳入文件的观察","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"能被 log 看见的，是这个产品愿意让你看见的部分。总有一段逻辑发生在请求发出之前——那往往才是竞品最难抄的地方。","evidence":["能描述 Claude Code 在无 tool use、无额外模型总结的情况下自动纳入文件的观察","能指出 ~/.claude 下找不到代码索引，说明机制未公开"],"ap":"{{name}}指什么现象，它为什么让人怀疑 Claude Code 藏了东西？","origin":["harness"],"mentionCount":1},{"id":"cm_5c858fdc","name":"与底层模型正交","src":"context","type":"CONCEPTUAL","gloss":"上下文工程带来独立于底层模型强弱的结构性收益；模型进步是潮水，产品应做被托起的船。","level":0,"ci":1,"tags":["context-engineering"],"k":"accept","kwhy":"能复述潮水与船、以及插在海底被淹没的柱子的比喻","nameEn":"orthogonal to the underlying models","cent w","feynman":"等下一代模型，是把自己能控制的部分交给别人。模型每升一级，你也会把任务难度升一级，失败率不会归零，只会换个位置出现。所以真正可优化的，是你这一侧。","evidence":["能举出一次归因到配置而非模型的失败案例","能解释非确定性系统的失败为何不会消失"],"ap":"面对一次 Agent 失败，怎么用 {{name}} 定位原因？","origin":["harness"],"mentionCount":1},{"id":"cm_f4ee6204","name":"Context 四种失败模式","src":"context","type":"CONCEPTUAL","gloss":"把上下文失效归为污染、分心、混淆、冲突四类，统一解法是不倾倒、只策展。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能把一次失败映射到四类中的一类","nameEn":"Context Pollution / Distraction / Confusion / Clash","centrality":0.017,"stage":"now","feynman":"- **Pollution**：坏信息进窗口，下游全部继承错误，雪球越滚越大\n- **Distraction**：200K 窗口塞了 180K 噪音，模型对一切 roughly equal weight，相关信号被淹没\n- **Confusion**：50 个 tool definitions 堆在 system prompt，模型不知道用哪个\n- **Clash**：[CLAUDE.md](http://claude.md/) 说 pnpm，README 说 npm——模型随机选一个，行为不可预测","evidence":["能把一次失败映射到四类中的一类","能说明 Don't dump, curate 的具体做法"],"ap":"用 {{name}} 把这次失败归类，并给出解法？","origin":["context"],"mentionCount":1},{"id":"cm_33d0987a","name":"Context discipline","src":"harness","type":"CONCEPTUAL","gloss":"用固定 anchor files 与稳定任务边界约束每轮迭代的上下文，不让对话无限膨胀。","level":0,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能设计一组每轮复用的 anchor files","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"AI 很容易被长聊天搞糊涂。上下文纪律就是每轮只给它该看的材料，让它少带旧噪音上路。","evidence":["能设计一组每轮复用的 anchor files","能说明它与无限累积对话的区别"],"ap":"{{name}} 靠什么机制让每轮迭代不膨胀？","origin":["harness"],"mentionCount":1},{"id":"cm_acc5b32d","name":"Context Distraction","src":"context","type":"CONCEPTUAL","gloss":"上下文超过阈值后模型开始机械重复历史行为而非真正推理，窗口更大不等于结果更好。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能指出触发分心的上下文量级","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"Context 塞得越多不等于越好。超过某个阈值后，模型反而被\"淹没\"，开始走捷径而非推理，出现退行行为。质量 > 数量。","evidence":["能指出触发分心的上下文量级","能举例说明重复历史行为的表现"],"ap":"怎么判断模型进入了 {{name}} 而不是在推理？","origin":["context"],"mentionCount":1},{"id":"cm_398fc084","name":"Context Infrastructure","src":"harness","type":"CONCEPTUAL","gloss":"Harness 决定 Agent 怎么工作与协调，上下文基础设施决定它拿到什 ":"","centrality":0.017,"stage":"when-needed","feynman":"","evidence":["能为一个议题做出诚实的数量级估算并对照流行感知","能指出只靠叙事不做估算会带来什么后果"],"ap":"用 {{name}} 说明为什么该先做数量级估算？","origin":["notion"],"mentionCount":1},{"id":"cm_8fabdf4b","name":"few-shot 套路化与受控多样性","src":"context","type":"CONCEPTUAL","gloss":"上下文里堆满彼此相似的 action-observation 对时，模型会照着旧模式走下去，需引入结构化变化。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能指出批量重复任务中漂移与幻觉的具体表现","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"给模型看太多整齐划一的样例，它会以为节奏本身就是任务。适度打乱，是提醒它每一步都要重新看一眼。","evidence":["能指出批量重复任务中漂移与幻觉的具体表现","能设计模板、措辞与顺序上的受控扰动"],"ap":"{{name}} 为何会让模型在批量任务中漂移？","origin":["context"],"mentionCount":1},{"id":"cm_91df6151","name":"Frontier Demand 前沿需求","src":"notion","type":"CONCEPTUAL","gloss":"总市场需求中出乎意料地大的一部分，落在绝对前沿而非中间地带。","level":0,"ci":0,"tags":["economy-business"],"k":"accept","kwhy":"能复述前沿需求占比超预期这一观察","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"让 Sam 自己有点意外的事实——**市场绝大多数需求集中在最新一代模型**，不是「上一代足够便宜就行」。","evidence":["能复述前沿需求占比超预期这一观察","能推出它对产品与团队定位的含义"],"ap":"{{name}} 对产品定位意味着什么？","origin":["notion"],"mentionCount":1},{"id":"cm_1bb0da58","name":"Gather-Act-Verify Cycle","src":"harness","type":"PROCEDURAL","gloss":"收集上下文、动手修改、验证结果、再重复，构成 Agent 的执行节奏。","level":0,"ci":2,"tags":["loop-autonomy"],"k":"use","kwhy":"能按该循环拆解一次真实的编码任务","nameEn":"","centrality":0.017,"stage":"now","feynman":"ReAct 的一个具体变种——**先搜集情报，再动手，再复查**。顺序不能乱，复查不能省。这就是 Claude Code 跑得比其他 coding agent 稳的原因。","evidence":["能按该循环拆解一次真实的编码任务","能指出缺少验证环节时的失败模式"],"ap":"{{name}} 的三个阶段各自做什么？","origin":["harness"],"mentionCount":1},{"id":"cm_b3d14b63","name":"Generative Kernel","src":"harness","type":"CONCEPTUAL","gloss":"交付物从成品软件变为生成内核，需要被 harness 的系统复杂度本身随之下降。","level":0,"ci":2,"tags":["agent-org"],"k":"accept","kwhy":"能说明生成内核与成品软件的差别","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"作者对 harness engineering 适用边界的判断。如果未来软件不再是大型复杂系统，而是按需生成的一次性内核，那么驾驭大型系统的工程学科自然失去用武之地。这暗示 AI 对软件更深远的影响可能不在于更好地构建复杂系统，而在于让系统本身不再需要那么复杂。","eviden "round\" stroke-linejoin=\"round\" transform=\"translate(305.9 68.4) scale(325.6)\"><path d=\"M .16 .26 H .84 V .84 H .16 Z\"/><path d=\"M .16 .45 H .84\"/><path d=\"M .16 .64 H .84\"/><path d=\"M .84 .32 H .99 V .42 H .84\"/><path d=\"M .84 .51 H .99 V .61 H .84\"/><path d=\"M .84 .70 H .99 V .80 H .84\"/><path d=\"M .26 .37 H .46\"/><path d=\"M .26 .56 H .46\"/><\/g><g filter=\"url(#hw78)\"><circle cx=\"479\" cy=\"426\" r=\"10.7\" fill=\"#141413\"/><circle cx=\"280\" cy=\"369\" r=\"5.2\" fill=\"#141413\"/><circle cx=\"668\" cy=\"104\" r=\"5.5\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>Skills 文件系统按需加载；API 靠代码执行工具。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>核心问题：Agent Skills 是什么、如何工作，以及如何在 Claude API 中使用。关联子问题：预置与自定义 Skill 如何编写/上传、在各产品面如何共享与受限；安全、数据留存和运行环境边界是什么。<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、Agent Skills 的定位与价值<\/h4>\n<h5>1.1 定义<\/h5>\n<ul>\n<li>每个 Skill 是模块化功能，包含指令、元数据和可选资源（脚本、模板）；Claude 在需要时自动使用。<\/li>\n<li class=\"s\">技能是文件系统上的可重用资源，赋予 Claude 特定领域专业知识：工作流程、上下文、最佳实践，使通用代理转变为专家。<\/li>\n<\/ul>\n<h5>1.2 与提示的区别<\/h5>\n<ul>\n<li>提示是对话级、一次性任务指令；Skills 按需加载，无需在不同对话中重复相同指导。<\/li>\n<\/ul>\n<h5>1.3 主要优势<\/h5>\n<ul>\n<li>Claude 专精：针对特定领域任务定制功能。<\/li>\n<li>减少重复：一次创建，自动使用。<\/li>\n<li>组合能力：结合多种技能完成复杂多步骤任务。<\/li>\n<\/ul>\n<h5>1.4 预置与自定义<\/h5>\n<ul>\n<li>Anthropic 提供预置文档技能（PowerPoint、Excel、Word、PDF），也可创建自定义技能；两者工作方式相同：一旦在环境中可用，Claude 会在相关时自动使用。<\/li>\n<li class=\"s\">预置可用面：claude.ai、Claude API、AWS 上的 Claude Platform、Microsoft Foundry；在 Microsoft Foundry 上，Agent Skills 需部署在 Anthropic。<\/li>\n<li class=\"s\">自定义可打包领域专业知识和组织经验；可在 Claude Code 创建、通过 Claude API 上传，或在 claude.ai 设置中添加；AWS/Microsoft Foundry 通过 Skills API 上传。<\/li>\n<\/ul>\n<h4>二、工作原理：虚拟机 + 渐进式披露<\/h4>\n<h5>2.1 文件系统与虚拟机<\/h5>\n<ul>\n<li>Skills 利用 Claude 的虚拟机环境，提供仅凭提示无法实现的功能；Claude 在具有文件系统访问权限的 VM 中运行，Skills 以目录形式存在，包含指令、可执行代码和参考资料，类似为新团队成员创建的入职指南。<\/li>\n<\/ul>\n<h5>2.2 三类内容与加载时机<\/h5>\n<ul>\n<li>YAML frontmatter：提供发现信息；启动时加载进系统提示。Claude 根据 <code>description<\/code> 判断是否触发技能，因此它必须说明技能功能和使用时机。<\/li>\n<li class=\"s\">轻量：技能触发前，只有名称和描述占用上下文，可安装多个技能而不造成上下文开销。<\/li>\n<li>SKILL.md 主体：包含程序性知识——工作流程、最佳实践、指南；当请求与技能描述相符时，Claude 用 bash 从文件系统读取，此时内容才进入上下文。<\/li>\n<li>捆绑材料：附加 Markdown（如 FORMS.md、REFERENCE.md）、代码（如 fill_form.py、validate.py）、资源（数据库 schema、API 文档、模板、示例）；仅在引用时访问。<\/li>\n<li class=\"s\">文件系统模型下各有强项：instructions 用于灵活指导，code 用于可靠性，resources 用于事实查找。<\/li>\n<\/ul>\n<h5>2.3 三级加载与 token 成本<\/h5>\n<ul>\n<li>Level 1 Metadata：始终在启动时加载；约 100 tokens/技能；内容为 YAML frontmatter 的 name 和 description。<\/li>\n<li>Level 2 Instructions：技能触发时加载；低于 5k tokens；内容为 SKILL.md 主体。<\/li>\n<li>Level 3+ Resources：按需加载；访问前无成本；引用文件读入上下文；脚本通过 bash 运行，只有输出进入上下文。<\/li>\n<li>渐进式披露保证任一时刻只有相关内容占用上下文窗口。<\/li>\n<\/ul>\n<h5>2.4 访问机制与收益<\/h5>\n<ul>\n<li>触发后，Claude 用 bash 读 SKILL.md；若指令引用其他文件，再用 bash 读取；若提到可执行脚本，通过 bash 运行，只接收输出，脚本代码本身从不进入上下文。<\/li>\n<li class=\"s\">按需文件访问：只读任务所需文件；技能可含数十个参考文件，但若只需 sales schema，就只加载该文件，其余零 token。<\/li>\n<li class=\"s\">高效脚本执行：运行 validate_form.py 时代码不进入上下文，只有输出（如 &quot;Validation passed&quot; 或具体错误）消耗 token；比让 Claude 临时生成等效代码更高效。<\/li>\n<li class=\"s\">捆绑内容无实际限制：未访问不消耗上下文，可包含全面 API 文档、大数据集、大量示例；未使用无上下文惩罚。<\/li>\n<\/ul>\n<h5>2.5 示例：自定义 pdf-processing<\/h5>\n<ul>\n<li>启动：系统提示包含描述 &quot;pdf-processing - Extract text and tables from PDF files, fill forms, merge documents. Use when working with PDF files or when the user mentions PDFs, forms, or document extraction.&quot;<\/li>\n<li>用户请求：&quot;Extract the text from this PDF and summarize it&quot;。<\/li>\n<li>Claude 调用：<code>bash: cat pdf-processing/SKILL.md<\/code> → 指令载入上下文。<\/li>\n<li>Claude 判断：不需要填表，因此不读取 FORMS.md。<\/li>\n<li>Claude 执行：用 SKILL.md 指令完成任务。<\/li>\n<\/ul>\n<h4>三、在 Claude API 与各产品面使用<\/h4>\n<h5>3.1 API 使用方式<\/h5>\n<ul>\n<li>Claude API 支持预置和自定义 Skills，两者工作方式相同：在 <code>container<\/code> 参数指定相关 <code>skill_id<\/code>，并配合 code execution tool。<\/li>\n<li class=\"s\">前置条件：通过 API 使用 Skills 需要 code execution tool，Skills 在其容器中运行。<\/li>\n<li class=\"s\">预置：引用 <code>skill_id<\/code>（<code>pptx<\/code>、<code>xlsx<\/code>、<code>docx<\/code>、<code>pdf<\/code>）。<\/li>\n<li class=\"s\">自定义：通过 Skills API（<code>/v1/skills<\/code> endpoints）创建和上传；自定义 Skills 工作区范围共享，所有工作区成员可访问。<\/li>\n<li class=\"s\">API 上的 Skills 运行在沙箱容器：无网络访问、无运行时包安装。<\/li>\n<\/ul>\n<h5>3.2 其他产品面差异<\/h5>\n<ul>\n<li>AWS 上的 Claude Platform 和 Microsoft Foundry 继承与 Claude API 相同的 Skills 行为。<\/li>\n<li>Claude Code：支持自定义 Skills；预置文档 Skills 不可用，但开源 Claude API skill 捆绑其中。<\/li>\n<li class=\"s\">自定义 Skills 以目录和 SKILL.md 存在，Claude 自动发现使用；文件系统型，无需 API 上传；放在 <code>~/.claude/skills/<\/code>（个人）或 <code>.claude/skills/<\/code>（项目）。<\/li>\n<li>claude.ai：支持预置和自定义。<\/li>\n<li class=\"s\">预置在创建文档时激活，无需设置。<\/li>\n<li class=\"s\">自定义通过 Settings &gt; Features 以 zip 上传；需 Pro、Max、Team、Enterprise 计划且启用代码执行；自定义 Skills 个人独有，不组织级共享，管理员不能集中管理。<\/li>\n<\/ul>\n<h4>四、编写 Skill：文件格式与要求<\/h4>\n<ul>\n<li>每个 Skill 都需要 SKILL.md，含 YAML frontmatter：<\/li>\n<li class=\"s\">必需字段：<code>name<\/code> 和 <code>description<\/code>；正文可含 Instructions、Examples。<\/li>\n<li class=\"s\">示例结构：<code>--- name: your-skill-name description: Brief description... --- # Your Skill Name ## Instructions... ## Examples...<\/code><\/li>\n<li><code>name<\/code> 要求：最多 64 字符；只允许小写字母、数字和连字符；不能含 XML 标签；不能含保留词 &quot;anthropic&quot;、&quot;claude&quot;。<\/li>\n<li><code>description<\/code> 要求：非空；最多 1024 字符；不能含 XML 标签。<\/li>\n<li><code>description<\/code> 必须同时说明技能做什么和 Claude 何时使用它。完整编写指南见 Skill authoring best practices。<\/li>\n<\/ul>\n<h4>五、安全与治理<\/h4>\n<h5>5.1 来源原则<\/h5>\n<ul>\n<li>只使用可信来源的 Skills：自己创建或从 Anthropic 获得。<\/li>\n<li class=\"s\">原因：Skills 通过指令和代码给 Claude 新能力；恶意 Skill 可诱导 Claude 以不符合声明目的的方式调用工具或执行代码。<\/li>\n<li class=\"s\">若必须使用不可信或未知来源：极度谨慎，使用前彻底审计；视 Claude 执行时的访问权限，恶意 Skills 可能导致数据外泄、未授权系统访问等安全风险。<\/li>\n<\/ul>\n<h5>5.2 关键安全考量<\/h5>\n<ul>\n<li>彻底审计：检查 Skill 内所有文件——SKILL.md、脚本、图片、资源；寻找异常模式，如意外网络调用、文件访问模式、不符合声明目的的操作。<\/li>\n<li>外部来源风险：从外部 URL 取数据的 Skills 尤其危险，抓取内容可能含恶意指令；即使可信 Skills 也可能因外部依赖变化而被污染。<\/li>\n<li>工具滥用：恶意 Skills 可以有害方式调用工具（文件操作、bash 命令、代码执行）。<\/li>\n<li>数据暴露：能访问敏感数据的 Skills 可能被设计成向外部系统泄露信息。<\/li>\n<li>像安装软件一样对待：集成到可访问敏感数据或关键操作的生产系统时尤其小心。<\/li>\n<\/ul>\n<h5>5.3 企业治理与扫描<\/h5>\n<ul>\n<li>组织规模治理、审查、部署见 Skills for enterprise。<\/li>\n<li>Claude Enterprise 可开启 Skill content scanning，扫描 claude.ai 和 Claude Cowork 中上传的自定义 Skills；不覆盖通过 Skills API 或 Claude Console 上传的 Skills。<\/li>\n<\/ul>\n<h4>六、可用技能与数据留存<\/h4>\n<h5>6.1 可用预置技能<\/h5>\n<ul>\n<li>PowerPoint（<code>pptx<\/code>）：创建演示文稿、编辑幻灯片、分析演示内容。<\/li>\n<li>Excel（<code>xlsx<\/code>）：创建电子表格、分析数据、生成带图报表。<\/li>\n<li>Word（<code>docx<\/code>）：创建文档、编辑内容、格式化文本。<\/li>\n<li>PDF（<code>pdf<\/code>）：生成格式化 PDF 文档和报告。<\/li>\n<li>可用面：Claude API、Claude Platform on AWS、Microsoft Foundry、claude.ai；有 quickstart tutorial。<\/li>\n<li>开源 Skills（skills repository）：<\/li>\n<li class=\"s\">Claude API skill：提供最新 API 参考、SDK 文档和八种编程语言最佳实践；捆绑于 Claude Code，也可从 skills repository 安装。<\/li>\n<li class=\"s\">自定义完整示例见 Skills cookbook。<\/li>\n<\/ul>\n<h5>6.2 数据留存<\/h5>\n<ul>\n<li>Agent Skills 不在 ZDR 安排覆盖范围内；Skill 定义和执行数据按 Anthropic 标准数据留存政策保留。<\/li>\n<li>ZDR eligibility 见 API and data retention；Skills API 操作审计日志见 Audit logging in Using Agent Skills with the API。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>明确边界：自定义 Skills 不跨 surface 同步；共享模型按产品面不同；API 沙箱无网络、无运行时包安装；claude.ai 自定义 Skills 仅个人、不能集中管理或组织分发；扫描不覆盖 Skills API/Claude Console 上传；Agent Skills 不在 ZDR 覆盖范围；Microsoft Foundry 预置技能需部署在 Anthropic。<\/li>\n<li>反例与风险：恶意 Skill、外部 URL 内容、外部依赖变化、工具滥用、数据暴露都可能改变 Skills 的安全适用范围；作者要求只从可信来源使用，并像安装软件一样对待。<\/li>\n<li>未展开或需转指：API 端到端调用细节、预装包清单、扫描范围外治理、企业部署细节，原文均指向其他文档，未在本页完整给出。<\/li>\n<\/ul>","conceptCards":[{"name":"代理技能（Agent Skills）","quotes":["代理技能是扩展 Claude 功能的模块化功能。每个技能都包含指令、元数据和可选资源（脚本、模板），Claude 会在需要时自动使用这些资源。","技能是基于文件系统的可重用资源，赋予 Claude 特定领域的专业知识：工作流程、上下文和最佳实践，使通用代理转变为专家。与提示（针对一次性任务的对话级指令）不同，技能按需加载，因此您无需在不同的对话中重复相同的指导。"],"feynman":"本文把“技能”定义为一种可复用、基于文件系统的能力包，而不是一次性的对话提示。技能里可以放指令、元数据和脚本模板，Claude 在相关任务出现时自动加载。它解决的是“通用代理如何变成特定领域专家”和“如何不重复写同一套指导”的问题。全文的加载方式、文件结构、共享模型、安全边界都围绕这个对象展开。","nodeId":"cm_094c89da"},{"name":"预构建技能与自定义技能（Pre-built vs Custom Skills）","quotes":["Anthropic 提供预置的代理技能，用于处理常见的文档任务（PowerPoint、Excel、Word、PDF），您也可以创建自定义技能。两者的工作方式相同：一旦技能在您的环境中可用，Claude 就会在与您的请求相关时自动使用它。","自定义技能可让您将领域专业知识和组织经验打包在一起。它们适用于 Claude 的所有产品：您可以在 Claude Code 中创建自定义技能，通过 Claude API 上传，或在 claude.ai 设置中添加。"],"feynman":"技能按来源分成两类：Anthropic 提供的预构建文档技能，以及用户自己打包组织经验的自定义技能。关键点是，两类技能在运行方式上没有区别；一旦进入某个环境，Claude 都会在相关时自动使用。但它们的来源、上传方式和后续的共享范围不同，这会影响“谁能用、在哪里用”。","nodeId":"cm_226cbc01"},{"name":"SKILL.md 与 YAML 前置元数据（SKILL.md / YAML frontmatter）","quotes":["Every Skill requires a SKILL.md file with YAML frontmatter","Required fields: name and description","The description must include both what the Skill does and when Claude should use it.","name:","Maximum 64 characters","Must contain only lowercase letters, numbers, and hyphens","Cannot contain XML tags","Cannot contain reserved words: \"anthropic\", \"claude\"","description:","Must be non-empty","Maximum 1024 characters","Cannot contain XML tags"],"feynman":"SKILL.md 是每个技能的入口文件，YAML 前置元数据是技能的“发现层”。其中 <code>name<\/code> 和 <code>description<\/code> 是必需字段，而 <code>description<\/code> 必须同时说明技能做什么、Claude 什么时候该用它。原因是 Claude 靠这段元数据判断是否触发技能。元数据之外的 SKILL.md 正文才承载具体工作流程和指南。字段限制则构成技能定义文件的边界。","nodeId":"cm_d78a3680"},{"name":"技能触发与自动使用（Skill Triggering / Automatic Use）","quotes":["Claude 会根据此元数据来判断是否触发技能，因此它必须同时说明技能的功能和使用时机。","当您请求的内容与技能描述相符时，Claude 会使用 bash 从文件系统中读取 SKILL.md 文件。只有这样，该文件的内容才会显示在上下文窗口中。","一旦技能在您的环境中可用，Claude 就会在与您的请求相关时自动使用它。"],"feynman":"技能不是用户每次手动挑选的，而是 Claude 根据请求与 <code>description<\/code> 的匹配情况自动触发。触发之后，Claude 才会用 bash 读取 SKILL.md，把正文指令带进上下文。这个机制解释了为什么描述必须同时写“功能”和“使用时机”：描述本身就是触发判断的依据。","nodeId":"cm_dc4f803b"},{"name":"渐进式披露（Progressive Disclosure）","quotes":["这种基于文件系统的架构实现了渐进式披露： Claude 根据需要分阶段加载信息，而不是预先获取上下文。","Level 1: Metadata Always (at startup) ~100 tokens per Skill name and description from YAML frontmatter","Level 2: Instructions When Skill is triggered Under 5k tokens SKILL.md body with instructions and guidance","Level 3+: Resources As needed None until accessed Bundled files. Reference files load into context when read. Scripts run through bash, and only their output enters context","Progressive disclosure ensures only relevant content occupies the context window at any given time."],"feynman":"渐进式披露是技能节省上下文的核心机制。技能不是一启动就把全部内容塞进上下文，而是分层加载：启动时只有元数据，触发后才读 SKILL.md 正文，资源文件被引用时才读取，脚本则只把输出带进上下文。这样即使安装很多技能，也只有当前相关的内容占用上下文窗口。","nodeId":"cm_916d7db2"},{"name":"三类内容：说明、代码、资源（Instructions, Code, Resources）","quotes":["技能可以包含三种类型的内容，每种内容的加载时间都不同：","说明：包含专门指导和工作流程的附加 Markdown 文件（FORMS.md、REFERENCE.md）","代码： Claude 使用 bash 运行的可执行脚本（fill_form.py、validate.py），无需将代码加载到上下文中即可提供确定性操作。","Resources: Reference materials such as database schemas, API documentation, templates, or examples","The filesystem model means each content type has different strengths: instructions for flexible guidance, code for reliability, resources for factual lookup."],"feynman":"技能内部不是只有一段说明，而是分成三类内容。说明适合灵活指导；代码通过 bash 执行，只把输出带进上下文，因此可靠且省 token；资源是数据库结构、API 文档、模板、示例等事实材料，被引用时才读取。这个分类决定了每种内容如何加载、为什么能节省成本，以及它们在技能里各自承担什么角色。","nodeId":"cm_5face436"},{"name":"文件系统型代码执行环境（Filesystem-based Code Execution Environment）","quotes":["Skills 利用 Claude 的虚拟机环境，提供仅凭提示无法实现的功能。Claude 在具有文件系统访问权限的虚拟机中运行，使得 Skills 可以以目录的形式存在，其中包含指令、可执行代码和参考资料，其组织方式类似于您为新团队成员创建的入职指南。","Skills run in a code execution environment where Claude has filesystem access, bash commands, and code execution capabilities. Skills exist as directories on a virtual machine, and Claude interacts with them using the same bash commands you'd use to navigate files on your computer.","When a Skill is triggered, Claude uses bash to read SKILL.md from the filesystem, bringing its instructions into the context window."],"feynman":"技能不是纯文本提示，而是放在虚拟机目录里的文件包。Claude 在这个环境中有文件系统访问、bash 命令和代码执行能力，可以像人操作电脑文件一样读取 SKILL.md、引用其他文件、运行脚本。这个环境解释了技能为什么能包含脚本和资源，也解释了为什么脚本代码本身不必进入上下文，只有输出会进入。","nodeId":"cm_07e5e0c3"},{"name":"跨产品面的同步与共享边界（Surface-specific Sync and Sharing）","quotes":["Custom Skills do not sync across surfaces. Skills uploaded to one surface are not automatically available on others:","Skills uploaded to claude.ai must be separately uploaded to the API","Skills uploaded through the API are not available on claude.ai","Claude Code Skills are filesystem-based and separate from both claude.ai and API","Skills have different sharing models depending on where you use them:","claude.ai: Individual user only. Each team member must upload separately.","Claude API: Workspace-wide. All workspace members can access uploaded Skills.","Claude Code: Personal (~/.claude/skills/) or project-based (.claude/skills/). Can also be shared through Claude Code Plugins.","claude.ai does not support centralized admin management or org-wide distribution of custom Skills."],"feynman":"技能在不同产品面之间不会自动同步。上传到 claude.ai 的技能不会自动出现在 API，API 上传的也不会出现在 claude.ai，Claude Code 的技能则基于文件系统，和两者分开。共享范围也不同：claude.ai 是个人级，API 是工作区级，Claude Code 是个人或项目级。理解“技能在哪里可用、谁能看到”必须看这个边界，不能假设一次上传处处可用。","nodeId":"cm_ad086a79"},{"name":"运行时限制、权限与数据保留边界（Runtime Limitations, Constraints, and Retention）","quotes":["The exact runtime environment available to your Skill depends on the product surface where you use it.","Claude API: No network access: Skills cannot make external API calls or access the internet. No runtime package installation: Only pre-installed packages are available. You cannot install new packages during execution.","claude.ai: Varying network access: Depending on user/admin settings, Skills may have full, partial, or no network access.","Claude Code: 完全网络访问权限： Skills 与用户计算机上的任何其他程序具有相同的网络访问权限。不建议进行全局软件包安装： Skills 应该只在本地安装软件包，以避免干扰用户的计算机。","Agent Skills is not covered by ZDR arrangements. Skill definitions and execution data are retained according to Anthropic's standard data retention policy."],"feynman":"技能能做什么，取决于它在哪个产品面运行。API 是沙箱，不能访问网络，也不能在运行时安装新包；claude.ai 的网络权限可能完整、部分或没有；Claude Code 有完整网络权限，但原文不建议全局安装软件包。数据保留方面，Agent Skills 不在 ZDR 覆盖范围内，技能定义和执行数据按标准数据保留政策保留。这些限制决定技能是否可规划、能否联网、能否装包，以及数据如何被保留。","nodeId":"cm_a2868643"},{"name":"安全审计与受信任来源（Security Considerations / Trusted Sources）","quotes":["Use Skills only from trusted sources: those you created yourself or obtained from Anthropic. Skills give Claude new capabilities through instructions and code, which also means a malicious Skill can direct Claude to invoke tools or execute code in ways that don't match the Skill's stated purpose.","If you must use a Skill from an untrusted or unknown source, exercise extreme caution and thoroughly audit it before use. Depending on what access Claude has when executing the Skill, malicious Skills could lead to data exfiltration, unauthorized system access, or other security risks.","Key security considerations:","Audit thoroughly: Review all files bundled in the Skill: SKILL.md, scripts, images, and other resources. Look for unusual patterns such as unexpected network calls, file access patterns, or operations that don't match the Skill's stated purpose","External sources are risky: Skills that fetch data from external URLs pose particular risk, as fetched content may contain malicious instructions. Even trustworthy Skills can be compromised if their external dependencies change over time","Tool misuse: Malicious Skills can invoke tools (file operations, bash commands, code execution) in harmful ways","Data exposure: Skills with access to sensitive data could be designed to leak information to external systems","Treat like installing software: Be especially careful when integrating Skills into production systems with access to sensitive data or critical operations"],"feynman":"安全边界来自技能能通过指令和代码给 Claude 新能力。恶意技能可能让 Claude 以不符合声明目的的方式调用工具、执行代码，导致数据外泄或未授权访问。本文把技能当作要安装的软件来对待，强调来源可信，并要求审计技能包中的所有文件，包括 SKILL.md、脚本、图片和其他资源。外部 URL 风险、工具滥用、数据暴露是这条防御结构里的几个关键边界。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TB\n  subgraph 基础对象层\n    AS[&quot;代理技能 Agent Skills&quot;]\n    PC[&quot;预构建技能 / 自定义技能&quot;]\n    SM[&quot;SKILL.md / YAML 前置元数据&quot;]\n    FS[&quot;文件系统型代码执行环境&quot;]\n  end\n  subgraph 加载运行层\n    TR[&quot;技能触发与自动使用&quot;]\n    PD[&quot;渐进式披露&quot;]\n    CT[&quot;三类内容：说明 / 代码 / 资源&quot;]\n  end\n  subgraph 边界治理层\n    RT[&quot;运行时限制、权限与数据保留边界&quot;]\n    SS[&quot;跨产品面同步与共享边界&quot;]\n    SEC[&quot;安全审计与受信任来源&quot;]\n  end\n  AS --&gt;|&quot;包含&quot;| PC\n  AS --&gt;|&quot;必须包含&quot;| SM\n  AS --&gt;|&quot;以目录形式存在于&quot;| FS\n  SM --&gt;|&quot;description 用于判断&quot;| TR\n  TR --&gt;|&quot;触发后读取 SKILL.md&quot;| PD\n  PD --&gt;|&quot;分阶段加载&quot;| CT\n  FS --&gt;|&quot;提供 bash 与代码执行&quot;| CT\n  FS --&gt;|&quot;受约束于&quot;| RT\n  SS --&gt;|&quot;决定上传与共享&quot;| PC\n  SEC --&gt;|&quot;约束使用&quot;| AS\n  SEC --&gt;|&quot;审计文件与脚本&quot;| SM\n  SEC --&gt;|&quot;关注工具滥用&quot;| FS\n<\/code>``","nodeId":"cm_dc9a27be"}],"feynman":{"short":"技能不是一次性提示，而是文件系统里的文件夹：指令、脚本、资料打包在一起。启动时 Claude 只看到名字和描述；请求匹配描述后，才用 bash 读 SKILL.md，再按需读附件、跑脚本——脚本代码不进上下文，只有输出进入。这就是渐进式披露。","long":"<p>这篇文章回答的是：怎样让 Claude 不靠一次次重复提示，而是自动获得特定领域能力？答案是“代理技能”——把指令、脚本和资料打包成文件系统里的文件夹，Claude 需要时自动使用。<\/p>\n<p>核心机制叫“渐进式披露”：启动时只加载每个技能的名字和描述，约一百词；你的请求匹配描述后，Claude 才用 bash（命令行）读 <code>SKILL.md<\/code> 主说明，再按需读附带文件或运行脚本。脚本代码本身不进上下文，只有输出进入，所以省空间又能带很多资料。<\/p>\n<p>类比：新员工先拿到一张技能清单，真遇到做 PPT 或填 PDF 表格，才翻对应手册、附件和工具，用完不必把整柜文件塞进脑子。<\/p>\n<p>代价是：在 Claude API 上，技能跑在沙盒容器里，没有网络访问，也不能运行时安装新包，只能用预装依赖。所以规划技能时必须顺着这些限制来。<\/p>","rubric":[{"concept":"代理技能（Agent Skills）","points":["说清它是可复用、按需加载的模块化能力包（含指令、元数据与可选资源），而不是一次性的对话级提示","说清它的作用是把通用代理变成特定领域专家，承载工作流程、上下文与最佳实践","提到「一次创建、自动使用」，从而免去在不同对话里重复同一套指导"]},{"concept":"渐进式披露（Progressive Disclosure）","points":["说清内容分阶段进入上下文：先元数据、触发后读指令、资源被引用时才读取","给出层级间的成本差异（元数据约百词、指令不足 5k、未访问资源为零）","说清脚本通过 bash 运行，只有输出进入上下文，代码本身不进入"]},{"concept":"SKILL.md 与 YAML 前置元数据","points":["说清每个技能必须有 SKILL.md，其 YAML 前置元数据中 name 与 description 为必需字段","说清 description 同时承担「做什么」与「何时触发」两件事，是 Claude 判断是否触发技能的依据","至少说出一条格式约束（name 的字符与保留词限制，或 description 的非空与长度上限）"]}]},"oneLine":"Skills 文件系统按需加载；API 靠代码执行工具。"},{"slug":"openai-habitat-storage","no":2,"title":"Rapidly scaling online storage to serve over 1 billion ChatGPT users（存储平台 Habitat 的扩容复盘）","words":11481,"url":"https://openai.com/index/scaling-storage-one-billion-users-part-one/","author":"OpenAI","summary":"OpenAI scaled its online storage to serve over 1 billion ChatGPT users by using Habitat, a simple NoSQL API that avoids costly queries. They switched from Python to Rust, making their service faster and more efficient. Habitat works with Azure Cosmos DB and Rockset to handle massive data and complex queries separately.","fetched":"Reader 快照（2026-09-12）","topic":"超大规模在线存储扩容","stars":5,"starReason":"OpenAI 一手复盘，给出 Python 尾延迟、亚稳态故障等罕见机制细节，且直击十倍速增长下的取舍","why":"它讲的不是「怎么把系统做大」，而是「增长速度每年十倍、来不及优雅重构时怎么做决策」——先欠下 Python 这笔战略技术债，再赌自家模型能完成迁移，并真的赌赢了。文中对 asyncio 调度抖动、功能标志配置打爆 CPU、连接池 LIFO 引发亚稳态故障的定位过程，是可迁移到任何高并发服务的具体排查手法。","metaphor":"一边飞行一边更换引擎的飞机","palette":"sky","paletteBg":"#6A9BCC","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"超大规模在线存储扩容\"><defs><filter id=\"hw85\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"85\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#6A9BCC\"/><path d=\"M 765.4 202.3 Q 812.6 224.5 779.5 246.3 Q 746.5 268.2 734.5 290.1 Q 722.6 312.1 689.7 327.0 Q 656.9 341.9 628.2 361.6 Q 599.5 381.2 552.0 378.2 Q 504.6 375.2 462.4 378.5 Q 420.3 381.8 377.4 377.3 Q 334.5 372.8 305.0 355.6 Q 275.6 338.4 241.8 324.5 Q 208.1 310.7 181.7 291.4 Q 155.3 272.0 170.0 248.2 Q 184.8 224.5 179.9 199.4 Q 175.1 174.3 192.2 151.0 Q 209.3 127.7 245.4 113.9 Q 281.6 100.1 320.3 94.6 Q 359.0 89.1 392.6 80.3 Q 426.2 71.5 463.2 72.2 Q 500.1 72.9 537.9 75.7 Q 575.7 78.5 606.3 92.1 Q 636.9 105.7 665.4 121.2 Q 693.8 136.6 706.0 158.4 Q 718.2 180.1 765.4 202.3 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw85)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(300.5 61.7) scale(325.6)\"><path d=\"M .18 .52 H .74\"/><path d=\"M .74 .52 A .16 .16 0 1 0 .74 .84 A .16 .16 0 1 0 .74 .52\"/><path d=\"M .90 .30 V .74\"/><path d=\"M .78 .34 L .96 .40\"/><path d=\"M .76 .62 L .98 .56\"/><path d=\"M .30 .28 L .54 .52\"/><path d=\"M .30 .76 L .54 .52\"/><\/g><g filter=\"url(#hw85)\"><circle cx=\"756\" cy=\"120\" r=\"9.4\" fill=\"#141413\"/><circle cx=\"564\" cy=\"44\" r=\"7.0\" fill=\"#141413\"/><circle cx=\"362\" cy=\"371\" r=\"8.4\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>Habitat 用受限 API 与 Python 服务撑住超高速增长，最终迁到 Rust。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>如何把 Habitat 从 2023 年一个连单数据库的 Python 客户端库，扩展成每秒 7000 万+ 请求、每周 10 亿+ 用户、500 PB+ 数据的在线存储平台？本文（两篇系列第一篇）聚焦：为何要从库变成独立服务、为何明知不优仍坚持 Python 服务、如何治理其尾延迟、为何主动让 API“做得少”、以及最终如何迁到 Rust。多租户可靠性、读取分层、与 Azure Cosmos DB 的扩容合作留到第二篇。<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、Habitat 面对的问题：规模本身不特殊，增长速度才特殊<\/h4>\n<h5>1.1 产品快慢直接取决于数据访问<\/h5>\n<ul>\n<li>用户登录、查看 Codex 设置、发起对话都要多次独立数据查询；请求慢则产品感觉慢，请求失败则产品完全停止工作。<\/li>\n<\/ul>\n<h5>1.2 作者明说“并非特别具有挑战性”的是规模本身<\/h5>\n<ul>\n<li>Habitat 目前每秒处理 7000 万+ 请求，覆盖近 40 个地理区域，支撑每周 10 亿+ 用户，处理 500 PB+ 数据。<\/li>\n<li>独特之处在工作方式：通常系统工程师按 10 倍规模建设、期望撑几年；Habitat 过去三年每年增长都超过 10 倍。<\/li>\n<li class=\"s\">于是变成一连串策略性决策与步骤：深入了解每个组件底层运作以压榨现有技术栈性能，同时应对存储和计算瓶颈，为基础性投资争取时间。<\/li>\n<\/ul>\n<h5>1.3 Habitat 承担的具体职责<\/h5>\n<ul>\n<li>存储逻辑解耦后，缓存、ACL 授权、部署与数据驻留、加密、多租户隔离、限速请求整形、路由模式查找都由 Habitat 处理。<\/li>\n<li class=\"s\">底层存储资源横跨 Azure Cosmos DB、缓存（Valkey 等）、Blob 存储、CDC 服务、Databricks、Rockset、Kafka 等。<\/li>\n<\/ul>\n<h4>二、从 Python 库变成独立服务<\/h4>\n<h5>2.1 初始形态：一个让产品工程师不必考虑数据库管理的库<\/h5>\n<ul>\n<li>2023 年 DevDay 发布，为支撑 GPT 而生：小型 Python 库，与 ChatGPT 主服务器交互，少量操作在底层映射到 Azure Cosmos DB。<\/li>\n<li>产品工程师无需关心模式查找、路由、授权、加密、序列化、请求整形、连接池，甚至无需考虑数据来自 Cosmos DB、缓存还是其他存储。<\/li>\n<li>采用情况：OpenAI 并未集中推动弃用自建 Postgres 和 Cosmos DB，但库运行良好、被产品工程师迅速采用；产品开发者还能轻松往共享库加客户端缓存、压缩、加密。<\/li>\n<\/ul>\n<h5>2.2 库形态在 2025 年年中触顶<\/h5>\n<ul>\n<li>随着 Habitat 层变复杂、服务数量增加，向后兼容的协议变更已不可行。<\/li>\n<li>典型案例：为缩小单区域中断影响，要把最关键数据集迁到一组区域分布的 Cosmos DB 账户，需要在客户端加路由逻辑、用功能标志禁用、确保所有客户端已部署、再启用。<\/li>\n<li class=\"s\">协调数十个服务部署并与各团队上线耗费数天；意识到需加影子机制验证分片正确性又花数天；修复发现的 bug 又数天；终于要启用时，某团队因与缺陷客户端无关的原因回滚了服务，造成他们竭力避免的服务中断。<\/li>\n<li>结论：客户端库变更需要数十个服务复杂协调，越来越脆弱、低效、易出运行故障。<\/li>\n<\/ul>\n<h5>2.3 服务化的两个收益<\/h5>\n<ul>\n<li>建立部署、可观测性、平台增强的单一控制点：改进可集中实施、立即惠及每个 OpenAI 产品，而非管理分散更新。<\/li>\n<li>集中提供最强的数据安全与隐私机制：集中执行访问控制策略、审计日志，并限制对底层存储资源的访问。<\/li>\n<li class=\"s\">作者定位 Habitat 在防止外部、内部和代理的未授权访问中“发挥着至关重要的作用”。<\/li>\n<\/ul>\n<h4>三、用 Python 撑住规模：承担战略技术债，主攻尾延迟<\/h4>\n<h5>3.1 明知不优仍选 Python，是刻意的取舍<\/h5>\n<ul>\n<li>相比库内执行，Python 跑高吞吐服务会增加网络延迟、显著抬高 CPU 和内存扩展成本；作者判断 Python 的低效在 100 倍规模下不可接受，最终几乎肯定需要重写。<\/li>\n<li>但当时视其为“战略性的技术债务承担”：首要目标不是成本或资源优化，而是为产品开发者扫清障碍、实现平台稳定性。<\/li>\n<li class=\"s\">接受短期性能妥协，是为了优先建立核心 API、构建强大的基础设施。<\/li>\n<li>另一个深思熟虑的赌注：自身编码模型的快速发展会简化技术路径——到必须完全从 Python 迁移时，Codex 和 GPT 会使迁移成为可能。作者称“最终，这个赌注被证明是正确的”。<\/li>\n<\/ul>\n<h5>3.2 主要挑战是尾部延迟<\/h5>\n<ul>\n<li>当平均每个用户请求会引发数百次数据库调用，“用户感受到的延迟往往是最慢的那次”。<\/li>\n<\/ul>\n<h5>3.3 治理一：把 asyncio 调度延迟当成一等指标<\/h5>\n<ul>\n<li>asyncio 能并发处理 I/O 密集型负载，但无法绕过 GIL、不提供 CPU 并行性；Habitat 除 I/O 请求代理外还做路由、压缩、加密、校验和计算、下游健康检查、请求影子和对冲等 CPU 密集与后台任务。<\/li>\n<li>观察：初始服务上线前调优时，p99 及以上请求的跟踪显示，下游存储响应迅速，但请求常因等待负责解析响应的协程重新调度而停滞。<\/li>\n<li>手段：定期调度后台任务、记录预期与实际执行时间之差，实时实证测量事件循环调度延迟。<\/li>\n<li class=\"s\">量化：高利用率且有大量耗时任务时，即使每进程并发数不多，调度抖动也可达数百毫秒，极端情况达数秒。<\/li>\n<li class=\"s\">对策：让每个进程只处理少量并发请求，然后大规模扩展 Python 工作进程数量。<\/li>\n<\/ul>\n<h5>3.4 治理二：功能标志配置引发的尾延迟<\/h5>\n<ul>\n<li>上线初期通过实时服务 CPU 分析找到根因：Statsig 定期解析功能标志配置 JSON。<\/li>\n<li class=\"s\">默认每分钟无抖动轮询一次，且配置包含所有服务的所有生产规则；叠加“每个 Pod 跑最多 8 个 Python 进程”的架构决定。<\/li>\n<li class=\"s\">合并后果：每个 Pod 每分钟都有某一刻，所有工作进程停止处理进行中请求，把 CPU 周期用于解析一个庞大配置文件。<\/li>\n<li>修复简单：部署更小的目标配置、延长刷新间隔、给这类后台任务加抖动。<\/li>\n<\/ul>\n<h5>3.5 治理三：负载均衡与连接池（LIFO→FIFO）<\/h5>\n<ul>\n<li>不调整的话，连接池会与“保持低 asyncio 延迟”背道而驰：单个客户端进程即使并发请求很多，也可能只建立少数几条服务器连接，把负载压到少数进程上。<\/li>\n<li class=\"s\">调整前服务利用率波动很大，一些尾部进程处理的并发请求数是平均水平的 5 到 10 倍。<\/li>\n<li>偶然发现：停掉导致部分服务过载的客户端后，某些进程在突发流量过后仍处于降级状态，并“失控降级”——接收越来越多请求，直到被重启。<\/li>\n<li class=\"s\">团队中有人在前一份工作中熟悉这类故障：亚稳态故障（metastable failure）。<\/li>\n<li>验证路径：怀疑连接池 → 限制最大连接重用持续时间 → 性能下降确实被缓解 → 确认方向。<\/li>\n<li>根因是 Python aiohttp TCPConnector 默认采用 LIFO 连接重用（选最近返回的连接）。<\/li>\n<li class=\"s\">该默认通常合理：重用最近连接可避免为突发流量创建的额外连接超时，减少维护开销。<\/li>\n<li class=\"s\">但在此构成反馈回路：请求激增时，发给较慢、过载服务器的请求更晚才把连接还回池子，后续请求于是更频繁选中这些连接，把更多流量集中到已不堪重负的 Pod。<\/li>\n<li class=\"s\">改为 FIFO 打破了反馈循环，还降低了稳态下的请求波动。<\/li>\n<li>现状：如今主要依靠 Istio 和 Envoy 在全基础设施提供连接池和更好的服务器负载感知均衡策略，完全避免该问题。<\/li>\n<\/ul>\n<h5>3.6 治理四：避免“雷霆之群”淹没下游<\/h5>\n<ul>\n<li>低 asyncio 延迟 + 大量 Python 进程的副作用：很容易用海量连接压垮下游依赖。<\/li>\n<li class=\"s\">例子：一次没调慢的日常部署，就可能因连接反复建立/断开造成显著 CPU churn；一次连接泄漏就可能打满 NAT 网关拖垮网络。<\/li>\n<li class=\"s\">作者判断：这问题其他服务也有，但进程数多一个数量级会显著降低触发阈值，常打满客户端在稳态下按纯吞吐量并不预期需要处理的网络相关资源。<\/li>\n<li>手段：用 Envoy 最大化连接聚合（fan-in）——把 Python 的 HTTP/1 连接升级到 HTTP/2 以利用多路复用，再池化并延长连接寿命。<\/li>\n<li class=\"s\">Envoy 也是集中实现限流和熔断的地方，作者判断这些放在每个独立 Python 进程里效果会更差。<\/li>\n<\/ul>\n<h4>四、“Habitat 做得少”是能撑住 Python 规模的前提<\/h4>\n<h5>4.1 受限 API 让请求成本可预测<\/h5>\n<ul>\n<li>不允许客户端构造任意 SQL（可能大表扫描、跨多表 join），只暴露简单 NoSQL API；“缺乏强大的 API”是 Habitat 设计中的明确取舍。<\/li>\n<li>目标：优化简单、可预测、恒定工作量的请求。作者判断这类系统明显更容易扩展、更难被用错或误用；不可预测扇出的请求在运维上很危险——复杂化隔离与负载均衡，并引入服务和客户端都难扩展的延迟悬崖。<\/li>\n<\/ul>\n<h5>4.2 代价的历史来源：Postgres 时期的“成本失衡”<\/h5>\n<ul>\n<li>迁到 Habitat + Cosmos DB 前，OpenAI 大多在线数据存于 Postgres。<\/li>\n<li class=\"s\">当时容易审查所有查询与模式变更，确保行为良好、走索引后才上线。<\/li>\n<li class=\"s\">随团队和产品增长，这迅速变得不可管理，成为频繁故障来源：热路径上一条昂贵的新查询就能打挂数据库。<\/li>\n<li>作者概括问题本质为成本失衡：写一条又贵又难跑的 SQL 查询既便宜又容易。Habitat 要让昂贵查询在客户端就极其显眼。<\/li>\n<li class=\"s\">没有能压垮 Habitat 的无界查询；复杂 join 和图上遍历需要产品团队自己承担一部分重活，从而整体优化出更高效的设计。<\/li>\n<\/ul>\n<h5>4.3 具体模型与它的能力边界<\/h5>\n<ul>\n<li>NoSQL API 围绕客户端定义的对象与边类型，灵感来自 TAO；客户端预定义对象、边及其关联，但不定义每种类型的内容。<\/li>\n<li class=\"s\">关系看起来像图，但 Habitat 本身除查询某对象的直接边外，不支持典型的图遍历查询。<\/li>\n<li>分区方式：把每个对象及其对应的边共置在一个存储级分区，但不在数据库层面刻意让对象与其边指向的远端对象同址。<\/li>\n<li class=\"s\">结果：模型易于水平扩展分区，但图遍历低效——任意一跳都可能需跨区域从两个完全不同的 Cosmos DB 账户取数。<\/li>\n<\/ul>\n<h5>4.4 复杂查询的“逃生舱”：Rockset 离线副视图<\/h5>\n<ul>\n<li>用变更数据捕获（CDC）把在线存储的变更近实时流到隔离的 Rockset 实例；每个客户端团队自行为自己复杂查询需求扩容其 Rockset 实例。<\/li>\n<li>作者承认这给客户带来额外摩擦，但认为在此刻是正确的取舍：让简单查询成为默认，同时为需要复杂查询者留逃生舱，并把在线存储与读重的分析、搜索负载隔离开。<\/li>\n<\/ul>\n<h4>五、从 Python 迁移到 Rust：赌注兑现<\/h4>\n<ul>\n<li>把 Python 重写推迟一年，让团队在超高速增长期专注于更紧急、更有影响的问题。<\/li>\n<li class=\"s\">背景：Habitat 已是 OpenAI 按核数第二大的服务（Envoy 足迹第四）；峰值时 Python 帮他们每秒服务超过 2000 万请求。<\/li>\n<li>2026 年 Q2，仅 2 名工程师 + Codex + GPT-5.5，把整个服务用 Rust 重写。<\/li>\n<li class=\"s\">新 Rust 服务已处理 95% 生产请求，未来几周将完全弃用 Python。<\/li>\n<li class=\"s\">数据：Rust 版 CPU 效率高 6 倍、内存效率高 15 倍，平均和尾部延迟显著更低；计划在后续博客分享更多。<\/li>\n<li>作者明确本文边界：Python（现 Rust）服务只是 Habitat 的一面；第二篇将讲存储层，以及 Habitat 如何服务 500 PB+ 和每秒 7000 万+ 请求。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>规模本身不是难点——作者明说“构建和运营如此大规模的基础设施绝非易事，但也并非特别具有挑战性”，独特之处是必须在构建成熟平台的同时以前所未有的速度扩展。<\/li>\n<li>Python 服务被作者自认为从性能角度“并非最优”，且 100 倍规模下不可接受；这是主动承担的技术债，而非未察觉的问题。<\/li>\n<li>“编码模型会成熟到能完成迁移”是一个赌注，作者称事后被证明正确——属于事后叙述，未见当时量化依据。<\/li>\n<li>受限 API、图遍历低效、Rockset 逃生舱的额外摩擦都是作者承认的取舍，不是遗漏。<\/li>\n<li>亚稳态故障的叙述带有偶然发现色彩；作者用“怀疑—验证—根因”链条推进，而非一开始就定位。<\/li>\n<li>存储层细节、多租户可靠性、读取分层、Cosmos DB 扩容合作明确留到第二篇，本文未给出。<\/li>\n<\/ul>","conceptCards":[{"name":"每年超过 10 倍增长","quotes":["通常，系统工程师会以 10 倍的规模进行构建，并希望它能维持几年，同时为下一个 10 倍的增长做好准备。而我们，在过去三年中，每年都实现了超过 10 倍的增长。"],"feynman":"这是全文的问题设定。Habitat 不是在一个稳定规模上慢慢优化，而是每年规模增长超过 10 倍，所以团队必须在超增长过程中同时建设平台。这个约束解释了后文为什么会出现战略性技术债务、服务化、约束 API 和快速重写等选择。","nodeId":"cm_be0d6099"},{"name":"Habitat（在线存储平台）","quotes":["Habitat 是我们构建的在线存储平台，旨在让 OpenAI 产品能够快速可靠地访问所需信息。Habitat 目前每秒处理超过 7000 万个请求，为每周超过 10 亿用户使用的产品提供支持，覆盖近 40 个地理区域。","> Habitat 最初于 2023 年的 DevDay 大会上发布，旨在支持 GPT 模型，最初只是一个简单的 Python 客户端库，连接到单个数据库。如今，它已发展成为一个复杂的分布式系统，能够处理超过 500 PB 的数据。"],"feynman":"Habitat 是 OpenAI 产品与底层存储之间的平台。产品工程师不必关心数据库管理、路由、授权、加密、序列化、请求整形和连接池等问题。全文讨论的扩容、服务化、Python 性能、API 约束、Rust 重写，都是围绕 Habitat 如何从一个 Python 库长成大规模在线存储平台展开的。","nodeId":"cm_1da0e9a6"},{"name":"从客户端库到独立服务（统一控制点）","quotes":["到 2025 年年中，Habitat 作为客户端实现已达到其极限。","> 通过将存储逻辑解耦为独立服务，我们建立了一个统一的控制点，用于部署、可观测性和平台增强。"],"feynman":"原先把 Habitat 做成客户端库时，任何改动都要推动许多产品服务一起部署、回滚和上线，协调成本高且脆弱。把存储逻辑变成独立服务后，部署、观测和平台增强集中在一个控制点，改进可以立即惠及所有 OpenAI 产品。这是全文架构转折点。","nodeId":"cm_8ff0bd7e"},{"name":"集中式数据安全与隐私控制点","quotes":["集中式服务为我们提供了一个统一的控制点，从而能够提供最强大的数据安全和隐私保护机制。通过 Habitat 服务，我们可以集中执行访问控制策略、执行审计日志记录，并限制对底层存储资源（例如 Azure Cosmos DB）的访问。"],"feynman":"Habitat 作为独立服务后，访问控制策略、审计日志和对底层存储资源的访问限制都集中在一层执行。这样，外部、内部和代理的未授权访问都要先经过 Habitat 的权限边界。拿掉这个控制点，读者就无法理解服务化在安全与隐私上的承重作用。","nodeId":"cm_7a436f8a"},{"name":"约束型 API 与成本不平衡","quotes":["One reason we could scale Python this far was Habitat’s constrained API, which keeps request cost predictable.","> The problem here is in cost imbalance: it is cheap and easy to write SQL queries that are expensive and hard to run. In Habitat, we avoid this and make expensive queries exceedingly obvious client-side.","> 我们旨在优化简单、可预测、恒定工作量的请求。"],"feynman":"写一条 SQL 查询很便宜，但让它高效运行可能很贵；一条热路径上的昂贵查询就可能拖垮数据库。Habitat 不开放任意 SQL，而提供简单 NoSQL API，使请求成本可预测、工作量恒定。这个约束是 Python 服务能扩展到很大规模的原因之一，也是 Habitat 设计中的明确取舍。","nodeId":"cm_6c8463ad"},{"name":"对象-边模型与分区","quotes":["Habitat exposes a NoSQL API modeled around client-defined object and edge types, inspired by TAO. Clients predefine objects and edges and how they relate to each other, but not the content of each type. The resulting relationships resemble a graph, but Habitat itself does not support typical graph traversal queries outside of querying direct edges of a particular object.","> We partition this graph so that each object and its corresponding edges are colocated in a storage-level partition, but we make no concerted database-level effort to colocate objects and the remote objects to which their edges point."],"feynman":"Habitat 的数据模型像图：客户端预先定义对象和边，但只能查某个对象的直接边，不支持典型图遍历。分区时，每个对象和它的边放在同一存储分区，便于水平扩展；但不保证远程对象也同区，所以跨对象跳转可能跨区域，图遍历效率低。这解释了约束 API 的边界在哪里。","nodeId":"cm_fccba9a9"},{"name":"Rockset 离线二级视图（CDC 逃生舱）","quotes":["For clients with more complex querying needs, we do provide an offline secondary view of Habitat exposed via Rockset. We use change data capture (CDC) to stream changes from the online storage out to isolated Rockset instances in near-real-time.","> making simple queries the default while providing an escape hatch for those who need complex queries."],"feynman":"Habitat 把简单查询作为默认路径，复杂查询通过变更数据捕获同步到隔离 Rockset 实例，由客户团队自行扩展。这样在线存储与读很重的分析、搜索负载隔离开来。它是约束型 API 的配套逃生舱，防止复杂查询破坏在线存储的可预测性。","nodeId":"cm_5676c394"},{"name":"战略性技术债务：Python 服务","quotes":["我们当时将此视为一种战略性的技术债务承担。我们的首要目标并非成本或资源优化，而是为产品开发人员扫清障碍，实现平台稳定性。","> 我们还做出了一个经过深思熟虑的赌注：我们自身编码模型的快速发展将在未来简化技术路径。我们预测，到需要完全从 Python 迁移的时候，Codex 和 GPT 将会使这种迁移成为可能。最终，这个赌注被证明是正确的。"],"feynman":"用 Python 跑高吞吐服务会增加网络延迟、CPU 和内存成本，100 倍规模下几乎肯定要重写。但团队优先建立核心 API 和基础设施，把性能优化延后，作为战略性技术债务。这个选择是理解为何 Habitat 先用 Python、后来又迁移到 Rust 的关键。","nodeId":"cm_e66df281"},{"name":"asyncio 调度延迟与尾部延迟","quotes":["当平均每个用户请求都会导致数百次数据库调用时，用户感受到的延迟往往是最慢的那次。我们发现，在这种规模下运行 Python 服务的主要挑战在于如何管理这些尾部延迟。","> 由于我们的服务中包含大量 CPU 密集型工作负载和后台任务，asyncio 调度延迟很容易导致尾部请求延迟过高。"],"feynman":"一个用户请求可能触发数百次数据库调用，总体验由最慢的调用决定，这就是尾部延迟。Python 的 asyncio 能并发处理 I/O，但不能绕过 GIL 提供 CPU 并行性；CPU 密集任务会让事件循环上其他协程等待，产生调度抖动，放大尾部延迟。因此 Habitat 限制每个进程并发请求数，并大规模扩展 Python 工作进程。","nodeId":"cm_983f29fd"},{"name":"亚稳态故障与 LIFO/FIFO 连接重用","quotes":["尽管我们停止了导致部分服务过载的客户端，但部分进程在突发流量过后仍然处于降级状态。事实上，我们注意到这些进程出现了失控降级，接收到的请求越来越多，直到我们重启它们为止。一旦某个 Pod 过载，某些行为就会将更多流量集中到过载的 Pod 上。我们的一些团队成员在之前的工作中已经熟悉这类故障：亚稳态故障。","> Python 的 aiohttp TCPConnector 默认采用后进先出 (LIFO) 的连接重用机制：即选择最近返回的连接用于下一个请求。","> 在请求激增期间，对速度较慢、负载过重的服务器的请求会稍后才将连接返回到连接池，因此后续请求会更频繁地选择这些连接，从而逐渐将更多流量集中在已经不堪重负的 Pod 上。将连接池修改为使用先进先出 (FIFO) 的连接重用机制打破了这种反馈循环，甚至还降低了我们稳定状态下的请求波动。"],"feynman":"亚稳态故障是指外部触发压力消失后，系统仍卡在坏状态。这里，慢 Pod 最后才把连接归还连接池，而 LIFO 又优先重用最近归还的连接，于是后续请求更频繁地打向慢 Pod，流量越来越集中。FIFO 打破这个正反馈，使连接和工作负载更公平地分配。它是理解连接池为什么会影响尾部延迟和稳定性的机制边界。","nodeId":"cm_cbbe3f8e"},{"name":"连接扇入（Envoy / 雷霆之群）","quotes":["调整为降低 asyncio 延迟并拥有如此多的 Python 进程的一个副作用是，很容易使下游依赖项被大量的连接压垮（被称为“雷霆之群”）。","> We also rely on Envoy to maximize our connection fan-in. We use it to upgrade Python’s HTTP/1 connections to HTTP/2 to take advantage of multiplexing and then to pool those connections and extend connection lifetimes. Envoy also gives us a central place to implement rate limits and circuit breakers that would be less effective in each standalone Python process."],"feynman":"为了降低 asyncio 延迟，Habitat 增加了很多 Python 进程，但进程一多，连接数会暴涨，容易形成雷霆之群，压垮下游依赖或 NAT 网关。Envoy 把 HTTP/1 连接升级为 HTTP/2，利用多路复用、连接池和更长连接寿命，把相同请求合并到更少连接上，并集中实现限流和熔断。它保护下游，也支撑了 Python 服务的大规模进程模型。","nodeId":"cm_f8c2e9ae"},{"name":"迁移到 Rust（Python→Rust）","quotes":["In Q2 2026, with just 2 engineers, Codex, and GPT‑5.5, we were able to rewrite the entire service in Rust. This new Rust service is now handling 95% of our production requests; we’ll be deprecating Python entirely in the coming weeks. Our data shows the Rust service is 6x more CPU efficient and 15x more memory efficient than the Python version, with significantly lower average and tail latencies."],"feynman":"这是战略性技术债务的收束。平台成熟、增长继续加速，团队终于把 Python 服务重写为 Rust。两名工程师借助 Codex 和 GPT-5.5 完成整个服务重写，Rust 服务处理 95% 生产请求，并且 CPU 效率、内存效率和延迟都显著优于 Python。它验证了先前“未来编码模型会让迁移成为可能”的赌注。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TD\n  subgraph P[问题与目标层]\n    A[&quot;每年超过 10 倍增长&quot;]\n    B[&quot;尾部延迟&quot;]\n    C[&quot;集中式数据安全与隐私控制点&quot;]\n  end\n\n  subgraph S[架构选择层]\n    D[&quot;Habitat 在线存储平台&quot;]\n    E[&quot;从客户端库到独立服务（统一控制点）&quot;]\n    F[&quot;约束型 API 与成本不平衡&quot;]\n    G[&quot;战略性技术债务：Python 服务&quot;]\n  end\n\n  subgraph M[机制与边界层]\n    H[&quot;asyncio 调度延迟&quot;]\n    I[&quot;亚稳态故障与 LIFO/FIFO 连接重用&quot;]\n    J[&quot;连接扇入（Envoy / 雷霆之群）&quot;]\n    K[&quot;对象-边模型与分区&quot;]\n    L[&quot;Rockset 离线二级视图 / CDC&quot;]\n  end\n\n  subgraph R[结果层]\n    N[&quot;迁移到 Rust&quot;]\n  end\n\n  A --&gt;|迫使| D\n  D --&gt;|需要| E\n  E --&gt;|集中执行| C\n  D --&gt;|采用| F\n  F --&gt;|支撑| G\n  G --&gt;|引入| H\n  H --&gt;|放大| B\n  I --&gt;|恶化| B\n  J --&gt;|保护下游，支撑多进程| G\n  F --&gt;|定义| K\n  F --&gt;|复杂查询出口| L\n  L --&gt;|隔离读重负载| D\n  E --&gt;|使能重写| N\n  N --&gt;|替换| G\n<\/code>``","nodeId":"cm_74099998"}],"feynman":{"short":"Habitat 是 OpenAI 产品背后的在线存储平台：从各产品自带的 Python 小库解耦成独立服务，换来部署、观测与权限的单一控制点；接口故意做少，只给成本可预测的简单请求；明知 Python 不优仍用它换速度，靠小并发多进程和 FIFO 连接重用压尾部延迟，最后重写成 Rust。","long":"<p>OpenAI 讲的是存储平台 Habitat 如何在三年里每年增长十倍，撑住每周十亿用户、每秒七千万次请求。答案是把存储逻辑从各产品自带的 Python 小库抽出来，变成集中式服务，统一管路由、授权、加密、缓存和数据来源。<\/p>\n<p>关键机制是故意“做少”：只提供简单 NoSQL 接口，不开放任意 SQL，让每个请求开销可预测。为抢速度，他们明知 Python 不优仍用它当战略负债——每个进程只处理少量并发，靠大量进程扛吞吐；修掉功能标志定时解析带来的卡顿；把连接复用从后进先出改成先进先出，打断慢服务器越接越多请求的循环。最后靠 Codex 和 GPT‑5.5，两名工程师把服务重写成 Rust，CPU 效率提升六倍。<\/p>\n<p>类比：以前每户自己管水电，现在改成统一物业，但物业只准用小功率电器；谁要复杂查询，得自己去外面租 Rockset。<\/p>\n<p>作者承认的代价正是这个：API 不强大是明确取舍，复杂遍历效率低，客户还得自己维护 Rockset，平添麻烦。<\/p>","rubric":[{"concept":"从客户端库到独立服务（统一控制点）","points":["能指出库形态的具体失效场景：协议变更要协调多个服务部署上线，并存在被无关团队回滚的风险","能说明服务化的收益落在部署、可观测性与平台增强的单一控制点，改进可一次性惠及所有产品","能提到服务层同时承担集中式权限边界：访问控制、审计日志以及对底层存储访问的限制"]},{"concept":"约束型 API 与成本不平衡","points":["能点出不开放任意 SQL、只提供简单可预测请求这一取舍，并把它与可扩展性联系起来","能用成本失衡解释动机：写昂贵查询便宜又容易，让昂贵查询被及时发现很难，因此要让昂贵操作在客户端显眼","能承认能力边界：不支持典型图遍历，复杂查询走 CDC 到隔离的离线副视图，并给客户带来额外摩擦"]},{"concept":"战略性技术债务：Python 服务与尾部延迟","points":["能说明选 Python 是主动承担技术债：优先平台稳定与核心 API，而非成本与资源优化，并承认 100 倍规模下不可接受","能解释尾部延迟为何成为主战场：请求由数百次调用组成、体验取决于最慢一次，受 GIL 限制的调度抖动会放大尾延迟","能复述赌注及其兑现：编码模型成熟使迁移可行，最终由极少数工程师完成重写并成为主路径，效率数据显著提升"]}]},"oneLine":"Habitat 用受限 API 与 Python 服务撑住超高速增长，最终迁到 Rust。"},{"slug":"baoyu-ai-native-workflow","no":3,"title":"我的 AI 原生开发流程：一个真实案例的完整复盘","words":6681,"url":"https://baoyu.io/blog/2026-08-24/ai-native-dev-workflow","author":"宝玉","summary":"AI 原生开发没有抛弃传统流程，而是让人负责关键判断、让 Agent 执行分析、设计、编码与验证；本文用 BaoCut 远程转录功能完整复盘这套工作方式。","fetched":"直抓原文（Reader 快照仅 79 字，正文为 JS 渲染未同步）（2026-09-12）","topic":"AI 原生开发流程","stars":5,"starReason":"用一个真实功能复盘全流程，给出各环节谁做判断谁做执行的机制细节，一手且通用。","why":"多数人只谈 AI 写代码，这篇把变化定位在编码之外的可行性、设计、原型与验证，并说明为何确认流程需要重估。可作为团队改造研发流程的对照样本。","metaphor":"一个人站在指挥台上指挥一排机械臂作业","palette":"heather","paletteBg":"#CBCADB","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"AI 原生开发流程\"><defs><filter id=\"hw58\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"58\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#CBCADB\"/><path d=\"M 794.4 211.0 Q 827.7 236.1 812.6 261.2 Q 797.5 286.3 778.6 309.8 Q 759.8 333.3 722.0 349.0 Q 684.2 364.7 644.8 377.0 Q 605.4 389.4 562.2 398.0 Q 519.0 406.7 473.1 403.9 Q 427.3 401.0 388.7 389.0 Q 350.1 376.9 309.6 368.2 Q 269.2 359.4 232.5 344.5 Q 195.9 329.6 177.2 307.1 Q 158.5 284.6 164.1 260.4 Q 169.8 236.1 169.8 209.8 Q 169.9 183.5 197.7 162.8 Q 225.6 142.1 264.3 131.2 Q 303.1 120.3 331.9 105.7 Q 360.7 91.1 399.3 92.7 Q 437.9 94.2 474.8 84.2 Q 511.6 74.2 544.4 87.2 Q 577.2 100.1 613.6 107.3 Q 650.1 114.5 689.4 126.5 Q 728.6 138.5 744.9 162.2 Q 761.1 185.9 794.4 211.0 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw58)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(309.6 73.3) scale(325.6)\"><path d=\"M .10 .86 H .90\"/><path d=\"M .22 .86 V .66\"/><path d=\"M .22 .66 L .44 .34\"/><path d=\"M .44 .34 L .68 .46\"/><path d=\"M .68 .46 L .84 .30\"/><path d=\"M .78 .24 L .90 .28 L .86 .40\"/><path d=\"M .48 .86 V .74\"/><path d=\"M .62 .86 V .78\"/><path d=\"M .76 .86 V .80\"/><\/g><g filter=\"url(#hw58)\"><circle cx=\"193\" cy=\"225\" r=\"6.7\" fill=\"#141413\"/><circle cx=\"148\" cy=\"321\" r=\"10.2\" fill=\"#141413\"/><circle cx=\"424\" cy=\"416\" r=\"8.8\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>AI 原生开发流程没变，变的是执行主体——人成了指挥官。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>AI 到底怎样改变了软件开发？在一个真实功能开发案例中，哪些环节变了、哪些没变，人该把精力放在哪里。<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、核心认知：流程没变，角色变了<\/h4>\n<h5>1.1 不变的是流程，变的是执行主体<\/h5>\n<ul>\n<li>AI 原生开发本质上还是传统流程：可行性分析、方案设计、原型设计、编码实现、测试验证，一个都没少。<\/li>\n<li class=\"s\">变的是执行主体：人变成指挥官，Agent 变成执行者；人只在关键路径做确认和决策，具体分析、设计、编码、调试交给 Agent。<\/li>\n<li class=\"s\">比喻：&quot;你从一线程序员升级成了技术总监。&quot;<\/li>\n<\/ul>\n<h5>1.2 编码反而是变化最小的环节<\/h5>\n<ul>\n<li>作者判断：写代码在整个流程中只是环节之一，且在 AI 时代变化最小、最不需要操心。<\/li>\n<li class=\"s\">依据：大模型在编码方面&quot;已经训练得极好了&quot;，简单自然语言提示词就够了。<\/li>\n<li class=\"s\">真正有意思的变化在代码之外：需求分析、方案设计、原型、测试。<\/li>\n<\/ul>\n<h4>二、案例五关：远程转录功能的完整流程<\/h4>\n<p>案例背景：用户 GitHub Issue 提需求，要在电脑 B 上使用 BaoCut 时把转录任务丢给算力强的电脑 A 跑；作者判断场景合理、有价值、与产品定位吻合。<\/p>\n<h5>2.1 可行性分析——先决定要不要做<\/h5>\n<ul>\n<li>这是&quot;整个流程中最容易被跳过、但最不该被跳过的一步&quot;，先决定要不要做，再去做。<\/li>\n<li class=\"s\">反例：作者前几天做的&quot;用本地文本模型辅助拆分对齐字幕&quot;功能，可行性分析觉得技术没问题，做完体验很糟糕，最终砍掉，&quot;浪费了好几天时间和一堆 token&quot;。<\/li>\n<li class=\"s\">作者对可行性分析的定性：&quot;它是一个期望值的赌注：大部分时候能帮你避开弯路，偶尔也会看走眼。&quot;<\/li>\n<li>看两个层面：产品角度（价值、与 App 定位是否匹配）、技术角度（能否做到、成本是否可控）。<\/li>\n<li class=\"s\">本例产品层面已判断值得做，故只聚焦技术可行性。<\/li>\n<li>模式：Agent 做分析和罗列方案，人做最终判断拍板。<\/li>\n<li class=\"s\">Claude Code 结合项目现状分析后判断&quot;可行&quot;并列方案。<\/li>\n<li class=\"s\">方案 0 和方案 C：不需改代码，但要自己搭 ASR 服务器，普通用户玩不转，对用户太不友好。<\/li>\n<li class=\"s\">方案 A 最优：装了 App 就能启动自己的转录服务，对用户最简单。<\/li>\n<li class=\"s\">方案 B：对 Windows 不够友好。<\/li>\n<li class=\"s\">决定按方案 A 推进，同时加上方案 0 中&quot;提供 HTTP 转录 API&quot;的附加功能。<\/li>\n<\/ul>\n<h5>2.2 设计文档——Agent 之间的桥梁<\/h5>\n<ul>\n<li>关键认知：文档在 AI 时代有了全新角色——人和 Agent 之间、Agent 和 Agent 之间的桥梁，是&quot;记忆载体&quot;。<\/li>\n<li class=\"s\">原因一：文档是给人确认和修改的载体，可通读、看方向、直接在文档上改。<\/li>\n<li class=\"s\">原因二：文档是 Agent Session 之间传递上下文的媒介；每个 Session 上下文窗口有限，从&quot;设计&quot;进入&quot;开发&quot;往往是新 Session，没有文档就是&quot;从零开始&quot;。<\/li>\n<li>本例写的是产品设计和技术设计的混合体：需求是什么、架构怎么设计、接口怎么定义。<\/li>\n<li>关键操作细节：确认后的文档就是下一个 Agent Session 的全部起点，只需一句&quot;按 docs/remote-transcription.md 实现&quot;。<\/li>\n<li>理想状态：每阶段结束都应生成可留档交付物（需求文档、设计方案、原型设计、代码和测试），并与 git 等版本管理结合，交付物本身还可作审计记录：谁提的需求、Agent 产出了什么、谁批准了它。<\/li>\n<li>作者自陈的偷懒与边界：这次设计文档写完后直接去做原型，因为可行性阶段的方案没问题且信任 Fable 5；更复杂的项目应仔细审查设计文档，&quot;这个成本远低于写完代码再推翻&quot;。<\/li>\n<\/ul>\n<h5>2.3 高精度原型设计——需求、原型、UI 三合一<\/h5>\n<ul>\n<li>这是作者认为 AI 原生开发中变化最大的环节之一。<\/li>\n<li class=\"s\">传统流程中需求文档、原型设计、UI 设计是三个独立步骤、由不同的人完成，每次交接都有信息损耗，每次修改都要多方协调。<\/li>\n<li class=\"s\">AI 加持下三者合并为一步&quot;高精度原型设计&quot;：不是线框图，而是接近最终成品的高保真设计，直接包含交互逻辑和视觉设计。<\/li>\n<li class=\"s\">以前不可行是因为成本极高：一个人难同时具备产品思维、交互设计和 UI 设计能力，就算有，做一个高保真原型也要好几天；现在一个 AI Agent 加一个好的 Design Skill（首推 Claude Design，也可用作者的 baoyu-design，对话中说&quot;原型设计&quot;即自动触发）就能快速产出。<\/li>\n<li>本例的反复调整（每次只需自然语言描述变化）：<\/li>\n<li class=\"s\">布局从列表改成 Tab；把&quot;开启服务&quot;和&quot;访问其他节点&quot;分开，因为这是两个不同使用场景，混在一起用户会困惑。<\/li>\n<li class=\"s\">加图标显示服务状态，让用户一眼看出服务开着还是关着。<\/li>\n<li class=\"s\">发现放在设置页面太深（用户需频繁查看服务状态），又挪到主界面。<\/li>\n<li>判断：原型阶段修改成本低，做出真正产品后再改成本很高，&quot;这个阶段值得花时间反复打磨&quot;；界面和交互一旦开发完成，修改成本会呈指数级上升（要改代码逻辑、样式、状态管理、测试用例），原型阶段改一个布局可能就是一句话的事。<\/li>\n<li>人的注意力全部放在产品层面判断（交互是否友好、界面是否美观、用户是否自然），不纠结像素和布局实现。<\/li>\n<\/ul>\n<h5>2.4 实现——代码已经不是瓶颈<\/h5>\n<ul>\n<li>有设计文档和确认过的高精度原型后，让 Agent 写代码对现在的模型来说很简单。<\/li>\n<li class=\"s\">用 /goal 命令把设计文档和原型一起发给 Claude Code（Fable 5），按文档规划的里程碑实现；它会自己规划实现顺序、写代码、运行测试、截图验证结果。<\/li>\n<li>作者常强调的技巧：让 Agent 自行验证，可减少人需要介入的次数。<\/li>\n<li class=\"s\">相当于给 Agent 一个自己的反馈循环；人做最终确认时拿到的是 Agent 已验证过的结果，而非粗糙初稿。<\/li>\n<li class=\"s\">这也是合并确认环节（如跳过 Code Review 直接黑盒测试）相对安全的原因：Agent 自身能力足够 + 开发中做了自验证。<\/li>\n<li>瓶颈判断：代码已经不是瓶颈，瓶颈转移到代码两侧——左边是设计和确认，右边是测试、验证和部署，这些仍以人类速度运行，才是需要优化的地方。<\/li>\n<li class=\"s\">传统流程中 PRD、估时、安全审查是为了在开发前对齐（开发可能几周甚至几个月），当 Agent 几小时完成编码，这些确认流程需要重新审视。<\/li>\n<\/ul>\n<h5>2.5 测试——把自己当普通用户<\/h5>\n<ul>\n<li>关键心态转变：把自己当普通用户，而不是开发者。<\/li>\n<li class=\"s\">开发者会下意识避开边界情况、按预期路径操作；普通用户会乱点、输入没想到的内容、用没预想到的方式使用功能。<\/li>\n<li class=\"s\">做法：打开 App 假装第一次看到该功能，凭直觉用，看提示够不够清楚、交互够不够自然、出错有没有合理引导；问题直接扔给 Agent 修。<\/li>\n<li>作者的取舍：没有 Review 代码，只做黑盒测试，信任 Fable 5 的编码能力；&quot;两层验证加起来已经足够了&quot;（开发过程中的自跑测试/自截图 + 用户视角黑盒）。<\/li>\n<li class=\"s\">边界：取舍取决于项目重要程度，&quot;如果是金融系统的核心逻辑，你可能还是需要 Code Review&quot;，但对大部分功能开发黑盒测试足够。<\/li>\n<\/ul>\n<h4>三、三个本质变化<\/h4>\n<h5>3.1 执行主体从人变成了 Agent<\/h5>\n<ul>\n<li>每个环节真正干活的是 Agent：不需自己写可行性分析报告、画原型图、写代码、写测试用例，只需在关键节点确认和决策。<\/li>\n<li class=\"s\">人的精力集中在判断和决策，Agent 处理执行和细节。<\/li>\n<\/ul>\n<h5>3.2 确认环节可以合并，但不能省略<\/h5>\n<ul>\n<li>传统中需求确认、原型确认、UI 确认是三个独立评审会，现在可合并（需求+原型+UI 一体化成高精度原型，一次性确认），设计文档和原型设计也可放在一起看。<\/li>\n<li>但&quot;确认环节本身绝对不能省&quot;，每个确认环节都有存在理由：<\/li>\n<li class=\"s\">可行性确认：先决定要不要做，避免做半天发现白忙活。<\/li>\n<li class=\"s\">技术方案确认：方向是不是最优，有没有更好路径。<\/li>\n<li class=\"s\">原型/UI 确认：交互是否友好、界面是否美观；做出来再改成本极高，原型阶段修改极容易。<\/li>\n<li class=\"s\">测试确认：站在用户角度验证好不好用，而不是开发者角度验证能不能跑。<\/li>\n<li>结论：可以加速确认（合并环节、简化流程），但不能跳过；&quot;人的判断力是整个流程中不可替代的部分&quot;。<\/li>\n<\/ul>\n<h5>3.3 文档重要性更高<\/h5>\n<ul>\n<li>传统开发中文档是附属品（代码写完补，甚至不补）；AI 原生开发中成为核心基础设施。<\/li>\n<li>两个职能：给人类做确认和修改的载体（审查设计文档、批注原型、修改技术方案都在文档层面发生）；给 Agent 的 Session 之间传递上下文（设计文档传给开发 Session，原型传给实现 Session）。<\/li>\n<li class=\"s\">与口头描述比更精确，比聊天记录更有结构。<\/li>\n<li class=\"s\">新问题：如果版本没有及时更新，&quot;反而会产生错误的上下文&quot;。<\/li>\n<\/ul>\n<h4>四、Skills 的反直觉观点<\/h4>\n<ul>\n<li>作者答案：大部分开发类 Skills 是没必要的。<\/li>\n<li class=\"s\">依据：大模型编码已训练得极好；作者整个流程与 Agent 的对话都是简单自然语言（&quot;帮我分析一下可行性&quot;&quot;按方案 A 写个设计文档&quot;&quot;按这个设计做原型&quot;&quot;按文档实现&quot;），无复杂 prompt engineering、无特殊 coding skills。<\/li>\n<li>只用两类 Skills，恰好对应两个瓶颈：<\/li>\n<li class=\"s\">辅助设计确认的（解决左侧瓶颈）：如 Claude Design / baoyu-design，把原型设计和 UI 设计合二为一，在代码之前确认界面和交互。<\/li>\n<li class=\"s\">自动化减少体力劳动的（解决右侧瓶颈）：如自动部署、自动发布（不需判断力但耗时间）；/goal 命令让 Agent 按里程碑自动推进，减少手动拆分任务。<\/li>\n<li>中间那一层（编码本身）模型已足够好，精力花在流程设计上比花在 prompt 优化上回报大得多。<\/li>\n<\/ul>\n<h4>五、写在最后<\/h4>\n<ul>\n<li>从 GitHub Issue 到完整可用，写代码几乎没花时间；花时间最多的是可行性判断、原型反复打磨、测试时把自己当小白用户。<\/li>\n<li>人的角色：从写代码的人变成管理 Agent 的人；产出不再是代码，而是&quot;一个个判断和决策&quot;。<\/li>\n<li>作者承认放下对代码的执念不容易（不看每一行就合并心里不踏实），自己也是一步步才走到只做黑盒测试的状态；判断趋势是模型编码能力只会更强，人的价值越来越集中在代码两侧。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>反例：可行性分析也会判断失误——本地文本模型辅助拆分对齐字幕的功能，技术可行性认为没问题，实际体验糟糕被砍掉，浪费数天时间和 token。<\/li>\n<li>本次流程中作者自陈&quot;偷了个懒&quot;：设计文档写完直接做原型，未仔细审查；明确指出更复杂项目应审查设计文档。<\/li>\n<li>黑盒测试有适用边界：金融系统核心逻辑可能仍需 Code Review；&quot;大部分功能开发&quot;黑盒测试才足够。<\/li>\n<li>文档的新风险：版本未及时更新会产生错误的上下文。<\/li>\n<li>效率提升&quot;数量级&quot;为作者的主观感受，文中未给出量化数据；结论主要基于单个个人项目案例。<\/li>\n<\/ul>","conceptCards":[{"name":"AI 原生开发（AI-native development）","quotes":["AI 原生开发，本质上还是传统的软件开发流程——可行性分析、方案设计、原型设计、编码实现、测试验证。这些步骤一个都没少。","> AI 原生开发不是发明了一套新流程，而是用新的方式跑旧的流程。"],"feynman":"在本文里，AI 原生开发不是让 AI 写代码的同义词，也不是一套全新流程。它指旧的软件开发流程照跑，但每个环节的执行方式和承担者变了。它是全文的起点，因为只有先接受这个定义，读者才会把注意力从编码移到代码之外。","nodeId":"cm_2b63a21c"},{"name":"执行主体从人变成 Agent","quotes":["变的是什么？执行主体。","> 以前每个环节都是人亲手干。现在，人变成了指挥官，Agent 变成了执行者。人只在关键路径上做确认和决策，但具体的分析、设计、编码、调试，全部交给 Agent 去执行。"],"feynman":"流程步骤没变，但具体做分析、设计、编码、调试的人不再是人，而是 Agent。人升到指挥官位置。这个概念承重，因为后面讲的确认合并、文档桥梁、瓶颈转移，都是执行主体改变后的结果。","nodeId":"cm_b6da7e6e"},{"name":"人在关键路径确认","quotes":["注意这里的模式：Agent 做分析和罗列方案，人做最终判断和拍板。这就是“人在关键路径确认”的含义——你不需要自己去研究每个技术方案的细节，但你需要基于自己的产品判断和技术直觉做最终决策。"],"feynman":"人不是全程不参与，也不是全程亲手做；只在决定做不做、选哪个方向、交互是否友好、能不能用等关键节点拍板。它定义了人不可替代的判断力边界。","nodeId":"cm_8bb611ea"},{"name":"可行性分析","quotes":["这是整个流程中最容易被跳过、但最不该被跳过的一步。","> 它是一个期望值的赌注：大部分时候能帮你避开弯路，偶尔也会看走眼。","> 可行性分析通常看两个层面：","产品角度：这个功能有没有价值？和 App 的定位是不是匹配？","技术角度：技术上能不能做到？成本是不是可控？"],"feynman":"先决定要不要做，再进入设计和编码。产品角度看价值与定位，技术角度看可行与成本。它不是不出错的保险，而是期望值下减少更多坑的关卡。它是流程第一关，也是后面所有工作的前提。","nodeId":"cm_37869804"},{"name":"设计文档（桥梁与记忆载体）","quotes":["文档在 AI 时代有了全新的角色，它是人和 Agent 之间、以及 Agent 和 Agent 之间的桥梁。","> 换句话说，文档是 AI 原生开发中的“记忆载体”。","> 确认后的文档，就是下一个 Agent Session 的全部起点。"],"feynman":"传统文档可能是写完就过时的负担；本文里文档是核心中间物。人靠它确认和修改方案，Agent Session 靠它继承前一个 Session 的决策和上下文。没有它，人无法高效确认，Agent 也无法跨阶段接力。","nodeId":"cm_fb4c75d6"},{"name":"Agent Session","quotes":["每一个 Agent Session 的上下文窗口是有限的，当你从“设计”进入“开发”，往往是一个新的 Session。前一个 Session 的思考过程、决策依据、技术方案，都需要通过文档传递给下一个 Session。没有文档，下一个 Session 就是从零开始。"],"feynman":"Agent Session 是一次上下文有限的工作会话。阶段切换常开新 Session，旧 Session 的记忆不会自动延续。文档因此成为跨 Session 传递上下文的载体。它是理解文档作用的机制性概念。","nodeId":"cm_f47cd4ad"},{"name":"高精度原型设计","quotes":["在 AI 的加持下，这三者可以合并成一个步骤——高精度原型设计。什么意思？就是你做出来的原型，不是线框图，而是接近最终成品的高保真设计，直接包含了交互逻辑和视觉设计。","> 原型设计阶段的修改成本相对很低，而做出真正的产品后再改成本就很高了。"],"feynman":"把需求、原型、UI 设计合成一步，产出接近成品、包含交互和视觉的高保真原型。AI 把过去成本极高的事变快。它让确认环节可以合并，也让修改发生在低成本阶段。","nodeId":"cm_ef696870"},{"name":"让 Agent 自行验证","quotes":["让 Agent 自行验证，可以减少你需要介入的次数。","> 相当于给 Agent 一个自己的反馈循环，让它在你看到结果之前先自己检查一遍。","> 这也是为什么合并一些确认环节（比如跳过 Code Review 直接黑盒测试）相对是安全的"],"feynman":"Agent 写代码后自己跑测试、调试、截图确认，形成内部反馈循环。人拿到的不是粗糙初稿，而是已自检结果。它解释了为什么可以合并确认而不牺牲太多质量。","nodeId":"cm_78356595"},{"name":"确认环节可以合并，但不能省略","quotes":["变化二：确认环节可以合并，但不能省略","> 但确认环节本身绝对不能省。","> 你可以加速确认（合并环节、简化流程），但不能跳过确认。人的判断力是整个流程中不可替代的部分。"],"feynman":"需求、原型、UI 等确认可以合并成一次，流程可以简化；但可行性、技术方向、原型／UI、测试这些确认不能取消。它划出 AI 原生开发中可优化和绝对禁止的边界。","nodeId":"cm_f986a343"},{"name":"瓶颈转移到代码两侧","quotes":["代码已经不是瓶颈了。","> 瓶颈转移到了代码两侧：左边是设计和确认，右边是测试、验证和部署。","> 这些环节仍然在以人类速度运行，它们才是现在需要优化的地方。"],"feynman":"编码被 Agent 加速后，不再是拖慢流程的中心。真正慢的是编码前的设计确认和编码后的测试验证部署。它是全文重新分配注意力的框架，也解释为什么重点谈可行性、原型和测试。","nodeId":"cm_ac2e95b3"},{"name":"把自己当普通用户／黑盒测试","quotes":["关键心态转变：把自己当普通用户，而不是开发者。","> 你要问我有没有 Review 代码？没有。我把自己当成 QA，只做了黑盒测试，我信任 Fable 5 的编码能力。","> 当然，这个取舍取决于项目的重要程度。如果是金融系统的核心逻辑，你可能还是需要 Code Review。"],"feynman":"测试时不按开发者的预期路径走，要假装第一次用，凭直觉乱点、输入意外内容。作者自己只做黑盒测试，不逐行 Review；但这不是绝对规则，核心系统仍可能要 Code Review。它说明测试确认的用户视角，以及合并确认的安全边界。","nodeId":"cm_f282148c"},{"name":"两类 Skills（辅助设计确认／自动化减少体力劳动）","quotes":["我的答案可能会出乎意料：大部分开发类 Skills 是没必要的。","> 我一般只用两类 Skills，恰好对应这两个瓶颈：","> 第一类是辅助设计确认的——解决左侧瓶颈。","> 第二类是自动化减少体力劳动的——解决右侧瓶颈。"],"feynman":"作者不靠大量编码类 Skills，因为模型编码已足够好。只用两类：帮助左侧设计确认，如高精度原型工具；帮助右侧自动化，如部署发布。它是瓶颈转移后的工具选择结论。\n\n## 二、概念架构图\n\n按功能角色分层：总原则层说明整体判断，流程阶段层呈现旧流程，机制与边界层解释 AI 原生开发如何运转，工具选择层对应瓶颈两侧的 Skills。边只表示原文能支持的关系。\n\n``<code>mermaid\nflowchart TB\n  subgraph P[总原则层]\n    A[&quot;AI 原生开发：流程不变，执行主体改变&quot;]\n    B[&quot;人在关键路径确认&quot;]\n  end\n  subgraph F[流程阶段层]\n    C[&quot;可行性分析&quot;]\n    D[&quot;设计文档：桥梁与记忆载体&quot;]\n    E[&quot;高精度原型设计&quot;]\n    F1[&quot;编码实现&quot;]\n    G[&quot;测试验证&quot;]\n  end\n  subgraph M[机制与边界层]\n    H[&quot;Agent Session&quot;]\n    I[&quot;让 Agent 自行验证&quot;]\n    J[&quot;确认环节可合并但不能省略&quot;]\n    K[&quot;瓶颈转移到代码两侧&quot;]\n    L[&quot;把自己当普通用户／黑盒测试&quot;]\n  end\n  subgraph T[工具选择层]\n    S[&quot;两类 Skills：辅助设计确认／自动化减少体力劳动&quot;]\n  end\n  A --&gt;|推导出| B\n  A --&gt;|用新方式跑| C\n  A --&gt;|用新方式跑| D\n  A --&gt;|用新方式跑| E\n  A --&gt;|用新方式跑| F1\n  A --&gt;|用新方式跑| G\n  C --&gt;|先决定要不要做| D\n  D --&gt;|提供基础| E\n  E --&gt;|确认后| F1\n  F1 --&gt;|进入| G\n  D --&gt;|为下一个 Session 提供起点| H\n  I --&gt;|使合并更安全| J\n  J --&gt;|不可跳过| C\n  J --&gt;|不可跳过| D\n  J --&gt;|不可跳过| E\n  J --&gt;|不可跳过| G\n  K --&gt;|重新审视| J\n  K --&gt;|决定工具选择| S\n  S --&gt;|解决左侧瓶颈| E\n  S --&gt;|解决右侧瓶颈| G\n  L --&gt;|测试视角| G\n<\/code>``","nodeId":"cm_5bff7310"}],"feynman":{"short":"流程一步没少，但干活的是 Agent，人只在关键处拍板：先让它分析可行性，你定做不做；再让它写设计文档，文档就是下一个会话的记忆卡；然后反复打磨高精度原型，最后让 Agent 按文档写代码、自己跑测试、自己截图验证，你只当普通用户试一遍。","long":"<p>这篇文章回答的是：AI 时代加一个功能该怎么走流程？答案是流程一步没少，但干活的人换成了 Agent，人退到关键节点拍板。<\/p>\n<p>具体机制是：需求从用户留言来，先让 Agent 做可行性分析，由你决定做不做；再让它写设计文档，文档像一张&quot;记忆卡&quot;，把决策固定下来，成为下一个对话窗口的起点；然后反复打磨高精度原型，最后才让 Agent 按文档写代码，并自己跑测试、自己截图验证。人只管判断：要不要做、方向对不对、好不好用。类比一下，你从泥瓦匠变成了装修业主——不亲手砌墙，但定方案、看效果图、最后验收。<\/p>\n<p>作者承认的代价是：他这次偷懒细看设计文档，也跳过了代码审查，只做黑盒测试，理由是 Agent 已自验证；但这只在普通功能上成立，金融核心逻辑仍需 Review。此外可行性分析也会看走眼，他曾因此白干几天；文档若不及时更新，反而会给 Agent 喂错上下文。<\/p>","rubric":[{"concept":"AI 原生开发（流程不变，执行主体改变）","points":["指出流程步骤一个都没少，而非把 AI 原生开发等同于让 AI 帮忙写代码","说出变化在于执行主体：人做关键节点的确认与决策，Agent 承担分析、设计、编码、调试的执行","点出编码是其中变化最小的一环，真正的变化发生在代码之外"]},{"concept":"设计文档（桥梁与记忆载体）","points":["说出文档同时承担两种职能：供人确认和修改、在 Agent Session 之间传递上下文","解释为什么必须靠文档传递：Session 上下文窗口有限，阶段切换往往开新 Session，没有文档就得从零开始","指出确认后的文档即下一个 Session 的全部起点，并提到文档版本不更新反而会造成错误上下文"]},{"concept":"确认环节可以合并，但不能省略","points":["区分「合并或加速确认」与「跳过确认」是两回事","至少举出两类不可省的确认及其理由，如可行性、技术方案、原型/UI、测试确认","说明人的判断力不可替代，并给出至少一个确认可以放宽或必须收紧的边界情形"]}]},"oneLine":"AI 原生开发流程没变，变的是执行主体——人成了指挥官。"},{"slug":"linear-principles","no":4,"title":"原则与实践（Linear 的产品原则）","words":1563,"url":"https://linear.app/method/introduction","author":"linear.app","summary":"软件项目管理工具应以用户为中心，简化流程并提升团队效率。周期性工作安排帮助团队聚焦目标，合理分配任务与优先级。良好沟通和明确责任是确保项目顺利完成的重要保障。","fetched":"Reader 快照（2026-09-12）","topic":"产品原则与团队节奏","stars":4,"starReason":"一手机制密度高，把产品设计与团队节律讲成可操作原则，长期通用。","why":"Linear 把自家产品与团队工作法写成公开原则，今天读它能校准工具选型与研发节奏。周期、单一负责人、拆分任务等具体做法可直接对照当前团队流程。","metaphor":"一条被两股力量来回拉动的传送带","palette":"oat","paletteBg":"#E3DACC","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"产品原则与团队节奏\"><defs><filter id=\"hw54\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"54\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#E3DACC\"/><path d=\"M 793.1 185.8 Q 805.4 212.2 787.6 234.7 Q 769.7 257.2 770.2 284.2 Q 770.7 311.1 732.5 327.4 Q 694.4 343.6 657.9 360.6 Q 621.3 377.5 571.5 375.3 Q 521.7 373.2 479.7 366.0 Q 437.6 358.8 397.9 354.3 Q 358.2 349.8 312.7 344.8 Q 267.3 339.8 253.6 316.2 Q 239.8 292.5 196.4 277.4 Q 153.0 262.3 166.0 237.2 Q 179.0 212.2 184.0 187.0 Q 189.0 161.9 226.3 146.2 Q 263.6 130.6 276.8 107.2 Q 290.1 83.8 329.4 77.2 Q 368.7 70.6 404.7 65.2 Q 440.8 59.8 478.0 58.5 Q 515.3 57.2 551.5 63.3 Q 587.7 69.4 623.6 78.6 Q 659.5 87.8 694.7 101.9 Q 729.9 116.1 755.4 137.7 Q 780.9 159.4 793.1 185.8 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw54)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(314.9 49.4) scale(325.6)\"><path d=\"M .12 .70 H .88 A .09 .09 0 0 1 .88 .88 H .12 A .09 .09 0 0 1 .12 .70\"/><path d=\"M .30 .56 H .56\"/><path d=\"M .30 .48 L .22 .56 L .30 .64\"/><path d=\"M .70 .56 H .44\"/><path d=\"M .70 .48 L .78 .56 L .70 .64\"/><\/g><g filter=\"url(#hw54)\"><circle cx=\"737\" cy=\"288\" r=\"5.8\" fill=\"#141413\"/><circle cx=\"278\" cy=\"378\" r=\"8.7\" fill=\"#141413\"/><circle cx=\"502\" cy=\"18\" r=\"10.5\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>项目管理工具应服务用户，以周期、目标和精简流程保持团队势头。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>如何设计软件项目管理工具，并安排团队工作方式，使个人保持高效、团队保持势头？<\/p>\n<p>关联子问题：工具应专用还是灵活？如何对齐目标与周期？如何管理项目、反馈、漏洞和协作？<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、产品与工具设计：以最终用户和特定用途为中心<\/h4>\n<h5>1.1 最终用户优先<\/h5>\n<ul>\n<li>项目管理工具设计应以最终用户（项目创建者）为中心。<\/li>\n<li class=\"s\">保持个人高效工作比生成完美报告更重要。<\/li>\n<\/ul>\n<h5>1.2 专用而非过度灵活<\/h5>\n<ul>\n<li>生产力软件必须根据特定用途设计，才能发挥作用。<\/li>\n<li class=\"s\">过于灵活的软件让每个人自建工作流程，团队扩大后导致混乱。<\/li>\n<\/ul>\n<h5>1.3 工具服务人，且随团队扩展<\/h5>\n<ul>\n<li>工具不应让用户成为开发者/维护者；工具应为人服务。<\/li>\n<li class=\"s\">移除或自动化“变通之法”，以专注真正重要的事。<\/li>\n<li>好工具应易于上手，并能随团队规模扩大增强功能。<\/li>\n<li class=\"s\">团队规模不同，需求也不同。<\/li>\n<\/ul>\n<h4>二、目标与周期：把日常工作挂到远大目标上<\/h4>\n<h5>2.1 远大目标与对齐<\/h5>\n<ul>\n<li>只有设定远大目标，才能产生重大影响；公司制定高层方向应重点关注这些目标。<\/li>\n<li class=\"s\">将日常工作与更大目标联系，并通过项目实现；所有项目和工作都应与目标直接相关。<\/li>\n<li class=\"s\">在项目启动会审查项目及目标日期，制定周期计划时参考项目内容。<\/li>\n<li>即使日常被琐事填满，也务必让所有人明白工作目的和长期目标；里程碑、项目和计划是制定每周计划必须考虑的因素。<\/li>\n<\/ul>\n<h5>2.2 预留空间与调整<\/h5>\n<ul>\n<li>产品时间表应预留空间应对计划外突发工作，并允许产品计划必要时调整。<\/li>\n<\/ul>\n<h5>2.3 周期节律<\/h5>\n<ul>\n<li>周期性安排能建立健康日常流程，让团队专注下一步；目标是保持团队良好势头，不急于求成。<\/li>\n<li class=\"s\">通过周期性安排确定优先级并分配职责。<\/li>\n<li class=\"s\">软件开发中两周周期最常见：足够短不忽略其他优先事项，足够长构建重要功能。<\/li>\n<li class=\"s\">周期应合理，不塞满任务；未完成任务自动进入下一个周期。<\/li>\n<\/ul>\n<h5>2.4 决策与前进<\/h5>\n<ul>\n<li>并非总有最佳答案；有时最重要的是做出决定，然后继续前进。<\/li>\n<\/ul>\n<h4>三、项目与任务执行：明确责任、简洁、小步推进<\/h4>\n<h5>3.1 单一负责人<\/h5>\n<ul>\n<li>每个项目指定一位负责人，负责撰写项目简报并交付成果。<\/li>\n<li class=\"s\">问题处理同理；即使涉及其他人，责任也由一个人承担。<\/li>\n<\/ul>\n<h5>3.2 简洁规范<\/h5>\n<ul>\n<li>力求简洁；简短规范更容易阅读。<\/li>\n<li class=\"s\">规范目的是向团队简要传达项目的“为什么”、“是什么”和“如何做”。<\/li>\n<li class=\"s\">简短文档促使明确工作范围，清晰划分优先级，避免开发错误东西。<\/li>\n<\/ul>\n<h5>3.3 避免自创术语<\/h5>\n<ul>\n<li>尽量不自创术语，以免混淆和跨团队含义不同。<\/li>\n<li class=\"s\">项目就应该被称为项目。<\/li>\n<\/ul>\n<h5>3.4 分解任务与小改动<\/h5>\n<ul>\n<li>大型任务难见进展，可能打击积极性；应尽量分解为更小部分，每部分创建一个问题。<\/li>\n<li class=\"s\">理想情况下每周完成几个具体任务；将问题标记为已完成带来成就感。<\/li>\n<li class=\"s\">判断完成最直接方法是查看代码或设计文件差异；任务范围小则修改小、易审查。<\/li>\n<li class=\"s\">避免提交大规模拉取请求或进行大设计变更。<\/li>\n<\/ul>\n<h5>3.5 聚焦待办与变更日志<\/h5>\n<ul>\n<li>无需无限期保存所有功能请求或反馈；重要请求会再次出现，低优先级请求永远不会解决。<\/li>\n<li class=\"s\">更聚焦的待办列表让周期规划更轻松快捷，确保工作落实。<\/li>\n<li>编写变更日志对内部和外部沟通都有益。<\/li>\n<li class=\"s\">内部：跟踪进度、反思成果；外部：让用户了解动态，展现改进产品决心。<\/li>\n<\/ul>\n<h4>四、反馈与质量：把用户声音和修复纳入开发<\/h4>\n<h5>4.1 漏洞与修复<\/h5>\n<ul>\n<li>所有软件都存在漏洞，数量远超能修复范围；将漏洞修复和其他修复纳入开发周期。<\/li>\n<li class=\"s\">投资工具，运用得当可倍增效率。<\/li>\n<\/ul>\n<h5>4.2 用户反馈<\/h5>\n<ul>\n<li>产品越受欢迎，反馈越多；邮箱爆满是个好兆头（除非是bug报告）。<\/li>\n<li class=\"s\">收集反馈作为开发新功能的研究资料库，尝试发现趋势。<\/li>\n<li class=\"s\">将请求和反馈附加到相关问题，让客户声音直接融入产品开发。<\/li>\n<li class=\"s\">阅读反馈，即使抱怨，也是了解用户并打造他们真正需要产品的好机会。<\/li>\n<\/ul>\n<h4>五、团队协作：设计师与工程师的推拉关系<\/h4>\n<h5>5.1 推拉合作<\/h5>\n<ul>\n<li>设计师和工程师应在项目中通力合作，形成自然的“推拉关系”。<\/li>\n<li class=\"s\">设计师探索创意，推动团队思考；工程师着眼实施方案，挑战既有思维模式，并将创意变为现实。<\/li>\n<li class=\"s\">优秀创造者往往兼具这两种才能。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>明确边界/反例：过于灵活软件在团队扩大后导致混乱；工具不应让人成为开发者/维护者；自创术语可能造成混淆；周期不应塞满，未完成自动进入下周期；无需无限期保存所有功能请求/反馈，低优先级可能永远不会解决；漏洞数量远超能修复范围；邮箱爆满是好兆头，除非是bug报告；避免大规模拉取请求或大设计变更；并非总有最佳答案。<\/li>\n<li>不确定性：原文以原则式断言展开，未提供数据、来源或统一论证；除上述限定外，未明确列出反例、不适用场景或未解决矛盾。<\/li>\n<\/ul>","conceptCards":[{"name":"以项目创建者为中心（最终用户）","quotes":["软件项目管理工具的设计应该以最终用户（即项目创建者）为中心。保持个人高效工作比生成完美的报告更重要。"],"feynman":"这是全文的出发点。工具为谁而造？作者的回答是&quot;做活的人&quot;——即创建项目的那个人，而不是查看报告的管理者。它决定了衡量标准：个人能否高效工作，优先于报表是否漂亮。拿掉这一条，后面&quot;简洁&quot;&quot;小颗粒度&quot;&quot;工具为你服务&quot;都会失去依据。","nodeId":"cm_e4fb81cb"},{"name":"为特定用途而设计（反对过度灵活）","quotes":["生产力软件必须根据特定用途进行设计。只有这样，产品才能真正发挥其应有的作用。过于灵活的软件允许每个人自行创建工作流程，但随着团队规模的扩大，最终会导致混乱。"],"feynman":"作者把&quot;灵活&quot;当成陷阱而非优点。人人自建流程在小团队里没问题，但规模一上来就变成混乱。这是全文里少见的&quot;边界性&quot;判断：好工具应当收窄可能性，围绕特定用途把一件事做对，而不是什么都能改。理解它才能明白为什么 Linear 主张固定流程、固定用词。","nodeId":"cm_e056dcdf"},{"name":"周期（Cycle）","quotes":["周期性的工作安排能够建立健康的日常流程，并让团队专注于下一步需要完成的工作。在软件开发中，两周周期最为常见。这个周期既足够短，不会忽略其他优先事项，又足够长，可以构建重要的功能。周期应该合理。不要让每个周期都塞满任务，未完成的任务应该自动进入下一个周期。"],"feynman":"周期是让节奏落地的机制。它解决&quot;什么时候重新排优先级、下一步做什么&quot;的问题。边界很明确：两周——短到不会漏掉其他优先事项，长到能做出真功能；而且是软边界，未完成的任务自动滚入下一周期，避免每个周期都被塞死。这套&quot;既…又…&quot;的取舍是承重部分。","nodeId":"cm_8a12b121"},{"name":"目标—项目—日常工作的连接","quotes":["将日常工作与更大的目标联系起来，并通过项目来实现这些目标。","所有项目和工作都应与这些目标直接相关。在项目启动会议上审查项目及其目标日期，并在制定周期计划时参考项目内容。"],"feynman":"这是把&quot;远大目标&quot;和&quot;今天在干什么&quot;缝在一起的结构。目标是方向，项目是抓手，日常工作通过项目挂到目标上——而不是各自漂浮。作者还给出操作点：启动会上审目标日期、排周期计划时回看项目。承重之处在于它回答了&quot;怎么保证琐碎工作不偏离长期方向&quot;。","nodeId":"cm_e243f570"},{"name":"工具为你服务，而非你为工具服务","quotes":["工具不应该让你成为它们的开发者和维护者。工具应该为你服务，而不是你为工具服务。移除或自动化那些\"变通之法\"，这样你才能专注于真正重要的事情。"],"feynman":"这是一条关于人与工具关系的原则。判断标准是：你在用工具做事，还是在花时间伺候工具本身？作者给的机制动作是&quot;移除或自动化变通之法&quot;——那些为了将就工具而发明的绕路操作，本身就是信号，说明工具没服务好你。它承接了&quot;以创建者为中心&quot;的立场。","nodeId":"cm_65b2c79c"},{"name":"单一负责人（Owner）","quotes":["每个项目都应该指定一位负责人，负责撰写项目简报并交付成果。同样的原则也适用于问题处理。即使涉及其他人，责任也应该由一个人承担。"],"feynman":"责任不摊薄到团队，而是收束到一个人身上：写简报、交成果。作者强调&quot;即使涉及其他人&quot;也由一个人负责——区分了&quot;参与&quot;和&quot;负责&quot;。它是项目能否被推动的关键机制，也是后面&quot;简报&quot;&quot;小颗粒度交付&quot;的执行主体。","nodeId":"cm_6a2735cf"},{"name":"简洁规范（项目简报）","quotes":["力求简洁。简短的规范更容易被阅读。规范的目的是向团队其他成员简要传达项目的\"为什么\"、\"是什么\"和\"如何做\"。理想情况下，这些简短的文档能够促使团队明确工作范围，从而清晰地划分优先级，避免团队开发错误的东西。"],"feynman":"规范的价值在短，不在全。它只回答三个问题——为什么做、做什么、怎么做。作者把&quot;简洁&quot;当成强制划范围的手段：正因为写不下细节，团队才被迫把范围想清楚，进而排好优先级、避免做错东西。它是&quot;单一负责人&quot;的产物。","nodeId":"cm_026f933a"},{"name":"分解为小颗粒度工作","quotes":["处理大型任务时，很难看到明显的进展，这可能会打击积极性。尽可能将工作分解成更小的部分，并为每个部分创建一个问题。理想情况下，每周可以完成几个具体的任务。将问题标记为已完成会带来成就感。","判断某项工作是否完成的最直接方法是查看代码或设计文件中的差异。当任务范围较小时，你的修改也会较小，更容易审查。"],"feynman":"把大任务切小，有两个作用：一是让人看得见进展、获得完成感、维持动力；二是让审查变容易——小任务对应小 diff，小改动好审。作者用&quot;查看差异&quot;作为判断完成的最直接办法，反过来要求改动别太大。这条机制同时服务于动力和可审查性。","nodeId":"cm_857d56ba"},{"name":"反馈作为研究资料库","quotes":["产品越受欢迎，收到的反馈就越多。邮箱爆满是个好兆头（除非是bug报告）。收集用户反馈，并将其作为开发新功能的研究资料库。尝试发现趋势。将请求和反馈附加到相关问题中，让客户的声音直接融入产品开发。阅读反馈，即使是抱怨，也是了解用户并打造他们真正需要的产品的好机会。"],"feynman":"反馈不是待办债务，而是研究材料。作者要的不是逐条满足，而是&quot;发现趋势&quot;，并把请求挂到相关问题里，让用户的声音直接进入开发过程。这解释了为什么&quot;重要的请求会再次出现&quot;，也说明为什么不必无限期保存所有请求——只留能形成趋势的部分。","nodeId":"cm_f65d0103"},{"name":"可扩展性","quotes":["团队规模不同，需求也不同。一款好的工具应该易于上手，并能随着团队规模的扩大而不断增强功能。"],"feynman":"工具要在两端都成立——小团队上手容易，团队变大后功能还能跟上。这条与&quot;为特定用途设计&quot;配套：既不能灵活到失控，也不能僵化到撑不住增长。它是判断一款工具好坏的规模维度。","nodeId":"cm_765d717a"},{"name":"设计师与工程师的推拉关系","quotes":["设计师和工程师应该在项目中通力合作，形成自然的推拉关系。设计师运用他们的技能探索创意，推动团队的思考。工程师则着眼于实施方案，挑战既有的思维模式，并将最终的创意变为现实。优秀的创造者往往兼具这两种才能。"],"feynman":"这是两种角色在项目中的协作模型——设计师往前推（探索创意、推动思考），工程师往回拉（盯可行性、挑战思路、把想法落地）。作者强调这种张力是&quot;自然的推拉&quot;，而非谁服从谁，并且最好的创造者两种能力兼具。它为&quot;项目怎么被做出来&quot;补上人的维度。\n\n## 二、概念架构图\n\n材料本身是一份并列的原则清单，多数条目平行铺开；下图只保留原文能支持的分层与关系，边标注的是原文给出的关系（如&quot;撰写&quot;&quot;附加到&quot;&quot;参考&quot;）。其余并列原则不再强行连边。\n\n``<code>mermaid\nflowchart TD\n  A[以项目创建者为中心] --&gt;|体现为| B[为特定用途而设计]\n  A --&gt;|体现为| C[工具为你服务]\n  A --&gt;|体现为| D[可扩展性]\n\n  E[周期] --&gt;|计划时参考| F[目标—项目—日常工作的连接]\n  F --&gt;|指定| G[单一负责人]\n  G --&gt;|撰写| H[简洁规范]\n  G --&gt;|交付| I[小颗粒度工作]\n  H --&gt;|促进| I\n\n  J[反馈作为研究资料库] --&gt;|附加到问题| F\n  K[设计师与工程师的推拉关系] --&gt;|作用于| I\n<\/code>``","nodeId":"cm_b4276278"}],"feynman":{"short":"目标指方向，项目做抓手，每个项目只设一位负责人：写一份只讲为什么、是什么、怎么做的短简报。用两周一轮的周期推进，周期别塞满，没做完就顺延。大任务切小，好完成也好审查；反馈当研究材料找趋势，工具服务人而不是人伺候工具。","long":"<p>这篇文章问：团队做软件，工具和流程该围着什么转？答案是围着做事的人转，让人高效专注、持续交付，而不是追求完美报告和复杂流程。<\/p>\n<p>核心机制是：目标清楚，再拆成小项目，每个项目只设一个负责人；用固定短周期推进，周期里别塞满，没做完就顺延；文档只讲清“为什么、是什么、怎么做”；反馈挂到具体事项；大任务切小，方便完成和审查；工具服务人，别让人维护它。周期就是固定一小段时间，比如两周一轮。<\/p>\n<p>像厨房出菜：目标明确，每道菜一个主厨，按晚市一轮轮出；不记住所有点过的菜，只留会再点的，靠反馈调整。<\/p>\n<p>代价是聚焦：作者承认，不必无限期保存所有功能请求，所以低优先级请求可能永远不解决；有时也没有最佳答案，只能先决定再前进。<\/p>","rubric":[{"concept":"以项目创建者为中心（最终用户）","points":["能指出衡量标准落在做事的人身上，而不是报表或管理者视角。","能由这一立场推出反对过度灵活的主张，并说明混乱是在团队规模扩大后才出现。","能把“移除或自动化变通之法”归到人与工具的关系上，而不是当成一条效率技巧。"]},{"concept":"周期（Cycle）","points":["能说出周期在两个方向上都有限定——短到不忽略其他优先事项、长到能构建重要功能，并落到具体时长。","能说明未完成任务的去向，而不是把它讲成考核或惩罚。","能把周期的作用定位成节奏与优先级重置，而不是装任务的容器。"]},{"concept":"单一负责人（Owner）","points":["能区分“有人参与”和“有人负责”，并在涉及多人时仍把责任收束到一个人。","能说出负责人要交付的两样东西，而不是只提其中一样。","能把简报的内容限定在三个问题上，而不是要求写一份完整文档。"]}]},"oneLine":"项目管理工具应服务用户，以周期、目标和精简流程保持团队势头。"},{"slug":"agent-skills-lesson-1","no":5,"title":"Claude 官方课程 · 第 1 课：什么是 Agent Skills","words":1464,"url":"https://academy.claude.com/courses/introduction-to-agent-skills/what-are-skills","author":"Claude Academy","summary":"技能是教Claude自动完成特定任务的文件。它们按需加载，帮助避免重复解释工作。个人技能存储在用户目录，项目技能共享给团队。","fetched":"Reader 快照（2026-09-12）","topic":"Agent 技能机制","stars":4,"starReason":"官方一手定义与加载机
