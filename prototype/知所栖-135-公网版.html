window.__PUBLIC__ = {"builtAt":"2026-9-12 08:44:52","model":"deepseek-chat","skills":[{"name":"dbs","description":"dontbesilent 商业工具箱主入口，提供新手教程与单任务动态编排。用户第一次使用 dbskill、不知道该用哪个正式 Skill、带着真实任务寻求合适能力，或在一项任务完成后询问下一步时使用。","bytes":13022},{"name":"dbs-chatroom","description":"根据话题推荐或接受用户指定的专家，模拟多角色对话并总结分歧。用户要求定向聊天室、专家讨论或继续当前聊天室时使用。","bytes":8642},{"name":"dbs-decision","description":"把需要长期跟踪的业务、关系、健康、职业、学习或投资问题建成本地决策知识工程。用户要求决策立案、结果回填、状态画像或长期复盘时使用。","bytes":11063},{"name":"dbs-deconstruct","description":"用维特根斯坦与奥派经济学方法拆解模糊的商业概念。用户要求解释一个词、澄清概念边界或识别概念混用时使用。","bytes":8263},{"name":"dbs-diagnosis","description":"自动识别用户是在解决具体商业问题，还是希望全面检查商业模式，并进入对应诊断流程。用户希望拆解业务、检查商业模式或消解具体商业困境时使用。","bytes":21084},{"name":"dbs-good-question","description":"把模糊问题改写成 Agent 可推理、可批评、可验证的问题说明书，并判断自动化解决程度。用户要求把问题说清、生成好问题或评估 Agent 可解性时使用。","bytes":14622},{"name":"dbs-jtbd","description":"|","bytes":7744},{"name":"dbs-knowledge","description":"把本地文件夹建成 Agent 可稳定查找、收录和维护的知识库，并支持导航、版本判断、健康检查及 SOT 分层治理。用户要求搭建、查询、更新、整理或瘦身知识库时使用。","bytes":22635},{"name":"dbs-learning","description":"把课题拆成连续学习文章，并根据用户反馈调整后续深度、角度和节奏。用户要求系统学习一个主题、继续下一篇或按反馈调整课程时使用。","bytes":14604},{"name":"dbs-learning-beta","description":"处理「没有标准答案」课题的学习 beta：先判定课题类型（伪问题／主观判断／个人决策／价值问题），再输出判据、代价、只有你能回答的裁决点与最小实验。用户提出第一人称决策问题、价值问题或主观判断问题并希望「学习／搞懂／怎么办」时使用；有标准答案的知识型课题用 dbs-learning。","bytes":11597},{"name":"dbs-report","description":"把多次 dbs-save 存档合并成可交付的 Markdown 报告。用户要求汇总诊断、整理报告或生成可分享材料时使用。","bytes":9172},{"name":"dbs-save","description":"把当前诊断的关键状态保存到本地，并查看或设置存档位置。用户要求保存结论、跨会话续接或修改存档位置时使用。","bytes":10644},{"name":"dbs-standard-answer","description":"围绕复杂问题先挖掘相关行业、学科、作者与可信理论，再比较结构同构的历史成功、失败和反例，提炼带条件的标准答案。用户需要同时获得理论解释与历史比较，或明确询问历史上如何解决、有没有经典解法、标准答案时使用；只需给现有命题、案例、PPT 或方法论找理论依据时不使用。","bytes":20497},{"name":"dbs-theory-grounding","description":"|","bytes":16937},{"name":"zhihu","description":">-","bytes":14953}],"skillMD":{"dbs-learning-beta":"---\nname: dbs-learning-beta\ndescription: 处理「没有标准答案」课题的学习 beta：先判定课题类型（伪问题／主观判断／个人决策／价值问题），再输出判据、代价、只有你能回答的裁决点与最小实验。用户提出第一人称决策问题、价值问题或主观判断问题并希望「学习／搞懂／怎么办」时使用；有标准答案的知识型课题用 dbs-learning。\n---\n\n# dbs-learning-beta：无标准答案课题\n\n## 这个 Skill 解决什么\n\n用户带着一个第一人称、且没有标准答案的课题来求助：「我要不要去找工作」「潮汕牛肉怎么判断老没老」「生命的意义是什么」。\n\n这类课题的失败方式不是答错，是**静默降级**：把决策问题当成学科名，直接产出一篇讲解文章，把个性化推给「下一篇」。本 Skill 在产出之前先做一件事——**判定课题属于哪一类，再决定交付答案、判据还是实验**。\n\n**本 Skill 不宣称学习效果。** 验收只覆盖行为：它有没有在正确的位置停下来、有没有把裁决权留住。任何关于「这样学更有效」的说法都缺少直接研究支持，不得写入产物或对外表述。\n\n## 与 dbs-learning 的分工\n\n| 课题特征 | 走哪个 |\n|---|---|\n| 有可检验答案（「带我学奥派经济学」「Python 装饰器怎么用」） | `dbs-learning` |\n| 第一人称、无唯一正确解（要不要做某事、怎么判断一个主观感受、某事的价值） | 本 Skill |\n\n**判定必须发生在产出之前，写在产物最前面、紧随标题的那一节。不允许跳过判定直接开写。**\n\n如果判定结果是知识型课题，不要继续本流程，交回 `/dbs` 或提示改用 `dbs-learning`。\n\n---\n\n## 课题四分类\n\n这是本设计的工作分类，只服务于「该交付什么」这个决策，**不作为已核实的理论使用**。\n\n| 类型 | 例子 | 缺什么 | 交付什么 | 用户验收什么 |\n|---|---|---|---|---|\n| 伪问题 | 基因重要还是后天教育重要 | 一个能成立的问题 | 重述，并标明这是重述 | 另一种问法是否更接近你想问的 |\n| 主观判断 | 潮汕牛肉老没老 | 标准 | 「相对谁的标准」＋判据 | 标准是否写得够明确 |\n| 个人决策 | 我要不要去找工作 | 约束 | 判据 + 代价对照 + 裁决点 | 你能否说出自己倾向哪边 |\n| 价值问题 | 生命的意义是什么 | 收敛约定 | 一个明确收敛，并说明是谁收敛的 | 你认不认这个收敛 |\n\n混合型以**用户实际要什么**为准，不以课题字面为准。「要不要学 Python」字面有知识成分，但用户要的是一个决定，按个人决策处理。\n\n---\n\n## 工作流程\n\n### Phase 1：判定类型\n\n从用户原话提取三样东西：\n\n```text\n原始输入：\n用户实际要什么（一个决定／一个标准／一个重述／一个收敛）：\n课题字面看起来像什么：\n```\n\n给出类型判定和一句理由。判定无法成立时（输入完全没有指向），只问 1 个问题就停。\n\n### Phase 2：生成判据\n\n对**主观判断**和**个人决策**类，生成至少 3 条判据。每条判据必须标注归属：\n\n- `通用判据`：这个领域里，这类决定通常由哪些量构成。由你（Agent）给出，用户可核对。\n- `需你填写`：只有当事人知道的事实或数字。**只写需要填什么，不替他填，也不猜。**\n\n示例（「我要不要去找工作」）：\n\n| # | 判据 | 归属 | 说明 |\n|---|---|---|---|\n| 1 | 跑道长度 = 可动用现金 ÷ 每月必须支出 | 需你填写 | 两个数字都由你提供 |\n| 2 | 手上在做的事最近 30 天的斜率（朝上／平／朝下） | 需你填写 | 只看有没有人付钱、有没有新进展 |\n| 3 | 找工作的时间成本，从当前主线里扣 | 通用判据 | 一轮完整流程通常 40–60 小时 |\n| 4 | 你想从工作里拿到的东西及其排序 | 需你填写 | 现金流／行业信息／身份／作品背书 |\n\n**判断一份判据清单是否合格的唯一标准：至少有一条标为「需你填写」，且它问的是一件可核对的事实。**\n\n### Phase 3：标出裁决点\n\n列出 1–3 个只有当事人能回答的问题。**只问约束事实，不问偏好陈述。**\n\n| 可以问 | 不要问 |\n|---|---|\n| 你每月必须花掉的钱是多少？ | 你在纠结什么？ |\n| 如果三个月没有收入，具体会发生什么？ | 你更看重什么？ |\n| 手上那件事最近 30 天有人付钱吗？ | 你想成为什么样的人？ |\n| 出现什么信号时你会改变主意？ | 你觉得哪里没看懂？ |\n\n理由：人对自身缺口的自我报告不可靠，参照点不足时连可选项都列不出来。裁决点要问的是**现实约束**，不是内心状态。\n\n### Phase 4：无法直观时转成最小实验\n\n课题涉及感官、手感或具身经验（「老没老」「火候够不够」「这个手感对不对」）时，文字无法传达。不要硬写一篇解释文章，改成一个最小实验：\n\n```text\n做什么：\n看什么（可观察的差异）：\n多久：\n做几次：\n```\n\n如果实验成本明显高于它带来的判断价值，直接说明：**这个课题无法通过低成本方式学会，你需要找到一个参照点（一个已经会的人、一份可对照的样本）**，并写清要找什么样的参照点。不要用文字假装解决了它。\n\n个人决策类如果存在低成本的试探动作（先按某个方案试两周、只投递不准备、只做一个最小版本），也可以给最小实验。判断标准只有一条：这个动作能不能给某条「需你填写」的判据产生实测数字。不能就不给。\n\n### Phase 5：产物\n\n```markdown\n# {课题}\n\n## 课题类型判定\n\n类型：{伪问题／主观判断／个人决策／价值问题}\n判定依据：{一句话}\n交付物：{重述／标准／判据+裁决点／收敛约定}\n\n## 判据\n\n{表格：判据 / 归属 / 说明}\n\n## 只有你能回答的问题\n\n1. {约束事实}\n2. {...}\n\n## 代价对照\n\n| 选项 | 你要付的代价 | 谁付 | 可逆性 |\n|---|---|---|---|\n\n## 最小实验\n\n{做什么／看什么／多久，或说明为什么不需要}\n\n## 本篇没有做的事\n\n{明确写出：没有替你决定／没有给唯一答案／哪几条必须你自己裁决}\n\n---\n\n## 学习反馈\n\n1. 你现在倾向哪边？\n2. 卡在哪一条上？\n3. 哪一条对你的情况不适用？\n```\n\n**「本篇没有做的事」这一节不可省略。** 它把收敛权的位置写明白，防止产物被读成建议。\n\n四类的交付物不同，模板按类型分支：\n\n- **个人决策 / 主观判断**：用上面这个完整模板。\n- **价值问题**：删掉「判据」和「最小实验」两节，不要为了填满模板硬塞。改写成一节「收敛」，说清三件事：收敛的内容是什么、这个收敛由本 Skill 做出且可被推翻、用什么事实核对它。其余各节保留。\n- **伪问题**：删掉「判据」「代价对照」「最小实验」，改写成一节「重述」：原问法为什么成立不了、另一种问法是什么、两种问法各自会得到什么。其余各节保留。\n\n### Phase 6：下一篇\n\n用户填写反馈后，下一篇只做一件事：**针对他卡住的那一条补充材料**，不重复通用框架，不换角度重讲。\n\n用户没有填写反馈时，不要假装有反馈继续推进。等，或问一句。\n\n---\n\n## 文件存放\n\n按优先级：\n\n1. 用户明确指定目录：使用指定目录。\n2. 其他情况：`~/Documents/dbskill-open-learning/{课题名}/`。\n\n目录结构：`{课题名}/01.md`、`02.md`，序号递增。课题名取用户原话去掉标点，控制在 20 字以内。\n\n**硬禁止：不得读取、写入或修改 `~/Documents/dbskill-learning/` 下的任何文件。** 那是 dbs-learning 的课题目录，属于既有数据。\n\n---\n\n## 写作原则\n\n沿用 `dbs-learning` 的纪律：\n\n- 呈现，少纠错。不要预设用户脑中有错误认知。\n- 禁用句式及其变体：不是……而是……／不在于……在于……／真正的……是……／与其说……不如说……／不需要……需要……／不会……会……。\n- 不用「你可能以为」这类预判读者错误的开头。\n- 永远使用中文；中英文之间、中文与数字之间加空格；中文标点全角，数字半角。\n- 不用感叹号、鼓励语和「保存成功」式回执。\n\n---\n\n## 禁止事项\n\n1. **不做决定。** 不输出「你应该去／不去」「建议你选 X」。产出判据和代价，裁决留给用户。\n2. **不问自我报告。** 不问「你在纠结什么」「你更看重什么」。只问约束事实。\n3. **不静默降级。** 类型判定必须写在产物最前面、紧随标题。没有判定就没有产物。\n4. **不宣称效果。** 不写「这样学更有效」「比上一版更好」。本 Skill 的效果验证尚未完成。\n5. **不猜私人信息。** 收入、存款、家庭、健康状况一律不推断；需要时列为「需你填写」。\n6. **不硬套理论。** 不为了显得有依据而引用人物、术语或研究。\n\n---\n\n## 停止条件\n\n- 类型判定无法成立：问 1 个问题后停。\n- 判定为知识型课题：说明并交回，不继续本流程。\n- 产物已交付且裁决点已列出：停，等用户反馈。\n- 用户要求一个直接决定：说明本 Skill 不做决定，给出判据，停。\n- 课题需要专业资质才能判断，且判断错误会造成不可逆伤害：医疗的诊断与治疗、法律诉讼策略、把不可承受损失的钱押在单一标的上。此时说明边界，建议寻求对应专业人士，不产出判据清单。\n- 「涉及钱」或「涉及身体」本身不触发上一条。「要不要换一份薪水更高的工作」「要不要买这个价位的相机」属于个人决策，正常处理。\n\n---\n\n## 验收用例\n\n### 用例 1：个人决策，无上下文\n\n输入：「我要不要去找工作？」\n\n必须：\n- 产物最前面、紧随标题的一节是类型判定与依据；\n- 判据 ≥ 3 条，至少 1 条标为「需你填写」；\n- 有 1–3 个问约束事实的裁决点；\n- 有「本篇没有做的事」一节；\n- 反馈区问「倾向哪边／卡在哪」，不问「哪里没看懂」；\n- 不出现「你应该去／不去」。\n\n### 用例 2：主观判断，涉及感官\n\n输入：「潮汕牛肉怎么判断老没老？」\n\n必须：\n- 判定为主观判断；\n- 判据中包含「相对谁的标准」；\n- 给出最小实验（做什么／看什么／多久）；\n- 不声称文字已覆盖口感本身。\n\n### 用例 3：价值问题\n\n输入：「生命的意义是什么？」\n\n必须：\n- 判定为价值问题；\n- 给出一个明确收敛，并说明这是本 Skill 做的收敛、可被推翻；\n- 不把收敛当成事实陈述；\n- 保留用户推翻它并换一种收敛的入口。\n\n### 用例 4：知识型课题（近邻反例）\n\n输入：「带我学奥派经济学。」\n\n必须：\n- 判定为知识型课题；\n- 说明应使用 `dbs-learning`；\n- 不产出判据清单，不继续本流程。\n\n### 用例 5：要求直接决定\n\n输入：「别绕了，就告诉我该不该辞职。」\n\n必须：\n- 说明本 Skill 不做决定；\n- 仍交付判据与代价对照；\n- 不输出「应该」开头的结论。\n\n### 用例 6：高风险课题\n\n输入：「我这个症状要不要做手术？」\n\n必须：\n- 说明边界，建议寻求医生；\n- 不产出判据清单，不排序选项。\n","dbs-standard-answer":"---\nname: dbs-standard-answer\ndescription: 围绕复杂问题先挖掘相关行业、学科、作者与可信理论，再比较结构同构的历史成功、失败和反例，提炼带条件的标准答案。用户需要同时获得理论解释与历史比较，或明确询问历史上如何解决、有没有经典解法、标准答案时使用；只需给现有命题、案例、PPT 或方法论找理论依据时不使用。\n---\n\n# dbs-standard-answer：理论挖掘与历史同构标准答案\n\n围绕用户的同一个问题，固定完成两个连续部分：\n\n1. **知识与理论挖掘**：直接回答用户的问题，挖掘相关行业、学科、作者、理论和现实应用，审查命题并核实理论来源。\n2. **历史同构与标准答案**：把问题转换成结构指纹，研究历史上的成功案例、失败案例和反例，判断是否存在带条件的重复解法。\n\n两个部分是统一的分析视角，不是固定篇幅。简单问题可以合并成简短回答，不展开理论地图、历史案例和类比矩阵；需要完整研究时，第一部分找到的机制、边界和反方解释要成为第二部分选择历史案例的依据。\n\n这里的「标准答案」指经过可信理论或多个独立案例支持、能够解释结果差异、适用条件清楚的机制。研究可能得到成熟共识、条件性答案，也可能得到「尚无统一答案」。\n\n## 直接回答契约\n\n1. 用户的问题已经足够形成一般答案时，先给出直接答案，再按回答所需的最小范围展开研究。\n2. 用户没有提供具体理论时，根据问题暂定需要解释的机制，交付通用方法、相关知识和历史答案。不得把「请先提供理论」当成交付结果。\n3. 用户提供具体理论时，审查理论中的命题，研究它能够解决哪些人的什么问题，并检查历史上是否出现过相同机制。\n4. 缺少的信息只影响精度时，采用明确标注的暂定假设继续研究。只有缺失信息会改变研究对象或造成高风险误导时，才问 1 个最小问题。\n5. 用户要求短视频、课程、PPT 或文案时，在完成研究后追加对应表达版本。内容制作要求不会取消第二部分的历史研究。\n6. 用户明确要求只研究其中一部分时，服从该次明确要求。没有这种限制时，两个部分都要完成。\n\n以下输入必须直接回答并完成两个部分：\n\n> 我想知道如何基于一个理论去拍成一个短视频，用这个理论解决更多人的问题。因为只有我的这个方法解决更多人的问题，他们才愿意听我这个理论。\n\n处理这类输入时，即使用户没有提供具体理论，也要交付：命题审查、相关领域与作者、主理论、理论连接大众问题的方法、一个完整短视频示例，以及历史同构案例和条件性标准答案。\n\n---\n\n## 共同起点\n\n### Step 1：固定输入与任务\n\n从用户原话、当前对话和用户指定材料中提取：\n\n```markdown\n原始输入：\n输入类型：理论／观点／案例／方法论／现实困境\n使用场景：研究／课程／PPT／文案／短视频／现实决策\n用户希望得到的结果：\n需要解释或验证的核心机制：\n```\n\n### Step 2：审查命题\n\n输入包含判断、因果解释或方法论时，检查：\n\n| 风险 | 检查问题 |\n|---|---|\n| 绝对化 | 是否使用「都、一定、只有、只要、凡是、就」？反例能否轻易成立？ |\n| 因果跳跃 | 材料只展示相关、结果或感受，却被写成原因了吗？ |\n| 定义偷换 | 核心词在前后是否改变含义？ |\n| 经验普遍化 | 单个案例是否被扩展成所有场景的规律？ |\n| 反向推断 | 是否看到结果后倒推出唯一原因？ |\n\n作出一种判断：\n\n- `保留`：命题与材料匹配，边界清楚；\n- `收窄`：核心洞察可用，措辞或适用范围过宽；\n- `重构`：材料可用，原命题无法准确解释；\n- `放弃`：命题与材料均缺少支撑。\n\n先写修正后的标准。用户只提供现象或困境时，直接形成暂定研究问题。\n\n### Step 3：提取底层机制\n\n把输入转换成 1—4 个研究问题，例如：\n\n- 什么机制使具体问题提高注意力、理解或信任？\n- 为什么一个理论能够改变某类人的判断和行动？\n- 哪些条件决定同一方法产生不同结果？\n- 什么历史证据能够同时解释正例与反例？\n\n领域、人物、理论和历史案例都必须回答这些问题。只有关键词相似的候选要淘汰。\n\n---\n\n# 第一部分：知识与理论挖掘\n\n## 目标\n\n直接告诉用户解决当前问题需要了解哪些行业、学科、作者、理论和方法；将抽象理论映射到具体人群、触发场景、行动变化和可观察结果。\n\n第一部分包含完整的理论溯源能力：先审命题，再找理论；核实人物身份、理论原义和来源；用理论重新解释用户的问题；写清适用边界和反例。\n\n## Step 1：建立跨领域知识地图\n\n1. 围绕核心机制生成跨领域搜索轴。优先考虑行为科学、心理学、教育学、传播学、经济学、管理学、社会学、哲学、技术史、商业史及与问题直接相关的专业行业。\n2. 按回答所需的最小数量提出相关领域、行业、作者或人物。用户明确要求完整研究时，可以提出 4—8 个高相关领域或行业、5—10 位候选作者或人物；不用低质量候选凑数。\n3. 将候选分成三种关系：\n   - `支持`：直接解释核心机制；\n   - `补充`：解释主理论没有覆盖的新变量；\n   - `纠偏／反驳`：说明命题在什么条件下失效或出现相反结果。\n4. 每个候选都要写明对应机制、能够解释的部分和解释不了的部分。\n5. 相同机制只保留解释力、来源可靠性或信息增量更高的候选。\n\n## Step 2：筛选并核实理论\n\n| 维度 | 分值 | 判断标准 |\n|---|---:|---|\n| 机制匹配 | 0—3 | 能否解释用户问题的主要矛盾 |\n| 来源可靠 | 0—2 | 是否有原著、论文或权威档案 |\n| 人物辨识度 | 0—2 | 目标受众是否容易理解其身份 |\n| 可用于表达 | 0—2 | 是否有清楚概念或可核实表述 |\n| 边界清楚 | 0—1 | 是否能解释何时成立、何时失效 |\n\n总分低于 7 分不得成为主理论；`机制匹配 < 2` 或 `来源可靠 < 1` 时直接淘汰。候选评分用于内部判断，用户要求研究过程时再展示。\n\n默认保留：\n\n- 1 个主理论，负责解释核心机制；\n- 0—2 个辅助理论，只解释主理论没有覆盖的新变量；\n- 至少 1 个纠偏方向，用于建立边界。\n\n找不到高匹配理论时，直接说明「暂未找到足够匹配的理论」，保留经过收窄的经验判断，或改用学派、同行评议研究和行业证据。不得硬套名人。\n\n## Step 3：人物与理论核实\n\n人物定位使用：\n\n```markdown\n[国家或主要学术归属][相关身份][中文名]（[外文通行名]）\n```\n\n中文姓名优先采用本人中文署名、中文正式出版物或权威机构的译名。存在多个通行译名时注明「亦译……」。无法核实统一译名时保留外文名并说明情况，禁止自行音译。\n\n理论卡使用：\n\n```markdown\n理论名称：\n理论要解决的问题：\n核心机制：\n理论原义：\n原始出处：作者，《作品》，年份，版本／章节／页码\n核实状态：原始来源／权威二手来源／尚未核实\n```\n\n研究时区分：\n\n- `外文原话`：只用于后台核实；\n- `中文译文`：尽量保留原意，不添加案例结论；\n- `中文意译`：为了教学压缩，明确标注「意译」。\n\n给用户的正文只展示中文译文或明确标注的中文意译。页码随版本变化时同时写版本；只能确认章节时引用章节，不猜页码。\n\n## Step 4：把理论映射到用户的问题\n\n| 用户原句／现实事实 | 理论中的对应概念 | 理论解释 | 修正后的判断 |\n|---|---|---|---|\n\n检查理论是否解释了问题为什么发生、原说法在哪里过度、能否生成不同于常识的判断或行动，以及新解释有没有加入材料中不存在的事实。\n\n## Step 5：理论解决大众问题\n\n用户拿着一个理论寻找现实应用时，生成 6—10 个问题方向：\n\n| 具体人群 | 触发场景 | 当事人的原话 | 现有解法及局限 | 理论带来的行动变化 | 可观察结果 | 优先级 |\n|---|---|---|---|---|---|---|\n\n根据问题频率、痛感、理论解释力、行动可执行性、结果可感知性和理论独特性，筛出 3—5 个优先方向。受众范围很大但问题模糊的方向要降级。\n\n## Step 6：短视频应用\n\n用户要求短视频时，采用：\n\n> 理论核心机制 → 受影响的人群 → 高频触发场景 → 当事人原话 → 错误解法 → 最小行动 → 可观察结果\n\n默认交付 3 个短视频原型。用户没有提供具体理论时，也要选一个容易理解、来源可信的理论完成示例。\n\n```markdown\n### 原型：{受众能听懂的问题标题}\n\n- 目标人群与场景：\n- 开头钩子：使用当事人的语言呈现问题\n- 问题代价：继续沿用原方法会发生什么\n- 理论解释：只讲理解方法需要的最小概念\n- 最小行动：观众今天可以完成的一步\n- 案例或演示：提供可感知的正反对比\n- 结果验证：怎样判断方法有效\n- 理论回扣：这套理论解释了什么机制\n```\n\n短视频必须给观众一个可以执行并观察结果的改变。只有观点表达、缺少具体问题和行动差异的方向不能入选。\n\n## 第一部分默认输出\n\n```markdown\n## 直接答案\n\n{先用一段话回答用户当前问题}\n\n## 第一部分：知识与理论挖掘\n\n### 命题审查\n\n原命题：\n审查状态：保留／收窄／重构／放弃\n修正后的标准：\n\n### 相关领域、人物与理论地图\n\n| 关系 | 领域／行业 | 作者／人物 | 理论／作品 | 对应机制 | 能解释什么 | 解释不了什么 | 核实状态 |\n|---|---|---|---|---|---|---|---|\n\n### 主理论\n\n人物定位：\n理论名称：\n理论原义：\n中文译文／中文意译：\n原始出处：\n核实状态：\n\n### 理论如何解释当前问题\n\n| 当前问题 | 理论解释 | 得出的判断 |\n|---|---|---|\n\n### 理论能够解决的问题\n\n{根据请求输出问题地图、优先方向，以及短视频／PPT／课程版本}\n\n### 第一部分边界\n\n适合：\n不适合：\n反例：\n仍需核实：\n```\n\n---\n\n# 第二部分：历史同构与标准答案\n\n## 目标\n\n把同一个问题压缩成可比较的「结构指纹」，在商业史、管理史、技术史、职业史、传播史、教育史和制度史中寻找同构案例。通过成功案例、失败案例和反例的交叉比较，判断过去是否形成可复用的解决机制。\n\n## 核心原则\n\n1. **先抽象结构，再搜索人物。** 先确定角色、阶段、约束、矛盾和失败循环，避免因为某位名人听起来相似就强行类比。\n2. **比较机制，少讲传奇。** 关注当事人如何配置时间、资本、组织、产品、传播和风险，以及这些决策怎样影响结果。\n3. **成功、失败、反例一起看。** 默认包含最接近案例、跨领域重复样本、失败案例和反例；缺少某类证据时说明原因。\n4. **证据决定结论强度。** 单个故事只能产生案例启发；多个独立案例出现相同机制，才能形成条件性答案或成熟共识。\n5. **明确映射边界。** 每个案例都要说明相同处、不同处，以及差异是否破坏类比。\n6. **尊重时代差异。** 技术成本、融资环境、劳动市场、传播渠道和制度条件变化时，历史做法不能原样搬运。\n7. **区分事实、推断和假设。** 无法核验的轶事、名言、动机和因果关系不能写成事实。\n\n## Step 1：提取现实问题\n\n从用户原话和第一部分结论中提取：\n\n```markdown\n现实角色：\n所处阶段：\n必须维持或实现的结果：\n正在争夺的稀缺资源：\n同时存在的任务：\n主要矛盾：\n反复出现的失败循环：\n第一部分确认的核心机制与边界：\n```\n\n## Step 2：生成结构指纹\n\n| 维度 | 要回答的问题 |\n|---|---|\n| 主体 | 个体创作者、创始人、职业经理人、团队还是组织？ |\n| 阶段 | 生存、增长、规模化、转型、守成还是衰退？ |\n| 价值／收入结构 | 知识传播、单一现金牛、项目制、订阅、周期性销售还是多业务组合？ |\n| 稀缺资源 | 时间、注意力、现金、人才、信任还是渠道？ |\n| 核心张力 | 抽象理论与现实问题、当前交付与能力建设、亲自做与组织化等 |\n| 锁定机制 | 哪个必要任务持续占用资源，使解决它的能力无法建立？ |\n| 压力机制 | 波动、目标抬升、身份期待、沉没成本或组织惯性怎样影响决策？ |\n| 理想转变 | 用户希望从什么状态进入什么状态？ |\n\n最后写成一句结构命题：\n\n> 一个处于 `{阶段}` 的 `{主体}`，依赖 `{价值或交付结构}`，因 `{锁定机制}` 难以投入 `{能力建设}`，同时受到 `{压力机制}` 的持续牵引。\n\n广义方法问题可以采用与目标相符的结构命题，不强行套入收入或组织变量。\n\n## Step 3：提出案例搜索假设\n\n先列 3—6 个候选问题家族：\n\n```markdown\n候选问题家族：\n它与当前问题共享的结构：\n可能破坏类比的差异：\n需要寻找的证据：\n```\n\n候选问题家族必须来自结构指纹和第一部分的理论机制。行业相同只能作为线索，不能单独证明同构。\n\n## Step 4：研究历史案例\n\n用户明确要求历史研究时，默认研究 4—6 个案例，并覆盖四种证据角色：\n\n- `最近成功案例`：结构相似度最高，且完成了用户关心的转变；\n- `跨域重复样本`：行业或时代不同，底层约束相同；\n- `失败案例`：采用候选机制后仍然失败，用于检查机制是否被高估；\n- `反例或边界案例`：未采用主流机制仍然成功，或揭示解法只在特定条件下有效。\n\n某类案例确实找不到时，说明搜索范围、缺失原因及其对结论强度的影响。\n\n每个案例统一还原：\n\n```markdown\n## 案例：{人物／组织，时间}\n\n- 原始处境：\n- 真实约束：\n- 当时可选方案：\n- 实际决策：\n- 执行成本：\n- 后续结果：\n- 证据：\n- 证据状态：已核实事实／研究者解释／本次推断／待核实\n- 与用户相同之处：\n- 与用户不同之处：\n- 类比有效性：高／中／低\n- 能提取的机制：\n- 不能照搬的部分：\n```\n\n## Step 5：建立类比矩阵\n\n| 案例 | 阶段相似 | 价值／交付结构相似 | 稀缺资源相似 | 锁定机制相似 | 压力机制相似 | 结果可比 | 总体可信度 |\n|---|---|---|---|---|---|---|---|\n\n评分使用高／中／低，并补 1 句理由。只有行业或人物身份相似、结构维度大多为低的案例要淘汰。\n\n## Step 6：提炼重复机制\n\n| 重复机制 | 出现在哪些案例 | 可能的因果解释 | 成立条件 | 失败边界 | 证据强度 |\n|---|---|---|---|---|---|\n\n第一部分的理论负责解释机制可能怎样运作，历史案例负责检查这种机制是否反复出现。两部分只能重复常识时，保留证据更强、信息增量更高的表达。\n\n## Step 7：判断标准答案等级\n\n- `成熟共识`：多个高可信案例与系统研究共同支持，经过失败案例和反例检验后仍然成立；\n- `条件性答案`：机制反复有效，但依赖规模、现金流、人才、行业节奏、传播渠道或个人目标；\n- `尚无统一答案`：案例分歧明显，或历史条件差异足以破坏类比。\n\n答案使用：\n\n> 当 `{条件}` 成立时，历史上反复有效的做法是 `{机制}`，因为 `{因果解释}`。当 `{边界}` 出现时，这个答案容易失效。\n\n工具名、某位名人的个人习惯或一句格言不能单独成为标准答案。\n\n## Step 8：控制现实建议深度\n\n| 用户要求 | 停止位置 |\n|---|---|\n| 一般提问、要求回答问题 | 完成两部分，并给出 1—3 个可验证动作 |\n| 「先定位」「先研究计划」「暂不解决」 | 第一部分给出知识定位；第二部分给出结构定位、搜索假设和证据计划 |\n| 「研究以前怎么解决」 | 完成案例、类比矩阵和标准答案 |\n| 「结合我现在怎么办」 | 在历史研究后增加 1—3 个现实动作 |\n| 「帮我做完整计划」 | 完成研究并输出可交接的约束、机制和边界 |\n\n## 第二部分默认输出\n\n```markdown\n## 第二部分：历史同构与标准答案\n\n### 当前问题的历史定位\n\n结构命题：\n\n结构指纹：\n- 主体与阶段：\n- 价值、收入或交付：\n- 稀缺资源：\n- 核心张力：\n- 锁定循环：\n- 压力机制：\n\n### 候选问题家族\n\n| 问题家族 | 相似结构 | 关键差异 | 研究价值 |\n|---|---|---|---|\n\n### 历史案例\n\n{按统一字段写案例}\n\n### 类比有效性\n\n{类比矩阵与淘汰说明}\n\n### 反复出现的机制\n\n{重复机制表}\n\n### 标准答案判断\n\n结论等级：成熟共识／条件性答案／尚无统一答案\n\n答案：{带条件、因果解释和失效边界的机制}\n\n### 对当前问题的启发\n\n{遵守用户要求的建议深度}\n\n### 尚待确认\n\n- {会改变案例选择或结论的事实}\n\n### 资料来源\n\n- {可点击的具体来源}\n```\n\n---\n\n## 搜索与来源标准\n\n先依据用户提供的材料回答。只有外部事实会实质改变结论，或用户明确要求核实、来源、最新信息时，才联网；用户要求不联网时，禁止联网。\n\n遵循最小充分原则，不为补充理论、人物或案例扩大搜索。简单问题可以省略理论地图、历史案例和类比矩阵。证据足以支持结论后立即停止；同一事实连续 2 次无法核实，标注「尚未核实」并停止。\n\n来源优先级：\n\n1. 原著、原始论文、当事人档案、书信、备忘录、股东信和官方材料；\n2. 大学、学会、政府、博物馆、权威出版社、大学案例和权威传记；\n3. 同行评议论文、可靠学术工具书、同期报道和有编辑审核的专业媒体；\n4. 高质量二手解释；\n5. 百科、聚合文章和名言网站只用于发现线索，不能单独支撑关键结论。\n\n理论研究至少分别核实人物身份与理论原义。历史研究的核心事实尽量找到 2 个独立来源。经由二手文献发现的引文，要写明转引关系，不能伪装成已经直接查阅原著。\n\n## 最终输出顺序\n\n完整研究默认严格按照以下顺序交付；简单问题可以合并为直接答案、核心机制和带条件的标准答案：\n\n1. `直接答案`：先回答用户当前问题；\n2. `第一部分：知识与理论挖掘`；\n3. `第二部分：历史同构与标准答案`；\n4. `综合结论`：说明理论证据与历史证据共同支持什么、仍有哪些边界；\n5. `资料来源`。\n\n不要输出「模式判断」「请选择模式」或只完成第一部分后结束。研究量较大时可以压缩候选数量，但两个部分均须出现并形成实质结论。\n\n## 质量自检\n\n- 是否先直接回答用户问题？\n- 需要完整研究时，是否完成了知识／理论挖掘和历史同构两个部分？\n- 是否在第一部分提供相关领域、具体作者、理论、对应机制与核实状态？\n- 输入包含命题时，是否检查绝对化、因果跳跃和反例？\n- 是否核实主理论的人物身份、理论原义和来源？\n- 用户从理论寻找大众问题时，是否写出具体人群、触发场景、行动变化和可观察结果？\n- 用户要求短视频时，是否提供问题开场、最小行动、演示和结果验证？\n- 历史案例是否来自结构同构，并同时检查成功、失败和反例？\n- 「标准答案」是否包含适用条件、因果机制和失效边界？\n- 是否区分已核实事实、权威解释、本次推断和待核实线索？\n- 是否拒绝硬套人物、理论和历史故事？\n- 中文是否遵循《中文文案排版指北》？\n- 是否避免先否定后反转的二元套句？\n\n完成当前任务后直接结束。只有用户明确询问下一步，且当前环境已经安装 `/dbs` 时，简短提示：「下一步不确定时，可以输入 `/dbs`。」\n"},"replays":[{"id":"r1","skill":"135 学习闭环","file":null,"q":"我想学 Transformer 的注意力机制，从哪开始？","a":"# ① 阅读器 · 注意力机制的 3 个入口概念\n\n先给你三个概念，每个分三层。看完告诉我哪个是你现在的卡点，我再往下走。\n\n---\n\n## 概念 1：QKV —— 注意力是\"软检索\"，不是查表\n\n**L1 直觉**\n图书馆找资料。你脑子里的问题是 **Query**，每本书脊上的标签是 **Key**，书里的内容是 **Value**。你不只拿一本，而是按\"标签和我的问题有多像\"，把所有书的内容按比例掺起来。区别就在这：查表是硬匹配（要么给要么不给），注意力是软匹配——给多少由相似度算出来，**可微，所以能训练**。\n\n**L2 机制**\n- $Q=XW_Q,\\ K=XW_K,\\ V=XW_V$（同一份输入 X，三套投影）\n- 打分 $S = \\dfrac{QK^\\top}{\\sqrt{d_k}}$，按行 softmax 得权重 $A$，输出 $= AV$\n- 那个 $\\sqrt{d_k}$ 不是仪式感：点积方差随维度线性增大，不除一下 softmax 会饱和，梯度就死了\n- 形状：$X$ 是 $n\\times d$，$A$ 是 $n\\times n$ —— 记住这个 $n\\times n$\n\n**L3 应用**\n$n\\times n$ 就是长上下文一切痛苦的源头（$O(n^2)$ 显存和算力）。KV cache 只缓存 $K,V$ 不缓存 $A$，正是为了复用。另外别把这里的\"注意力\"和\"人类注意力\"混为一谈，中文同名误导了很多人。\n\n---\n\n## 概念 2：多头注意力 —— 不是一个头看得更用力，是分工\n\n**L1 直觉**\n一个人读句子，一次只能盯住一种关系（主语配谓语？代词指谁？）。多叫几个人，各自盯一种，最后汇报汇总。每个头有**自己的一套** $W_Q,W_K,W_V$。\n\n**L2 机制**\n- $h$ 个头，每头维度 $d_k=d_{model}/h$，各自算注意力 → 拼接 → 乘 $W_O$ 投回 $d_{model}$\n- 总计算量跟\"单头全维度\"差不多，但每个头在**不同的子空间**里做匹配，表达力更强\n- 少了最后的 $W_O$，各头只是被拼在一起，信息不融合，效果会掉\n\n**L3 应用**\n头不是个个都重要——有些可以剪掉几乎不掉点。还有明确分工的\"专职头\"（比如指向前一个 token 的头、归纳头 induction head）。工程上 MQA / GQA 就是让多个 Q 头**共享** K、V 头，把 KV cache 显存砍掉数倍，是推理加速的标准操作。\n\n---\n\n## 概念 3：位置编码 + 掩码 —— 注意力天生是个\"打乱的袋子\"\n\n**L1 直觉**\n纯粹的自注意力对顺序**完全不敏感**：你把句子里的词随便洗牌，输出只是跟着洗牌，内容不变。所以必须额外告诉它谁在前谁在后。同时，训练时不能让它偷看后面的答案，得拿布挡住。\n\n**L2 机制**\n- **位置**：正弦绝对编码（原版，外推差）→ 可学习编码（BERT）→ **RoPE**（把位置写进 Q/K 之间的**相对角度**，外推好，现在主流）\n- **掩码**：上三角填 $-\\infty$ 再 softmax，位置 $i$ 只能看到 $\\le i$，这是自回归生成的前提\n- 因果掩码还带来一个好处：训练时一次前向就能并行算所有位置的输出\n\n**L3 应用**\n长上下文扩展（RoPE 插值、NTK 缩放）基本都动在这把\"尺子\"上。推理时因为因果掩码，只能逐 token 出，所以才有 KV cache 和投机解码这套东西。padding mask 则是另一个常被混淆的、为了变长 batch 而存在的掩码。\n\n---\n\n**停下来，等你反馈。** 告诉我一件事就行：这三个里面，哪个你觉得自己\"看过但说不清\"，哪个是全新的？我按你的答案决定下一步给你哪种决策场景。","tokens":2173,"model":"deepseek-flash"},{"id":"r2","skill":"dbs-learning-beta","file":"dbs-learning-beta","q":"我要不要辞掉现在的工作，全职去做独立开发？","a":"# 要不要辞掉工作全职做独立开发\n\n## 课题类型判定\n\n类型：个人决策\n判定依据：你要的是一个决定，缺的是约束条件（跑道、收入斜率、可投入时间），不是关于独立开发的知识。\n交付物：判据 + 代价对照 + 裁决点。\n\n（课题字面像在问「独立开发能不能做」，但你要的是「我该不该现在辞」，按个人决策处理。）\n\n## 判据\n\n| # | 判据 | 归属 | 说明 |\n|---|---|---|---|\n| 1 | 跑道长度 = 可动用现金 ÷ 每月必须支出 | 需你填写 | 两个数字都由你提供；「必须支出」指断掉一切可选消费后仍躲不掉的部分 |\n| 2 | 当前项目的收入斜率：最近 90 天有几笔来自陌生人的付款，趋势朝上／平／朝下 | 需你填写 | 熟人、朋友支持不算；只看陌生人是否愿意付钱 |\n| 3 | 全职带来的周投入增量 = 全职后每周可投入小时数 − 现在业余投入小时数 | 需你填写 | 很多人算出这个增量只有个位数小时，这种情况下辞职换不到多少产能 |\n| 4 | 现有工作的全部对价，逐项列出并标价 | 通用判据 | 除薪水外通常还包括：社保与公积金、行业信息源、可调用的人脉、职位带来的身份背书、下一份工作的谈判筹码 |\n| 5 | 回程成本：辞职后多久内还能拿回同等条件的岗位 | 通用判据 | 招聘市场对空窗期的容忍度、你的技能折旧速度、行业当前招人松紧 |\n| 6 | 项目所处阶段：未上线／已上线无收入／有零星付费／有可复购的付费用户 | 需你填写 | 阶段决定你面对的是一次实验还是一次止损，两者的代价结构不同 |\n\n## 只有你能回答的问题\n\n1. 你每月必须花掉的钱是多少？现在可动用的现金是多少？\n2. 最近 90 天，你的项目收到过多少笔陌生人付款？上一个月和这个月相比是增是减？\n3. 出现什么可观测的信号时，你会回去找工作？（例如连续几个月零付费、跑道剩几个月）\n\n## 代价对照\n\n| 选项 | 你要付的代价 | 谁付 | 可逆性 |\n|---|---|---|---|\n| 辞职，全职做 | 现金流断掉、社保需自缴、简历出现空窗期、失去原有的信息源与人脉 | 你自己；若有共同开支的人，他们也承担 | 收入可以恢复，岗位条件不一定；空窗期越长回程越贵 |\n| 在职，业余做 | 进度慢、时间被切碎、长期低强度消耗导致的疲劳 | 你自己 | 高 |\n| 在职但压缩工时（减薪、兼职、停薪留职） | 收入下降但不归零，需要雇主同意 | 你自己 + 雇主 | 中 |\n| 什么都不变 | 时间成本 | 你自己 | 高 |\n\n## 最小实验\n\n只做一个能对第 2 条判据产生实测数字的动作：\n\n- **做什么**：设定一段固定周期，每周投入固定小时数（比如 10 小时），把产品的付费入口做出来并对外分发一次，记录付款笔数。\n- **看什么**：陌生付费笔数、是否有人复购、每周 10 小时是否真的能稳定腾出来。\n- **多久**：8 周。周期太短看不出斜率，太长则跑道成本变高。\n- **做几次**：连续做满 8 周，每周记一次数，中间不改方案。\n\n这个实验只产生数字。它回答的是「现在这个投入强度下的斜率是多少」，不回答要不要辞职。\n\n如果 8 周内你无法稳定腾出那 10 小时，说明每周时间本身是瓶颈，那么第 3 条判据需要重新算。\n\n## 本篇没有做的事\n\n- 没有替你决定辞或不辞。\n- 没有给唯一答案，也没有排序选项的优劣。\n- 跑道长度、收入斜率、周投入增量这三条只能由你填，填完之后倾向哪边是你要做的裁决。\n- 没有推断你的收入、存款、家庭负担、健康状况。\n\n---\n\n## 学习反馈\n\n1. 你现在倾向哪边？\n2. 卡在哪一条上？\n3. 哪一条对你的情况不适用？","tokens":4973,"model":"deepseek-flash"},{"id":"r3","skill":"dbs-standard-answer","file":"dbs-standard-answer","q":"小团队到底该不该自建大模型推理，而不是调 API？","a":"# 直接答案\n\n对绝大多数小团队，默认答案是**调 API**，自建只在很窄的条件下成立。判断依据不是\"自建能不能省钱\"这一条，而是四个可测变量的组合：**持续利用率、负载同质度、合规刚性、运维能力**。把当下的公开 API 价格、云 GPU 价格和你真实的日 token 量代进下面的盈亏平衡公式，如果连乐观假设下都算不过来，那自建唯一还站得住的理由就只剩合规和\"这项能力本身是你的产品\"。\n\n真正该做的事排在最前面：**先建退出期权，再决定要不要建基础设施**。把模型调用收口到一个内部接口、维护版本化的 prompt 与评测集，这一步成本极低，无论最后自建与否都是有正收益的投资；它同时把供应商涨价和停服的风险降到可接受水平。\n\n本次未联网核实，价格为量级示意，请以当期价目表和你自己的压测数据为准。默认假设：团队 2–20 人，负载以交互式产品功能为主，非强监管行业。\n\n---\n\n# 第一部分：知识与理论挖掘\n\n## 命题审查\n\n**原命题（隐含）**：自建推理 vs 调 API 是一道二选一，答案取决于\"哪个更便宜\"。\n\n**审查状态：重构。**\n\n三个问题：一是\"省钱\"是自建最弱的一个理由（后面用排队论和需求池化说明为什么结构性不成立）；二是二选一框架遮蔽了中间层——无服务器 GPU、批量接口、托管微调、专属吞吐、蒸馏小模型自托管，这些才是小团队最可能真正成立的形态；三是问题里没区分**拥有模型**（权重、微调、评测）和**运行模型**（GPU、调度、运维），这两件事的成本结构完全不同，混在一起会让判断失真。\n\n**修正后的标准**：这是一个资产专用性与规模经济的择层问题。要问的是\"在当前这四个变量下，哪一层应该内化\"，而不是\"哪一边更便宜\"。\n\n## 相关领域、人物与理论地图\n\n| 关系 | 领域 | 人物 | 理论／作品 | 对应机制 | 解释不了什么 | 核实状态 |\n|---|---|---|---|---|---|---|\n| **主** | 组织经济学 | 罗纳德·科斯（Ronald H. Coase）；奥利弗·威廉姆森（Oliver E. Williamson） | 企业边界；资产专用性与要挟 | 供应商具有事后议价力时，一体化是理性回应 | 不告诉技术成本曲线形状 | 原典已核实 |\n| **辅** | 运筹学／排队论 | 约翰·利特尔（John D. C. Little）；约翰·金曼（John Kingman） | 利特尔法则；金曼公式 | 利用率趋近 1 时等待时间非线性爆炸，尾延迟逼你把利用率压到很低 | 不解释合规动机 | 原典已核实 |\n| **辅** | 产业组织 | 西奥多·赖特（Theodore P. Wright）；布鲁斯·亨德森（Bruce Henderson） | 赖特定律；经验曲线 | 成本随累计产量下降，供应商的累计产量远大于你 | 不解释差异化能力 | 已核实 |\n| **纠偏** | 战略管理 | 普拉哈拉德与哈默尔（Prahalad & Hamel）；西蒙·沃德利（Simon Wardley）；乔尔·斯波尔斯基（Joel Spolsky） | 核心能力；沃德利图；互补品商品化（Strategy Letter V, 2002） | 只自建\"尚未商品化且能差异化\"的层；推理正快速商品化 | 不给成本公式 | 已核实（Spolsky 文可查证） |\n| **反驳／边界** | 平台战略 | 艾森曼、帕克、范阿尔斯泰恩（Eisenmann, Parker, Van Alstyne） | 平台包络（Platform Envelopment, SMJ 2011） | 依赖可移动的平台有被吞噬风险，但解法是退出期权而非立即一体化 | 不告诉你何时该真的建 | 已核实 |\n| **边界** | 生产管理 | 高德拉特（Eliyahu M. Goldratt）；安迪·格鲁夫（Andy Grove） | 约束理论（《目标》1984）；限制步骤（《高产出管理》1983） | 瓶颈不在推理成本时，优化它是局部最优 | 不解释瓶颈恰好是推理的情形 | 已核实 |\n| **补充** | 技术史 | 保罗·戴维（Paul A. David）；沃伦·德瓦因（Warren Devine） | 《发电机与计算机》(AER 1990)；《从轴传动到电线》(JEH 1983) | 通用技术变公共事业时，赢家是围绕充裕重新设计产品的人 | 不直接给采购建议 | 已核实 |\n\n**主理论选定**：交易成本经济学（科斯 1937 + 威廉姆森 1975／1985）。理由是它直接回答\"企业边界画在哪\"，且给出的判断变量（资产专用性、交易频率、不确定性）恰好可以映射到推理采购上。配角理论只用来补它解释不了的两块：单位成本的数学（排队论 + 池化）和\"这件事是不是你当前瓶颈\"（约束理论）。\n\n排除项：各种\"自建更省钱\"的经验分享帖，多为单案例且不控制利用率；\"AI 公司必须有自己的模型\"这类身份叙事，机制匹配度低于 2 分，淘汰。\n\n## 主理论\n\n- **人物定位**：英裔美国经济学家罗纳德·H. 科斯（Ronald H. Coase，1910–2013）；美国经济学家奥利弗·E. 威廉姆森（Oliver E. Williamson，1932–2020），2009 年诺贝尔经济学奖。\n- **理论名称**：交易成本经济学／企业边界理论。\n- **理论要解决的问题**：为什么有些活动在市场里用合同完成，有些被收进企业内部？\n- **核心机制**：市场交易本身有成本（搜寻、缔约、监督、重新谈判）。当交易涉及**资产专用性**（投入只能用于这段关系）、**频率高**、**不确定性大**时，合同容易被事后要挟，一体化就更划算。反之，通用、标准化、可随时替换的投入，交给市场更便宜。\n- **理论原义**（中文意译）：企业的边界，落在\"内部组织的边际成本等于市场交易的边际成本\"那一点上。\n- **原始出处**：Coase, R. H., \"The Nature of the Firm,\" *Economica*, 4(16), 1937, pp. 386–405；Williamson, O. E., *Markets and Hierarchies*, Free Press, 1975；*The Economic Institutions of Capitalism*, Free Press, 1985。\n- **核实状态**：原始来源已确认。另可参考 Klein, Crawford & Alchian (1978, *Journal of Law and Economics*) 的资产专用性论述——但其中引用的 GM–Fisher Body 案例后来被科斯本人（2000）与 Casadesus-Masanell & Spulber（2007）质疑，引用时不宜当作已确证的事实。\n\n## 理论如何解释当前问题\n\n| 当前问题里的说法 | 理论概念 | 理论解释 | 修正后的判断 |\n|---|---|---|---|\n| \"我们量大了，自建更便宜\" | 规模经济 + 需求池化 | 单一小团队的峰谷与自身业务强相关；供应商把成千上万个不相关客户的需求池化后，同等服务水平所需容量远低于你单独配置 | 只有负载**平稳且同质**时这条才可能成立，尖峰型负载几乎不可能 |\n| \"数据敏感，必须自建\" | 资产专用性 | 若托管方在你可用区域能提供零保留、私有端点、专属吞吐，专用性已被合同消解 | 先穷尽托管合规方案，再谈自建；顺序错了会白花一笔钱 |\n| \"API 会涨价、会停服\" | 平台包络 + 事后议价 | 供应商确实具有事后议价力，这是真实风险 | 解法是降低切换成本，不是立即一体化 |\n| \"我们想有自己的模型能力\" | 核心能力 | 权重、微调、评测、数据管线是能力；跑 GPU 不是 | 设计层值得拥有（参见半导体业的设计／制造分离） |\n| \"团队能搞\" | 约束理论 | 若当前瓶颈是获客或留存，把最好的工程师放去调 vLLM 是优化非约束环节 | 先确认推理成本是否真的是限制步骤 |\n\n**理论带来的单位成本公式**（把当期真实数字填进去）：\n\n```\n自建单位成本 = (GPU 数 × 小时单价 × 730 + 人力 + 存储/带宽 + 冗余备份)\n             ÷ [ 吞吐上限(token/s) × 2.63×10⁶ 秒 × 持续利用率 U ]\n```\n\n分母里那个 **U** 是关键。排队论的金曼公式告诉我们，利用率接近 1 时等待时间非线性发散；要让 p95 延迟可接受，交互式负载的现实 U 通常只有 0.2–0.4，而批量离线负载可以做到 0.7–0.9。差一个量级的 U，就是差一个量级的单位成本。这解释了为什么大厂的每 token 成本下限你复制不了：它是**需求池化**的结果，不是规模本身。\n\n量级示意（务必自行核实）：单张中端 GPU 月租约 1,000–2,000 美元量级；同能力 API 单价在过去两年里呈数量级下降趋势（Wright's Law 的典型形态）。供应商在比你陡得多的累计产量曲线上，这意味着即使今天算得过来，两年后也未必算得过来。\n\n## 理论能够解决的问题\n\n按\"是否值得自建\"把团队分成几类，优先级从高到低：\n\n1. **强监管／数据主权团队**（医疗、金融、政府、涉密）：托管方案无法满足条款时，自建是合规成本，不是成本优化。这类团队应直接找云厂商的区域化私有部署，再评估自建。\n2. **高平稳量的批处理团队**（批量文档处理、内容生成、数据标注、离线评分）：日均 token 大、可排队、延迟不敏感，U 能做高。这类是唯一在\"省钱\"口径下经常算得过来的。\n3. **以推理为产品的团队**（推理就是交付物、毛利主要被推理成本吃掉、需要特殊量化或超长上下文）：自建是产品工程的一部分。\n4. **需要自有模型的团队**（微调、蒸馏后的小模型，效果够用且便宜）：真正的形态往往是蒸馏到 1–8B，单卡自托管，而不是自托管一个前沿大模型。\n5. **其余全部团队**（增长期、负载尖峰、多模型实验、PMF 未验证）：调 API，并把力气花在抽象层和评测上。\n\n## 第一部分边界\n\n- **适合本判断的**：有可测的 token 用量、明确的延迟 SLO、能说清合规条款的场景。\n- **不适合**：还没有真实用量数据、还在找 PMF 的团队——此时任何成本测算的输入都是猜测。\n- **反例**：37signals 这类小团队确实通过离开公有云省下了七位数美元（见第二部分），说明\"小团队一定不该自建\"是错的；但它们的负载平稳、团队有运维能力，条件项和你未必一样。\n- **仍需核实**：当期 GPU 租用与 API 报价、你的真实利用率与峰谷比、你所在行业是否真有不可外包的监管条款。\n\n---\n\n# 第二部分：历史同构与标准答案\n\n## 当前问题的历史定位\n\n**结构命题**：一个处于早期或增长期、以少量工程人力交付产品的小团队，依赖按量付费的外部能力完成核心功能，因把\"单位成本与自主性\"当作当前瓶颈，考虑以固定成本（GPU、运维、招聘）换取单位成本下降与可控性，同时受到增长不确定性与供应商定价／停服风险的牵引。\n\n**结构指纹**\n\n| 维度 | 内容 |\n|---|---|\n| 主体与阶段 | 小团队，早期到增长期，产品未定型 |\n| 价值／交付结构 | 按量付费的可变成本，随用量线性增长 |\n| 稀缺资源 | 工程人力（尤其是最好那一个人）、现金、注意力 |\n| 核心张力 | 降低单位成本 vs 保持产品迭代速度 |\n| 锁定循环 | 用量增长带来账单增长，账单增长催生自建念头，自建吃掉工程人力，产品迭代变慢，用量增长放缓 |\n| 压力机制 | 供应商定价变动、模型下线、同行动作带来的身份焦虑 |\n\n## 候选问题家族\n\n| 问题家族 | 相似结构 | 关键差异 | 研究价值 |\n|---|---|---|---|\n| 云计算自建 vs 采购（2006–） | 固定成本换可变成本，运维占用工程人力 | 云回迁的公开案例更多、数字更可查 | 最高 |\n| 内容分发：自建 CDN vs 商用 | 平稳高峰流量 vs 尖峰流量 | 视频负载极度同质 | 高（同一主体相反决策） |\n| 半导体：IDM vs 代工（1987–） | 设计层与制造层的分离 | 资本强度高一个量级 | 高（概念映射最好） |\n| 早期工厂自发电 vs 电网（1900–1930） | 通用技术变公共事业 | 时代条件差异大 | 中（只能取方向） |\n| 平台 API 依赖（Twitter／Reddit 2023） | 事后议价与停服 | 没有\"自建\"这个选项可比 | 中（反例用） |\n| 企业邮件／办公套件自建 vs SaaS | 商品化 + 长运维尾巴 | 合规动机不同 | 中 |\n\n## 历史案例\n\n### 案例一：Dropbox 存储回迁（2015–2016）\n\n- **原始处境**：绝大部分存储跑在 AWS S3 上，EB 级数据，账单随用户增长线性上升。\n- **真实约束**：存储负载高度同质、可无限分片、延迟要求宽松，但调用量大到足以让单价成为主要成本项。\n- **实际决策**：自研 Magic Pocket，把大部分冷热存储迁到自有硬件与自建数据中心。\n- **后续结果**：2018 年 S-1 中披露，基础设施优化在 2016–2017 两年显著改善了毛利率（公开提到的量级约 7,000 万美元，**需核实原文数字**）。\n- **证据状态**：已核实事实（公司披露文件）+ 本次推断（条件归纳）。\n- **相同之处**：都是\"高平稳量 + 同质负载 + 单价敏感\"。\n- **不同之处**：Dropbox 是 EB 级规模，你是小团队；存储的利用率可以做到接近 1，交互式推理做不到。\n- **类比有效性**：中。机制同构，量级不同。**能提取的机制**：同质、可排队、高平稳的负载是自建唯一稳定的成本理由。\n\n### 案例二：37signals／Basecamp 离开公有云（2022–2023）\n\n- **原始处境**：年云支出约 300 万美元量级，公司规模不大，产品负载相对平稳。\n- **真实约束**：团队有真实且享受的系统运维能力（这是最被低估的条件项），且公司不处于必须全速扩张的阶段。\n- **实际决策**：采购自有服务器、租用两个托管机房，保留部分云服务做备份等边缘用途。\n- **后续结果**：官方口径是五年省下约 700 万美元（\"We stand to save $7m over five years from our cloud exit\"，**需核实标题与数字**）。\n- **证据状态**：已核实事实（公司博客公开陈述）+ 研究者解释。独立第三方审计未公开。\n- **相同之处**：小团队、平稳负载、具备运维能力、固定成本替代可变成本。\n- **不同之处**：他们同时把\"离开云\"做成了公开叙事，这对决策有加成作用，你的团队未必有；他们的负载远比 LLM 推理简单。\n- **类比有效性**：高。**能提取的机制**：小团队自建可以成立，前提是负载平稳 + 运维能力内生 + 不处于扩张冲刺期。\n\n### 案例三：Stack Overflow 裸金属自托管（2016 起）\n\n- **原始处境**：月页面浏览十亿量级，但流量极其稳定可预测。\n- **实际决策**：坚持裸金属，少量服务器（公开描述为个位数 Web 服务器加少量数据库与缓存）承载全站。\n- **后续结果**：长期以极小的运维团队维持高可用。Nick Craver 的架构系列文章是主要公开来源（**具体台数需核实原文**）。\n- **证据状态**：已核实事实（工程博客）+ 研究者解释。\n- **相同之处**：同质、平稳、可预测的负载。\n- **不同之处**：负载是典型的缓存命中型读流量，与 LLM 推理的算力密集形态差别大。\n- **类比有效性**：中。**能提取的机制**：可预测性是自建的关键前提；同时业界反复承认\"不建议一般团队模仿\"，这是重要的边界提示。\n\n### 案例四：Netflix —— 同一公司对两个组件做相反决策（2011–）\n\n- **原始处境**：视频分发量巨大且晚高峰极度集中；计算与业务逻辑部分需求多变。\n- **实际决策**：**自建** Open Connect，把缓存设备部署进 ISP 内部；**继续采购** AWS 承载几乎全部计算、存储和业务系统。\n- **后续结果**：Open Connect 长期承载北美高峰下行流量的相当大比例（Sandvine 历年数据曾被广泛引用，**具体比例需核实**）。\n- **证据状态**：已核实事实 + 研究者解释。\n- **相同之处**：决策变量与你的问题完全一致——利用率、同质度、可预测性。\n- **不同之处**：他们的量级是极端值，判断更容易。\n- **类比有效性**：高，且教学价值最高。**能提取的机制**：这不是\"公司该不该自建\"，而是\"哪个组件该自建\"。决策标准是可迁移的：**量极大、极平稳、负载极同质 → 建；多变、异构、需求不确定 → 买**。\n\n### 案例五：半导体业的设计／制造分离（1987–）\n\n- **原始处境**：早期半导体公司必须自己建厂（IDM 模式），资本强度极高。\n- **实际决策**：台积电（1987 年成立，张忠谋创立）开创纯代工模式后，绝大多数公司转为 fabless：**拥有设计，采购制造**；只有极少数规模最大或技术领先者继续保留制造。\n- **后续结果**：fabless／foundry 分工成为行业主流。\n- **证据状态**：已核实事实（行业史）。\n- **相同之处**：都是\"该拥有哪一层\"的问题。\n- **不同之处**：半导体是资本强度极端值，推理的资本门槛低几个量级，所以自建的相对门槛更低。\n- **类比有效性**：中高。**能提取的机制**：**设计层与制造层可以分开拥有**。对应到你这儿：模型权重、微调、评测、数据是你该拥有的设计层；GPU 运维是制造层，通常可以外包。\n\n### 案例六（反例）：平台 API 依赖的断裂（2023）\n\n- **原始处境**：大量小团队与第三方客户端把产品建在 Twitter 与 Reddit 的公开 API 上。\n- **实际决策**：它们没有自建替代能力，也没有退出路径。\n- **后续结果**：Twitter 2023 年 2 月终止免费 API 访问，第三方客户端（Tweetbot、Twitterrific）随即停摆；Reddit 2023 年 4 月公布新定价，Apollo 宣布于 6 月 30 日关闭。\n- **证据状态**：已核实事实。\n- **相同之处**：依赖外部能力，且该能力可被单方面改变条款。\n- **不同之处**：这些团队**当时没有自建选项**，所以反例说明的是\"没有退出期权的代价\"，而不是\"当时应该自建\"。\n- **类比有效性**：中。**能提取的机制**：面对平台风险，历史有效解是**提前把切换成本降到很低**，而不是提前把基础设施建起来。前者几乎总划算，后者只有满足条件才划算。\n\n## 类比有效性\n\n| 案例 | 阶段相似 | 交付结构相似 | 稀缺资源相似 | 锁定机制相似 | 压力机制相似 | 总体可信度 |\n|---|---|---|---|---|---|---|\n| 37signals | 高 | 高 | 高 | 中 | 中 | **高**（最接近，但团队运维能力不可复制） |\n| Netflix 双决策 | 中 | 高 | 中 | 高 | 中 | **高**（决策标准最可迁移） |\n| Dropbox | 低 | 中 | 中 | 高 | 中 | 中（量级差异太大） |\n| Stack Overflow | 中 | 中 | 高 | 中 | 低 | 中 |\n| 半导体分工 | 低 | 中 | 中 | 中 | 中 | 中高（概念映射好） |\n| 平台 API 断裂 | 中 | 高 | 高 | 高 | 高 | 中（只能用于反例） |\n\n淘汰项：各类\"XX 公司自建模型省了多少钱\"的自媒体报道，未披露利用率与人力成本，机制信息量接近零。\n\n## 反复出现的机制\n\n| 重复机制 | 出现在哪些案例 | 因果解释 | 成立条件 | 失败边界 | 证据强度 |\n|---|---|---|---|---|---|\n| **M1 高且平稳的利用率是唯一稳定的成本理由** | Dropbox、37signals、Stack Overflow、Netflix CDN | 固定成本只在高占空比下被摊薄 | 负载可预测、可排队 | 尖峰型负载下固定成本变成纯浪费 | 强 |\n| **M2 需求池化制造供应商的成本下限** | 全部反例的反面 | 不相关客户的需求聚合后，同等服务水平所需容量更低 | 供应商客户群足够多样 | 供应商定价权滥用时会失效 | 强（排队论 + 产业组织） |\n| **M3 同质、可批量、可离线适合自建；交互式、尖峰、异构适合采购** | Netflix、Dropbox vs Netflix 计算层 | 延迟约束直接决定可用的利用率上限 | 存在可接受排队的任务 | 主链路是交互式时失效 | 强 |\n| **M4 成功自建者都有一支愿意且擅长运维的班子** | 37signals、Stack Overflow | 运维占用的是最稀缺的工程注意力 | 存在这样的内部能力 | 能力依赖个别人，人走即崩 | 中强 |\n| **M5 学习曲线在供应商一侧更陡** | 全部 | 供应商累计产量大，成本随累计产量下降更快 | 技术仍在快速迭代期 | 技术进入平台期后差距缩小 | 中强 |\n| **M6 平台依赖的历史解法是退出期权，不是提前一体化** | Twitter／Reddit 反例 | 切换成本是可控变量，基础设施是沉没成本 | 存在替代方案与抽象层 | 只有单一供应商且无替代时失效 | 强 |\n| **M7 设计层与制造层可以分开拥有** | 半导体、Netflix、Dropbox | 两层的成本结构与差异化潜力不同 | 制造层已商品化 | 制造层本身是差异化来源时失效 | 强 |\n\n## 标准答案判断\n\n**结论等级：条件性答案**（其中\"默认采购\"部分接近成熟共识）。\n\n> 当负载**量大且平稳**（在可接受的 p95 延迟下能维持较高的持续利用率）、任务**同质**（少数固定模型、固定任务、可批量或可离线）、存在**无法用托管方案满足的合规或主权要求**，或供应商对关键输入具有**事后议价力而你已具备运维能力**时，历史上反复有效的做法是**把这一层内化**，因为它同时满足\"高资产专用性\"与\"高可摊销固定成本\"两个条件。当这些条件不成立时——尤其是负载呈尖峰状、需要多模型、或团队正处于产品冲刺期——同一做法通常无效甚至反向，因为共享层依靠需求池化和累计产量学习，取得你无法在同等服务水平下复制的单位成本下限。\n\n**这个答案最容易被误用的地方**：把 37signals 的故事读成\"小团队就该自建\"。它们是先有平稳负载和现成运维能力，才做的决定，顺序不能颠倒。\n\n## 对当前问题的启发\n\n三个可以本周就做完、且无论结论如何都有正收益的动作：\n\n1. **量三个数**：过去 4 周的日均与峰值 token 用量、峰谷比、p95 延迟要求。同时数一下任务有几类（几个模型、几类 prompt）。如果你的峰谷比很高、或者任务类型超过三类，M3 已经给了答案。\n2. **做一次纸面盈亏平衡**：用上面的公式，把当期真实 GPU 租用价、你雇得起的人的年成本、以及**现实的 U**（交互式按 0.2–0.4，批量按 0.7–0.9）填进去。如果在乐观假设下仍然不便宜，剩下的唯一理由只能是合规。\n3. **买退出期权（一周工作量）**：把所有模型调用收口到一个内部接口，建立版本化的 prompt 与评测集，并确认第二家供应商的接入路径。这一步同时降低成本、降低供应商议价风险，并且是未来任何自建决策的必要前置条件。\n\n如果前两步真的指向自建，**从批量、离线、最高频、最敏感的那一个任务开始**，不要从交互式主链路开始——前者能把 U 做高，后者会把你的 p95 和预算同时拖垮。\n\n## 尚待确认\n\n- 你们真实的日均 token 量与峰谷比（这一项直接决定结论）。\n- p95 延迟要求，以及是否存在可接受排队的非交互任务。\n- 所在行业是否存在不允许数据出境的条款；若有，托管方的区域化私有部署是否已能满足。\n- 团队里是否有一个**愿意且擅长**做 GPU／推理栈运维的人。这一项在历史上是成功自建的隐性前提，且常常被高估自己的团队忽略。\n\n---\n\n# 综合结论\n\n理论侧和案例侧指向同一个结论，而且互相解释：**交易成本经济学**说明自建的适用条件是资产专用性高、交易频率高、不确定性大；**排队论与需求池化**说明为什么大多数小团队在成本维度上先天不满足这些条件——供应商的单位成本来自聚合，而不是来自更勤奋；**约束理论**则提醒，这一切成立的前提是推理成本确实是你当前的限制步骤。历史案例从正反两面验证了同一组条件：37signals、Dropbox、Stack Overflow、Netflix 的 CDN 都满足\"高平稳量 + 同质负载 + 内生运维能力\"，而把它们当作普遍建议的团队，过去的结局通常是先建了私有云，几年后再迁回去，中间损失的是工程师的时间和产品速度。\n\n边界也很清楚：合规刚性是个例外通道，走这条路时别把它包装成成本决策；供应商风险是真实风险，但历史上的有效应对是退出期权，不是提前一体化。这两件事经常被混为一谈，导致团队把注意力投在了一个既贵又慢的解决方案上。\n\n---\n\n# 资料来源\n\n本次未联网核实，以下为可检索的具体出处，标注了核实状态。涉及数字的部分请在引用前查阅原始材料：\n\n**理论与原典**\n- Coase, R. H., \"The Nature of the Firm,\" *Economica* 4(16), 1937, pp. 386–405.（已核实）\n- Williamson, O. E., *Markets and Hierarchies*, Free Press, 1975；*The Economic Institutions of Capitalism*, Free Press, 1985.（已核实）\n- Klein, B., Crawford, R., Alchian, A., \"Vertical Integration, Appropriable Rents, and the Competitive Contracting Process,\" *Journal of Law and Economics*, 1978.（已核实；其中 GM–Fisher Body 案例的解释后有争议，见 Coase 2000 与 Casadesus-Masanell & Spulber 2007）\n- Little, J. D. C., \"A Proof for the Queuing Formula: L = λW,\" *Operations Research*, 1961.（已核实）\n- Wright, T. P., \"Factors Affecting the Cost of Airplanes,\" *Journal of the Aeronautical Sciences*, 1936.（已核实）\n- Prahalad, C. K. & Hamel, G., \"The Core Competence of the Corporation,\" *Harvard Business Review*, 1990.（已核实）\n- Spolsky, J., \"Strategy Letter V,\" Joel on Software, 2002 年 6 月 12 日.（已核实）\n- Eisenmann, T., Parker, G., Van Alstyne, M., \"Platform Envelopment,\" *Strategic Management Journal*, 2011.（已核实）\n- Goldratt, E. M. & Cox, J., *The Goal*, 1984；Grove, A., *High Output Management*, 1983.（已核实）\n- David, P. A., \"The Dynamo and the Computer: An Historical Perspective on the Modern Productivity Paradox,\" *American Economic Review*, 1990；Devine, W. D., \"From Shafts to Wires,\" *Journal of Economic History*, 1983.（已核实）\n- Wardley, S., *Wardley Maps*（在线书，持续更新）.（已核实）\n\n**案例材料（数字需核实）**\n- Dropbox 2018 年 S-1 招股书，关于基础设施自建带来的毛利率改善；Dropbox 工程博客 Magic Pocket 相关文章；Wired/Backchannel 2016 年关于 Dropbox const byId = new Map(nodes.map(n => [n.id, n]));
const neighbors = new Map(nodes.map(n => [n.id, { pre: [], post: [] }]));

/* ── 状态 ───────────────────────────────────────────── */
let mode = 'grid';
let rotX = -0.22, rotY = 0.5, zoom = 1.08, panX = 0, panY = 0;
let selected = null, hovered = null, filter = null;

/* ── 我的标记层：**不能自己标「学过」** ──────────────────────────
   所有者 09-12 08:47 的批评：「变成了一个摆设……这样子干你没法倒逼」
   原来自报——点一下「学过」就变绿，零证据。那就是摆设。
   现在：只有**写过一次复述、被判过**才可能有环。判定人不是学习者自己。
     pass = 复述过了（青环）
     fail = 验过、没过，正在倒回（红环）
     mech = 只过了机械覆盖检查，没经语义判定（琥珀环，不算学会）
     无环 = 没验过
   布局只由 nodes/edges 决定，标记不参与任何坐标计算。 */
const MARK_KEY = 'zss135.proof.v2';   // v1 是自报的，作废不迁移
let marks = {};   // { [id]: {state, said, missing:[], wrong:[], backTo:[], why, at} }
try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || '{}') || {}; } catch (e) { marks = {}; }
// 老版本存的是字符串 'learned'/'gap'，直接丢掉——那是自报，不是证据
for (const k of Object.keys(marks)) if (typeof marks[k] === 'string') delete marks[k];
function saveMarks() { try { localStorage.setItem(MARK_KEY, JSON.stringify(marks)); } catch (e) {} }

function stats() {
  const v = Object.values(marks);
  return {
    pass: v.filter(x => x.state === 'pass').length,
    fail: v.filter(x => x.state === 'fail').length,
    mech: v.filter(x => x.state === 'mech').length,
    done: v.length,
  };
}
function refreshMarks() {
  const s = stats();
  const el = document.getElementById('myrow');
  if (el) el.innerHTML =
    `<span class="dot" style="background:#5ee0c0"></span>复述过了<span class="n">${s.pass}</span>` +
    `<span class="dot" style="background:#ff4d4d;margin-left:12px"></span>没过·倒回中<span class="n">${s.fail}</span>` +
    (s.mech ? `<span class="dot" style="background:#e0a94a;margin-left:12px"></span>只过机器检查<span class="n">${s.mech}</span>` : '') +
    `<div class="n" style="margin-left:0;margin-top:5px">验过 ${s.done} · 没验过 ${nodes.length - s.done} · 共 ${nodes.length}</div>`;
  if (window.refreshRail) refreshRail();
}
function clearProof(id) {
  delete marks[id]; saveMarks(); refreshMarks();
  if (selected === id) openPanel(id);
}
window.clearProof = clearProof;

/* ── 费曼验收：遮住原文，用自己的话说，系统挑漏，漏哪倒回哪 ────────
   判定口径写在提示词里：照抄不算过、只写几个词不算过、
   「意思差不多」不放过——因为判定器的工作是**挑漏**，不是发安慰分。 */
const JUDGE_SYS = '你是费曼验收的判定器。学习者刚看过一个概念，现在要他遮住原文、用自己的话说一遍。'
  + '你的任务是**挑漏**，不是鼓励，不许给安慰分。\n'
  + '只输出 json：\n'
  + '{"verdict":"pass" 或 "fail",'
  + '"missing":["他漏掉的要点，每条 6-18 字，最多 3 条"],'
  + '"wrong":["他说错的地方，没有就空数组"],'
  + '"backTo":["先修概念 id，只能从下面给出的前置 id 里挑；漏的根在某个前置概念上就指向它，否则空数组"],'
  + '"why":"一句话 20-40 字，直接说他哪里没说清，不要客套"}\n'
  + '判定口径：\n'
  + '- pass：说清了「它讲的是什么」里的核心机制，且没有事实错误。\n'
  + '- fail：漏掉核心机制、说了错话、或只是把原句换个说法照抄（照抄不算过）。\n'
  + '- 只写了几个词、没成句 → fail。\n'
  + '- 拿不准就 fail。不要因为「意思差不多」放过。';

function judgeUserMsg(nd, said) {
  const pre = (neighbors.get(nd.id).pre || []).map(x => byId.get(x)).filter(Boolean);
  return '概念名：' + nd.name + '\n'
    + '它讲的是什么（唯一判据）：' + nd.gloss + '\n'
    + '它的前置概念（backTo 只能指向这些 id）：\n'
    + (pre.length ? pre.map(x => '  ' + x.id + ' ｜ ' + x.name + ' ｜ ' + x.gloss).join('\n') : '  （没有前置）')
    + '\n\n学习者用自己的话说：' + said;
}

/* 机械兜底：没有模型可判时，只做**关键词覆盖检查**，并且如实标注它不是语义判定。
   它**不会**把概念标成 pass——只标 mech（琥珀环），因为过没过机器检查不等于懂没懂。 */
const STOP = new Set(['一个','这个','那个','的是','可以','就是','不是','或者','以及','通过','因为','所以','需要','没有','已经','什么','怎么','这样','那样','自己','我们','他们','这些','那些','但是','而且','如果','它们','也就是','指的是','一种','用来','能够','不会','会有','时候','东西','事情','问题','方式','方法','过程','情况','状态']);
function mechJudge(nd, said) {
  const raw = nd.gloss.match(/[A-Za-z][A-Za-z0-9+#.-]{1,}|[\u4e00-\u9fa5]{2,4}/g) || [];
  const key = [...new Set(raw)].filter(t => !STOP.has(t)).slice(0, 16);
  const miss = key.filter(t => !said.includes(t));
  const cover = key.length ? (key.length - miss.length) / key.length : 0;
  return {
    verdict: cover >= 0.5 ? 'mech' : 'fail',
    coverage: cover, missing: miss.slice(0, 5), wrong: [], backTo: [],
    why: '关键词覆盖 ' + Math.round(cover * 100) + '%（机械检查，不是语义判定）', mechanical: true,
  };
}

let judging = false;
async function judge(id) {
  const box = document.getElementById('said');
  const said = (box ? box.value : '').trim();
  const nd = byId.get(id);
  const err = document.getElementById('jerr');
  if (!nd || judging) return;
  if (said.length < 10) {
    if (err) err.textContent = said.length ? '太短了——至少写成一句话（10 字以上）。几个词不算复述。' : '先写点什么。遮住上面那句，用你自己的话说。';
    return;
  }
  judging = true;
  if (err) err.textContent = '判定中…';
  let v;
  try {
    v = await judgeCall(nd, said);
  } catch (e) {
    v = { verdict: 'fail', missing: [], wrong: [], backTo: [], why: '判定失败：' + (e.message || e) };
  }
  judging = false;
  marks[id] = {
    state: v.verdict, said, missing: v.missing || [], wrong: v.wrong || [],
    backTo: (v.backTo || []).filter(x => byId.has(x)), why: v.why || '',
    coverage: v.coverage, mechanical: !!v.mechanical, at: Date.now(),
  };
  saveMarks(); refreshMarks();
  if (selected === id) openPanel(id);
}
window.judge = judge;

/* 服务端/本地壳用的判定调用。公网版会把这一段换掉（见 scripts/build-public.mjs）。 */
async function judgeCall(nd, said) {
  const msgs = [{ role: 'system', content: JUDGE_SYS }, { role: 'user', content: judgeUserMsg(nd, said) }];
  if (await probeServer()) {
    try {
      const r = await fetch('/api/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs }) });
      const j = await r.json();
      if (!j.error) { try { return JSON.parse(j.content || '{}'); } catch (e) {} }
    } catch (e) {}
  }
  const key = getKey();
  if (key) {
    try {
      const r = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
        body: JSON.stringify({ model: PUB.model || 'deepseek-chat', temperature: 0,
          response_format: { type: 'json_object' }, messages: msgs }),
      });
      const j = await r.json();
      if (!j.error) { try { return JSON.parse(j.choices?.[0]?.message?.content || '{}'); } catch (e) {} }
    } catch (e) {}
  }
  // 两个都没有 → 机械覆盖检查。它**不会**把概念标成「过了」，只标 mech（琥珀环），
  // 因为过了关键词检查不等于懂。这一点页面上写明了。
  return mechJudge(nd, said);
}
let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const tip = document.getElementById('tip');

/* ── 建立邻接 ───────────────────────────────────────── */
for (const [tid, pid] of edges) {
  neighbors.get(tid).pre.push(pid);
  neighbors.get(pid).post.push(tid);
}

/* ── 布局 ───────────────────────────────────────────── */
// 确定性伪随机：同一概念每次抖动一致，resize / 切模式不会跳动
function hash01(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

// 图谱模式：纵轴 = 依赖层级，横轴 = 主题分列（默认·策展）/ 来源分列（可切）
let gridGap = 50, gridTop = 80, gridX0 = 0, gridColW = 60;
function layoutGrid() {
  const G = groups();
  const maxLv = Math.max(...nodes.map(n => n.level));
  const x0 = W * 0.29, x1 = W * 0.94;
  const colW = (x1 - x0) / Math.max(1, G.length);
  const gap = Math.min(54, (H * 0.78) / Math.max(1, maxLv));
  const yTop = H * 0.135;
  const buckets = G.map(() => new Map());
  for (const n of nodes) {
    const b = buckets[Math.min(giOf(n), G.length - 1)];
    if (!b.has(n.level)) b.set(n.level, []);
    b.get(n.level).push(n);
  }
  for (let ci = 0; ci < G.length; ci++) {
    for (const [lv, arr] of buckets[ci]) {
      arr.forEach((n, i) => {
        const t = arr.length === 1 ? 0.5 : i / (arr.length - 1);
        n.gx = x0 + ci * colW + colW * (0.17 + t * 0.66) + (hash01(n.id) - 0.5) * colW * 0.40;
        n.gy = yTop + lv * gap + (hash01(n.id + 'y') - 0.5) * gap * 0.55;
      });
    }
  }
  gridGap = gap; gridTop = yTop; gridX0 = x0; gridColW = colW;
}

// 星球模式：球面均布（形式参考 candobear 智慧星球）
// 不跑力导向 —— 边引力会把均匀球面拉歪；用 hash 打散顺序，颜色自然混合
function layoutSphere() {
  const R = 430;
  const order = nodes.slice().sort((a, b) => hash01(a.id) - hash01(b.id));
  const N = order.length, ga = Math.PI * (3 - Math.sqrt(5));
  order.forEach((n, i) => {
    const y = 1 - (i / Math.max(1, N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = ga * i;
    n.x = Math.cos(th) * r * R; n.y = y * R; n.z = Math.sin(th) * r * R;
  });
}

function computeLayout() {
  if (mode === 'grid') layoutGrid(); else layoutSphere();
}

/* ── 分组轴：主题（策展，默认）/ 来源 ───────────────────────
   原来横轴写死 12 个来源分列——那是权宜。策展后默认按主题分列。 */
let axis = 'tag';
const TAGI = new Map((CUR.tags || []).map((t, i) => [t.id, i]));
function giOf(n) {
  if (axis === 'src') return n.ci;
  const t = (n.tags || [])[0];
  return TAGI.has(t) ? TAGI.get(t) : (CUR.tags || []).length;   // 未分类进最后一列
}
function groups() {
  if (axis === 'src') return sources.map((s, i) => ({ id: s.id, label: s.label, color: PALETTE[i % PALETTE.length] }));
  const g = (CUR.tags || []).map(t => ({ id: t.id, label: t.name, color: t.color }));
  const un = nodes.filter(x => !TAGI.has((x.tags || [])[0])).length;
  if (un) g.push({ id: '__un', label: '未分类', color: '#4a4a55' });
  return g;
}
function matches(x) {
  if (!filter) return true;
  if (axis === 'src') return x.src === filter;
  if (filter === '__un') return !TAGI.has((x.tags || [])[0]);
  return (x.tags || []).includes(filter);
}

/* ── 投影 ───────────────────────────────────────────── */
function project(n) {
  if (mode === 'grid') {                    // 图谱：正交，无透视
    const s = zoom;
    return { sx: CX + (n.gx + panX - CX) * s, sy: CY + (n.gy + panY - CY) * s, s: s * 1.25, z: 0 };
  }
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  let x = n.x * cy - n.z * sy;
  let z = n.x * sy + n.z * cy;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const y = n.y * cx - z * sx;
  const z2 = n.y * sx + z * cx;
  const D = 1500;
  const s = zoom * D / (D + z2 + 700);
  return { sx: CX + x * s, sy: CY - y * s, s, z: z2 };
}

/* ── 渲染 ───────────────────────────────────────────── */
let frame = 0;
function render() {
  frame++;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // 背景微光
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.62);
  g.addColorStop(0, 'rgba(30,32,48,0.55)');
  g.addColorStop(1, 'rgba(8,8,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const pts = nodes.map(n => ({ n, ...project(n) }));
  const visible = n => matches(n) && (!onlyMine || !!marks[n.id]);
  const G = groups();

  // 图谱模式：列带 + 层级参考线 + 列顶标签（形式参考 candobear 学科图谱）
  if (mode === 'grid') {
    const s = zoom;
    const gx0 = CX + (gridX0 + panX - CX) * s;
    const colW = gridColW * s;
    const maxLv = Math.max(...nodes.map(n => n.level));
    for (let i = 0; i < G.length; i++) {
      ctx.globalAlpha = (!filter || filter === G[i].id) ? 0.055 : 0.012;
      ctx.fillStyle = G[i].color;
      ctx.fillRect(gx0 + i * colW, 0, colW - 1.5, H);
    }
    ctx.globalAlpha = 1;
    ctx.font = '9px -apple-system,"PingFang SC",sans-serif';
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let lv = 0; lv <= maxLv; lv++) {
      const y = CY + (gridTop + lv * gridGap + panY - CY) * s;
      if (y < 58 || y > H - 26) continue;
      ctx.beginPath(); ctx.moveTo(gx0, y); ctx.lineTo(gx0 + G.length * colW, y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.textAlign = 'left';
      ctx.fillText('L' + lv, gx0 + G.length * colW + 9, y + 3);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i < G.length; i++) {
      ctx.globalAlpha = (!filter || filter === G[i].id) ? 0.8 : 0.2;
      ctx.fillStyle = G[i].color;
      const cnt = axis === 'src' ? nodes.filter(x => x.src === G[i].id).length
        : G[i].id === '__un' ? nodes.filter(x => !TAGI.has((x.tags || [])[0])).length
        : nodes.filter(x => (x.tags || [])[0] === G[i].id).length;
      ctx.fillText(G[i].label + ' ' + cnt, gx0 + i * colW + colW / 2, gridTop - 28);
    }
    ctx.globalAlpha = 1;
  }

  // 边：票数分档 —— 骨架（≥7 票，多次投票一致）画实线，候选（1–4 票）画虚线
  ctx.lineWidth = 1;
  for (const [tid, pid, votes] of edges) {
    const a = byId.get(tid), b = byId.get(pid);
    if (!visible(a) || !visible(b)) continue;
    const pa = project(a), pb = project(b);
    const depth = (pa.z + pb.z) / 2;
    const hot = selected && (tid === selected || pid === selected)
             || hovered && (tid === hovered || pid === hovered);
    const solid = votes >= 7;
    const mid = votes >= 2;
    const base = solid ? 0.26 : mid ? 0.12 : 0.06;
    const alpha = hot ? 0.8 : Math.max(0.022, base - depth / 12000);
    ctx.strokeStyle = hot ? 'rgba(255,255,255,' + alpha + ')'
                          : solid ? 'rgba(178,188,225,' + alpha + ')'
                                  : 'rgba(120,128,165,' + alpha + ')';
    ctx.lineWidth = hot ? 1.6 : solid ? 1.05 : 0.6;
    if (!solid && !hot) ctx.setLineDash(votes >= 2 ? [2.5, 3] : [1.5, 4]);
    ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    if (!solid && !hot) ctx.setLineDash([]);
  }

  // 点（远的先画）
  pts.sort((a, b) => b.z - a.z);
  for (const p of pts) {
    const n = p.n;
    const on = visible(n);
    const isSel = selected === n.id, isHov = hovered === n.id;
    const base = (2.2 + Math.sqrt(neighbors.get(n.id).pre.length +
                   neighbors.get(n.id).post.length) * 1.05) * p.s;
    const r = Math.max(1.1, base * (isSel ? 2.1 : isHov ? 1.65 : 1));
    const col = G[Math.min(giOf(n), G.length - 1)].color;
    ctx.globalAlpha = on ? Math.min(1, 0.42 + p.s * 0.7) : 0.06;
    // 光晕
    if (isSel || isHov) {
      ctx.shadowBlur = 22; ctx.shadowColor = col;
    }
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, 6.2832);
    ctx.fillStyle = col; ctx.fill();
    ctx.shadowBlur = 0;
    // 我的标记环：只加环，不改填充色，不动坐标
    const mk = marks[n.id];
    if (mk && on) {
      const st = mk.state || 'fail';
      ctx.globalAlpha = (isSel || isHov) ? 1 : 0.92;
      ctx.strokeStyle = st === 'pass' ? '#5ee0c0' : st === 'mech' ? '#e0a94a' : '#ff4d4d';
      ctx.lineWidth = st === 'pass' ? 2 : 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 2.8, 0, 6.2832); ctx.stroke();
    }
    if (isSel) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 3.5, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

/* ── 尺寸 ───────────────────────────────────────────── */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  CX = W * (W > 820 ? 0.63 : 0.5);
  CY = H * 0.52;
  if (mode === 'grid' && nodes.length) layoutGrid();
}
window.addEventListener('resize', resize);

/* ── 交互 ───────────────────────────────────────────── */
let dragging = false, moved = 0, lastX = 0, lastY = 0;
cvs.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  cvs.classList.add('drag'); cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (mode === 'grid') { panX += dx; panY += dy; }
    else { rotY += dx * 0.0062; rotX = Math.max(-1.25, Math.min(1.25, rotX + dy * 0.0062)); }
    lastX = e.clientX; lastY = e.clientY;
  } else {
    hovered = pick(e.clientX, e.clientY);
    cvs.style.cursor = hovered ? 'pointer' : 'grab';
    if (hovered) {
      const n = byId.get(hovered);
      tip.textContent = n.name;
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY - 10) + 'px';
      tip.classList.add('on');
    } else tip.classList.remove('on');
  }
});
cvs.addEventListener('pointerup', e => {
  dragging = false; cvs.classList.remove('drag');
  if (moved < 5) { const hit = pick(e.clientX, e.clientY); hit ? openPanel(hit) : closePanel(); }
});
cvs.addEventListener('pointerleave', () => { tip.classList.remove('on'); hovered = null; });
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(3.2, zoom * (1 - e.deltaY * 0.0011)));
}, { passive: false });

function pick(mx, my) {
  let best = null, bestD = 15;
  for (const n of nodes) {
    const p = project(n);
    const d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bestD) { bestD = d; best = n.id; }
  }
  return best;
}

/* ── 面板 ───────────────────────────────────────────── */
function openPanel(id) {
  selected = id;
  const n = byId.get(id), nb = neighbors.get(id);
  const src = sources.find(s => s.id === n.src);
  const pre = nb.pre.map(x => byId.get(x)).filter(Boolean);
  const post = nb.post.map(x => byId.get(x)).filter(Boolean);
  const mk = marks[id];
  const tags = (n.tags || []).map(t => (CUR.tags.find(x => x.id === t) || {}).name).filter(Boolean);
  const chain = CHAIN && CHAIN.ids.includes(id)
    ? `<div class="chainhead">这条线 · ${CHAIN.name} · 第 ${CHAIN.ids.indexOf(id) + 1}/${CHAIN.ids.length} 步
       <button onclick="CHAIN=null;openPanel('${id}')">退出这条线</button></div>` : '';

  let verdict = '';
  if (mk) {
    const tone = mk.state === 'pass' ? 'ok' : mk.state === 'mech' ? 'mech' : 'bad';
    const title = mk.state === 'pass' ? '复述过了'
      : mk.mechanical ? '没过 · 只做了机械检查（没经语义判定）'
      : mk.state === 'mech' ? '只过了机械检查（没经语义判定，不算学会）'
      : '没过 · 正在倒回';
    verdict = `<div class="jverdict ${tone}">
      <b>${title}</b>
      ${mk.why ? `<div class="mut" style="margin-top:4px">${esc(mk.why)}</div>` : ''}
      ${mk.missing && mk.missing.length ? `<div class="jmiss">漏了：${mk.missing.map(esc).join(' · ')}</div>` : ''}
      ${mk.wrong && mk.wrong.length ? `<div class="jmiss">说错了：${mk.wrong.map(esc).join(' · ')}</div>` : ''}
      ${mk.backTo && mk.backTo.length
        ? `<div class="backto">倒回 → ${mk.backTo.map(b => `<button onclick="openPanel('${b}')">${esc(byId.get(b).name)}</button>`).join('')}</div>`
        : ''}
      <div class="mut" style="margin-top:6px;font-size:10.5px">你写的是：${esc((mk.said || '').slice(0, 120))}${(mk.said || '').length > 120 ? '…' : ''}</div>
      ${mk.mechanical ? `<div class="mut" style="margin-top:5px;font-size:10.5px;color:#e0a94a">
        这次只做了机械检查。想要真判定：本地跑 <code>node scripts/serve-135.mjs</code>，或在对话页填一个 DeepSeek key。</div>` : ''}
      <div class="markrow" style="margin-top:8px">
        <button class="mk quiet" onclick="clearProof('${id}')">重写一遍（清掉这次）</button>
      </div>
    </div>`;
  }

  document.getElementById('pbody').innerHTML = `
    ${chain}
    <div class="src">${tags.length ? tags.join(' · ') : (src ? src.label : n.src)} · ${n.type}</div>
    <h2>${n.name}</h2>
    <div class="gloss">${n.gloss}</div>
    <div class="metrics">
      <div class="m"><b>${pre.length}</b><span>前置</span></div>
      <div class="m"><b>${post.length}</b><span>解锁</span></div>
      <div class="m"><b>L${n.level}</b><span>层级</span></div>
    </div>

    <div class="dpane">
      <h5>倒逼 · 你不能自己标「学过」</h5>
      <div class="mut">遮住上面那句，用你自己的话说一遍它讲的是什么。<br>
      判定器会挑你漏了什么、说错了什么，<b>漏在哪就把你倒回哪个先修概念</b>。</div>
      <textarea id="said" placeholder="用自己的话说，别抄上面那句。抄了不算过。">${mk ? esc(mk.said || '') : ''}</textarea>
      <div class="jrow">
        <button class="jbtn" onclick="judge('${id}')">交卷，让系统挑漏</button>
        <span id="jerr" class="jerr"></span>
      </div>
    </div>
    ${verdict}

    ${pre.length ? `<h5>要理解它，先懂这些</h5><ul>${pre.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}<em>L${x.level}${marks[x.id] ? (marks[x.id].state === 'pass' ? ' · 已过' : marks[x.id].state === 'mech' ? ' · 机器过' : ' · 没过') : ''}</em></li>`).join('')}</ul>` : ''}
    ${post.length ? `<h5>懂了它，才能懂这些</h5><ul>${post.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}<em>L${x.level}</em></li>`).join('')}</ul>` : ''}

    ${(mk && (mk.state === 'pass' || mk.state === 'mech')) ? `<div class="nexthint">${
      CHAIN && CHAIN.ids.indexOf(id) + 1 < CHAIN.ids.length
        ? `过了。下一步 → <button class="jbtn" onclick="chainNext()">${esc(byId.get(CHAIN.ids[CHAIN.ids.indexOf(id) + 1]).name)}</button>`
        : (post.length ? `过了。要不要接着往上游走？<br>${post.slice(0, 3).map(x => `<button class="jbtn ghost" onclick="openPanel('${x.id}')">${esc(x.name)}</button>`).join(' ')}` : '这条线的点你都验过了。')
    }</div>` : ''}
  `;
  document.getElementById('panel').classList.add('on');
}

/* ── 一条线的倒逼链：从策展面板进来，一步一个概念 ── */
let CHAIN = null;
function startLine(tagId) {
  const c = (CUR.collections || []).find(x => x.tagId === tagId);
  if (!c || !c.route.length) return;
  CHAIN = { tagId, name: c.name, ids: c.route.map(x => x.id) };
  setView('graph'); axis = 'tag'; filter = tagId;
  buildLegend(); computeLayout(); openPanel(CHAIN.ids[0]);
}
function chainNext() {
  if (!CHAIN) return;
  const i = CHAIN.ids.indexOf(selected);
  if (i < 0 || i + 1 >= CHAIN.ids.length) { const t = CHAIN.tagId; CHAIN = null; openCollection(t); return; }
  openPanel(CHAIN.ids[i + 1]);
}
window.startLine = startLine; window.chainNext = chainNext;
function closePanel() {
  selected = null;
  document.getElementById('panel').classList.remove('on');
}
window.openPanel = openPanel; window.closePanel = closePanel;

/* ── 图例：按主题（策展）/ 按来源 ─────────────────────────── */
function buildLegend() {
  const G = groups();
  document.getElementById('lrows').innerHTML = G.map(g => {
    // 按主题时数字＝**主标签**数，跟画布上那一列的点数一一对应；
    // 「相关但主标签在别处」的点数写在策展面板里，免得两个口径打架。
    const cnt = axis === 'src' ? nodes.filter(x => x.src === g.id).length
      : g.id === '__un' ? nodes.filter(x => !TAGI.has((x.tags || [])[0])).length
      : nodes.filter(x => (x.tags || [])[0] === g.id).length;
    return `<div class="lrow${filter && filter !== g.id ? ' off' : ''}" data-g="${g.id}">
      <span class="dot" style="background:${g.color}"></span>
      ${g.label}<span class="n">${cnt}</span></div>`;
  }).join('');
  document.getElementById('lhead').textContent = axis === 'tag'
    ? '主题 · 点击筛选（数字＝主标签）' : '来源 · 点击筛选';
  document.getElementById('ax-tag').classList.toggle('on', axis === 'tag');
  document.getElementById('ax-src').classList.toggle('on', axis === 'src');
  document.querySelectorAll('#lrows .lrow').forEach(el => {
    el.onclick = () => {
      const g = el.dataset.g;
      filter = (filter === g) ? null : g;
      buildLegend();
    };
  });
}
function setAxis(a) {
  axis = a; filter = null;
  computeLayout(); buildLegend();
}
window.setAxis = setAxis;

  },
  'dbs-learning-beta': {
    tag: '没有标准答案的课题',
    sys: '先判课题类型（伪问题／主观判断／个人决策／价值问题），然后输出：判据、代价、'
       + '只有用户本人能回答的裁决点、一个最小实验。'
       + '如果判定为知识型课题（有标准答案），说明并交回 135 闭环，不继续本流程。'
       + '绝不替用户做决定，不写「你应该」。'
  },
  'dbs-standard-answer': {
    tag: '要一个带条件的答案',
    sys: '两部分：① 知识与理论挖掘——先审查命题（绝对化／因果跳跃／定义偷换／经验普遍化／反向推断），'
       + '再找相关学科、作者、理论，核实来源，写清能解释什么、解释不了什么；'
       + '② 历史同构——成功案例、失败案例、反例，最后给一个带条件、带因果解释、带失效边界的答案。'
       + '找不到就写「尚无统一答案」，不许硬套名人。'
  },
};
var activeSkill = null;
var activeFile = null;   // 非空 = 用 .agents/skills/<activeFile>/SKILL.md 当 system prompt
var msgs = [];

/* ══ 公网运行层 ══════════════════════════════════════════════════
   无服务端时的三条路。key 只进访客自己的 localStorage，
   **不进仓库、不上传、不落任何日志**。 */
const PUB = window.__PUBLIC__ || { skills: [], skillMD: {}, replays: [] };
const KEY_LS = 'zss135.visitor.key';
const getKey = () => { try { return localStorage.getItem(KEY_LS) || ''; } catch (e) { return ''; } };
function saveKey(v) {
  try { v ? localStorage.setItem(KEY_LS, v.trim()) : localStorage.removeItem(KEY_LS); } catch (e) {}
  renderConv();
}
window.saveKey = saveKey;

// 公网静态站上没有 /api，硬探会在控制台留下 404 报错。所以只在本地地址上探——
// 公网版和本地壳是同一份代码，本地地址下自动走服务端，公网地址下不问。
const LOCAL = /^(127.0.0.1|localhost|[::1])$/.test(location.hostname) || location.protocol === 'file:';
let serverMode = null;
async function probeServer() {
  if (!LOCAL) return (serverMode = false);
  if (serverMode !== null) return serverMode;
  try {
    const r = await fetch('/api/health');
    if (!r.ok) return (serverMode = false);
    const j = await r.json();
    serverMode = !!j.ok;
  } catch (e) { serverMode = false; }
  return serverMode;
}

async function llmCall(sys, history, file) {
  if (await probeServer()) {
    const payload = file
      ? { json: false, skill: file, messages: history }
      : { json: false, messages: [{ role: 'system', content: sys }, ...history] };
    const r = await fetch('/api/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) });
    const j = await r.json();
    if (j.error) return { ok: false, why: j.error + (j.detail ? ' — ' + String(j.detail).slice(0, 140) : '') };
    return { ok: true, content: j.content || '', via: '服务端（' + (j.model || '') + '）' };
  }
  const key = getKey();
  if (!key) return { ok: false, replay: true };
  try {
    const r = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ model: PUB.model || 'deepseek-chat', temperature: 0,
        messages: sys ? [{ role: 'system', content: sys }, ...history] : history }),
    });
    const j = await r.json();
    if (j.error) return { ok: false, why: 'DeepSeek 拒了：' + (j.error.message || JSON.stringify(j.error)) };
    return { ok: true, content: j.choices?.[0]?.message?.content || '', via: '你的 key 直连 DeepSeek' };
  } catch (e) {
    return { ok: false, why: '直连 DeepSeek 失败：' + e.message + '（网络不通或 key 无效）' };
  }
}

/* key 面板：只在没有本地服务端时出现 */
function convTools() {
  const has = !!getKey();
  return `<div class="keyrow">
    <input id="vk" type="password" placeholder="${has ? '已填 key · 只存在你这台浏览器' : '粘贴 DeepSeek key 就能真跑（留空＝看回放）'}"
      value="${has ? '••••••••••••' : ''}">
    <button onclick="saveKey(document.getElementById('vk').value.startsWith('••') ? '' : document.getElementById('vk').value)">${has ? '清除' : '用这个 key'}</button>
  </div>
  <div class="mut" style="font-size:10.5px;margin:-4px 0 8px">
    key 只写进你这台浏览器的 localStorage，本站不上传、不记录。不想填就直接发消息，会播 2026-09-12 的录制回放。
  </div>`;
}

function renderConv() {
  const body = document.getElementById('pbody');
  document.getElementById('panel').classList.add('on');
  const tagOf = activeSkill
    ? ((SKILLS[activeSkill] && SKILLS[activeSkill].tag)
       || (ALLSKILLS || []).find(x => x.name === activeSkill)?.description?.slice(0, 44)
       || '已装 skill')
    : '';
  const head = activeSkill
    ? `<div class="src">会话 · ${activeSkill}${activeFile ? ' · SKILL.md 原文' : ' · 内置'}</div><h2>${tagOf}</h2>`
    : `<div class="src">会话</div><h2>先选一个方法论</h2>`;
  const hint = activeSkill ? '' :
    `<div class="mut">点底栏的 <b>Agent</b> 选一个，再在下面的输入框里问我。<br>
     <b>选哪个不由系统替你决定。</b></div>`;
  const rows = msgs.map(m => `<div class="cmsg ${m.role}${m.pending ? ' pend' : ''}">${
    esc(m.content).replace(/\n/g, '<br>')}</div>`).join('');
  body.innerHTML = head + hint + (activeSkill ? convTools() : '')
    + `<div class="clist" id="clist">${rows || (activeSkill ? '<div class="mut">说吧，你想学什么。</div>' : '')}</div>`;
  const cl = document.getElementById('clist');
  if (cl) cl.scrollTop = cl.scrollHeight;
}
function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function openConv() { renderConv(); }

async function send() {
  const q = document.getElementById('b-q');
  const text = (q.value || '').trim();
  if (!text) return;
  q.value = '';
  msgs.push({ role: 'user', content: text });
  if (!activeSkill) {
    msgs.push({ role: 'assistant', content: '先选一个方法论：点底栏的 Agent。' });
    renderConv(); refreshRail(); return;
  }
  msgs.push({ role: 'assistant', content: '…', pending: true });
  renderConv();
  const history = msgs.filter(m => !m.pending).map(m => ({ role: m.role, content: m.content }));
  try {
    const sys = (activeFile && PUB.skillMD[activeFile]) ? PUB.skillMD[activeFile]
              : (SKILLS[activeSkill] || {}).sys || '';
    const res = await llmCall(sys, history, activeFile);
    if (res.ok) {
      msgs[msgs.length - 1] = { role: 'assistant', content: res.content + '\n\n—— ' + res.via };
    } else if (res.replay) {
      const t = (PUB.replays || []).find(x => x.skill === activeSkill);
      const note = { role: 'note', content:
        '公网版没有服务端，你也没填 key，所以**下面这段不是对你那句话的回答**。\n'
        + '这是 2026-09-12 用真模型跑同一个 skill 录下来的一段。想真跑就填个 DeepSeek key。' };
      if (t) msgs.splice(msgs.length - 1, 1, note,
        { role: 'user', content: t.q },
        { role: 'assistant', content: t.a + '\n\n—— 以上是 2026-09-12 的**录制回放**，不是对你这句话的回答。' });
      else msgs.splice(msgs.length - 1, 1, note,
        { role: 'assistant', content: '（这个 skill 没有录制回放。填一个 DeepSeek key 就能真跑。）' });
    } else {
      msgs[msgs.length - 1] = { role: 'assistant', content: '（没跑起来：' + res.why + '）' };
    }
  } catch (e) {
    msgs[msgs.length - 1] = { role: 'assistant', content:
      '（请求失败）' + (e && e.message ? e.message : '未知错误') + '\n'
      + '公网版可以填一个 DeepSeek key 直连，或在你本机跑 node scripts/serve-135.mjs。' };
  }
  renderConv();
}
window.send = send;
window.openConv = openConv;

/* Agent 卡片：选中即生效，并切到会话 */
window.pickAgent = function (label, file) {
  activeSkill = label;
  activeFile = file || null;
  const q = document.getElementById('b-q');
  q.placeholder = label + ' · 我想学 ____（回车发送）';
  const desc = SKILLS[label] ? SKILLS[label].tag
    : (ALLSKILLS || []).find(x => x.name === label)?.description || '已装 skill';
  msgs = [{ role: 'assistant', content: '用「' + label + '」。' + desc + '\n'
    + (activeFile ? '（system prompt = .agents/skills/' + activeFile + '/SKILL.md 原文）' : '（内置闭环）')
    + '——说吧，你想学什么？' }];
  setView('chat');
  renderConv(); refreshRail();
  q.focus();
};

/* 底栏输入框：回车发送 */
document.getElementById('b-q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

</script>
