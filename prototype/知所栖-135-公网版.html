制，是可复用的上下文工程范式，但属入门课无实操。","why":"它给出了「按需加载的技能」与常驻上下文、手动命令的清晰分工，这是当下最实用的一套上下文节省思路。多数人还在把所有规则塞进配置文件，这篇提供了官方定义的分层做法。","metaphor":"一排按需弹出的抽屉","palette":"heather","paletteBg":"#CBCADB","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"Agent 技能机制\"><defs><filter id=\"hw96\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"96\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#CBCADB\"/><path d=\"M 802.9 195.9 Q 823.9 219.7 817.5 243.0 Q 811.2 266.3 800.2 290.3 Q 789.2 314.3 742.5 323.6 Q 695.8 332.9 662.5 345.4 Q 629.2 357.8 590.1 365.3 Q 551.1 372.8 509.3 372.4 Q 467.6 371.9 423.4 370.7 Q 379.1 369.5 340.3 357.6 Q 301.6 345.7 274.6 326.9 Q 247.6 308.1 221.4 288.1 Q 195.2 268.2 206.6 243.9 Q 218.0 219.7 229.7 196.4 Q 241.5 173.1 266.8 155.0 Q 292.0 136.9 313.4 118.7 Q 334.8 100.4 365.6 86.8 Q 396.4 73.2 432.6 63.3 Q 468.8 53.3 508.4 56.7 Q 547.9 60.2 585.2 66.4 Q 622.5 72.6 663.5 79.3 Q 704.5 86.0 727.7 106.8 Q 750.9 127.6 766.4 149.9 Q 782.0 172.2 802.9 195.9 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw96)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(346.4 56.9) scale(325.6)\"><path d=\"M .16 .26 H .84 V .84 H .16 Z\"/><path d=\"M .16 .45 H .84\"/><path d=\"M .16 .64 H .84\"/><path d=\"M .84 .32 H .99 V .42 H .84\"/><path d=\"M .84 .51 H .99 V .61 H .84\"/><path d=\"M .84 .70 H .99 V .80 H .84\"/><path d=\"M .26 .37 H .46\"/><path d=\"M .26 .56 H .46\"/><\/g><g filter=\"url(#hw96)\"><circle cx=\"837\" cy=\"309\" r=\"7.6\" fill=\"#141413\"/><circle cx=\"228\" cy=\"134\" r=\"10.3\" fill=\"#141413\"/><circle cx=\"639\" cy=\"63\" r=\"8.3\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>技能把重复解释变成按需自动加载的任务指令。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>什么是 Agent Skills，它们如何让 Claude Code 更准确地处理任务？关联问题包括：技能如何被发现、匹配和加载？为什么需要技能？个人技能和项目技能放在哪里、如何共享？与 CLAUDE.md、斜杠命令相比有何不同？何时应该写技能？<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、技能是什么：可发现、可匹配、自动加载的指令文件夹<\/h4>\n<h5>1.1 技能定义与文件载体<\/h5>\n<ul>\n<li>技能是 Claude Code 可以发现和使用的指令文件夹，用于更准确地处理任务。<\/li>\n<li class=\"s\">每个技能存在于一个 SKILL.md 文件中，其前端包含名称和描述。<\/li>\n<\/ul>\n<h5>1.2 激活机制：用技能描述匹配请求<\/h5>\n<ul>\n<li>Claude 根据技能描述匹配请求；将请求与所有可用技能描述比较，并激活匹配的技能。<\/li>\n<li class=\"s\">例：请求 Claude 审核 PR 时，它会将请求与可用技能描述匹配，找到相关技能。<\/li>\n<li class=\"s\">当 Claude 将技能匹配到请求时，终端中会看到它加载出来。<\/li>\n<\/ul>\n<h5>1.3 加载方式：按需、自动<\/h5>\n<ul>\n<li>技能按需加载；当 Claude 识别到相应情况时，技能会自动激活。<\/li>\n<li class=\"s\">对比：CLAUDE.md 每次对话都会加载；斜杠命令需要显式调用。<\/li>\n<\/ul>\n<h4>二、为什么需要技能：消除重复解释，教一次后自动应用<\/h4>\n<h5>2.1 问题信号：反复解释同一件事<\/h5>\n<ul>\n<li>如果反复向 Claude 解释同一件事，说明这项技能需要写出来。<\/li>\n<li class=\"s\">重复场景：解释团队编码规范、重新描述希望 PR 审查反馈的结构、提醒提交信息格式。<\/li>\n<\/ul>\n<h5>2.2 解决方式：Markdown 文件教一次<\/h5>\n<ul>\n<li>技能是一个 Markdown 文件，教会 Claude 如何做某事一次；之后 Claude 会在需要时自动应用这些知识。<\/li>\n<li class=\"s\">技能描述是 Claude 决定是否使用该技能的依据。<\/li>\n<li class=\"s\">在前言下方写实际说明：审阅清单、格式偏好，或 Claude 需要知道的关于该任务的任何信息。<\/li>\n<\/ul>\n<h4>三、技能放在哪里：个人技能与项目技能<\/h4>\n<h5>3.1 个人技能：跨项目伴随<\/h5>\n<ul>\n<li>个人技能记录在 <code>~/.claude/skills<\/code> 主目录中，会贯穿所有项目。<\/li>\n<li class=\"s\">包括提交信息风格、文档格式、喜欢的代码解释方式。<\/li>\n<li class=\"s\">Windows 中存储在 <code>C:/Users/&lt;your-user&gt;/.claude/skills<\/code>。<\/li>\n<\/ul>\n<h5>3.2 项目技能：随仓库共享<\/h5>\n<ul>\n<li>项目技能放在 <code>.claude/skills<\/code> 代码仓库根目录下；任何克隆该仓库的人都会自动获得这些技能。<\/li>\n<li class=\"s\">团队标准放这里，例如公司品牌指南、首选字体和网页设计颜色。<\/li>\n<li class=\"s\">项目技能会与代码一起提交到版本控制系统中，以便整个团队共享。<\/li>\n<\/ul>\n<h4>四、技能在 Claude Code 自定义方式中的位置<\/h4>\n<h5>4.1 与 CLAUDE.md 对比：常驻上下文 vs 按需加载<\/h5>\n<ul>\n<li>CLAUDE.md 文件会在每次对话中加载；若希望 Claude 始终使用 TypeScript 严格模式，需在 CLAUDE.md 文件中设置。<\/li>\n<li>技能在与请求匹配时按需加载；Claude 最初只加载名称和描述，因此不会占据整个上下文窗口。<\/li>\n<li class=\"s\">PR 审核清单在调试时无需显示在上下文中，会在实际请求审核时加载。<\/li>\n<\/ul>\n<h5>4.2 与斜杠命令对比：手动调用 vs 自动应用<\/h5>\n<ul>\n<li>斜杠命令需要手动输入，技能不需要；Claude 在识别到相应情况时自动应用技能。<\/li>\n<\/ul>\n<h5>4.3 技能独特性：自动化且与特定任务相关<\/h5>\n<ul>\n<li>Claude Code 提供多种自定义行为方式；技能的独特之处在于它们是自动化的，并且与特定任务相关。<\/li>\n<\/ul>\n<h4>五、适用场景与判断法则<\/h4>\n<h5>5.1 最适用：将专业知识应用于特定任务<\/h5>\n<ul>\n<li>技能最适用于将专业知识应用于特定任务的情况。<\/li>\n<\/ul>\n<h5>5.2 经验法则<\/h5>\n<ul>\n<li>经验法则：反复向 Claude 解释同一件事，则这项技能需要写出来。<\/li>\n<li class=\"s\">反思最近一次与 Claude Code 的互动：重复了哪些指令？如果当时有技能，会如何节省时间？<\/li>\n<\/ul>\n<h5>5.3 下一课<\/h5>\n<ul>\n<li>下一课将从头开始创建第一个技能，并学习 Claude Code 如何在后台发现、匹配和加载技能。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>作者明确边界：技能最适用于将专业知识应用于特定任务；按需加载，最初只加载名称和描述；个人技能跨项目，项目技能随仓库共享。<\/li>\n<li>原文未给出不适用或失败场景的反例；未明确技能与 CLAUDE.md、斜杠命令是完全替代还是互补，只作对比。<\/li>\n<li>原文提到“以下是技能的前置信息示例”，但正文未给出实际示例内容；创建第一个技能留到下一课。<\/li>\n<\/ul>","conceptCards":[{"name":"技能（Agent Skills）","quotes":["技能是 Claude Code 可以发现和使用的指令文件夹，用于更准确地处理任务。每个技能都存在于一个SKILL.md文件中，其前端包含名称和描述。","技能是一个 Markdown 文件，它教会 Claude 如何做某事一次。之后，Claude 会在需要时自动应用这些知识。"],"feynman":"在本文里，技能就是把重复要解释的做事方式封装起来，让 Claude Code 能发现、匹配并在需要时自动应用的专业指令包。它是全文的中心对象：后面讲的存储位置、描述、加载方式、手动调用对比，都是为了说明这个指令包如何工作。","nodeId":"cm_094c89da"},{"name":"SKILL.md 与前置信息","quotes":["每个技能都存在于一个SKILL.md文件中，其前端包含名称和描述。","以下是技能的前置信息示例：","在前言下方，你可以写出实际的说明——你的审阅清单、格式偏好，或者克劳德需要知道的关于该任务的任何信息。"],"feynman":"SKILL.md 是技能的文件形态。它上面有前置信息，至少包含名称和描述；下面是真正的任务说明，比如审阅清单或格式偏好。这个结构很重要，因为 Claude 一开始只用前置信息来发现和匹配技能，不必先加载完整正文。","nodeId":"cm_a5573df7"},{"name":"技能描述","quotes":["技能描述是克劳德决定是否使用该技能的依据。当你请求克劳德审核PR时，它会将你的请求与可用的技能描述进行匹配，找到相关的技能。克劳德会阅读你的请求，将其与所有可用的技能描述进行比较，并激活匹配的技能。","克劳德会根据技能描述来匹配你的请求。当你请求克劳德做某事时，他会将你的请求与可用的技能描述进行比较，并激活匹配的技能。"],"feynman":"技能描述不是技能正文，而是让 Claude 判断“这个请求该不该用这个技能”的匹配依据。用户发出请求后，Claude 把请求与可用技能描述比较，匹配成功才激活技能。没有清楚描述，自动匹配就无法可靠发生。","nodeId":"cm_ae03bb56"},{"name":"按需加载","quotes":["技能按需加载——与CLAUDE.md（每次对话都会加载）或斜杠命令（需要显式调用）不同，当克劳德识别到相应情况时，技能会自动激活。","技能会在与您的请求匹配时按需加载。Claude 最初只会加载名称和描述，因此不会占据整个上下文窗口。您的 PR 审核清单在您调试时无需显示在上下文中——它会在您实际请求审核时加载。"],"feynman":"按需加载是技能的上下文策略。Claude 最初只加载名称和描述，只有当请求匹配时，才加载技能正文。它不同于 CLAUDE.md 那种每次对话都加载的方式，因此能让很多专业知识存在，而不会一直占满上下文窗口。","nodeId":"cm_cc101992"},{"name":"自动激活","quotes":["技能按需加载——与CLAUDE.md（每次对话都会加载）或斜杠命令（需要显式调用）不同，当克劳德识别到相应情况时，技能会自动激活。","斜杠命令需要你手动输入，而技能则不需要。克劳德会在识别到相应情况时自动应用技能。"],"feynman":"自动激活是技能的触发方式。用户不必像使用斜杠命令那样手动输入；Claude 识别到相应情况后会自动应用技能。它和斜杠命令的边界在于：斜杠命令靠显式调用，技能靠识别与匹配后自动触发。","nodeId":"cm_369f10ff"},{"name":"个人技能与项目技能","quotes":["个人技能会~/.claude/skills伴随你参与所有项目。项目技能则会存储.claude/skills在代码仓库中，并与所有克隆该仓库的用户共享。","个人技能记录在~/.claude/skills你的主目录中。这些技能会贯穿你所有的项目——包括你的提交信息风格、文档格式以及你喜欢的代码解释方式。","项目技能放在.claude/skills代码仓库的根目录下。任何克隆该仓库的人都会自动获得这些技能。团队标准也放在这里，例如公司的品牌指南、首选字体和网页设计颜色。","项目技能会与代码一起提交到版本控制系统中，以便整个团队共享。"],"feynman":"个人技能保存在用户主目录，跟随个人跨项目使用，适合个人偏好；项目技能保存在代码仓库中，随版本控制提交，克隆仓库的人会自动获得，适合团队标准。这个区分决定技能的共享范围：个人范围还是项目/团队范围。","nodeId":"cm_5244b02e"},{"name":"反复解释同一件事","quotes":["如果你发现自己反复向克劳德解释同一件事，那说明你还有待提高这方面的技能。","每次你向 Claude 解释团队的编码规范时，你都在重复自己。每次 PR 审查，你都要重新描述你希望反馈的结构。每次提交信息，你都要提醒 Claude 你偏好的格式。技能可以解决这个问题。","经验法则很简单：如果你发现自己反复向克劳德解释同一件事，那么这项技能就需要写出来。"],"feynman":"在本文中，反复解释同一件事不是普通抱怨，而是创建技能的触发信号。它把“为什么需要技能”具体化了：同一类说明、审查结构、格式偏好如果每次都重复，就可以封装成技能，让 Claude 之后自动应用。\n\n## 二、概念架构图\n\n图按触发、技能本体、加载与激活、存储与共享四层组织；CLAUDE.md 与斜杠命令作为加载和激活的边界对照出现。\n\n``<code>mermaid\nflowchart TB\n  subgraph 触发层\n    T[&quot;反复向 Claude 解释同一件事&quot;]\n  end\n\n  subgraph 技能本体层\n    S[&quot;技能（Agent Skills）&quot;]\n    F[&quot;SKILL.md 文件&quot;]\n    FM[&quot;前置信息：名称和描述&quot;]\n    SD[&quot;技能描述&quot;]\n  end\n\n  subgraph 加载与激活层\n    L[&quot;按需加载&quot;]\n    A[&quot;自动激活&quot;]\n    CM[&quot;CLAUDE.md：每次对话加载&quot;]\n    SC[&quot;斜杠命令：需要显式调用&quot;]\n  end\n\n  subgraph 存储与共享层\n    PS[&quot;个人技能：~/.claude/skills&quot;]\n    PR[&quot;项目技能：.claude/skills&quot;]\n  end\n\n  T --&gt;|提示需要写技能| S\n  S --&gt;|存在于| F\n  F --&gt;|前置信息包含| FM\n  FM --&gt;|提供匹配依据| SD\n  SD --&gt;|匹配请求后| A\n  A --&gt;|触发| L\n  L -.-&gt;|不同于| CM\n  A -.-&gt;|不同于| SC\n  S --&gt;|可存为| PS\n  S --&gt;|可存为| PR\n  PS --&gt;|伴随所有项目| S\n  PR --&gt;|随仓库共享给克隆者| S\n  S --&gt;|解决| T\n<\/code>``","nodeId":"cm_64663de2"}],"feynman":{"short":"技能就是把重复交代的做事方法写成一份 SKILL.md：上面贴名称和描述，下面写审阅清单、格式偏好。你发出请求，Claude 拿它比对所有技能描述，匹配上才加载正文并自动应用。个人技能跟着你所有项目，项目技能随仓库共享给克隆者。","long":"<p>这篇文章在回答 <b>Claude Code 的“技能”是什么、有什么用<\/b>。答案是：把你反复要交代的做事方法写成一份 SKILL.md，让 Claude 在合适时自动发现并套用，不必每次重讲。<\/p>\n<p>核心机制像办公室文件柜：每个文件夹外贴着名称和描述，里面才是审阅清单、格式偏好等详细说明。你提出请求后，Claude 先扫这些“标签”，拿请求和技能描述比对，匹配上才打开文件读指令。个人技能放在 <code>~/.claude/skills<\/code>，跟着你所有项目；项目技能放在仓库 <code>.claude/skills<\/code>，克隆仓库<\/p>","rubric":[{"concept":"技能（Agent Skills）","points":["说出技能是 Claude Code 可以发现和使用的指令文件夹，用于更准确地处理任务","说清技能教一次、之后在需要时自动应用，而不是每次重讲","点出技能最适用于把专业知识应用于特定任务"]},{"concept":"SKILL.md 与技能描述","points":["说出技能存在于 SKILL.md 文件中，其前端包含名称和描述","说清技能描述是决定是否使用该技能的依据，靠请求与所有可用技能描述比较来匹配","指出前言下方才是实际说明，如审阅清单、格式偏好"]},{"concept":"按需加载与自动激活","points":["说出最初只加载名称和描述，因此不占据整个上下文窗口","说出请求匹配时才加载、由识别到相应情况自动激活，不需要像斜杠命令那样手动输入","能对比 CLAUDE.md 每次对话都会加载这一差异"]}]},"oneLine":"技能把重复解释变成按需自动加载的任务指令。"},{"slug":"agent-skills-lesson-2","no":6,"title":"Claude 官方课程 · 第 2 课：技能的结构（SKILL.md 与 frontmatter）","words":1845,"url":"https://academy.claude.com/courses/introduction-to-agent-skills/creating-your-first-skill","author":"Claude Academy","summary":"技能是包含名称和描述的目录，Claude启动时只加载名称和描述，并通过匹配描述来选择使用的技能。用户创建技能时需编辑SKILL.md文件，重启Claude Code后技能才会生效。企业版技能优先级最高，个人版其次，确保技能名称避免冲突。","fetched":"Reader 快照（2026-09-12）","topic":"技能目录与匹配加载","stars":3,"starReason":"官方一手机制说明，技能编写是通用基础功，但与公开文档重合度较高。","why":"把重复工作固化成可复用技能，正在成为当下最实用的 AI 协作方式之一；这篇讲清了技能的最小结构、启动时只加载名称与描述的匹配逻辑，以及企业/个人/项目的优先级顺序，是动手写第一个技能前的最小知识集。","metaphor":"一排只露出标签、需要时才拉开的抽屉","palette":"heather","paletteBg":"#CBCADB","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"技能目录与匹配加载\"><defs><filter id=\"hw53\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"53\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#CBCADB\"/><path d=\"M 859.5 187.4 Q 863.9 214.0 864.8 238.4 Q 865.7 262.8 833.9 281.0 Q 802.2 299.3 785.8 323.3 Q 769.3 347.3 723.1 354.0 Q 676.9 360.6 634.4 364.7 Q 591.9 368.7 549.6 368.5 Q 507.4 368.3 465.9 363.2 Q 424.4 358.1 384.8 348.0 Q 345.3 337.9 300.5 325.6 Q 255.7 313.2 240.6 288.6 Q 225.5 264.0 227.0 239.0 Q 228.4 214.0 243.5 188.6 Q 258.6 163.3 294.4 146.9 Q 330.2 130.4 355.5 114.4 Q 380.7 98.4 405.4 78.6 Q 430.1 58.8 471.1 59.4 Q 512.2 59.9 549.0 62.1 Q 585.9 64.3 618.8 72.9 Q 651.7 81.4 700.0 79.6 Q 748.4 77.9 780.4 95.8 Q 812.5 113.8 833.8 137.3 Q 855.1 160.8 859.5 187.4 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw53)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(386.8 51.2) scale(325.6)\"><path d=\"M .16 .26 H .84 V .84 H .16 Z\"/><path d=\"M .16 .45 H .84\"/><path d=\"M .16 .64 H .84\"/><path d=\"M .84 .32 H .99 V .42 H .84\"/><path d=\"M .84 .51 H .99 V .61 H .84\"/><path d=\"M .84 .70 H .99 V .80 H .84\"/><path d=\"M .26 .37 H .46\"/><path d=\"M .26 .56 H .46\"/><\/g><g filter=\"url(#hw53)\"><circle cx=\"886\" cy=\"299\" r=\"9.8\" fill=\"#141413\"/><circle cx=\"853\" cy=\"284\" r=\"8.5\" fill=\"#141413\"/><circle cx=\"282\" cy=\"266\" r=\"6.5\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>技能靠名称与描述被匹配，确认后才加载全文执行。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>技能由什么构成、Claude Code 如何在后台加载与匹配技能、如何从头创建一项个人技能，以及技能重名时谁优先。<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、技能结构与加载机制<\/h4>\n<h5>1.1 技能的最小结构<\/h5>\n<ul>\n<li>技能是一个目录，其中包含 <code>SKILL.md<\/code>。<\/li>\n<li><code>SKILL.md<\/code> 分两部分：frontmatter 元数据（名称、描述）与第二组破折号之后的说明/指令。<\/li>\n<\/ul>\n<h5>1.2 启动时只加载元数据<\/h5>\n<ul>\n<li>Claude 在启动时仅加载技能名称和描述，不加载完整内容。<\/li>\n<li>名称代表技能；描述告诉 Claude 何时使用该技能，是匹配条件。<\/li>\n<li>Claude Code 启动时会扫描四个位置的技能，但只加载名称和描述，这是作者强调的重要细节。<\/li>\n<\/ul>\n<h5>1.3 请求匹配与确认加载<\/h5>\n<ul>\n<li>发送请求时，Claude 将消息与所有可用技能的描述进行比对。<\/li>\n<li>例：“解释这个函数的作用”会匹配到“用图表解释代码”技能，因为意图有所重叠。<\/li>\n<li>找到匹配后，Claude 会要求确认加载技能。<\/li>\n<li>确认步骤让用户了解 Claude 正在获取哪些上下文；确认后，Claude 读取整个 <code>SKILL.md<\/code> 并执行其中指令。<\/li>\n<\/ul>\n<h5>1.4 更新与删除<\/h5>\n<ul>\n<li>更新技能：编辑其配置 <code>SKILL.md<\/code>。<\/li>\n<li>删除技能：删除其配置文件目录。<\/li>\n<li>更改后务必重启 Claude Code 生效。<\/li>\n<\/ul>\n<h4>二、创建个人技能：统一 PR 描述格式<\/h4>\n<h5>2.1 定位与目录<\/h5>\n<ul>\n<li>示例创建的是个人技能，教 Claude 以统一格式撰写 PR 描述。<\/li>\n<li>个人技能位于主目录，并适用于所有项目。<\/li>\n<li>在技能文件夹内创建用于存放技能的目录，目录名称应与技能名称一致。<\/li>\n<\/ul>\n<h5>2.2 示例 SKILL.md<\/h5>\n<ul>\n<li>frontmatter 示例：<\/li>\n<\/ul>\n<pre><code>\n---\nname: pr-description\ndescription: Writes pull request descriptions. Use when creating a PR, writing a PR, or when the user asks to summarize changes for a pull request.\n---\n<\/code><\/pre>\n<ul>\n<li>第二组破折号之后的所有内容，是 Claude 激活技能后需要执行的指令。<\/li>\n<li>指令要求：运行 <code>git diff main...HEAD<\/code> 查看本分支所有更改；按固定格式写描述。<\/li>\n<li>PR 描述固定格式包含：<\/li>\n<li class=\"s\"><code>What<\/code>：一句话说明这个 PR 做什么。<\/li>\n<li class=\"s\"><code>Why<\/code>：简要说明为什么需要这项更改。<\/li>\n<li class=\"s\"><code>Changes<\/code>：具体更改的 bullet points；将相关更改分组；提及删除或重命名的文件。<\/li>\n<\/ul>\n<h5>2.3 测试与效果<\/h5>\n<ul>\n<li>创建后重启 Claude Code，通过查看可用技能列表确认技能是否可用。<\/li>\n<li>在分支上做更改，然后说类似“为我的更改编写 PR 描述”。<\/li>\n<li>Claude 会显示正在使用 PR 描述技能，检查 diff，并按照模板编写描述，每次格式都相同。<\/li>\n<\/ul>\n<h4>三、重名冲突与优先级<\/h4>\n<h5>3.1 优先级顺序<\/h5>\n<ul>\n<li>材料开头给出的名称冲突优先级：企业版 → 个人版 → 项目版 → 插件版。<\/li>\n<li>后文进一步解释：企业级—管理设置，最高优先级；个人—主目录（<code>~/.claude/skills<\/code>）；插件—已安装插件，优先级最低。<\/li>\n<\/ul>\n<h5>3.2 企业强制与个人定制<\/h5>\n<ul>\n<li>该机制让企业可通过企业级技能强制执行标准，同时允许个人进行个性化定制。<\/li>\n<li>例：公司已有企业级“代码审查”技能，个人又创建同名“代码审查”技能，则企业级版本优先。<\/li>\n<\/ul>\n<h5>3.3 命名建议<\/h5>\n<ul>\n<li>为避免冲突，使用描述性名称。<\/li>\n<li>例：不要只用“review”，而应使用 <code>frontend-review<\/code> 或 <code>backend-review<\/code>。<\/li>\n<\/ul>\n<h4>四、课程延伸<\/h4>\n<h5>4.1 留给读者的问题<\/h5>\n<ul>\n<li>日常工作流程中的哪一项任务可以立即转化为一项技能？这项技能的描述会是什么样的？<\/li>\n<\/ul>\n<h5>4.2 下一课内容<\/h5>\n<ul>\n<li>高级配置选项，包括元数据字段、工具限制 <code>allowed-tools<\/code>。<\/li>\n<li>如何使用渐进式披露和多文件组织来构建更大的技能。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>优先级列表内部不一致：一处说四个位置并按“企业版 → 个人版 → 项目版 → 插件版”，后文只列企业级、个人、插件，未提项目版；项目版的具体路径和说明未给出。<\/li>\n<li>除个人技能路径 <code>~/.claude/skills<\/code> 外，其他扫描位置/路径未明确。<\/li>\n<li>材料存在翻译或笔误：如“前言/后言”“重启游戏”等表述，按后文应理解为 frontmatter/正文，以及重启 Claude Code。<\/li>\n<li>未说明确认提示是否可跳过、匹配失败如何处理、多个技能同时匹配时如何选择。<\/li>\n<\/ul>","conceptCards":[{"name":"技能与 SKILL.md 结构（Skill / SKILL.md）","quotes":["技能是一个目录，其中包含一个SKILL.md文件，该文件的前言部分包含元数据（名称、描述），后言部分包含说明。","第二组破折号之后的所有内容是克劳德激活技能后需要执行的指令。"],"feynman":"在本文里，技能不是一段单独的提示词，而是一个目录加一个入口文件 SKILL.md。SKILL.md 又分成两段：前面放元数据，也就是名称和描述；后面放说明，也就是 Claude 激活技能后要执行的指令。名称用来标识技能，描述用来后续匹配；说明不是启动时就读，而是匹配确认后才执行。拿掉这个结构，后面“只加载名称和描述”“第二组破折号后是指令”都无从理解。","nodeId":"cm_d4a0e687"},{"name":"名称与描述（name / description）","quotes":["技能名称代表你的技能。技能描述告诉克劳德何时使用该技能——这是匹配条件。","当你发送请求时，Claude 会将你的消息与所有可用技能的描述进行比对。例如，“解释这个函数的作用”会匹配到“用图表解释代码”这项技能，因为它们的意图有所重叠。"],"feynman":"名称和描述不是同一类东西。名称是技能的身份标识，用来在列表、冲突优先级里识别技能。描述是匹配条件，告诉 Claude 什么时候该使用这个技能。用户请求不是直接匹配完整技能内容，而是先匹配描述，而且匹配是语义上的，允许意图重叠。所以描述写的是使用场景，不是技能内容摘要。这个区分是本文匹配机制的核心。","nodeId":"cm_4b769318"},{"name":"启动时仅加载名称和描述","quotes":["Claude在启动时仅加载技能名称和描述，然后使用语义匹配将传入的请求与这些描述进行匹配。","Claude Code启动时，会扫描四个位置的技能，但只会加载技能名称和描述，而非完整内容。这是一个重要的细节。"],"feynman":"Claude Code 启动时会扫描技能所在位置，但只把技能名称和描述放进可用列表，不把每个 SKILL.md 的完整说明塞进上下文。完整说明要等某个请求匹配到技能后才可能加载。因此启动阶段很轻，匹配阶段依赖描述。这个设计也解释了为什么技能文件改动后需要重启才生效。","nodeId":"cm_28c258d9"},{"name":"匹配后的确认与完整加载","quotes":["在克劳德将全部技能内容加载到上下文之前，你会收到一个确认提示。","找到匹配项后，克劳德会要求你确认加载技能。这个确认步骤能让你了解克劳德正在获取哪些上下文信息。确认后，克劳德会读取整个SKILL.md文件并执行其中的指令。"],"feynman":"语义匹配成功不等于立即执行。Claude 会先要求确认；确认前，完整技能内容还没有进入上下文。确认后，整个 SKILL.md 才被读取，里面的指令才被执行。这个确认提示是加载机制的边界：用户能知道 Claude 将要获取哪些技能内容。","nodeId":"cm_80dfaf37"},{"name":"名称冲突优先级与技能作用域","quotes":["名称冲突优先级：企业版 → 个人版 → 项目版 → 插件版","企业级— 管理设置，最高优先级","个人— 您的主目录 ( ~/.claude/skills)","插件— 已安装的插件，优先级最低","如果贵公司已有企业级“代码审查”技能，而您又创建了一个同名的个人“代码审查”技能，则企业级版本优先。"],"feynman":"同名技能不是简单由后来者覆盖，而是按作用域排优先级。材料顶部给出的完整顺序是企业版最高，其后是个人版、项目版，插件版最低；后面的局部列表再次明确企业级最高、插件最低，并把个人技能定位在主目录。这样企业可以用企业级技能强制执行标准，个人定制不能覆盖企业版本。理解这个优先级，才能判断同名技能最终哪个生效。材料后面的局部列表没有列出项目版，但顶部顺序已经把项目版放在个人版之后、插件版之前。","nodeId":"cm_d793c38e"},{"name":"技能变更生效条件：编辑、删除、重启","quotes":["要更新技能，请编辑其配置SKILL.md文件。要删除技能，请删除其配置文件目录。请务必重启 Claude Code以使更改生效。","Claude Code 会在启动时加载技能，因此创建技能后请重启游戏。"],"feynman":"技能不是热更新对象。改技能就是改它的 SKILL.md；删技能就是删目录。因为 Claude Code 在启动时加载技能，所以创建、修改、删除后都要重启 Claude Code 才生效。这个操作边界直接来自前面的启动加载机制。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TB\n  subgraph L1[&quot;定义层：技能如何构成&quot;]\n    A[&quot;技能：目录&quot;]\n    B[&quot;SKILL.md&quot;]\n    C[&quot;frontmatter／前言：名称、描述&quot;]\n    D[&quot;指令体／后言：第二组破折号后的说明&quot;]\n  end\n\n  subgraph L2[&quot;加载与匹配层：Claude 何时读取什么&quot;]\n    E[&quot;启动时仅加载名称和描述&quot;]\n    F[&quot;用户请求&quot;]\n    G[&quot;语义匹配：请求与描述&quot;]\n    H[&quot;确认提示&quot;]\n    I[&quot;完整加载 SKILL.md 并执行指令&quot;]\n  end\n\n  subgraph L3[&quot;作用域与冲突层：同名技能谁优先&quot;]\n    J[&quot;企业版（最高）&quot;]\n    K[&quot;个人版&quot;]\n    L[&quot;项目版&quot;]\n    M[&quot;插件版（最低）&quot;]\n    N[&quot;名称冲突优先级&quot;]\n  end\n\n  subgraph L4[&quot;变更生效层&quot;]\n    O[&quot;更新：编辑 SKILL.md&quot;]\n    P[&quot;删除：删除目录&quot;]\n    Q[&quot;重启 Claude Code&quot;]\n  end\n\n  A -- 包含 --&gt; B\n  B -- 分为 --&gt; C\n  B -- 分为 --&gt; D\n  C -- 提供 --&gt; E\n  E -- 支撑 --&gt; G\n  F -- 触发 --&gt; G\n  G -- 命中后 --&gt; H\n  H -- 确认后 --&gt; I\n  I -- 读取 --&gt; D\n  J -- 参与 --&gt; N\n  K -- 参与 --&gt; N\n  L -- 参与 --&gt; N\n  M -- 参与 --&gt; N\n  N -- 决定同名采用哪个 --&gt; I\n  E -- 导致变更需 --&gt; Q\n  O -- 需 --&gt; Q\n  P -- 需 --&gt; Q\n<\/code>``","nodeId":"cm_325fef11"}],"feynman":{"short":"技能是一个目录，里面放 SKILL.md：两行 --- 把文件分上下半，上半是名片（名称+描述），下半是说明书（具体怎么做）。Claude 启动只读名片，靠语义匹配把你的请求和描述对上，命中后先问你要不要加载，你确认了才读整份说明书去执行。","long":"<p>技能就是一个目录，里面放一个 SKILL.md。这个文件被两行 <code>---<\/code> 分成两半：上半是“名片”，只有名称和描述；下半是“说明书”，写具体怎么做。Claude 启动时只看名片，不看说明书——它靠语义匹配，把你的请求和所有技能的描述比对，找到匹配的就先问你一句“要不要加载”，你确认后才把整份说明书读进上下文去执行。<\/p>\n<p>生活类比：像一柜贴着标签的工具。平时你只扫标签，不翻说明书；真要用哪个，才把说明书抽出来看，而且抽之前还问你一声。标签写得含糊，就会拿错工具。<\/p>\n<p>同一名字撞车时，优先级是：企业版 → 个人版 → 项目版 → 插件版，所以公司能强制统一标准，你仍可在个人层面自定义。作者也点明了代价：新增或修改技能后必须重启 Claude Code 才生效。<\/p>","rubric":[{"concept":"技能与 SKILL.md 的两段结构","points":["点明技能是“目录 + SKILL.md”，不是单独一段提示词","说出 SKILL.md 分元数据段与指令段，并指出分界是第二组破折号","说出破折号之后的正文是激活后才执行的指令"]},{"concept":"名称与描述的分工（描述即匹配条件）","points":["说清名称是身份标识、描述是“何时使用”的匹配条件","指出匹配对象是描述而不是完整技能内容，且匹配是语义的、允许意图重叠","举例或说明描述应写使用场景"]},{"concept":"启动仅加载元数据、确认后才完整加载","points":["说出启动时只加载名称和描述、不加载完整内容","说出命中后先有确认提示，确认后才读取整个 SKILL.md 并执行","由此推出创建/修改/删除技能后需重启 Claude Code 才生效"]}]},"oneLine":"技能靠名称与描述被匹配，确认后才加载全文执行。"},{"slug":"agent-skills-lesson-3","no":7,"title":"Claude 官方课程 · 第 3 课：写好 name 与 description","words":1909,"url":"https://academy.claude.com/courses/introduction-to-agent-skills/configuration-and-multi-file-skills","author":"Claude Academy","summary":"Agent skills need a clear name and description to tell Claude when and how to use them. Allowed-tools limit what Claude can do during skill use, improving security for sensitive tasks. Keeping skill files small and linking to extra resources helps Claude work efficiently without overloading the context.","fetched":"Reader 快照（2026-09-12）","topic":"技能描述字段与权限配置","stars":4,"starReason":"官方一手字段规则与触发机制，含 500 行门槛等可照做的判据，时效性强。","why":"技能该触发时没触发、或把上下文撑爆，是今天用 Agent 最常踩的两个坑，这一课直接给出 description 措辞、allowed-tools 边界和渐进披露三条对症解法。它把「配置」从个人经验变成了官方标准里的具体字段规则。","metaphor":"只露出目录页的活页夹","palette":"heather","paletteBg":"#CBCADB","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"技能描述字段与权限配置\"><defs><filter id=\"hw34\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"34\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#CBCADB\"/><path d=\"M 875.0 191.2 Q 904.7 217.3 895.4 243.6 Q 886.2 269.8 866.4 294.4 Q 846.5 318.9 799.3 330.6 Q 752.1 342.4 711.7 352.0 Q 671.3 361.7 629.9 367.5 Q 588.6 373.4 546.6 370.9 Q 504.6 368.5 463.9 363.5 Q 423.2 358.6 368.3 358.5 Q 313.4 358.4 290.8 334.7 Q 268.3 311.1 234.2 290.9 Q 200.1 270.7 219.1 244.0 Q 238.1 217.3 259.4 194.2 Q 280.7 171.1 301.9 151.8 Q 323.1 132.4 333.9 106.0 Q 344.8 79.7 384.1 69.0 Q 423.5 58.3 465.8 59.7 Q 508.0 61.1 546.4 59.2 Q 584.7 57.3 617.1 70.0 Q 649.6 82.7 685.3 90.1 Q 721.1 97.4 749.5 113.1 Q 777.9 128.9 811.7 147.0 Q 845.4 165.1 875.0 191.2 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw34)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(383.1 54.5) scale(325.6)\"><path d=\"M .26 .14 H .84 V .88 H .26 Z\"/><path d=\"M .26 .40 H .84\"/><path d=\"M .26 .60 H .76\"/><path d=\"M .26 .76 H .70\"/><path d=\"M .20 .26 A .07 .07 0 1 1 .20 .40 A .07 .07 0 1 1 .20 .26\"/><path d=\"M .20 .50 A .07 .07 0 1 1 .20 .64 A .07 .07 0 1 1 .20 .50\"/><path d=\"M .20 .74 A .07 .07 0 1 1 .20 .88 A .07 .07 0 1 1 .20 .74\"/><\/g><g filter=\"url(#hw34)\"><circle cx=\"814\" cy=\"306\" r=\"7.9\" fill=\"#141413\"/><circle cx=\"847\" cy=\"157\" r=\"7.6\" fill=\"#141413\"/><circle cx=\"375\" cy=\"86\" r=\"7.8\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>description 是最重要字段，决定 Claude 何时匹配并触发技能。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>如何配置 SKILL.md 的 name、description、allowed-tools 等字段，并通过逐步披露与脚本组织多文件技能，使技能被正确触发、限制工具权限且不挤占上下文？<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、SKILL.md 前置元数据：两个必填字段，两个可选字段<\/h4>\n<h5>1.1 name 与 description 必填，description 最重要<\/h5>\n<ul>\n<li>开放标准支持 SKILL.md 前置元数据中的多个字段；其中两个必填，其余可选。<\/li>\n<li class=\"s\">name（必填）：标识技能；仅小写字母、数字和连字符；最多 64 个字符；应与目录名称一致。<\/li>\n<li class=\"s\">description（必填）：告诉 Claude 何时使用该技能；最多 1024 个字符；Claude 用它进行匹配，因此是最重要字段。<\/li>\n<li class=\"s\">allowed-tools（可选）：限制 Claude 在技能激活时可以使用的工具。<\/li>\n<li class=\"s\">model（可选）：指定用于该技能的 Claude 模型。<\/li>\n<\/ul>\n<h5>1.2 好的 description 应回答两个问题<\/h5>\n<ul>\n<li>这项技能有什么作用？<\/li>\n<li>Claude 应该在什么情况下使用它？<\/li>\n<li class=\"s\">指示要明确：如果有人说“你的工作是帮忙处理文件”，你肯定不知道该怎么做——Claude 也是这么想的。<\/li>\n<li class=\"s\">若技能没有在预期的时间触发，尝试添加更多与实际请求措辞相匹配的关键词；Claude 会根据描述判断技能是否相关，所以措辞很重要。<\/li>\n<\/ul>\n<h4>二、allowed-tools：用工具限制设置安全边界<\/h4>\n<h5>2.1 allowed-tools 限制技能激活时可用的工具<\/h5>\n<ul>\n<li>有时只需要一种只能读取文件而不能修改文件的技能；适用于安全要求较高的工作流、只读任务或需要设置安全防护的场景。<\/li>\n<li class=\"s\">示例中 allowed-tools 设置为 <code>Read, Grep, Glob, Bash<\/code>；技能激活时 Claude 无需请求许可即可使用这些工具，不能编辑，也不能写作。<\/li>\n<li class=\"s\">完整示例前置元数据包含：<code>name: codebase-onboarding<\/code>、<code>description: Helps new developers understand the system works.<\/code>、<code>allowed-tools: Read, Grep, Glob, Bash<\/code>、<code>model: sonnet<\/code>。<\/li>\n<\/ul>\n<h5>2.2 省略 allowed-tools 即不限制<\/h5>\n<ul>\n<li>如果完全省略 allowed-tools，该技能不会限制任何内容；Claude 使用其正常的权限模型。<\/li>\n<\/ul>\n<h4>三、逐步披露：SKILL.md 不塞满，支持文件按需加载<\/h4>\n<h5>3.1 技能与对话共享上下文窗口，激活时加载 SKILL.md<\/h5>\n<ul>\n<li>当 Claude 激活一个技能时，它会将该技能的 SKILL.md 文件内容加载到上下文中。<\/li>\n<li>把所有内容塞进一个 2000 行的文件有两个问题：占用大量上下文窗口空间；维护起来很麻烦。<\/li>\n<\/ul>\n<h5>3.2 逐步披露：必要说明留在 SKILL.md，详细参考放单独文件<\/h5>\n<ul>\n<li>Claude 只在需要时才阅读支持文件。<\/li>\n<li class=\"s\">开放标准建议组织技能目录：<code>assets/<\/code> — 图片、模板或其他数据文件。<\/li>\n<li class=\"s\">在 SKILL.md 中链接支持文件，并附上关于何时加载这些文件的清晰说明。<\/li>\n<li class=\"s\">示例：<code>architecture-guide.md<\/code> 只会在有人询问系统设计时被读取；如果他们问的是在哪里添加组件，它就不会加载该文件。<\/li>\n<li class=\"s\">比喻：这就像在上下文窗口中显示的是目录，而不是整个文档。<\/li>\n<li>经验法则：SKILL.md 文件最好控制在 500 行以内；如果超过，考虑是否将内容拆分成单独的参考文件。<\/li>\n<\/ul>\n<h4>四、脚本：运行而不把脚本内容加载进上下文<\/h4>\n<h5>4.1 脚本执行无需加载内容，只有输出消耗 token<\/h5>\n<ul>\n<li>技能目录中的脚本无需加载其内容即可运行。<\/li>\n<li class=\"s\">脚本执行后，只有输出会消耗令牌。<\/li>\n<li class=\"s\">SKILL.md 中的关键指令是告诉 Claude 运行脚本，而不是读取脚本。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>allowed-tools 省略时不限制任何内容，Claude 使用正常权限模型。<\/li>\n<li>description 未在预期时间触发时，作者建议增加与请求措辞匹配的关键词。<\/li>\n<li>500 行是“一个好的经验法则”，不是硬性上限；超过时作者建议考虑拆分。<\/li>\n<li>脚本内容不加载，只有输出消耗 token；材料称“这在以下情况下尤其有用：”，但未展开具体场景。<\/li>\n<li>开放标准目录组织只明确列出 <code>assets/<\/code> 一类。<\/li>\n<li>本课聚焦关键字段、description 最佳实践、工具限制和更复杂技能构建；下一课才比较技能与 CLAUDE.md、子代理、钩子、MCP 服务器等其他自定义 Claude Code 的方式。<\/li>\n<\/ul>","conceptCards":[{"name":"name（必填字段）","quotes":["名称（必填）— 用于标识您的技能。仅使用小写字母、数字和连字符。最多 64 个字符。名称应与您的目录名称一致。"],"feynman":"name 解决的是&quot;这个技能叫什么、放在哪个目录下&quot;的身份问题：必填，只能用小写字母、数字和连字符，最长 64 字符，并且必须和技能所在目录同名。它管的是标识，不管触发——正文把&quot;最重要&quot;的判语留给了 description，因为真正决定技能会不会被用上的是描述匹配。","nodeId":"cm_6ae99955"},{"name":"description（必填字段）","quotes":["描述（必填）— 告诉克劳德何时使用该技能。最多 1024 个字符。这是最重要的字段，因为克劳德会用它来进行匹配。","好的描述应该回答两个问题：这项技能有什么作用？克劳德应该在什么情况下使用它？","如果你的技能没有在预期的时间触发，请尝试添加更多与你实际请求措辞相匹配的关键词。克劳德会根据描述来判断技能是否相关，所以措辞很重要。","指示要明确。如果有人告诉你\"你的工作是帮忙处理文件\"，你肯定不知道该怎么做——克劳德也是这么想的。"],"feynman":"description 是克劳德做匹配的依据：它拿当前请求去比对描述，判断这个技能相不相关，从而决定是否启用。因此它必须回答两个问题——技能有什么作用、克劳德应在什么情况下用它；上限 1024 字符。它还连着一条排查规则：技能没在预期时机触发，就往描述里补上与真实请求措辞一致的关键词。写法上不要写&quot;帮忙处理文件&quot;这类含糊指令，要说清楚具体做什么。","nodeId":"cm_cb329146"},{"name":"allowed-tools（可选字段）","quotes":["allowed-tools（可选）— 限制克劳德在技能激活时可以使用的工具。","allowed-tools限制克劳德在技能激活时可以使用的工具——适用于只读或对安全性要求较高的工作流程。","当这项技能激活时，克劳德无需请求许可即可使用这些工具——不能编辑，也不能写作。","如果完全省略allowed-tools，该技能不会限制任何内容。克劳德使用其正常的权限模型。"],"feynman":"这是技能激活期间的权限白名单。列进去的工具可以免许可直接调用；列不进去的能力（编辑、写入）在这个技能里被挡死。反向边界同样重要：完全省略该字段就等于不设限，克劳德回到正常权限模型。作者把它推荐给只读任务、高安全要求或需要设护栏的工作流程。","nodeId":"cm_53ec7c9b"},{"name":"共享上下文窗口（技能激活即载入 SKILL.md）","quotes":["技能会与你的对话共享克劳德的上下文窗口。当克劳德激活一个技能时，它会将该技能的 SKILL.md 文件内容加载到上下文中。"],"feynman":"技能不在真空中生效——它和当前对话抢同一个上下文窗口，一旦激活，整份 SKILL.md 就被加载进来。理解这一点才能理解后面两个做法为什么存在：正因为 SKILL.md 会占上下文，才需要限制它的行数、才需要把细节挪到别处、才需要脚本只交输出。","nodeId":"cm_b3524e24"},{"name":"逐步披露（progressive disclosure）","quotes":["逐步披露：将 SKILL.md 文件控制在 500 行以内，并链接到 Claude 仅在需要时才阅读的支持文件（参考资料、脚本、资源）。","将所有内容塞进一个 2000 行的文件中有两个问题：它会占用大量的上下文窗口空间，而且维护起来很麻烦。","将必要的说明保留在 SKILL.md 文件中，并将详细的参考资料放在单独的文件中，Claude 只在需要时才阅读。","在这个例子中，Claudearchitecture-guide.md只会在有人询问系统设计时才会读取文件。如果他们问的是在哪里添加组件，它就不会加载该文件。这就像在上下文窗口中显示的是目录，而不是整个文档。","一个好的经验法则是：SKILL.md 文件最好控制在 500 行以内。如果超过这个限制，请考虑是否将内容拆分成单独的参考文件。"],"feynman":"把技能分成两层：SKILL.md 只保留必要说明，并附上指向支持文件的链接和&quot;何时加载它&quot;的清晰说明；详细参考资料、脚本、资源各放单独文件，Claude 只在该内容真的相关时才去读。它同时解两个问题——上下文被大文件占满、文件难维护。经验边界是 SKILL.md 不超过 500 行，超了就拆成单独的参考文件。效果被作者形容为：上下文里看到的是目录，而不是整份文档。","nodeId":"cm_916d7db2"},{"name":"脚本执行（不入上下文）","quotes":["脚本执行时无需将其内容加载到上下文中——只有输出会消耗令牌，从而保持上下文的高效性。","技能目录中的脚本无需加载其内容即可运行。脚本执行后，只有输出会消耗令牌。SKILL.md 文件中的关键指令是告诉 Claude 运行脚本，而不是读取脚本。"],"feynman":"脚本是&quot;运行&quot;的对象，不是&quot;阅读&quot;的对象：它不必被读进上下文就能执行，执行完只有输出消耗令牌。因此 SKILL.md 里的写法关键是让克劳德去运行脚本，而不是去读取脚本内容。边界在于——省掉的是脚本正文进入上下文，而不是省掉脚本本身。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TD\n  subgraph L1[&quot;触发层｜决定技能是否被选中&quot;]\n    N[&quot;name（必填）&lt;br/&gt;小写字母·数字·连字符，≤64 字符&quot;]\n    D[&quot;description（必填）&lt;br/&gt;≤1024 字符&quot;]\n    M[&quot;匹配：克劳德据此判断请求是否相关&quot;]\n    DN[&quot;技能目录名&quot;]\n  end\n  subgraph L2[&quot;激活层｜技能被激活&quot;]\n    ACT[&quot;技能激活&quot;]\n  end\n  subgraph L3[&quot;边界层｜激活时生效的限制&quot;]\n    AT[&quot;allowed-tools 白名单&quot;]\n    LIM[&quot;白名单内免请求许可；不能编辑/写入&quot;]\n    PERM[&quot;不限制：正常权限模型&quot;]\n    CTX[&quot;共享上下文窗口：SKILL.md 内容被载入&quot;]\n  end\n  subgraph L4[&quot;管理层｜控制上下文占用&quot;]\n    PD[&quot;逐步披露：SKILL.md ≤500 行&quot;]\n    SF[&quot;支持文件：只在需要时才读&quot;]\n    SC[&quot;脚本执行：内容不入上下文&quot;]\n    OUT[&quot;只有输出消耗令牌&quot;]\n  end\n  N --&gt;|须与目录名一致| DN\n  D --&gt; M --&gt; ACT\n  ACT --&gt;|限制生效| AT --&gt; LIM\n  AT -.-&gt;|完全省略| PERM\n  ACT --&gt;|载入 SKILL.md| CTX\n  CTX --&gt;|为省上下文| PD\n  CTX --&gt;|同一目的| SC\n  PD --&gt;|链接 + 说明何时加载| SF\n  SC --&gt; OUT\n<\/code>``","nodeId":"cm_40b450ca"}],"feynman":{"short":"description 最重要：说清技能做什么、何时用，措辞贴近实际说法，Claude 靠它匹配。allowed-tools 是可选工具白名单，设了就只给这几把工具，省略则完全不限。SKILL.md 控在 500 行内，厚资料放旁边按需加载；脚本只运行，只有输出耗 token。","long":"<p>这篇文章在回答：怎么给 Claude 的“技能”写名字和描述，让它在正确的时候被叫出来。答案是 name 和 description 必填，描述最重要，要说清“技能做什么、何时该用它”；名字只用小写、数字、连字符，并与目录一致。<\/p>\n<p>核心机制是：Claude 靠描述匹配你的请求，所以措辞要贴近你的实际说法；allowed-tools 是可选的工具白名单，设了它，技能激活时只能用这些工具，比如只读不能改，省略则完全不限制。SKILL.md 是技能主文件，最好 500 行内，详细资料放旁边文件，需要时才加载；脚本可只运行不读内容，只有输出会消耗 token（上下文额度）。<\/p>\n<p>类比：技能像工具箱，门口标签写清“修水管用”，箱里放薄说明书，厚手册用时再翻；allowed-tools 像只给螺丝刀、不给锤子。<\/p>\n<p>作者承认的边界是：技能会和对话共享上下文窗口，激活时 SKILL.md 内容要加载进去，塞太多既占空间又难维护；省略 allowed-tools 则没有安全锁。<\/p>","rubric":[{"concept":"description（必填字段）","points":["能说出该字段必填、有字符数上限，并且是 Claude 用来做匹配、决定是否启用技能的依据。","能说出好的描述必须同时回答“技能有什么作用”和“Claude 应在什么情况下使用它”两个问题。","能说出技能未在预期时机触发时的排查方向是补充与实际请求措辞一致的关键词，并指出含糊指令不可取。"]},{"concept":"allowed-tools（可选字段）","points":["能说出它是可选字段，作用是限制技能激活期间可用的工具，面向只读或高安全要求的工作流。","能举出白名单生效时的效果：表内工具免请求许可，同时不能编辑、不能写作。","能说出省略该字段并不等于设限，而是不限制任何内容并回到正常权限模型。"]},{"concept":"逐步披露（progressive disclosure）","points":["能指出技能激活会把 SKILL.md 载入与对话共享的上下文窗口，因此大文件既占空间又难维护。","能说出做法：主文件只留必要说明，详细资料放单独文件并附上何时加载的链接说明，行数控制在经验边界以内。","能区分脚本与文档的差别：脚本运行而不把内容读进上下文，只有输出消耗令牌。"]}]},"oneLine":"description 是最重要字段，决定 Claude 何时匹配并触发技能。"},{"slug":"agent-skills-vs-features","no":8,"title":"Claude 官方课程 · Skills 与其他 Claude Code 功能的比较","words":1766,"url":"https://academy.claude.com/zh-CN/courses/introduction-to-agent-skills/skills-vs-other-claude-code-features","author":"Claude Academy","summary":"Claude Code 有多种功能，每种解决不同问题。CLAUDE.md 始终加载，Skills 按需激活，Subagents 独立执行，Hooks 事件触发，MCP 提供外部工具。合理组合这些功能，可以实现更灵活和高效的项目定制。","fetched":"Reader 快照（2026-09-12）","topic":"Claude Code 五类功能分工","stars":4,"starReason":"官方一手界定五类功能边界，给出可直接照做的选型判据。","why":"Skills 刚出，常见误区是把一切配置都硬塞进去；这份官方对比给出何时用哪个功能的明确分界，能直接省掉试错。它把「常驻上下文 vs 按需加载」的成本取舍讲清楚了，是可复用的配置思路。","metaphor":"挂在同一块板上的五把钥匙","palette":"sky","paletteBg":"#6A9BCC","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"Claude Code 五类功能分工\"><defs><filter id=\"hw67\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"67\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#6A9BCC\"/><path d=\"M 839.7 187.5 Q 858.3 213.2 864.2 239.8 Q 870.2 266.4 841.6 288.4 Q 813.0 310.3 778.9 328.3 Q 744.8 346.2 706.9 362.2 Q 669.0 378.3 618.0 371.4 Q 567.0 364.6 524.3 369.4 Q 481.6 374.2 438.6 368.6 Q 395.5 363.0 351.2 354.5 Q 306.8 346.0 283.2 324.6 Q 259.6 303.1 236.9 282.2 Q 214.3 261.3 223.7 237.3 Q 233.1 213.2 236.2 188.3 Q 239.3 163.4 254.7 139.6 Q 270.2 115.9 302.8 99.5 Q 335.5 83.1 378.7 80.8 Q 421.9 78.5 455.4 70.0 Q 488.8 61.4 524.9 64.4 Q 561.0 67.4 598.3 69.0 Q 635.5 70.6 660.1 87.5 Q 684.8 104.3 718.4 115.6 Q 752.0 127.0 786.6 144.4 Q 821.1 161.8 839.7 187.5 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw67)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(362.8 50.4) scale(325.6)\"><path d=\"M .14 .22 H .86\"/><path d=\"M .26 .22 V .38 A .07 .07 0 1 1 .26 .52 A .07 .07 0 1 1 .26 .38\"/><path d=\"M .26 .52 V .74 M .26 .66 H .36 M .26 .74 H .34\"/><path d=\"M .52 .22 V .44 A .07 .07 0 1 1 .52 .58 A .07 .07 0 1 1 .52 .44\"/><path d=\"M .52 .58 V .86 M .52 .76 H .62 M .52 .84 H .60\"/><path d=\"M .76 .22 V .34 A .07 .07 0 1 1 .76 .48 A .07 .07 0 1 1 .76 .34\"/><path d=\"M .76 .48 V .68 M .76 .58 H .86 M .76 .66 H .84\"/><\/g><g filter=\"url(#hw67)\"><circle cx=\"599\" cy=\"28\" r=\"8.3\" fill=\"#141413\"/><circle cx=\"626\" cy=\"414\" r=\"9.4\" fill=\"#141413\"/><circle cx=\"411\" cy=\"389\" r=\"11.0\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>各功能各有专长，应按需求组合使用，避免硬塞进 skills。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>Claude Code 的 Skills 与 CLAUDE.md、subagents、hooks、MCP servers 分别解决什么问题？何时该用哪一种、如何组合？<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、总判断：先区分功能，再组合使用<\/h4>\n<h5>1.1 五种自定义选项解决不同问题<\/h5>\n<ul>\n<li>Claude Code 提供 Skills、CLAUDE.md、subagents、hooks、MCP servers。<\/li>\n<li>了解何时使用哪一种，可避免构建出错误的方案。<\/li>\n<li>每种功能都各有专长；不要把所有事情都硬塞进 skills，且可以同时使用多种功能。<\/li>\n<\/ul>\n<h5>1.2 一个典型配置可同时包含五者<\/h5>\n<ul>\n<li>CLAUDE.md：始终生效的项目标准。<\/li>\n<li>Skills：按需加载的特定任务专业知识。<\/li>\n<li>Hooks：由事件触发的自动化操作。<\/li>\n<li>Subagents：用于委派工作的隔离执行上下文。<\/li>\n<li>MCP servers：外部工具和集成。<\/li>\n<li>结论：当知识应在相关主题出现时由 Claude 自动应用，用 skills，并与其他功能结合，实现全面自定义。<\/li>\n<\/ul>\n<h4>二、Skills 与 CLAUDE.md：按需加载 vs 始终加载<\/h4>\n<h5>2.1 CLAUDE.md 始终进入每次对话<\/h5>\n<ul>\n<li>最适合始终生效的项目标准。<\/li>\n<li class=\"s\">例：希望 Claude 在项目中使用 TypeScript 严格模式，就写入 CLAUDE.md。<\/li>\n<li>适用：始终适用的项目级标准；诸如“永远不要修改数据库架构”之类的约束；框架偏好和编码风格。<\/li>\n<\/ul>\n<h5>2.2 Skills 按请求匹配后加入对话<\/h5>\n<ul>\n<li>当 Claude 将请求与某个 skill 匹配时，该 skill 的指令加入对话。<\/li>\n<li class=\"s\">例：编写新代码时，PR 审查清单不需要出现在上下文中；只在请求审查时激活。<\/li>\n<li>适用：特定任务的专业知识；只在某些情况下才相关的知识；会使每次对话都变得杂乱的详细流程。<\/li>\n<\/ul>\n<h4>三、Skills 与 Subagents：增强当前对话 vs 隔离委派<\/h4>\n<h5>3.1 Skills 给当前对话添加知识<\/h5>\n<ul>\n<li>skill 激活时，其指令加入现有上下文。<\/li>\n<li>适用：想为当前任务增强 Claude 的知识；该专业知识适用于整个对话过程。<\/li>\n<\/ul>\n<h5>3.2 Subagents 在独立上下文中执行任务<\/h5>\n<ul>\n<li>接收一个任务，独立完成工作，然后返回结果；与主对话隔离。<\/li>\n<li>适用：把任务委派给独立执行上下文；需要与主对话不同的工具访问权限；希望将委派工作与主上下文隔离。<\/li>\n<\/ul>\n<h4>四、Skills 与 Hooks：请求驱动 vs 事件驱动<\/h4>\n<h5>4.1 Hooks 由事件触发<\/h5>\n<ul>\n<li>事件发生时触发，如文件保存、工具调用。<\/li>\n<li class=\"s\">例：每次保存文件时运行代码检查工具；特定工具调用之前验证输入。<\/li>\n<li>适用：应在每次文件保存时运行的操作；特定工具调用之前的验证；Claude 操作的自动化副作用。<\/li>\n<\/ul>\n<h5>4.2 Skills 由请求内容驱动<\/h5>\n<ul>\n<li>根据您的请求内容激活。<\/li>\n<li>适用：影响 Claude 处理请求方式的知识；影响 Claude 推理过程的指导原则。<\/li>\n<\/ul>\n<h4>五、Skills 与 MCP servers：不同类别<\/h4>\n<h5>5.1 MCP 提供外部工具与集成<\/h5>\n<ul>\n<li>MCP servers 提供外部工具和集成——与 skills 是“完全不同的类别”。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>明确边界：其他选项更合适时，不要把一切硬塞进 skills；可以同时使用多种功能。<\/li>\n<li>MCP servers 与 skills 被归为“完全不同的类别”，原文没有给出两者的具体取舍标准。<\/li>\n<li>原文未给出反例、失败案例或未解决矛盾；也未展开 MCP 的使用场景。<\/li>\n<\/ul>","conceptCards":[{"name":"Skills（按需加载的特定任务专业知识）","quotes":["Skills 按需加载，最适合用于特定任务的专业知识","当 Claude 将某个请求与某个 skill 匹配时，该 skill 的指令就会加入对话。当您在编写新代码时，您的 PR 审查清单并不需要出现在上下文中——它只在您请求审查时才会激活。","Skills 会为您当前的对话添加知识。当某个 skill 激活时，其指令会加入现有的上下文。","Skills 是请求驱动的。它们根据您的请求内容激活。"],"feynman":"在本文里，Skills 不是始终存在的规则，也不是独立执行环境。它是特定任务的知识包，平时不进入上下文，只有当请求与某个 skill 匹配时才被激活，并把指令加入当前对话。它解决的是“有些专业知识只在某些情况下才相关，不该让每次对话都变杂乱”的问题，也是全文比较其他功能的中心参照物。","nodeId":"cm_92cb645b"},{"name":"CLAUDE.md（始终加载的项目标准）","quotes":["CLAUDE.md 会加载到每次对话中，最适合用于始终生效的项目标准。","如果您希望 Claude 在您的项目中使用 TypeScript 严格模式，请将其写入您的 CLAUDE.md 文件。","始终适用的项目级标准；诸如“永远不要修改数据库架构”之类的约束；框架偏好和编码风格"],"feynman":"CLAUDE.md 在本文中指始终装入每次对话的项目级标准和约束，例如 TypeScript 严格模式、框架偏好、不能修改数据库架构这类规则。它的关键是“始终生效”，因此适合不管请求内容是什么都必须成立的要求；这与 Skills 的“按需激活”形成边界对照。","nodeId":"cm_b9d1dd66"},{"name":"Subagents（隔离的执行上下文）","quotes":["Subagents 在隔离的执行上下文中运行——用于委派工作。Skills 则为您当前的对话添加知识","它们接收一个任务，独立完成工作，然后返回结果。它们与主对话是隔离的。","您需要与主对话不同的工具访问权限"],"feynman":"Subagents 在本文里不是给当前对话补充知识，而是拿到一个任务，在独立、隔离的上下文中完成，再把结果返回。它可以有不同的工具访问权限，作用是把委派工作与主上下文隔开。理解这个边界，才能区分“增强当前对话的知识”和“把工作交出去执行”。","nodeId":"cm_b2c9fd9e"},{"name":"Hooks（事件驱动）","quotes":["Hooks 是事件驱动的（在文件保存、工具调用时触发）。Skills 是请求驱动的（根据您的请求内容激活）","某个 hook 可能会在 Claude 每次保存文件时运行代码检查工具，或在特定工具调用之前验证输入。它们是事件驱动的。","应在每次文件保存时运行的操作；特定工具调用之前的验证；Claude 操作的自动化副作用"],"feynman":"Hooks 在本文中指在文件保存、工具调用这类事件发生时自动运行的操作，例如每次保存都跑代码检查、在工具调用前验证输入。它不是根据用户请求内容来激活知识，而是在特定动作或事件上执行自动化。它和 Skills 的关键区别是触发机制：事件驱动，而不是请求驱动。","nodeId":"cm_7e6ba505"},{"name":"MCP servers（外部工具和集成）","quotes":["MCP servers 提供外部工具和集成——这与 skills 完全是不同的类别","MCP 提供外部工具。"],"feynman":"MCP servers 在本文里负责外部工具和集成，是另一类能力来源，不是用来给当前对话注入任务知识的。理解这一点，读者才不会把“接入外部工具”误当成“写一个 skill”，也才能看清为什么作者说每种功能各有专长。","nodeId":"cm_6db0527f"},{"name":"按需加载与始终加载（加载模型）","quotes":["CLAUDE.md 会加载到每次对话中，最适合用于始终生效的项目标准。Skills 按需加载，最适合用于特定任务的专业知识","当您在编写新代码时，您的 PR 审查清单并不需要出现在上下文中——它只在您请求审查时才会激活。"],"feynman":"这一对概念讲的是内容什么时候进入上下文。始终加载适用于任何请求都必须遵守的标准；按需加载适用于只在某些情况下才相关的知识。PR 审查清单在写新代码时不需要占用上下文，所以适合放进 skill；TypeScript 严格模式则适合放进 CLAUDE.md。它是判断某个内容该放哪里的边界规则。","nodeId":"cm_a63808b6"},{"name":"请求驱动与事件驱动（触发模型）","quotes":["Hooks 是事件驱动的（在文件保存、工具调用时触发）。Skills 是请求驱动的（根据您的请求内容激活）","Skills 是请求驱动的。它们根据您的请求内容激活。","Hooks 在事件发生时触发。"],"feynman":"这一对概念讲的是“什么导致功能被激活”。Skills 由请求内容匹配触发；Hooks 由文件保存、工具调用等事件触发。因此，影响 Claude 如何处理请求的知识适合做成 skill，而每次保存都要执行的操作、工具调用前的验证适合做成 hook。它决定了自动化的边界在哪里。","nodeId":"cm_5a687800"},{"name":"功能组合（结合使用，而非硬塞）","quotes":["每个功能都各有专长——将它们结合使用，而不是把所有事情都硬塞进一种方案中","每种功能都各有专长。当其他选项更合适时，不要把所有事情都硬塞进 skills 中——而且您可以同时使用多种功能。","一个典型的配置可能包括：CLAUDE.md —— 始终生效的项目标准；Skills —— 按需加载的特定任务专业知识；Hooks —— 由事件触发的自动化操作；Subagents —— 用于委派工作的隔离执行上下文；MCP servers —— 外部工具和集成"],"feynman":"在本文里，功能组合不是简单罗列工具，而是作者的结论：Claude Code 的这些自定义选项解决不同问题，所以应根据每种功能的专长分别使用，再组合成一个完整配置。它防止读者把所有需求都塞进 Skills，也把前面各个概念收束成一个整体框架。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TB\n  subgraph L1[功能角色层]\n    R1[知识/上下文]\n    R2[执行委派]\n    R3[事件自动化]\n    R4[外部集成]\n  end\n\n  subgraph L2[具体功能层]\n    S[Skills]\n    C[CLAUDE.md]\n    A[Subagents]\n    H[Hooks]\n    M[MCP servers]\n  end\n\n  subgraph L3[机制与边界对照层]\n    L[按需加载 ↔ 始终加载]\n    T[请求驱动 ↔ 事件驱动]\n    I[当前对话添加知识 ↔ 隔离执行上下文]\n  end\n\n  subgraph L4[总原则层]\n    K[组合使用：结合而非硬塞]\n  end\n\n  R1 --&gt; S\n  R1 --&gt; C\n  R2 --&gt; A\n  R3 --&gt; H\n  R4 --&gt; M\n\n  S --&gt; L\n  C --&gt; L\n  S --&gt; T\n  H --&gt; T\n  S --&gt; I\n  A --&gt; I\n  M -.不同类别.-&gt; S\n\n  S --&gt; K\n  C --&gt; K\n  A --&gt; K\n  H --&gt; K\n  M --&gt; K\n<\/code>``","nodeId":"cm_af4d864f"}],"feynman":{"short":"这几种自定义不是互相替代：有的每次对话都加载，用来放始终生效的标准；有的按请求匹配才激活，把指令加进当前对话；有的在隔离上下文里替你把活干完再交结果；有的由保存、工具调用这类事件触发；还有的负责接外部工具。各管一摊，组合起来用，别都塞进同一个地方。","long":"<p>这篇文章在回答：Claude Code 有 Skills、CLAUDE.md、subagents、hooks、MCP 这么多种自定义方式，到底什么时候用哪一种？答案是它们不是互相替代，而是各管一摊，最好组合使用，别把所有需求都硬塞进 Skills。<\/p>\n<p>核心机制是“什么时候把什么加入当前对话”。CLAUDE.md 像一直贴在桌上的项目守则，每次对话都加载；Skills 像按需抽出的专业手册，只有请求匹配时才激活；subagents 像把任务交给单独房间的同事，在隔离上下文里干完再交结果；hooks 像传感器，文件保存、工具调用等事件一发生就触发；MCP 则是接外部工具和集成的插头。区别就在于：始终生效还是按需加载，加入当前对话还是隔离运行，事件驱动还是请求驱动，内部知识还是外部集成。<\/p>\n<p>日常类比：厨房里，CLAUDE.md 是餐厅常驻卫生标准，Skills 是某道菜才翻开的菜谱，subagents 是外包厨师，hooks 是烤箱定时器，MCP 是外卖接口。<\/p>\n<p>作者承认的边界是：Skills 按需加载，所以不会始终生效；当其他选项更合适时，不要把所有事情都硬塞进 Skills，而应组合使用。<\/p>","rubric":[{"concept":"Skills（按需加载的特定任务专业知识）","points":["说清它的加载时机是被请求内容匹配之后，而非每次对话都进入","说清它给当前对话补充知识，而不是在隔离环境里执行任务","举出至少一个「只在某些情况才相关」的例子，说明它不该一直占用上下文"]},{"concept":"按需加载与始终加载（加载模型）","points":["能指出另一类方式是每次对话都会加载的","给出「始终适用」这类内容的典型形态，并说明它与只在特定任务下相关内容的分界","给出的判断依据落在「是否任何请求都必须成立」上，而不是凭感觉挑"]},{"concept":"功能组合（结合使用，而非硬塞）","points":["明确表达这些能力解决的是不同问题、不是互相替代关系","能列出至少三种不同职能并各自对应到恰当的位置","指出「当其他选项更合适时不要再硬塞」这一边界，而不是宣称某一种方案能包办全部"]}]},"oneLine":"各功能各有专长，应按需求组合使用，避免硬塞进 skills。"},{"slug":"agent-skills-lesson-5","no":9,"title":"Claude 官方课程 · 第 5 课：技能的分发与共享","words":2138,"url":"https://academy.claude.com/zh-CN/courses/introduction-to-agent-skills/sharing-skills","author":"Claude Academy","summary":"共享技能能提高团队价值，主要通过仓库提交、插件和企业托管三种方式分发。自定义子代理必须在配置中明确列出技能，内置代理无法使用技能。企业托管适合强制标准和合规，插件适合广泛社区，仓库适合团队内部共享。","fetched":"Reader 快照（2026-09-12）","topic":"技能分发与子代理继承","stars":4,"starReason":"官方一手机制，明确企业技能覆盖优先级与子代理不继承技能这两条硬规则，别处难查。","why":"它把技能从个人效率工具变成可治理的组织资产，三种分发通道各自的适用边界一目了然。更值钱的是那条反直觉的规则：子代理不自动继承技能，必须显式声明才能生效。","metaphor":"三条管道汇入一个总阀门","palette":"cactus","paletteBg":"#BCD1CA","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"技能分发与子代理继承\"><defs><filter id=\"hw72\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"72\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#BCD1CA\"/><path d=\"M 827.0 191.4 Q 849.6 216.2 844.8 240.9 Q 840.1 265.7 822.0 289.0 Q 804.0 312.3 770.5 330.2 Q 737.0 348.2 689.0 352.2 Q 641.1 356.1 601.7 364.4 Q 562.3 372.7 520.5 369.1 Q 478.7 365.4 439.4 359.5 Q 400.2 353.5 365.6 342.0 Q 331.1 330.5 291.7 318.5 Q 252.3 306.4 236.9 284.3 Q 221.4 262.2 225.8 239.2 Q 230.3 216.2 244.2 193.4 Q 258.1 170.7 279.6 151.8 Q 301.2 133.0 316.3 110.3 Q 331.5 87.5 375.4 86.9 Q 419.4 86.2 451.2 76.1 Q 483.1 66.0 520.8 60.5 Q 558.6 55.1 599.3 57.4 Q 639.9 59.8 678.7 70.3 Q 717.5 80.7 728.1 106.7 Q 738.6 132.7 771.5 149.6 Q 804.4 166.6 827.0 191.4 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw72)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(356.7 53.4) scale(325.6)\"><path d=\"M .08 .26 H .52\"/><path d=\"M .08 .52 H .52\"/><path d=\"M .08 .78 H .52\"/><path d=\"M .52 .26 V .78\"/><path d=\"M .52 .52 H .66\"/><path d=\"M .66 .52 A .14 .14 0 1 0 .66 .80 A .14 .14 0 1 0 .66 .52\"/><path d=\"M .94 .52 H .80\"/><path d=\"M .94 .52 L .84 .44\"/><path d=\"M .94 .52 L .84 .60\"/><\/g><g filter=\"url(#hw72)\"><circle cx=\"869\" cy=\"209\" r=\"7.8\" fill=\"#141413\"/><circle cx=\"529\" cy=\"46\" r=\"7.2\" fill=\"#141413\"/><circle cx=\"341\" cy=\"354\" r=\"8.1\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>技能共享更有价值；仓库、插件、企业分发，子代理需显式列技能。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>技能如何在团队、组织或社区中分发共享？三种主要方法分别适合什么场景？如何配置自定义子代理以使用技能？子代理是否自动继承技能？<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、共享技能的价值与三种分发方法<\/h4>\n<h5>1.1 共享使技能增值<\/h5>\n<ul>\n<li>一个只有自己使用的 PR 审查技能有帮助；同一技能在整个团队共享，能使代码审查标准化，并在整个组织创造一致体验。<\/li>\n<\/ul>\n<h5>1.2 三种分发方法<\/h5>\n<ul>\n<li>仓库提交：项目技能在 .claude/skills 中通过 Git 自动共享，克隆仓库者获得技能。<\/li>\n<li>插件：通过市场在各仓库间分发，供更广泛社区使用。<\/li>\n<li>企业托管设置：以最高优先级在整个组织范围内部署技能，适合强制性标准和合规要求。<\/li>\n<\/ul>\n<h4>二、仓库提交：通过 Git 自动共享<\/h4>\n<h5>2.1 最简单的共享方法<\/h5>\n<ul>\n<li>将技能直接提交到仓库，放在 .claude/skills 中；任何克隆该仓库的人自动获得技能，无需额外安装。<\/li>\n<li>推送更新后，每个人在下次拉取时获得更新。<\/li>\n<li>.claude 目录包含代理、钩子、技能和设置；所有内容经过版本控制，并通过正常的 Git 工作流程与团队共享。<\/li>\n<\/ul>\n<h4>三、插件：跨仓库和社区分发<\/h4>\n<h5>3.1 插件与技能目录结构<\/h5>\n<ul>\n<li>插件是通过自定义功能扩展 Claude Code 的方式，旨在跨团队和项目共享。<\/li>\n<li>在插件项目中创建 skills 目录，遵循与 .claude 目录类似文件结构；每个技能有自己的文件夹，内含 SKILL.md。<\/li>\n<\/ul>\n<h5>3.2 分发与适用场景<\/h5>\n<ul>\n<li>分发到市场后，其他用户可自行发现并将其安装到 Claude Code。<\/li>\n<li>当技能不是过于特定于某个项目，并且对直接团队以外的社区成员也有用时，这种方法是最佳选择。<\/li>\n<\/ul>\n<h4>四、企业托管设置：组织范围部署<\/h4>\n<h5>4.1 最高优先级与覆盖<\/h5>\n<ul>\n<li>管理员可通过托管设置在整个组织范围内部署技能。<\/li>\n<li>企业技能具有最高优先级，会覆盖同名的个人、项目和插件技能。<\/li>\n<\/ul>\n<h5>4.2 控制插件安装来源<\/h5>\n<ul>\n<li>托管设置文件支持 strictKnownMarketplaces 等功能，用于控制可以从哪里安装插件。<\/li>\n<li>示例来源：GitHub 仓库 acme-corp/approved-plugins；npm 包 @acme-corp/compliance-plugins。<\/li>\n<\/ul>\n<h5>4.3 适用场景<\/h5>\n<ul>\n<li>对必须在整个组织中保持一致的强制性标准、安全要求、合规工作流程和编码实践，这是正确选择；这里的关键词是“必须”。<\/li>\n<\/ul>\n<h4>五、子代理与技能：关键注意事项<\/h4>\n<h5>5.1 子代理不会自动继承技能<\/h5>\n<ul>\n<li>将任务委派给子代理时，它会以“全新、干净的上下文”开始。<\/li>\n<li>子代理不会自动看到您的技能。<\/li>\n<\/ul>\n<h5>5.2 访问权限区别<\/h5>\n<ul>\n<li>内置代理（Explorer、Plan、Verify）完全无法访问技能。<\/li>\n<li>自定义子代理可以使用技能，但只有在明确列出它们时才可以。<\/li>\n<\/ul>\n<h5>5.3 创建带技能的自定义子代理<\/h5>\n<ul>\n<li>在 .claude/agents 中添加代理 markdown 文件；可用 Claude Code 中的 /agents 命令交互式创建。<\/li>\n<li>生成的代理文件包含 skills 字段，列出要加载的技能。<\/li>\n<li>前置元数据示例：name 为 frontend-security-accessibility-reviewer；skills 为 accessibility-audit, performance-check；另有 description、tools、model: sonnet、color: blue 等字段。<\/li>\n<li>委派给这个子代理时，它会加载这两项技能，并应用于每次审查。<\/li>\n<li>先确保技能存在于 .claude/skills 目录中，然后创建新子代理，或将 skills 字段添加到现有代理的 markdown 文件。<\/li>\n<\/ul>\n<h5>5.4 适用模式<\/h5>\n<ul>\n<li>不同子代理需要不同技能（前端审查者与后端审查者）。<\/li>\n<li>希望在委派工作中强制执行标准，而不依赖提示。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>明确注意事项：子代理不会自动继承技能；委派时以“全新、干净的上下文”开始；内置代理完全无法访问技能；自定义子代理需要显式列出技能。<\/li>\n<li>优先级边界：企业技能会覆盖同名的个人、项目和插件技能。<\/li>\n<li>插件适用边界：技能不是过于特定于某个项目，并且对直接团队以外的社区成员也有用。<\/li>\n<li>企业适用边界：面向全组织必须一致的强制性标准、安全要求、合规工作流程和编码实践；关键词是“必须”。<\/li>\n<li>材料只给出 strictKnownMarketplaces 作为托管设置文件支持的功能示例，未展开其他托管设置能力或限制。<\/li>\n<li>结尾未给出具体分发选择答案，而是提问：哪种共享方法（仓库、插件、企业）最有意义；哪些工作流程中带特定技能的自定义子代理能提高委派一致性。<\/li>\n<li>本课未详述故障排查；结尾预告最后一课将讲无法触发的技能、优先级冲突、运行时错误，并提供实用检查清单。<\/li>\n<\/ul>","conceptCards":[{"name":"仓库提交（.claude/skills 中的项目技能）","quotes":[".claude/skills 中的项目技能会通过 Git 自动共享——任何克隆该仓库的人都会获得这些技能","最简单的共享方法是将技能直接提交到您的仓库。将它们放在 .claude/skills 中，任何克隆该仓库的人都会自动获得这些技能——无需额外安装。","当您推送更新时，每个人在下次拉取时都会获得这些更新。"],"feynman":"这条路把技能当成仓库里的普通文件——技能跟着 Git 走，没有第二条分发通道。克隆即获得，不装任何东西；推送更新后，别人下次拉取就同步。它界定的机制边界是&quot;零安装、零额外渠道、随版本控制&quot;，所以作者称它最简单，也是项目专属技能的自然归宿。","nodeId":"cm_ae250f40"},{"name":"插件与市场（Plugin / Marketplace）","quotes":["插件是一种通过自定义功能扩展 Claude Code 的方式，旨在跨团队和项目共享。在您的插件项目中，创建一个遵循与 .claude 目录类似文件结构的 skills 目录——每个技能都有自己的文件夹，里面包含一个 SKILL.md 文件。","在您将插件分发到市场后，其他用户可以自行发现并将其安装到 Claude Code 中。","当您的技能不是过于特定于某个项目，并且对直接团队以外的社区成员也有用时，这种方法是最佳选择。"],"feynman":"插件把技能从单个仓库里解放出来。它的目录结构模仿 <code>.claude<\/code>（一个 skills 目录，每个技能一个文件夹，内含 SKILL.md），但分发不走仓库，而走市场：别人自己发现、自己安装。作者给的适用标准是&quot;技能对直接团队以外的人也有用&quot;——反过来说，过度绑定某个项目的技能就不该走这条路。","nodeId":"cm_48ea99ce"},{"name":"企业托管设置（Managed Settings）与 strictKnownMarketplaces","quotes":["管理员可以通过托管设置在整个组织范围内部署技能。企业技能具有最高优先级——它们会覆盖同名的个人、项目和插件技能。","托管设置文件支持诸如 strictKnownMarketplaces 之类的功能，用于控制可以从哪里安装插件：","```","\"strictKnownMarketplaces\": [","{","\"source\": \"github\",","\"repo\": \"acme-corp/approved-plugins\"","},","{","\"source\": \"npm\",","\"package\": \"@acme-corp/compliance-plugins\"","}","]","```","对于必须在整个组织中保持一致的强制性标准、安全要求、合规工作流程和编码实践，这是正确的选择。这里的关键词是\"必须\"。"],"feynman":"这条路的推动者不是使用者而是管理员：技能由托管设置统一下发到整个组织。它有两个机制要点：一是优先级最高（见下一条），二是 <code>strictKnownMarketplaces<\/code> 限定了插件只能从白名单来源安装——它管的不是技能内容，而是&quot;允许从哪里拿插件&quot;这道准入闸门。作者把判断标准压缩成一个词：&quot;必须&quot;——只有强制性标准、安全要求、合规工作流程和编码实践才值得动用这一层。","nodeId":"cm_32e036a5"},{"name":"企业技能的最高优先级（同名覆盖）","quotes":["企业技能具有最高优先级——它们会覆盖同名的个人、项目和插件技能。"],"feynman":"它解决的理解难点是&quot;同名技能谁说了算&quot;。答案是：当个人、项目、插件、企业各存在一份同名技能时，企业版生效，其余被覆盖。（原文只交代了企业技能对其他三类的覆盖，没有进一步说明这三者彼此之间的次序。）正因为有这条强制覆盖，企业托管才可能承载&quot;强制性标准&quot;——否则组织无法保证所有人跑的是同一套规则。","nodeId":"cm_2440f85e"},{"name":"子代理的技能隔离（子代理不自动继承技能）","quotes":["有一件事会让人感到意外：子代理不会自动看到您的技能。当您将任务委派给子代理时，它会以全新、干净的上下文开始。","子代理不会自动看到您的技能——您必须在自定义代理的前置元数据 skills 字段中明确列出技能"],"feynman":"委派任务时，子代理是从&quot;全新、干净的上下文&quot;起步的，所以主会话里能用的技能，它默认一个也看不到。这不是配置失误，而是默认规则——也正因为是默认规则，后面的自定义子代理才必须显式写 <code>skills<\/code> 字段。这条是理解&quot;为什么还要多做一步配置&quot;的前提。","nodeId":"cm_138a8b67"},{"name":"内置代理与自定义子代理的技能访问边界","quotes":["内置代理（Explorer、Plan、Verify）完全无法访问技能——只有在 .claude/agents 中定义的自定义子代理才可以","您定义的自定义子代理可以使用技能，但只有在您明确列出它们时才可以"],"feynman":"内置代理（Explorer、Plan、Verify）对技能是&quot;完全无法访问&quot;，这是一道靠配置打不开的硬边界；有资格使用技能的只有写在 <code>.claude/agents<\/code> 里的自定义子代理，而且还得满足&quot;明确列出&quot;这个条件。这条边界决定了&quot;给代理配技能&quot;这件事的有效范围：不是给任意代理加配置，而是专门走自定义子代理这条路。","nodeId":"cm_4eb02f12"},{"name":"skills 字段（前置元数据中的显式授权）","quotes":["要创建带有技能的自定义子代理，请在 .claude/agents 中添加一个代理 markdown 文件。您可以使用 Claude Code 中的 /agents 命令以交互方式创建一个：","生成的代理文件包含一个 skills 字段，列出要加载的技能。以下是前置元数据的样子：","```","---","name: frontend-security-accessibility-reviewer","description: \"Use this agent when you need to review frontend code for accessibility...\"","tools: Bash, Glob, Grep, Read, WebFetch, WebSearch, Skill...","model: sonnet","color: blue","skills: accessibility-audit, performance-check","---","```","当您委派给这个子代理时，它会加载这两项技能，并将它们应用于每次审查。首先确保这些技能存在于您的 .claude/skills 目录中，然后创建一个新的子代理，或将 skills 字段添加到现有代理的 markdown 文件中。","您希望在委派的工作中强制执行标准，而不依赖于提示"],"feynman":"<code>skills:<\/code> 这一行就是隔离规则的解药——只有在自定义子代理的前置元数据里点名写出技能，它才会加载，并在每次被委派时都应用。它的前置条件是技能已存在于 <code>.claude/skills<\/code>；操作上可以用 <code>/agents<\/code> 交互生成，也可以往已有的代理 markdown 里补字段。作者点出它的价值在于&quot;强制执行标准，而不依赖于提示&quot;：把规则沉淀成技能并绑定到代理上，比每次在提示里重申更可靠。\n\n## 二、概念架构图\n\n``<code>mermaid\nflowchart TB\n  subgraph L1[分发层：技能怎么到达使用者]\n    A[&quot;仓库提交&lt;br/&gt;.claude/skills · Git 自动共享&quot;]\n    B[&quot;插件与市场&lt;br/&gt;skills 目录 + SKILL.md&quot;]\n    C[&quot;企业托管设置&lt;br/&gt;strictKnownMarketplaces 限来源&quot;]\n  end\n  subgraph L2[优先级层]\n    D[&quot;企业技能：最高优先级&lt;br/&gt;覆盖同名个人／项目／插件技能&quot;]\n  end\n  subgraph L3[子代理访问层：谁能用技能]\n    E[&quot;技能隔离&lt;br/&gt;不自动继承 · 全新干净上下文&quot;]\n    F[&quot;内置代理 Explorer／Plan／Verify&lt;br/&gt;完全无法访问技能&quot;]\n    G[&quot;自定义子代理 .claude/agents&lt;br/&gt;需显式授权&quot;]\n    H[&quot;skills 字段&lt;br/&gt;列出要加载的技能&quot;]\n  end\n  C --&gt; D\n  D --&gt;|同名时覆盖| A\n  D --&gt;|同名时覆盖| B\n  E --&gt; F\n  E --&gt;|故必须显式列出| G\n  G --&gt; H\n  H --&gt;|每次委派时加载并应用| G\n<\/code>``\n\n图中三层的划分依据是功能角色：分发层决定技能以何种渠道、何种范围到达使用者；优先级层裁决同名冲突；子代理访问层处理&quot;委派出去的工作能不能用上技能&quot;。企业托管设置单独指向优先级层，是因为它同时具备部署方式与最高优先级两重身份。","nodeId":"cm_200893a2"}],"feynman":{"short":"技能共享三条路：放进 .claude/skills 跟仓库走，克隆即得；做成插件上市场，别人自己装；企业托管优先级最高，覆盖同名技能并限定插件来源。但子代理从零开始，默认看不见技能，必须在代理文件 skills 字段点名才会加载；内置的 Explorer、Plan、Verify 完全用不了。","long":"<p>文章在回答：团队里写好的 Claude 技能，怎么分给别人用、以及怎么让子代理用上它。答案是三条路——提交进仓库、做成插件、企业统一托管——外加一个坑：子代理不会自动继承技能，得手动点名。<\/p>\n<p>机制上，技能就是存在 .claude/skills 里的文件夹。放进仓库，谁克隆谁就有，推送更新后大家拉取即可同步，靠 Git 版本控制。做成插件，则像上架应用市场，别人自行发现安装，适合不局限于单个项目的通用技能。企业托管优先级最高，同名技能一律被它覆盖，还能限定只允许从批准的来源安装插件——凡带&quot;必须&quot;二字的标准、合规、安全要求，就该用它。子代理则是被派活时从零开始、干干净净的助手，所以它看不见你已有的技能；只有在自定义代理文件开头的 skills 字段里明确列出，它才会加载。内置的 Explorer、Plan、Verify 则完全用不了技能。<\/p>\n<p>类比：仓库共享像把工具箱放进公司储物间，谁进这间屋都能拿；插件像超市货架上的成品工具；企业托管像公司强制配发的标准装备。而子代理像个新来的外包同事——你不把工具清单写给他，他就空手干活。<\/p>\n<p>作者承认的代价：企业技能会覆盖同名的个人和项目技能，优先级是把双刃剑，用不好会压掉你自己的定制。<\/p>","rubric":[{"concept":"技能分发三通道：仓库、插件、企业托管","points":["能分别说出三种分发方式各自的载体与到达使用者的路径，而不是只笼统说“共享技能”。","讲到企业层的两个特征：优先级最高、可控制插件可从哪里安装。","给出各自的适用判断依据（最简单／面向直接团队以外／带“必须”的强制与合规）。"]},{"concept":"子代理的技能隔离","points":["明确指出子代理不自动继承技能，并给出原因是委派时以全新、干净的上下文开始。","区分内置代理与自定义子代理的访问权限差异，说明前者对技能完全不可用、后者也需满足附加条件。"]},{"concept":"skills 字段的显式授权","points":["指出授权发生在自定义子代理文件的前置元数据中，且以列出技能名的方式完成。","说明生效前提是技能已存在于 .claude/skills，并指出加载后的效果是每次被委派时都应用。","点出这一做法的价值在于把标准固化下来，不必在每次委派时靠提示重申。"]}]},"oneLine":"技能共享更有价值；仓库、插件、企业分发，子代理需显式列技能。"},{"slug":"agent-skills-lesson-6","no":10,"title":"Claude 官方课程 · 第 6 课：技能排障","words":1868,"url":"https://academy.claude.com/zh-CN/courses/introduction-to-agent-skills/troubleshooting-skills","author":"Claude Academy","summary":"当技能无法正常工作时，常见问题包括无法触发、加载失败、冲突或运行错误。使用技能验证器和 claude --debug 工具可以帮助快速定位和修复问题。优化描述、检查文件结构和权限，以及管理技能优先级，能提高技能的使用效果。","fetched":"Reader 快照（2026-09-12）","topic":"技能故障排查手册","stars":3,"starReason":"官方一手故障分类与优先级机制，实操可查，但限于具体工具配置，通用性中等","why":"它把技能失效拆成四类可预测故障并各配修复动作，省去盲目试错。其中企业级技能遮蔽个人同名技能这类优先级机制，是文档里少见但一踩就中的坑。","metaphor":"分成四格的检修抽屉，每格里躺着一把对应的扳手","palette":"heather","paletteBg":"#CBCADB","hero":"<svg viewBox=\"0 0 1000 440\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"技能故障排查手册\"><defs><filter id=\"hw29\" x=\"-8%\" y=\"-8%\" width=\"116%\" height=\"116%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.018\" numOctaves=\"2\" seed=\"29\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><rect width=\"1000\" height=\"440\" fill=\"#CBCADB\"/><path d=\"M 827.5 193.6 Q 871.9 215.5 870.6 241.6 Q 869.4 267.7 841.9 289.4 Q 814.4 311.1 766.4 320.0 Q 718.3 328.9 685.8 342.2 Q 653.2 355.6 614.5 366.3 Q 575.7 376.9 533.5 369.8 Q 491.3 362.6 452.4 357.1 Q 413.4 351.6 355.6 354.5 Q 297.8 357.4 272.9 334.4 Q 248.0 311.3 217.2 290.1 Q 186.5 268.8 198.8 242.2 Q 211.1 215.5 220.1 189.2 Q 229.1 162.9 258.1 142.6 Q 287.1 122.4 313.9 103.7 Q 340.7 85.0 383.4 81.8 Q 426.1 78.7 460.9 73.2 Q 495.7 67.6 532.3 64.5 Q 568.9 61.5 607.6 64.1 Q 646.2 66.7 691.7 70.7 Q 737.2 74.8 747.4 102.1 Q 757.7 129.4 770.4 150.6 Q 783.1 171.7 827.5 193.6 Z\" fill=\"#FAF9F5\"/><g filter=\"url(#hw29)\" fill=\"none\" stroke=\"#141413\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(368.8 52.7) scale(325.6)\"><path d=\"M .14 .20 H .86 V .84 H .14 Z\"/><path d=\"M .50 .20 V .84\"/><path d=\"M .14 .52 H .86\"/><path d=\"M .24 .30 V .44 M .24 .44 A .04 .04 0 1 0 .24 .52\"/><path d=\"M .24 .52 H .30\"/><path d=\"M .62 .30 V .44 M .62 .44 A .04 .04 0 1 0 .62 .52\"/><path d=\"M .62 .52 H .68\"/><path d=\"M .24 .62 V .76 M .24 .76 A .04 .04 0 1 0 .24 .84\"/><path d=\"M .24 .84 H .30\"/><path d=\"M .62 .62 V .76 M .62 .76 A .04 .04 0 1 0 .62 .84\"/><path d=\"M .62 .84 H .68\"/><\/g><g filter=\"url(#hw29)\"><circle cx=\"378\" cy=\"42\" r=\"8.9\" fill=\"#141413\"/><circle cx=\"836\" cy=\"248\" r=\"5.2\" fill=\"#141413\"/><circle cx=\"388\" cy=\"48\" r=\"8.1\" fill=\"#141413\"/><\/g><\/svg>","notes":"<h3>一句话主旨<\/h3>\n<p>技能失效可归入几类可预测的故障，每类都有直接对应的修复方法。<\/p>\n<h3>作者试图回答的问题<\/h3>\n<p>当技能未按预期工作时，如何系统化地诊断并修复？核心是把故障分类，逐类给出原因与修复动作，并先用手边工具排除结构性问题。<\/p>\n<h3>三级论证骨架<\/h3>\n<h4>一、先分类，再用验证器排除结构性问题<\/h4>\n<h5>1.1 故障归为四类<\/h5>\n<ul>\n<li>技能无法触发、无法加载、存在冲突、运行时失败；作者称&quot;大多数修复方法都相当直接&quot;。<\/li>\n<\/ul>\n<h5>1.2 第一步是 agent skills verifier 命令<\/h5>\n<ul>\n<li>目的：在花时间调试其他问题之前，先捕获结构性问题。<\/li>\n<li class=\"s\">安装步骤因操作系统而异，用 <code>uv<\/code> 是最快捷的设置方式。<\/li>\n<li class=\"s\">可导航到技能目录，也可从任意位置运行。<\/li>\n<\/ul>\n<h4>二、技能无法触发——几乎总是描述问题<\/h4>\n<h5>2.1 语义匹配不足<\/h5>\n<ul>\n<li>Claude 使用语义匹配，请求需与描述的含义有重叠；重叠不足就不匹配。<\/li>\n<li class=\"s\">修复：用各种变体测试，例如&quot;帮我分析一下这个性能&quot;&quot;为什么这个这么慢？&quot;&quot;让这个更快一点&quot;。<\/li>\n<li class=\"s\">任何变体未触发，就把这些关键词加进描述。<\/li>\n<\/ul>\n<h5>2.2 技能压根没出现（结构性问题）<\/h5>\n<ul>\n<li>若问 Claude&quot;有哪些可用技能&quot;时技能没出现，检查三条结构要求：<\/li>\n<li class=\"s\"><code>SKILL.md<\/code> 必须位于一个命名目录内，而不是在技能根目录下。<\/li>\n<li class=\"s\">文件名必须恰好为 <code>SKILL.md<\/code>——&quot;SKILL&quot;全部大写，&quot;md&quot;小写。<\/li>\n<li class=\"s\">运行 <code>claude --debug<\/code> 查看加载错误，留意提及技能名称的消息；有时仅此就能指向问题。<\/li>\n<\/ul>\n<h4>三、用错技能 / 冲突——描述区分度不足<\/h4>\n<h5>3.1 描述过于相似<\/h5>\n<ul>\n<li>让描述更具区分度；尽可能具体既帮助 Claude 决定何时使用，也能防止与其他听起来相似的技能冲突。<\/li>\n<\/ul>\n<h5>3.2 个人技能被遮蔽<\/h5>\n<ul>\n<li>原因：存在同名的企业级或更高优先级技能。<\/li>\n<li class=\"s\">优先级层级：企业级高于个人、项目和插件（旁边对应 <code>managed-settings.json<\/code> 文件名）。<\/li>\n<li class=\"s\">例子：存在企业级&quot;code-review&quot;技能时，个人的同名技能&quot;每次都会胜出&quot;的是企业级那个。<\/li>\n<li class=\"s\">处理：把技能重命名为更具区分度的名称（&quot;通常是更简单的方法&quot;）。<\/li>\n<\/ul>\n<h4>四、插件技能缺失与运行时失败<\/h4>\n<h5>4.1 装了插件却看不到其技能<\/h5>\n<ul>\n<li>清除缓存、重启 Claude Code、重新安装。<\/li>\n<li class=\"s\">若仍未出现，可能是插件结构有问题——正是验证器工具真正发挥作用的时候。<\/li>\n<\/ul>\n<h5>4.2 技能已加载但执行中失败<\/h5>\n<ul>\n<li>缺失依赖项：技能用的外部软件包必须已安装；在技能描述中添加依赖信息，让 Claude 知道需要什么。<\/li>\n<li>权限问题：脚本需要执行权限，对技能引用的任何脚本运行 <code>chmod +x<\/code>。<\/li>\n<li>路径分隔符：所有地方都用正斜杠，即使在 Windows 上也是如此。<\/li>\n<\/ul>\n<h4>五、速查表（作者的收束）<\/h4>\n<ul>\n<li>无法触发 → 改进描述并添加触发短语。<\/li>\n<li>无法加载 → 检查路径、文件名和 YAML 语法。<\/li>\n<li>用错技能 → 让描述之间更具区分度。<\/li>\n<li>被遮蔽 → 检查优先级层级，必要时重命名。<\/li>\n<li>插件技能缺失 → 清除缓存并重新安装。<\/li>\n<li>运行时失败 → 检查依赖项、权限和路径。<\/li>\n<\/ul>\n<h3>作者边界、反例与不确定性<\/h3>\n<ul>\n<li>归因用词留有余地：&quot;问题通常属于&quot;&quot;原因几乎总是出在描述上&quot;——非绝对断言。<\/li>\n<li>&quot;被遮蔽&quot;的反例是明确给出的：企业级同名技能会稳定压过个人技能，此时首选重命名而非对抗优先级。<\/li>\n<li>冲突与触发两类问题同源于&quot;描述过于相似&quot;，作者未给出量化区分标准，只给方向（更具区分度、更具体）。<\/li>\n<li>文末提出两个开放问题（遇到哪些故障、如何建立团队验证流程）未作解答，属引导性提问而非结论。<\/li>\n<\/ul>","conceptCards":[{"name":"四类故障分类框架","quotes":["当技能无法正常工作时，问题通常属于以下几类之一：技能无法触发、无法加载、存在冲突，或在运行时失败。好消息是，大多数修复方法都相当直接。"],"feynman":"作者先把&quot;技能不工作&quot;这个模糊、让人无从下手的问题，拆成四个可命名的类别——无法触发、无法加载、存在冲突、运行时失败。每一类都有各自独立的成因和修复路径。它是全文的骨架：先归类，再对症，避免在错误的方向上盲目试错。","nodeId":"cm_058c8106"},{"name":"技能验证器（agent skills verifier）","quotes":["首先应该尝试的是 agent skills verifier 命令。安装步骤因操作系统而异，但使用 uv 是最快捷的设置方式。","验证器会在您花时间调试其他问题之前，先捕获结构性问题。"],"feynman":"一个命令行工具，安装后用 uv 最快，可在技能目录或任意位置运行。它的定位是排查流程的起点——在调用更耗时的调试之前，先把结构性、配置性错误挡在前面。所以凡是怀疑&quot;结构有问题&quot;的地方（包括插件），都会被指向它。","nodeId":"cm_2cbdf384"},{"name":"语义匹配（semantic matching）与触发短语","quotes":["Claude 使用语义匹配，因此您的请求需要与描述的含义有所重叠。如果重叠不足，就不会匹配。","如果任何变体未能触发，请将这些关键词添加到您的描述中"],"feynman":"Claude 决定是否使用某个技能，靠的不是关键词精确命中，而是你的请求与技能描述在&quot;含义&quot;上的重叠。重叠不足就不触发。由此推出修复方法：用你实际会说的各种说法去测试（&quot;帮我分析一下这个性能&quot;&quot;为什么这个这么慢？&quot;等），把没触发的措辞作为触发短语补进描述里。这是&quot;技能无法触发&quot;几乎总是描述问题的原因。","nodeId":"cm_b0946442"},{"name":"SKILL.md 结构性要求","quotes":["SKILL.md 文件必须位于一个命名目录内，而不是在技能根目录下","文件名必须恰好为 SKILL.md——\"SKILL\"全部大写，\"md\"小写"],"feynman":"技能能否被加载，取决于两个硬性结构条件——文件必须放在一个命名目录里（不能直接摊在技能根目录），文件名必须大小写精确地写成 <code>SKILL.md<\/code>。这些是绝对规则，不满足就加载不上，和描述写得好不好无关。","nodeId":"cm_df8ed356"},{"name":"claude --debug","quotes":["运行 claude --debug 查看加载错误。留意提及您技能名称的消息。有时仅凭这一点就能直接指向问题所在。"],"feynman":"一条用于查看加载错误的诊断命令。用法是运行后留意输出里提到你技能名称的消息——很多时候仅凭这一行提示就能直接定位问题，是&quot;无法加载&quot;场景的专用观察窗口。","nodeId":"cm_c2266b88"},{"name":"描述区分度","quotes":["如果 Claude 使用了错误的技能，或者在多个技能之间似乎感到困惑，那么您的描述很可能过于相似。让它们更具区分度。尽可能具体不仅有助于 Claude 决定何时使用您的技能——还能防止与其他听起来相似的技能发生冲突。"],"feynman":"当 Claude 选错技能或在多个技能间犯迷糊，根因往往是这些技能的描述彼此太像。让描述更具体、彼此有区分度，一举两得：既帮 Claude 判断何时该用哪个技能，又避免与听起来相似的技能冲突。","nodeId":"cm_bc68c1e9"},{"name":"技能优先级层级结构","quotes":["如果您的个人技能被忽略，可能是因为存在一个同名的企业级或更高优先级的技能。","例如，如果存在一个企业级的\"code-review\"技能，而您也有一个个人的\"code-review\"技能，企业级的那个每次都会胜出。"],"feynman":"技能按来源分层，企业级高于个人、项目和插件。当同名技能撞车时，高优先级的那个每次都赢，于是你的个人技能会被&quot;遮蔽&quot;而看似失效。对应的选择通常是给技能改成更具区分度的名字（作者认为这通常更简单）。","nodeId":"cm_43781275"},{"name":"运行时失败的三类原因","quotes":["缺失依赖项：如果您的技能使用了外部软件包，这些软件包必须已安装。在您的技能描述中添加依赖信息，以便 Claude 知道需要什么。","权限问题：脚本需要执行权限。对您的技能所引用的任何脚本运行 chmod +x。","路径分隔符：在所有地方都使用正斜杠，即使在 Windows 上也是如此。"],"feynman":"技能能加载、却在执行过程中失败时，主要查三件事：外部软件包是否已安装（并把依赖信息写进描述，让 Claude 知道需要什么）；脚本是否有执行权限（对引用的脚本 <code>chmod +x<\/code>）；路径是否统一用正斜杠（即使在 Windows 上也不用反斜杠）。这三条划定了&quot;运行时失败&quot;的排查边界。","nodeId":"cm_db455b2f"},{"name":"插件技能缺失","quotes":["安装了插件但看不到其技能？清除缓存，重启 Claude Code，然后重新安装。","如果之后技能仍未出现，可能是插件结构有问题。这正是验证器工具真正发挥作用的时候。"],"feynman":"插件装了却看不到它的技能，是一条独立的排查支线，修复有固定顺序——先清缓存、重启 Claude Code、再重新安装；如果仍不出现，就判断为插件结构问题，此时交给验证器工具处理。\n\n## 二、概念架构图\n\n``<code>mermaid\ngraph TD\n    subgraph L1[手段层：先行的诊断工具]\n        V[技能验证器&lt;br/&gt;agent skills verifier]\n        D[claude --debug]\n    end\n\n    subgraph L2[框架层：故障分类]\n        F[四类故障]\n    end\n\n    subgraph L3[机制层：各类故障的成因与修复]\n        M1[语义匹配 → 触发短语]\n        M2[SKILL.md 结构性要求]\n        M3[描述区分度]\n        M4[技能优先级层级结构]\n        M5[运行时失败三类原因]\n        M6[插件技能缺失]\n    end\n\n    V --&gt;|先捕获结构性问题| F\n    F --&gt;|分解为&quot;无法触发&quot;| M1\n    F --&gt;|分解为&quot;无法加载&quot;| M2\n    F --&gt;|分解为&quot;使用了错误的技能&quot;| M3\n    F --&gt;|分解为&quot;个人技能被遮蔽&quot;| M4\n    F --&gt;|分解为&quot;运行时失败&quot;| M5\n    F --&gt;|分解为&quot;插件技能缺失&quot;| M6\n    D --&gt;|诊断加载错误| M2\n    V --&gt;|排查插件结构| M6\n<\/code>``","nodeId":"cm_3ff5d50f"}],"feynman":{"short":"技能不工作时先分类：不触发、不加载、用错、运行时失败，动手前先跑验证器挡结构性问题。Claude 靠语义匹配挑技能——你的说法和描述含义不重叠就不用它，所以不触发多半是描述缺触发短语；加载则死守两条硬规则：放在命名目录里，文件名恰好 SKILL.md。运行时查依赖、执行权限、正斜杠。注意：个人技能撞上同名企业级技能，改描述没用，只能重命名。","long":"<p>这篇文章在说：Claude 的技能不按预期工作时，该怎么系统排查。答案是把故障分成四类——不触发、不加载、用错技能、运行时报错，先跑验证器抓结构问题，再按类修。<\/p>\n<p>核心机制是，Claude 不是按文件名硬找技能，而是拿你的请求和技能描述做“语义匹配”，意思有重叠才会用；所以不触发通常要补触发短语，用错则常因几个描述太像。加载要求文件放在命名目录里、名字恰好叫 SKILL.md；运行时还要依赖已安装、脚本有执行权限、路径用正斜杠。术语拆掉：验证器就是自动检查文件结构的小工具；语义匹配就是看意思像不像。<\/p>\n<p>这像公司里找同事办事：门牌写清楚、擅长事项写具体，别人才能找对人；若两个部门都叫“审核”，就很容易走错门。<\/p>\n<p>作者也点明一个边界：若你的个人技能和企业级技能同名，企业级每次胜出，你通常只能重命名，而不能让个人版优先。<\/p>","rubric":[{"concept":"四类故障分类框架","points":["能说出技能失效有几个可预测的类别及其大致名称，而不是只举单一故障例子。","能把一个具体故障现象归入某一类，并说出该类对应的第一个修复方向。","提到修复之前先用工具排除结构性问题这一前置步骤。"]},{"concept":"语义匹配与触发短语","points":["说明决定是否使用技能的依据是请求与描述在含义上的重叠，而非字面命中或文件名。","由该机制推出不触发时的动作：用多种说法实测，把落空的说法补进描述。","把“不触发”的根因落在描述上，并与文件结构类问题区分开。"]},{"concept":"SKILL.md 结构性要求","points":["指出技能文件必须处在一个命名目录内，而不是直接摊在技能根目录。","指出文件名的大小写必须精确，不能写成其他大小写形式。","知道“技能不出现/不加载”与“技能不触发”是两类不同问题，并知道有查看加载错误的诊断手段可用。"]}]},"oneLine":"技能失效可归入几类可预测的故障，每类都有直接对应的修复方法。"}]}};

/* ── 常量 ───────────────────────────────────────────── */

/* ── 验收方式分类 ─────────────────────────────────────────────
   不问「这讲的是什么」（那是主题，任何模型都能吐），问
   「**这个概念该要求学习者做到什么，才算学会了**」。
   它决定的不只是分列，而是**系统对你做什么**：
     compute 能算的 → 复述机制
     judge   能判的 → 说出你自己的判据与代价
     use     能用的 → 给一个你真用过的例子
     accept  只能认的 → **不设验收**。世界观没有机制可复述，硬考就是假学习。
   这正是原版的真 bug：194 个概念用了同一个验收标准，把世界观也拉来考。 */
const KIND = {
  compute: { name: '能算的', color: '#5B8FF9',
    ask: '遮住上面那句，用自己的话说清它的机制。',
    rule: '判定口径：说清核心机制、不违反事实 → pass；漏机制、说错、照抄原文 → fail。' },
  judge:   { name: '能判的', color: '#F6BD16',
    ask: '遮住上面那句：它给的是什么判据？换成你的处境你会怎么用？代价是什么？',
    rule: '判定口径：必须写出**你自己的判据和你愿意付的代价**。只复述原文 → fail；'
        + '说「看情况」但不给出判据 → fail；没提代价 → fail。' },
  use:     { name: '能用的', color: '#61DDAA',
    ask: '遮住上面那句：它是什么？给一个你**真拿它做过**的具体例子（做了什么、结果如何）。',
    rule: '判定口径：说清它是什么 + 给了一个具体、可核对的用例 → pass；'
        + '只有定义没有用例 → fail；用例含糊或明显是编的 → fail。' },
  accept:  { name: '只能认的', color: '#9661BC', ask: null,
