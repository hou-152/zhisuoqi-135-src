。","level":0,"ci":2,"tags":["loop-autonomy"],"k":"compute","kwhy":"能算出 0.99 的 10 次方约为 90.4% 并解释衰减","nameEn":"compounding errors","centrality":0.072,"stage":"now","feynman":"单步「几乎不出错」在多步流程里是一句安慰话。可靠性像利息，只是复的是负利。","evidence":["能算出 0.99 的 10 次方约为 90.4% 并解释衰减","能按瞬时、可恢复、用户可修、意外四类分诊错误"],"ap":"10 步每步 99% 成功率，{{name}}下端到端还剩多少？","origin":["harness"],"mentionCount":1},{"id":"cm_edc164c5","name":"代理原生","src":"context","type":"CONCEPTUAL","gloss":"不给旧产品外挂 chatbot，而是把产品从底层做成供 agent 使用、并为其提供上下文与集成的形态。","level":1,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能说明 agent 能否自己读文档、自建集成是判别标准","nameEn":"agent-native","centrality":0.072,"stage":"when-needed","feynman":"普通软件是给人用的，界面、按钮、说明都围着人转。agent-native 软件是给 AI 用的——它默认读者是一个 agent，于是把“该带什么上下文、能调哪些能力、怎么完成任务”都摆好。就像同一栋楼，一种是为行人设计的商场，另一种是为无人车设计的仓库：后者的通道、标识、货架都按机器的读取方式重排过。","evidence":["能说明 agent 能否自己读文档、自建集成是判别标准","能举出 coding agent 因此主动接入的例子"],"ap":"一个产品要算{{name}}，最低要满足什么条件？","origin":["context"],"mentionCount":1},{"id":"cm_91279ade","name":"带文档追问","src":"context","type":"REPRESENTATIONAL","gloss":"保留 Grill Me 追问开头的 skill，新增读取、挑战并更新领域文档的能力。","level":2,"ci":1,"tags":["spec-intent"],"k":"use","kwhy":"能说出该 skill 相对原 Grill Me 增补了哪三步能力","nameEn":"Grill with Docs","centrality":0.072,"stage":"when-needed","feynman":"它把“问清楚”升级成“问清楚并写进项目语言”，让下一次 AI 不必从零开始问。","evidence":["能说出该 skill 相对原 Grill Me 增补了哪三步能力","能在一次真实追问中读取并回写领域文档"],"ap":"能否用 {{name}} 对领域文档追问并回写更新？","origin":["context"],"mentionCount":1},{"id":"cm_b8ef30e6","name":"递归并行规划","src":"harness","type":"CONCEPTUAL","gloss":"planner 可为特定区域生成子 planner，使规划本身变得并行且递归。","level":2,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能复述「planning itself parallel and recursive」这一机制","nameEn":"sub-planner","centrality":0.072,"stage":"now","feynman":"规划本身也会堵。所以让规划者按领域再派规划者，规划这件事也并行起来——否则执行端扩容再多，也会被上游那一个大脑限速。","evidence":["能复述「planning itself parallel and recursive」这一机制","能说出它与单层规划在扇出上的差别"],"ap":"{{name}} 能解释规划为何可以并行且递归吗？","origin":["harness"],"mentionCount":1},{"id":"cm_aed663a2","name":"递归结构不能替代基座智能","src":"harness","type":"CONCEPTUAL","gloss":"同一套递归改进在强基座上持续上升、在弱模型上反而退化；harness 只放大部署，智能仍是核心。","level":1,"ci":2,"tags":["model-training"],"k":"judge","kwhy":"能对比 GPT-4 与 GPT-3.5、Mixtral 上的不同结果","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"给一个学不明白的人一套「自我提升方法论」，他只会把自己越改越糟。会自我改进的前提，是你已经看得懂自己哪儿不行。","evidence":["能对比 GPT-4 与 GPT-3.5、Mixtral 上的不同结果","能引用 DGM 固定模型下 harness 进化作为同一分工的印证"],"ap":"{{name}} 能说明递归结构为何替代不了基座智能吗？","origin":["harness"],"mentionCount":1},{"id":"cm_e549dff0","name":"第三方连接器 opt-in","src":"context","type":"PROCEDURAL","gloss":"第三方 MCP 工具即便已连上也要经选择器由用户 opt-in；不得替用户挑服务商，紧急也不例外。","level":1,"ci":1,"tags":["tools-sandbox"],"k":"use","kwhy":"能说出紧急 20 分钟内用车仍走选择器这一反例","nameEn":"","centrality":0.072,"stage":"now","feynman":"当 agent 能直接下单时，\"替你决定用哪家\"就等于替你花钱和交数据。所以在便利和选择权之间，这份规范把默认值放在选择权一侧，并明确拒绝用紧急当理由——因为紧急正是最容易被用来绕过同意的借口。","evidence":["能说出紧急 20 分钟内用车仍走选择器这一反例","能说明电商场景永不主动建议"],"ap":"{{name}} 能在调用第三方工具时坚持 opt-in 且不代选吗？","origin":["context"],"mentionCount":1},{"id":"cm_4fe5238f","name":"典型示例策展","src":"context","type":"PROCEDURAL","gloss":"few-shot 时策展一组多样、典型的示例来刻画期望行为，而非把边缘 case 堆进 prompt 穷举规则。","level":1,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能说出示例对 LLM 相当于「胜过千言万语」的图片","nameEn":"diverse, canonical examples","centrality":0.072,"stage":"now","feynman":"教人做事，与其列一百条例外条款，不如给三个做得漂亮的样板。样板传递的是判断风格，条款传递的只是死记的规则——而且条款越多，人越容易在真遇到新情况时不知所措。","evidence":["能说出示例对 LLM 相当于「胜过千言万语」的图片","能为一类任务选出多样且典型的示例集合"],"ap":"{{name}} 能为一个任务策展出多样的典型示例吗？","origin":["context"],"mentionCount":1},{"id":"cm_4fa039db","name":"动态系统","src":"harness","type":"CONCEPTUAL","gloss":"区别于静态 Prompt/Context 优化，指持续吸收多源信号并据反馈快速迭代的 Harness 系统。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能对比静态 prompt 优化与动态系统的差别","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"静态系统像一份写好的说明书；动态系统像一个不断学习的工厂。它不是一次性把答案做完，而是持续根据外部反馈改进生产方式。","evidence":["能对比静态 prompt 优化与动态系统的差别","能指出系统吸收的是 marketing/product/infrastructure 等信号"],"ap":"{{name}} 与一次性 prompt 优化的边界在哪？","origin":["harness"],"mentionCount":1},{"id":"cm_ffd117a0","name":"端到端验证","src":"harness","type":"PROCEDURAL","gloss":"只有跑通完整流程才算真正验证，落为 e2e pipeline 与 smoke runs，补充单元式局部验证。","level":1,"ci":2,"tags":["verification-eval"],"k":"compute","kwhy":"能跑出 e2e pipeline 并观察到整体结果","nameEn":"","centrality":0.072,"stage":"now","feynman":"零件逐个通电正常，不等于装起来的机器能开动。真正的验收是把整台机器打开走一遍全流程，看它有没有从头到尾跑到底。","evidence":["能跑出 e2e pipeline 并观察到整体结果","能在局部全绿时指出整体仍跑不起来"],"ap":"你能为 {{name}} 跑通整条流程而不只看单测吗？","origin":["harness"],"mentionCount":1},{"id":"cm_29215fd7","name":"对话加确定性缝合","src":"harness","type":"CONCEPTUAL","gloss":"任何 AI app 归根结底是与 LLM 对话，再把结构化结果抠出，用确定性代码缝合。","level":1,"ci":2,"tags":["harness-runtime"],"k":"use","kwhy":"能把工具调用解释为对话的一种形式","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"一个 AI 应用 = 会说话但不可靠的大脑 + 一堆一定能跑对的普通代码。大脑负责出主意，普通代码负责把主意接住、校验、执行。产品差距往往出在后半截。","evidence":["能把工具调用解释为对话的一种形式","能设计出「对话产结构化结果 + 确定代码缝合」的流程"],"ap":"{{name}} 里哪些环节交给模型、哪些交给代码？","origin":["harness"],"mentionCount":1},{"id":"cm_50015d52","name":"对话上下文定向","src":"notion","type":"CONCEPTUAL","gloss":"定向信号是当前对话本身的主题，原文未证实是否也纳入历史对话。","level":0,"ci":0,"tags":["economy-business"],"k":"judge","kwhy":"能举同一账号在六个不同主题对话收到六种广告的例子","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能举同一账号在六个不同主题对话收到六种广告的例子","能说明主动表达的对话内容比行为定向信号更密更精准"],"ap":"这条广告的 {{name}} 信号从哪里来？","origin":["notion"],"mentionCount":1},{"id":"cm_6b94283f","name":"多文档问答受控实验","src":"context","type":"PROCEDURAL","gloss":"给一个问题加 k 篇文档，恰一篇含答案其余为干扰项，只操纵文档数量与答案位置。","level":1,"ci":1,"tags":["verification-eval"],"k":"use","kwhy":"能设计出只变文档数量与答案位置的对照实验","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"一个只改一个变量的实验。同样的题、同样的资料，只挪动正确答案的位置，看分数怎么变——变了，就说明位置本身在起作用。","evidence":["能设计出只变文档数量与答案位置的对照实验","能说明该设计刻意对应商用检索增强生成的实际形态"],"ap":"你能用 {{name}} 分离文档数量与位置的影响吗？","origin":["context"],"mentionCount":1},{"id":"cm_5e360f2f","name":"反脆弱","src":"harness","type":"CONCEPTUAL","gloss":"系统设计原则：规模越大失败越必然，须让单个 Agent 失败不拖垮整体，其余可恢复或换路。","level":1,"ci":2,"tags":["harness-runtime"],"k":"use","kwhy":"能指出系统中单点失败会连带什么","nameEn":"","centrality":0.072,"stage":"now","feynman":"规模本身就是故障源。一百个 agent 里总有几个会跑偏、卡死或胡说八道。系统的正确目标不是让每个 agent 都不出错，而是让任何一个出错都不要紧。","evidence":["能指出系统中单点失败会连带什么","能设计一处隔离失败并重试的机制"],"ap":"你的架构哪一处体现了{{name}}？","origin":["harness"],"mentionCount":1},{"id":"cm_2d0b9637","name":"反思性提示","src":"notion","type":"PROCEDURAL","gloss":"在提示中插入人类设计的反思步骤，让模型先确认指代与真实意图再动手，而非急着完成。","level":1,"ci":0,"tags":["context-engineering"],"k":"use","kwhy":"能写出一条先复述目标再作答的提示","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能写出一条先复述目标再作答的提示","能说明加反思前后指代解析的变化"],"ap":"遇到指代模糊时，你会怎么加{{name}}？","origin":["notion"],"mentionCount":1},{"id":"cm_83155f74","name":"反自我合理化条款","src":"context","type":"CONCEPTUAL","gloss":"安全元规则：若模型在心里把请求重新框定得更得体，该重新框定本身就是应当拒绝的信号。","level":1,"ci":1,"tags":["safety-governance"],"k":"judge","kwhy":"能识别一次自我合理化的重新框定","nameEn":"","centrality":0.072,"stage":"now","feynman":"这类条款不管内容，管的是一个心理动作。它假定执行者最大的风险不是不知道规则，而是太擅长给自己找理由——所以提前把\"找理由\"这个动作本身标成红灯。","evidence":["能识别一次自我合理化的重新框定","能说明为何声明用途不改变判定"],"ap":"你怎么判断一次「换个说法」是否触发{{name}}？","origin":["context"],"mentionCount":1},{"id":"cm_224f14d4","name":"范围控制与显式的完成定义","src":"harness","type":"PROCEDURAL","gloss":"约束 Agent 一次只做一个功能，不多不少、不偷改需求清单掩盖未完成，并给出显式完成定义。","level":0,"ci":2,"tags":["loop-autonomy"],"k":"use","kwhy":"能写出含显式完成定义的任务范围","nameEn":"","centrality":0.072,"stage":"now","feynman":"给人一张待办清单和一个明确的验收标准，比说「你看着办」更容易得到你想要的东西。尤其要防的是两头跑偏：顺手把别处也改了，或者悄悄把标准调低说自己达标了。","evidence":["能写出含显式完成定义的任务范围","能指认一次隐性扩范围的行为"],"ap":"你如何为一次 agent 任务写出{{name}}？","origin":["harness"],"mentionCount":1},{"id":"cm_f6006789","name":"方向漂移 / Direction Drift","src":"harness","type":"CONCEPTUAL","gloss":"上下文渐满导致一致性衰减：偏离目标、遗忘早期约束、在细节里越走越深。","level":1,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能指出长会话中漂移出现的迹象","nameEn":"","centrality":0.072,"stage":"now","feynman":"Agent 版的「煮青蛙」——不是突然崩溃，而是在长时间运行中缓慢偏离初始目标。上下文窗口满了之后，早期的约束和方向被新信息淹没，agent 在细节里越走越深却浑然不觉。","evidence":["能指出长会话中漂移出现的迹象","能提出重述约束或压缩上下文的对策"],"ap":"长任务里你怎么发现并遏制{{name}}？","origin":["harness"],"mentionCount":1},{"id":"cm_1d86964c","name":"复述（recitation）与 lost-in-the-middle","src":"context","type":"CONCEPTUAL","gloss":"长循环中模型注意力偏向首尾；不断重写 todo 等于把目标复述到上下文末尾，避开中段被忽略。","level":1,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能说出中段信息最易被忽略这一机制","nameEn":"","centrality":0.072,"stage":"now","feynman":"开长会容易忘了议题，所以每隔一会儿就把议题重念一遍。念的不是给别人听，是给自己听。","evidence":["能说出中段信息最易被忽略这一机制","能解释重写 todo.md 相当于把全局计划推到最近注意力跨度"],"ap":"你能用 {{name}} 解释反复重写 todo.md 为什么有效吗？","origin":["context"],"mentionCount":1},{"id":"cm_d4fab5a8","name":"干扰文档","src":"context","type":"CONCEPTUAL","gloss":"评测中插入的 k−1 篇不含答案但与查询高度相关的维基片段，按相关性递减排列，用来测长上下文的抗干扰。","level":0,"ci":1,"tags":["verification-eval"],"k":"judge","kwhy":"能构造按相关性递减排列的干扰文档集","nameEn":"distractor documents","centrality":0.072,"stage":"when-needed","feynman":"故意混进去的\"看起来很像但没有答案\"的材料。它模拟的是真实检索回来的结果——大部分沾边，只有一篇真的有用。","evidence":["能构造按相关性递减排列的干扰文档集","能说明随机干扰与随机排序两种变体的差别"],"ap":"你能否说明 {{name}} 在你的评测集里是怎么生成的？","origin":["context"],"mentionCount":1},{"id":"cm_ee2878f3","name":"干扰项的非均匀影响","src":"context","type":"CONCEPTUAL","gloss":"一个干扰项就足以把成绩压到基线以下，四个进一步叠加；各干扰项影响不等价，且随输入变长而放大。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能复述「只有 needle／加1个／加4个」三条件对照的结论","nameEn":"","centrality":0.072,"stage":"deep-dive","feynman":"干扰不是可以按个数折算的量。某一条特别有欺骗性的假答案，杀伤力可能超过其余三条之和。这意味着做 RAG 或 context 组装时，「召回了几条不相干的」是个很粗的指标；真正该问的是「有没有召回那条最像的假货」。","evidence":["能复述「只有 needle／加1个／加4个」三条件对照的结论","能指出特定位置干扰项（如第3个）造成更大下滑"],"ap":"你能用 {{name}} 解释为什么多加一个相关干扰就会掉分吗？","origin":["context"],"mentionCount":1},{"id":"cm_00851466","name":"干扰项与无关内容之分","src":"context","type":"LANGUAGE","gloss":"术语约定：干扰项与 needle 主题相关但不回答问题；无关内容则与 needle 和问题都无关，两者不可混谈。","level":1,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能准确区分干扰项与无关内容两类材料","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"无关内容是背景噪音，干扰项是长得像正主的赝品。噪音大不了让你听不清，赝品会让你拿错东西。真实语料里最难缠的从来不是不相干的内容，而是「差一点就对」的内容。","evidence":["能准确区分干扰项与无关内容两类材料","能说明这一区分是干扰实验成立的前提"],"ap":"你能用 {{name}} 判断这段材料该归为哪一类吗？","origin":["context"],"mentionCount":1},{"id":"cm_d7cd90db","name":"格式即上下文","src":"context","type":"CONCEPTUAL","gloss":"信息的呈现方式本身构成上下文：简洁摘要优于原始数据倾倒，清晰工具 schema 优于含糊指令。","level":1,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能举出把原始数据换成摘要后表现改善的例子","nameEn":"where the format matters","centrality":0.072,"stage":"now","feynman":"同样的信息，摆放方式不同，效果差很远。给人一份两行的摘要，比甩过去一整个数据库导出更管用；工具说明写清参数，比嘴上交代一句强。","evidence":["能举出把原始数据换成摘要后表现改善的例子","能说明 Structured Output 属于格式层面的上下文"],"ap":"你能用 {{name}} 说明这段输出为什么该改写成摘要？","origin":["context"],"mentionCount":1},{"id":"cm_f0c99ed4","name":"工具—工作流适配","src":"context","type":"CONCEPTUAL","gloss":"grep、glob、view 本身更易维护，但简单替换会抬高 review 成本、减少有效评论；只有为 reviewer 重写工作流才转为收益。","level":0,"ci":1,"tags":["code-engineering"],"k":"judge","kwhy":"能举出工具替换后 review 成本上升、有效评论减少的现象","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"好工具不会自动带来好结果。锤子很锋利，也要知道当前是在钉钉子还是拆墙；任务姿势不匹配，能力越强可能浪费越多。","evidence":["能举出工具替换后 review 成本上升、有效评论减少的现象","能说明必须同步改造 reviewer 工作流才产生收益"],"ap":"你能判断这次 {{name}} 是完成了，还是只换了工具？","origin":["context"],"mentionCount":1},{"id":"cm_59a6d9c5","name":"工具调用批处理","src":"context","type":"PROCEDURAL","gloss":"独立的廉价 discovery 先批量执行，聚焦读取也批量执行，避免一搜一读交替造成上下文扩散与节奏开销。","level":2,"ci":1,"tags":["harness-runtime"],"k":"use","kwhy":"能把若干独立检索合并为一次批调用","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"把同类问题一次问完，再一起看答案。这样比每得到一个答案就临时改变方向更稳定。","evidence":["能把若干独立检索合并为一次批调用","能说明交替调用带来的额外上下文与节奏成本"],"ap":"你能把这几步改写成 {{name}} 的形式吗？","origin":["context"],"mentionCount":1},{"id":"cm_1531fbe3","name":"工具即契约","src":"context","type":"CONCEPTUAL","gloss":"工具是 Agent 与其信息/行动空间之间的契约，须返回 token 高效的信息，并像良好代码库函数那样自包含、健壮、用途清晰。","level":1,"ci":1,"tags":["tools-sandbox"],"k":"judge","kwhy":"能按自包含、对错误健壮、用途清晰三条评审一个工具定义","nameEn":"tools as the contract","centrality":0.072,"stage":"now","feynman":"工具不只是能力，更是一份说明书，规定了 agent 能碰什么、怎么碰、碰完拿回什么。说明书写歪了，能力再强也用不对地方；而且工具吐回 ":["harness-runtime"],"k":"judge","kwhy":"能指出 Copilot CLI 的代码探索工具被 cloud agent 等产品复用","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"harness 是多个 agent 共用的工具底盘。底盘可以统一维护，但不同车辆仍需要不同驾驶规则。","evidence":["能指出 Copilot CLI 的代码探索工具被 cloud agent 等产品复用","能说出统一实现的收益是减少重复、工具改进自动扩散"],"ap":"{{name}} 的收益是什么，能举哪个例子？","origin":["context"],"mentionCount":1},{"id":"cm_b3524e24","name":"共享上下文窗口","src":"neican","type":"CONCEPTUAL","gloss":"技能与对话共享同一上下文窗口，技能激活时整份 SKILL.md 被载入上下文","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能指出 SKILL.md 会占用当前会话上下文","nameEn":"","centrality":0.072,"stage":"now","feynman":"技能不在真空中生效——它和当前对话抢同一个上下文窗口，一旦激活，整份 SKILL.md 就被加载进来。理解这一点才能理解后面两个做法为什么存在：正因为 SKILL.md 会占上下文，才需要限制它的行数、才需要把细节挪到别处、才需要脚本只交输出。","evidence":["能指出 SKILL.md 会占用当前会话上下文","能据此说明为何要限制行数、把细节外移"],"ap":"技能激活后，{{name}}里多出了什么？","origin":["neican"],"mentionCount":1},{"id":"cm_8ad267da","name":"规划模式与边界问题清单","src":"harness","type":"PROCEDURAL","gloss":"在 /plan 模式下让模型提前问出实现时迟早要回答的边界问题，如起止日期能否相同。","level":1,"ci":2,"tags":["spec-intent"],"k":"use","kwhy":"能列出日期选择器的若干边界问题（部分选择、清空、格式等）","nameEn":"","centrality":0.072,"stage":"now","feynman":"规划不是写文档，是提前触发争吵。所有你没吵完的分歧，都会在实现阶段以返工的形式收利息。","evidence":["能列出日期选择器的若干边界问题（部分选择、清空、格式等）","能说明为何不新开会话而直接切 /plan"],"ap":"用 {{name}} 时，模型会替你问出哪些边界问题？","origin":["harness"],"mentionCount":1},{"id":"cm_19d82c87","name":"过度约束与松绑","src":"context","type":"CONCEPTUAL","gloss":"在系统提示词、CLAUDE.md 与 skills 里过度约束模型，松绑后提示可大幅精简。","level":1,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能说出 Claude Code 系统提示词删掉 80% 以上、编码评测无可测量损失","nameEn":"over-constraining / unhobbling","centrality":0.072,"stage":"when-needed","feynman":"给新手司机装的限速器、防撞杆，等他成了老司机还不拆，反而妨碍他正常开车。unhobbling 就是\"拆掉已经不需要的辅助装置\"。","evidence":["能说出 Claude Code 系统提示词删掉 80% 以上、编码评测无可测量损失","能指出过度约束出现在哪三类载体"],"ap":"{{name}} 的松绑带来了什么可测量结果？","origin":["context"],"mentionCount":1},{"id":"cm_66ea7313","name":"宏动作","src":"notion","type":"CONCEPTUAL","gloss":"编程的最小单位从敲代码行变成委派一整块工作，如实现功能、重构子系统、写测试。 ","能据此估算一次请求的实际成本"],"ap":"能否算出 {{name}} 相对普通输入省多少钱？","origin":["context"],"mentionCount":1},{"id":"cm_cb785e57","name":"缓存写入成本","src":"context","type":"CONCEPTUAL","gloss":"Anthropic 定价中，5 分钟缓存写入高于基准输入价，1 小时写入更高。","level":0,"ci":1,"tags":["caching-cost"],"k":"compute","kwhy":"能说出两个缓存时长档位的相对价格高低","nameEn":"Cache Write Cost","centrality":0.072,"stage":"when-needed","feynman":"写入缓存像第一次建索引，要先多花一点钱。它的价值不在第一次请求，而在后面能不能反复复用这笔预处理成本。","evidence":["能说出两个缓存时长档位的相对价格高低","能比较一次写入与多次普通输入的成本"],"ap":"能否比较 {{name}} 与重复普通输入谁更便宜？","origin":["context"],"mentionCount":1},{"id":"cm_31908564","name":"灰盒场景","src":"notion","type":"CONCEPTUAL","gloss":"介于黑盒与白盒之间的访问方式：服务商公开模型最终 top-k 对数概率供调参，仅这层半开放已足以泄露隐私。","level":0,"ci":0,"tags":["safety-governance"],"k":"judge","kwhy":"能说明灰盒相对黑盒白盒多看到什么","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能说明灰盒相对黑盒白盒多看到什么","能举出该接口带来的隐私泄露路径"],"ap":"能否判断某接口是否构成 {{name}} 并说明泄露风险？","origin":["notion"],"mentionCount":1},{"id":"cm_4ee31e8e","name":"会话生命周期","src":"harness","type":"PROCEDURAL","gloss":"Agent 会话应走结构化生命周期：开工跑 init 与读状态，执行，收尾更新进度、记未完成项，只在可安全恢复时 commit。","level":1,"ci":2,"tags":["loop-autonomy"],"k":"use","kwhy":"能按四段式走完一次完整会话","nameEn":"","centrality":0.072,"stage":"now","feynman":"把一次 agent 会话当成一次值班交接班：上岗先看交接本和设备自检，下岗前把日志写完、把工位收拾干净，让下一班一进门就能接着干。自由发挥的问题不在于发挥，而在于没有交接。","evidence":["能按四段式走完一次完整会话","能在收尾留下干净可恢复的重启路径"],"ap":"能否按 {{name}} 走完一次会话并留下可恢复收尾？","origin":["harness"],"mentionCount":1},{"id":"cm_ed4c8f9f","name":"会自己重写的地基","src":"harness","type":"CONCEPTUAL","gloss":"模型是按厂商日程重写自身行为的概率系统，没有永久有效的锁版本，旧模型读作硬约束的句子新模型可能读作建议。","level":0,"ci":2,"tags":["model-training"],"k":"judge","kwhy":"能举出模型更新后旧提示词失效的实例","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"别人家的房子建在地面上，你的房子建在一块会自己漂移的板块上。你不是在盖楼，你是在持续地扶楼；harness 永远没有「完工」这一天。","evidence":["能举出模型更新后旧提示词失效的实例","能说明为何不存在可靠的锁版本逃生舱"],"ap":"能否说明为何 {{name}} 会让固定提示词失效？","origin":["harness"],"mentionCount":1},{"id":"cm_9de70b84","name":"混合检索策略","src":"context","type":"PROCEDURAL","gloss":"预检索与即时检索的折中：先取一部分数据保速度，再由 agent 用 glob、grep 等原语自行深入，适合内容不太动态的场景。","level":1,"ci":1,"tags":["memory-retrieval"],"k":"use","kwhy":"能说明该策略在速度与深度上如何折中","nameEn":"hybrid strategy","centrality":0.072,"stage":"when-needed","feynman":"出门前先把地图和常用电话装口袋，其余的到了现场再问。两种做法各有代价——全预备太慢太重，全现问又容易走弯路，所以真实的做法通常是先备最稳定的那部分。","evidence":["能说明该策略在速度与深度上如何折中","能判断某场景是否适合采用它"],"ap":"能否为这个代码库设计一套 {{name}}？","origin":["context"],"mentionCount":1},{"id":"cm_b7fd37c0","name":"混合注意力","src":"notion","type":"CONCEPTUAL","gloss":"将CSA层与HCA层交替排列的注意力架构，CSA管近中距精细依赖，HCA管超远距压缩记忆。","level":1,"ci":0,"tags":["model-training"],"k":"judge","kwhy":"能画出CSA与HCA交替排列的层序","nameEn":"","centrality":0.072,"stage":"deep-dive","feynman":"","evidence":["能画出CSA与HCA交替排列的层序","能说明两层各自分工：谁保细节、谁做全量模糊记忆"],"ap":"{{name}}里CSA层和HCA层各负责什么距离的依赖？","origin":["notion"],"mentionCount":1},{"id":"cm_1c61d688","name":"基础设施挑战而非 harness 设计问题","src":"harness","type":"CONCEPTUAL","gloss":"把规模化跑Agent遇到的困难归类为基础设施挑战，而非harness设计技巧问题。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能举出被归入infra而非harness设计的具体问题","nameEn":"","centrality":0.072,"stage":"now","feynman":"问题被重新归了类。原来大家以为这是「怎么写好一个程序」，其实是「怎么建好一座工厂」。","evidence":["能举出被归入infra而非harness设计的具体问题","遇到瓶颈时能先判断这是不是infra问题"],"ap":"遇到Agent规模化瓶颈时，怎么判断它是否属于{{name}}？","origin":["harness"],"mentionCount":1},{"id":"cm_eeb4d9c2","name":"基础设施问题，不是 AI 问题","src":"harness","type":"CONCEPTUAL","gloss":"可观测性、重试、并发、状态管理、审计、调度这些墙是基础设施问题，所需原语可能已存在，不必以agent之名重造。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能列出属于基础设施而非模型能力的几类问题","nameEn":"","centrality":0.072,"stage":"now","feynman":"agent 让人以为一切都是新问题，于是所有人从头造轮子。其实一大半麻烦，是软件工程二十年前就解决过的老麻烦，只是换了个场景出现。","evidence":["能列出属于基础设施而非模型能力的几类问题","能指出哪些已有原语可复用而不必重造"],"ap":"撞上{{name}}这类墙时，应该先去找什么？","origin":["harness"],"mentionCount":1},{"id":"cm_38d561bd","name":"记忆冲刷（Memory Flush）","src":"notion","type":"CONCEPTUAL","gloss":"会话压缩前先发指令让模型保存值得记住的东西，优先用户偏好、修正建议与重复模式。","level":1,"ci":0,"tags":["memory-retrieval"],"k":"accept","kwhy":"能写出 战略性技术债务的收束。平台成熟、增长继续加速，团队终于把 Python 服务重写为 Rust。两名工程师借助 Codex 和 GPT-5.5 完成整个服务重写，Rust 服务处理 95% 生产请求，并且 CPU 效率、内存效率和延迟都显著优于 Python。它验证了先前“未来编码模型会让迁移成为可能”的赌注。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TD\n  subgraph P[问题与目标层]\n    A[\"每年超过 10 倍增长\"]\n    B[\"尾部延迟\"]\n    C[\"集中式数据安全与隐私控制点\"]\n  end\n\n  subgraph S[架构选择层]\n    D[\"Habitat 在线存储平台\"]\n    E[\"从客户端库到独立服务（统一控制点）\"]\n    F[\"约束型 API 与成本不平衡\"]\n    G[\"战略性技术债务：Python 服务\"]\n  end\n\n  subgraph M[机制与边界层]\n    H[\"asyncio 调度延迟\"]\n    I[\"亚稳态故障与 LIFO/FIFO 连接重用\"]\n    J[\"连接扇入（Envoy / 雷霆之群）\"]\n    K[\"对象-边模型与分区\"]\n    L[\"Rockset 离线二级视图 / CDC\"]\n  end\n\n  subgraph R[结果层]\n    N[\"迁移到 Rust\"]\n  end\n\n  A -->|迫使| D\n  D -->|需要| E\n  E -->|集中执行| C\n  D -->|采用| F\n  F -->|支撑| G\n  G -->|引入| H\n  H -->|放大| B\n  I -->|恶化| B\n  J -->|保护下游，支撑多进程| G\n  F -->|定义| K\n  F -->|复杂查询出口| L\n  L -->|隔离读重负载| D\n  E -->|使能重写| N\n  N -->|替换| G\n```","evidence":["能说出重写由 2 名工程师借助 Codex 与 GPT-5.5 完成，Rust 服务已处理 95% 生产请求","能指出 Rust 服务在 CPU 效率、内存效率与延迟上显著优于 Python，且将停用 Python"],"ap":"{{name}} 如何兑现了先前承担技术债的赌注？","origin":["neican"],"mentionCount":1},{"id":"cm_11d409eb","name":"前置对齐","src":"harness","type":"PROCEDURAL","gloss":"把规划与架构提案提前到动手之前一起做，以减少返工、加快评审的四阶段流程源头。","level":0,"ci":2,"tags":["code-engineering"],"k":"use","kwhy":"能按顺序说出产品评审→系统架构→程序设计→垂直切片四阶段","nameEn":"front-loading alignment","centrality":0.072,"stage":"now","feynman":"与其等菜做好了再让全桌人挑刺，不如点菜前先问清楚每个人的忌口和偏好。前面多花十分钟对齐，后面能少炒好几盘要重做的菜。","evidence":["能按顺序说出产品评审→系统架构→程序设计→垂直切片四阶段","能指出某次返工本可被动手前的架构对齐挡掉"],"ap":"这次返工能不能靠{{name}}在动手前就挡掉？","origin":["harness"],"mentionCount":1},{"id":"cm_814ac817","name":"桥接推理","src":"notion","type":"CONCEPTUAL","gloss":"通过上下文在已有记忆与当前表达间建立联系，从而恢复代词或转喻所指对象的语言理解机制。","level":1,"ci":0,"tags":["context-engineering"],"k":"judge","kwhy":"能指出句中「它」「那家伙」具体回指哪个先行对象","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能指出句中「它」「那家伙」具体回指哪个先行对象","能解释缺少桥接线索时指代为何会歧义"],"ap":"给定一句含代词的对话，你能说出{{name}}如何确定所指吗？","origin":["notion"],"mentionCount":1},{"id":"cm_cc5fefd6","name":"让不可见变得可见","src":"harness","type":"CONCEPTUAL","gloss":"用检查、断言与人工介入，把静默失败、分级漂移和语义跑偏暴露出来。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能设计一条暴露「结构合规但语义跑偏」的断言","nameEn":"","centrality":0.072,"stage":"now","feynman":"既然系统不会自己报警，你就得亲手给它装警报器；而既然你的劳动别人看不见，你也得亲手给这份劳动装一块仪表盘。同一招，一次对系统，一次对人。","evidence":["能设计一条暴露「结构合规但语义跑偏」的断言","能记录自己抓到的失效模式与阻止的漂移"],"ap":"你会加什么检查让{{name}}在 harness 里真正落地？","origin":["harness"],"mentionCount":1},{"id":"cm_0684e3d0","name":"让自己对 AI 可读","src":"notion","type":"CONCEPTUAL","gloss":"把文件、邮件、日历、消息开放给 AI，使自己成为 AI 能持续读取并建模的数据库。","level":0,"ci":0,"tags":["personal-life"],"k":"judge","kwhy":"能说明开放更多个人数据为何让 AI 变得更有用","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能说明开放更多个人数据为何让 AI 变得更有用","能指出由此带来的网络安全与持续监视风险"],"ap":"{{name}}的收益与代价分别是什么？","origin":["notion"],"mentionCount":1},{"id":"cm_346dbb8c","name":"人机协作","src":"notion","type":"CONCEPTUAL","gloss":"医疗 AI 重心从性能验证转向人机协作：我们知道模型何时错，模型也知道我们何时错。","level":1,"ci":0,"tags":["clinical-medicine"],"k":"judge","kwhy":"能描述人与模型互相校准的理想协作态","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"","evidence":["能描述人与模型互相校准的理想协作态","能把研究问题从「AI 多强」改写为「同一房间怎么一起工作」"],"ap":"在真实临床环境中，{{name}}的理想状态是什么样？","origin":["notion"],"mentionCount":1},{"id":"cm_3d84afe1","name":"任务时域","src":"harness","type":"CONCEPTUAL","gloss":"一次任务可连续自主运行的时间长度，是衡量 Agent 能力与「为什么是现在」的量化指标。","level":0,"ci":2,"tags":["loop-autonomy"],"k":"accept","kwhy":"能说出 METR benchmark 上已超过十个人类小时这一数字","nameEn":"task horizon","centrality":0.072,"stage":"now","feynman":"衡量一个 AI 有多能干，不只看它答得对不对，还要看它能独立干多久而不脱轨。这个「能撑多久」正在成倍变长。","evidence":["能说出 METR benchmark 上已超过十个人类小时这一数字","能外推未来连续运行数天乃至数周的走向"],"ap":"{{name}}的指数增长对 Agent 产品设计意味着什么？","origin":["harness"],"mentionCount":1},{"id":"cm_cc92779a","name":"任务特定工具说明","src":"context","type":"PROCEDURAL","gloss":"同一工具须按产品工作边界配置 instructions，开放式 CLI 任务中聚焦说明收益更低。","level":1,"ci":1,"tags":["tools-sandbox"],"k":"use","kwhy":"能解释 code review 的聚焦说明为何在 CL {{name}}中三个角色分别负责什么？","origin":["harness"],"mentionCount":1},{"id":"cm_9b459d5c","name":"上下文隔离","src":"context","type":"PROCEDURAL","gloss":"用独立上下文窗口、专属系统提示与受限工具权限切分并委派任务，避免污染主对话。","level":1,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能沿功能或层级维度切分任务单元","nameEn":"context isolation","centrality":0.072,"stage":"when-needed","feynman":"别让所有事挤在一个脑子里。把子任务交给一个有独立记事本、只带必要工具的专职助手，做完把结论交回来，过程不脏主线。","evidence":["能沿功能或层级维度切分任务单元","能说明最小权限带来可靠性与可解释性提升"],"ap":"怎么用{{name}}绕开上下文窗口限制并减少污染？","origin":["context"],"mentionCount":1},{"id":"cm_81d0190c","name":"上下文均匀处理假设","src":"context","type":"CONCEPTUAL","gloss":"默认前提——模型处理第 10000 个 token 应与第 100 个一样可靠；报告以实验证伪它。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能复述证伪设计：只加长输入、不加难度，成绩本不该变","nameEn":"","centrality":0.072,"stage":"now","feynman":"这是所有「把资料全塞给模型让它自己挑」的做法背后那个没人验证过的前提。它相当于假定注意力是免费且无限均分的。一旦这个前提松动，长上下文就从「能力」变成了「需要管理的资源」。","evidence":["能复述证伪设计：只加长输入、不加难度，成绩本不该变","能指出实测成绩随长度一致变差"],"ap":"该假设若成立，长上下文实验该观察到什么结果？","origin":["context"],"mentionCount":1},{"id":"cm_4a83a8b3","name":"上下文失败，而非模型失败","src":"context","type":"CONCEPTUAL","gloss":"多数 agent 失败已不是模型能力不够，而是上下文装配不对，修系统比换模型更有效。","level":1,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能把一次失败归因到上下文装配而非模型","nameEn":"context failures, not model failures","centrality":0.072,"stage":"now","feynman":"助理办错事，先别急着换人。多半是你没告诉他日程满了、没给他通讯录、没给他发邀请的权限。同一个人，材料给全了，表现就换了一个档。","evidence":["能把一次失败归因到上下文装配而非模型","能据此提出改装配方案而不是换模型"],"ap":"一次 agent 失败，你能判断它是否属于上下文失败吗？","origin":["context"],"mentionCount":1},{"id":"cm_b3514645","name":"上下文坍塌与简洁偏置","src":"harness","type":"CONCEPTUAL","gloss":"反复重写整块 prompt 会让信息坍塌、越写越简，故应输出结构化条目并用确定性逻辑合并。","level":0,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能说明 curator 为何不重写整块 blob","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"让人反复「总结上一版总结」，内容会越缩越短、细节全丢。所以改法是往清单里增删条目，而不是每次重写全文。","evidence":["能说明 curator 为何不重写整块 blob","能指出 brevity bias 造成的信息丢失"],"ap":"这两个失效模式会怎样毁掉一份迭代维护的 prompt？","origin":["harness"],"mentionCount":1},{"id":"cm_d25c3997","name":"上下文文档","src":"context","type":"REPRESENTATIONAL","gloss":"项目里的具名文件，Grill with Docs 会查找它并读取其中已有的共享语言。","level":1,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能说出 Grill with Docs 从哪里读取共享语言","nameEn":"context.md","centrality":0.072,"stage":"when-needed","feynman":"context.md 是给 AI 的领域词典，不是百科文档；它记录的是“这个项目里这些词是什么意思”。","evidence":["能说出 Grill with Docs 从哪里读取共享语言","能在项目里写出供 Agent 读取的 context.md"],"ap":"这份文档放在哪、里面该写什么？","origin":["context"],"mentionCount":1},{"id":"cm_b747de39","name":"上下文压缩与即时检索","src":"harness","type":"PROCEDURAL","gloss":"对抗 context rot 的组合策略：compaction、观察遮蔽、按需 grep/glob、子 agent 只回传摘要。","level":1,"ci":2,"tags":["context-engineering"],"k":"use","kwhy":"能列出至少三种策略并说明各自丢什么、留什么","nameEn":"compaction / just-in-time retrieval","centrality":0.072,"stage":"now","feynman":"把上下文当成随身背包而不是仓库——只带这一段路要用的东西，其余留在原地，需要时再回去取。","evidence":["能列出至少三种策略并说明各自丢什么、留什么","能用 grep/head/tail 替代整文件加载"],"ap":"要在最小高信号 token 下跑完任务，这套策略怎么组合？","origin":["harness"],"mentionCount":1},{"id":"cm_b4276278","name":"设计师与工程师的推拉关系","src":"neican","type":"CONCEPTUAL","gloss":"设计师向前推创意、工程师往回拉可行性，形成自然推拉，最优者两种才能兼具。","level":1,"ci":3,"tags":["agent-org"],"k":"accept","kwhy":"能描述一次设计师推进与工程师回拉的具体分歧","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"这是两种角色在项目中的协作模型——设计师往前推（探索创意、推动思考），工程师往回拉（盯可行性、挑战思路、把想法落地）。作者强调这种张力是\"自然的推拉\"，而非谁服从谁，并且最好的创造者两种能力兼具。它为\"项目怎么被做出来\"补上人的维度。\n\n## 二、概念架构图\n\n材料本身是一份并列的原则清单，多数条目平行铺开；下图只保留原文能支持的分层与关系，边标注的是原文给出的关系（如\"撰写\"\"附加到\"\"参考\"）。其余并列原则不再强行连边。\n\n```mermaid\nflowchart TD\n  A[以项目创建者为中心] -->|体现为| B[为特定用途而设计]\n  A -->|体现为| C[工具为你服务]\n  A -->|体现为| D[可扩展性]\n\n  E[周期] -->|计划时参考| F[目标—项目—日常工作的连接]\n  F -->|指定| G[单一负责人]\n  G -->|撰写| H[简洁规范]\n  G -->|交付| I[小颗粒度工作]\n  H -->|促进| I\n\n  J[反馈作为研究资料库] -->|附加到问题| F\n  K[设计师与工程师的推拉关系] -->|作用于| I\n```","evidence":["能描述一次设计师推进与工程师回拉的具体分歧","能指出团队成员中谁兼具两种能力"],"ap":"你们项目里的 {{name}} 具体表现在哪次争论上？","origin":["neican"],"mentionCount":1},{"id":"cm_a62137fd","name":"审批疲劳","src":"harness","type":"CONCEPTUAL","gloss":"逐条按 Approve 会训练人不读就批，使审批失去意义，故应减少逐条审批。","level":2,"ci":2,"tags":["safety-governance"],"k":"judge","kwhy":"能说明为何逐条审批会退化为一键通过","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"警报响得太频繁，人就学会了无视警报。安全机制被点击疲劳磨钝之后，它的存在只剩下心理安慰。","evidence":["能说明为何逐条审批会退化为一键通过","能提出替代的批量或抽样审批设计"],"ap":"什么迹象表明系统已进入审批疲劳？","origin":["harness"],"mentionCount":1},{"id":"cm_3f42a3b3","name":"世界模型","src":"notion","type":"CONCEPTUAL","gloss":"模型失败常不在看不见，而在无法把观察整合成完整的世界模型。","level":0,"ci":0,"tags":["model-training"],"k":"judge","kwhy":"能区分感知不足与整合失败两种失败","nameEn":"","centrality":0.072,"stage":"deep-dive","feynman":"把碎片化的局部观察缝合成一张可以做预测和规划的「内部地图」。识别出「按这个键 → 物体旋转」这样的局部规律不算有世界模型；能把这些规律组合成「想达到目标 X，所以必须先做 A 再做 B」的全局策略，才算真正建好了世界模型。","evidence":["能区分感知不足与整合失败两种失败","能举例说明信息齐全但结论仍错的情形"],"ap":"这个错误是缺信息，还是世界模型没建起来？","origin":["notion"],"mentionCount":1},{"id":"cm_7026ed33","name":"示例强于规则","src":"harness","type":"CONCEPTUAL","gloss":"示例是比规则更强的信号：附上正好做了被禁行为的示例，模型就会照做。","level":0,"ci":2,"tags":["spec-intent"],"k":"judge","kwhy":"能复述加法陷阱并说明“示例赢”","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"教小孩别看手机，自己却在饭桌上刷手机，孩子学的是你做的那件事。模型也一样：它看你怎么做，不只听你怎么说。","evidence":["能复述加法陷阱并说明“示例赢”","能在写提示词时避免示例与禁令相冲突"],"ap":"当规则与示例冲突时，{{name}} 会怎么判？","origin":["harness"],"mentionCount":1},{"id":"cm_d2a08592","name":"收敛式失败恢复","src":"context","type":"PROCEDURAL","gloss":"失败时收敛修正：grep 失败换更简单正确转义的查询，路径错用 glob 而非猜路径扩范围。","level":1,"ci":1,"tags":["loop-autonomy"],"k":"use","kwhy":"失败后能给出更窄而非更宽的下一步查询","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"走错门时，先确认门牌，而不是把整栋楼每个房间都打开。好的恢复策略让错误停在原地，不继续放大。","evidence":["失败后能给出更窄而非更宽的下一步查询","不靠盲目扩大读取范围碰运气"],"ap":"grep 失败时，{{name}} 要求下一步怎么做？","origin":["context"],"mentionCount":1},{"id":"cm_59d3ad3b","name":"输入摩擦","src":"context","type":"CONCEPTUAL","gloss":"真正的瓶颈常不是没想法，而是把脑中信息敲成文字的成本太高而被省略。","level":0,"ci":1,"tags":["spec-intent"],"k":"judge","kwhy":"能指出上下文缺失常源于输入成本而非无知","nameEn":"too lazy to type","centrality":0.072,"stage":"when-needed","feynman":"你知道该补哪些话，但打字太累就懒得补；模型最后缺的，正是这些没被打出来的话。","evidence":["能指出上下文缺失常源于输入成本而非无知","能据此设计降低输入摩擦的方式"],"ap":"{{name}} 指的是哪个环节的成本？","origin":["context"],"mentionCount":1},{"id":"cm_703ec1e4","name":"输入长度与任务难度的混淆","src":"context","type":"CONCEPTUAL","gloss":"长输入基准里输入变长往往连带任务变难，长度与难度混淆，失败无法定位到具体环节。","level":0,"ci":1,"tags":["verification-eval"],"k":"judge","kwhy":"能指出 Graphwalks 中输入变长意味着图变大","nameEn":"","centrality":0.072,"stage":"deep-dive","feynman":"想知道跑道变长会不会让人跑慢，就不能同时给他加负重。多数长上下文评测恰恰同时做了两件事，于是测出来的「长文本能力差」里，混着「题目本来就更难」。把变量分干净，是这份报告最值钱的方法论动作。","evidence":["能指出 Graphwalks 中输入变长意味着图变大","能说出把难度固定、只变长度的隔离设计"],"ap":"{{name}} 为什么让长上下文基准结论不可靠？","origin":["context"],"mentionCount":1},{"id":"cm_cc071be2","name":"数字存在","src":"context","type":"CONCEPTUAL","gloss":"人的数字上下文可持续演化，甚至在人离开后仍通过 AI 系统与世界互动。","level":1,"ci":1,"tags":["thinking-method"],"k":"judge","kwhy":"能说明心智未必可上传但上下文可以","nameEn":"Digital Presence","centrality":0.072,"stage":"deep-dive","feynman":"你留下的不是一份档案，而是一团还在起作用的上下文。它构成别人（和机器）眼中的你，并且可能比你活得久。","evidence":["能说明心智未必可上传但上下文可以","能举出人离开后仍由 AI 系统互动的例子"],"ap":"按 {{name}}，什么可以被上传并持续演化？","origin":["context"],"mentionCount":1},{"id":"cm_7a03b65b","name":"锁竞争瓶颈","src":"harness","type":"CONCEPTUAL","gloss":"锁本身工作正常也会成为瓶颈，二十个 agent 吞吐退化为两三个。","level":4,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能指出大部分时间花在等待而非工作","nameEn":"lock contention","centrality":0.072,"stage":"when-needed","feynman":"20 个人干活却只有一支笔，多数时间在排队。人手加得再多，产出也卡在那支笔的速度上——这是并行系统最典型的伪扩展。","evidence":["能指出大部分时间花在等待而非工作","能解释串行化如何吃掉并行收益"],"ap":"为什么 {{name}} 让 20 个 agent 只剩 2-3 个的吞吐？","origin":["harness"],"mentionCount":1},{"id":"cm_f5f80946","name":"通关 ≠ 理解","src":"notion","type":"CONCEPTUAL","gloss":"通关不等于理解：Level 1 的成功掩盖模型对底层机制的缺失或扭曲，反而为错误的 Level 2 策略提供自信支撑。","level":0,"ci":0,"tags":["verification-eval"],"k":"judge","kwhy":"能指出某次评测通过但底层机制并未被掌握的迹象","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"奖励信号本身不可靠。模型可能用错误的理由通过一个宽容的关卡，然后把错误的认知放大带到下一关。要判断模型是否真理解，不能只看分数，必须追问「它为什么能过关」。","evidence":["能指出某次评测通过但底层机制并未被掌握的迹象","能说明局部胜利如何反过来支撑错误的高层策略"],"ap":"为什么说{{name}}，它如何误导后续策略？","origin":["notion"],"mentionCount":1},{"id":"cm_a9c7e512","name":"通用工具与「给模型一台计算机」","src":"harness","type":"CONCEPTUAL","gloss":"给模型一台计算机：不给每个动作造工具，而是让 agent 用自带 bash 写代码执行，即时设计自己的工具。","level":1,"ci":2,"tags":["tools-sandbox"],"k":"judge","kwhy":"能说明通用工具相对逐动作造工具的优势","nameEn":"","centrality":0.072,"stage":"now","feynman":"与其给厨师准备一百把专用刀，不如给他一间能自己打铁的作坊。代码执行是元工具——它让工具集从「事先枚举」变成「按需生成」，agent 的能力边界不再由设计者的想象力决定。","evidence":["能说明通用工具相对逐动作造工具的优势","能判断什么任务该交给代码执行而非预置工具"],"ap":"{{name}}这种主张，相比逐动作造工具解决了什么问题？","origin":["harness"],"mentionCount":1},{"id":"cm_e056dcdf","name":"为特定用途而设计","src":"neican","type":"CONCEPTUAL","gloss":"生产力软件应按特定用途设计，过度灵活随团队扩大会变成混乱。","level":0,"ci":3,"tags":["agent-org"],"k":"judge","kwhy":"能说明人人自建流程在小团队可行、规模化后导致混乱","nameEn":"","centrality":0.072,"stage":"now","feynman":"作者把\"灵活\"当成陷阱而非优点。人人自建流程在小团队里没问题，但规模一上来就变成混乱。这是全文里少见的\"边界性\"判断：好工具应当收窄可能性，围绕特定用途把一件事做对，而不是什么都能改。理解它才能明白为什么 Linear 主张固定流程、固定用词。","evidence":["能说明人人自建流程在小团队可行、规模化后导致混乱","能举出固定流程、固定用词这类收窄可能性的做法"],"ap":"{{name}} 为什么把过度灵活当成陷阱？","origin":["neican"],"mentionCount":1},{"id":"cm_cdbb0432","name":"为吞吐量设计与可接受错误率","src":"harness","type":"CONCEPTUAL","gloss":"为吞吐量设计与可接受错误率：追求每次提交 100% 正确会严重串行化，应接受小且恒定的错误率并留绿色分支收尾。","level":2,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能说明强制零错误如何导致串行化与 agent 互相踩踏","nameEn":"","centrality":0.072,"stage":"deep-dive","feynman":"追求\"任何时刻代码都完美\"，在几百个 agent 并发的场景下反而是最慢的路。更快的做法是允许持续存在一小撮已知会被很快修掉的错误，然后在发布口设一道净化关。前提是这个错误率**稳定**——不爆炸、不恶化。","evidence":["能说明强制零错误如何导致串行化与 agent 互相踩踏","能指出系统中最终负责发布前修复的 green 分支"],"ap":"{{name}}要求系统接受什么样的错误率？","origin":["harness"],"mentionCount":1},{"id":"cm_b87e2d6f","name":"稳定的 prompt 前缀","src":"context","type":"PROCEDURAL","gloss":"把 system prompt 等前缀写成逐字稳定的内容，避开时间戳之类易变项，以命中 KV-cache。","level":1,"ci":1,"tags":["caching-cost"],"k":"use","kwhy":"能指出 system prompt 开头放秒级时间戳会打掉该位置之后的全部缓存","nameEn":"","centrality":0.072,"stage":"now","feynman":"缓存像是从头开始的一条链，任何一环换了，后面 ","nameEn":"self-driving / project memory","centrality":0.072,"stage":"when-needed","feynman":"今天的项目是一块被动的白板，人往上贴需求、派任务。自动驾驶的项目更像一个有记忆、会主动的助手：它记得这个功能一路收到过什么反馈，自己从中看出模式、提出方案、甚至小范围试水，只在关键处停下来问你一句。人从“事事亲自推”变成“设好规则、在岔路口把关”。","evidence":["能描述项目记忆自动运转的形态：看到模式、做试制品、发客户、收反馈","能区分五年内会变的部分与不变的部分"],"ap":"你如何用 {{name}} 说明产品能自动决策到什么程度？","origin":["context"],"mentionCount":1},{"id":"cm_cf8c068b","name":"自回归下输出也是上下文","src":"context","type":"CONCEPTUAL","gloss":"模型是自回归的，它自己生成的 token 也进入自己的输入，所以长度压力同时来自输入与输出。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能解释让 max_output_tokens 随输入按 2 倍缩放的设计理由","nameEn":"","centrality":0.072,"stage":"now","feynman":"一个把字符串重复 n 次的程序，每次输出都一模一样；模型做同样的事却会在几千词后开始走样、少写、多写，甚至开始胡言乱语。这是把「模型是不是确定性计算装置」这个问题问到最裸的形态——答案是否定的，而且失效点比想象中来得早。","evidence":["能解释让 max_output_tokens 随输入按 2 倍缩放的设计理由","能说明重复词实验的立论基础"],"ap":"你如何用 {{name}} 解释输出长度也在挤压上下文？","origin":["context"],"mentionCount":1},{"id":"cm_4bc8eb62","name":"自收敛与免全局同步","src":"harness","type":"CONCEPTUAL","gloss":"handoff 的系统性后果：即便 planner 已完成仍持续接收更新并可继续规划，信息沿链上浮到全局视角的 owner，而无需全局同步或交叉通信。","level":2,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能说明信息如何向拥有越来越全局视角的 owner 传播","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"不开全员大会，也不让所有人互相加好友。信息只沿着\"谁对这块负责\"的链条往上走，视野越往上越全局。系统因此既保持动态，又不必付出人人同步的开销。","evidence":["能说明信息如何向拥有越来越全局视角的 owner 传播","能说清免全局同步省掉了哪些开销"],"ap":"你能用 {{name}} 说明多 agent 为何不需要全局同步吗？","origin":["harness"],"mentionCount":1},{"id":"cm_e4f63171","name":"最慢 worker 瓶颈与刚性","src":"harness","type":"CONCEPTUAL","gloss":"角色分工版的性能天花板：系统被最慢 worker 卡住且过于刚性，规划全部前置也难动态重调，走偏的 agent 要等下一轮循环才自纠。","level":1,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能指出角色分工方案的两个失效点：最慢 worker 与刚性","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"把所有规划前置，等于把地图画死。路上发现桥塌了，队伍只能站在原地等下一次重新画图。","evidence":["能指出角色分工方案的两个失效点：最慢 worker 与刚性","能对比说明什么编排方式可避免这两个问题"],"ap":"你能用 {{name}} 说明角色分工为何会被卡住吗？","origin":["harness"],"mentionCount":1},{"id":"cm_f174c068","name":"最小充分上下文","src":"context","type":"CONCEPTUAL","gloss":"reviewer 只需解释某个风险的最小附近代码；额外文件会进入 working context，增加成本并让后续推理失焦。","level":2,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能给 reviewer 只投喂解释该风险所需的最小代码片段","nameEn":"","centrality":0.072,"stage":"now","feynman":"上下文不是越多越好，而是够回答问题就好。多带十本无关资料进考场，只会让你更难找到真正需要的那一页。","evidence":["能给 reviewer 只投喂解释该风险所需的最小代码片段","能说明多喂文件带来的成本与失焦代价"],"ap":"你如何用 {{name}} 决定给 reviewer 塞多少代码？","origin":["context"],"mentionCount":1},{"id":"cm_7be9a292","name":"最小高信号 token 集合","src":"context","type":"CONCEPTUAL","gloss":"有效 context 的唯一指导原则：找到使期望结果概率最大的最小高信号 token 集合；注意 minimal 并不等于 short。","level":2,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能据此裁剪上下文，只留有信号的部分","nameEn":"smallest possible set of high-signal tokens","centrality":0.072,"stage":"now","feynman":"像收拾出差行李。目标不是箱子越轻越好，而是每一件都用得上、且缺一件就出问题。该带的一件不能少，不该带的一件都不要带——最小，是指没有一件多余，不是指少带。","evidence":["能据此裁剪上下文，只留有信号的部分","能解释 minimal does not necessarily mean short"],"ap":"你能用 {{name}} 优化这段 prompt 吗？","origin":["context"],"mentionCount":1},{"id":"cm_9bbb52e5","name":"最小可缓存 token 门槛","src":"context","type":"CONCEPTUAL","gloss":"Anthropic 各模型可缓存内容的最小 token 门槛不同，不能默认所有新模型是同一个数。","level":0,"ci":1,"tags":["caching-cost"],"k":"accept","kwhy":"能说出不同模型的最小可缓存 token 数并不相同","nameEn":"Minimum Cacheable Tokens","centrality":0.072,"stage":"when-needed","feynman":"缓存不是任何长度都能触发。上下文太短时，系统可能根本不会创建缓存；这时看不到 cache read/write 不是 bug，而是没过门槛。","evidence":["能说出不同模型的最小可缓存 token 数并不相同","在配置缓存前会先查该模型的具体门槛"],"ap":"{{name}}在不同 Anthropic 模型上是同一个数吗？该怎么查？","origin":["context"],"mentionCount":1},{"id":"cm_07373436","name":"agent 作为 Claude API 的新核心原语","src":"harness","type":"CONCEPTUAL","gloss":"Managed Agents 接管 harness 与基础设施，使 agent 成为 Claude API 的新核心原语，便于多 agent 与长任务探索。","level":3,"ci":2,"tags":["harness-runtime"],"k":"accept","kwhy":"能说明 agent 成为 API 原语后开发者还剩哪些工作","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"以前 API 的最小积木是一次对话，现在最小积木变成了一个能自己干活的 agent。","evidence":["能说明 agent 成为 API 原语后开发者还剩哪些工作","能举出该原语适合的两类场景" rness","type":"CONCEPTUAL","gloss":"框架替你决定 Agent 怎么想，还重造重试、状态持久化、任务队列与事件路由；harness 只保证这些动作可靠发生。","level":1,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出框架重复造了哪些 harness 组件","nameEn":"","centrality":0.072,"stage":"now","feynman":"框架是给你一套写好的剧本让你填空，harness 是给你一个稳固的舞台让你随便演。前者管「做什么」，后者管「怎么不出事」。作者认为大部分人真正缺的是后者。","evidence":["能说出框架重复造了哪些 harness 组件","能区分“决定怎么想”与“保证可靠发生”"],"ap":"{{name}} 里，harness 负责而 framework 不负责的是什么？","origin":["harness"],"mentionCount":1},{"id":"cm_24c4322f","name":"Harness 组件生命周期","src":"harness","type":"PROCEDURAL","gloss":"每个 harness 组件都是对模型能力边界的假设，过期速度各异；做法是逐一移除旧组件、验证质量是否真的下降。","level":1,"ci":2,"tags":["harness-runtime"],"k":"use","kwhy":"能判断某个组件的假设过期快慢","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"本文最有方法论价值的洞察。每个 harness 组件（context reset、sprint 分解、evaluator）本质上是在说「模型做不到 X」。但模型在进化，这些假设会过期。正确做法不是无脑叠加新组件，而是定期拆掉旧组件测试——如果质量没下降，说明模型已经补上了那个短板。","evidence":["能判断某个组件的假设过期快慢","能设计“移除组件后测质量”的验证步骤"],"ap":"你怎么用 {{name}} 判断某个 harness 组件现在还能不能删？","origin":["harness"],"mentionCount":1},{"id":"cm_c88b81b3","name":"Harness evolution","src":"harness","type":"CONCEPTUAL","gloss":"harness 本身可在任务、trace、benchmark 与隔离实验中持续改进，相关工具如 Harness Evolver 与 Harbor。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出用哪些信号驱动 harness 改进","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"我们不只是用 agent 做项目，也可以用评测和实验不断改造 agent 的工作环境，让它下一次更稳、更少犯同类错误。","evidence":["能说出用哪些信号驱动 harness 改进","能举出至少一个相关工具或资源名"],"ap":"{{name}} 靠哪些信号来推动 harness 本身的改进？","origin":["harness"],"mentionCount":1},{"id":"cm_561b8021","name":"harness over-fitting","src":"harness","type":"CONCEPTUAL","gloss":"前沿模型在自家 harness 上后训练，与特定工具深度耦合；换到没见过的 harness 后名次可能反转。","level":2,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能举出 Codex 与 apply_patch 深度耦合的例子","nameEn":"","centrality":0.072,"stage":"when-needed","feynman":"模型和它出生的那副装备磨合得太熟，既可能是优势，也可能是路径依赖。「官方配置最好」是个待验证的假设，不是定律。","evidence":["能举出 Codex 与 apply_patch 深度耦合的例子","能说明 Terminal Bench 上名次反转说明了什么"],"ap": "AI 原生开发：流程不变，执行主体改变\"]\n    B[\"人在关键路径确认\"]\n  end\n  subgraph F[流程阶段层]\n    C[\"可行性分析\"]\n    D[\"设计文档：桥梁与记忆载体\"]\n    E[\"高精度原型设计\"]\n    F1[\"编码实现\"]\n    G[\"测试验证\"]\n  end\n  subgraph M[机制与边界层]\n    H[\"Agent Session\"]\n    I[\"让 Agent 自行验证\"]\n    J[\"确认环节可合并但不能省略\"]\n    K[\"瓶颈转移到代码两侧\"]\n    L[\"把自己当普通用户／黑盒测试\"]\n  end\n  subgraph T[工具选择层]\n    S[\"两类 Skills：辅助设计确认／自动化减少体力劳动\"]\n  end\n  A -->|推导出| B\n  A -->|用新方式跑| C\n  A -->|用新方式跑| D\n  A -->|用新方式跑| E\n  A -->|用新方式跑| F1\n  A -->|用新方式跑| G\n  C -->|先决定要不要做| D\n  D -->|提供基础| E\n  E -->|确认后| F1\n  F1 -->|进入| G\n  D -->|为下一个 Session 提供起点| H\n  I -->|使合并更安全| J\n  J -->|不可跳过| C\n  J -->|不可跳过| D\n  J -->|不可跳过| E\n  J -->|不可跳过| G\n  K -->|重新审视| J\n  K -->|决定工具选择| S\n  S -->|解决左侧瓶颈| E\n  S -->|解决右侧瓶颈| G\n  L -->|测试视角| G\n```","evidence":["能说出不使用大量开发类 Skills 的理由是模型编码已足够好","能把两类 Skills 分别对应到瓶颈左右两侧"],"ap":"{{name}} 分成哪两类，各自解决哪一侧瓶颈？","origin":["neican"],"mentionCount":4},{"id":"cm_cb329146","name":"description","src":"neican","type":"CONCEPTUAL","gloss":"必填字段，≤1024 字符，是匹配依据，须写清技能作用与何时使用它","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能写出回答'做什么、何时用'的描述","nameEn":"","centrality":0.07,"stage":"now","feynman":"description 是克劳德做匹配的依据：它拿当前请求去比对描述，判断这个技能相不相关，从而决定是否启用。因此它必须回答两个问题——技能有什么作用、克劳德应在什么情况下用它；上限 1024 字符。它还连着一条排查规则：技能没在预期时机触发，就往描述里补上与真实请求措辞一致的关键词。写法上不要写\"帮忙处理文件\"这类含糊指令，要说清楚具体做什么。","evidence":["能写出回答'做什么、何时用'的描述","能说出未按预期触发时可补上与真实请求措辞一致的关键词"],"ap":"{{name}}要回答哪两个问题？写含糊会有什么后果？","origin":["neican"],"mentionCount":4},{"id":"cm_f282148c","name":"把自己当普通用户／黑盒测试","src":"neican","type":"PROCEDURAL","gloss":"测试时把自己当普通用户，凭直觉乱点、输入意外内容做黑盒测试。","level":0,"ci":3,"tags":["verification-eval"],"k":"use","kwhy":"能说明为何要不按开发者预期路径测试","nameEn":"","centrality":0.052,"stage":"when-needed","feynman":"测试时不按开发者的预期路径走，要假装第一次用，凭直觉乱点、输入意外内容。作者自己只做黑盒测试，不逐行 Review；但这不是绝对规则，核心系统仍可能要 Code Review。它说明测试确认的用户视角，以及合并确认的安全边界。","evidence":["能说明为何要不按开发者预期路径测试","能指出核心系统仍可能需要 Code Review"],"ap":"{{name}} 具体怎么做，什么情况下不适用？","origin":["neican"],"mentionCount":3},{"id":"cm_ae250f40","name":"仓库提交","src":"neican","type":"PROCEDURAL","gloss":".claude/skills 中的项目技能随 Git 共享，克隆即获得，推送后他人拉取即更新","level":0,"ci":3,"tags":["code-engineering"],"k":"use","kwhy":"能说出项目技能的存放路径与分发方式","nameEn":"","centrality":0.052,"stage":"when-needed","feynman":"这条路把技能当成仓库里的普通文件——技能跟着 Git 走，没有第二条分发通道。克隆即获得，不装任何东西；推送更新后，别人下次拉取就同步。它界定的机制边界是\"零安装、零额外渠道、随版本控制\"，所以作者称它最简单，也是项目专属技能的自然归宿。","evidence":["能说出项目技能的存放路径与分发方式","能指出拿到技能无需额外安装步骤"],"ap":"{{name}}应该放在哪？别人如何拿到更新？","origin":["neican"],"mentionCount":3},{"id":"cm_48ea99ce","name":"插件与市场","src":"neican","type":"REPRESENTATIONAL","gloss":"插件按类似 .claude 的结构打包技能，分发到市场供他人自行发现安装","level":0,"ci":3,"tags":["agent-org"],"k":"use","kwhy":"能描述插件中 skills 目录与 SKILL.md 的结构","nameEn":"Plugin / Marketplace","centrality":0.052,"stage":"when-needed","feynman":"插件把技能从单个仓库里解放出来。它的目录结构模仿 `.claude`（一个 skills 目录，每个技能一个文件夹，内含 SKILL.md），但分发不走仓库，而走市场：别人自己发现、自己安装。作者给的适用标准是\"技能对直接团队以外的人也有用\"——反过来说，过度绑定某个项目的技能就不该走这条路。","evidence":["能描述插件中 skills 目录与 SKILL.md 的结构","能判断技能是否值得做成插件对外分发"],"ap":"什么情况下该走 {{name}}，而不是提交到仓库？","origin":["neican"],"mentionCount":3},{"id":"cm_64663de2","name":"反复解释同一件事","src":"neican","type":"CONCEPTUAL","gloss":"反复向 Claude 解释同一件事，是应为该内容写一个技能的触发信号与经验法则。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能举出自己反复向 Claude 解释的同一类内容","nameEn":"","centrality":0.052,"stage":"now","feynman":"在本文中，反复解释同一件事不是普通抱怨，而是创建技能的触发信号。它把“为什么需要技能”具体化了：同一类说明、审查结构、格式偏好如果每次都重复，就可以封装成技能，让 Claude 之后自动应用。\n\n## 二、概念架构图\n\n图按触发、技能本体、加载与激活、存储与共享四层组织；CLAUDE.md 与斜杠命令作为加载和激活的边界对照出现。\n\n```mermaid\nflowchart TB\n  subgraph 触发层\n    T[\"反复向 Claude 解释同一件事\"]\n  end\n\n  subgraph 技能本体层\n    S[\"技能（Agent Skills）\"]\n    F[\"SKILL.md 文件\"]\n    FM[\"前置信息：名称和描述\"]\n    SD[\"技能描述\"]\n  end\n\n  subgraph 加载与激活层\n    L[\"按需加载\"]\n    A[\"自动激活\"]\n    CM[\"CLAUDE.md：每次对话加载\"]\n    SC[\"斜杠命令：需要显式调用\"]\n  end\n\n  subgraph 存储与共享层\n    PS[\"个人技能：~/.claude/skills\"]\n    PR[\"项目技能：.claude/skills\"]\n  end\n\n  T -->|提示需要写技能| S\n  S -->|存在于| F\n  F -->|前置信息包含| FM\n  FM -->|提供匹配依据| SD\n  SD -->|匹配请求后| A\n  A -->|触发| L\n  L -.->|不同于| CM\n  A -.->|不同于| SC\n  S -->|可存为| PS\n  S -->|可存为| PR\n  PS -->|伴随所有项目| S\n  PR -->|随仓库共享给克隆者| S\n  S -->|解决| T\n```","evidence":["能举出自己反复向 Claude 解释的同一类内容","能据此判断哪些内容值得封装成技能"],"ap":"{{name}} 在本文中被当作什么信号？","origin":["neican"],"mentionCount":3},{"id":"cm_af4d864f","name":"功能组合","src":"neican","type":"CONCEPTUAL","gloss":"各功能各有专长，应结合使用，而不是把所有事情硬塞进 skills。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出 CLAUDE.md、Skills、Hooks、Subagents、MCP 各自角色","nameEn":"","centrality":0.052,"stage":"now","feynman":"在本文里，功能组合不是简单罗列工具，而是作者的结论：Claude Code 的这些自定义选项解决不同问题，所以应根据每种功能的专长分别使用，再组合成一个完整配置。它防止读者把所有需求都塞进 Skills，也把前面各个概念收束成一个整体框架。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TB\n  subgraph L1[功能角色层]\n    R1[知识/上下文]\n    R2[执行委派]\n    R3[事件自动化]\n    R4[外部集成]\n  end\n\n  subgraph L2[具体功能层]\n    S[Skills]\n    C[CLAUDE.md]\n    A[Subagents]\n    H[Hooks]\n    M[MCP servers]\n  end\n\n  subgraph L3[机制与边界对照层]\n    L[按需加载 ↔ 始终加载]\n    T[请求驱动 ↔ 事件驱动]\n    I[当前对话添加知识 ↔ 隔离执行上下文]\n  end\n\n  subgraph L4[总原则层]\n    K[组合使用：结合而非硬塞]\n  end\n\n  R1 --> S\n  R1 --> C\n  R2 --> A\n  R3 --> H\n  R4 --> M\n\n  S --> L\n  C --> L\n  S --> T\n  H --> T\n  S --> I\n  A --> I\n  M -.不同类别.-> S\n\n  S --> K\n  C --> K\n  A --> K\n  H --> K\n  M --> K\n```","evidence":["能说出 CLAUDE.md、Skills、Hooks、Subagents、MCP 各自角色","能给出一个同时含多种功能的典型配置"],"ap":"按 {{name}}，典型配置包含哪些功能、各管什么？","origin":["neican"],"mentionCount":3},{"id":"cm_fb4c75d6","name":"设计文档","src":"neican","type":"CONCEPTUAL","gloss":"文档是人与 Agent、Agent 与 Agent 之间的桥梁，也是记忆载体。","level":0,"ci":3,"tags":["context-engineering"],"k":"judge","kwhy":"能说明确认后的文档是下一个 Agent Session 的全部起点","nameEn":"","centrality":0.052,"stage":"now","feynman":"传统文档可能是写完就过时的负担；本文里文档是核心中间物。人靠它确认和修改方案，Agent Session 靠它继承前一个 Session 的决策和上下文。没有它，人无法高效确认，Agent 也无法跨阶段接力。","evidence":["能说明确认后的文档是下一个 Agent Session 的全部起点","能指出文档承担跨阶段传递决策与上下文的作用"],"ap":"{{name}} 在 AI 原生开发里承担什么角色？","origin":["neican"],"mentionCount":3},{"id":"cm_07e5e0c3","name":"文件系统型代码执行环境","src":"neican","type":"CONCEPTUAL","gloss":"技能以目录形式存在于带文件系统、bash 与代码执行的虚拟机中，可读文件、跑脚本。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说明技能是虚拟机上的目录而非纯文本提示","nameEn":"Filesystem-based Code Execution Environment","centrality":0.052,"stage":"when-needed","feynman":"技能不是纯文本提示，而是放在虚拟机目录里的文件包。Claude 在这个环境中有文件系统访问、bash 命令和代码执行能力，可以像人操作电脑文件一样读取 SKILL.md、引用其他文件、运行脚本。这个环境解释了技能为什么能包含脚本和资源，也解释了为什么脚本代码本身不必进入上下文，只有输出会进入。","evidence":["能说明技能是虚拟机上的目录而非纯文本提示","能解释脚本代码不必进上下文、只有输出进入"],"ap":"{{name}} 为什么能让技能包含脚本和参考文件？","origin":["neican"],"mentionCount":3},{"id":"cm_42f28056","name":"保留推理","src":"multi","type":"CONCEPTUAL","gloss":"跨工具调用与轮次保留模型私有推理，让它看到此前的计划与思路，而不只是动作记录。","level":0,"ci":4,"tags":["harness-runtime"],"k":"use","kwhy":"能说出开启前后模型可见信息的差别","nameEn":"retained reasoning","centrality":0.035,"stage":"when-needed","feynman":"让模型把自己的草稿纸留在桌上，而不是每做完一步就撕掉。有草稿在，它不必重新推导已经想明白的事，因此反而想得更少、走得更快。","evidence":["能说出开启前后模型可见信息的差别","能在多轮任务中通过 response ID 保留推理并观察效果"],"ap":"开启 {{name}} 后，模型多看到了哪些信息？","origin":["context","harness"],"mentionCount":2},{"id":"cm_49d1aa2a","name":"富引用","src":"context","type":"CONCEPTUAL","gloss":"spec 不限于 markdown 计划：HTML artifact、测试套件、待移植函数、rubric 都可充当。","level":0,"ci":1,"tags":["spec-intent"],"k":"judge","kwhy":"能说出为什么代码形态的引用保真度更高","nameEn":"rich references","centrality":0.035,"stage":"when-needed","feynman":"说明书不必是一段文字。一套能跑的测试、一份能渲染的原型，都是更硬的说明书，因为它们不容易被误读。","evidence":["能说出为什么代码形态的引用保真度更高","能把一段文字需求改写成代码或测试形式的引用"],"ap":"给我写一份 {{name}}：拿什么当 spec 比文字描述更清楚？","origin":["context"],"mentionCount":2},{"id":"cm_7d8d74f0","name":"工作树隔离","src":"multi","type":"PROCEDURAL","gloss":"为每个并发 Agent 分配独立工作空间，避免改同一文件造成冲突，便于事后合并。","level":0,"ci":4,"tags":["multi-agent"],"k":"use","kwhy":"能同时启动多个 Agent 且文件不互相覆盖","nameEn":"","centrality":0.035,"stage":"now","feynman":"让每个 AI 在自己的小房间里改代码，改完再拿出来合并。否则大家挤在一张桌子上改同一份文件，很容易互相踩坏。","evidence":["能同时启动多个 Agent 且文件不互相覆盖","能说明隔离与合并之间的先后顺序"],"ap":"多个 Agent 同时改代码时，{{name}} 怎么保证它们不打架？","origin":["context","harness"],"mentionCount":2},{"id":"cm_31ec728d","name":"观察掩码","src":"multi","type":"PROCEDURAL","gloss":"上下文管理策略：把旧的工具输出隐藏起来，只保留动作与结论，从而压低窗口占用。","level":0,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能指出哪些旧工具输出可以安全隐藏","nameEn":"Observation Masking","centrality":0.035,"stage":"when-needed","feynman":"观察掩码不是删除历史，而是降低旧工具结果对当前推理的干扰。模型仍知道发生过调用，但不必反复看到沉重的输出细节。","evidence":["能指出哪些旧工具输出可以安全隐藏","能对比掩码前后上下文占用与任务表现的差异"],"ap":"上下文快满时，{{name}} 该丢掉什么、保留什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_b7424773","name":"滚动截断","src":"multi","type":"PROCEDURAL","gloss":"官方 harness 的上下文管理：超过约 175,000 字符就丢弃最旧消息，代价是丢失早期观察且常运行在更满窗口。","level":0,"ci":4,"tags":["context-engineering"],"k":"judge","kwhy":"能说出滚动截断的两个已知弊端","nameEn":"rolling truncation","centrality":0.035,"stage":"when-needed","feynman":"像一条只能记住最近几步的传送带，旧的东西自动掉出去。你不会收到任何提示，只会发现自己反复回到同一个死胡同。","evidence":["能说出滚动截断的两个已知弊端","能对比它与其他上下文管理策略的取舍"],"ap":"{{name}} 会丢什么样的信息，什么时候会害到 Agent？","origin":["context","harness"],"mentionCount":2},{"id":"cm_325fef11","name":"技能变更生效条件：编辑、删除、重启","src":"neican","type":"PROCEDURAL","gloss":"改技能即改其 SKILL.md，删技能即删目录，之后必须重启 Claude Code 才生效","level":0,"ci":3,"tags":["harness-runtime"],"k":"use","kwhy":"能写出改、删技能对应的文件操作","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"技能不是热更新对象。改技能就是改它的 SKILL.md；删技能就是删目录。因为 Claude Code 在启动时加载技能，所以创建、修改、删除后都要重启 Claude Code 才生效。这个操作边界直接来自前面的启动加载机制。\n\n## 二、概念架构图\n\n```mermaid\nflowchart TB\n  subgraph L1[\"定义层：技能如何构成\"]\n    A[\"技能：目录\"]\n    B[\"SKILL.md\"]\n    C[\"frontmatter／前言：名称、描述\"]\n    D[\"指令体／后言：第二组破折号后的说明\"]\n  end\n\n  subgraph L2[\"加载与匹配层：Claude 何时读取什么\"]\n    E[\"启动时仅加载名称和描述\"]\n    F[\"用户请求\"]\n    G[\"语义匹配：请求与描述\"]\n    H[\"确认提示\"]\n    I[\"完整加载 SKILL.md 并执行指令\"]\n  end\n\n  subgraph L3[\"作用域与冲突层：同名技能谁优先\"]\n    J[\"企业版（最高）\"]\n    K[\"个人版\"]\n    L[\"项目版\"]\n    M[\"插件版（最低）\"]\n    N[\"名称冲突优先级\"]\n  end\n\n  subgraph L4[\"变更生效层\"]\n    O[\"更新：编辑 SKILL.md\"]\n    P[\"删除：删除目录\"]\n    Q[\"重启 Claude Code\"]\n  end\n\n  A -- 包含 --> B\n  B -- 分为 --> C\n  B -- 分为 --> D\n  C -- 提供 --> E\n  E -- 支撑 --> G\n  F -- 触发 --> G\n  G -- 命中后 --> H\n  H -- 确认后 --> I\n  I -- 读取 --> D\n  J -- 参与 --> N\n  K -- 参与 --> N\n  L -- 参与 --> N\n  M -- 参与 --> N\n  N -- 决定同名采用哪个 --> I\n  E -- 导致变更需 --> Q\n  O -- 需 --> Q\n  P -- 需 --> Q\n```","evidence":["能写出改、删技能对应的文件操作","能说出改动后必须重启才生效的原因"],"ap":"改完技能 SKILL.md 后，{{name}}还需要做什么才生效？","origin":["neican"],"mentionCount":2},{"id":"cm_d4a0e687","name":"技能与 SKILL.md 结构","src":"neican","type":"REPRESENTATIONAL","gloss":"技能是一个目录加入口文件 SKILL.md：前置元数据，其下为说明，激活后才执行。","level":0,"ci":3,"tags":["harness-runtime"],"k":"use","kwhy":"能指出 SKILL.md 中元数据与说明的分界（第二组破折号）","nameEn":"Skill / SKILL.md","centrality":0.035,"stage":"now","feynman":"在本文里，技能不是一段单独的提示词，而是一个目录加一个入口文件 SKILL.md。SKILL.md 又分成两段：前面放元数据，也就是名称和描述；后面放说明，也就是 Claude 激活技能后要执行的指令。名称用来标识技能，描述用来后续匹配；说明不是启动时就读，而是匹配确认后才执行。拿掉这个结构，后面“只加载名称和描述”“第二组破折号后是指令”都无从理解。","evidence":["能指出 SKILL.md 中元数据与说明的分界（第二组破折号）","能说明说明部分在激活后才作为指令执行"],"ap":"{{name}} 中第二组破折号之后的内容何时被执行？","origin":["neican"],"mentionCount":2},{"id":"cm_c8c4d5c6","name":"脚手架与 Harness 厚度","src":"multi","type":"CONCEPTUAL","gloss":"脚手架本身不盖房子；关键取舍是多大比例的逻辑写死在系统里，而不是留给模型。","level":0,"ci":4,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出现有 harness 里哪些逻辑是写死的","nameEn":"Scaffolding / Harness Thickness","centrality":0.035,"stage":"now","feynman":"脚手架比喻说明 Harness 是支撑模型行动的临时基础设施；Harness 厚度则说明架构师要分配系统确定性和模型自由度之间的责任。","evidence":["能指出现有 harness 里哪些逻辑是写死的","能为某个功能说出该写死还是交给模型的理由"],"ap":"这段逻辑该写进 harness 还是交给模型，{{name}} 的标准是什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_652d3291","name":"输出 token 效率","src":"multi","type":"CONCEPTUAL","gloss":"改版后分数约 3 倍，输出 token 少 6 倍，因为模型不再需要每个动作前重新解读游戏。","level":0,"ci":4,"tags":["caching-cost"],"k":"compute","kwhy":"能说出 token 减少的原因是模型不必每个动作前重新解读","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"省钱和提分在这里不是取舍，而是同一个原因的两个结果。让模型少做无用的重复思考，账单和成绩会同时变好。","evidence":["能说出 token 减少的原因是模型不必每个动作前重新解读","能用分数与 token 的对比量化这次改动收益"],"ap":"{{name}} 提升后，为什么思考时间也随之缩短？","origin":["context","harness"],"mentionCount":2},{"id":"cm_e66df281","name":"战略性技术债务：Python 服务","src":"neican","type":"CONCEPTUAL","gloss":"为优先产品与平台稳定而暂不优化性能，把 Python 服务的性能欠账当作有意识的战略性债务。","level":0,"ci":3,"tags":["code-engineering"],"k":"judge","kwhy":"能说出当时的首要目标是扫清产品开发障碍与平台稳定性，而非成本或资源优化","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"用 Python 跑高吞吐服务会增加网络延迟、CPU 和内存成本，100 倍规模下几乎肯定要重写。但团队优先建立核心 API 和基础设施，把性能优化延后，作为战略性技术债务。这个选择是理解为何 Habitat 先用 Python、后来又迁移到 Rust 的关键。","evidence":["能说出当时的首要目标是扫清产品开发障碍与平台稳定性，而非成本或资源优化","能指出团队押注未来编码模型会让 Python→Rust 迁移变得可行，且该押注被验证"],"ap":"{{name}} 与“先做性能优化”的取舍依据是什么？","origin":["neican"],"mentionCount":2},{"id":"cm_138a8b67","name":"子代理的技能隔离","src":"neican","type":"CONCEPTUAL","gloss":"子代理以全新干净上下文启动，不自动看到主会话技能，须在 skills 字段显式列出","level":0,"ci":3,"tags":["multi-agent"],"k":"judge","kwhy":"能说出子代理默认不继承技能","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"委派任务时，子代理是从\"全新、干净的上下文\"起步的，所以主会话里能用的技能，它默认一个也看不到。这不是配置失误，而是默认规则——也正因为是默认规则，后面的自定义子代理才必须显式写 `skills` 字段。这条是理解\"为什么还要多做一步配置\"的前提。","evidence":["能说出子代理默认不继承技能","能指出自定义子代理需在前置元数据 skills 字段列出技能"],"ap":"把任务委派给子代理时，{{name}}默认会带过去吗？要怎么办？","origin":["neican"],"mentionCount":2},{"id":"cm_983f29fd","name":"asyncio 调度延迟与尾部延迟","src":"neican","type":"CONCEPTUAL","gloss":"单请求触发数百次数据库调用时体验由最慢那次决定；asyncio 不绕过 GIL，CPU 密集任务抬高尾部延迟。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能解释为何用户感受到的延迟往往是最慢的那次调用","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"一个用户请求可能触发数百次数据库调用，总体验由最慢的调用决定，这就是尾部延迟。Python 的 asyncio 能并发处理 I/O，但不能绕过 GIL 提供 CPU 并行性；CPU 密集任务会让事件循环上其他协程等待，产生调度抖动，放大尾部延迟。因此 Habitat 限制每个进程并发请求数，并大规模扩展 Python 工作进程。","evidence":["能解释为何用户感受到的延迟往往是最慢的那次调用","能说明 asyncio 能并发 I/O 但不提供 CPU 并行，需限制进程并发数并扩大 Python 工作进程规模"],"ap":"{{name}} 为什么会放大用户感知到的延迟？","origin":["neican"],"mentionCount":2},{"id":"cm_b9d1dd66","name":"CLAUDE.md","src":"multi","type":"REPRESENTATIONAL","gloss":"放在项目根目录的 markdown 文件，Claude Code 每次会话开始时自动读取并严格执行。","level":0,"ci":4,"tags":["context-engineering"],"k":"use","kwhy":"能说出 CLAUDE.md 的放置位置与读取时机","nameEn":"","centrality":0.035,"stage":"now","feynman":"每个项目根目录的「出厂规则」。它代替了你嘴上反复交代的背景：技术栈、人名、命名规则、禁止做的事。AI 每次开工先读一遍，所以这是项目里成本最低、回报最高的写作。","evidence":["能说出 CLAUDE.md 的放置位置与读取时机","能写出其中应包含的项目交接信息"],"ap":"新会话开始时，Claude 会先读 {{name}} 里的什么？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_5d506128","name":"Diarization","src":"multi","type":"CONCEPTUAL","gloss":"把某主题下的海量文档读遍后蒸馏成一页结构化判断档案的步骤，让 AI 真正服务知识工作。","level":0,"ci":4,"tags":["memory-retrieval"],"k":"judge","kwhy":"能说明普通摘要与全量阅读后蒸馏出结构档案的区别","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"Diarization 是让 AI 真正能做知识工作的关键动作：","evidence":["能说明普通摘要与全量阅读后蒸馏出结构档案的区别","能把一主题的几十份文档压成一页可复用的判断"],"ap":"能否用 {{name}} 把上百份文档蒸馏成一页结构化档案？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_7e6ba505","name":"hooks","src":"harness","type":"PROCEDURAL","gloss":"在 agent 生命周期特定事件上自动执行的确定性脚本，用于通知、审批、集成与验证。","level":0,"ci":2,"tags":["harness-runtime"],"k":"compute","kwhy":"能写出停止时跑检查、成功静默失败只报错并退出码 2 的脚本","nameEn":".claude/hooks/","centrality":0.035,"stage":"now","feynman":"模型是概率性的，hooks 是确定性的。凡是「必须每次都发生」的事，别写进提示词求它照做，写成脚本让它必然发生。","evidence":["能写出停止时跑检查、成功静默失败只报错并退出码 2 的脚本","能解释为何确定性代码能在 AI 犯错前挡住它"],"ap":"能否给 {{name}} 写一个失败时退出码 2、成功时静默的校验脚本？","origin":["harness"],"mentionCount":2},{"id":"cm_d5428fa4","name":"Prompt 到 Loop 的跃迁","src":"multi","type":"CONCEPTUAL","gloss":"从提示词、上下文、harness 到 loop 的四次跃迁：语言表达、信息组织、规则约束、系统自运行。","level":0,"ci":4,"tags":["loop-autonomy"],"k":"judge","kwhy":"能按顺序说出四次跃迁各自解决什么问题","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"提示词解决“怎么说”，上下文解决“给什么材料”，约束解决“不能乱来”，循环解决“怎么不用人一直盯着也能继续做”。","evidence":["能按顺序说出四次跃迁各自解决什么问题","能判断自己当前工程实践处在哪一级"],"ap":"你的项目处在 {{name}} 的哪一级，下一级要补什么？","origin":["context","harness"],"mentionCount":2},{"id":"cm_b3f7d7cc","name":"Responses API 与生产设置对齐","src":"multi","type":"REPRESENTATIONAL","gloss":"用 Responses API 重写 harness 以更好对齐生产设置，并建议开发者弃用 legacy Chat Completions。","level":0,"ci":4,"tags":["harness-runtime"],"k":"use","kwhy":"能说出改用 Responses API 的理由是匹配生产设置","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"把评测环境改造成和产品线上一模一样，再去量成绩。你想知道车在高速上跑多快，就别在停车场里测。","evidence":["能说出改用 Responses API 的理由是匹配生产设置","能在自己的 harness 里完成 API 迁移并跑通"],"ap":"你的 {{name}} 是否已用 Responses API 而非旧 Chat Completions 实现？","origin":["context","harness"],"mentionCount":2},{"id":"cm_103560db","name":"RHAE","src":"multi","type":"REPRESENTATIONAL","gloss":"ARC-AGI-3 的评分指标，把模型表现与人类测试基线相比，得出相对人类动作效率。","level":0,"ci":4,"tags":["verification-eval"],"k":"accept","kwhy":"能说出人类基线约 48%、GPT-5.6 Sol 为 38.3% 这一对比","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"它不看你最终有没有通关，而看你用多少动作达成目标，再跟人类比。分数低可能不是因为不会玩，而是因为绕的弯太多。","evidence":["能说出人类基线约 48%、GPT-5.6 Sol 为 38.3% 这一对比","能用该口径把模型分数换算成相对人类效率"],"ap":"能否用 {{name}} 算出模型相对人类基线的百分比？","origin":["context","harness"],"mentionCount":2},{"id":"cm_df8ed356","name":"SKILL.md 结构性要求","src":"neican","type":"REPRESENTATIONAL","gloss":"SKILL.md 必须位于命名目录内，文件名大小写须恰为 SKILL.md。","level":0,"ci":3,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出文件不能直接放在技能根目录下","nameEn":"","centrality":0.035,"stage":"now","feynman":"技能能否被加载，取决于两个硬性结构条件——文件必须放在一个命名目录里（不能直接摊在技能根目录），文件名必须大小写精确地写成 `SKILL.md`。这些是绝对规则，不满足就加载不上，和描述写得好不好无关。","evidence":["能说出文件不能直接放在技能根目录下","能准确复述 SKILL.md 的大小写要求"],"ap":"{{name}} 的两个硬性结构条件是什么？","origin":["neican"],"mentionCount":2},{"id":"cm_9102c409","name":"Vibe Coding","src":"multi","type":"CONCEPTUAL","gloss":"抬高地板式编程范式：用自然语言描述需求由 agent 生成代码，适合原型与小工具，不适合严肃工程。","level":0,"ci":4,"tags":["code-engineering"],"k":"judge","kwhy":"能说出它适合原型玩票、不适合要守质量底线的工程","nameEn":"","centrality":0.035,"stage":"when-needed","feynman":"“跟着感觉走”式的编程——把需求抛给 AI，不统规划、不结构化、不严格审查。是 Agentic Engineering 的前一个阶段，Karpathy 以它为对标来定义 Agentic Engineering 的进化方向。","evidence":["能说出它适合原型玩票、不适合要守质量底线的工程","能判断一个具体任务该走随性编码还是 Agentic Engineering"],"ap":"这个原型任务适合用 {{name}} 还是需要 Agentic Engineering？","origin":["notion","harness"],"mentionCount":2},{"id":"cm_d37ac913","name":"「并不 agentic」的 AI Agent","src":"context","type":"CONCEPTUAL","gloss":"市面多数以 AI Agent 为卖点的产品其实以确定性代码为主，只在恰到好处的点插入 LLM 步骤。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能在同类产品中分辨确定性骨架与 LLM 插入点","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"好的自动驾驶不是让方向盘随机发挥，而是把绝大部分路况交给确定的规则，只在少数需要判断的时刻调用智能。agent 也一样：LLM 是点睛，不是骨架。当你发现产品做得好的地方其实是普通代码在支撑，那不是失败，那正是它能上线的原因。","evidence":["能在同类产品中分辨确定性骨架与 LLM 插入点","能说明这种混合为何反而带来神奇的体验"],"ap":"你能拆出 {{name}} 中哪些是确定性代码、哪些是 LLM 步骤吗？","origin":["context"],"mentionCount":1},{"id":"cm_92c032dc","name":"「模型即产品」的幻觉","src":"harness","type":"CONCEPTUAL","gloss":"误以为接上 API、写个 prompt、演示惊艳就等于产品做完，忽视其后的全部工程工作。","level":0,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"能复述作者对该幻觉的“It is not.”式回应","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"demo 惊艳和产品可靠之间隔着一整个工程学科。第一次成功是概率给你的礼物，而产品要求的是同一件事在一万次不同输入下都成立——这两者的距离，就是全文要拆的那份难度。","evidence":["能复述作者对该幻觉的“It is not.”式回应","能列出首次演示后仍需补齐的工程工作"],"ap":"对照 {{name}}，你的项目在首次演示后还剩哪些没做的事？","origin":["harness"],"mentionCount":1},{"id":"cm_f4ccedd3","name":"「扔掉 DAG」的承诺","src":"context","type":"CONCEPTUAL","gloss":"认为可抛弃 DAG、只给目标与转移让 LLM 实时决策路径的承诺，作者随即指出它并不完全成立。","level":0,"ci":1,"tags":["loop-autonomy"],"k":"judge","kwhy":"能说出该承诺许诺的少写代码、可恢复、可找新解","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"等于说「你只要告诉司机目的地，路线交给他」。听起来省事得多，但真拉上乘客跑城市配送时你就会发现，你需要的不是一位天才司机，而是可预期、可复盘、出事能定位的运输系统。承诺本身没错，错的是以为它可以免掉工程。","evidence":["能说出该承诺许诺的少写代码、可恢复、可找新解","能举出该承诺在何处不成立的实际反例"],"ap":"{{name}} 在你的场景里哪些部分成立、哪些不成立？","origin":["context"],"mentionCount":1},{"id":"cm_b442cd6e","name":"「少即是多」：gimmick 与真实增益的分界","src":"harness","type":"CONCEPTUAL","gloss":"装配置、诱导 agent 多是 gimmick；真实增益来自对 harness 的理解与用法。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出自己配置里哪些属于 gimmick","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"健身房里换器械不会让你变强，把几个基础动作练到位才会。工具的新鲜感冒充了进步，所以「少而深」通常打败「多而浅」。","evidence":["能指出自己配置里哪些属于 ],"mentionCount":1},{"id":"cm_eadc084c","name":"昂贵的反馈回路与欠测试","src":"harness","type":"CONCEPTUAL","gloss":"模型调用贵、端到端慢，让人少试变体、停止观察、欠测试，最终发布漂移。","level":0,"ci":2,"tags":["caching-cost"],"k":"judge","kwhy":"能说出昂贵回路的两层后果","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"体检便宜时你每年查一次，体检贵到离谱时你会开始安慰自己「今年应该没事」。检查成本决定了检查频率，而频率决定了你什么时候才知道自己病了。","evidence":["能说出昂贵回路的两层后果","能举出自己因成本偷懒验证的例子"],"ap":"{{name}} 会怎样悄悄改变你的验证习惯？","origin":["harness"],"mentionCount":1},{"id":"cm_d049e24c","name":"把上下文转化为执行","src":"context","type":"REPRESENTATIONAL","gloss":"Linear 的定位：把反馈、意图、决策、计划、代码塑造成工作并带到生产。","level":0,"ci":1,"tags":["context-engineering"],"k":"accept","kwhy":"能说出 Linear 承载哪些上下文","nameEn":"turn context into execution","centrality":0.017,"stage":"when-needed","feynman":"光有一堆信息没用，关键是让信息自动变成\"做出来的东西\"。这套系统的价值在于打通\"知道\"到\"做到\"的最后一段路：反馈进来，变成任务，有人或 agent 去做，一直推到上线。上下文是原料，执行是成品。","evidence":["能说出 Linear 承载哪些上下文","能解释上下文如何变成执行"],"ap":"{{name}} 里上下文在哪一步被转成可执行动作？","origin":["context"],"mentionCount":1},{"id":"cm_8e16a624","name":"版权合规硬上限","src":"context","type":"PROCEDURAL","gloss":"版权是不可谈判的硬上限：引用 15 词以下、单一来源至多一条、不镜像结构。","level":0,"ci":1,"tags":["safety-governance"],"k":"judge","kwhy":"能列出两条最易忽略的规则","nameEn":"","centrality":0.017,"stage":"now","feynman":"抄袭不只发生在字面。把一篇文章的骨架照搬、按顺序把每个论点都讲一遍，即使一个词都没重复，也已经替代了读原文。这份规范给出的替代方案很干脆：2-3 句概述，然后请对方问具体问题。","evidence":["能列出两条最易忽略的规则","能判断一段复述是否违规"],"ap":"这段输出是否越过 {{name}}？","origin":["context"],"mentionCount":1},{"id":"cm_a4c5a8aa","name":"保留错误证据与错误恢复","src":"context","type":"CONCEPTUAL","gloss":"失败是多步任务的一环；清理轨迹会抹掉证据，保留错误 action 与堆栈才能让模型隐式更新。","level":0,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能说出隐藏错误为何反而有害","nameEn":"","centrality":0.017,"stage":"now","feynman":"把摔跤的地方擦干净，下次还会在同一处摔。留着那道痕迹，反而是最便宜的护栏。作者进一步认为，能从错误里爬起来才是\"真 agent\"最清晰的标志，而现有 benchmark 大多只测理想条件下的成功率。","evidence":["能说出隐藏错误为何反而有害","能在上下文里保留失败轨迹与报错"],"ap":"{{name}} 要求你在上下文里留下什么？","origin":["context"],"mentionCount":1},{"id":"cm_5c7e3009","name":"本地状态层","src":"harness","t time"],"k":"judge","kwhy":"能举出 Claude Code、Codex 等属于该层的产品","nameEn":"","centrality":0.017,"stage":"now","feynman":"考试成绩和实际干活是两回事。原始模型是成绩单，部署系统是工位、工具和流程；成绩再好，工位太烂也干不成事。","evidence":["能举出 Claude Code、Codex 等属于该层的产品","能说明它为何不亚于预训练刚结束时的智能"],"ap":"为什么 {{name}} 的重要性不亚于模型的原始智能？","origin":["harness"],"mentionCount":1},{"id":"cm_caf38b64","name":"仓库即唯一事实来源","src":"harness","type":"CONCEPTUAL","gloss":"一切指令、状态与清单必须以文件形式落进仓库，否则对 agent 不存在。","level":0,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能复述「agent 看不到的东西就不存在」这一判据","nameEn":"","centrality":0.017,"stage":"now","feynman":"团队里的默契、走廊上的口头共识、某个人脑子里的历史包袱，对 agent 全是虚空。它的世界边界就是它能读到的文件——所以想让它知道的事，都得写进仓库。","evidence":["能复述「agent 看不到的东西就不存在」这一判据","能把口头约定改写成仓库里的文件"],"ap":"按 {{name}}，为什么口头约定对 agent 等于不存在？","origin":["harness"],"mentionCount":1},{"id":"cm_63c544a7","name":"苍白之马（Pale Horse）","src":"notion","type":"CONCEPTUAL","gloss":"Ed Zitron 借《启示录》死亡之马的意象，标记 AI 产业「灾难性转折点」的临界信号。","level":0,"ci":0,"tags":["economy-business"],"k":"judge","kwhy":"能说出判别标准：结构性的、来自核心玩家、不可逆的定价或合同动作","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"Ed Zitron 借用《启示录》死亡之马的意象，标记**「灾难性转折点」的临界信号**。","evidence":["能说出判别标准：结构性的、来自核心玩家、不可逆的定价或合同动作","能把『苍白之马本身』与『脚步声』（如 Copilot 改 token 计费）分开"],"ap":"你能否判断 {{name}} 是否已经出现，依据是什么？","origin":["notion"],"mentionCount":1},{"id":"cm_2335d9d6","name":"操作系统类比","src":"harness","type":"CONCEPTUAL","gloss":"把 harness 类比为操作系统：用简单稳定的接口封装复杂逻辑，靠刻意通用换泛化，并复用既有软件工程实践。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能指出 harness 中哪些设计对应 OS 的封装与接口简化","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"好的操作系统让你不用管硬盘扇区，只要会读文件。harness 也该这样——把脏活封起来，露出一个模型能稳定用的简单界面。","evidence":["能指出 harness 中哪些设计对应 OS 的封装与接口简化","能说明为何允许程序编辑 OS 本身会破坏抽象边界"],"ap":"{{name}} 里哪一层对应 OS 的内核，为什么不能随便改？","origin":["harness"],"mentionCount":1},{"id":"cm_2fd13e0c","name":"查询感知语境化","src":"context","type":"PROCEDURAL","gloss":"把查询同时放在待处理数据的前面与后面，使 decoder-only 模型编码材料时就注意到查询。","level":0,"ci":1,"tags":["context-engineerin igin":["harness"],"mentionCount":1},{"id":"cm_c53dcd72","name":"第二意见","src":"notion","type":"CONCEPTUAL","gloss":"AI 不取代主治医生的第一意见，而是在 EHR 中被动运行的安全网，在诊断走偏前拉一把。","level":0,"ci":0,"tags":["clinical-medicine"],"k":"judge","kwhy":"能说明被动运行、错误发生前识别两点定位","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"","evidence":["能说明被动运行、错误发生前识别两点定位","能引用约五分之一临床医生已用 LLM 求第二意见的调查"],"ap":"{{name}} 能说明 AI 第二意见在临床中的位置吗？","origin":["notion"],"mentionCount":1},{"id":"cm_b3551678","name":"调试散文：一个词就是 bug","src":"harness","type":"CONCEPTUAL","gloss":"Harness 失灵时被调试的代码常是一段英文，唯一调试器是判断力；prompt 里一个词只把行为推偏几度。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能把一次回归定位到 prompt 中的某个形容词","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"代码 bug 有地址，散文 bug 只有语气。改一个形容词就像改一句话的口气，机器不报错，但对方对你的态度已经变了——而这个「态度」正是产品的行为。","evidence":["能把一次回归定位到 prompt 中的某个形容词","能说明为何词级 bug 在源码里可见、在 prompt 里不可见"],"ap":"输出只是轻微跑偏时，你能定位到 {{name}} 的哪个词？","origin":["harness"],"mentionCount":1},{"id":"cm_a37ffd56","name":"动态装配","src":"context","type":"CONCEPTUAL","gloss":"上下文即时生成、为当下任务量身定制：这次是日历数据，下次是邮件或一次网络搜索。","level":0,"ci":1,"tags":["context-engineering"],"k":"use","kwhy":"能举例说明同一 agent 两次请求装配了不同上下文","nameEn":"Dynamic","centrality":0.017,"stage":"when-needed","feynman":"不是准备一个万能资料包，而是每次接到任务后临时抓取：今天要排会就调日历，明天要回客户就调往来邮件。资料的清单本身是随任务变的。","evidence":["能举例说明同一 agent 两次请求装配了不同上下文","能在实现中按任务动态拼装 context"],"ap":"这次请求该往 {{name}} 里装哪些信息？","origin":["context"],"mentionCount":1},{"id":"cm_2c214b3c","name":"独立调用","src":"context","type":"PROCEDURAL","gloss":"四种接入方式中最松的一种：产物已存在后手动调用，用于不必每次都做的横切检查。","level":0,"ci":1,"tags":["verification-eval"],"k":"use","kwhy":"能列出适合场景：提交前安全扫描、发 PR 前无障碍审计、license-header 校验","nameEn":"Standalone","centrality":0.017,"stage":"when-needed","feynman":"像家里的体重秤，想称的时候自己走上去称。适合偶尔查一次的事；但如果你发现自己每顿饭后都要称，那就该换成「吃完自动记录」的机制了。","evidence":["能列出适合场景：提交前安全扫描、发 PR 前无障碍审计、license-header 校验","能在发现自己每次改动后都在跑它时升级为嵌入或链式"],"ap":"这次检查该用 {{name}}，还是升级成链式？","origin":["context"],"mentionCount":1},{"id": :["harness-runtime"],"k":"use","kwhy":"能解释截取为何不改动请求内容","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"在你和模型之间架一个中转站。它不改内容，只是顺手抄一份。抄下来的这份，就是产品说明书里永远不会写的那部分。","evidence":["能解释截取为何不改动请求内容","能用几行代码搭出最小截获代理"],"ap":"怎么用{{name}}抓到 Agent 真正发出的 prompt？","origin":["harness"],"mentionCount":1},{"id":"cm_38d4b92a","name":"非尝试率与拒答模式","src":"context","type":"CONCEPTUAL","gloss":"评测中被剔除并单列报告的拒答比例，因模型顾虑或内容过滤而未作答的那部分调用。","level":0,"ci":1,"tags":["verification-eval"],"k":"judge","kwhy":"能说明拒答为何要单列而非计入失败","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"模型不是只有「对」和「错」两种输出，还有第三种——它决定不玩了。而且拒答的理由常常与任务本身无关（版权顾虑、觉得输入里有笔误）。做长上下文系统时，这类「非尝试」必须被单独观测，否则它会被平均进准确率里，掩盖掉一整类可预测的失败。","evidence":["能说明拒答为何要单列而非计入失败","能指出内容过滤导致整体排除的偏差风险"],"ap":"看评测报告时，{{name}}为什么不能混进错误率？","origin":["context"],"mentionCount":1},{"id":"cm_27f09dcf","name":"非视觉任务的可视化原型","src":"harness","type":"PROCEDURAL","gloss":"即使任务看似不需要图，也先让 Agent 画出多方案的 Mermaid 图并排比较，再进入实现。","level":0,"ci":2,"tags":["code-engineering"],"k":"use","kwhy":"能为一个 API 端点产出多方案对比图","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"接口设计、数据流、状态机本质上都是结构，结构就适合被画出来。「这事不视觉」往往只是没人试过把它画出来。","evidence":["能为一个 API 端点产出多方案对比图","能说明可视化比较如何改善方案选择"],"ap":"你怎么用{{name}}来挑实现方案？","origin":["harness"],"mentionCount":1},{"id":"cm_81c1415e","name":"氛围组请求","src":"harness","type":"CONCEPTUAL","gloss":"看似只为营造氛围、实际未被验证有作用的请求，消耗调用却不改变结果。","level":0,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"能识别产品中这类氛围型调用","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"产品愿意为「等待时那一瞬间的心情」单独调一次模型。功能上毫无必要，体验上却是那点让人愿意继续用下去的东西。","evidence":["能识别产品中这类氛围型调用","能提出用对照实验验证其是否有效"],"ap":"你怎么判断一个功能是不是{{name}}？","origin":["harness"],"mentionCount":1},{"id":"cm_02c17fdd","name":"个人基础设施 → 团队基础设施","src":"context","type":"CONCEPTUAL","gloss":"PR 级门禁是验证从个人基础设施变为团队基础设施的地方：同一份 skills 与标准从服务一人扩展到服务全队。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能指出某项个人检查在 PR 门禁后为每个人省时间","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"你在自家门口修的一段台阶，原本只方便你自己；哪天它被并进小区的公共通道，就成了所有人每天都在用的设施。同一份投入，受益人从一个变成一群。","evidence":["能指出某项个人检查在 PR 门禁后为每个人省时间","能把个人 rubric 提升为团队共享标准"],"ap":"你能说明 {{name}} 在你们团队发生的那一步具体是什么吗？","origin":["context"],"mentionCount":1},{"id":"cm_76d98cb5","name":"给事物命名","src":"notion","type":"META","gloss":"命名是把事物安置到某个位置；像「中年危机」这样的宽泛词会变成杂物间，掩盖未被思考的问题。","level":0,"ci":0,"tags":["thinking-method"],"k":"judge","kwhy":"能为一个模糊困扰找到更精确的命名","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"你给一件事起的名字，决定了你以后到哪里去找它、怎么处理它。把代谢失调命名为「健康问题」，你会去找解决方案；把同一件事命名为「中年危机」，你就把它扔进了无所不包的杂物间——表面上「归类正确」，实际上**把所有具体问题模糊掉、放弃了主动解决**。命名 = 选择思考路径。","evidence":["能为一个模糊困扰找到更精确的命名","能识别某个宽泛词背后是否在逃避反思"],"ap":"你能为这个模糊困扰给出一个更精确的 {{name}} 吗？","origin":["notion"],"mentionCount":1},{"id":"cm_067b5d04","name":"工具即结构化输出","src":"context","type":"CONCEPTUAL","gloss":"工具调用本质就是结构化输出：LLM 输出结构化 json，由确定性代码执行，两者是同一分工的两面。","level":0,"ci":1,"tags":["tools-sandbox"],"k":"judge","kwhy":"能说明工具调用与结构化输出在机制上等价","nameEn":"","centrality":0.017,"stage":"now","feynman":"LLM 其实什么也没「调用」，它只是吐出一段格式规整的话，说自己想干什么；真正动手的是你的代码。把工具去神秘化成一份结构化输出，责任边界立刻清楚了——模型只负责表达意图，执行的正确性永远是软件的事。","evidence":["能说明工具调用与结构化输出在机制上等价","能据此把循环拆成「模型输出」与「确定性代码执行」两段"],"ap":"你能用 {{name}} 解释这个循环里模型和代码各做什么吗？","origin":["context"],"mentionCount":1},{"id":"cm_65b2c79c","name":"工具为你服务，而非你为工具服务","src":"neican","type":"CONCEPTUAL","gloss":"工具应为你服务：你在用工具做事，而不是花时间当工具的开发者与维护者。","level":0,"ci":3,"tags":["code-engineering"],"k":"judge","kwhy":"能指出自己正在维护的某个“变通之法”","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"这是一条关于人与工具关系的原则。判断标准是：你在用工具做事，还是在花时间伺候工具本身？作者给的机制动作是\"移除或自动化变通之法\"——那些为了将就工具而发明的绕路操作，本身就是信号，说明工具没服务好你。它承接了\"以创建者为中心\"的立场。","evidence":["能指出自己正在维护的某个“变通之法”","能给出移除或自动化该变通之法的具体动作"],"ap":"过去一周，{{name}} 在你身上体现为哪些被移除或自动化的变通？","origin":["neican"],"mentionCount":1},{"id":"cm_85b611d5","name":"功能与行为验证的缺口","src":"harness","type":"CONCEPTUAL","gloss":"OpenAI 的工程措施偏长期内部质量与可维护性，缺的是对功能与行为的验证。","level":0,"ci":2,"tags":["verification-eval"],"k":"accept","kwhy":"能指出该作者保留的缺口是 verification of functionality and behaviour","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"一套 harness 可以保证代码结构整洁、边界清楚、文档同步，但这些全是关于「代码长成什么样」的。它做的事对不对，是另一个维度的问题，需要另一套装置来回答——这个位置目前还空着。","evidence":["能指出该作者保留的缺口是 verification of functionality and behaviour","能区分内部质量措施与功能行为验证两类目标"],"ap":"{{name}} 指缺失了哪一类验证？","origin":["harness"],"mentionCount":1},{"id":"cm_09d0ea1a","name":"合成键值检索任务","src":"context","type":"PROCEDURAL","gloss":"从含 k 组随机 UUID 键值对的 JSON 中取指定键的值，剥离语义只考精确检索。","level":0,"ci":1,"tags":["memory-retrieval"],"k":"compute","kwhy":"能描述该测试台的输入与输出","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"一道只需要\"照抄\"的题，不需要任何理解。如果连这个都会在中间位置做错，问题就不在理解力上了。","evidence":["能描述该测试台的输入与输出","能说明它刻意排除了自然语言语义"],"ap":"{{name}} 想考察模型的哪种基础能力？","origin":["context"],"mentionCount":1},{"id":"cm_c1626a4e","name":"护城河清单与插件化路线","src":"harness","type":"CONCEPTUAL","gloss":"逐项检验竞品功能是否真依赖某载体（如 IDE），若不依赖，则载体护城河被削弱，纯插件路线可能更有前途。","level":0,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"能列出某项能力是否强依赖 IDE 的判断依据","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"判断一个产品的壁垒，方法是逐条列出它「多出来的东西」，再逐条问：这一条离得开它现在的形态吗？如果每一条答案都是「离得开」，那壁垒就只是形态惯性。","evidence":["能列出某项能力是否强依赖 IDE 的判断依据","能据此对两条产品路线给出取舍结论"],"ap":"能否用 {{name}} 判断某项功能是否构成载体护城河？","origin":["harness"],"mentionCount":1},{"id":"cm_5bbcf2e0","name":"回声","src":"context","type":"CONCEPTUAL","gloss":"模型返回的常不是新观点，而是你原有那团缠绕想法的回声。","level":0,"ci":1,"tags":["thinking-method"],"k":"judge","kwhy":"能分辨输出中属回声与属新增信息的部分","nameEn":"echo of your own tangle of thoughts","centrality":0.017,"stage":"when-needed","feynman":"它把你说过的话复述回来，只是复述的时候顺手替你理了一遍。","evidence":["能分辨输出中属回声与属新增信息的部分","能据此调整提问以避免自我确认"],"ap":"能否判断这段输出是 {{name}} 还是新观点？","origin":["context"],"mentionCount":1},{"id":"cm_bfc70d0d","name":"会话级累积判断","src":"context","type":"CONCEPTUAL","gloss":"安全判定看整场对话的累积输出而非逐轮孤立看：累积成武器设计包或攻击计划就停，过往协助不构成授权。","level":0,"ci":1,"tags":["safety-governance"],"k":"judge","kwhy":"能对多轮对话做累积而非逐轮的判断","nameEn":"","centrality":0.017,"stage":"now","feynman":"把审查单位从\"一句话\"提到\"一整段关系\"。切香肠战术之所以有效，是因为审查器每次只看一片；把窗口拉长到整根香肠，战术就失效了。这也解释了为什么\"上次你帮我了\"不是有效论据。","evidence":["能对多轮对话做累积而非逐轮的判断","能说明为何过往协助不构成继续授权"],"ap":"能否对一段多轮对话做 {{name}} 并给出停或续？","origin":["context"],"mentionCount":1},{"id":"cm_a6fd3a89","name":"机制与内容分离","src":"harness","type":"CONCEPTUAL","gloss":"把管理context的机制与context里的内容分开：元层演化skill、基层优化context，内层找最佳context、外层找最优skill。","level":0,"ci":2,"tags":["context-engineering"],"k":"judge","kwhy":"能说明内外两层各自优化的对象","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"一层是「这次考试带什么小抄」，另一层是「做小抄的方法论」。方法论改好了，以后每场考试的小抄都更好。","evidence":["能说明内外两层各自优化的对象","能指出skill数据库如何支撑元层的agentic crossover"],"ap":"{{name}}中内层和外层分别优化什么？","origin":["harness"],"mentionCount":1},{"id":"cm_7a436f8a","name":"集中式数据安全与隐私控制点","src":"neican","type":"CONCEPTUAL","gloss":"以 Habitat 服务为统一控制点，集中执行访问控制、审计日志并限制对底层存储的直接访问。","level":0,"ci":3,"tags":["safety-governance"],"k":"judge","kwhy":"能列出这层集中执行的三件事：访问控制策略、审计日志、底层资源访问限制","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"Habitat 作为独立服务后，访问控制策略、审计日志和对底层存储资源的访问限制都集中在一层执行。这样，外部、内部和代理的未授权访问都要先经过 Habitat 的权限边界。拿掉这个控制点，读者就无法理解服务化在安全与隐私上的承重作用。","evidence":["能列出这层集中执行的三件事：访问控制策略、审计日志、底层资源访问限制","能说明缺少该控制点时未授权访问会怎样"],"ap":"{{name}} 集中拦住的是哪几类访问？","origin":["neican"],"mentionCount":1},{"id":"cm_abf595d3","name":"价值定义","src":"harness","type":"CONCEPTUAL","gloss":"人的未来价值在于判断一件事是否还有价值，并定义需求方向、审核结果。","level":0,"ci":2,"tags":["thinking-method"],"k":"accept","kwhy":"能说出人在AI协作中承担的两类动作：定义方向与审核结果","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"AI 可以更快做事，但它不知道“什么值得做”。人最重要的工作，是告诉系统什么有意义，并判断结果是不是符合人的需要。","evidence":["能说出人在AI协作中承担的两类动作：定义方向与审核结果","能说明为何'判断价值'本身成为核心能力"],"ap":"按{{name}}，人应负责的三件事是什么？","origin":["harness"],"mentionCount":1},{"id":"cm_66ce6909","name":"价值函数","src":"notion","type":"CONCEPTUAL","gloss":"预测在状态 s 下策略平均可得奖励的基线函数，用于削减策略梯度方差，即 actor-critic 中的 critic。","level":0,"ci":0,"tags":["model-training"],"k":"judge","kwhy":"能说明 critic 的作用是提供基线、降低策略梯度的方差","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"","evidence":["能说明 critic 的作用是提供基线、降低策略梯度的方差","能解释 LLM 场景下 critic 与策略模型同规模会内存翻倍，故 GRPO 将其移除"],"ap":"在 LLM 训练中，{{name}} 为什么可以被去掉，代价是什么？","origin":["notion"],"mentionCount":1},{"id":"cm_5c74d915","name":"交互 Scalability / Interaction Scalability","src":"harness","type":"CONCEPTUAL","gloss":"当 Agent 产出速度远超人类注意力时，人应当通过什么界面来有效 steer 整个系统。","level":0,"ci":2,"tags":["agent-org"],"k":"judge","kwhy":"能指出瓶颈在人的注意力而不是 Agent 的吞吐","nameEn":"","centrality":0.017,"stage":"deep-dive","feynman":"当 agent 每天产出几十个 PR、人根本看不过来时，人类该怎么介入？OpenAI 的解法是把交互从「写 prompt」简化为「写 ticket 并移动状态」，让项目管理工具（Linear）变成 agent 的 job scheduler，配合自动化验证和熵管理来替代人工 review。","evidence":["能指出瓶颈在人的注意力而不是 Agent 的吞吐","能提出一种让人只处理关键决策点的 steer 界面"],"ap":"{{name}} 要解决的核心矛盾是什么？","origin":["harness"],"mentionCount":1},{"id":"cm_fdbc5cbc","name":"阶段压缩","src":"context","type":"CONCEPTUAL","gloss":"agent 吸收程序性工作后，原本分离的规划、实现、代码评审三个阶段开始合并压缩。","level":0,"ci":1,"tags":["agent-org"],"k":"judge","kwhy":"能说出被压缩的三个阶段名称","nameEn":"compression","centrality":0.017,"stage":"when-needed","feynman":"过去写软件像接力赛：先规划、再实现、再评审，一棒一棒交。agent 能同时插手这几段活儿，于是几个阶段被挤到一起、几乎同时发生，中间的等待和交接被压扁了。整个链条从\"串行\"变得更像\"并行\"。","evidence":["能说出被压缩的三个阶段名称","能解释压缩为何发生——agent 接管了程序性工作"],"ap":"{{name}} 指的是哪三个阶段开始合并？","origin":["context"],"mentionCount":1},{"id":"cm_8aeec1ff","name":"结构适量原则","src":"harness","type":"CONCEPTUAL","gloss":"结构太少则 agent 冲突、重复劳动与漂移，太多则系统脆弱；正确的用量落在两者之间。","level":0,"ci":2,"tags":["multi-agent"],"k":"judge","kwhy":"能列举结构过少与结构过多的各自症状","nameEn":"","centrality":0.017,"stage":"now","feynman":"管得太松，大家互相踩脚；管得太死，一个环节坏掉全线停摆。多 agent 系统的设计不是\"越有秩序越好\"，而是找到那个中间剂量——而且这个剂量不能从人类组织学直接抄。","evidence":["能列举结构过少与结构过多的各自症状","能判断某方案属于哪一侧并说明取舍理由"],"ap":"{{name}} 的两端失败各是什么？","origin":["harness"],"mentionCount":1},{"id":"cm_f6804f52","name":"解空间收窄","src":"harness","type":"CONCEPTUAL","gloss":"以具体架构模式、强制边界和标准化结构换取信任与可靠性，代价是放弃一部分生成任何东西的灵活性。","level":0,"ci":2,"tags":["harness-runtime"],"k":"judge","kwhy":"能说出收窄解空间换来的收益与放弃的灵活性","nameEn":"constraining the solution space","centrality":0.017,"stage":"now","feynman":"可选项越少，出错的花样越少，检查也越容易写。想让 AI 自己跑得更远，你得先把跑道修窄——这是自由与自治之间的交换，不是双赢。","evidence":["能说出收窄解空间换来的收益与放弃的灵活性","能指出 harness 中哪条约束对应哪种可靠性提升"],"ap":"{{name}} 换来了什么、又放弃了什么？","origin":["harness"],"mentionCount":1},{"id":"cm_5797325c","name":"决策慢、执行快","src":"context","type":"CONCEPTUAL","gloss":"决定做什么要慢、想清楚再动手；一旦定了执行要快，不要用 AI 加速决策本身。","level":0,"ci":1,"tags":["thinking-method"],"k":"use","kwhy":"能说出自己先花时间找对问题再动手的一次经历","nameEn":"","centrality":0.017,"stage":"now","feynman":"开车时你可以踩到底，但选目的地绝不能靠掷骰子。把油门和方向盘分开：方向（做什么）要反复确认、慢慢定；一旦定了方向，速度（怎么做）越快越好。AI 是极强的油门，如果你用它来替你选方向，只会更快地开到错误的地方。","evidence":["能说出自己先花时间找对问题再动手的一次经历","能识别「有想法就立刻建」导致的无人知道为何存在的产物"],"ap":"面对新需求，你能否按{{name}}先定问题再全速执行？","origin":["context"],"mentionCount":1},{"id":"cm_a952aba7","name":"可编辑性边界","src":"context","type":"CONCEPTUAL","gloss":"嵌入只对你能掌控、不会被更新覆盖的 skill 生效；内置或插件托管的 skill 必须改用链式。","level":0,"ci":1,"tags":["context-engineering"],"k":"judge","kwhy":"能判断某个 skill 属于自写/项目级还是内置/插件托管","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"你只能在自己的笔记本上写批注；图书馆里随时会换新版的公共书不能乱涂，你涂的字下次借到新版就没了。想给公共书加备注，只能夹一张自己的便签（链式包装），而不是写在书页上。","evidence":["能判断某个 skill 属于自写/项目级还是内置/插件托管","能说明被更新覆盖的 skill 嵌入后为何等于白改"],"ap":"给定一个 skill，你能否按{{name}}判断该用嵌入还是链式？","origin":["context"],"mentionCount":1},{"id":"cm_7554a017","name":"可维护性 / 霰弹式手术","src":"harness","type":"CONCEPTUAL","gloss":"无人工引导时模型难长期维护代码库质量，表现为改一处牵连别处，即 Fowler 所说的霰弹式手术。","level":0,"ci":2,"tags":["code-engineering"],"k":"judge","kwhy":"能举出一处改动波及多个文件的具体例子","nameEn":"","centrality":0.017,"stage":"when-needed","feynman":"好代码库像一台各部件之间有清晰边界的机器，换一个零件不用拆掉半台机器；可维护性差的代码库则像挨了一枪的霰弹——你想改一个小地方，弹片却嵌进了十几个不相干的部位，每处都要单独处理。","evidence":["能举出一处改动波及多个文件的具体例子","能指向 Ousterhout、Martin、Fowler 三本书说明改进方向"],"ap":"能否指出{{name}}在代码里的具体表现？","origin":["harness"],"mentionCount":1},{"id":"cm_fa3c0516","name":"可执行搜索空间","src":"harness","type":"CONCEPTUAL","gloss":"一旦 harness 设计成为可执行的搜索空间，强 coding agent 就能在远超手写 prompt 的同一片设计空间里搜索。","level":0,"ci":2,"tags":["harness-r
