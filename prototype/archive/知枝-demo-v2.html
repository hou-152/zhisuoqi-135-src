<script id="learning-model">
// Portable, deterministic prototype logic. No DOM, network, model, or storage calls.
const LearningModel = (() => {
 const ids=['shot','move','prompt'];
 const fresh=()=>({version:1,route:'home',question:'',order:[...ids],current:'shot',mode:'read',read:[],passed:[],attempts:{},lastAnswers:{},feedback:null,paused:false,checkpointAt:null,transfer:null,lastEvent:'还没有开始学习'});
 function reduce(state,action){
  const s=structuredClone(state),id=s.current;
  if(action.type==='START')return {...fresh(),read:s.read,passed:s.passed,attempts:s.attempts,lastAnswers:s.lastAnswers,transfer:s.transfer,route:'learn',question:action.question,order:action.order||ids,current:(action.order||ids)[0],lastEvent:'从新问题开始，保留已读和练习记录'};
  if(action.type==='NAV'){s.route=action.route;s.lastEvent='切换到'+({home:'问题入口',tree:'知识树',discuss:'讨论清单',learn:'学习路径'}[action.route]||action.route);return s;}
  if(action.type==='RESUME'){s.paused=false;s.route='learn';s.lastEvent='回到上次停下的位置';return s;}
  if(action.type==='PAUSE'&&s.question){s.paused=true;s.checkpointAt=action.time;s.lastEvent='记录当前概念、练习结果与时间';return s;}
  if(s.paused||!s.question)return {...s,lastEvent:'先开始或继续学习，再操作概念'};
  if(action.type==='SELECT'&&ids.includes(action.id)){s.current=action.id;s.mode='read';s.route='learn';s.feedback=null;s.lastEvent='查看概念';}
  if(action.type==='READ'){if(!s.read.includes(id))s.read.push(id);s.mode='quiz';s.feedback=null;s.lastEvent='已读过概念；还需要通过练习';}
  if(action.type==='ANSWER'&&s.mode==='quiz'&&s.read.includes(id)){
   s.attempts[id]=(s.attempts[id]||0)+1;s.lastAnswers[id]=action.index;s.feedback=action.correct?'correct':'wrong';
   s.passed=s.passed.filter(x=>x!==id);if(action.correct)s.passed.push(id);else s.transfer=null;
   s.lastEvent=action.correct?'本题通过；这不等于长期掌握':'本题未通过；保留阅读记录并提示复习';
  }
  if(action.type==='NEXT'&&!s.passed.includes(id)){s.lastEvent='当前概念还没有通过练习，先阅读并作答';return s;}
  if(action.type==='NEXT'&&s.passed.includes(id)){
   const next=s.order.find(x=>!s.passed.includes(x));
   if(next){s.current=next;s.mode='read';s.feedback=null;s.lastEvent='继续学习下一个概念';}
   else{s.mode='finish';s.lastEvent='3 个概念练习已通过，准备组合应用';}
  }
  if(action.type==='TRANSFER'&&s.mode==='finish'){s.transfer={correct:action.correct,values:action.values};s.lastEvent=action.correct?'组合练习通过，仍需真实作品验证':'组合练习需要调整';}
  return s;
 }
 const status=(s,id)=>s.passed.includes(id)?'passed':s.read.includes(id)?'read':'unseen';
 return {fresh,reduce,status,ids};
})();
</script>

 const dependencies=nodes.flatMap(n=>n.prereqs.map(prerequisiteId=>({topicId:n.id,prerequisiteId,strength:'soft',reason:reasons[n.id][prerequisiteId],status:'candidate'})));
 const dependencyReason=(topicId,prerequisiteId)=>reasons[topicId]?.[prerequisiteId]||'';
 const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
 function ancestors(id){const found=new Set();function visit(key){for(const p of byId[key]?.prereqs||[]){if(!found.has(p)){found.add(p);visit(p);}}}visit(id);return [...found];}
 function stats(s){const read=nodes.filter(n=>s.read.includes(n.id)),passed=nodes.filter(n=>s.passed.includes(n.id));return {read:read.length,passed:passed.length,total:nodes.length,readPct:Math.round(read.length/nodes.length*1000)/10,passedPct:Math.round(passed.length/nodes.length*1000)/10};}
 function status(s,id){return s.passed.includes(id)?'passed':s.read.includes(id)?'read':byId[id]?.lessonId?'learnable':'planned';}
 function badges(s){return [
  {name:'看见细节',icon:'▣',rule:'景别题通过',earned:s.passed.includes('shot')},
  {name:'让镜头有意图',icon:'↗',rule:'运镜题通过',earned:s.passed.includes('move')},
  {name:'说清一个镜头',icon:'≋',rule:'提示词题通过',earned:s.passed.includes('prompt')},
  {name:'把概念连起来',icon:'✧',rule:'3 道概念题与组合题均通过',earned:s.passed.length===3&&!!s.transfer?.correct}
 ];}
 return {version,groups,nodes,dependencies,dependencyReason,byId,ancestors,stats,status,badges};
})();

 shot:{name:'景别',tag:'让观众看见什么',title:'先决定，看多近。',text:'同一场戏，远景交代人物在哪里；近景让我们更容易注意到表情和细节。景别决定了画面里哪些信息最突出。先想清楚观众此刻需要看见什么，再选择景别。',take:'想交代环境，看远一点；想看清细节，看近一点。具体效果还取决于构图和上下文。',q:'你要拍“一个人发现手中的车票过期了”。要让观众看清日期，哪种景别更直接？',options:['远景：车站、人群和人物都在画面里','特写：让车票上的日期占据画面的主要部分','全景：完整拍出人物从头到脚的动作'],correct:1,good:'日期是叙事信息。特写把注意力集中到这个细节；远景更适合先交代车站环境。',bad:'先找“观众必须看清的信息”。这一刻需要读到车票上的日期，画面越宽，细节越难辨认。',experience:'示例情境：先用一个车站远景交代空间，再切到车票特写，观众更容易知道“他在哪里、为什么停住”。这是本 Demo 编写的教学案例；实际剪辑还取决于前后镜头。',source:'景别教学示例 · 为原型手写，未进行知乎信源核验。'},
 move:{name:'运镜',tag:'让注意力怎么移动',title:'镜头为什么要动？',text:'推近可以把注意力逐步带向人物或细节；拉远可以逐渐展示人物与环境的关系。固定镜头也能讲故事。运镜先服务于表达，再决定怎么动；“动得多”本身不是质量标准。',take:'问自己：这次移动，让观众多知道了什么？如果答不出来，可以先试固定镜头。',q:'开头只看到人物的脸，结尾想揭示“他独自站在空旷车站”。更直接的镜头选择是？',options:['持续推近，直到只看到人物的眼睛','快速左右摇动，增加动感','缓慢拉远，让周围的空旷环境逐渐出现'],correct:2,good:'拉远扩大可见范围，让环境信息在镜头里逐渐出现。它是否让人感到孤独，还需要场景、表演和声音共同作用。',bad:'这次任务需要“从脸到环境”的信息变化。单纯增加运动量，不能保证观众看见这个变化。',experience:'示例情境：一个作者喜欢大幅运镜，另一个作者用固定镜头等待人物离开。两种选择都可能有效。应比较表达目标与成片效果，不能把单个作者的做法当通用规则。',source:'运镜教学示例 · 为原型手写，未引用真实作者经验。'},

};

let state=LearningModel.fresh(),tab='concept',scene='wide',mapView='overview',coachReply='',notice='',modal=null,scenario='happy',scenarioStep=0,discussionNotes=Array(6).fill(''),toastTimer,exportDraft=null;

function readCheckpoint(){try{
 const p=JSON.parse(localStorage.getItem(STORAGE_KEY));
 if(p?.version!==1||typeof p.question!=='string'||!p.question||!LearningModel.ids.includes(p.current)||!Array.isArray(p.read)||!Array.isArray(p.passed)||!Array.isArray(p.order)||p.order.length!==3||new Set(p.order).size!==3||!p.order.every(x=>LearningModel.ids.includes(x))||!['read','quiz','finish'].includes(p.mode))return null;
 p.read=[...new Set(p.read.filter(x=>LearningModel.ids.includes(x)))];p.passed=[...new Set(p.passed.filter(x=>p.read.includes(x)))];
 p.attempts=Object.fromEntries(LearningModel.ids.map(id=>[id,Number.isSafeInteger(p.attempts?.[id])&&p.attempts[id]>=0?p.attempts[id]:0]));
 p.lastAnswers=Object.fromEntries(LearningModel.ids.filter(id=>Number.isInteger(p.lastAnswers?.[id])&&p.lastAnswers[id]>=0&&p.lastAnswers[id]<=2).map(id=>[id,p.lastAnswers[id]]));
 p.passed=p.passed.filter(id=>p.lastAnswers[id]===LESSONS[id].correct&&p.attempts[id]>0);
 const v=p.transfer?.values,validTransfer=v&&['wide','detail'].includes(v.startFrame)&&['pull','push'].includes(v.movement)&&['feeling','room'].includes(v.ending);
 p.transfer=validTransfer?{values:{startFrame:v.startFrame,movement:v.movement,ending:v.ending},correct:v.startFrame==='detail'&&v.movement==='pull'&&v.ending==='room'}:null;
 p.feedback=p.mode==='quiz'&&p.read.includes(p.current)&&p.attempts[p.current]>0&&p.lastAnswers[p.current]!==undefined?(p.passed.includes(p.current)?'correct':'wrong'):null;
 if(p.mode==='quiz'&&!p.read.includes(p.current))p.mode='read';
 if(p.passed.length<3){p.transfer=null;if(p.mode==='finish')p.mode='read';}return p;
}catch{return null;}}

function treeMap(){const pos={shot:[28,47],move:[72,47],prompt:[50,71]};return `<aside><div class="map-card"><div class="map-head"><h3>你的知识，正在连接</h3><span class="small" style="color:var(--muted)"><i class="live-dot"></i>${state.read.length?'生长中':'等待萌芽'}</span></div><div class="map-canvas"><svg class="map-svg" viewBox="0 0 300 320" preserveAspectRatio="none" aria-hidden="true"><path d="M150 76V106Q150 119 136 119H84V149M150 106Q150 119 164 119H216V149M84 170V187Q84 199 100 199H136Q150 199 150 216M216 170V187Q216 199 200 199H164Q150 199 150 216" fill="none" stroke="#c6d6b5" stroke-width="1.5" stroke-dasharray="4 4"/></svg><div class="tree-node root" style="left:50%;top:21%">AI 视频<span class="node-sub">${state.question?'这次问题的学习路径':'候选路径'}</span></div>${LearningModel.ids.map(id=>`<button class="tree-node ${LearningModel.status(state,id)} ${state.route==='learn'&&state.current===id&&state.mode!=='finish'?'current':''}" style="left:${pos[id][0]}%;top:${pos[id][1]}%" onclick="selectNode('${id}')" aria-label="${LESSONS[id].name}，${statusLabel(id)}">${state.passed.includes(id)?'✓ ':''}${LESSONS[id].name}<span class="node-sub">${statusLabel(id)}</span></button>`).join('')}<div class="seed">${state.read.length?'你可以点回任一概念，重新理解它':'虚线只是下一步，还不是你的学习记录'}</div></div><div class="map-empty-note">${state.read.length?'每个节点保留阅读与练习状态。学过的概念，成为下一次探索的起点。':'你的个人树还是空的。先带着一个问题出发，这里会留下你走过的路径。'}</div><div class="map-stats"><div><strong>${state.read.length}<span style="font-size:13px;color:var(--muted)"> / 3</span></strong><small>本路径已读概念</small></div><div><strong>${state.passed.length}</strong><small>本题练习通过</small></div></div><div class="map-footer"><div class="legend"><span><i></i>待探索</span><span><i class="read"></i>读过</span><span><i class="passed"></i>本题通过</span></div><button onclick="openAtlas()">看技能地图 ↗</button></div></div><div class="side-note"><h3>学过，不必再散落。</h3><p>阅读之后留下概念，练习之后留下证据。<br>一次答对不等于长期掌握。</p></div></aside>`;}
function statusLabel(id){return state.passed.includes(id)?'本题通过':state.read.includes(id)?'读过 · 待巩固':'待探索';}
function home(){return `${atlasTeaser()}${(state.question||checkpoint)?`<div class="resume"><div><strong>${state.question?'你还有一段探索可以继续':'找到上次保存的学习断点'}</strong><p>${esc(state.question||checkpoint.question)}${checkpoint?.checkpointAt&&!state.question?' · '+formatTime(checkpoint.checkpointAt):''}</p></div><button class="btn secondary" onclick="resumeLearning(${!state.question})">接着学 <span>→</span></button></div>`:''}<div class="layout"><section class="main-column"><div class="hero"><div class="eyebrow">A QUESTION IS A SEED</div><h1>从一个问题开始，<br>长出你的<em>知识树。</em></h1><p>把“好像懂了”变成一次具体的理解。<br>在问题、案例和小练习之间，找到下一步。</p><form class="question-form" onsubmit="submitQuestion(event)"><label for="question">最近，什么让你好奇？</label><textarea id="question" name="question" maxlength="300" placeholder="比如：为什么我的 AI 视频总像 PPT？"></textarea><div class="question-bottom"><span class="pill">本次可体验：AI 视频镜头语言</span><button class="btn" type="submit">开始探索 <span class="arrow">↗</span></button></div></form>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}</div><div class="section-head"><h3>还不知道怎么问？从这里开始</h3><p>约 5 分钟</p></div><div class="question-cards">${QUESTIONS.map((q,i)=>`<button class="question-card" onclick="startQuestion(${i})"><span class="card-icon">${q.icon}</span><span><strong>${q.title}</strong><small>${q.desc} &nbsp; · &nbsp; 3 个概念</small></span><span class="arrow">↗</span></button>`).join('')}</div><div class="process"><span>01 选一个问题</span><span>→</span><span>02 理解与练习</span><span>→</span><span>03 长出知识树</span></div></section>${treeMap()}</div>`;}
function sceneGraphic(){const close=scene==='close',pull=scene==='pull';return `<div class="scene"><svg viewBox="0 0 540 230" role="img" aria-label="${close?'近景示意，人物占据画面主体':pull?'拉远的起止画幅示意':'远景示意，人物位于空旷车站'}"><rect width="540" height="230" fill="#e7eddb"/><path d="M0 75H540M0 178H540M0 201H540" stroke="#cbd7b8"/><path d="M44 0V179M150 0V179M390 0V179M496 0V179M0 32H540" stroke="#c1cead" stroke-width="5"/><path d="M0 210L540 187M0 230L540 205" stroke="#d0dbc1"/><path d="M72 139h103v6H72zM85 145v25m76-25v25" stroke="#a7b693" fill="#a7b693"/><rect x="390" y="50" width="72" height="23" rx="2" fill="#d4debf"/><text x="426" y="66" text-anchor="middle" font-size="10" fill="#82916d" letter-spacing="3">STATION</text><g transform="${close?'translate(-223,-92) scale(2.2)':'translate(0,0)'}"><circle cx="294" cy="100" r="11" fill="#5d7452"/><path d="M280 122q14-13 28 0l4 36h-36Z" fill="#7c9466"/><path d="m286 158-2 34m18-34 4 34" stroke="#536a49" stroke-width="7" stroke-linecap="round"/><path d="m281 126-12 21 20 2m16-23 14 20-18 2" stroke="#7c9466" stroke-width="7" stroke-linecap="round"/><rect x="285" y="138" width="23" height="13" rx="1" fill="#f6f5e9" transform="rotate(-8 285 138)"/></g>${pull?'<rect x="257" y="70" width="74" height="92" fill="none" stroke="#78945d" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="20" y="18" width="500" height="194" rx="2" fill="none" stroke="#486d3c" stroke-width="1.5"/><path d="m246 113-82-22m0 0 12-3m-12 3 9 10" fill="none" stroke="#486d3c" stroke-width="1.5"/>':''}<rect x="14" y="14" width="108" height="24" rx="4" fill="#f9fbf0" opacity=".93"/><text x="68" y="30" text-anchor="middle" font-size="11" fill="#526e44">${close?'近景 · 人物细节':pull?'从近景 → 全景':'远景 · 环境关系'}</text></svg></div>`;}
function visualExample(){if(state.current==='prompt')return `<div class="callout"><small>模糊的感觉</small><p style="color:#839071;text-decoration:line-through">有电影感，高级，孤独，震撼。</p><p style="margin-top:10px"><small>可检查的镜头描述</small><br>近景，一名旅客抬头。镜头缓慢拉远，结尾呈现他独自站在空旷站台的全景。</p></div>`;return `${sceneGraphic()}<div class="scene-controls" aria-label="切换镜头示意"><button class="${scene==='wide'?'active':''}" onclick="scene='wide';render()">看远景</button><button class="${scene==='close'?'active':''}" onclick="scene='close';render()">看近景</button><button class="${scene==='pull'?'active':''}" onclick="scene='pull';render()">看拉远的起止画幅</button></div><p class="caption">手绘构图示意，用于比较信息范围；不是模型生成视频，也不模拟实际摄影机运动。</p>`;}
function learning(){if(!state.question)return home();const l=LESSONS[state.current];if(state.paused)return `<div class="layout"><section><div class="eyebrow">PICK UP WHERE YOU LEFT OFF</div><div class="saved-screen"><h2>先去忙。<br>这根枝条，等你回来。</h2><p>停在「${l.name}」的${state.mode==='quiz'?'小练习':state.mode==='finish'?'组合练习':'概念解释'}。<br>已读 ${state.read.length} 个概念，${state.passed.length} 道概念练习通过。<br><small>断点时间：${formatTime(state.checkpointAt)}</small></p><button class="btn" onclick="resumeLearning()">从这里继续 →</button><p class="small">只在你点击暂停时保存到当前浏览器。重新打开同一地址后可恢复；不会跨设备同步。</p></div></section>${treeMap()}</div>`;
 if(state.mode==='finish')return finishPage();return `<div class="layout"><section><div class="stage-top"><button class="text-btn" onclick="nav('home')">← 返回探索</button><button class="text-btn" onclick="pauseLearning()">Ⅱ 暂停并保存</button></div><div class="eyebrow">LEARNING PATH · ${state.order.indexOf(state.current)+1} / 3</div><p class="course-title">${esc(state.question)}</p>${state.read.length===0?'<p class="route-note">先从镜头表达这个角度找线索：画面给了什么信息、信息怎样变化、指令是否具体。生成模型和素材本身也可能影响结果。</p>':''}<div class="steps">${state.order.map(id=>`<div class="step ${state.passed.includes(id)?'done':state.current===id?'active':''}" title="${LESSONS[id].name}"></div>`).join('')}</div><article class="lesson"><div class="lesson-tabs"><button class="${tab==='concept'?'active':''}" onclick="tab='concept';render()">${state.mode==='quiz'?'小练习':'概念解释'}</button><button class="${tab==='experience'?'active':''}" onclick="tab='experience';render()">实践案例</button><button onclick="openModal('sources')">查看依据 ↗</button></div><div class="lesson-body"><span class="pill">${l.name} &nbsp; / &nbsp; ${l.tag}</span>${tab==='experience'?`<h2 style="margin-top:16px">放进真实场景，会怎样？</h2><div class="notice">教学情境示例 · 非真实知乎回答</div><p class="lesson-copy">${l.experience}</p><div class="callout">案例帮助理解概念；本例不会自动成为知识树上的新节点。</div>`:state.mode==='quiz'?`<h2 style="margin-top:16px">换个情境，试试看。</h2><p class="lesson-copy">${l.q}</p><div class="answers">${l.options.map((o,i)=>`<button class="answer ${state.lastAnswers[state.current]===i?'selected':''}" onclick="answer(${i})"><span class="answer-letter">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}</div>${state.feedback?`<div class="feedback ${state.feedback==='wrong'?'wrong':''}" role="status"><strong>${state.feedback==='correct'?'✓ 这道题，你用上了这个概念。':'再想一步，知识树会保留你的阅读记录。'}</strong>${state.feedback==='correct'?l.good:l.bad}</div>`:''}${atlasAchievementNotice()}<p class="caption">通过这道题只说明本次作答正确。这里不评价长期掌握程度。</p>`:`<h2 style="margin-top:16px">${l.title}</h2><p class="lesson-copy">${l.text}</p>${visualExample()}<div class="callout">${l.take}</div>`}</div><div class="lesson-actions"><button class="source-inline" onclick="openModal('sources')">素材性质：手写教学示例</button>${tab==='experience'?`<button class="btn" onclick="tab='concept';render()">回到${state.mode==='quiz'?'练习':'概念'} →</button>`:state.mode==='quiz'?`<button class="btn" onclick="nextLesson()" ${state.passed.includes(state.current)?'':'disabled'}>${state.passed.length===3?'组合应用，完成这段探索':'继续，下一个概念'} →</button>`:`<button class="btn" onclick="readLesson()">读完了，试一道题 →</button>`}</div></article><div class="coach"><strong>还差一点理解？</strong><span class="small" style="color:var(--muted)">　预设追问示范 · 无模型连接</span><form class="coach-form" onsubmit="askCoach(event)"><label class="sr-only" for="followup">追问当前概念</label><input id="followup" name="followup" maxlength="250" placeholder="试试：举个例子 / 为什么"><button>追问 ↗</button></form>${coachReply?`<p style="margin-top:12px" role="status">${esc(coachReply)}</p>`:''}</div></section>${treeMap()}</div>`;}
function finishPage(){return `<div class="layout"><section><div class="stage-top"><button class="text-btn" onclick="nav('tree')">查看知识树 ↗</button><button class="text-btn" onclick="pauseLearning()">Ⅱ 暂停并保存</button></div><div class="summary-card"><div class="summary-badge">♧</div><div class="eyebrow">THREE CONCEPTS, ONE CONNECTION</div><h2 style="margin:12px 0">枝叶连起来，<br>试着用它讲一个镜头。</h2><p>你已通过 ${state.passed.length} 道概念题。接下来把景别、运镜和提示词组合起来。</p><div class="callout">新任务：先看清桌上的一把旧钥匙，再揭示它放在一间空屋里。让观众先注意钥匙，后发现环境。</div><form onsubmit="submitTransfer(event)"><div class="transfer-field"><label for="startFrame">镜头从哪里开始？</label><select id="startFrame" name="startFrame" required><option value="">选择起始画面</option><option value="wide" ${state.transfer?.values.startFrame==='wide'?'selected':''}>房间的全景，钥匙很小</option><option value="detail" ${state.transfer?.values.startFrame==='detail'?'selected':''}>钥匙的特写，细节清楚</option></select></div><div class="transfer-field"><label for="movement">怎样引入空屋的信息？</label><select id="movement" name="movement" required><option value="">选择镜头变化</option><option value="pull" ${state.transfer?.values.movement==='pull'?'selected':''}>缓慢拉远，逐步带出房间</option><option value="push" ${state.transfer?.values.movement==='push'?'selected':''}>继续推近，让钥匙填满画面</option></select></div><div class="transfer-field"><label for="ending">怎样描述最后的画面？</label><select id="ending" name="ending" required><option value="">选择结束描述</option><option value="feeling" ${state.transfer?.values.ending==='feeling'?'selected':''}>震撼、史诗、高级、有电影感</option><option value="room" ${state.transfer?.values.ending==='room'?'selected':''}>全景：一张旧桌，空屋里没有人</option></select></div><button class="btn" style="margin-top:19px">检查这组镜头选择 →</button></form>${state.transfer?`<div class="feedback ${state.transfer.correct?'':'wrong'}" role="status"><strong>${state.transfer.correct?'✓ 你把 3 个概念用在了一个新场景里。':'还需要调整镜头的信息顺序。'}</strong>${state.transfer.correct?'特写让人先注意钥匙；拉远逐步呈现空屋；结束画面明确了要检查的内容。下一步应实际生成一段视频，比较预期与结果。':'目标是先看清钥匙，再揭示环境。检查起点够不够近、镜头是否逐渐放大可见范围、终点是否描述了具体画面。'}</div>`:''}<div class="button-row"><button class="btn secondary" onclick="openAtlas('prompt',true)">回到技能地图 ↗</button><button class="btn quiet" onclick="exportLearning()">下载学习卡 ↓</button></div></div></section>${treeMap()}</div>`;}
function submitTransfer(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));act({type:'TRANSFER',values:v,correct:v.startFrame==='detail'&&v.movement==='pull'&&v.ending==='room'});}

function discussionPage(){return `<div class="discussion-hero"><div><div class="eyebrow">FROM PROTOTYPE TO DECISIONS</div><h1 style="margin:13px 0">下一场会，围着体验聊。</h1><p style="color:var(--muted)">这些是为了做出原型而暂定的选择，尚未经过用户验证或团队确认。</p></div><button class="btn secondary" onclick="exportDiscussion()">导出讨论记录 ↓</button></div><div class="notice">当前还没有真实试用结果。先让一个人独立走完整段，再记录他在哪一步停住。</div><div class="discuss-grid">${DECISIONS.map((d,i)=>`<article class="decision"><span class="pill">${d[0]}</span><h3>${d[1]}</h3><p><b>Demo 暂定：</b>${d[2]}</p><p><b>暴露的问题：</b>${d[3]}</p><p><b>下一步怎么验证：</b>${d[4]}</p><div class="source-note">讨论依据：${d[5]}</div><label class="sr-only" for="note-${i}">关于${d[1]}的讨论记录</label><textarea id="note-${i}" placeholder="记录用户原话、团队决定或负责人……" oninput="discussionNotes[${i}]=this.value">${esc(discussionNotes[i])}</textarea></article>`).join('')}</div><p class="caption">备注仅留在本页内存中；请导出后再关闭页面。导出的结论不会自动成为正式产品规格。</p>`;}
function formatTime(t){if(!t)return '尚未保存';return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function exportFile(name,content){exportDraft={name,content};openModal('export');}
function exportLearning(){if(!state.question){toast('先开始一次探索，再导出学习卡。');return;}exportFile('知枝-本次学习卡.md',`# 知枝 · 本次学习卡\n\n问题：${state.question}\n\n地图：${AtlasModel.version}；已读 ${AtlasModel.stats(state).read}/18（${AtlasModel.stats(state).readPct}%）；练习通过 ${AtlasModel.stats(state).passed}/18（${AtlasModel.stats(state).passedPct}%）。\n\n${state.order.map(id=>`- ${LESSONS[id].name}：${statusLabel(id)}；作答 ${state.attempts[id]||0} 次。`).join('\n')}\n\n组合练习：${state.transfer?(state.transfer.correct?'本题通过':'需调整'):'尚未作答'}\n\n下一步：实际生成一个镜头，并比较起始画面、镜头变化和结束画面。\n\n边界：手写教学示例，未接入知乎或 AI；通过本题不代表长期掌握。\n`);toast('学习卡已生成，可复制或下载。');}
function exportDiscussion(){exportFile('知枝-原型讨论记录.md',`# 知枝 · 原型讨论记录\n\n状态：候选设计，尚未经过团队确认或真实用户验证。\n\n${DECISIONS.map((d,i)=>`## ${d[1]}\n\n- 暂定：${d[2]}\n- 问题：${d[3]}\n- 验证：${d[4]}\n- 依据：${d[5]}\n\n讨论记录：${discussionNotes[i]||'未填写'}\n`).join('\n')}\n`);toast('讨论记录已生成，可复制或下载。');}
function openModal(kind){modal=kind;renderModal();document.querySelector('.modal .close')?.focus();}
function closeModal(){modal=null;document.querySelector('#modal-root').innerHTML='';}
const SCENARIOS={happy:{label:'正常学习',desc:'看一个概念，再答对题。观察“读过”与“本题通过”何时出现。',steps:['从第一个问题开始','读完“景别”','选择车票特写','继续到“运镜”'],actions:[()=>startQuestion(0),()=>readLesson(),()=>answer(1),()=>nextLesson()]},wrong:{label:'答错再理解',desc:'先答错，再修正。答错只保留阅读记录，不能完成当前练习。',steps:['开始同一道题','读完“景别”','选错：车站远景','修正为车票特写'],actions:[()=>startQuestion(0),()=>readLesson(),()=>answer(0),()=>answer(1)]},pause:{label:'中断与返回',desc:'在练习中暂停，保存断点。也可以在保存后刷新页面，再从首页继续。',steps:['开始学习','读完“景别”','暂停并保存','恢复上次位置'],actions:[()=>startQuestion(0),()=>readLesson(),()=>pauseLearning(),()=>resumeLearning(true)]},boundary:{label:'跳过与来源',desc:'只看内容能否算通过？来源未接入时是否被伪装成已经检索？',steps:['开始学习','尝试跳过练习','读完概念后查看状态','查看素材来源'],actions:[()=>startQuestion(0),()=>act({type:'NEXT'}),()=>readLesson(),()=>openModal('sources')]}};
function changeScenario(key){scenario=key;scenarioStep=0;state=LearningModel.fresh();resetView();render();}
function runScenario(i){if(i!==scenarioStep)return;SCENARIOS[scenario].actions[i]();scenarioStep++;renderModal();}
function renderModal(){if(!modal){document.querySelector('#modal-root').innerHTML='';return;}let title,body;if(modal==='export'){title=exportDraft.name;body=`<p class="caption">内容已在下方生成。可以直接复制；若浏览器支持下载，也可保存为 Markdown 文件。</p><label class="sr-only" for="export-content">导出内容</label><textarea id="export-content" class="export-preview" readonly>${esc(exportDraft.content)}</textarea><div class="button-row"><button class="btn secondary" onclick="document.querySelector('.export-preview').select();toast('已选中全文，按 Command + C 或 Ctrl + C 复制。')">全选文本</button><a class="btn" href="data:text/markdown;charset=utf-8,${encodeURIComponent(exportDraft.content)}" download="${esc(exportDraft.name)}">下载 .md 文件 ↓</a></div>`;}else if(modal==='about'){title='这份原型，想验证什么？';body=`<p class="lesson-copy">用户能否从具体问题出发，经过少量概念解释和练习，形成可回看、可继续的个人知识结构？</p><div class="source-card"><h3>已经可以操作</h3><p>3 个问题入口、3 段概念学习、镜头构图切换、对错反馈、预设追问、18 节点技能地图、推荐前置路径、节点覆盖率、独立点亮预览、暂停断点、学习卡与讨论记录导出。</p></div><div class="source-card"><h3>模拟范围</h3><p>这是可丢弃的单文件交互原型。素材与反馈由作者手写；没有真实模型调用、知乎检索、视频生成、账号、跨设备同步或跨主题学习合并。同一组 3 个概念在不同问题间共享本页记录；点击暂停才保存。地图另外 15 个节点没有制作课程。</p></div><div class="source-card"><h3>等待你们验证</h3><p>问题入口是否清楚、节点点亮的含义、总览会不会增加负担、学习是否能迁移。流程走通不代表这些判断已获证实。</p></div>`;}else if(modal==='sources'){title='内容从哪里来？';body=`<div class="notice">尚未连接知乎检索和生成模型。下面把产品讨论依据与教学示例分别说明。</div><div class="source-card"><span class="pill">学习素材 · 手写示例</span><h3 style="margin-top:8px">景别、运镜与镜头提示词</h3><p>${state.question?LESSONS[state.current].source:'3 段课程、练习和反馈均为本原型编写。'}构图为代码绘制示意图；案例没有虚构作者、点赞数或知乎链接。正式版需要用可追溯资料替换、核验。</p></div><div class="source-card"><span class="pill">地图结构参考 · 原创示例数据</span><h3 style="margin-top:8px">Marble Skill Taxonomy 与会议中的 Minecraft 类比</h3><p>借鉴“微知识点、推荐前置关系、可观察表现”的组织方式。此图的 18 个 AI 视频节点、文案、连线和界面由本 Demo 编写，没有导入 Marble 的课程数据或可视化代码。关系属于候选学习建议，不是经验证的唯一先修顺序。</p><p><a href="https://github.com/withmarbleapp/os-taxonomy" target="_blank" rel="noopener noreferrer">查看参考仓库 ↗</a> · 地图覆盖率只计算本地图 v1 的 18 个节点；点亮效果预览与个人进度隔离。</p></div><div class="source-card"><span class="pill">产品依据 · 用户提供</span><h3 style="margin-top:8px">《AI 知识树产品路径讨论会》PDF</h3><p>第 1 页 00:07：先跑通 AI 领域。00:57–02:49：在总览中看见学习位置与成就。03:08–04:05：中断后的记录与返回。第 2 页 05:46–07:01：从问题形成个人树，并可看总览。07:49–09:18：前台结构仍需细化。</p></div><div class="source-card"><span class="pill">产品依据 · 用户提供的整理稿</span><h3 style="margin-top:8px">《AI 学习助手与个人知识树》</h3><p>基于 2026-08-25 22:13 讨论整理。01:17–03:22：交互、导图与练习；16:14–25:12：AI 视频和新手入口；26:52–36:44：知识与经验的关系；38:04：从一个问题开始学习并形成个人树。整理稿是二次加工材料。</p></div><p class="caption">两份资料包含自动转写，不确定用词仍保留。主办方对外部资料的规则、内容许可与真实引用方案尚未核实。</p>`;}else{title='演示工具 · 看见状态变化';body=`<div class="state-grid"><div><span>当前问题</span>${esc(state.question||'未选择')}</div><div><span>停留位置</span>${state.question?LESSONS[state.current].name+' · '+({read:'解释',quiz:'练习',finish:'组合应用'})[state.mode]:'首页'}</div><div><span>阅读记录</span>${state.read.map(id=>LESSONS[id].name).join('、')||'无'}</div><div><span>概念练习通过</span>${state.passed.map(id=>LESSONS[id].name).join('、')||'无'}</div><div><span>本次作答次数</span>${LearningModel.ids.map(id=>LESSONS[id].name+' '+(state.attempts[id]||0)).join(' / ')}</div><div><span>断点</span>${state.paused?'已暂停':'未暂停'} · ${checkpoint?'浏览器中有快照':'未保存'}</div><div><span>组合练习</span>${state.transfer?(state.transfer.correct?'本题通过':'需调整'):'未作答'}</div><div><span>真实数据接入</span>未接入知乎 / 无模型调用</div><div style="grid-column:1/-1"><span>最近变化</span>${esc(state.lastEvent)}</div></div><div class="scenario-tabs" role="group" aria-label="引导演示情境">${Object.entries(SCENARIOS).map(([k,v])=>`<button class="${scenario===k?'active':''}" onclick="changeScenario('${k}')">${v.label}</button>`).join('')}</div><p class="caption">${SCENARIOS[scenario].desc} 切换情境会重置本页学习；已保存的断点保留。</p>${SCENARIOS[scenario].steps.map((s,i)=>`<button class="scenario-step ${i<scenarioStep?'done':''}" onclick="runScenario(${i})" ${i!==scenarioStep?'disabled':''}>${i<scenarioStep?'✓':i+1}　${s}</button>`).join('')}<div class="button-row"><button class="btn secondary" onclick="state=LearningModel.fresh();resetView();scenarioStep=0;render()">重置本页学习</button><button class="btn quiet" onclick="clearCheckpoint()">清除本 Demo 保存的断点</button></div>`;}document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title" style="font-size:21px">${title}</h2><button class="close" onclick="closeModal()" aria-label="关闭对话框">×</button></div>${body}</section></div>`;}
function clearCheckpoint(){try{localStorage.removeItem(STORAGE_KEY);checkpoint=null;toast('已清除本 Demo 的断点；其他浏览器数据不受影响。');renderModal();}catch{toast('当前浏览器不允许修改本地存储。');}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&modal){const list=[...document.querySelectorAll('.modal button:not(:disabled),.modal a,.modal input,.modal textarea,.modal select')];if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function render(){document.querySelector('#app').innerHTML=shell(state.route==='tree'?treePage():state.route==='discuss'?discussionPage():state.route==='learn'?learning():home());renderModal();}
let atlasTarget=null,atlasGroup='all',atlasPreview=false,atlasFlash=false;
let atlasZoom=Math.max(.65,Math.min(1,(innerWidth-286)/1300));
function atlasState(){return atlasPreview?{...LearningModel.fresh(),read:['shot','move','prompt'],passed:['shot','move','prompt'],transfer:{correct:true}}:state;}
function atlasLabel(s,id){const status=AtlasModel.status(s,id);return ({passed:'本题通过',read:'读过 · 待巩固',learnable:'可进入学习',planned:'课程待制作'})[status];}
function atlasUpdate(fn){const el=document.querySelector('.atlas-window');const old=el?{left:el.scrollLeft,top:el.scrollTop}:null;fn();render();const next=document.querySelector('.atlas-window');if(old&&next){next.scrollLeft=old.left;next.scrollTop=old.top;}}
function openAtlas(id=null,flash=false){atlasPreview=false;atlasTarget=id;atlasGroup='all';atlasFlash=flash;mapView='overview';nav('tree');}
function chooseAtlasNode(id){atlasUpdate(()=>{atlasTarget=id;atlasGroup='all';atlasFlash=false;});}
function changeAtlasGroup(group){atlasUpdate(()=>{atlasGroup=group;atlasTarget=null;atlasFlash=false;});}
function previewAtlas(){atlasUpdate(()=>{mapView='overview';atlasPreview=!atlasPreview;atlasFlash=atlasPreview;atlasTarget=null;atlasGroup='all';});}
function zoomAtlas(delta){atlasUpdate(()=>{atlasZoom=Math.max(.3,Math.min(1.6,atlasZoom+delta));atlasFlash=false;});}
function fitAtlas(){const box=document.querySelector('.atlas-window');atlasUpdate(()=>{atlasZoom=Math.min(1,(box?.clientWidth||900)/1300,(box?.clientHeight||600)/760);atlasFlash=false;});}
function enterAtlasLesson(id){if(atlasPreview){toast('先退出效果预览，再开始自己的学习。');return;}if(!AtlasModel.byId[id]?.lessonId){toast('这个节点的课程还在制作，当前可以查看推荐路径。');return;}if(!state.question)startQuestion(id==='move'?1:id==='prompt'?2:0);else{if(state.paused)state=LearningModel.reduce(state,{type:'RESUME'});selectNode(id);}}
function atlasTeaser(){const counts=AtlasModel.stats(state);return `<button class="atlas-teaser" onclick="openAtlas()"><span class="atlas-teaser-icon">✧</span><span><small>新 · 你的技能地图</small><strong>把学过的，放回整个世界。</strong><small>AI 视频入门 · ${counts.total} 个节点 · 已读 ${counts.readPct}%</small></span><span class="arrow">↗</span></button>`;}
function atlasMetrics(s){const m=AtlasModel.stats(s);return `<div class="atlas-metrics"><div class="atlas-metric"><div class="metric-title">本地图 · 已读覆盖</div><strong>${m.readPct}% <small>${m.read} / ${m.total} 个节点</small></strong><p>点击读完，才留下记录</p><div class="atlas-progress-track"><span style="width:${m.readPct}%"></span></div></div><div class="atlas-metric"><div class="metric-title">本地图 · 练习通过</div><strong>${m.passedPct}% <small>${m.passed} / ${m.total} 个节点</small></strong><p>当前题目通过，不等于长期掌握</p><div class="atlas-progress-track"><span style="width:${m.passedPct}%"></span></div></div><div class="atlas-metric"><div class="metric-title">本次可体验的课程</div><strong>${m.passed} / 3 <small>概念题通过</small></strong><p>另有 ${m.total-3} 个节点的课程待制作</p><div class="atlas-progress-track"><span style="width:${m.passed/3*100}%"></span></div></div></div>`;}
function atlasGraph(s){const ancestors=atlasTarget?AtlasModel.ancestors(atlasTarget):[],path=new Set([...ancestors,atlasTarget]);
 const inFocus=n=>atlasTarget?path.has(n.id):atlasGroup==='all'||n.group===atlasGroup;
 const edges=AtlasModel.nodes.flatMap(n=>n.prereqs.map(id=>{const p=AtlasModel.byId[id],lit=s.passed.includes(n.id)&&s.passed.includes(id),traced=atlasTarget&&path.has(n.id)&&path.has(id),dim=!inFocus(n)||!inFocus(p);const dx=Math.max(60,Math.abs(n.x-p.x)*.43);return `<path class="atlas-edge ${lit?'lit':''} ${traced?'traced':''} ${dim?'dim':''}" d="M${p.x+62} ${p.y} C${p.x+62+dx} ${p.y},${n.x-62-dx} ${n.y},${n.x-62} ${n.y}" marker-end="url(#atlas-arrow)"/>`;})).join('');
 return `<section class="atlas-map ${atlasFlash?'atlas-flash':''}" aria-label="AI 视频技能关系地图"><div class="atlas-toolbar"><div><strong>${atlasTarget?'目标：'+AtlasModel.byId[atlasTarget].name:'一张地图，看见已经走过的路。'}</strong><small>${atlasTarget?`金色连线：${ancestors.length} 个建议先了解的概念；不设置硬性学习门槛。`:'点一个节点追溯路径；浅绿的 3 个入口可以开始学习。'}</small></div><div class="atlas-controls"><button onclick="zoomAtlas(-.15)" aria-label="缩小地图">−</button><span class="zoom-label">${Math.round(atlasZoom*100)}%</span><button onclick="zoomAtlas(.15)" aria-label="放大地图">＋</button><button onclick="fitAtlas()">全景</button>${atlasTarget?'<button onclick="chooseAtlasNode(null)">清除路径</button>':''}</div></div><div class="atlas-filter" aria-label="按学习方向筛选"><button class="${atlasGroup==='all'?'active':''}" onclick="changeAtlasGroup('all')">全部方向</button>${Object.entries(AtlasModel.groups).map(([id,g])=>`<button class="${atlasGroup===id?'active':''}" onclick="changeAtlasGroup('${id}')"><i style="--branch:${g.color}"></i>${g.name}</button>`).join('')}</div><div class="atlas-window" tabindex="0" aria-label="可滚动技能地图；使用缩放按钮或方向键浏览"><div class="atlas-space" style="width:${1300*atlasZoom}px;height:${760*atlasZoom}px"><div class="atlas-world" style="transform:scale(${atlasZoom})"><svg width="1300" height="760" viewBox="0 0 1300 760" aria-hidden="true"><defs><marker id="atlas-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b4c28e"/></marker></defs>${edges}</svg>${[[110,'辨认画面'],[330,'表达意图'],[560,'组织输入'],[770,'形成镜头'],[990,'连接成片'],[1200,'作品目标']].map(([x,t])=>`<div class="atlas-column-title" style="left:${x}px">${t}</div>`).join('')}${AtlasModel.nodes.map(n=>`<button class="atlas-node ${AtlasModel.status(s,n.id)} ${n.goal?'goal':''} ${atlasTarget===n.id?'selected':''} ${path.has(n.id)&&atlasTarget?'traced':''} ${!inFocus(n)?'dim':''}" style="left:${n.x}px;top:${n.y}px;--branch:${AtlasModel.groups[n.group].color}" onclick="chooseAtlasNode('${n.id}')" aria-label="${n.name}，${atlasLabel(s,n.id)}，查看路径" aria-pressed="${atlasTarget===n.id}"><strong><span class="node-glyph">${s.passed.includes(n.id)?'✓':n.icon}</span>${n.name}</strong><small>${atlasLabel(s,n.id)}</small></button>`).join('')}</div></div></div><div class="atlas-map-legend"><span><i></i>待探索／课程待制作</span><span><i class="known"></i>读过</span><span><i class="done"></i>本题通过</span><span><i class="path"></i>当前目标路径</span><span class="pan-hint">拖动空白处或滚动查看 · 连线是推荐关系</span></div></section>`;}
function atlasDetail(s){const n=AtlasModel.byId[atlasTarget];if(!n)return `<div class="atlas-detail"><div><span class="pill">给探索一个方向</span><h3>你想抵达哪一个节点？</h3><p>点击地图上的任何概念，就能看见建议先了解什么。地图展示潜在方向，只有你的阅读和作答会改变个人进度。</p></div><div><h3>试着追一条路径</h3><div class="atlas-prereq-list"><button onclick="chooseAtlasNode('prompt')">镜头提示词 <small>从两个概念连接起来</small></button><button onclick="chooseAtlasNode('film')">完成首支 AI 短片 <small>看更远的目标</small></button></div><p>18 个节点与连线均为本 Demo 编写的候选结构。当前不是完整的 AI 视频课程，也不是学科的唯一划分。</p></div></div>`;
 const ancestors=AtlasModel.ancestors(n.id),next=AtlasModel.nodes.filter(x=>x.prereqs.includes(n.id));return `<section class="atlas-detail" id="atlas-detail" aria-label="所选节点详情"><div><span class="pill">${AtlasModel.groups[n.group].name} · ${atlasLabel(s,n.id)}</span><h3>${n.name}</h3><p>${n.description}</p><div class="atlas-evidence">拟观察的表现：${n.evidence}</div>${n.lessonId?`<button class="btn" onclick="enterAtlasLesson('${n.id}')" ${atlasPreview?'disabled':''}>${s.read.includes(n.id)?'回到这个概念':'从这里开始学习'} →</button>`:'<p><b>课程待制作。</b> 当前仅可查看关系与学习目标。</p>'}</div><div><h3>建议先了解</h3>${n.prereqs.length?`<div class="atlas-prereq-list">${n.prereqs.map(id=>`<button onclick="chooseAtlasNode('${id}')">${AtlasModel.byId[id].name}<small>${atlasLabel(s,id)} · 建议关系</small><small>${AtlasModel.dependencyReason(n.id,id)}</small></button>`).join('')}</div>`:'<p class="path-empty">此候选地图没有给它设置前置节点。</p>'}<p>沿路径共涉及 ${ancestors.length} 个前置概念。${ancestors.length?'已读其中 '+ancestors.filter(id=>s.read.includes(id)).length+' 个。':''}这些关系用于推荐，不会强制锁住可体验的课程。</p><h3>接下来可以探索</h3>${next.length?`<div class="atlas-prereq-list">${next.map(x=>`<button onclick="chooseAtlasNode('${x.id}')">${x.name}</button>`).join('')}</div>`:'<p class="path-empty">这里是本地图的作品目标，实际完成需要作品证据。</p>'}</div></section>`;}
function atlasBadges(s){const badges=AtlasModel.badges(s);return `<div class="section-head"><h3>每一步，都留下一个标记。</h3><p>${badges.filter(b=>b.earned).length} / ${badges.length} 个练习标记</p></div><div class="atlas-achievements">${badges.map(b=>`<div class="atlas-badge ${b.earned?'earned':''}"><span class="atlas-badge-symbol">${b.earned?'✓':b.icon}</span><strong>${b.name}</strong><small>${b.rule}<br>${b.earned?'当前条件已满足':'当前条件尚未满足'}</small></div>`).join('')}</div><p class="caption">标记根据当前作答状态计算。复答出错后会回到待巩固；这里不保存永久成就，也不据此评价长期掌握。</p>`;}
function atlasPersonal(){return `<div class="big-tree"><div class="section-head" style="margin-top:0"><h3>我的学习记录</h3><span class="pill">${state.read.length} 个概念留下记录</span></div>${state.read.length?`<p class="small" style="color:var(--muted)">同一个概念在不同问题里出现，只记录一次。切换问题会保留本页进度。</p><div class="atlas-record-grid">${LearningModel.ids.filter(id=>state.read.includes(id)).map(id=>`<article class="personal-node"><span class="pill">${statusLabel(id)}</span><h3>${LESSONS[id].name}</h3><p>${LESSONS[id].tag}<br>作答 ${state.attempts[id]||0} 次</p><button class="text-btn" onclick="openAtlas('${id}')">看它在地图里的位置 ↗</button></article>`).join('')}</div><div class="button-row"><button class="btn" onclick="resumeLearning()">继续学习 →</button><button class="btn secondary" onclick="exportLearning()">导出学习卡 ↓</button></div>`:`<div class="empty"><h3>地图已经在这里，等你留下第一条记录。</h3><p>先完成一个概念，看看它怎样在全景中亮起来。</p><button class="btn" onclick="enterAtlasLesson('shot')">从景别开始 →</button></div>`}</div>${atlasBadges(state)}`;}
function treePage(){const s=atlasState();return `<div class="atlas-heading"><div><div class="eyebrow">YOUR LITTLE CORNER OF A BIG WORLD</div><h1>你的每一步，都在地图上。</h1><p>从看懂一个镜头，到完成一段作品。看见自己走过哪里，也看见下一步。</p></div><div class="atlas-top-buttons"><button class="btn secondary" onclick="previewAtlas()">${atlasPreview?'退出效果预览':'预览点亮效果 ✧'}</button><button class="btn" onclick="enterAtlasLesson('shot')" ${atlasPreview?'disabled':''}>去学一个概念 →</button></div></div><div class="view-tabs atlas-tabs" role="group" aria-label="地图与记录"><button class="${mapView==='overview'?'active':''}" onclick="mapView='overview';atlasPreview=false;atlasFlash=false;render()">技能地图</button><button class="${mapView==='personal'?'active':''}" onclick="mapView='personal';atlasPreview=false;atlasFlash=false;render()">我的学习记录</button></div>${atlasPreview?'<div class="atlas-preview-alert"><span><b>效果预览</b> · 假设这 3 个概念与组合题已经通过。此画面不计入你的进度，也不会保存。</span><button onclick="previewAtlas()">返回我的进度</button></div>':''}${mapView==='personal'?atlasPersonal():`${atlasMetrics(s)}<div class="atlas-note"><span>${AtlasModel.version} · 覆盖率仅针对这 18 个节点，不代表整个 AI 领域。</span><button onclick="openModal('sources')">地图依据与范围 ↗</button></div>${atlasGraph(s)}${atlasDetail(s)}${atlasBadges(s)}`}`;}
function atlasAchievementNotice(){const badges=AtlasModel.badges(state),b=badges[LearningModel.ids.indexOf(state.current)];return state.feedback==='correct'&&b?`<div class="atlas-celebrate"><div><strong>✧ ${b.name}</strong><small>${AtlasModel.stats(state).passed} / 18 个节点练习通过 · 看见自己在全景中的位置</small></div><button onclick="openAtlas('${state.current}',true)">看它亮起来 ↗</button></div>`:'';}
let atlasDrag=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.atlas-window');if(!el||e.target.closest('button')||e.pointerType==='touch')return;atlasDrag={el,x:e.clientX,y:e.clientY,left:el.scrollLeft,top:el.scrollTop};el.classList.add('dragging');el.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!atlasDrag)return;atlasDrag.el.scrollLeft=atlasDrag.left-(e.clientX-atlasDrag.x);atlasDrag.el.scrollTop=atlasDrag.top-(e.clientY-atlasDrag.y);});
document.addEventListener('pointerup',()=>{if(atlasDrag)atlasDrag.el.classList.remove('dragging');atlasDrag=null;});
document.addEventListener('pointercancel',()=>{if(atlasDrag)atlasDrag.el.classList.remove('dragging');atlasDrag=null;});

if(location.hash==='#map'){state.route='tree';mapView='overview';}
render();
</script>
</body>
</html>
