<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知所栖 · 135 基础框架 v3</title>
<style>
  :root{
    --accent:#4f46e5; --accent-2:#3730a3; --accent-soft:#eef2ff;
    --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
    --bg:#f6f7fb; --card:#ffffff; --line:#e2e8f0;
    --ok:#059669; --ok-soft:#ecfdf5;
    --warn:#d97706; --warn-soft:#fffbeb;
    --bad:#dc2626; --bad-soft:#fef2f2;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; padding-bottom:90px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 22px}

  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .topbar{display:flex;align-items:center;gap:12px;padding:13px 0;flex-wrap:wrap}
  .logo{font-weight:800;font-size:17px;letter-spacing:.2px}
  .logo small{color:var(--ink-3);font-weight:400;margin-left:8px;font-size:12px}
  .badge{font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--ink-3)}
  .badge.live{background:var(--ok-soft);color:var(--ok);border-color:#a7f3d0}
  .badge.llm{background:var(--accent-soft);color:var(--accent);border-color:#c7d2fe}
  .pills{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .pill:hover{border-color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex-shrink:0}
  .dot.on{background:var(--ok)}
  .dot.warn{background:var(--warn)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-top:20px;box-shadow:var(--shadow)}
  h1{font-size:26px;line-height:1.35;margin-bottom:8px;letter-spacing:.2px}
  h2{font-size:19px;margin-bottom:8px}
  h3{font-size:15px;margin:16px 0 6px}
  .sub{color:var(--ink-2);font-size:14.5px}
  .muted{color:var(--ink-3);font-size:13px}
  a{color:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:11px;
    padding:10px 20px;font-size:14px;cursor:pointer;margin-top:12px;font-family:inherit;font-weight:500}
  .btn:hover{background:var(--accent-2)}
  .btn.ghost{background:var(--accent-soft);color:var(--accent)}
  .btn.ghost:hover{background:#e0e7ff}
  .btn.sm{padding:5px 12px;font-size:13px;margin-top:0}
  .btn:disabled{background:#cbd5e1;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .tag{display:inline-block;font-size:12px;border-radius:7px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);margin-right:6px;font-weight:500}
  .tag.skill{background:#fdf4ff;color:#a21caf;border:1px solid #f5d0fe}
  .tag.src{background:#f1f5f9;color:var(--ink-3)}

  /* 135 步骤条 */
  .stepper{display:flex;gap:0;margin-top:18px;position:relative}
  .step{flex:1;position:relative;padding:20px 14px 16px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:border-color .15s}
  .step:first-child{border-radius:14px 0 0 14px}
  .step:last-child{border-radius:0 14px 14px 0}
  .step+.step{border-left:none}
  .step:hover{border-color:var(--accent)}
  .step .num{position:absolute;top:-13px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .step.done .num{background:var(--ok)}
  .step.core .num{background:var(--accent)}
  .step h4{font-size:15px;margin-bottom:3px}
  .step .p{font-size:12px;color:var(--ink-3);min-height:34px}
  .step .skill-chip{display:inline-block;font-size:11px;color:#a21caf;background:#fdf4ff;border-radius:6px;padding:1px 7px;margin-top:6px}
  .step .prog{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px}
  @media (max-width:760px){ .stepper{flex-direction:column} .step+.step{border-left:1px solid var(--line);border-top:none} .step:first-child{border-radius:14px 14px 0 0} .step:last-child{border-radius:0 0 14px 14px} }

  /* 模块页头 */
  .mod-head{display:flex;align-items:flex-start;gap:16px}
  .mod-num{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;
    font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mod-num.accept{background:linear-gradient(135deg,#059669,#10b981)}
  .promise{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:9px 14px;font-size:13.5px;color:var(--accent-2);margin-top:14px}

  /* 概念卡 */
  .concept-card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--card);box-shadow:var(--shadow)}
  .concept-card h3{margin:0 0 2px;font-size:16px}
  .lights{display:flex;gap:10px;margin:10px 0;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
  .lights span{display:flex;align-items:center;gap:4px}

  /* 阅读器层切换 */
  .layer-tabs{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
  .layer-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .layer-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .feedback-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .feedback-row button{border:1px dashed var(--ink-3);background:transparent;border-radius:9px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--ink-2);font-family:inherit}
  .feedback-row button:hover{border-color:var(--accent);color:var(--accent)}

  /* 实验台 */
  .stage{background:#0f172a;border-radius:12px;overflow:hidden;margin:12px 0}
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meter{margin-top:8px}
  .meter .bar{height:10px;border-radius:5px;background:#e2e8f0;overflow:hidden;flex:1}
  .meter .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
  .meter .lbl{font-size:12px;color:var(--ink-2);width:110px;flex-shrink:0}

  /* 案例与表格 */
  .option{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;
    background:#fff;padding:13px 16px;margin-top:10px;cursor:pointer;font-size:14px;font-family:inherit}
  .option:hover{border-color:var(--accent)}
  .option.picked{border-color:var(--accent);background:var(--accent-soft)}
  .case-card{border:1px solid var(--line);border-radius:11px;padding:15px;margin-top:10px;background:#fcfcfd}
  .case-card .who{font-size:12px;color:var(--ink-3)}
  table.std{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  table.std th,table.std td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  table.std th{background:#f8fafc;font-weight:600}

  /* 费曼 */
  textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:11px;padding:12px;
    font-size:14px;font-family:inherit;resize:vertical;margin-top:8px}
  .verdict{border-radius:11px;padding:14px;margin-top:12px;font-size:14px}
  .verdict.pass{background:var(--ok-soft);border:1px solid #a7f3d0}
  .verdict.todo{background:var(--bad-soft);border:1px solid #fecaca}
  .checklist li{list-style:none;padding:4px 0;font-size:14px}
  .checklist li::before{content:"○ ";color:var(--ink-3)}
  .checklist li.hit::before{content:"✓ ";color:var(--ok);font-weight:700}
  .evidence-box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-top:12px}

  dialog{border:none;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.25);padding:26px;width:min(480px,92vw)}
  dialog::backdrop{background:rgba(15,23,42,.4)}
  dialog input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;margin:4px 0 10px;font-family:inherit}

  footer{margin-top:34px;border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--ink-3)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    border-radius:10px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
  .toast.show{opacity:.95}

  /* 运镜动画 */
  .cam-stage{height:280px;position:relative;background:#0f172a;border-radius:12px;overflow:hidden}
  .cam-scene{position:absolute;inset:-12%;background:linear-gradient(#1e3a5f 0%,#3b6ea5 55%,#274156 100%)}
  .cam-scene .sun{position:absolute;top:12%;left:70%;width:44px;height:44px;border-radius:50%;background:#fbbf24;box-shadow:0 0 40px #fbbf2488}
  .cam-scene .hill{position:absolute;bottom:18%;left:0;right:0;height:36%;background:#1b4332;border-radius:50% 60% 0 0 / 90% 100% 0 0}
  .cam-scene .figure{position:absolute;bottom:16%;left:46%;width:26px;height:64px}
  .cam-scene .figure .head{width:16px;height:16px;border-radius:50%;background:#f1d3b2;margin:0 auto}
  .cam-scene .figure .body{width:18px;height:40px;border-radius:8px;background:#e63946;margin:2px auto 0}
  .cam-label{position:absolute;top:12px;left:12px;color:#e2e8f0;font-size:13px;background:#00000066;border-radius:8px;padding:4px 10px}
  @keyframes push{from{transform:scale(1)}to{transform:scale(1.55)}}
  @keyframes pull{from{transform:scale(1.55)}to{transform:scale(1)}}
  @keyframes panmove{from{transform:translateX(7%)}to{transform:translateX(-7%)}}
  @keyframes trackmove{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
  .anim-push{animation:push 2.4s ease-in-out forwards}
  .anim-pull{animation:pull 2.4s ease-in-out forwards}
  .anim-pan{animation:panmove 2.4s ease-in-out forwards}
  .anim-track{animation:trackmove 2.4s ease-in-out forwards}
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <div class="logo">知所栖<small>135 基础框架 v3 · 可丢弃原型</small></div>
    <span class="badge" id="mode-badge">检测运行模式…</span>
    <div class="pills" id="pills"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap">
  <div>主线「一个问题 → 3 个概念 → 1 阅读 → 3 决策 → 5 实验 → 费曼验收」；教学正文与题目为<b>手写原创</b>，案例与延伸阅读来自<b>知乎真实检索</b>（2026-09-11，观点归原作者）。</div>
  <div style="margin-top:6px">
    <button class="btn ghost sm" onclick="saveCheckpoint()">保存断点</button>
    <button class="btn ghost sm" onclick="loadCheckpoint()">恢复断点</button>
    <button class="btn ghost sm" onclick="resetAll()">清空演示数据</button>
    <button class="btn ghost sm" onclick="openSettings()">LLM 设置</button>
    <span id="saveinfo"></span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<dialog id="settings">
  <h2 style="font-size:17px">LLM 接入（真实调用）</h2>
  <p class="muted" style="margin-top:4px">OpenAI 兼容接口。Key 仅存本浏览器 localStorage，不经过任何第三方。经 <code>scripts/serve-135.mjs</code> 访问时可留空，走服务端配置。</p>
  <label class="muted">API Base（如 https://api.openai.com/v1）</label>
  <input id="cfg-base" placeholder="https://api.openai.com/v1">
  <label class="muted">API Key</label>
  <input id="cfg-key" type="password" placeholder="sk-…">
  <label class="muted">模型名</label>
  <input id="cfg-model" placeholder="gpt-4o-mini / glm-4-flash …">
  <div class="row" style="margin-top:10px">
    <button class="btn" onclick="saveSettings()">保存</button>
    <button class="btn ghost" onclick="document.getElementById('settings').close()">取消</button>
  </div>
</dialog>

<script>
'use strict';
/* =========================================================
   知所栖 · 135 基础框架 v3
   1 互动阅读器（方法论：dbs-learning 自适应梯度）
   3 案例决策场（方法论：dbs-standard-answer 历史同构→带条件标准答案）
   5 技术实验台（方法论：费曼/提取练习 做→解释→修正）
   费曼演练室 = 验收层（方法论：费曼学习法）
   API：经 scripts/serve-135.mjs 时走真实知乎检索 + LLM 转发；
        双击打开时自动降级（规则引擎 + 检索静态快照），LLM 可直连配置。
   ========================================================= */

const STORE_KEY = 'zss135.checkpoint.v1';
const LLM_KEY = 'zss135.llm.cfg';

/* ---------- 概念数据（正文手写原创；source 为知乎真实检索 2026-09-11） ---------- */
const CONCEPTS = [
  {
    id: 'shot-size', name: '景别', en: 'Shot Size',
    oneLiner: '镜头离得多近，决定观众一次能拿到多少信息。',
    depth: {
      basic: '景别 = 拍摄时镜头离主体多「近」。五档由远到近：远景 → 全景 → 中景 → 近景 → 特写。越远越看到环境，越近越看到细节和表情。',
      mech: '为什么有效：人一次能处理的信息有限。远景把信息给到「世界在哪、什么氛围」，特写把信息收窄到「这个人此刻的感受」。景别的切换，本质是在控制每一秒观众该处理什么信息。',
      apply: '怎么用：写分镜时给每个镜头标档位——开场用远景交代环境，交流用中景，关键情绪用特写。如果你的成片全程一个档位，观众没有信息重点，就会觉得「平」。'
    },
    feyn: {
      points: [
        { label: '景别 = 取景距离决定画面信息量', words: ['距离', '远近', '信息', '多少', '范围'] },
        { label: '远景环境 / 近景情绪细节，各司其职', words: ['环境', '情绪', '细节', '交代', '聚焦'] },
        { label: '单一景别连续使用 ≈ 幻灯片感', words: ['ppt', '幻灯', '单一', '单调', '节奏'] }
      ]
    }
  },
  {
    id: 'camera-move', name: '运镜', en: 'Camera Movement',
    oneLiner: '镜头怎么动，决定观众的注意力往哪走。',
    depth: {
      basic: '运镜 = 镜头怎么运动。基础四式：推（慢慢靠近）、拉（慢慢远离）、摇（原地左右转）、移（平行跟着走）。镜头不动，观众的眼睛就没有被引导。',
      mech: '为什么有效：人会本能地看「动的东西」。镜头推向谁，观众就注意谁；镜头拉开，观众就重新看到环境。运镜是在时间轴上安排注意力的顺序。',
      apply: '怎么用：想强调一个东西 → 推；想揭晓环境 → 拉；想展示空间里还有什么 → 摇；想跟着人物走 → 移。全程无运镜的素材，注意力无处可去，观感就是「呆」。'
    },
    feyn: {
      points: [
        { label: '运镜 = 时间轴上的注意力引导', words: ['注意', '引导', '视线', '眼睛'] },
        { label: '推强调 / 拉交代 / 摇展示空间 / 移跟随', words: ['推', '拉', '摇', '移', '强调', '跟随'] },
        { label: '不写运镜 → 默认固定机位 → 画面呆板', words: ['固定', '呆', '不动', '默认', '静止'] }
      ]
    }
  },
  {
    id: 'shot-prompt', name: '镜头提示词', en: 'Shot Prompt',
    oneLiner: '把景别和运镜写进提示词，模型才知道你要「拍」而不是「画」。',
    depth: {
      basic: '镜头提示词 = 景别 + 运镜 + 主体动作 + 光线风格，一句一个镜头。「黄昏光线，镜头缓缓推向女孩的侧脸」——重点是把「怎么变」写出来。',
      mech: '为什么有效：视频模型手里已经有画面，缺的信息是「接下来发生什么」。知乎作者叁虫的实战结论：它不听「画面是什么」，只听「画面怎么变」——静态名词堆得再多，不如一句「金币从木桌上滑落」。',
      apply: '怎么用：逐镜头写，每句含一个运镜动词和一个主体动作。避免两种写法：一句话生成整段（模型随机发挥）；全静态名词（等于让模型自己猜运动）。'
    },
    feyn: {
      points: [
        { label: '提示词结构 = 景别 + 运镜 + 主体 + 光线风格', words: ['景别', '运镜', '结构', '光线', '风格'] },
        { label: '逐镜头写，不是一句话生成整段', words: ['逐', '每个镜头', '分镜', '一句'] },
        { label: '要写「怎么变」，不是「是什么」', words: ['怎么变', '变化', '动作', '滑落', '运动'] }
      ]
    }
  }
];

/* ---------- 真实延伸阅读（2026-09-11 知乎全网搜索 API 检索） ---------- */
const SEARCH_META = { date: '2026-09-11', via: '知乎数据开放平台 · 全网搜索 API' };
const REAL_SOURCES = {
  'shot-size': { title: 'AI短剧画面再精美，连起来却像PPT？', author: '元力共生AI', url: 'https://zhuanlan.zhihu.com/p/2076013358734751118', quote: '真正的 AI 导演思维不是「这一张图怎么变得更漂亮」，而是「这一镜我要让观众看到什么、感受到什么」。' },
  'camera-move': { title: 'AI漫剧告别塑料PPT：从万能运镜公式到全链路工作流', author: '凯k', url: 'https://zhuanlan.zhihu.com/p/2044568158770574648', quote: 'AI 最怕画面太稳，太稳就显假。带一点手持的呼吸感抖动和运动模糊，反而能乱真。' },
  'shot-prompt': { title: 'AI生成的视频总像PPT翻页？折腾三天我发现，得教它怎么动', author: '叁虫', url: 'https://zhuanlan.zhihu.com/p/2067145132948862465', quote: '你告诉它一百遍「这是一张木桌」，不如告诉它一句「金币从木桌上滑落」。' }
};

/* ---------- 案例决策场：知乎真实检索（2026-09-11），观点归原作者 ---------- */
const CASE_DATA = {
  situation: '客户看完你用 AI 生成的 15 秒产品宣传片段，反馈：「画面太呆，像幻灯片，没有电影感。」你手里只有一条 5 秒的固定机位全景素材，预算为零，交付时间只剩明天。',
  options: [
    { id: 'A', text: '推倒重来：改提示词，加上景别与运镜描述，重新生成整段。' },
    { id: 'B', text: '先剪再说：用现有 5 秒全景，在剪辑里加一个缓速推近（数字推镜），切成两镜再用。' },
    { id: 'C', text: '包装救场：保持画面不动，加字幕节奏 + BGM 掩盖呆板感。' }
  ],
  cases: [
    {

/* ---------- 状态 ---------- */
let state = freshState();
function freshState(){
  const s = { read: {}, lab: {}, case: {}, feyn: {}, feedback: {}, conclusion: {}, remediation: {} };
  CONCEPTS.forEach(c => { s.read[c.id]=false; s.lab[c.id]=false; s.case[c.id]=false; s.feyn[c.id]='none'; s.remediation[c.id]='none'; });
  s.caseDone = false;
  /* 限速器：跳过验收是一种合法结果，记为「未验收」，不记为「未通过」。
     依据：误报会导致整体弃用（Parasuraman & Riley 1997），所以必须可跳过、可终止。 */
  s.feynSkipped = false;
  return s;
}

/* ---------- 运行模式与 LLM 接入 ----------
   standalone（双击）→ 离线规则 + 检索静态快照
   serve（scripts/serve-135.mjs）→ /api/search 真实检索 + /api/llm 转发
   直连 → 页面内配置 OpenAI 兼容接口（LLM 设置） */
let MODE = { agent:false, llm:false, label:'离线规则（未接 API）' };
async function detectMode(){
  try{
    const r = await fetch('/api/health', {method:'GET'});
    if (r.ok){ const j = await r.json(); MODE.agent = true; MODE.llm = !!j.llm; }
  }catch{ MODE.agent = false; }
  if (!MODE.llm){
    const cfg = getLLMCfg();
    if (cfg.base && cfg.key && cfg.model) MODE.llm = true;
  }
  MODE.label = MODE.llm ? (MODE.agent ? '轻量 Agent：真实检索 + LLM' : 'LLM 直连') : (MODE.agent ? '真实检索 + 规则判定' : '离线规则（未接 API）');
  const b = document.getElementById('mode-badge');
  b.textContent = MODE.label;
  b.className = 'badge' + (MODE.llm ? ' llm' : '') + (MODE.agent ? ' live' : '');
}
function getLLMCfg(){
  try{ return JSON.parse(localStorage.getItem(LLM_KEY) || '{}'); }catch{ return {}; }
}
function openSettings(){
  const c = getLLMCfg();
  document.getElementById('cfg-base').value = c.base || '';
  document.getElementById('cfg-key').value = c.key || '';
  document.getElementById('cfg-model').value = c.model || '';
  document.getElementById('settings').showModal();
}
function saveSettings(){
  localStorage.setItem(LLM_KEY, JSON.stringify({
    base: document.getElementById('cfg-base').value.trim(),
    key: document.getElementById('cfg-key').value.trim(),
    model: document.getElementById('cfg-model').value.trim(),
  }));
  document.getElementById('settings').close();
  detectMode();
  toast('LLM 配置已保存（仅本浏览器）');
}
async function callLLM(messages){
  const cfg = getLLMCfg();
  if (MODE.agent){ // 服务端转发（Key 不落浏览器）
    const r = await fetch('/api/llm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return { text: j.content, tokens: j.tokens || 0 };
  }
  if (!(cfg.base && cfg.key && cfg.model)) throw new Error('llm-not-configured');
  const r = await fetch(`${cfg.base.replace(/\/$/, '')}/chat/completions`, {
    method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${cfg.key}`},
    body: JSON.stringify({ model: cfg.model, messages, temperature:0, response_format:{type:'json_object'} })
  });
  if (!r.ok) throw new Error('llm-http-' + r.status);
  const j = await r.json();
  return { text: j.choices?.[0]?.message?.content || '', tokens: j.usage?.total_tokens ?? 0 };
}

/* ---------- 费曼检验清单（与 scripts/ab-feynman-test.mjs 同步） ---------- */
function buildChecklist(){
  const map = {};
  CONCEPTS.forEach(c => map[c.id] = c.feyn.points.map(p => p.label));
  return map;
}
function ruleBasedReview(text){
  const t = text.toLowerCase();
  const result = {};
  CONCEPTS.forEach(c => {
    const detail = c.feyn.points.map(p => ({ label: p.label, hit: p.words.some(w => t.includes(w.toLowerCase())) }));
    const hits = detail.filter(d => d.hit).length;
    result[c.id] = { pass: hits >= 2, hits, total: detail.length, detail };
  });
  return { engine: 'A-rules', result };
}
async function liveEvidence(){
  if (MODE.agent){
    try{
      const queries = { 'shot-size':'AI视频 景别 镜头语言', 'camera-move':'AI视频 运镜', 'shot-prompt':'AI视频 提示词 怎么变' };
      const out = {};
      for (const [cid,q] of Object.entries(queries)){
        const r = await fetch('/api/search', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query:q}) });
        const j = await r.json();
        out[cid] = (j.items || []).slice(0,2).map(it => `${it.title}（${it.author}）：${it.excerpt.slice(0,80)}`);
      }
      return { evidence: out, source: 'live' };
    }catch{ /* 落到快照 */ }
  }
  const out = {};
  CONCEPTS.forEach(c => { out[c.id] = [`${REAL_SOURCES[c.id].author}《${REAL_SOURCES[c.id].title}》：「${REAL_SOURCES[c.id].quote}」`]; });
  return { evidence: out, source: 'snapshot' };
}
async function reviewFeynman(text){
  const { evidence, source } = await liveEvidence();
  if (MODE.llm){
    try{
      const { text: out } = await callLLM([
        { role:'system', content:'你是学习产品的费曼检验引擎。只输出 JSON。' },
        { role:'user', content: `学习者复述了所学内容。请逐概念判断每条要点是否被覆盖（covered 为要点下标数组），每概念 ≥2 条覆盖才 pass。知乎证据仅作对照。输出：{"result":{"概念id":{"pass":bool,"covered":[下标]}}}\n要点：${JSON.stringify(buildChecklist())}\n知乎证据：${JSON.stringify(evidence)}\n复述：${text}` }
      ]);
      const parsed = JSON.parse(out);
      const result = {};
      CONCEPTS.forEach(c => {
        const r = parsed?.result?.[c.id] ?? parsed?.[c.id] ?? {};
        const covered = new Set(r.covered || []);
        const detail = c.feyn.points.map((p,i) => ({ label: p.label, hit: covered.has(i) }));
        result[c.id] = { pass: !!r.pass, hits: detail.filter(d=>d.hit).length, total: detail.length, detail };
      });
      return { engine: MODE.agent ? 'C1-pipeline(llm+live-search)' : 'B-direct-llm', evidenceSource: source, result };
    }catch(e){ /* LLM 失败 → 规则回退 */ }
  }
  const r = ruleBasedReview(text);
  return { ...r, evidenceSource: source };
}

  { key:'拉', anim:'anim-pull', note:'拉镜头：镜头远离主体。作用 = 交代，「原来是在这样一个环境里」。' },
  { key:'摇', anim:'anim-pan',  note:'摇镜头：机位不动，镜头左右转。作用 = 展示空间里还有什么。' },
  { key:'移', anim:'anim-track',note:'移镜头：机位平行移动。作用 = 跟随主体，或制造视差层次。' }
];
let labTries = {};
function labTry(id, n){ labTries[id] = (labTries[id]||0) + 1; checkLabDone(id, n); }
function checkLabDone(id, need){
  if (!state.lab[id] && labTries[id] >= need){
    state.lab[id] = true; renderPills();
    toast('实验完成 ✓ 「动手过」已记录');
    const hint = document.getElementById('labdone');
    if (hint) hint.innerHTML = '✓ 实验完成。写一句你的结论，然后<button class="btn sm" onclick="go(\'#/feynman\')">进费曼演练室验收</button>';
  }
}
function viewLab(id){
  const c = concept(id); if (!c) return viewHome();
  labTries[id] = labTries[id] || 0;
  let inner = '';
  if (id === 'shot-size') inner = labShotSize();
  if (id === 'camera-move') inner = labCameraMove();
  if (id === 'shot-prompt') inner = labPrompt();
  app.innerHTML = `
  <div class="card">
    <button class="btn ghost sm" onclick="go('#/concept/${c.id}')">← ${c.name}</button>
    <div class="mod-head" style="margin-top:14px">
      <div class="mod-num">5</div>
      <div>
        <h1 style="margin-bottom:4px">${c.name} · 技术实验台</h1>
        <span class="tag skill">方法论：费曼 / 提取练习 —— 动手 → 用自己的话解释 → 修正</span>
      </div>
    </div>
    <div class="promise"><b>完成后，你能独立做出：</b>改变参数并预测结果，写出你自己的结论（不是抄页面上那句）。</div>
    ${inner}
    <h3>你的结论（用自己的话）</h3>
    <textarea id="lab-conclusion" style="min-height:70px" placeholder="例如：推镜头让注意力集中到……所以……">${esc(state.conclusion[id]||'')}</textarea>
    <button class="btn ghost sm" onclick="saveConclusion('${id}')">保存结论</button>
    <div id="labdone" class="sub" style="margin-top:10px">${state.lab[id]?'✓ 本概念实验已完成。':''}</div>
  </div>`;
  if (id === 'shot-size') setStage(0);
}
function saveConclusion(id){
  state.conclusion[id] = document.getElementById('lab-conclusion').value.trim();
  toast(state.conclusion[id] ? '结论已保存 ✓' : '结论为空');
}
function labShotSize(){
  return `
  <p class="sub">点不同景别，看同一个场景在取景器里的变化。问题是「观众先拿到什么信息」。</p>
  <div class="stage">
    <svg id="ssize" viewBox="0 0 480 270" width="100%" style="display:block">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>
      <rect width="480" height="270" fill="url(#sky)"/>
      <circle cx="360" cy="60" r="26" fill="#fbbf24"/>
      <path d="M0 200 Q120 150 240 195 T480 185 V270 H0 Z" fill="#4d7c0f" opacity="0.75"/>
      <path d="M0 225 Q160 185 320 220 T480 215 V270 H0 Z" fill="#3f6212"/>
      <g id="figure">
        <circle cx="240" cy="146" r="9" fill="#f1d3b2"/>
        <rect x="232" y="156" width="16" height="34" rx="6" fill="#e63946"/>
        <rect x="234" y="190" width="5" height="18" rx="2" fill="#1e293b"/>
        <rect x="241" y="190" width="5" height="18" rx="2" fill="#1e293b"/>
      </g>
    </svg>
  </div>
  <div class="seg" id="sizeseg">
    ${SIZE_STAGES.map((s,i)=>`<button onclick="setStage(${i})">${s.key}</button>`).join('')}
  </div>
  <div id="sizenote" class="sub"></div>
  <div class="meter row" style="margin-top:8px"><span class="lbl">环境信息</span><div class="bar"><i id="envbar"></i></div></div>
  <div class="meter row"><span class="lbl">人物细节/情绪</span><div class="bar"><i id="detbar"></i></div></div>
  <p class="muted" style="margin-top:8px">已试 <span id="sizetry">0</span>/3 档。</p>`;
}
function setStage(i){
  const s = SIZE_STAGES[i];
  const g = document.getElementById('figure');
  if (!g) return;
  const tx = 240 - s.scale * s.fpx, ty = 135 - s.scale * s.fpy;
  g.setAttribute('transform', `translate(${tx} ${ty}) scale(${s.scale})`);
  document.getElementById('sizenote').innerHTML = `<b>${s.key}</b>：${esc(s.note)}`;
  document.getElementById('envbar').style.width = s.env + '%';
  document.getElementById('detbar').style.width = s.detail + '%';
  document.querySelectorAll('#sizeseg button').forEach((b,bi)=>b.classList.toggle('active', bi===i));
  if (!labTries['shot-size']) labTries['shot-size'] = 0;
  if (!setStage.seen) setStage.seen = new Set();
  const before = setStage.seen.size;
  setStage.seen.add(i);
  if (setStage.seen.size > before){
    document.getElementById('sizetry').textContent = Math.min(setStage.seen.size, 3);
    labTry('shot-size', 3);
  }
}
function labCameraMove(){
  return `
  <p class="sub">选一个运镜，按「播放」看镜头怎么牵着你的眼睛走。至少体验 3 种不同运镜。</p>
  <div class="cam-stage">
    <div class="cam-scene" id="camscene">
      <div class="sun"></div><div class="hill"></div>
      <div class="figure"><div class="head"></div><div class="body"></div></div>
    </div>
    <div class="cam-label" id="camlabel">选运镜 → 播放</div>
  </div>
  <div class="seg" id="moveseg">
    ${MOVE_STAGES.map((m,i)=>`<button onclick="pickMove(${i})">${m.key}</button>`).join('')}
  </div>
  <div id="movenote" class="sub"></div>
  <button class="btn" onclick="playMove()">播放</button>
  <p class="muted" style="margin-top:8px">已试 <span id="movetry">0</span>/3 种运镜。</p>`;
}
let currentMove = -1;
function pickMove(i){
  currentMove = i;
  document.getElementById('movenote').innerHTML = esc(MOVE_STAGES[i].note);
  document.querySelectorAll('#moveseg button').forEach((b,bi)=>b.classList.toggle('active', bi===i));
  document.getElementById('camlabel').textContent = MOVE_STAGES[i].key + '镜头 · 待播放';
}
function playMove(){
  if (currentMove < 0){ toast('先选一种运镜'); return; }
  const sc = document.getElementById('camscene');
  sc.className = 'cam-scene'; void sc.offsetWidth;
  const m = MOVE_STAGES[currentMove];
  sc.classList.add(m.anim);
  document.getElementById('camlabel').textContent = m.key + '镜头 · 播放中…';
  if (!playMove.seen) playMove.seen = new Set();
  const before = playMove.seen.size;
  playMove.seen.add(currentMove);
  if (playMove.seen.size > before){
    document.getElementById('movetry').textContent = playMove.seen.size;
    labTry('camera-move', 3);
  }
}
function labPrompt(){
  return `
  <p class="sub">把景别、运镜写进提示词，对照「预期画面」。验证阅读器里那条知乎结论：模型听「怎么变」，不听「是什么」。</p>
  <div class="row">
    <select id="p-size" style="padding:8px;border-radius:8px;border:1px solid var(--line)">
      ${SIZE_STAGES.map(s=>`<option>${s.key}</option>`).join('')}
    </select>
    <select id="p-move" style="padding:8px;border-radius:8px;border:1px solid var(--line)">
      ${MOVE_STAGES.map(m=>`<option>${m.key}镜头</option>`).join('')}
      <option>固定机位</option>
    </select>
    <input id="p-subj" value="穿红色外套的女孩站在街角" style="flex:1;min-width:200px;padding:8px;border-radius:8px;border:1px solid var(--line)">
  </div>
  <button class="btn" onclick="buildPrompt()" style="margin-top:12px">生成提示词</button>
  <div id="p-out" style="margin-top:14px"></div>`;
}
function buildPrompt(){
  const size = document.getElementById('p-size').value;
  const move = document.getElementById('p-move').value;
  const subj = document.getElementById('p-subj').value.trim() || '（主体）';
  const stage = SIZE_STAGES.find(s=>s.key===size);
  const prompt = `${size}，${move}，${subj}，黄昏光线，电影感`;
  let diag = `<div class="verdict pass"><b>生成的镜头提示词：</b><br><code>${esc(prompt)}</code>
    <br><br><b>预期画面：</b>${esc(stage.note)} 镜头${move==='固定机位'?'保持不动':'以「'+move+'」的方式运动'}，观众的注意力会${move==='固定机位'?'停在画面整体上':'被镜头带着走向主体'}。</div>`;
  if (move === '固定机位'){
    diag += `<div class="notice">诊断：固定机位 + ${size}，整段都用这种组合就是「像 PPT」的标准配方。实验台建议：至少给关键镜头一个运镜动词。</div>`;
  }
  document.getElementById('p-out').innerHTML = diag;
  labTry('shot-prompt', 1);
}

/* ---------- 3 案例决策场（dbs-standard-answer） ---------- */
let casePick1 = null;
function viewCase(){
  app.innerHTML = `
  <div class="card">
    <button class="btn ghost sm" onclick="go('#/')">← 返回主线</button>
    <div class="mod-head" style="margin-top:14px">
      <div class="mod-num">3</div>
      <div>
        <h1 style="margin-bottom:4px">案例决策场</h1>
        <span class="tag skill">方法论：dbs-standard-answer —— 先决策，再做历史同构比较，得到带条件的标准答案</span>
      </div>
    </div>
    <div class="promise"><b>完成后，你能独立做出：</b>在有约束（预算/时间）的情境里，给出带理由的选择，并说清它在什么条件下成立。</div>
    <h3>情境</h3>
    <p>${esc(CASE_DATA.situation)}</p>
    <h3>第一步：你的决策（先选，不许偷看案例）</h3>
    <div id="c1">${CASE_DATA.options.map(o=>
      `<button class="option" onclick="pickCase1('${o.id}')"><b>${o.id}.</b> ${esc(o.text)}</button>`).join('')}</div>
    <div id="c2"></div>
  </div>`;
}
function pickCase1(id){
  casePick1 = id;
  document.querySelectorAll('#c1 .option').forEach(b=>b.classList.remove('picked'));
  document.querySelector(`#c1 .option:nth-child(${CASE_DATA.options.findIndex(o=>o.id===id)+1})`).classList.add('picked');

}
function revealCases(){
  if (!casePick1) return;
  document.getElementById('c2').innerHTML = `
    <h3>第二步：历史同构比较 <span class="muted">（知乎真实检索 · ${SEARCH_META.date} · ${SEARCH_META.via}）</span></h3>
    ${CASE_DATA.cases.map(cs=>`
      <div class="case-card">
        <b>${esc(cs.title)}</b>
        <div class="who">${esc(cs.who)}</div>
        <p class="sub" style="margin-top:6px">${esc(cs.view)}</p>
        <a class="muted" href="${esc(cs.url)}" target="_blank" rel="noopener">查看知乎原文 →</a>
      </div>`).join('')}
    <h3>第三步：带条件的标准答案（不是唯一答案，是「什么条件下怎么选」）</h3>
    <table class="std">
      <tr><th>你的条件</th><th>建议路线</th><th>依据</th></tr>
      ${CASE_DATA.standardAnswer.map(r=>`<tr><td>${esc(r.cond)}</td><td>${esc(r.route)}</td><td>${esc(r.basis)}</td></tr>`).join('')}
    </table>
    <h3>第四步：修订你的决策</h3>
    <div id="c3">${CASE_DATA.options.map(o=>
      `<button class="option" onclick="pickCase2('${o.id}')"><b>${o.id}.</b> ${esc(o.text)}</button>`).join('')}</div>
    <div id="c4"></div>`;
  document.getElementById('c2').scrollIntoView({behavior:'smooth'});
}
function pickCase2(id){
  const changed = casePick1 !== id;
  CONCEPTS.forEach(c => { state.case[c.id] = true; });
  state.caseDone = true; renderPills();
  document.getElementById('c4').innerHTML = `
    <div class="verdict pass"><b>你的决策轨迹：</b>先选 ${casePick1}${changed?` → 案例后修订为 ${id}`:' → 案例后坚持 ' + id}。</div>
    <div class="card" style="margin-top:12px"><h3>讲评</h3><p class="sub">${esc(CASE_DATA.debrief)}</p></div>
    <button class="btn" onclick="go('#/lab/camera-move')">下一步：5 实验台验证你的选择 →</button>`;
  toast('案例决策已记录 ✓');
}

/* ---------- 费曼演练室（验收层） ---------- */
let feynRunning = false;
function viewFeynman(){
  const allDone = CONCEPTS.every(c => state.read[c.id] || state.lab[c.id]);
  app.innerHTML = `
  <div class="card">
    <button class="btn ghost sm" onclick="go('#/')">← 返回主线</button>
    <div class="mod-head" style="margin-top:14px">
      <div class="mod-num accept">✓</div>
      <div>
        <h1 style="margin-bottom:4px">费曼演练室 · 验收</h1>
        <span class="tag skill">方法论：费曼学习法 —— 用自己的话解释，暴露缺口，漏哪倒回哪</span>
      </div>
    </div>
    <div class="promise"><b>验收标准：</b>你能独立讲出「为什么像 PPT、怎么解决」，并说清自己的漏洞在哪。</div>
    <p class="sub">题目：用你自己的话讲讲——「为什么 AI 生成的视频会像 PPT？你会怎么解决？」AI 逐要点检验，漏掉的要点会把你带回对应模块补课。</p>
    <div class="notice"><b>验收标准（可当场判定）：</b>3 个概念都要讲到，每个概念至少讲到位 2 条要点，全部通过才算验收。这是本产品的「限速器」——不是给你打分，是防止循环转得比理解快。</div>
    ${allDone?'':'<div class="notice">提示：你还有概念没过「读 / 实验」。现在就讲也可以——漏点会被如实标出来，这正是检验的意义。</div>'}
    <textarea id="feyn-input" placeholder="例如：我觉得像 PPT 是因为……（用自己的话，不用背术语）"></textarea>
    <div class="row">
      <button class="btn" id="feyn-btn" onclick="runFeynman()">开始检验</button>
      <button class="btn ghost sm" onclick="skipFeynman()">这次跳过验收</button>
      <button class="btn ghost sm" onclick="openSettings()">LLM 设置</button>
      <span class="muted" id="feyn-engine">当前引擎：${MODE.label}</span>
    </div>
    <div id="feyn-out"></div>
  </div>`;
}
/* 跳过是合法结果：记「未验收」，不记「未通过」。误报会让人整体关掉这个功能。 */
function skipFeynman(){
  state.feynSkipped = true;
  go('#/');
  toast('已记为「未验收」（不算未通过），随时可回来补');
}
async function runFeynman(){
  const text = document.getElementById('feyn-input').value.trim();
  if (text.length < 10){ toast('再多写几句，太短检验不出东西'); return; }
  if (feynRunning) return;
  feynRunning = true;
  const btn = document.getElementById('feyn-btn');
  btn.disabled = true; btn.textContent = '检验中…';
  const report = await reviewFeynman(text);
  feynRunning = false;
  btn.disabled = false; btn.textContent = '重新检验';
  const allPass = Object.values(report.result).every(r => r.pass);
  state.feynSkipped = false; // 一旦真的讲了一遍，就不算跳过了
  let html = `<h3 style="margin-top:16px">检验报告 <span class="muted">引擎：${report.engine} · 证据：${report.evidenceSource==='live'?'知乎实时检索':'知乎静态快照（2026-09-11）'}</span></h3>`;
  let closed = 0; // 本轮真正补上的旧漏点数
  CONCEPTS.forEach(c => {
    const r = report.result[c.id];
    /* 限速器（跟进练习）：漏点 → 倒回模块 → 再讲一次才算「补上」。
       只记「补过」不记「通过」；通过与否始终由复述决定，不由点按钮决定。 */
    const wasPending = state.remediation[c.id] === 'pending';
    const remediated = wasPending && r.pass;
    if (remediated) closed++;
    state.feyn[c.id] = r.pass ? 'pass' : 'todo';
    state.remediation[c.id] = r.pass ? (remediated ? 'done' : 'none') : 'pending';
    const badge = remediated
      ? '<span class="muted"> · 补上了上一轮的漏点 ✓</span>'
      : (r.pass ? '' : '<span class="muted"> · 已记入待补清单</span>');
    html += `<div class="verdict ${r.pass?'pass':'todo'}">
      <b>${c.name}：${r.pass?'✓ 讲到位了':'△ 有漏点'}${r.total?`（覆盖 ${r.hits}/${r.total}）`:''}</b>${badge}
      <ul class="checklist">${(r.detail||c.feyn.points.map(p=>({label:p.label,hit:r.pass}))).map(d=>
        `<li class="${d.hit?'hit':''}">${esc(d.label)}${d.hit?'':'　<button class="btn sm" onclick="go(\'#/lab/'+c.id+'\')">回实验台补这个 →</button>'}</li>`).join('')}</ul>
    </div>`;
  });
  html += allPass
    ? `<div class="verdict pass" style="margin-top:12px"><b>验收通过 ✓</b> 三个概念的要点你都讲到了。${closed?`本轮补上了 ${closed} 个上一轮的漏点。`:''}下一步：换一个新问题进入下一轮（验收结果作为下一轮的起点）。</div>`
    : `<div class="verdict todo" style="margin-top:12px"><b>有漏点。</b>按按钮回实验台补课，补完回来重新讲一遍同一处——只补不重讲不算补上。这就是「漏哪、倒回哪、再验收」的循环。</div>`;
  document.getElementById('feyn-out').innerHTML = html;
  renderPills();
}

/* ---------- 断点 ---------- */
function saveCheckpoint(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ at: Date.now(), state, labTries }));
    document.getElementById('saveinfo').textContent = ' · 已保存 ' + new Date().toLocaleTimeString();
    toast('断点已保存（仅本浏览器）');
  }catch(e){ toast('保存失败：浏览器存储不可用'); }
}
function loadCheckpoint(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw){ toast('没有已保存的断点'); return; }
    const data = JSON.parse(raw);
    state = Object.assign(freshState(), data.state);
    labTries = data.labTries || {};
    renderPills(); route();
    document.getElementById('saveinfo').textContent = ' · 已恢复 ' + new Date(data.at).toLocaleTimeString();
    toast('断点已恢复');
  }catch(e){ toast('恢复失败：断点数据损坏'); }
}
function resetAll(){
  state = freshState(); labTries = {}; readerLayer = {};
  setStage.seen = null; playMove.seen = null;
  casePick1 = null;
  localStorage.removeItem(STORE_KEY);
  renderPills(); route(); toast('演示数据已清空');
}

/* ---------- 路由 ---------- */
function route(){
  const h = location.hash || '#/';
  renderPills();
  window.scrollTo(0,0);
  let m;
  if (h === '#/' || h === '#') return viewHome();
  if ((m = h.match(/^#\/concept\/(.+)$/))) return viewConcept(m[1]);
  if ((m = h.match(/^#\/read\/(.+)$/))) return viewRead(m[1]);
  if ((m = h.match(/^#\/lab\/(.+)$/))) return viewLab(m[1]);
  if (h === '#/case') return viewCase();
  if (h === '#/feynman') return viewFeynman();
  return viewHome();
}
window.addEventListener('hashchange', route);
route();
detectMode();
</script>
