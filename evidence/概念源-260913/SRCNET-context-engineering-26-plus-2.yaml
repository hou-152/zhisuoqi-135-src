  - entry_id: SRCNET-context-engineering-26-plus-2-023
    article_title: Claude Code 在读提示词前为何已发送 3.3 万 Token
    article_title_line: 4740
    location:
      start_line: 4769
      end_line: 4771
    observed_terms:
      - logging proxy
      - harness
    relation_paraphrase: 在 harness 与模型之间记录请求和用量，才能重建系统行为。
    exact_excerpt: |-
      - 对生产 Agent 而言，“系统到底发送了什么”不应靠 folklore 回答。尤其在 EU AI Act Article 12 要求记录和理解系统行为的背景下，请求重建能力本身就是治理基础。
      - 研究团队把 logging proxy 插在 harness 与模型 endpoint 之间，逐请求记录两类 ground truth：完整 JSON payload，以及 API 返回的 input、cache write、cache read、output usage。
      - Payload capture 回答“发送了什么”，usage block 回答“计费了什么”。只有两者结合，才能把模型成本拆回 system prompt、tool schema、scaffolding、用户输入和会话增长。
    excerpt_sha256: sha256:40939b3c928f053db3327c8cf13c658fd5e41a7dd17a5b6509791042f1adcb97
  - entry_id: SRCNET-context-engineering-26-plus-2-024
    article_title: 只改两个 API 设置，OpenAI 把 ARC-AGI-3 成绩提到三倍
    article_title_line: 4970
    location:
      start_line: 5047
      end_line: 5051
    observed_terms:
      - compaction
      - 上下文窗口
    relation_paraphrase: Compaction 用摘要替代滚动截断，以处理窗口上限并保留早期经验。
    exact_excerpt: |-
      - 第二步改进是用 compaction 替换滚动截断。官方 harness 处理上下文上限的方式是：当对话上下文超过 175,000 字符时，丢弃最旧的消息。
      - 滚动截断有两个弊端：
      - 模型丢失了更早的观察与动作。
      - 模型在任务的大部分时间里都运行在一个更满的上下文窗口下，而这会轻微损害表现。
      - 启用 compaction 之后，GPT-5.6 Sol 能在更长的运行中更好地保住它对每个游戏学到的东西，用更少的输出 token 拿到更高的分数。
    excerpt_sha256: sha256:08b4f83ae1eb147aef4e7babe1a871ebf0af3e2f35bf197fdf5692a862432694
