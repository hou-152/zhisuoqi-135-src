    relation_paraphrase: Context Engineering 在可靠工作流中持续控制信息并规定如何验证结果。
    exact_excerpt: 文章提出一套把临时 prompt 实验转化为可靠 AI 工程实践的三层框架：Markdown prompt engineering 负责让意图结构化，agentic primitives 负责把规则、角色、流程和记忆产品化，context engineering 负责持续控制模型看到什么、忽略什么、如何验证结果。作者的核心判断是：自然语言工作流正在变成一种可执行、可复用、可打包、可进入 CI/CD 的软件形态。
