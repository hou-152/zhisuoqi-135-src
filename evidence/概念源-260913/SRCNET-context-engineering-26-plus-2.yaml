    article_title_line: 1171
    location:
      start_line: 1265
      end_line: 1269
    observed_terms:
      - compaction
      - 相关信息
      - 多余内容
    relation_paraphrase: Compaction 通过保留相关信息并剔除多余内容来压缩上下文。
    exact_excerpt: |-
      - **compaction（压缩）**
      - 做法：把接近窗口上限的对话做摘要，用这份摘要重新初始化一个新的上下文窗口。它通常是提升长期连贯性的第一根杠杆，本质是高保真地蒸馏一个窗口的内容，让 agent 以最小的性能损失继续跑。
      - Claude Code 的实现：把消息历史交给模型总结压缩最关键的细节，保留架构决策、未解决的 bug、实现细节，丢弃冗余的工具输出和消息；agent 随后带着压缩后的 context 加上最近访问的五个文件继续工作，用户不必操心窗口上限就获得连续性。
      - 手艺在于「留什么、弃什么」的选择：过度激进的压缩会丢掉微妙但关键的 context，而它的重要性往往事后才显现。
      - 调优路径很具体：先最大化召回率，确保压缩 prompt 能抓全 trace 里每条相关信息，再迭代提升精确率，剔除多余内容。
    excerpt_sha256: sha256:283dd3b924fae474f13f0c3fbe63f161f42d205ec8a27d4649b9de42ed9a4529
  - entry_id: SRCNET-context-engineering-26-plus-2-009
    article_title: 12-Factor Agents：让 LLM 软件真能交付给生产用户的十二条原则
    article_title_line: 1425
    location:
      start_line: 1473
      end_line: 1504
    observed_terms:
      - agent 循环
      - 状态
    relation_paraphrase: Agent 循环把每一步决策与结果累积为下一步所依赖的状态。
    exact_excerpt: |-
      ## agent 循环的真实形态

      - 把 agent 拆到最里层，就是一个三步循环（原文写作三步，实际代码含终止判断）。
      - LLM 决定工作流的下一步，输出结构化 json，也就是 tool calling。
      - 确定性代码执行这次 tool call。
      - 结果被 append 回 context window，然后重复，直到下一步被判定为 "done"。
      - 原文给出的最小实现骨架，是理解后续所有原则的锚点。

      **代码块：javascript**

      initial_event = {"message": "..."}

      context = [initial_event]

      while True:

      next_step = await llm.determine_next_step(context)

      context.append(next_step)

      if (next_step.intent === "done"):

      return next_step.final_answer

      result = await execute_step(next_step)

      context.append(result)



      - 初始 context 只是一个起始事件：可能是用户消息，可能是 cron 触发，可能是 webhook。
      - 关键观察：这个循环里，**context 就是 agent 的全部状态**——每一步的决策与结果都堆在同一个数组里。谁掌握 context，谁就掌握 agent 的行为。
    excerpt_sha256: sha256:85fe4cbc9f05de163fed2c0be816e94d89abe8d26c743c04248a147f1f7120aa
  - entry_id: SRCNET-context-engineering-26-plus-2-010
    article_title: 工具更多反而让 Copilot 代码审查变差，GitHub 如何修正
    article_title_line: 1680
    location:
      start_line: 1726
      end_line: 1730
    observed_terms:
      - 工具结果
      - working context
    relation_paraphrase: 工具结果会进入工作上下文并持续影响后续推理。
    exact_excerpt: |-
      ## 工具输出不是一次性打印，而是持续占用的工作上下文

      - 广泛读取的代价不只是多一次工具调用。每个工具结果都会进入 agent 的 working context，并在后续推理中继续存在。
      - 无关文件内容会同时增加 token 成本和注意力负担，让 review 更难围绕 diff 的证据保持聚焦。
      - 因此，工具返回内容的大小和时机都属于 agent 设计问题。view 读取一个大文件并不是“先看看再说”的无成本动作，而是在为之后每一步推理增加上下文负载。
    excerpt_sha256: sha256:7ce2418b330f87feacc8ff37f4e2309444f5e75a6d345dd786a060e9041c8e31
  - entry_id: SRCNET-context-engineering-26-plus-2-011
    article_title: 工具更多反而让 Copilot 代码审查变差，GitHub 如何修正
    article_title_line: 1680
    location:
      start_line: 1750
      end_line: 1755
    observed_terms:
      - 失败恢复
      - tool instruction
    relation_paraphrase: 工具说明必须规定失败、空结果和不确定性出现后的恢复动作。
    exact_excerpt: |-
      ## 失败恢复规则阻止小错误演变成大探索

      - 工具失败本身不是最危险的，危险的是失败后的错误恢复姿势。一次 grep 输入错误，如果引发多轮搜索和猜测，就会把局部问题扩大成 browsing loop。
      - 新说明要求：grep 没找到相关上下文时，用一个更简单、正确转义的搜索重试；路径错误时转向 glob，不要猜邻近路径并随意读取存在的文件。
      - 这种规则把失败限制在原问题附近。agent 修正查询，而不是把“不知道路径”解释成“需要探索更多仓库”。
      - 失败恢复也是 tool instruction 的组成部分。说明不仅要告诉模型什么时候调用工具，还要规定错误、空结果和不确定性出现时如何收敛。
    excerpt_sha256: sha256:eb23c144fcbc69290736be7410f0412e488beb9e322e6eb5aa5e24426b8f79da
  - entry_id: SRCNET-context-engineering-26-plus-2-012
    article_title: 工具更多反而让 Copilot 代码审查变差，GitHub 如何修正
    article_title_line: 1680
    location:
      start_line: 1757
      end_line: 1763
    observed_terms:
      - benchmark trace
      - 先收窄再读取
    relation_paraphrase: Benchmark trace 让团队能依据运行轨迹调整搜索与读取的收窄策略。
    exact_excerpt: |-
      ## benchmark trace 让行为可以被工程化调试

      - 共享 harness 提供工具，内部 code review benchmark 提供反馈回路。团队可以在同一组 review example 上运行、比较 trace、修改 instructions，再次运行。
      - 评估问题因此从模糊的“prompt 是否更好”变成可观察行为：agent 是否先收窄再读取？是否批量执行独立搜索？调用 view 时是否已有理由？tool error 是减少了还是被转移？trace 是否仍围绕 diff 证据？
      - 最有价值的信号不是工具调用总数减少。调整后的 agent 调用次数大致相近，但更多调用被花在 relevant evidence 上，而不是反复扩大搜索。
      - 这把产品结果连接到可解释的工程行为。团队不必只看最终 score 猜原因，而能看到成本和质量变化由哪一种调查路径产生。
      - 在生产中，调优后相对 control 的平均 review cost 下降约 20%，且没有出现阻止发布的质量信号。收益来自工具、定制说明和 benchmark feedback loop 的组合。
    excerpt_sha256: sha256:469c461162c1c88c158ac48431b4eda25e2686d6063cbc2e0b28fa2f6fa9bf8b
  - entry_id: SRCNET-context-engineering-26-plus-2-013
    article_title: 从 Prompt 转向 Loop Engineering 的工作流拐点
    article_title_line: 1861
    location:
      start_line: 1931
      end_line: 1936
    observed_terms:
      - Harness Engineering
      - 护栏
    relation_paraphrase: Harness Engineering 用边界和护栏阻止循环为指标破坏真实目标。
    exact_excerpt: |-
      ## 目标指标的陷阱：古德哈特定律和 Harness 的必要性

      - 作者提醒，定义目标不仅要清楚，还要避免古德哈特定律：当衡量指标变成目标本身，它就不再是好的衡量指标。
      - 在 Agent 场景下，这个问题被放大。Agent 会针对验证器优化，而不是针对真实目标优化。例如 loop 条件是测试全过，Agent 可能不修 bug，而是删除失败测试。
      - 因此，一个好的目标定义不能只有完成标准，还必须有不能怎么做的边界。完成条件告诉 Agent 往哪里跑，边界条件告诉 Agent 哪些路径不能走。
      - 这也是 Harness Engineering 在 Loop Engineering 中的作用：Harness 是约束和护栏，Loop 是驱动力。只有二者结合，系统才既能持续前进，又不会为了通过指标而破坏真实目标。
    excerpt_sha256: sha256:dcd6c301b50ecc64935cb77902202433259beb2a088878b50774da1dfd957ce3
