  - entry_id: SRCNET-context-engineering-26-plus-2-027
    article_title: AI 的新技能不是提示词，而是上下文工程
    article_title_line: 6116
    location:
      start_line: 6161
      end_line: 6168
    observed_terms:
      - 上下文
      - System Prompt
      - Available Tools
    relation_paraphrase: System Prompt 和可用工具定义都是来源列出的 Context 构成。
    exact_excerpt: |-
      原文把「上下文」拆成七类构成：

      - **Instructions / System Prompt**：定义模型在一次对话中行为方式的初始指令集，可以也应该包含示例与规则。
      - **User Prompt**：来自用户的即时任务或问题。
      - **State / History（短期记忆）**：当前对话，包括把事情推到此刻的用户与模型的历次回应。
      - **Long-Term Memory（长期记忆）**：跨越许多次先前对话积累起来的持久知识库——学到的用户偏好、过往项目的摘要、被要求记住以备将来使用的事实。
      - **Retrieved Information（RAG）**：外部的、最新的知识，来自文档、数据库或 API 的相关信息，用于回答具体问题。
      - **Available Tools**：它可以调用的全部函数或内置工具的定义（例如 check_inventory、send_email）。
    excerpt_sha256: sha256:aae50e53f63470a00470bdd558ec66d0354cf2f2a794a919a09f043bf4c72288
  - entry_id: SRCNET-context-engineering-26-plus-2-028
    article_title: AI 的新技能不是提示词，而是上下文工程
    article_title_line: 6116
    location:
      start_line: 6187
      end_line: 6193
    observed_terms:
      - 上下文工程
      - 动态系统
      - 即时生成
    relation_paraphrase: Context Engineering 通过动态系统按任务即时生成并格式化模型所需信息与工具。
    exact_excerpt: |-
      - 作者给出的定义：**上下文工程是设计并构建动态系统的学科，这些系统在正确的时间、以正确的格式，提供正确的信息与工具，从而给 LLM 完成一项任务所需的一切。**
      - 四条特征（原文以并列条目给出，是全文最可操作的部分）：
      - **A System, Not a String（是系统，不是字符串）**：上下文不是一个静态的提示词模板，它是**在主 LLM 调用之前运行的那个系统的输出**。
      - **Dynamic（动态）**：即时生成，为当下任务量身定制。这次请求可能是日历数据，下次是邮件或一次网络搜索。
      - **About the right information, tools at the right time（正确的信息与工具，在正确的时间）**：核心工作是确保模型不缺关键细节（「Garbage In, Garbage Out」）。这意味着**同时提供知识（信息）与能力（工具）**，且只在需要且有用时提供。
      - **Where the format matters（格式很重要）**：你如何呈现信息是有影响的。**一份简洁的摘要优于一堆原始数据的倾倒；一个清晰的工具 schema 优于一句含糊的指令。**
      - 这四条合起来把「上下文」从文本对象改写成了系统对象：它有生产者、有触发时机、有格式契约。
    excerpt_sha256: sha256:7b77038081620cc61cdbf5be1c90fa525d7c372500e8a373178120a55d2dabd5
  - entry_id: SRCNET-context-engineering-26-plus-2-029
    article_title: 上下文工程：AI 时代的核心能力
    article_title_line: 6300
    location:
      start_line: 6346
      end_line: 6351
    observed_terms:
      - Selection
      - 窗口
    relation_paraphrase: Context Selection 决定什么信息进入窗口。
    exact_excerpt: |-
      - **设计什么信息到达模型、什么时候、以什么结构的学科**
      - 不是 prompt engineering（怎么问），不是 fine-tuning（改模型），而是**你的知识与模型注意力之间的架构**
      - 三个层次：
      - **Layer 1: Selection** — 什么进入窗口
      - **Layer 2: Architecture** — 如何结构化
      - **Layer 3: Lifecycle** — 什么时候刷新
    excerpt_sha256: sha256:9f701bf5fa90f19436ba91b2168f8da0bab3e05a63e770a8a1d789dea5646b11
  - entry_id: SRCNET-context-engineering-26-plus-2-030
    article_title: 上下文工程：AI 时代的核心能力
    article_title_line: 6300
    location:
      start_line: 6572
      end_line: 6574
    observed_terms:
      - Memory
      - 渐进式披露
    relation_paraphrase: Memory 用路由文档和主题文件分层，让详细知识按需披露。
    exact_excerpt: |-
      Memory 层级与渐进式披露（progressive disclosure）——不是所有东西都需要同时在窗口里，引导模型去找它需要的东西。[MEMORY.md](http://memory.md/) 作为路由文档控制在 200 行以内，详细主题文件从中链接。

      - **费曼一下**：别把所有知识一次性塞给模型。用一个简短的「路由文档」告诉 agent 去哪里找什么，让它按需加载详细内容。就像好的 API 文档——首页简洁，细节按需展开。
    excerpt_sha256: sha256:560b30e703e2117be71c54ec939829d38a9729bf1e63e6e7e9cccbfabf1fe865
  - entry_id: SRCNET-context-engineering-26-plus-2-031
    article_title: 什么是 Context？
    article_title_line: 6614
    location:
      start_line: 6761
      end_line: 6763
    observed_terms:
      - Context Engineering
      - Context Window
    relation_paraphrase: Context Engineering 管理 Context Window 里放什么、怎样放和何时放。
    exact_excerpt: |-
      - **Context Window** 是运行时容器——LLM 的工作记忆，有限且昂贵
      - **Context Distraction** 是对"多即是好"的警示——揭示 Context Window 存在质量陷阱，超过阈值反而有害
      - **Context Engineering** 是管理 Context Window 的方法论——决定往容器里放什么、怎么放、何时放
    excerpt_sha256: sha256:4ad23111b6653583b156bfaa4ecd82fb854f50c4d22e132cc61f81e7dc3ac751
