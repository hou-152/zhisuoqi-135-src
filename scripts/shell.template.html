<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知所栖 135 · AI 时代要学的每一件事</title>
<style>
/* ══ 知所栖 135 · Linear 式三栏外壳 ══════════════════════════════
   参考：所有者 09-12 05:03–05:38 提供的 Linear Agent 页截图。
   Linear 的骨架是**三栏**：导航栏 | 列表栏 | 详情栏。
   之前那版是「全屏画布 + 滑出抽屉」——中间那一栏没有，所以没有 Linear 的味道。
   配色也按 Linear 收：近黑、低对比边、无光晕、无渐变。 */
:root{
  --bg:#08090a; --panel:#0e0f10; --panel2:#0b0c0d; --line:#1b1c1e; --line2:#232426;
  --fg:#f7f8f8; --fg2:#8a8f98; --fg3:#62666d; --fg4:#3c3f44;
  --accent:#5e6ad2; --accent2:#7c86e8;
  --ok:#4cb782; --bad:#eb5757; --warn:#f2c94c; --read:#9b7fe8;
  --row:30px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── 三栏 ───────────────────────────────────────────── */
#app{display:grid;grid-template-columns:224px 302px 1fr;height:100vh;overflow:hidden}

/* 导航栏 */
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;padding:10px 8px 8px;min-height:0;overflow:hidden}
.r-brand{display:flex;align-items:center;gap:7px;padding:4px 8px 12px;font-size:13.5px;
  font-weight:600;letter-spacing:.01em}
.r-brand span{font-size:10.5px;font-weight:500;color:var(--fg3);border:1px solid var(--line2);
  border-radius:5px;padding:0 5px;line-height:16px}
.r-brand .pubtag{border-color:#2b3a5c;color:#7c93c9}
.r-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;margin-bottom:8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg3);font-size:12.5px}
.r-search input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-size:12.5px;
  font-family:inherit;min-width:0}
.r-search input::placeholder{color:var(--fg4)}
.r-list{display:flex;flex-direction:column;gap:1px}
.r-item{display:flex;align-items:center;gap:8px;width:100%;height:var(--row);padding:0 8px;
  background:none;border:0;border-radius:6px;cursor:pointer;color:var(--fg2);
  text-align:left;font-size:13px}
.r-item:hover{background:#161719;color:var(--fg)}
.r-item.on{background:#1d1e21;color:var(--fg)}
.r-item .ic{width:14px;text-align:center;font-size:12px;opacity:.75;flex:0 0 14px}
.r-item b{font-weight:450;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-item i{font-style:normal;font-size:11px;color:var(--fg4);white-space:nowrap}
.r-item.on i{color:var(--fg3)}

/* 列表栏 */
#list{background:var(--panel2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0}
.lp-head{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;
  border-bottom:1px solid var(--line);flex:0 0 44px}
.lp-head b{font-size:13px;font-weight:550}
.lp-head .cnt{font-size:11.5px;color:var(--fg4)}
.lp-head .spacer{flex:1}
.lp-head button{background:none;border:0;color:var(--fg4);cursor:pointer;font-size:12px;
  padding:3px 5px;border-radius:5px}
.lp-head button:hover{background:#1a1b1e;color:var(--fg2)}
.lp-body{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 6px 12px;scrollbar-width:thin}
.lp-body::-webkit-scrollbar{width:8px}
.lp-body::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
.row{display:flex;align-items:center;gap:8px;height:var(--row);padding:0 8px;border-radius:6px;
  cursor:pointer;color:var(--fg2);font-size:12.5px}
.row:hover{background:#161719;color:var(--fg)}
.row.on{background:#1d1e21;color:var(--fg)}
.row .rd{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.row .rn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:11px;color:var(--fg4);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .st{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.lp-empty{color:var(--fg4);font-size:12px;padding:22px 10px;text-align:center;line-height:1.9}

/* 主区 */
#main{position:relative;background:var(--bg);overflow:hidden;min-width:0}
/* 详情打开时主区让出 412px，画布跟着缩——盖住图就不是 Linear 了 */
#main.pinned #c{right:412px}
#main.pinned .mtools{right:412px}
#main.pinned #hero-mini{max-width:290px}
#c{position:absolute;inset:0;display:block;cursor:grab;touch-action:none;transition:right .14s}
#c.drag{cursor:grabbing}
/* tab 板（图谱 / 星球）：**知识体系这个页面内的视图切换**，长在主区顶部。
   09-13 曾提到三栏之上当全局顶栏，所有者 04:0x 改口：「它不应该在顶栏，
   而是它在知识体系下面的那个 tab」——层级归位，位置回主区。 */
.mtools{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
  gap:6px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);z-index:4;
  background:linear-gradient(180deg,rgba(8,9,10,.92),rgba(8,9,10,.55));backdrop-filter:blur(6px)}
.mtools .spacer{flex:1}
.tab{background:none;border:1px solid var(--line);color:var(--fg3);font-size:11.5px;height:24px;
  padding:0 11px;border-radius:5px;cursor:pointer}
.tab:hover{color:var(--fg2);border-color:var(--line2)}
.tab.on{background:#1d1e21;color:var(--fg);border-color:var(--line2)}
.rel-legend{display:none;align-items:center;gap:8px;color:var(--fg4);font-size:10.5px;white-space:nowrap}
.rel-legend.on{display:flex}
.rel-legend span{display:inline-flex;align-items:center;gap:3px}
.rel-legend i{display:inline-block;width:7px;height:7px;border-radius:50%}
.mtools .mm{font-size:11.5px;color:var(--fg4)}

/* ── 路径视图（09-13 加）──────────────────────────────────────
   路径 = 主区第四种观察方式，也是默认。它**不改图谱数据**，只在同一张画布上做取舍：
   路线上的点亮、当前步加环、其余降噪；左上方那条是「导师」说话的地方（方案 B），
   画布上的高亮是「路径地图」（方案 C）。
   条宽 262px：路径模式下图谱整体右移（layoutGrid 的 x0 从 0.29 挪到 0.37），
   不让任何一个点躲在条下面——否则画布点击会被这条吃掉。 */
#pathrail{position:absolute;left:0;top:44px;bottom:0;width:262px;z-index:5;padding:13px 10px 20px 14px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;display:none;
  background:linear-gradient(100deg,rgba(8,9,10,.97) 66%,rgba(8,9,10,0));
  pointer-events:none}
#pathrail.on{display:block}
#pathrail>*{pointer-events:auto}
#main.pinned #pathrail{display:none}   /* 卡片已经写着同一套上下文，不再占画布 */
#pathrail::-webkit-scrollbar{width:8px}
#pathrail::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
.pr-kicker{font-size:10.5px;color:var(--fg4);letter-spacing:.04em}
.pr-title{font-size:15px;font-weight:550;margin:5px 0 4px;letter-spacing:-.01em;line-height:1.35}
.pr-q{font-size:11.5px;color:var(--fg3);line-height:1.7;margin-bottom:8px}
.pr-target{font-size:10.5px;color:var(--fg4);line-height:1.6;border-left:2px solid var(--line2);
  padding-left:8px;margin-bottom:11px}
.pr-steps{list-style:none;margin:0;padding:0}
.pr-step{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  border-left:2px solid var(--line);padding:5px 6px 5px 9px;cursor:pointer;color:var(--fg3);
  font-family:inherit;font-size:12.5px;text-align:left;line-height:1.4}
.pr-step:hover{background:#161719;color:var(--fg)}
.pr-step .no{flex:0 0 12px;font-size:10px;color:var(--fg4);font-variant-numeric:tabular-nums}
.pr-step .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-step .tag{font-size:9.5px;color:var(--fg4);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.pr-step.done{border-left-color:#2b4a37;color:var(--fg2)}
.pr-step.done .no{color:#4cb782}
.pr-step.next{border-left-color:#39406b;color:var(--fg2)}
.pr-step.cur{border-left-color:var(--accent);color:var(--fg);background:#14151a}
.pr-step .st{font-size:10px;color:var(--fg4)}
.pr-block{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.pr-why{font-size:11.5px;color:var(--fg2);line-height:1.75}
.pr-why b{color:var(--fg4);font-weight:500;display:block;font-size:10px;margin-bottom:3px;letter-spacing:.03em}
.pr-nav{margin-top:9px;font-size:11.5px;color:var(--fg3);line-height:2}
.pr-nav button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0 2px;
  border-bottom:1px dashed var(--line2)}
.pr-nav button:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
.pr-nav i{font-style:normal;color:#4cb782}
.pr-back{margin-top:8px;width:100%;text-align:left;background:#241715;border:1px solid #57302a;
  border-radius:6px;color:#e8bdb6;font-size:11.5px;padding:6px 9px;cursor:pointer;font-family:inherit;line-height:1.5}
.pr-back:hover{background:#2e1c19}
.pr-bq{font-size:11px;color:var(--fg4);margin-bottom:6px}
.pr-opt{display:block;width:100%;text-align:left;background:#101113;border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;margin-bottom:5px;cursor:pointer;color:var(--fg2);
  font-family:inherit;font-size:12px;line-height:1.5}
.pr-opt:hover{border-color:var(--line2);color:var(--fg)}
.pr-opt em{font-style:normal;font-size:9.5px;color:#b9c0f0;border:1px solid #39406b;background:#20263f;
  border-radius:4px;padding:0 4px;margin-left:5px}
.pr-opt span{display:block;color:var(--fg4);font-size:10.5px;margin-top:2px}
.pr-foot{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pr-foot button{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11px;height:24px;padding:0 9px;cursor:pointer;font-family:inherit}
.pr-foot button:hover{background:#1d1e21;color:var(--fg)}
.pr-empty{font-size:11.5px;color:var(--fg4);line-height:1.9}

/* 概念卡顶部的路径上下文 */
.pctx{border:1px solid #2a2f4a;background:#11131c;border-radius:8px;padding:11px 12px;margin-bottom:14px}
.pctx .k{font-size:10.5px;color:#8f9ad0;letter-spacing:.03em}
.pctx h4{font-size:13px;font-weight:550;margin:5px 0 7px;color:var(--fg)}
.pctx .why{font-size:12px;color:var(--fg2);line-height:1.8}
.pctx .why b{color:var(--fg4);font-weight:500}
.pctx .nav{margin-top:9px;font-size:12px;color:var(--fg3);line-height:2.1}
.pctx .nav button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0 2px;
  border-bottom:1px dashed var(--line2)}
.pctx .nav button:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
.pctx .nav i{font-style:normal;color:#4cb782}
.pctx .nav u{text-decoration:none;color:var(--fg4);font-size:11px}
.pctx .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pctx .loop-note{margin-top:9px;padding:7px 8px;border-left:2px solid #d9a84e;background:rgba(217,168,78,.08);font-size:11.5px;line-height:1.65;color:var(--fg2)}
.pctx .loop-note b{color:#e4bd72;font-weight:500}
.pctx.off{border-color:var(--line2);background:#101113;font-size:11.5px;color:var(--fg4);line-height:1.8}
.pctx.off button{background:#17181b;border:1px solid var(--line2);border-radius:5px;color:var(--fg2);
  font-size:11px;height:22px;padding:0 8px;cursor:pointer;font-family:inherit;margin-left:6px}
.pctx details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.pctx summary{cursor:pointer;font-size:11px;color:var(--fg4);outline:none}
.pctx h5{margin:10px 0 4px;font-size:10.5px;color:var(--fg4);font-weight:500}
.pctx ul{list-style:none}
.pctx li{display:block;padding:4px 0;font-size:11.5px;color:var(--fg2);line-height:1.6;cursor:default}
.pctx li b{color:#a8b5ee;font-weight:500}
.pctx li em{font-style:normal;color:var(--fg4);display:block;font-size:10.5px;margin-top:2px}
.pctx li.soft b{color:#8b7de8}
.pctx li.rel b{color:#7c86e8}
.pctx li.pick{cursor:pointer}
.pctx li.pick:hover{color:var(--fg)}
.pctx .none{font-size:11px;color:var(--fg4);line-height:1.75}

/* 列表栏里的路径入口（与概念行分开的类：.row 是概念/主题行，.prow 是路径行） */
.lp-sec{font-size:10.5px;color:var(--fg4);padding:9px 8px 4px;letter-spacing:.03em}
.prow{display:flex;align-items:center;gap:8px;height:auto;min-height:32px;padding:5px 8px;border-radius:6px;
  cursor:pointer;color:var(--fg2);font-size:12.5px;background:#101113;border:1px solid var(--line);margin:0 0 4px}
.prow:hover{border-color:var(--line2);color:var(--fg)}
.prow.on{border-color:#39406b;background:#14151a;color:var(--fg)}
.prow .rd{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--accent)}
.prow .rn{flex:1;line-height:1.4}
.prow .rn i{font-style:normal;display:block;font-size:10.5px;color:var(--fg4);margin-top:1px}
.prow .rm{font-size:11px;color:var(--fg4);white-space:nowrap}

#hero-mini{position:absolute;left:0;top:44px;z-index:3;pointer-events:none;max-width:330px;
  padding:12px 26px 14px 18px;
  background:linear-gradient(100deg,rgba(8,9,10,.94) 45%,rgba(8,9,10,0))}
#hero-mini .kicker{font-size:10.5px;color:var(--fg4);letter-spacing:.04em}
#hero-mini .stats{font-size:11.5px;color:var(--fg3);line-height:1.75;margin-top:5px}
#hero-mini .stats b{color:var(--fg2);font-weight:500}
#main.pathon #hero-mini{display:none}   /* 路径模式下左上角让给路径条，两块都在这儿会打架 */

/* 详情栏：停靠在主区右侧，不再滑出全屏 */
#panel{position:absolute;top:0;right:0;bottom:0;width:412px;background:var(--panel);
  border-left:1px solid var(--line);padding:20px 20px 28px;z-index:6;overflow-y:auto;
  transform:translateX(6px);opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;
  scrollbar-width:thin}
#panel.on{transform:none;opacity:1;pointer-events:auto}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
#panel .close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:6px;
  background:none;border:0;color:var(--fg4);cursor:pointer;font-size:13px;line-height:1}
#panel .close:hover{background:#1a1b1e;color:var(--fg2)}
#panel .src{font-size:11px;color:var(--fg3);margin-bottom:9px;padding-right:32px;line-height:1.7}
#panel h2{font-size:19px;font-weight:550;line-height:1.35;margin-bottom:12px;letter-spacing:-.01em}
#panel .gloss{font-size:13px;line-height:1.85;color:var(--fg2);margin-bottom:20px}
#panel .deep{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 18px;background:#141518}
#panel .deep summary{cursor:pointer;font-size:11.5px;color:var(--fg4);outline:none}
#panel .deep h5{margin-top:12px}
#panel .deep .mut{font-size:12px;line-height:1.8;color:var(--fg3);white-space:pre-wrap}
#panel .deep ul{margin:6px 0 0;padding-left:16px}
#panel .deep li{font-size:12px;line-height:1.75;color:var(--fg3);margin:3px 0}
#nei-body .nm .tomap{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-align:left;border-bottom:1px dashed var(--line2)}
#nei-body .nm .tomap:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
#nei-body .nm .tomap i{font-style:normal;font-size:10.5px;color:var(--fg4);margin-left:4px}
#panel .metrics{display:flex;gap:20px;padding:12px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:18px}
#panel .m{flex:1}
#panel .m b{display:block;font-size:17px;font-weight:500;color:var(--fg);line-height:1.2}
#panel .m span{font-size:10.5px;color:var(--fg4)}
#panel h5{font-size:11px;color:var(--fg4);margin:18px 0 8px;font-weight:500}
#panel ul{list-style:none}
#panel li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);
  padding:5px 7px;border-radius:5px;cursor:pointer}
#panel li:hover{background:#161719;color:var(--fg)}
#panel li em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--fg4)}
.rel-list li{display:block;padding:7px;border:1px solid var(--line);margin:4px 0;background:#101113}
.rel-list li:hover{border-color:var(--line2)}
.rel-list .rel-name{display:flex;align-items:center;gap:6px;color:var(--fg2)}
.rel-list .rel-name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-list .rel-name i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.rel-list .rel-note{margin-top:3px;color:var(--fg4);font-size:10.5px;line-height:1.55}
.srclist{list-style:none;margin:6px 0 0;padding:0}
.srclist li{padding:7px 0;border-top:1px solid var(--line)}
.srclist li:first-child{border-top:0;padding-top:2px}
.srclist a{color:var(--accent2);text-decoration:none;font-size:12px;line-height:1.5}
.srclist a:hover{text-decoration:underline}
.srclist a i{font-style:normal;opacity:.7}
.srclist em{font-style:normal;color:var(--fg4);font-size:10.5px;margin-left:6px}
.srclist .sib{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.srclist .sib button{background:#17181b;border:1px solid var(--line2);border-radius:5px;color:var(--fg2);
  font-size:10.5px;padding:2px 7px;cursor:pointer;font-family:inherit}
.srclist .sib button:hover{border-color:var(--accent);color:var(--fg)}
.mut{color:var(--fg3);font-size:12px;line-height:1.8}
.markrow{display:flex;gap:6px;flex-wrap:wrap}
.mk{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11.5px;height:26px;padding:0 10px;cursor:pointer}
.mk:hover{background:#1d1e21;color:var(--fg)}
.mk.on{background:#20263f;border-color:#39406b;color:#b9c0f0}
.mk.quiet{color:var(--fg4)}

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

/* 倒逼区 */
.dpane{background:#101113;border:1px solid var(--line2);border-radius:8px;padding:13px 14px;margin:16px 0}
.dpane h5{margin:0 0 7px}
.dpane textarea{width:100%;min-height:84px;background:#0a0b0c;border:1px solid var(--line2);
  border-radius:6px;padding:9px 10px;color:var(--fg);font-size:12.5px;line-height:1.75;
  outline:none;font-family:inherit;resize:vertical;margin-top:8px}
.dpane textarea:focus{border-color:#3a4058}
.dpane.quiet{background:#131020;border-color:#2c2545}
.jrow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.jbtn{background:var(--accent);border:0;border-radius:6px;color:#fff;font-size:12px;height:28px;
  padding:0 13px;cursor:pointer;font-weight:500}
.jbtn:hover{background:var(--accent2)}
.jbtn.ghost{background:#17181b;border:1px solid var(--line2);color:var(--fg2);font-weight:400}
.jbtn.ghost:hover{background:#1d1e21;color:var(--fg)}

<script>
const DATA = /*__DATA__*/;

/* ── 常量 ───────────────────────────────────────────── */
let   LEVEL_GAP = 88;      // 每层高度（boot 时按层数自适应）
const REPULSE   = 1650;    // 斥力
const SPRING    = 0.055;   // 边引力
const YSPRING   = 0.15;    // 层弹簧
const DAMP      = 0.86;
const ITERS     = 260;

const nodes = DATA.nodes, edges = DATA.edges, relations = DATA.relations || [], sources = DATA.sources, meta = DATA.meta;
const articles = DATA.articles || [];   // 来源索引：65 篇原文 ＋ 229 个 Notion 页（cm-wire 生成，节点用 n.sa 指过来）
const relationStats = DATA.relationStats || { visible: relations.length, hidden: 0, byKind: {} };
// 主题层：21 条主题线（知识体系现在只有这一个分组轴）
const CUR = DATA.curation || { tags: [], assign: {}, collections: [] };
// 内参一栏：AI 内参图文格式（主题 / 重要等级 / 地址 / 配图 / 原文子链接 / 简介 / 入选理由 / 三产物）
const NEI = DATA.neican || { period: '', articles: [] };
/* 路线层（09-13 加）：人工策展的前置路径，**独立于概念图谱**——顺序不写回
   topics.json / dependencies.json，图谱继续只管节点与关系（PLAN §7 / HANDOFF §六）。
   配置在 evidence/paths-260913/routes.json；cm-wire 已把真实概念名、真实 hard/soft 前置理由、
   真实相关关系解析好了，这里只渲染，不自己判定谁是谁的前置。 */
const ROUTES = (DATA.routes && DATA.routes.routes) || [];

/* ── 验收方式分类 ─────────────────────────────────────────────
   不问「这讲的是什么」（那是主题，任何模型都能吐），问
   「**这个概念该要求学习者做到什么，才算学会了**」。
   它决定的不只是分列，而是**系统对你做什么**：
     compute 能算的 → 复述机制
     judge   能判的 → 说出你自己的判据与代价
     use     能用的 → 给一个你真用过的例子
     accept  只能认的 → **不设验收**。世界观没有机制可复述，硬考就是假学习。
   这正是原版的真 bug：194 个概念用了同一个验收标准，把世界观也拉来考。 */
const KIND = {
  compute: { name: '能算的', color: '#5B8FF9',
    ask: '遮住上面那句，用自己的话说清它的机制。',
    rule: '判定口径：说清核心机制、不违反事实 → pass；漏机制、说错、照抄原文 → fail。' },
  judge:   { name: '能判的', color: '#F6BD16',
    ask: '遮住上面那句：它给的是什么判据？换成你的处境你会怎么用？代价是什么？',
    rule: '判定口径：必须写出**你自己的判据和你愿意付的代价**。只复述原文 → fail；'
        + '说「看情况」但不给出判据 → fail；没提代价 → fail。' },
  use:     { name: '能用的', color: '#61DDAA',
    ask: '遮住上面那句：它是什么？给一个你**真拿它做过**的具体例子（做了什么、结果如何）。',
    rule: '判定口径：说清它是什么 + 给了一个具体、可核对的用例 → pass；'
        + '只有定义没有用例 → fail；用例含糊或明显是编的 → fail。' },
  accept:  { name: '只能认的', color: '#9661BC', ask: null,
    rule: '这一类不设验收。' },
};
const kOf = n => (KIND[n.k] ? n.k : 'compute');
const byId = new Map(nodes.map(n => [n.id, n]));
const neighbors = new Map(nodes.map(n => [n.id, { pre: [], post: [] }]));
const relationNeighbors = new Map(nodes.map(n => [n.id, []]));
const RELATION_NAMES = {
  prerequisite: '前置', 'related-to': '相关', 'used-with': '一起使用',
  'part-of': '组成', contrast: '对照',
};
const RELATION_COLORS = {
  prerequisite: '#a8b5ee', 'related-to': '#8b7de8', 'used-with': '#5ec9b1',
  'part-of': '#e4a95f', contrast: '#e97b9b',
};

/* ── 状态 ───────────────────────────────────────────── */
// 09-13：路径是默认的学习观察方式（HANDOFF §四.1），图谱 / 关系 / 星球继续保留。
let mode = 'path';
let rotX = -0.22, rotY = 0.5, zoom = 1.08, panX = 0, panY = 0;
let selected = null, hovered = null, filter = null;
// 当前路线与「走到第几步」：routeStepIdx 是 0 基下标；进路径时停在第一个没验过的步骤上
let routeId = ROUTES.length ? ROUTES[0].routeId : null;
let routeStepIdx = 0;
function activeRoute() { return ROUTES.find(r => r.routeId === routeId) || null; }
function routeIndexOf(id) {
  const r = activeRoute();
  return r ? r.steps.findIndex(s => s.conceptId === id) : -1;
}
function routeHas(id) { return routeIndexOf(id) >= 0; }
/* 第一步停在哪：看过/验过的都跳过，全验完就停在最后一步。
   「验过」只认 marks 里的证据（pass/read/mech 都算走过），不自己标。 */
function firstUnseenStep(r) {
  for (let i = 0; i < r.steps.length; i++) {
    const st = (marks[r.steps[i].conceptId] || {}).state;
    if (st !== 'pass' && st !== 'read' && st !== 'mech') return i;
  }
  return r.steps.length - 1;
}
/* 把视图对准路线（09-13 加）：路径默认打开时整张图是缩到 1.0 的，六个点挤在 L0/L1 那两行里，
   截图一看「当前节点高亮」其实埋在灰点堆里。这里按路线的包围盒定一次 zoom/pan，
   让路线占画布中间那块；之后用户自己拖/缩放不再动它。 */
function focusRoute() {
  const r = activeRoute();
  if (!r || !r.steps.length || mode !== 'path') return;
  const ns = r.steps.map(s => byId.get(s.conceptId)).filter(Boolean);
  if (ns.length < 2) return;
  const gxs = ns.map(n => n.gx), gys = ns.map(n => n.gy);
  const spanX = Math.max(90, Math.max(...gxs) - Math.min(...gxs));
  const spanY = Math.max(70, Math.max(...gys) - Math.min(...gys));
  const left = 282;                                  // 让开路径条
  const s = Math.max(0.95, Math.min(1.6, Math.min((W - left) * 0.66 / spanX, (H - 60) * 0.5 / spanY)));
  zoom = s;
  const gcx = (Math.min(...gxs) + Math.max(...gxs)) / 2, gcy = (Math.min(...gys) + Math.max(...gys)) / 2;
  const tx = left + (W - left) * 0.5, ty = 60 + (H - 60) * 0.5;
  panX = (tx - CX) / s - gcx + CX;
  panY = (ty - CY) / s - gcy + CY;
}
window.focusRoute = focusRoute;
function openRoute(id, keepStep) {
  const r = ROUTES.find(x => x.routeId === id);
  if (!r) return;
  routeId = id;
  if (!keepStep) routeStepIdx = firstUnseenStep(r);
  if (mode !== 'path') { mode = 'path'; syncTabs(); }
  filter = null;                                   // 路径横跨多个主题，别被单列筛掉
  selected = null;
  document.getElementById('panel').classList.remove('on');
  pinMain(false);
  computeLayout(); focusRoute(); refreshRail(); renderList(); syncPath();
}
window.openRoute = openRoute;
function gotoRouteStep(i) {
  const r = activeRoute(); if (!r) return;
  routeStepIdx = Math.max(0, Math.min(r.steps.length - 1, i));
  openPanel(r.steps[routeStepIdx].conceptId);
  syncPath();
}
window.gotoRouteStep = gotoRouteStep;
/* 点路线上的第 i 步：当前步原地展开卡片；点别的步＝把「当前步」挪过去 */
function pickRouteStep(i) {
  routeStepIdx = i;
  const r = activeRoute();
  openPanel(r.steps[i].conceptId);
  syncPath();
}
window.pickRouteStep = pickRouteStep;

/* ── 我的标记层：**不能自己标「学过」** ──────────────────────────
   所有者 09-12 08:47 的批评：「变成了一个摆设……这样子干你没法倒逼」
   原来自报——点一下「学过」就变绿，零证据。那就是摆设。
   现在：只有**写过一次复述、被判过**才可能有环。判定人不是学习者自己。
     pass = 复述过了（青环）
     fail = 验过、没过，正在倒回（红环）
     mech = 只过了机械覆盖检查，没经语义判定（琥珀环，不算学会）
     无环 = 没验过
   布局只由 nodes/edges 决定，标记不参与任何坐标计算。 */
const MARK_KEY = 'zss135.proof.v2';   // v1 是自报的，作废不迁移
let marks = {};   // { [id]: {state, said, missing:[], wrong:[], backTo:[], why, at} }
try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || '{}') || {}; } catch (e) { marks = {}; }
// 老版本存的是字符串 'learned'/'gap'，直接丢掉——那是自报，不是证据
for (const k of Object.keys(marks)) if (typeof marks[k] === 'string') delete marks[k];
function saveMarks() { try { localStorage.setItem(MARK_KEY, JSON.stringify(marks)); } catch (e) {} }

function refreshMarks() {
  if (window.refreshRail) refreshRail();
}
function markRead(id) {
  if (marks[id] && marks[id].state === 'read') delete marks[id];
  else marks[id] = { state: 'read', why: '这一类不设验收，只记读过', at: Date.now() };
  saveMarks(); refreshMarks();
  if (selected === id) openPanel(id);
}
window.markRead = markRead;
function clearProof(id) {
  delete marks[id]; saveMarks(); refreshMarks();
  if (selected === id) openPanel(id);
}
window.clearProof = clearProof;

/* ── 费曼验收：遮住原文，用自己的话说，系统挑漏，漏哪倒回哪 ────────
   判定口径写在提示词里：照抄不算过、只写几个词不算过、
   「意思差不多」不放过——因为判定器的工作是**挑漏**，不是发安慰分。 */
function judgeSys(kind) {
  const K = KIND[kind] || KIND.compute;
  return '你是学习验收的判定器。这个概念被判为「' + K.name + '」。\n'
    + '学习者的任务：' + K.ask + '\n'
    + K.rule + '\n'
    + '你的任务是**挑漏**，不是鼓励，不许给安慰分。\n'
    + '只输出 json：\n'
    + '{"verdict":"pass" 或 "fail",'
    + '"missing":["他漏掉的要点，每条 6-18 字，最多 3 条"],'
    + '"wrong":["他说错的地方，没有就空数组"],'
    + '"backTo":["先修概念 id，只能从下面给出的前置 id 里挑；漏的根在某个前置概念上就指向它，否则空数组"],'
    + '"why":"一句话 20-40 字，直接说他哪里没做到，不要客套"}\n'
    + '通用口径：只写了几个词、没成句 → fail；把原句换个说法照抄 → fail；拿不准就 fail。';
}

function judgeUserMsg(nd, said) {
  const pre = (neighbors.get(nd.id).pre || []).map(x => byId.get(x)).filter(Boolean);
  return '概念名：' + nd.name + '\n'
    + '验收类别：' + (KIND[kOf(nd)] || {}).name + '（' + (nd.kwhy || '') + '）\n'
    + '它讲的是什么（唯一判据）：' + nd.gloss + '\n'
    + '它的前置概念（backTo 只能指向这些 id）：\n'
    + (pre.length ? pre.map(x => '  ' + x.id + ' ｜ ' + x.name + ' ｜ ' + x.gloss).join('\n') : '  （没有前置）')
    + '\n\n学习者写的：' + said;
}

/* 机械兜底：没有模型可判时，只做**关键词覆盖检查**，并且如实标注它不是语义判定。
   它**不会**把概念标成 pass——只标 mech（琥珀环），因为过没过机器检查不等于懂没懂。 */
const STOP = new Set(['一个','这个','那个','的是','可以','就是','不是','或者','以及','通过','因为','所以','需要','没有','已经','什么','怎么','这样','那样','自己','我们','他们','这些','那些','但是','而且','如果','它们','也就是','指的是','一种','用来','能够','不会','会有','时候','东西','事情','问题','方式','方法','过程','情况','状态']);
function mechJudge(nd, said) {
  const raw = nd.gloss.match(/[A-Za-z][A-Za-z0-9+#.-]{1,}|[\u4e00-\u9fa5]{2,4}/g) || [];
  const key = [...new Set(raw)].filter(t => !STOP.has(t)).slice(0, 16);
  const miss = key.filter(t => !said.includes(t));
  const cover = key.length ? (key.length - miss.length) / key.length : 0;
  const k = kOf(nd);
  // judge 类要的是「你自己的判据与代价」，use 类要的是「一个真用过的例子」。
  // 关键词覆盖检查看不见这两样东西——所以这两类在没有模型时**只判 fail**，
  // 绝不给 mech 的琥珀环，免得把「词提到了」冒充成「判据给了 / 例子举了」。
  if (k === 'judge' || k === 'use') {
    return { verdict: 'fail', coverage: cover, missing: miss.slice(0, 5), wrong: [], backTo: [],
      why: '这一类要的是' + (k === 'judge' ? '你自己的判据与代价' : '一个你真用过的例子')
         + '，机械检查看不出来。本次没经语义判定 → 按没过记。', mechanical: true };
  }
  return {
    verdict: cover >= 0.5 ? 'mech' : 'fail',
    coverage: cover, missing: miss.slice(0, 5), wrong: [], backTo: [],
    why: '关键词覆盖 ' + Math.round(cover * 100) + '%（机械检查，不是语义判定）', mechanical: true,
  };
}

/* ══ 桌面版能力 ══════════════════════════════════════════════
   桌面版（app/main.js）跑的是**同一个服务**，但多了一个数据目录。
   /api/health 会回 {app:true, dataDir:"…"}；网页版永远是 false。
   多出来的只有一件事：**能写真文件**——
     · 自己的那棵树落成 学习记录.json（不是浏览器 localStorage，清一次就没了）
     · skill 产物落成 产物/<课题>.md（dbs-learning-beta 的 SKILL.md 写死的那条路径，
       网页版只能回一句「当前会话没有文件写入能力，先直接贴出」） */
let APP = { on: false, dir: null };
async function detectApp() {
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    APP = { on: !!j.app, dir: j.dataDir || null };
  } catch (e) { APP = { on: false, dir: null }; }
  const tag = document.getElementById('pubtag');
  if (tag && APP.on) { tag.textContent = '桌面版'; tag.title = '数据存在 ' + APP.dir; tag.style.display = ''; }
  return APP;
}
let judging = false;
async function judge(id) {
  const box = document.getElementById('said');
  const said = (box ? box.value : '').trim();
  const nd = byId.get(id);
  const err = document.getElementById('jerr');
  if (!nd || judging) return;
  if (said.length < 10) {
    if (err) err.textContent = said.length ? '太短了——至少写成一句话（10 字以上）。几个词不算复述。' : '先写点什么。遮住上面那句，用你自己的话说。';
    return;
  }
  if (kOf(nd) === 'accept') {
    if (err) err.textContent = '这一类不设验收——只记「读过」，不判过没过。';
    return;
  }
  judging = true;
  if (err) err.textContent = '判定中…';
  let v;
  try {
    v = await judgeCall(nd, said);
  } catch (e) {
    v = { verdict: 'fail', missing: [], wrong: [], backTo: [], why: '判定失败：' + (e.message || e) };
  }
  judging = false;
  marks[id] = {
    state: v.verdict, said, missing: v.missing || [], wrong: v.wrong || [],
    backTo: (v.backTo || []).filter(x => byId.has(x)), why: v.why || '',
    coverage: v.coverage, mechanical: !!v.mechanical, at: Date.now(),
  };
  saveMarks(); refreshMarks();
  if (selected === id) openPanel(id);
}
window.judge = judge;

/* 服务端/本地壳用的判定调用。公网版会把这一段换掉（见 scripts/build-public.mjs）。 */
async function judgeCall(nd, said) {
  const r = await fetch('/api/llm', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [{ role: 'system', content: judgeSys(kOf(nd)) },
                                      { role: 'user', content: judgeUserMsg(nd, said) }] }),
  });
  const j = await r.json();
  if (j.error) return mechJudge(nd, said);
  const txt = j.content || '{}';
  try { return JSON.parse(txt); } catch (e) { return mechJudge(nd, said); }
}
let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const tip = document.getElementById('tip');

/* ── 建立邻接 ───────────────────────────────────────── */
for (const [tid, pid] of edges) {
  neighbors.get(tid).pre.push(pid);
  neighbors.get(pid).post.push(tid);
}
for (const r of relations) {
  if (!byId.has(r.from) || !byId.has(r.to)) continue;
  relationNeighbors.get(r.from).push(r);
  relationNeighbors.get(r.to).push(r);
}

/* ── 布局 ───────────────────────────────────────────── */
// 确定性伪随机：同一概念每次抖动一致，resize / 切模式不会跳动
function hash01(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

// 图谱模式：纵轴 = 依赖层级，横轴 = 主题分列
let gridGap = 50, gridTop = 80, gridX0 = 0, gridColW = 60;
function layoutGrid() {
  const G = groups();
  const maxLv = Math.max(...nodes.map(n => n.level));
  // 路径模式：左上角那条路径宽 262px，图谱整体右移让开它——否则最左一列的点会躲在
  // 条下面，画布上的点击被条吃掉（命中回归测试正是这么发现的）。
  // 详情打开时路径条自己隐藏（卡片上写着同一套上下文），这时不用让位。
  const rail = mode === 'path' && !document.getElementById('main').classList.contains('pinned');
  const x0 = W * (rail ? 0.37 : 0.29), x1 = W * 0.94;
  const colW = (x1 - x0) / Math.max(1, G.length);
  const gap = Math.min(54, (H * 0.78) / Math.max(1, maxLv));
  const yTop = H * 0.135;
  const buckets = G.map(() => new Map());
  for (const n of nodes) {
    const b = buckets[Math.min(giOf(n), G.length - 1)];
    if (!b.has(n.level)) b.set(n.level, []);
    b.get(n.level).push(n);
  }
  for (let ci = 0; ci < G.length; ci++) {
    for (const [lv, arr] of buckets[ci]) {
      arr.forEach((n, i) => {
        const t = arr.length === 1 ? 0.5 : i / (arr.length - 1);
        n.gx = x0 + ci * colW + colW * (0.17 + t * 0.66) + (hash01(n.id) - 0.5) * colW * 0.40;
        n.gy = yTop + lv * gap + (hash01(n.id + 'y') - 0.5) * gap * 0.55;
      });
    }
  }
  gridGap = gap; gridTop = yTop; gridX0 = x0; gridColW = colW;
}

// 星球模式：球面均布（形式参考 candobear 智慧星球）
// 不跑力导向 —— 边引力会把均匀球面拉歪；用 hash 打散顺序，颜色自然混合
function layoutSphere() {
  const R = 430;
  const order = nodes.slice().sort((a, b) => hash01(a.id) - hash01(b.id));
  const N = order.length, ga = Math.PI * (3 - Math.sqrt(5));
  order.forEach((n, i) => {
    const y = 1 - (i / Math.max(1, N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = ga * i;
    n.x = Math.cos(th) * r * R; n.y = y * R; n.z = Math.sin(th) * r * R;
  });
}

function computeLayout() {
  if (mode === 'grid' || mode === 'path') layoutGrid();   // 路径沿用图谱的分列坐标，只换渲染
  else if (mode === 'sphere') layoutSphere();
}

/* ── 分组轴：只按主题分列 ───────────────────────────────────
   09-13 所有者要求做减法：知识体系直接按主题分，策展那一层不再单独存在。
   原来还能按「怎么验」（kind）和「来源」（src）分列，现在两条都撤了——
   验收方式仍然写在每张卡片上（面板里的 KIND），只是不再当分列轴。 */
const TAGI = new Map((CUR.tags || []).map((t, i) => [t.id, i]));
function giOf(n) {
  const t = (n.tags || [])[0];
  return TAGI.has(t) ? TAGI.get(t) : (CUR.tags || []).length;
}
function groups() {
  const g = (CUR.tags || []).map(t => ({ id: t.id, label: t.name, color: t.color }));
  const un = nodes.filter(x => !TAGI.has((x.tags || [])[0])).length;
  if (un) g.push({ id: '__un', label: '未分类', color: '#4a4a55' });
  return g;
}
function groupCount(g) {
  if (g.id === '__un') return nodes.filter(x => !TAGI.has((x.tags || [])[0])).length;
  return nodes.filter(x => (x.tags || [])[0] === g.id).length;
}
/* 口径统一到「主标签」：中间栏数出来的条数、画布上那一列的点数、筛选后剩的点数，
   三个数字必须一致。原来这里用 includes（相关标签也算），数字对不上。 */
function matches(x) {
  if (!filter) return true;
  if (filter === '__un') return !TAGI.has((x.tags || [])[0]);
  return (x.tags || [])[0] === filter;
}

/* ── 投影 ───────────────────────────────────────────── */
function project(n) {
  if (mode === 'grid' || mode === 'path') { // 图谱与路径：同一套正交坐标（路径只改渲染）
    const s = zoom;
    return { sx: CX + (n.gx + panX - CX) * s, sy: CY + (n.gy + panY - CY) * s, s: s * 1.25, z: 0 };
  }
  if (mode === 'relation') {               // 关系：构建时生成的确定性力导向坐标
    const s = Math.min(W, H) * 0.42 * zoom;
    return { sx: CX + (n.rx || 0) * s + panX, sy: CY + (n.ry || 0) * s + panY,
      s: Math.max(.72, zoom), z: 0 };
  }
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  let x = n.x * cy - n.z * sy;
  let z = n.x * sy + n.z * cy;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const y = n.y * cx - z * sx;
  const z2 = n.y * sx + z * cx;
  const D = 1500;
  const s = zoom * D / (D + z2 + 700);
  return { sx: CX + x * s, sy: CY - y * s, s, z: z2 };
}

/* ── 渲染 ───────────────────────────────────────────── */
let frame = 0;
function render() {
  frame++;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // 背景微光
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.62);
  g.addColorStop(0, 'rgba(30,32,48,0.55)');
  g.addColorStop(1, 'rgba(8,8,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const pts = nodes.map(n => ({ n, ...project(n) }));
  /* 路径模式：路线上的点，即使被主题筛选排除也保持点亮——否则「主区高亮整条路径」
     会在点了一条主题之后断成几截（路线横跨 4 个主题）。其余概念降噪到 0.1，仍可点。 */
  const route = mode === 'path' ? activeRoute() : null;
  const visible = n => matches(n) || (!!route && routeHas(n.id));
  const G = groups();

  // 图谱模式：列带 + 层级参考线 + 列顶标签（形式参考 candobear 学科图谱）
  if (mode === 'grid' || mode === 'path') {
    const s = zoom;
    const gx0 = CX + (gridX0 + panX - CX) * s;
    const colW = gridColW * s;
    const maxLv = Math.max(...nodes.map(n => n.level));
    for (let i = 0; i < G.length; i++) {
      ctx.globalAlpha = (!filter || filter === G[i].id) ? 0.055 : 0.012;
      ctx.fillStyle = G[i].color;
      ctx.fillRect(gx0 + i * colW, 0, colW - 1.5, H);
    }
    ctx.globalAlpha = 1;
    ctx.font = '9px -apple-system,"PingFang SC",sans-serif';
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let lv = 0; lv <= maxLv; lv++) {
      const y = CY + (gridTop + lv * gridGap + panY - CY) * s;
      if (y < 58 || y > H - 26) continue;
      ctx.beginPath(); ctx.moveTo(gx0, y); ctx.lineTo(gx0 + G.length * colW, y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.textAlign = 'left';
      ctx.fillText('L' + lv, gx0 + G.length * colW + 9, y + 3);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i < G.length; i++) {
      ctx.globalAlpha = (!filter || filter === G[i].id) ? 0.8 : 0.2;
      ctx.fillStyle = G[i].color;
      ctx.fillText(G[i].label + ' ' + groupCount(G[i]), gx0 + i * colW + colW / 2, gridTop - 28);
    }
    ctx.globalAlpha = 1;
  }

  // 边：依赖视图沿用 hard/soft 线型；关系视图按关系类型着色，并保留前置方向。
  ctx.lineWidth = 1;
  if (mode === 'relation') {
    const drawArrow = (a, b, color, alpha) => {
      const ang = Math.atan2(b.sy - a.sy, b.sx - a.sx);
      const size = 5.5;
      ctx.fillStyle = color.replace('ALPHA', alpha);
      ctx.beginPath();
      ctx.moveTo(b.sx, b.sy);
      ctx.lineTo(b.sx - Math.cos(ang - .45) * size, b.sy - Math.sin(ang - .45) * size);
      ctx.lineTo(b.sx - Math.cos(ang + .45) * size, b.sy - Math.sin(ang + .45) * size);
      ctx.closePath(); ctx.fill();
    };
    for (const r of relations) {
      const a = byId.get(r.from), b = byId.get(r.to);
      if (!a || !b || !visible(a) || !visible(b)) continue;
      const pa = project(a), pb = project(b);
      const hot = (selected && (r.from === selected || r.to === selected))
               || (hovered && (r.from === hovered || r.to === hovered));
      const rgb = RELATION_COLORS[r.kind] || '#88909c';
      const alpha = hot ? .88 : (r.strength === 'hard' ? .36 : .18);
      ctx.strokeStyle = hot ? 'rgba(255,255,255,' + alpha + ')' : rgb;
      ctx.globalAlpha = hot ? 1 : alpha;
      ctx.lineWidth = hot ? 1.8 : (r.strength === 'hard' ? 1.05 : .7);
      if (r.strength !== 'hard' && !hot) ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (r.kind === 'prerequisite') {
        drawArrow(pa, pb, hot ? 'rgba(255,255,255,ALPHA)' : 'rgba(168,181,238,ALPHA)', hot ? 1 : alpha);
      }
    }
  } else {
    for (const [tid, pid, votes] of edges) {
      const a = byId.get(tid), b = byId.get(pid);
      if (!visible(a) || !visible(b)) continue;
      const pa = project(a), pb = project(b);
      const depth = (pa.z + pb.z) / 2;
      const hot = selected && (tid === selected || pid === selected)
               || hovered && (tid === hovered || pid === hovered);
      const solid = votes >= 7;
      const mid = votes >= 2;
      const base = solid ? 0.26 : mid ? 0.12 : 0.06;
      // 路径模式：整张依赖图退成背景（路线本身另画一条实线），只留被指到的边发亮
      let alpha = hot ? 0.8 : Math.max(0.022, base - depth / 12000);
      if (route && !hot) alpha *= 0.4;
      ctx.strokeStyle = hot ? 'rgba(255,255,255,' + alpha + ')'
                            : solid ? 'rgba(178,188,225,' + alpha + ')'
                                    : 'rgba(120,128,165,' + alpha + ')';
      ctx.lineWidth = hot ? 1.6 : solid ? 1.05 : 0.6;
      if (!solid && !hot) ctx.setLineDash(votes >= 2 ? [2.5, 3] : [1.5, 4]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      if (!solid && !hot) ctx.setLineDash([]);
    }
  }

  // 路径：主路径连线（当前步之前＝已走过，之后＝未走），画在点下面
  if (route) {
    ctx.lineWidth = 2;
    for (let i = 0; i < route.steps.length - 1; i++) {
      const a = byId.get(route.steps[i].conceptId), b = byId.get(route.steps[i + 1].conceptId);
      if (!a || !b) continue;
      const pa = project(a), pb = project(b);
      const past = i < routeStepIdx;
      ctx.strokeStyle = past ? 'rgba(76,183,130,.75)' : (i === routeStepIdx ? 'rgba(124,134,232,.85)' : 'rgba(94,106,210,.30)');
      ctx.setLineDash(past ? [] : [4, 4]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 点（远的先画）。路径模式下**分两趟**：先画背景里的灰点，再画路线上的点——
  // 否则密列里后画的灰点会盖住当前步，画面上「当前节点高亮」就没了（实测：当前步像素
  // 174 比灰点 167 只亮 7，等于没高亮）。两趟之后当前步一定在最上层。
  pts.sort((a, b) => b.z - a.z);
  const drawPt = (p) => {
    const n = p.n;
    const on = visible(n);
    const ri = route ? routeIndexOf(n.id) : -1;
    const onRoute = ri >= 0;
    const isSel = selected === n.id, isHov = hovered === n.id;
    const degree = mode === 'relation' ? relationNeighbors.get(n.id).length
      : neighbors.get(n.id).pre.length + neighbors.get(n.id).post.length;
    const base = (2.2 + Math.sqrt(degree) * 1.05) * p.s;
    // 路线上的点固定放大到看得见；其他概念在路径模式下**变灰 + 缩小**——
    // 只压透明度是不够的：密列里几十个点叠在一起会重新叠成一片亮色（实测像素一样亮）。
    // 灰是叠不亮的，再缩一点，路线的形状才浮得出来。
    const r = Math.max(1.1, base * (onRoute ? 1.5 : 0.8) * (isSel ? 2.1 : isHov ? 1.65 : 1));
    const col = G[Math.min(giOf(n), G.length - 1)].color;
    const greyed = !!route && !onRoute && !isSel && !isHov;
    ctx.globalAlpha = route
      ? (onRoute ? (ri === routeStepIdx ? 1 : .95) : (greyed ? .5 : (on ? .9 : .25)))
      : (on ? Math.min(1, 0.42 + p.s * 0.7) : 0.06);
    // 光晕
    if (isSel || isHov || (route && ri === routeStepIdx)) {
      ctx.shadowBlur = 22; ctx.shadowColor = col;
    }
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, 6.2832);
    ctx.fillStyle = greyed ? '#34373d' : col; ctx.fill();
    ctx.shadowBlur = 0;
    // 我的标记环：只加环，不改填充色，不动坐标
    const mk = marks[n.id];
    if (mk && on && !greyed) {
      const st = mk.state || 'fail';
      ctx.globalAlpha = (isSel || isHov) ? 1 : 0.92;
      ctx.strokeStyle = st === 'pass' ? '#5ee0c0' : st === 'mech' ? '#e0a94a'
                      : st === 'read' ? '#9661BC' : '#ff4d4d';
      ctx.lineWidth = st === 'pass' ? 2 : 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 2.8, 0, 6.2832); ctx.stroke();
    }
    // 当前步：白环 + 步号，画布上自己就说得清「现在这一步」（HANDOFF §四.3）
    if (route && ri === routeStepIdx && !isSel) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 5, 0, 6.2832); ctx.stroke();
    }
    if (route && onRoute) {
      ctx.globalAlpha = 1;
      ctx.font = '10px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = ri === routeStepIdx ? '#fff' : 'rgba(255,255,255,.62)';
      ctx.fillText(String(ri + 1), p.sx + r + 5, p.sy + 3.5);
    }
    if (isSel) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 3.5, 0, 6.2832); ctx.stroke();
    }
    if (isHov) {
      ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.globalAlpha = .78;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6.5, 0, 6.2832); ctx.stroke();
    }
  };
  if (route) for (const p of pts) if (routeIndexOf(p.n.id) < 0) drawPt(p);
  for (const p of pts) if (!route || routeIndexOf(p.n.id) >= 0) drawPt(p);
  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

/* ── 尺寸 ───────────────────────────────────────────── */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // 画布现在只在主区内（左栏 224 + 列表栏 302），不再铺满窗口
  const main = document.getElementById('main');
  const r = main.getBoundingClientRect();
  // 详情打开时画布被 inset 掉 412px，但 #main 本身没变宽——
  // 所以这里要自己减掉，否则布局按 914 算、画布只有 502，右边两列被切掉。
  const pinned = main.classList.contains('pinned');
  W = Math.max(320, Math.round(r.width - (pinned ? 412 : 0)));
  H = Math.max(240, Math.round(r.height));
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  CX = W * (W > 820 ? 0.60 : 0.5);
  CY = H * 0.54;
  if ((mode === 'grid' || mode === 'path') && nodes.length) layoutGrid();
}
window.addEventListener('resize', resize);

/* ── 交互 ───────────────────────────────────────────── */
let dragging = false, moved = 0, lastX = 0, lastY = 0;
function canvasPoint(e) {
  const r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * W / Math.max(1, r.width),
    y: (e.clientY - r.top) * H / Math.max(1, r.height),
  };
}
function showTip(id) {
  const n = byId.get(id);
  if (!n) return;
  const p = project(n);
  const r = cvs.getBoundingClientRect();
  const sx = r.left + p.sx * r.width / Math.max(1, W);
  const sy = r.top + p.sy * r.height / Math.max(1, H);
  tip.textContent = n.name;
  tip.classList.add('on');
  const gap = 12, tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = sx + gap;
  if (left + tw > window.innerWidth - 8) left = sx - tw - gap;
  let top = sy - th - gap;
  if (top < 8) top = sy + gap;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, left)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 8, top)) + 'px';
}
cvs.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  cvs.classList.add('drag'); cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (mode === 'grid' || mode === 'relation' || mode === 'path') { panX += dx; panY += dy; }
    else { rotY += dx * 0.0062; rotX = Math.max(-1.25, Math.min(1.25, rotX + dy * 0.0062)); }
    lastX = e.clientX; lastY = e.clientY;
  } else {
    const pt = canvasPoint(e);
    hovered = pick(pt.x, pt.y);
    cvs.style.cursor = hovered ? 'pointer' : 'grab';
    if (hovered) showTip(hovered); else tip.classList.remove('on');
  }
});
cvs.addEventListener('pointerup', e => {
  dragging = false; cvs.classList.remove('drag');
  if (moved < 5) { const pt = canvasPoint(e); const hit = pick(pt.x, pt.y); hit ? openPanel(hit) : closePanel(); }
});
cvs.addEventListener('pointerleave', () => { tip.classList.remove('on'); hovered = null; });
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(3.2, zoom * (1 - e.deltaY * 0.0011)));
}, { passive: false });

function pick(mx, my) {
  let best = null, bestD = 17;
  const route = mode === 'path' ? activeRoute() : null;
  for (const n of nodes) {
    // 路径模式下路线上的点也要能点——其他概念只降噪，不是不可点（HANDOFF §八：仍可回全图探索）
    if (!matches(n) && !(route && routeHas(n.id))) continue;
    const p = project(n);
    const d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bestD) { bestD = d; best = n.id; }
  }
  return best;
}

/* ── 面板 ───────────────────────────────────────────── */
/* ── 来源：粗标签之外的「这篇概念是从哪篇原文来的」 ────────────────
   原来概念卡上的来源是个死标签（只印 notion / context / harness 之一），点不动。
   实测 936 个概念里 897 个只有 1 篇来源，最多的是 Harness（21 篇）—— 只列前 6 篇，
   每篇带「同源概念」（同一篇原文里还长出过哪些概念），点一下直接跳过去。 */
function srcBlockOf(n) {
  const arts = (n.sa || []).map((i) => ({ i, a: articles[i] })).filter((x) => x.a && x.a.u);
  if (!arts.length) return '';
  const rows = arts.slice(0, 6).map(({ i, a }) => {
    const sibs = nodes.filter((x) => x.id !== n.id && (x.sa || []).includes(i));
    const label = a.s === 'notion' ? 'Notion 概念库' : a.t;
    return `<li><a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(label)} <i>↗</i></a>
      ${sibs.length ? `<em>同源 ${sibs.length}</em>` : ''}
      ${sibs.length ? `<div class="sib">${sibs.slice(0, 8).map((x) =>
        `<button onclick="openPanel('${x.id}')">${esc(x.name)}</button>`).join('')}${
        sibs.length > 8 ? `<span class="mut">…还有 ${sibs.length - 8} 个</span>` : ''}</div>` : ''}</li>`;
  }).join('');
  return `<details class="deep">
    <summary>来源 · ${arts.length} 篇${arts.length > 1 ? '（这个概念在多篇原文里都出现过）' : ''}</summary>
    <ul class="srclist">${rows}</ul>
    ${arts.length > 6 ? `<div class="mut" style="margin-top:6px">还有 ${arts.length - 6} 篇没列。</div>` : ''}
  </details>`;
}
/* ══ 概念卡上的路径上下文（HANDOFF §四.4）══════════════════════════
   方案 B 的落点：卡片顶部先说清「现在第几步 / 为什么现在学它 / 前置是什么 / 下一步去哪 /
   卡住了回哪」。四类关系按 HANDOFF §五分开显示，不再混成一坨：
     强前置 hard  → 地图里 strength=hard 的边（不懂就立不住）
     弱前置 soft  → 地图里其余依赖边（懂了更顺，可跳过）
     支撑材料 support → 这个概念的来源/原文与掌握证据（就是卡上已有的「来源」「深看」）
     相关概念 related → 关系层里除 prerequisite 外的边，折叠，不进主路径
   data 没有 support / related 统一字段，这里是**映射展示**，没有改全量关系数据结构。 */
const REL_SHORT = { 'related-to': '相关', 'used-with': '一起使用', 'part-of': '组成', contrast: '对照' };
function mkOf(id) {
  const s = (marks[id] || {}).state;
  return s === 'pass' ? ' ✓' : s === 'read' ? ' ✓' : s === 'mech' ? ' ·机器过' : s === 'fail' ? ' ·没过' : '';
}
function pathBlock(id) {

      <button onclick="pickRouteStep(${routeStepIdx})">回到路径第 ${routeStepIdx + 1} 步</button></div>`;
  }
  const st = r.steps[idx];
  const nxt = r.steps[idx + 1];
  const br = (r.branches || []).find(b => b.after === st.conceptId);
  const hard = st.mapHard || [], soft = st.mapSoft || [], rel = st.related || [];
  const relRows = rel.slice(0, 6).map(x => {
    const ri = routeIndexOf(x.id);
    return `<li class="rel pick" onclick="openPanel('${x.id}')">

      <em>${esc(REL_SHORT[x.kind] || x.kind)}${x.note ? ' · ' + esc(String(x.note).slice(0, 60)) : ''}</em></li>`;
  }).join('');
  const hardRows = hard.length
    ? hard.map(x => `<li class="pick" onclick="openPanel('${x.id}')"><b>${esc(x.name)}</b><em>${esc(String(x.reason || '').slice(0, 70))}</em></li>`).join('')
    : `<div class="none">概念地图里这一步没有 hard 前置——整条路线的顺序是人工确认的（basis: route），不是从依赖边自动推出来的。</div>`;
  const softRows = soft.length
    ? soft.map(x => `<li class="soft pick" onclick="openPanel('${x.id}')"><b>${esc(x.name)}</b><em>${esc(String(x.reason || '').slice(0, 70))}</em></li>`).join('')
    : '<div class="none">没有弱前置。</div>';
  return `<div class="pctx">
    <div class="k">当前路径第 ${idx + 1} 步 / 共 ${r.steps.length} 步 · ${esc(r.topicName)}</div>

    <div class="nav">
      ${st.prereq ? `前置：<button onclick="openPanel('${st.prereq.id}')">${esc(st.prereq.name)}</button><i>${mkOf(st.prereq.id) || '（未走）'}</i><br>` : '前置：无（这是这条路径的起点）<br>'}
      ${nxt ? `下一步：<button onclick="openPanel('${nxt.conceptId}')">${esc(nxt.name)}</button><br>` : '下一步：走到头了——回看停止条件<br>'}
      ${st.fallback ? `卡住时回退：<button onclick="openPanel('${st.fallback.id}')">${esc(st.fallback.name)}</button>` : ''}

      ${chapterOf(id) ? `<button class="jbtn ghost" onclick="openLearnIndex()">学习空间 · Agent Loop 六章</button>` : ''}
      <button class="jbtn ghost" onclick="openPractice('${id}')">进入 1 / 3 / 5 · 01 案例决策场</button>
      <button class="jbtn ghost" onclick="this.closest('.pctx').querySelector('details').open=true">查看前置理由</button>
    </div>
    <div class="loop-note"><b>1 / 3 / 5 学习闭环：</b>${chapterOf(id) ? `这一步已装配「${esc(chapterOf(id).title)}」章节材料，点「${learnEntryLabel(id)}」进独立学习空间（隐藏全图与主题列表，返回时回到这一步）。` : '从当前概念进入 01 案例决策场，再回到这条路径继续学习。03 / 05 暂未开放。'}</div>
    <details>

      <div class="none">这个概念有 <b>${st.support.sources}</b> 篇来源原文、<b>${st.support.evidence}</b> 条掌握证据 —— 就在下面「来源」和「深看」两块里，不在这里重复一遍。</div>
      <h5>相关概念 related · 有关，但不是这条路径的必需</h5>
      <ul>${relRows || '<li class="none">没有语义关系边。</li>'}</ul>
      ${st.relatedCount > rel.length ? `<div class="none">还有 ${st.relatedCount - rel.length} 条相关关系，画布中已全部保留。</div>` : ''}
      <h5>路线声明的前置理由</h5>
      <div class="none">${st.prereq ? esc(st.prereq.reason) + `（依据：${st.prereq.basis === 'hard' ? '概念地图 hard 依赖边' : st.prereq.basis === 'soft' ? '概念地图 soft 依赖边' : '人工确认的路线前置'}）` : '起点，无前置。'}</div>
      ${st.fallback ? `<h5>卡住时为什么回这一步</h5><div class="none">${esc(st.fallback.reason)}</div>` : ''}
    </details>
    ${br ? `<div class="pr-block" style="border-top:0;margin-top:6px;padding-top:0">
      <div class="pr-bq">${esc(br.question)}（最多 2 个）</div>
      ${br.options.map(o => `<button class="pr-opt" onclick="openPanel('${o.id}')">${esc(o.name)}<em>${o.role === 'main' ? '主推荐' : '分支'}</em><span>${esc(o.reason)}</span></button>`).join('')}
    </div>` : ''}
    <div class="pr-foot">
      <button onclick="gotoRouteStep(${idx + 1 < r.steps.length ? idx + 1 : idx})">${idx + 1 < r.steps.length ? '走到下一步 →' : '这是最后一步'}</button>
      <button onclick="setMode('grid')">回到全图</button>
    </div>
  </div>`;
}
window.pickRouteStep = pickRouteStep; window.gotoRouteStep = gotoRouteStep;
/* 「学习这个」不写任何验收状态，只把视野挪到交卷框——费曼不在本计划范围内（PLAN §4.4） */

function openPanel(id) {
  selected = id;
  const n = byId.get(id), nb = neighbors.get(id);
  const rnb = relationNeighbors.get(id) || [];
  const src = sources.find(s => s.id === n.src);
  const pre = nb.pre.map(x => byId.get(x)).filter(Boolean);
  const post = nb.post.map(x => byId.get(x)).filter(Boolean);
  const mk = marks[id];
  const kk = kOf(n);
  const tags = (n.tags || []).map(t => (CUR.tags.find(x => x.id === t) || {}).name).filter(Boolean);

  let verdict = '';
  if (mk) {
    const tone = mk.state === 'pass' ? 'ok' : mk.state === 'mech' ? 'mech' : mk.state === 'read' ? 'read' : 'bad';
    const title = mk.state === 'read' ? '读过了（这一类不设验收）'
      : mk.state === 'pass' ? '复述过了'
      : mk.mechanical ? '没过 · 只做了机械检查（没经语义判定）'
      : mk.state === 'mech' ? '只过了机械检查（没经语义判定，不算学会）'
      : '没过 · 正在倒回';
    verdict = `<div class="jverdict ${tone}">

      ${mk.missing && mk.missing.length ? `<div class="jmiss">漏了：${mk.missing.map(esc).join(' · ')}</div>` : ''}
      ${mk.wrong && mk.wrong.length ? `<div class="jmiss">说错了：${mk.wrong.map(esc).join(' · ')}</div>` : ''}
      ${mk.backTo && mk.backTo.length
        ? `<div class="backto">倒回 → ${mk.backTo.map(b => `<button onclick="openPanel('${b}')">${esc(byId.get(b).name)}</button>`).join('')}</div>`
        : ''}
      <div class="mut" style="margin-top:6px;font-size:10.5px">你写的是：${esc((mk.said || '').slice(0, 120))}${(mk.said || '').length > 120 ? '…' : ''}</div>
      ${mk.mechanical ? `<div class="mut" style="margin-top:5px;font-size:10.5px;color:#e0a94a">
        这次只做了机械检查。想要真判定：本地跑 <code>node scripts/serve-135.mjs</code>。</div>` : ''}
      <div class="markrow" style="margin-top:8px">
        <button class="mk quiet" onclick="clearProof('${id}')">重写一遍（清掉这次）</button>
      </div>
    </div>`;
  }

  const relationGroups = {};
  for (const r of rnb) {
    const kind = r.kind || 'related-to';
    if (!relationGroups[kind]) relationGroups[kind] = [];
    relationGroups[kind].push(r);
  }
  const relationHtml = Object.entries(relationGroups)
    .sort(([a], [b]) => (RELATION_NAMES[a] || a).localeCompare(RELATION_NAMES[b] || b, 'zh-CN'))
    .map(([kind, list]) => {
      const rows = list.slice(0, 8).map(r => {
        const other = byId.get(r.from === id ? r.to : r.from);
        if (!other) return '';
        const direction = kind === 'prerequisite' ? (r.from === id ? '先懂' : '解锁') : (RELATION_NAMES[kind] || '关系');
        const strength = r.strength === 'hard' ? '强' : r.strength ? '弱' : '';
        const source = r.origin || r.source || '';
        const note = [strength, source, r.note || r.evidence || ''].filter(Boolean).join(' · ');
        return `<li onclick="openPanel('${other.id}')"><div class="rel-name"><i style="background:${RELATION_COLORS[kind] || '#88909c'}"></i><b>${esc(other.name)}</b><em>${direction}</em></div>${note ? `<div class="rel-note">${esc(String(note).slice(0, 100))}</div>` : ''}</li>`;
      }).join('');
      return rows ? `<h5>${esc(RELATION_NAMES[kind] || kind)} · ${list.length}</h5><ul class="rel-list">${rows}</ul>` : '';
    }).join('');

  document.getElementById('pbody').innerHTML = `
    ${pathBlock(id)}
    <div class="src"><span style="color:${KIND[kk].color}">■</span> ${KIND[kk].name}
      · <span class="mut">${esc(n.kwhy || '')}</span></div>
    <div class="src" style="margin-top:6px">${esc(tags.length ? tags.join(' · ') : (src ? src.label : n.src))} · ${esc(n.type)}</div>
    <h2>${esc(n.name)}</h2>
    <div class="gloss">${esc(n.gloss)}</div>
    ${caseMvpLink(n)}
    ${srcBlockOf(n)}
    ${((n.evidence||[]).length || n.ap) ? `<details class="deep"${kk === "accept" ? " open" : ""}>
      <summary>深看 · 做到这些才算会${n.ap ? " · 验收问句" : ""}</summary>
      ${(n.evidence||[]).length ? `<h5>掌握证据（可观察的行为，不是「理解了」）</h5><ul>${n.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
      ${n.ap ? `<h5>验收问句</h5><div class="mut">${esc(n.ap)}</div>` : ''}
      ${n.stage ? `<h5>什么时候学</h5><div class="mut">${({now:'现在先懂——不懂就没法往下',"when-needed":'做到这里再懂——用得到时再学',"deep-dive":'深入研究再懂——要专门花时间'})[n.stage] || ''}</div>` : ''}
    </details>` : ''}
    ${(n.feynman || n.sourceContext || (n.aliases || []).length || n.nameEn) ? `<details class="deep">
      <summary>费曼一下 · 原文 context · 别名${(mk && (mk.state === 'pass' || mk.state === 'mech' || mk.state === 'read')) ? '' : '（随时可看，不用先答）'}</summary>
      ${n.feynman ? `<h5>费曼一下</h5><div class="mut">${esc(n.feynman)}</div>` : ''}
      ${n.sourceContext ? `<h5>原文 context</h5><div class="mut">${esc(String(n.sourceContext).slice(0, 900))}</div>` : ''}
      ${(n.aliases||[]).length ? `<h5>别名</h5><div class="mut">${n.aliases.map(a => esc(a)).join('、')}</div>` : ''}
      ${n.nameEn ? `<h5>英文</h5><div class="mut">${esc(n.nameEn)}</div>` : ''}
    </details>` : ''}
    <div class="metrics">
      <div class="m"><b>${pre.length}</b><span>前置</span></div>
      <div class="m"><b>${post.length}</b><span>解锁</span></div>
      <div class="m"><b>L${n.level}</b><span>层级</span></div>
    </div>

    ${kk === 'accept' ? `<div class="dpane quiet">
      <h5>这一类不设验收</h5>
      <div class="mut">它被判为「<b>只能认的</b>」——${esc(n.kwhy || '作者的世界观、立场或比喻')}。<br>
      没有机制可复述，也没有对错。<b>硬考它就是假学习，所以我们不考。</b><br>
      读过就够了。这一类的价值不在于能不能复述，而在于你认不认它。</div>
      <div class="jrow">
        <button class="jbtn ghost" onclick="markRead('${id}')">${mk && mk.state === 'read' ? '读过了（点一下取消）' : '我读过了'}</button>
      </div>
    </div>` : `<div class="dpane">
      <h5>倒逼 · 你不能自己标「学过」</h5>
      <div class="mut"><b>${KIND[kk].name}</b> · ${esc(n.kwhy || '')}<br>
      ${KIND[kk].ask}</div>
      <textarea id="said" placeholder="别抄上面那句。抄了不算过。">${mk ? esc(mk.said || '') : ''}</textarea>
      <div class="jrow">
        <button class="jbtn" onclick="judge('${id}')">交卷，让系统挑漏</button>
        <span id="jerr" class="jerr"></span>
      </div>
    </div>`}
    ${verdict}

    ${pre.length ? `<h5>要理解它，先懂这些</h5><ul>${pre.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}<em>L${x.level}${marks[x.id] ? (marks[x.id].state === 'pass' ? ' · 已过' : marks[x.id].state === 'mech' ? ' · 机器过' : ' · 没过') : ''}</em></li>`).join('')}</ul>` : ''}
    ${post.length ? `<h5>懂了它，才能懂这些</h5><ul>${post.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}<em>L${x.level}</em></li>`).join('')}</ul>` : ''}
    ${relationHtml ? `<div class="relation-block"><h5>语义关系 · ${rnb.length}</h5>${relationHtml}${rnb.length > 40 ? `<div class="mut">还有 ${rnb.length - 40} 条关系，画布中已全部保留。</div>` : ''}</div>` : ''}

    ${(mk && (mk.state === 'pass' || mk.state === 'mech')) ? `<div class="nexthint">${
      post.length ? `过了。要不要接着往上游走？<br>${post.slice(0, 3).map(x => `<button class="jbtn ghost" onclick="openPanel('${x.id}')">${esc(x.name)}</button>`).join(' ')}` : '这张卡你已经验过了。'
    }</div>` : ''}
  `;
  document.getElementById('panel').classList.add('on');
  pinMain(true);
  if (typeof syncListSel === 'function') syncListSel();
}

/* 案例决策场 1：概念集合不假设一一对应，本轮只接入一个已验证案例。
   09-13 追加：Agent Loop 六步已装配章节材料，卡上直接给独立学习空间入口。 */
function caseMvpLink(n) {
  const ch = chapterOf(n.id);
  const hasCase = n.name === '上下文腐烂';
  return `<div class="case-mvp"><h4>学习空间</h4>
    <div class="case-meta">从这张概念卡进入学习，不丢失当前概念和路径位置。${ch ? `本概念是 Agent Loop 第 ${ch.order} 章，已装配：一个核心概念 → 原文 context → 三道决策 → 费曼收尾。` : ''}</div>
    ${ch ? `<button class="jbtn" onclick="openLearnFor('${n.id}')">学习这个 · 第 ${ch.order} 章 →</button>` : ''}
    <button class="jbtn${ch ? ' ghost' : ''}" onclick="openPractice('${n.id}')">进入学习空间 →</button>
    ${ch ? `<button class="jbtn ghost" onclick="openLearnIndex()">六章总览</button>` : ''}
    ${hasCase ? '<div class="case-meta" style="margin-top:5px">本概念已有 01 案例决策材料。</div>' : (ch ? `<div class="case-meta" style="margin-top:5px">候选装配稿：主案例为${esc(ch.case.type)}、负责人尚未确认。</div>` : '<div class="case-meta" style="margin-top:5px">本概念的 01 / 03 / 05 材料尚在装配中。</div>')}
  </div>`;
}
function openCaseMvp() {
  const p = document.getElementById('pbody');
  p.innerHTML = `<div class="case-mvp" style="border:0;padding:0;background:none">
    <button class="jbtn ghost case-back" onclick="openPanel(selected)">← 返回概念</button>
    <h2>1 · 案例决策场</h2>
    <div class="case-meta">案例：CAS-context-rot · 假设场景 · 本轮只验收一个方向</div>
    <h4>情境</h4><p>同一模型、同一任务、同一批关键证据，短输入时稳定；加入大量无关材料后开始漏答。你下一步先做什么？</p>
    <h4>选择一个方向</h4>
    <button class="case-option" onclick="judgeCaseMvp(this,false)"><b>A.</b> 先换更大的模型。</button>
    <button class="case-option" onclick="judgeCaseMvp(this,true)"><b>B.</b> 固定模型、任务、关键证据和评分方法，只分档增加无关材料。</button>
    <button class="case-option" onclick="judgeCaseMvp(this,false)"><b>C.</b> 先换更大的上下文窗口规格。</button>
    <div id="case-mvp-result"></div>
  </div>`;
}
window.openCaseMvp = openCaseMvp;
function judgeCaseMvp(button, ok) {
  document.querySelectorAll('.case-option').forEach(b => b.classList.remove('ok','bad'));
  button.classList.add(ok ? 'ok' : 'bad');
  document.getElementById('case-mvp-result').innerHTML = ok
    ? '<div class="case-result"><b>方向成立。</b>先固定变量，再把输入长度作为唯一变化量；否则无法判断退化来自哪里。依据：OPI-CTX-03-03、SOL-context-rot。</div>'
    : '<div class="case-result"><b>这不是本轮要验收的方向。</b>先回到情境：要把输入长度单独隔离出来，才能判断是否发生利用退化。</div>';
}
window.judgeCaseMvp = judgeCaseMvp;
function pinMain(on) {
  const m = document.getElementById('main');
  if (!m || m.classList.contains('pinned') === on) return;
  m.classList.toggle('pinned', on);
  // 画布宽度变了，重新投影一次（rv 每帧都在跑，不用手动 render）
  resize(); computeLayout();
  syncPath();   // 卡片打开时路径条让位（两者写的是同一套上下文）
}
window.pinMain = pinMain;

/* ── 主题筛选：点一条＝只看这一列，再点一次＝取消 ────────────────────
   09-13 phase 02：主题列表从**左栏**搬到**中间栏**（二级），左栏只剩一级导航。
   这个函数现在只改状态 + 重绘，列表长什么样由 renderList() 决定。 */
function setFilter(g) {

  computeLayout();
  renderList();
}
window.setFilter = setFilter;

function closePanel() {

window.openPanel = openPanel; window.closePanel = closePanel;

/* ── 启动 ───────────────────────────────────────────── */
const MODES = ['path', 'grid', 'relation', 'sphere'];
function syncTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.mode === mode));
  const legend = document.getElementById('rel-legend');
  if (legend) legend.classList.toggle('on', mode === 'relation');
}
function setMode(m) {
  if (!MODES.includes(m)) m = 'path';
  mode = m;
  syncTabs();
  panX = panY = 0; rotX = -0.22; rotY = 0.5; zoom = (m === 'sphere' || m === 'relation') ? 1.35 : 1;
  if (m === 'path' && !activeRoute() && ROUTES.length) routeId = ROUTES[0].routeId;
  computeLayout();
  if (m === 'path') focusRoute();      // 进路径就把视图对准路线
  refreshRail();
  syncPath();
  if (mode === 'path') renderList();   // 中间栏在路径态下多一行「正在走的路径」
}
window.setMode = setMode;
/* 路径条的显示条件：路径模式 + 没在读内参。它和详情卡不同时出现（卡片写着同一套上下文）。 */
function syncPath() {
  const rail = document.getElementById('pathrail');
  const main = document.getElementById('main');
  const reader = document.getElementById('reader');
  const show = mode === 'path' && !!activeRoute() && !(reader && reader.classList.contains('on'));
  main.classList.toggle('pathon', show);
  if (rail) { rail.classList.toggle('on', show); if (show) renderPathRail(); }
}
window.syncPath = syncPath;
// 给路径上的某个概念打状态标签：只读 marks，不自己标
function stepStateOf(cid) {
  const s = (marks[cid] || {}).state;
  return s === 'pass' ? '✓ 验过' : s === 'read' ? '✓ 读过' : s === 'mech' ? '机器过' : s === 'fail' ? '没过' : '';
}
function renderPathRail() {
  const box = document.getElementById('pathrail');
  const r = activeRoute();
  if (!box || !r) return;
  const cur = r.steps[routeStepIdx];
  const br = (r.branches || []).find(b => b.after === cur.conceptId);
  const rows = r.steps.map((s, i) => {
    const cls = i === routeStepIdx ? 'cur' : i < routeStepIdx ? 'done' : i === routeStepIdx + 1 ? 'next' : '';
    const tag = i === routeStepIdx ? '<span class="tag">当前</span>'
      : i === routeStepIdx + 1 ? '<span class="tag">下一步</span>' : '';
    return `<li><button class="pr-step ${cls}" onclick="pickRouteStep(${i})">
      <span class="no">${i + 1}</span><span class="nm">${esc(s.name)}</span>${tag}
      <span class="st">${esc(stepStateOf(s.conceptId))}</span></button></li>`;
  }).join('');
  box.innerHTML = `
    <div class="pr-kicker">路径 · 第 ${routeStepIdx + 1} 步 / 共 ${r.steps.length} 步</div>
    <div class="pr-title">${esc(r.title)}</div>
    <div class="pr-q">${esc(r.entryQuestion)}</div>
    <div class="pr-target">目标：${esc(r.target)}</div>
    <ol class="pr-steps">${rows}</ol>
    <div class="pr-block">
      <div class="pr-why"><b>为什么现在学「${esc(cur.name)}」</b>${esc(cur.why)}</div>
      <div class="pr-nav">
        ${cur.prereq ? `前置：<button onclick="openPanel('${cur.prereq.id}')">${esc(cur.prereq.name)}</button><i>${stepStateOf(cur.prereq.id) || '（未走）'}</i><br>` : '前置：无（这条路径从这里开始）<br>'}
        ${r.steps[routeStepIdx + 1] ? `下一步：<button onclick="pickRouteStep(${routeStepIdx + 1})">${esc(r.steps[routeStepIdx + 1].name)}</button><br>` : '下一步：走到头了<br>'}
      </div>
      ${cur.fallback ? `<button class="pr-back" onclick="openPanel('${cur.fallback.id}')">卡在「${esc(cur.name)}」？先回到：${esc(cur.fallback.name)}<br>
        <span style="opacity:.75">${esc(cur.fallback.reason)}</span></button>` : ''}
    </div>
    ${br ? `<div class="pr-block">
      <div class="pr-bq">${esc(br.question)}（最多 2 个）</div>
      ${br.options.map(o => `<button class="pr-opt" onclick="openPanel('${o.id}')">${esc(o.name)}<em>${o.role === 'main' ? '主推荐' : '分支'}</em><span>${esc(o.reason)}</span></button>`).join('')}
    </div>` : ''}
    <div class="pr-foot">
      <button onclick="openPanel('${cur.conceptId}')">看这一步的概念卡</button>
      <button onclick="setMode('grid')">回到全图</button>
    </div>`;
}

async function boot() {
  detectApp();
  resize();
  refreshMarks();
  refreshRail();
  renderList();
  document.getElementById('kicker').textContent = meta.kicker;
  document.getElementById('stats').innerHTML = meta.stats;
  document.querySelectorAll('.tab').forEach(t => { t.onclick = () => setMode(t.dataset.mode); });
  computeLayout();
  if (mode === 'path') focusRoute();      // 默认就是路径：首屏直接对准那条路线
  render();
  window.addEventListener('resize', () => { resize(); computeLayout(); });
  requestAnimationFrame(() => document.getElementById('load').classList.add('off'));
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('learn=')) {
    // 学习空间可直接用地址复现：#learn=<chapterId>（不走解锁门，方便复现与验收）
    const cid = h.slice(6);
    const ch = chapterById(cid);
    if (ch) { setMode('path'); focusRoute(); openPanel(ch.cm.id); openLearn(cid, { force: true, from: ch.cm.id }); return; }

  else if (h && byId.has(h)) openPanel(h);
  else syncPath();
}
setTimeout(boot, 40);


function refreshRail() {
  const e1 = document.getElementById('r-all');
  if (e1) e1.textContent = nodes.length;
  const e2 = document.getElementById('r-nei');
  if (e2) e2.textContent = (NEI.articles || []).length;
  const mm = document.getElementById('main-meta');
  if (mm) {
    const r = mode === 'path' ? activeRoute() : null;
    const t = (currentView === 'theme' && themeId) ? (CUR.tags || []).find(x => x.id === themeId) : null;
    mm.textContent = r
      ? '路径 · ' + r.steps.length + ' 步 · ' + r.title
      : t
        ? t.name + ' · ' + groupCount(t) + ' 个概念'
        : mode === 'relation'
          ? nodes.length + ' 概念 · ' + (relationStats.visible || relations.length) + ' 条语义关系 · 隐藏 ' + (relationStats.hidden || 0)
          : nodes.length + ' 概念 · ' + (CUR.tags || []).length + ' 个主题 · ' + edges.length + ' 条依赖';
  }
}
window.refreshRail = refreshRail;

/* ══ 列表栏（Linear 的中间那一栏）═════════════════════════════
   之前没有这一栏——所以没有 Linear 的味道。
   它是当前导航项的**可扫列表**：一行一个东西，右边是元信息，点开看详情。 */
let currentView = 'graph';
let themeId = null;   // theme 态（三级）当前所在的主题；graph 态恒为 null
const VIEW_TITLE = { graph: '主题', theme: '主题', neican: '内参 · 260912 期', practice: '实践空间 · 1 / 3 / 5' };
const ST_COLOR = { pass: '#4cb782', fail: '#eb5757', mech: '#f2c94c', read: '#9b7fe8' };

function rowHTML(inner, onclick, on) {
  return `<div class="row${on ? ' on' : ''}" onclick="${onclick}">${inner}</div>`;
}
function renderList() {
  const box = document.getElementById('lp-body');
  if (!box) return;
  const q = ((document.getElementById('q-filter') || {}).value || '').trim().toLowerCase();
  const hit = t => !q || String(t).toLowerCase().includes(q);
  const inTheme = currentView === 'theme' && !!themeId;
  const tagOf = id => (CUR.tags || []).find(t => t.id === id) || {};
  document.getElementById('lp-title').textContent =
    inTheme ? (tagOf(themeId).name || '主题') : (VIEW_TITLE[currentView] || '');
  const back = document.getElementById('lp-back');
  if (back) back.style.display = inTheme ? '' : 'none';
  const cntEl = document.getElementById('lp-count');
  let html = '', cnt = 0;

  if (currentView === 'graph') {
    /* 二级＝主题。936 条概念是三级，默认不在这里出现（phase 03 走「点主题 → 下钻」才渲染）。 */
    const list = groups().filter(g => hit(g.label));
    cnt = list.length;
    html = list.map(g => rowHTML(
      `<span class="rd" style="background:${g.color}"></span>`
      + `<span class="rn">${esc(g.label)}</span>`
      + `<span class="rm">${groupCount(g)}</span>`,
      `setView('theme','${g.id}')`, false)).join('')
      || '<div class="lp-empty">没有符合条件的主题。</div>';
  } else if (currentView === 'theme') {
    /* 三级＝某条主题下的概念。默认不渲染，只有从这里进来才看得到。
       09-13：主题顶部先放**路径入口**（HANDOFF §四.2）——主题仍是知识入口，路径是主题里的编排入口。
       路径行用 .prow，不是 .row：概念行的条数断言数的还是概念，路径不是概念。 */
    const mine = ROUTES.filter(r => r.topicId === themeId);
    if (mine.length) {
      html += `<div class="lp-sec">推荐路径 · ${mine.length} 条（人工策展，不是把 936 个概念排成课表）</div>`
        + mine.map(r => `<div class="prow${r.routeId === routeId && mode === 'path' ? ' on' : ''}" onclick="openRoute('${r.routeId}')">
            <span class="rd"></span>
            <span class="rn">${esc(r.title)}<i>${esc(r.entryQuestion)}</i></span>
            <span class="rm">${r.steps.length} 个概念</span></div>`).join('');
      html += '<div class="lp-sec">这条主题下的概念</div>';
    }
    const list = nodes.filter(n => matches(n) && hit(n.name + n.gloss))
      .sort((a, b) => (a.level - b.level) || a.name.localeCompare(b.name));
    cnt = list.length;
