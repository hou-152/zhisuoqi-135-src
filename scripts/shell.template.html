      ctx.beginPath();
      ctx.moveTo(b.sx, b.sy);
      ctx.lineTo(b.sx - Math.cos(ang - .45) * size, b.sy - Math.sin(ang - .45) * size);
      ctx.lineTo(b.sx - Math.cos(ang + .45) * size, b.sy - Math.sin(ang + .45) * size);
      ctx.closePath(); ctx.fill();
    };
    for (const r of relations) {
      const a = byId.get(r.from), b = byId.get(r.to);
      if (!a || !b || !visible(a) || !visible(b)) continue;
      const pa = project(a), pb = project(b);
      const hot = (selected && (r.from === selected || r.to === selected))
               || (hovered && (r.from === hovered || r.to === hovered));
      const rgb = RELATION_COLORS[r.kind] || '#88909c';
      // 有聚焦时：跟焦点无关的边退到很淡，只留它那一圈——关系视图的读法就是这个
      const near = !focusSet || focusSet.has(r.from) || focusSet.has(r.to);
      let alpha = hot ? .88 : (r.strength === 'hard' ? .36 : .18);
      if (!near) alpha *= 0.16;
      ctx.strokeStyle = hot ? 'rgba(255,255,255,' + alpha + ')' : rgb;
      ctx.globalAlpha = hot ? 1 : alpha;
      ctx.lineWidth = hot ? 1.8 : near ? (r.strength === 'hard' ? 1.05 : .7) : .5;
      if (r.strength !== 'hard' && !hot) ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (r.kind === 'prerequisite' && near) {
        drawArrow(pa, pb, hot ? 'rgba(255,255,255,ALPHA)' : 'rgba(168,181,238,ALPHA)', hot ? 1 : alpha);
      }
    }
  } else if (mode !== 'tree') {
    for (const [tid, pid, votes] of edges) {
      const a = byId.get(tid), b = byId.get(pid);
      if (!visible(a) || !visible(b)) continue;
      const pa = project(a), pb = project(b);
      const depth = (pa.z + pb.z) / 2;
      const hot = selected && (tid === selected || pid === selected)
               || hovered && (tid === hovered || pid === hovered);
      const solid = votes >= 7;
      const mid = votes >= 2;
      const base = solid ? 0.26 : mid ? 0.12 : 0.06;
      // 路径模式：整张依赖图退成背景（路线本身另画一条实线），只留被指到的边发亮
      let alpha = hot ? 0.8 : Math.max(0.022, base - depth / 12000);
      if (route && !hot) alpha *= 0.4;
      ctx.strokeStyle = hot ? 'rgba(255,255,255,' + alpha + ')'
                            : solid ? 'rgba(178,188,225,' + alpha + ')'
                                    : 'rgba(120,128,165,' + alpha + ')';
      ctx.lineWidth = hot ? 1.6 : solid ? 1.05 : 0.6;
      if (!solid && !hot) ctx.setLineDash(votes >= 2 ? [2.5, 3] : [1.5, 4]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      if (!solid && !hot) ctx.setLineDash([]);
    }
  }

  // 路径：主路径连线（当前步之前＝已走过，之后＝未走），画在点下面
  if (route) {
    ctx.lineWidth = 2;
    for (let i = 0; i < route.steps.length - 1; i++) {
      const a = byId.get(route.steps[i].conceptId), b = byId.get(route.steps[i + 1].conceptId);
      if (!a || !b) continue;
      const pa = project(a), pb = project(b);
      const past = i < routeStepIdx;
      ctx.strokeStyle = past ? 'rgba(76,183,130,.75)' : (i === routeStepIdx ? 'rgba(124,134,232,.85)' : 'rgba(94,106,210,.30)');
      ctx.setLineDash(past ? [] : [4, 4]);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // 点（远的先画）。路径模式下**分两趟**：先画背景里的灰点，再画路线上的点——
  // 否则密列里后画的灰点会盖住当前步，画面上「当前节点高亮」就没了（实测：当前步像素
  // 174 比灰点 167 只亮 7，等于没高亮）。两趟之后当前步一定在最上层。
  pts.sort((a, b) => b.z - a.z);
  const drawPt = (p) => {
    const n = p.n;
    const on = visible(n);
    const ri = route ? routeIndexOf(n.id) : -1;
    const onRoute = ri >= 0;
    const isSel = selected === n.id, isHov = hovered === n.id;
    const degree = mode === 'relation' ? relationNeighbors.get(n.id).length
      : neighbors.get(n.id).pre.length + neighbors.get(n.id).post.length;
    const base = (2.2 + Math.sqrt(degree) * 1.05) * p.s;
    // 路线上的点固定放大到看得见（下限 4.2px：列宽变大后路径模式可能缩到 0.45，
    // 不兜底当前步就只剩两个像素）；其他概念在路径模式下**变灰 + 缩小**——
    // 只压透明度是不够的：密列里几十个点叠在一起会重新叠成一片亮色（实测像素一样亮）。
    // 灰是叠不亮的，再缩一点，路线的形状才浮得出来。
    const r = Math.max(onRoute ? 4.2 : 1.1, base * (onRoute ? 1.5 : 0.8) * (isSel ? 2.1 : isHov ? 1.65 : 1));
    const col = G[Math.min(giOf(n), G.length - 1)].color;
    const greyed = !!route && !onRoute && !isSel && !isHov;
    // 关系视图有聚焦时：圈子外的点跟着边一起退下去（焦点那一圈才浮得出来）
    const relOut = !!focusSet && !focusSet.has(n.id) && !isSel && !isHov;
    // 树模式：**没有判定记录的叶子降噪**——「你的」先亮出来（PRD：叶子只长在有证据的状态上）
    const treeDim = mode === 'tree' && !marks[n.id] && !isSel && !isHov;
    ctx.globalAlpha = route
      ? (onRoute ? (ri === routeStepIdx ? 1 : .95) : (greyed ? .5 : (on ? .9 : .25)))
      : (on ? Math.min(1, 0.42 + p.s * 0.7) : 0.06);
    if (relOut) ctx.globalAlpha *= 0.3;
    if (treeDim) ctx.globalAlpha *= 0.26;
    // 光晕
    if (isSel || isHov || (route && ri === routeStepIdx)) {
      ctx.shadowBlur = 22; ctx.shadowColor = col;
    }
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, 6.2832);
    ctx.fillStyle = greyed ? '#34373d' : col; ctx.fill();
    ctx.shadowBlur = 0;
    // 我的标记环：只加环，不改填充色，不动坐标
    const mk = marks[n.id];
    if (mk && on && !greyed) {
      const st = mk.state || 'fail';
      ctx.globalAlpha = (isSel || isHov) ? 1 : 0.92;
      ctx.strokeStyle = st === 'pass' ? '#5ee0c0' : st === 'mech' ? '#e0a94a'
                      : st === 'read' ? '#9661BC' : '#ff4d4d';
      ctx.lineWidth = st === 'pass' ? 2 : 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 2.8, 0, 6.2832); ctx.stroke();
    }
    // 当前步：白环 + 步号，画布上自己就说得清「现在这一步」（HANDOFF §四.3）
    if (route && ri === routeStepIdx && !isSel) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 5, 0, 6.2832); ctx.stroke();
    }
    if (route && onRoute) {
      ctx.globalAlpha = 1;
      ctx.font = '10px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = ri === routeStepIdx ? '#fff' : 'rgba(255,255,255,.62)';
      ctx.fillText(String(ri + 1), p.sx + r + 5, p.sy + 3.5);
    }
    if (isSel) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 3.5, 0, 6.2832); ctx.stroke();
    }
    if (isHov) {
      ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.globalAlpha = .78;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6.5, 0, 6.2832); ctx.stroke();
    }
  };
  if (route) for (const p of pts) if (routeIndexOf(p.n.id) < 0) drawPt(p);
  for (const p of pts) if (!route || routeIndexOf(p.n.id) >= 0) drawPt(p);
  ctx.globalAlpha = 1;

  /* 关系视图的文字层（09-15）：枢纽写名字，有聚焦时写焦点那一圈的名字。
     字号同样随缩放走——「表现力差」有一半是因为整张图一个可读的词都没有。 */
  if (mode === 'relation') {
    const names = focusSet
      ? [...focusSet].map(id => byId.get(id)).filter(Boolean).slice(0, 30)
      : relHubs();
    const fs = Math.max(9, Math.min(14.5, 10.6 * Math.pow(zoom, 0.34)));
    ctx.font = fs + 'px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    const placed = [];
    lblStats.relLabels = 0;
    for (const n of names) {
      if (!visible(n)) continue;
      const p = project(n);
      const x = p.sx, y = p.sy - 9;
      if (x < 24 || x > W - 44 || y < 56 || y > H - 8) continue;
      const w = ctx.measureText(n.name).width;
      const box = [x - w / 2 - 3, y - fs, w + 6, fs + 4];
      if (placed.some(b => !(box[0] > b[0] + b[2] || box[0] + box[2] < b[0]
                          || box[1] > b[1] + b[3] || box[1] + box[3] < b[1]))) continue;
      placed.push(box);
      lblStats.relLabels++;
      const isFocus = n.id === selected || n.id === hovered;
      ctx.globalAlpha = isFocus ? 1 : 0.74;
      ctx.lineWidth = 2.8; ctx.strokeStyle = 'rgba(8,9,10,.88)';
      ctx.strokeText(n.name, x, y);
      ctx.fillStyle = isFocus ? '#fff' : 'rgba(228,232,242,.9)';
      ctx.fillText(n.name, x, y);
    }
    ctx.globalAlpha = 1;
  }

  /* 拖拽中的吸附辅助线：吸到别人的横线/竖线时画一条虚线，让人知道「吸住了」 */
  if (dragNode && (guides.x != null || guides.y != null)) {
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(124,134,232,.75)';
    const p = project(dragNode);
    if (guides.x != null) {
      const gx = CX + (guides.x + panX - CX) * zoom;
      ctx.beginPath(); ctx.moveTo(gx, 44); ctx.lineTo(gx, H); ctx.stroke();
    }
    if (guides.y != null) {
      const gy = CY + (guides.y + panY - CY) * zoom;
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = .8; ctx.fillStyle = '#c3caff';
    ctx.font = '10.5px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('已吸附', p.sx + 10, p.sy - 10);
    ctx.restore();
  }
  requestAnimationFrame(render);
}

/* ── 尺寸 ───────────────────────────────────────────── */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // 画布现在只在主区内（左栏 224 + 列表栏 302），不再铺满窗口
  const main = document.getElementById('main');
  const r = main.getBoundingClientRect();
  // 详情打开时画布被 inset 掉 412px，但 #main 本身没变宽——
  // 所以这里要自己减掉，否则布局按 914 算、画布只有 502，右边两列被切掉。
  const pinned = main.classList.contains('pinned');
  W = Math.max(320, Math.round(r.width - (pinned ? 412 : 0)));
  H = Math.max(240, Math.round(r.height));
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  CX = W * (W > 820 ? 0.60 : 0.5);
  CY = H * 0.54;
  if ((mode === 'grid' || mode === 'path' || mode === 'tree') && nodes.length) layoutGrid();
}
window.addEventListener('resize', resize);

/* ── 交互 ───────────────────────────────────────────── */
/* 09-15：拖的是**点**，不是画布。命中一个点＝拖这个点（松手落位、写 localStorage、
   跟别的点对齐时吸附并画辅助线）；空白处拖动仍然是平移画布，和以前一样。
   星球模式不参与点拖拽——那一层拖的是球（旋转），拖点会把球面拉歪。 */
let dragging = false, moved = 0, lastX = 0, lastY = 0;
let dragNode = null, dragMovedTo = null, guides = { x: null, y: null };
const DRAG_MODES = ['grid', 'path', 'tree', 'relation'];
function canDragNode() { return DRAG_MODES.includes(mode); }
/* 屏幕坐标 → 世界坐标（project 的逆） */
function toWorld(mx, my) {
  if (mode === 'relation') {
    const s = Math.min(W, H) * 0.42 * zoom;
    return { x: (mx - CX - panX) / s, y: (my - CY - panY) / s };
  }
  return { x: (mx - CX) / zoom + CX - panX, y: (my - CY) / zoom + CY - panY };
}
/* 吸附：先吸 18 世界像素的网格；再吸到别的点所在的横/竖线（屏幕 7px 以内就算吸上）。
   两者都做过才写坐标——「像 Obsidian 那样有一个吸附」。 */
function snapWorld(n, wx, wy) {
  let x = Math.round(wx / SNAP_GRID) * SNAP_GRID;
  let y = Math.round(wy / SNAP_GRID) * SNAP_GRID;
  guides = { x: null, y: null };
  const tol = 7 / Math.max(0.2, zoom);
  for (const o of nodes) {
    if (o === n || !matches(o)) continue;
    const ox = (mode === 'relation') ? (o.rx || 0) : o.gx;
    const oy = (mode === 'relation') ? (o.ry || 0) : o.gy;
    if (guides.x == null && Math.abs(ox - wx) < tol) { x = ox; guides.x = ox; }
    if (guides.y == null && Math.abs(oy - wy) < tol) { y = oy; guides.y = oy; }
    if (guides.x != null && guides.y != null) break;
  }
  return { x, y };
}
function canvasPoint(e) {
  const r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * W / Math.max(1, r.width),
    y: (e.clientY - r.top) * H / Math.max(1, r.height),
  };
}
function showTip(id) {
  const n = byId.get(id);
  if (!n) return;
  const p = project(n);
  const r = cvs.getBoundingClientRect();
  const sx = r.left + p.sx * r.width / Math.max(1, W);
  const sy = r.top + p.sy * r.height / Math.max(1, H);
  tip.textContent = n.name;
  tip.classList.add('on');
  const gap = 12, tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = sx + gap;
  if (left + tw > window.innerWidth - 8) left = sx - tw - gap;
  let top = sy - th - gap;
  if (top < 8) top = sy + gap;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, left)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 8, top)) + 'px';
}
cvs.addEventListener('pointerdown', e => {
  camStop();   // 用户按下＝接管镜头，缓动即断
  const pt = canvasPoint(e);
  const hit = canDragNode() ? pick(pt.x, pt.y) : null;
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  dragNode = hit ? byId.get(hit) : null;
  dragMovedTo = null; guides = { x: null, y: null };
  if (dragNode) { tip.classList.remove('on'); cvs.classList.add('nodedrag'); }
  else cvs.classList.add('drag');
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (dragNode) {
      const pt = canvasPoint(e);
      const w = toWorld(pt.x, pt.y);
      const s = snapWorld(dragNode, w.x, w.y);
      if (mode === 'relation') { dragNode.rx = s.x; dragNode.ry = s.y; }
      else { dragNode.gx = s.x; dragNode.gy = s.y; }
      dragMovedTo = s;
    } else if (mode === 'grid' || mode === 'relation' || mode === 'path' || mode === 'tree') { panX += dx; panY += dy; }
    else { rotY += dx * 0.0062; rotX = Math.max(-1.25, Math.min(1.25, rotX + dy * 0.0062)); }
    lastX = e.clientX; lastY = e.clientY;
  } else {
    const pt = canvasPoint(e);
    hovered = pick(pt.x, pt.y);
    cvs.style.cursor = hovered ? (canDragNode() ? 'grab' : 'pointer') : 'grab';
    if (hovered) showTip(hovered); else tip.classList.remove('on');
  }
});
cvs.addEventListener('pointerup', e => {
  const wasNode = dragNode;
  dragging = false; cvs.classList.remove('drag'); cvs.classList.remove('nodedrag');
  if (wasNode && dragMovedTo) {
    // 落位＝固定（写进 localStorage）。原位没动过（挪动 < 3px）就当点击，不算固定。
    if (moved >= 3) {
      const k = (mode === 'relation') ? 'relation' : 'grid';
      pins[k][wasNode.id] = [mode === 'relation' ? wasNode.rx : wasNode.gx,
                             mode === 'relation' ? wasNode.ry : wasNode.gy];
      savePins(); syncPinBtn();
    } else {
      const pt = canvasPoint(e); const hit = pick(pt.x, pt.y); hit ? openPanel(hit) : closePanel();
    }
  } else if (moved < 5) {
    const pt = canvasPoint(e); const hit = pick(pt.x, pt.y); hit ? openPanel(hit) : closePanel();
  }
  dragNode = null; dragMovedTo = null; guides = { x: null, y: null };
});
cvs.addEventListener('pointerleave', () => { tip.classList.remove('on'); hovered = null; });
/* 滚轮＝以指针为锚缩放（Obsidian 同一套手感）：放大时鼠标底下的那个点不动。
   以前是以画布中心缩放，越缩越找不到刚才在看的东西。 */
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  camStop();   // 用户滚轮＝接管镜头，缓动即断
  const z0 = zoom;
  const z1 = Math.max(0.12, Math.min(3.4, zoom * (1 - e.deltaY * 0.0011)));
  if (z1 === z0) return;
  const pt = canvasPoint(e);
  if (mode === 'relation') {
    const base = Math.min(W, H) * 0.42;
    const s0 = base * z0, s1 = base * z1;
    const wx = (pt.x - CX - panX) / s0, wy = (pt.y - CY - panY) / s0;
    panX = pt.x - CX - wx * s1; panY = pt.y - CY - wy * s1;
  } else if (mode === 'grid' || mode === 'path' || mode === 'tree') {
    const wx = (pt.x - CX) / z0 + CX - panX, wy = (pt.y - CY) / z0 + CY - panY;
    panX = (pt.x - CX) / z1 + CX - wx; panY = (pt.y - CY) / z1 + CY - wy;
  }
  zoom = z1;
  lastFit = 'free';
}, { passive: false });

function pick(mx, my) {
  let best = null, bestD = 17;
  const route = mode === 'path' ? activeRoute() : null;
  for (const n of nodes) {
    // 路径模式下路线上的点也要能点——其他概念只降噪，不是不可点（HANDOFF §八：仍可回全图探索）
    if (!matches(n) && !(route && routeHas(n.id))) continue;
    const p = project(n);
    const d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bestD) { bestD = d; best = n.id; }
  }
  return best;
}

/* ── 面板 ───────────────────────────────────────────── */
/* ── 来源：粗标签之外的「这篇概念是从哪篇原文来的」 ────────────────
   原来概念卡上的来源是个死标签（只印 notion / context / harness 之一），点不动。
   实测 918 个概念里 879 个只有 1 篇来源，最多的是 Harness（21 篇）—— 只列前 6 篇，
   每篇带「同源概念」（同一篇原文里还长出过哪些概念），点一下直接跳过去。 */
function srcBlockOf(n) {
  const arts = (n.sa || []).map((i) => ({ i, a: articles[i] })).filter((x) => x.a && x.a.u);
  if (!arts.length) return '';
  const rows = arts.slice(0, 6).map(({ i, a }) => {
    const sibs = nodes.filter((x) => x.id !== n.id && (x.sa || []).includes(i));
    const label = a.s === 'notion' ? 'Notion 概念库' : a.t;
    return `<li><a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(label)} <i>↗</i></a>
      ${sibs.length ? `<em>同源 ${sibs.length}</em>` : ''}
      ${sibs.length ? `<div class="sib">${sibs.slice(0, 8).map((x) =>
        `<button onclick="openPanel('${x.id}')">${esc(x.name)}</button>`).join('')}${
        sibs.length > 8 ? `<span class="mut">…还有 ${sibs.length - 8} 个</span>` : ''}</div>` : ''}</li>`;
  }).join('');
  return `<details class="deep">
    <summary>来源 · ${arts.length} 篇${arts.length > 1 ? '（这个概念在多篇原文里都出现过）' : ''}</summary>
    <ul class="srclist">${rows}</ul>
    ${arts.length > 6 ? `<div class="mut" style="margin-top:6px">还有 ${arts.length - 6} 篇没列。</div>` : ''}
  </details>`;
}
/* ══ 概念卡上的路径上下文（HANDOFF §四.4）══════════════════════════
   方案 B 的落点：卡片顶部先说清「现在第几步 / 为什么现在学它 / 前置是什么 / 下一步去哪 /
   卡住了回哪」。四类关系按 HANDOFF §五分开显示，不再混成一坨：
     强前置 hard  → 地图里 strength=hard 的边（不懂就立不住）
     弱前置 soft  → 地图里其余依赖边（懂了更顺，可跳过）
     支撑材料 support → 这个概念的来源/原文与掌握证据（就是卡上已有的「来源」「深看」）
     相关概念 related → 关系层里除 prerequisite 外的边，折叠，不进主路径
   data 没有 support / related 统一字段，这里是**映射展示**，没有改全量关系数据结构。 */
const REL_SHORT = { 'related-to': '相关', 'used-with': '一起使用', 'part-of': '组成', contrast: '对照' };
function mkOf(id) {
  const s = (marks[id] || {}).state;
  return s === 'pass' ? ' ✓' : s === 'read' ? ' ✓' : s === 'mech' ? ' ·机器过' : s === 'fail' ? ' ·没过' : '';
}
function pathBlock(id) {
  if (mode !== 'path') return '';
  const r = activeRoute();
  if (!r) return '';
  const idx = r.steps.findIndex(s => s.conceptId === id);
  if (idx < 0) {
    return `<div class="pctx off">这一张不在当前路径上——按规则它是<b>相关概念</b>，不进入主路径。
      <button onclick="pickRouteStep(${routeStepIdx})">回到路径第 ${routeStepIdx + 1} 步</button></div>`;
  }
  const st = r.steps[idx];
  const nxt = r.steps[idx + 1];
  const br = (r.branches || []).find(b => b.after === st.conceptId);
  const hard = st.mapHard || [], soft = st.mapSoft || [], rel = st.related || [];
  const relRows = rel.slice(0, 6).map(x => {
    const ri = routeIndexOf(x.id);
    return `<li class="rel pick" onclick="openPanel('${x.id}')">
      <b>${esc(x.name)}</b>${ri >= 0 ? ` <u>本路径第 ${ri + 1} 步</u>` : ''}
      <em>${esc(REL_SHORT[x.kind] || x.kind)}${x.note ? ' · ' + esc(String(x.note).slice(0, 60)) : ''}</em></li>`;
  }).join('');
  const hardRows = hard.length
    ? hard.map(x => `<li class="pick" onclick="openPanel('${x.id}')"><b>${esc(x.name)}</b><em>${esc(String(x.reason || '').slice(0, 70))}</em></li>`).join('')
    : `<div class="none">概念地图里这一步没有 hard 前置——整条路线的顺序是人工确认的（basis: route），不是从依赖边自动推出来的。</div>`;
  const softRows = soft.length
    ? soft.map(x => `<li class="soft pick" onclick="openPanel('${x.id}')"><b>${esc(x.name)}</b><em>${esc(String(x.reason || '').slice(0, 70))}</em></li>`).join('')
    : '<div class="none">没有弱前置。</div>';
  return `<div class="pctx">
    <div class="k">当前路径第 ${idx + 1} 步 / 共 ${r.steps.length} 步 · ${esc(r.topicName)}</div>
    <h4>${esc(r.title)}</h4>

    <div class="nav">
      ${st.prereq ? `前置：<button onclick="openPanel('${st.prereq.id}')">${esc(st.prereq.name)}</button><i>${mkOf(st.prereq.id) || '（未走）'}</i><br>` : '前置：无（这是这条路径的起点）<br>'}
      ${nxt ? `下一步：<button onclick="openPanel('${nxt.conceptId}')">${esc(nxt.name)}</button><br>` : '下一步：走到头了——回看停止条件<br>'}
      ${st.fallback ? `卡住时回退：<button onclick="openPanel('${st.fallback.id}')">${esc(st.fallback.name)}</button>` : ''}
    </div>
    <div class="acts">
      <button class="jbtn" onclick="focusProof()">学习这个</button>
      <button class="jbtn ghost" onclick="openPractice('${id}')">进入 1 / 3 / 5 · 01 案例决策场</button>
      <button class="jbtn ghost" onclick="this.closest('.pctx').querySelector('details').open=true">查看前置理由</button>
    </div>
    <div class="loop-note"><b>1 / 3 / 5 学习闭环：</b>从当前概念进入 01 案例决策场，再回到这条路径继续学习。03 / 05 暂未开放。课程学习（主线六章 ＋ 七站）在左栏「实践空间」——知识体系只浏览，不发起学习（2026-09-15 负责人口径，见 <code>CONTEXT.md</code>）。</div>
    <details>
      <summary>前置理由 · 四类关系分开看（${hard.length} 强 / ${soft.length} 弱 / ${st.support.sources} 支撑 / ${st.relatedCount} 相关）</summary>
      <h5>强前置 hard · 不懂就立不住（默认进主路径）</h5>
      <ul>${hardRows}</ul>
      <h5>弱前置 soft · 懂了更顺，可以跳过</h5>
      <ul>${softRows}</ul>
      <h5>支撑材料 support · 来源与掌握证据</h5>
      <div class="none">这个概念有 <b>${st.support.sources}</b> 篇来源原文、<b>${st.support.evidence}</b> 条掌握证据 —— 就在下面「来源」和「深看」两块里，不在这里重复一遍。</div>
      <h5>相关概念 related · 有关，但不是这条路径的必需</h5>
      <ul>${relRows || '<li class="none">没有语义关系边。</li>'}</ul>
      ${st.relatedCount > rel.length ? `<div class="none">相关关系共 <b>${st.relatedCount}</b> 条（口径＝关系视图里画得出来的那 ${relationStats.visible} 条语义关系，同一份数据），这里只列前 ${rel.length} 条；其余在「关系」视图。</div>` : ''}
      ${(st.relatedHiddenCount || 0) > 0 ? `<div class="none">另有 <b>${st.relatedHiddenCount}</b> 条记录<b>默认不绘制</b>：${Object.entries(st.relatedHiddenByKind || {}).map(([k, v]) => `${HIDDEN_RELATION_NAMES[k] || k} ${v} 条`).join('、')}。它们不是知识关系，画布与这张卡都不画，也不当先修；全量口径见「关系」视图顶栏的「隐藏」与类型图例。</div>` : ''}
      <h5>路线声明的前置理由</h5>
      <div class="none">${st.prereq ? esc(st.prereq.reason) + `（依据：${st.prereq.basis === 'hard' ? '概念地图 hard 依赖边' : st.prereq.basis === 'soft' ? '概念地图 soft 依赖边' : '人工确认的路线前置'}）` : '起点，无前置。'}</div>
      ${st.fallback ? `<h5>卡住时为什么回这一步</h5><div class="none">${esc(st.fallback.reason)}</div>` : ''}
    </details>
    ${br ? `<div class="pr-block" style="border-top:0;margin-top:6px;padding-top:0">

    <div class="pr-foot">
      <button onclick="gotoRouteStep(${idx + 1 < r.steps.length ? idx + 1 : idx})">${idx + 1 < r.steps.length ? '走到下一步 →' : '这是最后一步'}</button>

/* 「学习这个」不写任何验收状态，只把视野挪到交卷框——费曼不在本计划范围内（PLAN §4.4） */

function openPanel(id) {

  if (n && (mode === 'grid' || mode === 'path' || mode === 'tree') && Number.isFinite(n.gx)) {
    const targetZoom = Math.max(0.34, Math.min(2.2, zoom || 1));
    camApply({ zoom: targetZoom, panX: (W * 0.38 - CX) / targetZoom + CX - n.gx, panY: (CY - n.gy) / targetZoom }, {});

  const rnb = relationNeighbors.get(id) || [];

  }

  const relationGroups = {};
  for (const r of rnb) {
    const kind = r.kind || 'related-to';

  }
  const relationHtml = Object.entries(relationGroups)
    .sort(([a], [b]) => (RELATION_NAMES[a] || a).localeCompare(RELATION_NAMES[b] || b, 'zh-CN'))
    .map(([kind, list]) => {
      const rows = list.slice(0, 8).map(r => {

        const strength = r.strength === 'hard' ? '强' : r.strength ? '弱' : '';

        const note = [strength, source, r.note || r.evidence || ''].filter(Boolean).join(' · ');

    }).join('');

  /* 概念卡 v5-plain-open：标题 → 一句定义 → 怎么算会了 → 讲一遍 → 关系 → 背景与出处（折叠）→ 台账（data-*）。
     明面说人话：类型枚举（n.type）、层级（L0–L5）、ID 转进 data-*；同一句解释只出现一次。 */
  document.getElementById('pbody').innerHTML = `
    ${pathBlock(id)}
    <h2>${esc(n.name)}<span class="kbadge" style="border-color:${KIND[kk].color};color:${KIND[kk].color}">${esc(KIND[kk].name)}</span></h2>
    <div class="gloss">${esc(n.gloss)}</div>
    <div class="pbody-meta" data-type="${esc(n.type || '')}" data-level="${n.level ?? ''}" data-pre="${pre.length}" data-post="${post.length}" data-src="${esc(n.src || '')}"></div>
    ${((n.evidence||[]).length || n.ap) ? `<div class="proven">${(n.evidence||[]).length ? `<b>怎么算会了：</b>${esc(n.evidence[0])}${(n.evidence||[]).length > 1 ? ` 等 ${(n.evidence||[]).length} 条` : ''}` : `<b>怎么算会了：</b>${esc(n.ap)}`}
      ${((n.evidence||[]).length > 1 || (n.evidence||[]).length && n.ap) ? `<details class="deep"><summary>更多判据</summary><ul>${(n.evidence||[]).map(e => `<li>${esc(e)}</li>`).join('')}${n.ap ? `<li>${esc(n.ap)}</li>` : ''}</ul></details>` : ''}</div>` : ''}
    ${kk === 'accept' ? `<div class="dpane quiet">
      <h5>这一类只做已读标记</h5>
      <div class="mut">它属于「只能认的」内容，没有机制可复述，也没有对错。标记已读只表示你看过，<b>不代表掌握，也不计入会了的统计。</b></div>
      <div class="jrow">
        <button class="jbtn ghost" onclick="markRead('${id}')">${mk && mk.state === 'read' ? '已读（点一下取消）' : '标记为已读'}</button>

    ${verdict}

    ${pre.length ? `<h5>要理解它，先懂这些</h5><ul>${pre.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}${esc(edgeNote(id, x.id))}${marks[x.id] ? (marks[x.id].state === 'pass' ? ' · 讲过了' : marks[x.id].state === 'mech' ? ' · 机器过了' : ' · 还没过') : ''}</li>`).join('')}</ul>` : ''}
    ${post.length ? `<h5>懂了它，才好懂这些</h5><ul>${post.map(x =>
      `<li onclick="openPanel('${x.id}')">${x.name}${esc(edgeNote(x.id, id))}</li>`).join('')}</ul>` : ''}
    ${pre.length || post.length ? '' : '<div class="mut" style="margin:8px 0">它不是别的前置，也不踩在别人头上——独立概念。</div>'}
    ${relationHtml ? `<div class="relation-block"><h5>相关概念 · ${rnb.length}</h5>${relationHtml}${rnb.length > 40 ? `<div class="mut">还有 ${rnb.length - 40} 条相关，没有全列。</div>` : ''}</div>` : ''}
    ${caseMvpLink(n)}
    ${srcBlockOf(n)}
    ${(n.evidence||[]).length || n.ap ? `<details class="deep">
      <summary>什么时候学</summary>
      ${n.stage ? `<div class="mut">${({now:'现在先懂——不懂就没法往下',"when-needed":'做到这里再懂——用得到时再学',"deep-dive":'深入研究再懂——要专门花时间'})[n.stage] || ''}</div>` : ''}

      ${n.feynman ? `<h5>换个讲法</h5><div class="mut">${esc(n.feynman)}</div>` : ''}

  document.getElementById('panel').classList.add('on');

/* 案例决策场 1：概念集合不假设一一对应，本轮只接入一个已验证案例。

/* ── 主题筛选：点一条＝只看这一列，再点一次＝取消 ────────────────────
   09-13 phase 02：主题列表从**左栏**搬到**中间栏**（二级），左栏只剩一级导航。
   这个函数现在只改状态 + 重绘，列表长什么样由 renderList() 决定。
   09-15：筛上之后镜头跟着走到那一列（不然「只看这一列」还得自己横着找过去）。 */
function setFilter(g) {

/* 地址入口：learn / neican / graph / 视图名 / 概念 ID。boot 与页面内跳转共用这一套。 */
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  /* #graph=map|route|trace：总图的可复现入口 */
  if (h.startsWith('graph')) {
    const t = h.split('=')[1];
    if (t === 'map' || t === 'route' || t === 'trace') GV.tab = t;
    setMode('graph');
    mountGraphView().then(() => { try { window.GRAPH_VIEW.setTab(GV.tab); } catch (e) {} });
    requestAnimationFrame(() => document.getElementById('load').classList.add('off'));
    return;
  }
  if (h.startsWith('learn=')) {
    // #learn=<chapterId> 与其它入口一样受解锁门约束。
    // 只有显式带 review=1（审核／复现用）才走 force 直达，学生入口不再能绕过解锁。
    const [cid, query] = h.slice(6).split('&');
    const review = /(^|&)review=1(&|$)/.test(query || '');
    const ch = chapterById(cid);
    if (ch && ch.kind === 'batch') {
      /* 批量单元：地址入口与「实践空间 → 进入阅读」是同一条路（同一份 gate，不另开小门）。 */
      openPractice(null, 'index');
      openLearn(cid, { from: null });
      practiceRender(); return;
    }
    if (ch) { setMode('path'); focusRoute(); openPanel(ch.cm.id); openLearn(cid, { force: review, from: ch.cm.id }); return; }
  }
  /* #neican=<slug>：内参单篇的可复现入口（Issue 2 · B 层试点用）。
     「阅读中的即时费曼」长在这一篇的五维签里，所以复现要能一条地址直达。 */
  if (h.startsWith('neican=')) {
    const slug = h.slice(7).split('&')[0];
    if (neiOf(slug)) { setView('neican'); openNeican(slug); return; }
  }
  /* 旧视图名（sphere/grid/relation）的地址入口落到**我的树**——入口撤了，别让旧链接白屏 */
  if (h === 'sphere' || h === 'grid' || h === 'relation') setMode('tree');
  else if (h === 'tree' || h === 'path' || h === 'graph') { setView('graph'); setMode(h); }
  else if (h === 'explore') setView('explore');
  else if (h && byId.has(h)) openPanel(h);
  else {
    // 浏览器从 #graph=map 后退到空 hash＝离开系统视图的第二条出口（v4.1 根修）
    if (mode === 'graph') setMode('tree');
    if (!h) setView('explore');
    else syncPath();
  }
}

    if (selected && r.getAttribute('onclick') === `openPanel('${selected}')`) r.classList.add('on');
  });
}

/* setView('theme', tagId) 下钻到三级；setView('graph') 回二级（全部主题）。
   「知识体系」这个导航项在 theme 态也保持高亮——它和主题态属于同一个一级页面。 */
function setView(v, tid) {
  // 首页隐藏画布；每次切换都同步解除，避免知识体系留下整块黑屏。
  document.getElementById('main')?.classList.toggle('explore-active', v === 'explore');
  /* v4.1 根修（对抗性审计发现）：系统视图（mode==='graph'）没有可见退出控件——顶栏导航
     点击后 currentView 换了、画布却停在总图态（graphon 不解除＝「回不去」的根因）。
     总图态的退出闭环就设在这里：任何一次回到知识体系的导航，先把画布从总图归位到我的树。 */
  saveQueryInput();
  if (v === 'graph' && mode === 'graph') setMode('tree');
  currentView = v;
  document.getElementById('app')?.classList.toggle('app-explore', v === 'explore');
  document.getElementById('app')?.classList.toggle('app-explore', v === 'explore');
  themeId = (v === 'theme' && tid) ? tid : null;
  filter = themeId;                       // 画布只亮这一列；回主题态自动清掉
  if (v !== 'neican' && v !== 'explore') hideReader();
  const nav = v === 'theme' ? 'graph' : v;
  document.querySelectorAll('.r-item').forEach(b => b.classList.toggle('on', b.dataset.view === nav));
  /* 进内参＝先进**日报集合**（上方日期条选期）；单篇阅读从集合里点进去。
     不从上次读的那篇续起——二级页面的默认面是集合，不是某一篇。 */
  if (v === 'neican') { closePanel(); neiSlug = null; openNeicanHome(); }
  else if (v === 'explore') { closePanel(); openExplore(); }
  else closePanel();
  computeLayout();
  syncQueryInput();
  refreshRail(); renderList(); syncPath();
}
window.setView = setView;

/* ══ 内参：AI 内参图文格式的一栏 ═══════════════════════════════
   格式照所有者给的《serious AI 内参》与飞书两份主题精选：
     主题 · 重要等级 · 地址 → 配图 → 原文子链接 + 原文简介 + 入选理由
     → 三级笔记 / 概念网络 / 费曼 ×3 / 阅读原文
   「收藏」「公开笔记」没做——还没有账号登录（所有者口径）。
   数据来自 knowledge/内参-<期>/内参-页面数据.json（scripts/build-neican.mjs 生成）。
   2026-09-14：主区默认改成「内参日报集合」（按期分组的日报），日期条固定在上方；
   单篇阅读仍在，从日报集合里点进去。 */
let neiSlug = null, neiTabName = 'notes';
const STARS = n => '★'.repeat(Math.max(0, Math.min(5, n))) + '☆'.repeat(Math.max(0, 5 - n));
const neiOf = slug => NEI_ALL.reduce((acc, i) => acc || (i.articles || []).find(a => a.slug === slug), null)
  || ((NEI().articles || [])[0] || null);
function srcLabel(a) {
  try { return new URL(a.url).host.replace(/^www\./, ''); } catch (e) { return a.author || '来源'; }
}
function hideReader() { const r = document.getElementById('reader'); if (r) r.classList.remove('on'); syncPath(); }
window.hideReader = hideReader;
/* 从内参的概念卡跳到地图：关掉阅读区 → 回知识体系 → 打开那张卡 */
function mapFromNeican(id) {
  if (!byId.has(id)) return;
  hideReader(); setView('graph'); openPanel(id);
}
window.mapFromNeican = mapFromNeican;

/* 概念提取 v2：「也出现在」反链 chip → 跳到那篇（保留当前签位） */
function neiGoAppear(period, slug) {
  const a = neiOf(slug); if (!a) return;
  neiPeriod = period;
  neiSlug = slug; neiScreen = 'article';
  renderNeican(true);
  const r = document.getElementById('reader');
  if (r) { r.classList.add('on'); if (r.scrollTo) r.scrollTo(0, 0); }
  renderList(); syncPath();
}
window.neiGoAppear = neiGoAppear;

/* 日期选择：内参二级页面**上方**那条日期条。点一期＝只看那一期；「全部」＝按期倒序全看。 */
function neiPick(period) {
  neiPeriod = period || '';
  neiScreen = 'home'; neiSlug = null;
  const iss = period ? NEI_ALL.find(i => i.period === period) : null;
  if (iss && dayOf(iss)) neiCalYM = dayOf(iss).slice(0, 7);   // 日历跟着翻到那一期所在的月
  renderNeicanHome();
  renderList(); refreshRail(); syncPath();
  const r = document.getElementById('reader');
  if (r && r.scrollTo) r.scrollTo(0, 0);
}
window.neiPick = neiPick;

/* 中间那一栏（`#list`）在内参视图里的内容：日期（月历）→ 分类 → 策展。 */
function neiCount() {
  const iss = neiPeriod ? NEI_ALL.filter(i => i.period === neiPeriod) : NEI_ALL;
  return iss.reduce((n, i) => n + (i.articles || []).filter(neiPass).length, 0);
}
function neiSidebar() {
  if (!NEI_ALL.length) return '<div class="lp-empty">还没有任何一期。<br>（先跑 node scripts/pull-readwise-inbox.mjs）</div>';
  return `<div class="nei-side">${neiCalendar()}${neiFacets()}</div>`;
}
/* 侧栏里的任何操作都要同时刷新两栏：侧栏（选中态）＋ 主区（日报卡） */
function neiRefresh() { renderList(); if (neiScreen === 'home') renderNeicanHome(); }
window.neiRefresh = neiRefresh;

/* 分类 / 策展：两个可折叠的筛选组（顺序：日期 → 分类 → 策展）。
   分类＝条目类型（观点文 / 技术拆解 / …）· 标签＝来源域名 · 策展＝重要等级（★ 是我挑出来的那档）。 */
function neiSetFilt(key, val) {
  if (key === 'star') neiFilt.star = neiFilt.star === val ? 0 : val;
  else neiFilt[key] = neiFilt[key] === val ? '' : val;
  neiRefresh();
}
window.neiSetFilt = neiSetFilt;
function neiFoldToggle(key) { neiFold[key] = !neiFold[key]; renderList(); }
window.neiFoldToggle = neiFoldToggle;

function neiFacets() {
  // 计数必须和当前期/搜索范围一致；旧实现用 NEI_ALL，选中单期后会显示点了却没有结果的全局数字。
  const base = (neiPeriod ? NEI_ALL.filter(i => i.period === neiPeriod) : NEI_ALL).flatMap(i => i.articles || []);
  const q = neiQ();
  const inSearch = a => !q || (String(a.title || '') + String(a.topic || '') + String(a.author || '')).toLowerCase().includes(q);
  const all = base.filter(inSearch);
  const tally = (arr) => arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  const kinds = Object.entries(tally(all.map(a => a.tag || a.topic || '文章'))).sort((a, b) => b[1] - a[1]);
  const stars = [5, 4, 3].map(n => [n, all.filter(a => (a.stars || 0) >= n).length])
    .filter(([, c]) => c && c < all.length);
  const group = (key, title, chips) => `<div class="fg">
    <button class="fh" onclick="neiFoldToggle('${key}')"><i>${neiFold[key] ? '▾' : '▸'}</i>${title}</button>
    <div class="fb"${neiFold[key] ? '' : ' hidden'}>${chips}</div></div>`;
  const chip = (key, val, label, on) => `<button class="fchip${on ? ' on' : ''}"
    onclick="neiSetFilt('${key}', ${typeof val === 'number' ? val : `'${esc(val)}'`})">${esc(label)}</button>`;
  return `<div class="nei-facets" id="nei-facets">
    <div class="fhead">${neiFiltOn()
      ? `筛选中 · 符合 <b>${all.filter(neiPass).length}</b> / ${all.length} 篇
         <button class="fclear" onclick="neiClearFilt()">清空</button>`
      : `共 ${all.length} 篇 · 按下面两组收窄`}</div>
    ${group('tag', '分类', chip('tag', '', '全部', !neiFilt.tag)
      + kinds.map(([k, n]) => chip('tag', k, `${k} ${n}`, neiFilt.tag === k)).join(''))}
    ${group('star', '策展 · 重要等级', chip('star', 0, '全部', !neiFilt.star)
      + stars.map(([n, c]) => chip('star', n, `${'★'.repeat(n)} ${c}（至少${n}星）`, neiFilt.star === n)).join(''))}
  </div>`;
}
function neiClearFilt() { neiFilt = { tag: '', star: 0 }; neiRefresh(); }
window.neiClearFilt = neiClearFilt;

/* 内参二级页面 · 默认屏：日报集合 */
function openNeicanHome() {
  neiScreen = 'home'; neiSlug = null;
  /* v4-unify：进内参默认**选中最新一期**（单期视图）——默认「全部」堆叠态会让人从一期
   滚进另一期（所有者 09-15 报「选了日期还滑到别的日期」的根因）；「全部」降级为按钮。 */
  if (!neiPeriod) neiPeriod = NEI_ALL.length ? NEI_ALL[0].period : '';
  renderNeicanHome();
  const r = document.getElementById('reader');
  if (r) { r.classList.add('on'); if (r.scrollTo) r.scrollTo(0, 0); }
  renderList(); refreshRail(); syncPath();
}
window.openNeicanHome = openNeicanHome;

function openNeican(slug) {
  const a = neiOf(slug); if (!a) return openNeicanHome();
  const iss = issueOfArticle(a.slug);
  neiSlug = a.slug;
  neiScreen = 'article';
  // 不动 neiPeriod：从「全部」点进去的，返回时还要回到「全部」那一刻的集合，不是掉到某一期
  // 有判据映射的试点篇（agent-skills-api）默认落在「五维 · 即时费曼」：读完就讲是这个入口的主线
  neiTabName = a.dim && a.dim.teachingMap ? 'dim' : 'notes';
  renderNeican(true);
  document.getElementById('reader').classList.add('on');
  if (document.getElementById('reader').scrollTo) document.getElementById('reader').scrollTo(0, 0);
  renderList();
  syncPath();   // 读内参时路径条让位（上面盖着阅读区，别两层打架）
}
window.openNeican = openNeican;

function neiTab(k) {
  neiTabName = k;
  document.querySelectorAll('.nei-tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.getElementById('nei-body').innerHTML = neiBody(neiOf(neiSlug));
  mountConceptNet(document.getElementById('nei-body'));
}
window.neiTab = neiTab;

function neiBody(a) {
  if (neiTabName === 'dim') {
    if (!a.dim) return '<div class="mut"><b>这篇暂时没有五维拆解。</b><br>它有三级笔记、概念网络和费曼示范；五维材料只在完成对应拆解的文章上开放。</div>';
    return neiDimBody(a);
  }
  if (neiTabName === 'concept') {
    const cs = a.conceptCards || [];
    if (!cs.length) return '<div class="mut">这一篇没有概念卡。</div>';
    const inMap = cs.filter(c => c.ref && c.ref.id).length;
    const head = `<div class="mut" style="margin-bottom:12px">本文 <b>${cs.length}</b> 个概念 ·
      其中 <b>${inMap}</b> 个已并进概念地图（点名字跳到地图那张卡）；
      其余是本文特有的细粒度提取。</div>`;
    /* 概念网络图（2026-09-15）：图在上，概念卡列表在下（原有内容一个不删）。
       unitId 与 build-concept-net.mjs 的产出对齐；没有图的篇目照实不摆。 */
    const iss = issueOfArticle(a.slug);
    const unitId = 'neican-' + (iss ? iss.period : '') + '-' + a.slug;
    const graph = CN_NETS[unitId]
      ? `<div class="cn-host" data-unit="${esc(unitId)}"></div>`
      : '';
    /* ref / appear（「也出现在」反链）由概念提取 v2 数据层给出（build-shell 装配，
       build-concept-cards.mjs 产出、check-concept-cards.mjs 体检），不走运行时匹配。 */
    return head + graph + cs.map((c, i) => `<div class="concept" id="nei-card-${i}">
      <span class="nm">${i + 1}. ${c.ref && c.ref.id
        ? `<button class="tomap" onclick="mapFromNeican('${c.ref.id}')">${esc(c.name)} <i>↗ 地图</i></button>`
        : esc(c.name)}</span>
      ${(c.quotes || []).map(q => `<div class="q">${esc(q)}</div>`).join('')}
      ${c.feynman ? `<div class="fy"><i>费曼一下</i>${esc(c.feynman)}</div>` : ''}
      ${(c.appear || []).length ? `<div class="also">也出现在 ${c.appear.map(x =>
        `<button class="chip" onclick="neiGoAppear('${x.period}','${esc(x.slug)}')">${esc(x.period)} · ${esc(x.article)}</button>`).join('')}</div>` : ''}
      </div>`).join('');
  }
  if (neiTabName === 'feynman') {
    /* 有拆解五维的那一期：① 30 秒 ② 3 分钟 ③ 验收要点（三道）。
       只有三产物的一期（如 260913）：没有 short/rubric —— 就只出「费曼示范」一段，不摆空盒子。 */
    const f = a.feynman || {};
    const rub = f.rubric || [];
    return (f.short ? `<div class="fybox"><div class="k">① 30 秒版 · 讲给完全不懂的人</div><div>${esc(f.short)}</div></div>` : '')
      + `<div class="fybox"><div class="k">${f.short ? '② 3 分钟版 · 讲清机制' : '费曼示范 · 讲给完全不懂的人'}</div>${f.long || ''}</div>`
      + (rub.length ? `<div class="fybox"><div class="k">③ 验收版 · 讲完要答得出的点</div>
        <div class="mut">费曼不是「再讲一遍」，是讲完之后能被这几个点问住。答不出，就回到上面两版重讲。</div>
        ${rub.map(r => `<div style="margin-top:10px"><b>${esc(r.concept)}</b>
          <ul>${(r.points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}</div>` : '');
  }
  if (neiTabName === 'source') {
    return `<div class="fybox"><div class="k">原文</div>
      <div style="line-height:1.85">${esc(a.title)}<br>
      <a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:var(--accent2)">${esc(a.url)} ↗</a></div>
      <div class="mut" style="margin-top:10px">来源 ${esc(srcLabel(a))} · 作者 ${esc(a.author || '—')}
        · 原文 ${a.words} 字 · 抓取 ${esc(a.fetched || '')}</div>
      <div class="mut">这一栏只放子链接与元信息，不转载全文。</div></div>`;
  }
  return a.notes || '';
}

/* 上方**月历**选日期（2026-09-14 第二版：照所有者给的 Readwise Reader 截图——
   有内参的日子点亮、选中的一天橙色、没有内参的灰掉；‹ › 翻月）。
   一期＝一天，所以「选日期」和「选期」是同一件事。 */
const pad2 = (n) => String(n).padStart(2, '0');
const dayOf = (iss) => String((iss || {}).date || '').slice(0, 10);
function neiCalInit() {
  if (neiCalYM) return neiCalYM;
  const sel = neiPeriod ? NEI_ALL.find(i => i.period === neiPeriod) : null;
  const d = dayOf(sel) || dayOf(NEI_ALL[0]) || '';
  neiCalYM = d ? d.slice(0, 7) : new Date().toISOString().slice(0, 7);
  return neiCalYM;
}
function neiCalMove(delta) {
  const [y, m] = neiCalInit().split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  neiCalYM = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  renderList();
}
window.neiCalMove = neiCalMove;

function neiCalendar() {
  const ym = neiCalInit();
  const [y, m] = ym.split('-').map(Number);
  const byDate = new Map(NEI_ALL.map(i => [dayOf(i), i]).filter(([d]) => d));
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;      // 周一开头，跟截图一致
  const days = new Date(y, m, 0).getDate();
  const now = new Date();
  const today = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="cd pad"></span>');
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad2(d)}`;
    const iss = byDate.get(ds);
    if (iss) {
      cells.push(`<button class="cd has${neiPeriod === iss.period ? ' on' : ''}${ds === today ? ' today' : ''}"
        onclick="neiPick('${iss.period}')" title="${esc(iss.date)} ${esc(iss.weekday)} · ${(iss.articles || []).length} 篇">${d}</button>`);
    } else {
      cells.push(`<span class="cd${ds === today ? ' today' : ''}">${d}</span>`);
    }
  }
  const sel = neiPeriod ? NEI_ALL.find(i => i.period === neiPeriod) : null;
  const inMonth = NEI_ALL.filter(i => dayOf(i).startsWith(ym)).length;
  return `<div class="nei-cal">
    <div class="ch"><button onclick="neiCalMove(-1)" title="上个月">‹</button><b>${y} 年 ${m} 月</b><button onclick="neiCalMove(1)" title="下个月">›</button></div>
    <div class="cw">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cg">${cells.join('')}</div>
    <div class="cf">
      <button class="allbtn${neiPeriod === '' ? ' on' : ''}" onclick="neiPick('')">全部 ${NEI_ALL.length} 期 · ${NEI_TOTAL} 篇</button>
      <span class="hint">${sel ? `已选 ${neiShort(sel)} · ${(sel.articles || []).length} 篇`
        : (inMonth ? `这个月 ${inMonth} 天有内参` : '这个月没有内参')}</span>
    </div>
  </div>`;
}
/* 窄列短日期格式（v4-unify）：日历脚部只有 ~100px 宽，全格式「2026-09-14星期一」必然折行
   （所有者 09-15 报）；页头/单篇页保持全格式。三处口径由此统一。 */
function neiShort(iss) {
  const p = String(iss.date || '').split('-');
  if (p.length < 3) return iss.date || '';
  const wk = String(iss.weekday || '').replace('星期', '周');
  return `${+p[1]}月${+p[2]}日 ${wk}`;
}
/* 期与期翻页（v4-unify）：单期视图的期头 ‹ ›，按 NEI_ALL 的倒序走（‹＝更新一期） */
function neiStep(delta) {
  const i = NEI_ALL.findIndex(x => x.period === neiPeriod);
  const j = Math.max(0, Math.min(NEI_ALL.length - 1, (i < 0 ? 0 : i) + delta));
  neiPick(NEI_ALL[j].period);
}
window.neiStep = neiStep;
/* 单篇阅读用窄栏：返回键 ＋ 现在读的是哪一天哪一篇（读的时候不摆整张日历） */
function neiWhenBar() {
  const a = neiOf(neiSlug);
  const iss = a ? (issueOfArticle(a.slug) || NEI()) : NEI();
  return `<div class="nei-dates">
    <button class="nei-home" onclick="openNeicanHome()">← 日报集合</button><span class="sep"></span>
    <span class="nei-when">${esc(iss.date || '')} ${esc(iss.weekday || '')} · 第 ${esc(iss.period)} 期${a ? ` · 第 ${a.no} / ${(iss.articles || []).length} 篇` : ''}</span>
  </div>`;
}
/* 日报集合：按期倒序，一期一张日报卡（日期 · 篇数 · 目录），点一篇进单篇阅读 */
function issueCard(iss, nav) {
  const arts = (iss.articles || []).filter(neiPass);
  const ix = NEI_ALL.findIndex(x => x.period === iss.period);
  const canPrev = ix > 0, canNext = ix >= 0 && ix < NEI_ALL.length - 1;
  return `<section class="nei-day">
    <div class="dh"><b>第 ${esc(iss.period)} 期</b><span>${esc(iss.date || '')} ${esc(iss.weekday || '')}</span>
      ${nav ? `<button class="ih-nav" onclick="neiStep(-1)" ${canPrev ? '' : 'disabled title="已是最新一期"'}>‹</button><button class="ih-nav" onclick="neiStep(1)" ${canNext ? '' : 'disabled title="已是最早一期"'}>›</button>` : ''}
      <span class="sp"></span><span>${arts.length} 篇</span></div>
    <div class="dl">${arts.map(a => `<button class="drow" onclick="openNeican('${a.slug}')">
      <span class="no">${String(a.no || 0).padStart(2, '0')}</span>
      <span class="tt"><b>${esc(a.topic || a.title)}</b><i>${esc(a.title)}</i>${a.oneLine ? `<em>${esc(a.oneLine)}</em>` : ''}</span>
      <span class="st" title="${esc(a.starReason || '')}">${STARS(a.stars)}</span><span class="go">读 →</span>
    </button>`).join('')}</div>
    <div class="dfoot">${esc(iss.source || '')}　·　${esc(iss.pipeline || '')}</div>
  </section>`;
}
/* ══ 阅读区容器：**自己把 #nei-wrap 要回来** ═══════════════════════════
   起因（所有者 2026-09-15 报）：「内参每次打开都有点困难，每次都得再刷新一遍才能打开」。
   实测根因不是网络也不是 LLM：`practiceRender()` 直接写 `#reader.innerHTML = …`
   （实践空间那套壳），把同级的 `#nei-wrap` 一起删了；之后每一次点「内参」都进
   `renderNeicanHome()` → `document.getElementById('nei-wrap')` 拿到 null →
   抛 `Cannot read properties of null (reading 'innerHTML')`（实测 A 干净态能开、
   B 实践空间之后 reader.on=false 且 #nei-wrap 为 null），只有刷新页面才恢复。
   修法：容器不在就**就地重建**，谁换掉了都不怕；不动实践空间那套渲染。 */
function neiWrap() {
  const reader = document.getElementById('reader');
  let w = document.getElementById('nei-wrap');
  if (!w && reader) {
    reader.innerHTML = '';
    w = document.createElement('div');
    w.className = 'nei'; w.id = 'nei-wrap';
    reader.appendChild(w);
  }
  return w;
}
window.neiWrap = neiWrap;

function renderNeicanHome() {
  const wrap = neiWrap();
  if (!wrap) return;
  if (!NEI_ALL.length) { wrap.innerHTML = '<div class="lp-empty">还没有任何一期内参。<br>（先跑 node scripts/pull-readwise-inbox.mjs --date YYYY-MM-DD）</div>'; return; }
  let list = neiPeriod ? NEI_ALL.filter(i => i.period === neiPeriod) : NEI_ALL;
  if (neiFiltOn()) list = list.filter(i => (i.articles || []).some(neiPass));
  const shown = list.reduce((n, i) => n + (i.articles || []).filter(neiPass).length, 0);
  wrap.innerHTML = `
    <div class="nei-crumb"><b>AI 内参</b><span>›</span><span>内参日报集合</span>
      <span class="sp"></span><span>${list.length} 期 · ${shown} 篇${neiPeriod ? '' : ' · 全部日期'}${neiFiltOn() ? ' · 已筛选' : ''}</span></div>
    <div class="nei-homehint">左边一栏先<b>月历</b>选日期（点亮的那些天有内参），再按<b>分类 / 策展</b>收窄；
      点下面任意一篇进单篇阅读（三级笔记 / 概念网络 / 费曼 / 阅读原文）。</div>
    ${list.length ? list.map((i, ix) => issueCard(i, neiPeriod && ix === 0)).join('') : '<div class="lp-empty">这一天／这组筛选下没有篇目。</div>'}`;
}
window.renderNeicanHome = renderNeicanHome;

function renderNeican(reset) {
  const a = neiOf(neiSlug);
  const wrap = neiWrap();
  if (!wrap) return;
  if (!a) { renderNeicanHome(); return; }
  const iss = issueOfArticle(a.slug) || NEI();
  const tabs = [['notes', '三级笔记'], ['concept', '概念网络'],
      ['feynman', (a.feynman && ((a.feynman.short || a.feynman.long || '').trim())) ? '费曼示范' : '费曼材料'],
      ['source', '阅读原文'],
      ['dim', a.dim ? (a.dim.teachingMap ? '五维 · 即时费曼' : '五维拆解') : '五维（暂无）']];
  wrap.innerHTML = `
    ${neiWhenBar()}
    <div class="nei-crumb"><b>AI 内参</b><span>›</span><span>${esc(iss.period)} 期</span>${a.tag ? `<span>›</span><span>${esc(a.tag)}</span>` : ''}
      <span class="sp"></span><span>${esc(iss.date || '')} ${esc(iss.weekday || '')}</span></div>
    <h1 class="nei-title">${esc(a.title)}</h1>
    <div class="nei-meta">
      <span class="stars" title="${esc(a.starReason)}">${STARS(a.stars)}</span>
      <span>${esc(srcLabel(a))}</span><span>·</span><span>${esc(a.author || '')}</span>
      <span>·</span><span>约 ${Math.max(1, Math.round(a.words / 500))} 分钟</span>
      <span class="tag">${esc(a.topic)}</span>
      <span class="why">${esc(a.tag || '')}</span>
    </div>
    <div class="nei-hero">${a.hero || ''}</div>
    
    <div class="nei-link">原文：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)} ↗</a></div>
    <div class="nei-card"><h5>原文简介</h5><p>${esc(a.summary)}</p></div>
    <div class="nei-card"><h5>入选理由</h5><p>${esc(a.why)}</p>
      <p style="margin-top:8px;color:var(--fg3);font-size:11.5px">重要等级 ${STARS(a.stars)} —— ${esc(a.starReason)}</p></div>
    <div class="nei-tabs">${tabs.map(([k, t]) =>
      `<button data-k="${k}" class="${k === neiTabName ? 'on' : ''}" onclick="neiTab('${k}')">${t}</button>`).join('')}</div>
    <div class="nei-body" id="nei-body">${neiBody(a)}</div>
    <div class="nei-foot">${esc(iss.pipeline || '')}<br>${esc(iss.source || '')}<br>生成 ${esc(iss.generatedAt || '')}</div>`;
  if (reset) wrap.parentElement.scrollTop = 0;
  mountConceptNet(document.getElementById('nei-body'));
}

/* ══ 内参文章 · 阅读中的即时费曼（Issue 2 · B 层试点：agent-skills-api）════════
   这是「阅读中的即时费曼」闭环，不是新页面：它长在内参单篇的「五维」签里，
   位置固定在阅读梯度之后、决策题之前——读完就讲，不必先答完决策题。

   写死在代码里的边界（每条都有对应的页面测试）：
     · 判定走**窄接口 /api/learn**：浏览器只发「单元 ID ＋ 复述 ＋ 输入版本 ＋ 请求 ID」；
       材料、判据、五档规则（gradingRules）全部由服务端从 evidence/feynman-teaching-map/ 装进提示词
       —— 浏览器不再自带 system prompt／评分标准／模型名（交接件 §6.2）；
     · 服务端与页面各校验一次：未知判据 ID／判据不全／解析失败／超时／太短 → 未判定：
       不当作 missing=[]，不当通过；超限（429）与停用（503）照实报错，不静默降级；
     · uncertain 只给澄清追问，不套用「已确认误解」的纠错动作；
     · 全部缺口落盘，但页面每次只展示一处重点补讲（第一个非 met 的判据）＋至多一个追问；
       同一个判据再漏一次时换下一条材料（不机械重播第一次的动作列表）；
     · 即时反馈单独存 zss135.neican.feynman.v1，与章末验收 zss135.learn.v1 分开：
       不写正式掌握状态、不解锁任何一章、不碰倒逼记录 marks；
     · 请求绑定「单元 ＋ 输入版本 ＋ 请求 ID」：请求在途时改草稿或切单元，旧结果作废；
     · experiments 只作可折叠参考材料，不是完成本轮学习的必经操作。 */
const NFX_KEY = 'zss135.neican.feynman.v1';
const NFX_STATUSES = ['met', 'partial', 'missing', 'contradicted', 'uncertain'];
const NFX_LABEL = { met: '说到了', partial: '说到但不完整', missing: '没提到', contradicted: '说反了', uncertain: '无法判断' };
const NFX_CLARIFY = '这句话我还判断不了你指的是哪一层。先补一句：你说的是「资源存在技能目录里」，还是「这份资源的正文已经被读进上下文」？';
let nfxReq = 0, nfxBusy = false;      // 请求代次：改草稿／切单元／再次提交都会作废在途请求

function nfxAll() { try { return JSON.parse(localStorage.getItem(NFX_KEY) || '{}') || {}; } catch (e) { return {}; } }
function nfxSave(all) { try { localStorage.setItem(NFX_KEY, JSON.stringify(all)); } catch (e) {} }
function nfxState(slug) {
  const s = nfxAll()[slug];
  return (s && Array.isArray(s.rounds)) ? s : { draft: '', draftVer: 0, rounds: [], delivered: {} };
}
function nfxPut(slug, st) { const all = nfxAll(); all[slug] = st; nfxSave(all); }
/* 只有带判据映射的单元才开这个闭环（本轮试点只有 agent-skills-api）。 */
function nfxUnit(a) {
  const tm = a && a.dim && a.dim.teachingMap;
  return tm && (tm.criteria || []).length ? tm : null;
}
const nfxMatId = (ref) => 'nfx-mat-' + String(ref).replace(/[^a-zA-Z0-9]+/g, '-');

/* ── 公网体验网关（2026-09-15）：静态版没有本机后端，即时费曼可走 PUBLIC=1 的限额网关。
   网关地址＋体验口令存访客自己的 localStorage（zss135.gateway）——记录归用户，凭证也归用户。
   没配网关＝照实「待复核」，不调模型、不冒充通过。网关侧有三道闸（口令／每 IP 限速／日断路器）。 */
function cnGateway() {
  try { const v = JSON.parse(localStorage.getItem('zss135.gateway') || 'null'); return (v && v.base) ? v : null; } catch (e) { return null; }
}
function cnGatewayAsk() {
  const cur = cnGateway() || { base: '', code: '' };
  const base = (prompt('体验网关地址（例：https://zss135-gateway.onrender.com）', cur.base || '') || '').trim().replace(/\/+$/, '');
  if (!base) return cnGateway();
  const code = (prompt('体验口令（提交页／路演材料里那个）', cur.code || '') || '').trim();
  try { localStorage.setItem('zss135.gateway', JSON.stringify({ base, code })); } catch (e) {}
  return cnGateway();
}
/* 口令打错（403）时只重问口令、不重问地址；重试上限 1 次——不把访客按进无限弹窗。
   没填新口令就返回 null，调用方照实记「待复核」并告诉访客：学习本身不受影响。 */
function cnGatewayAskCode() {
  const cur = cnGateway() || { base: '', code: '' };
  const code = (prompt('体验口令不对，请重输一次（提交页／路演材料里那个；留空跳过，学习不受影响）：', cur.code || '') || '').trim();
  if (!code || code === cur.code) return null;
  try { localStorage.setItem('zss135.gateway', JSON.stringify({ base: cur.base, code })); } catch (e) {}
  return cnGateway();
}

/* ── 提示词已搬到服务端（/api/learn，scripts/serve-lib.mjs）──
   这里只保留「应用侧校验」与「渲染」：浏览器不再拼 system prompt、不再带评分标准，
   所以即使页面被改，也拿不到一份可以自行放宽的判据口径。 */

/* ── 解析＋应用侧校验：任何一处不对就是「未判定」 ── */
function nfxExtractJson(text) {
  const t = String(text).replace(/^```(?:json)?\s*/i, '');
  const start = t.indexOf('{');
  if (start < 0) throw new Error('返回里没有 JSON 对象');
  let depth = 0, inStr = false, esc2 = false;
  for (let i = start; i < t.length; i++) {
    const ch = t[i];
    if (inStr) { if (esc2) esc2 = false; else if (ch === '\\') esc2 = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') { inStr = true; continue; }
    if (ch === '{') depth++;
    else if (ch === '}') { depth--; if (depth === 0) return t.slice(start, i + 1); }
  }
  throw new Error('JSON 对象不完整');
}
const nfxOneQuestion = (t) => {
  const s = String(t || '').trim(); if (!s) return '';
  return s.split(/\n+/)[0].trim().slice(0, 200);
};
function nfxValidate(raw, ids) {
  let obj;
  try { obj = JSON.parse(nfxExtractJson(raw)); } catch (e) { return { notJudged: '判定返回不是可解析的 JSON（' + e.message + '）', raw: String(raw || '') }; }
  const rows = Array.isArray(obj.criteria) ? obj.criteria : null;
  if (!rows) return { notJudged: '判定返回里没有 criteria 数组', raw: String(raw || '') };
  const known = new Set(ids);
  if (rows.some(x => !x || !known.has(String(x.id)))) return { notJudged: '判定返回里有未知判据 ID（或条目缺 id）', raw: String(raw || '') };
  const seen = new Map(rows.map(x => [String(x.id), String(x.status || 'uncertain')]));
  if (seen.size !== ids.length) return { notJudged: `判据不全：${seen.size}/${ids.length}`, raw: String(raw || '') };
  const statuses = {}, evidence = {};
  for (const id of ids) {
    const row = rows.find(x => String(x.id) === id) || {};
    const s = seen.get(id);
    statuses[id] = NFX_STATUSES.includes(s) ? s : 'uncertain';   // 状态值不认识 → uncertain（不是通过）
    evidence[id] = String(row.evidence || '').slice(0, 300);
  }
  return { statuses, evidence, nextPrompt: nfxOneQuestion(obj.nextPrompt), raw: String(raw || '') };
}
window.nfxValidate = nfxValidate;

/* 服务端的拒绝／未判定 → 一句照实说的原因：超限与停用都明确报错，不静默降级 */
function nfxServerWhy(j, status) {
  if (!j) return status === 404
    ? '本地服务这个进程还没有 /api/learn（HTTP 404，服务是旧版本）：重启 node scripts/serve-135.mjs 再提交；这次没有判定，也不会当作通过。'
    : `本地服务返回了空响应（HTTP ${status}），按未判定记录`;
  const t = (s) => String(s || '');
  switch (j.error) {
    case 'not-judged': return t(j.reason) || '服务端判定没有通过校验';
    case 'llm-rate-limited': return `本地服务限流：${t(j.note)}（约 ${Math.ceil((j.retryAfterMs || 0) / 1000)} 秒后可再试）`;
    case 'llm-disabled': return `本地服务已停用模型调用（LLM_DISABLED）：${t(j.note)}`;
    case 'unit-unknown': return `这一篇没有已审核的判据映射：${t(j.note)}`;
    case 'empty-input': case 'input-too-short': case 'input-too-long': return `没有调用模型：${t(j.note)}`;
    case 'llm-timeout': return '服务端等待模型超时（25 秒），按未判定记录';
    case 'llm-not-configured': return '本地服务没配置模型凭证（服务端 llm-not-configured），按未判定记录';
    default: return `服务端拒绝（${t(j.error) || 'HTTP ' + status}）：${t(j.detail) || t(j.note) || ''}`;
  }
}
window.nfxServerWhy = nfxServerWhy;

/* ── 只挑一处：第一个非 met 的判据（按 C1→C4 顺序）；重复时换下一条材料 ── */
function nfxFocusOf(a, statuses, st) {
  const tm = nfxUnit(a); if (!tm) return null;
  const gap = tm.criteria.find(c => statuses[c.id] !== 'met');
  if (!gap) return null;
  const status = statuses[gap.id];
  const delivered = (st.delivered || {})[gap.id] || { count: 0 };
  const mats = gap.material || [];
  const pick = mats.length ? mats[delivered.count % mats.length] : null;
  return {
    id: gap.id, status, criterion: gap.criterion,
    clarify: status === 'uncertain',
    misconception: gap.misconception || '',
    action: status === 'uncertain' ? NFX_CLARIFY : (gap.teachingAction || ''),
    ref: pick ? pick.ref : '', label: pick ? pick.label : '', quote: pick ? pick.quote : '',
    repeat: delivered.count + 1,
  };
}
function nfxMakeRound(a, parsed, meta) {
  const tm = nfxUnit(a), st = nfxState(a.slug);
  const gapIds = tm.criteria.filter(c => parsed.statuses[c.id] !== 'met').map(c => c.id);
  const focus = gapIds.length ? nfxFocusOf(a, parsed.statuses, st) : null;
  return {
    n: (st.rounds || []).length + 1, at: new Date().toISOString(),
    unit: tm.unit, unitVersion: tm.criteriaVersion,
    inputVersion: meta.ver, requestId: meta.reqId, ms: meta.ms || 0,
    notJudged: null, statuses: parsed.statuses, evidence: parsed.evidence || {},
    gaps: gapIds, focus, nextPrompt: parsed.nextPrompt || '',
    passed: gapIds.length === 0, raw: String(parsed.raw || meta.raw || '').slice(0, 1200),
  };
}
const nfxNotJudgedRound = (a, meta, why) => ({
  n: (nfxState(a.slug).rounds || []).length + 1, at: new Date().toISOString(),
  unit: (nfxUnit(a) || {}).unit || a.slug, unitVersion: (nfxUnit(a) || {}).criteriaVersion || '',
  inputVersion: meta.ver, requestId: meta.reqId, ms: meta.ms || 0,
  notJudged: why, statuses: {}, evidence: {}, gaps: [], focus: null, nextPrompt: '', passed: false,
  raw: String(meta.raw || '').slice(0, 1200),
});

/* ── 渲染：状态行 ＋ 单处重点补讲 ＋ 至多一个追问 ── */
function nfxResultHtml(a) {
  const st = nfxState(a.slug);
  const r = (st.rounds || []).slice(-1)[0];
  if (!r) return '<div class="nfx-res" id="nfx-res"><span class="mut">还没有提交过。读完上面的阅读梯度，用自己的话讲一遍再提交。</span></div>';
  const cur = st.draftVer !== r.inputVersion;
  const stamp = cur ? `<div class="mut">下面是第 ${r.inputVersion} 版复述的反馈；草稿已是第 ${st.draftVer} 版，提交后会重新核对。</div>` : '';
  let inner;
  if (r.notJudged) {
    inner = `<div class="nfx-k nj">这一轮未判定</div>
      <div class="mut">${esc(r.notJudged)}——未判定不算通过，也没被记成「漏点」。可以改完再提交一次。</div>${stamp}`;
  } else if (r.passed) {
    inner = `<div class="nfx-k ok">这一轮把 ${Object.keys(r.statuses).length} 条判据都讲到了</div>
      <div class="mut">这是阅读中的即时反馈：不改正式掌握状态，也不解锁任何一章（章末验收另存）。</div>${stamp}`;
  } else {
    const f = r.focus || {};
    const stamps = Object.keys(r.statuses).map(id => `<span class="nfx-st ${r.statuses[id]}">${id} ${NFX_LABEL[r.statuses[id]] || r.statuses[id]}</span>`).join('');
    inner = `<div class="nfx-k">这一次先补一处（共记下 ${r.gaps.length} 处缺口，其余留到后面几轮）</div>
      <div class="nfx-status">${stamps}</div>
      <div class="nfx-focus" data-cid="${esc(f.id)}" data-ref="${esc(f.ref || '')}">
        <div class="nfx-fh"><b>重点补讲 · ${esc(f.id)}</b><span>${esc(f.criterion || '')}</span></div>
        ${f.clarify
          ? `<div class="nfx-clarify">这一条还判断不了 → 只给澄清追问，不套用「已确认误解」的纠错动作：<br>${esc(f.action)}</div>`
          : `<div class="nfx-mi"><b>可能的误解</b>${esc(f.misconception)}</div>
             <div class="nfx-act"><b>教学动作</b>${esc(f.action)}</div>`}
        ${f.ref ? `<div class="nfx-mat">回到材料：<button class="nfx-go" onclick="nfxGo('${esc(f.ref)}')">${esc(f.label)} <i>↗</i></button>
          <div class="nfx-quote">逐字原文：${esc(f.quote)}</div></div>` : ''}
        ${f.repeat > 1 ? `<div class="mut">这条补讲前面已经给过 ${f.repeat - 1} 次，这一次换的是「${esc(f.label)}」这条材料，不是把上一次的动作再念一遍。</div>` : ''}
      </div>
      ${r.nextPrompt ? `<div class="nfx-q"><b>一个追问</b>${esc(r.nextPrompt)}</div>` : ''}${stamp}`;
  }
  return `<div class="nfx-res ${r.notJudged ? 'nj' : (r.passed ? 'ok' : '')}" id="nfx-res" data-ver="${r.inputVersion}">${inner}</div>`;
}
function nfxCardHtml(a) {
  const tm = nfxUnit(a); if (!tm) return '';
  const st = nfxState(a.slug);
  return `<div class="nfx" id="nfx" data-unit="${esc(tm.unit)}" data-ver="${st.draftVer || 0}">
    <div class="nfx-h"><b>阅读中的即时费曼</b><span>单元 ${esc(tm.unit)} · 判据 ${tm.criteria.length} 条 · 判据版本 ${esc(tm.criteriaVersion)}</span></div>
    <div class="mut">读完上面的阅读梯度就可以讲，不必先答下面的决策题。判定逐条走判据：拿不准的判据只给澄清追问，不硬套误解纠错；即时反馈不改正式掌握状态、也不解锁任何一章。</div>
    <textarea id="nfx-said" placeholder="用自己的话讲一遍：技能凭什么按需加载？（至少一两句）" oninput="nfxChanged()">${esc(st.draft || '')}</textarea>
    <div class="nfx-row"><button class="nfx-btn" id="nfx-submit" onclick="nfxSubmit('${esc(a.slug)}')">提交复述</button>
      <span class="mut" id="nfx-status">${(st.rounds || []).length ? `已提交 ${st.rounds.length} 轮 · 草稿第 ${st.draftVer || 0} 版` : '还没有提交过'}</span></div>
    ${nfxResultHtml(a)}
    <div class="mut">判据与材料来自 A 层映射 <code>evidence/feynman-teaching-map/${esc(a.slug)}.json</code>；材料回指只到本篇正文，不引用外部资料。</div>
  </div>`;
}
window.nfxCardHtml = nfxCardHtml;

/* 材料回指：把 ref 指到页面上真实存在的那一条，必要时展开折叠块并高亮 */
function nfxGo(ref) {
  const el = document.getElementById(nfxMatId(ref));
  if (!el) return false;
  const det = el.closest('details'); if (det) det.open = true;
  document.querySelectorAll('.nfx-hit').forEach(x => x.classList.remove('nfx-hit'));
  el.classList.add('nfx-hit');
  if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return true;
}
window.nfxGo = nfxGo;

/* 改草稿：立刻落盘 ＋ 作废在途请求（旧结果不得覆盖当前状态） */
function nfxChanged() {
  if (!neiSlug) return;
  const box = document.getElementById('nfx-said');
  const st = nfxState(neiSlug);
  st.draft = box ? box.value : st.draft;
  st.draftVer = (st.draftVer || 0) + 1;
  nfxReq++;
  nfxPut(neiSlug, st);
  const card = document.getElementById('nfx'); if (card) card.dataset.ver = st.draftVer;
  const s = document.getElementById('nfx-status');
  if (s) s.textContent = `草稿已保存（输入第 ${st.draftVer} 版）· 在途的旧判定已作废，提交后重新核对`;
}
window.nfxChanged = nfxChanged;

async function nfxSubmit(slug) {
  const a = neiOf(slug), tm = a && nfxUnit(a);
  if (!tm || nfxBusy) return;
  const box = document.getElementById('nfx-said');
  const said = ((box ? box.value : '') || '').trim();
  const st0 = nfxState(slug);
  st0.draft = said; nfxPut(slug, st0);
  const reqId = ++nfxReq, ver = st0.draftVer || 0;
  const stale = () => reqId !== nfxReq || neiSlug !== slug;   // 改草稿／切单元／再次提交 → 作废
  const meta = { ver, reqId, ms: 0 };
  const land = (round) => {
    if (stale()) return false;
    const cur = nfxState(slug);
    cur.rounds = (cur.rounds || []).concat([round]).slice(-20);
    if (round.focus) {
      cur.delivered = cur.delivered || {};
      const d = cur.delivered[round.focus.id] || { count: 0 };
      cur.delivered[round.focus.id] = { count: d.count + 1, at: round.at, ref: round.focus.ref, label: round.focus.label, action: round.focus.action };
    }
    nfxPut(slug, cur);
    const out = document.getElementById('nfx-res');
    if (out && neiSlug === slug && neiTabName === 'dim') out.outerHTML = nfxResultHtml(a);
    const s = document.getElementById('nfx-status');
    if (s) s.textContent = `已提交 ${cur.rounds.length} 轮 · 草稿第 ${cur.draftVer || 0} 版`;
    return true;
  };
  const note = (t) => { const s = document.getElementById('nfx-status'); if (s) s.textContent = t; };
  if (said.length < 12) { land(nfxNotJudgedRound(a, meta, '复述太短，无法判断（至少写一两句完整的话）')); return; }
  /* 本机后端直连；静态公网版走体验网关（访客自配，存自己 localStorage）。
     两边都没有＝照实待复核：不调模型、不冒充通过。 */
  let gw = null;
  if (!isLocalHost()) {
    gw = cnGateway() || cnGatewayAsk();
    if (!gw) { land(nfxNotJudgedRound(a, meta, '公网静态版：未配置体验网关——本次不调用模型，也不会把提交当作通过。')); return; }
  }

  nfxBusy = true;
  const btn = document.getElementById('nfx-submit'); if (btn) btn.disabled = true;
  if (box) box.disabled = true;
  note(`正在判定 · 单元 ${tm.unit} · 输入第 ${ver} 版 · 请求 #${reqId}（改草稿会作废这次请求）`);
  const ids = tm.criteria.map(c => c.id);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  const t0 = Date.now();
  try {
    // 窄接口：只发单元 ID ＋ 复述 ＋ 输入版本 ＋ 请求 ID。材料与五档规则由服务端装配。
    // 本机＝相对路径；公网＝网关绝对地址＋体验口令（网关侧三道闸：口令／每 IP 限速／日断路器）。
    // 口令打错（403）：自动给一次重输口令的机会，仍不对就落「待复核」＋明确指引——不进无限弹窗循环。
    const once = (g) => fetch(g ? g.base + '/api/learn' : '/api/learn', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, g ? { 'x-zss-code': g.code || '' } : {}),
      signal: ctl.signal,
      body: JSON.stringify({ unit: tm.unit, said, inputVersion: ver, requestId: reqId }),
    });
    let gwCur = gw;
    let r = await once(gwCur);
    let j = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      if (stale()) return;
      j = await r.json().catch(() => null);
      if (stale()) return;
      if (j && j.error === 'bad-passcode' && attempt === 0) {
        const g2 = cnGatewayAskCode();
        if (g2) { gwCur = g2; r = await once(gwCur); continue; }
      }
      break;
    }
    meta.ms = Date.now() - t0;
    // 服务端已经校验过一次；页面这一层是兜底：拿到的判据不全／有未知 ID 一样记未判定。
    // 网关侧的错误（口令不对／限额）带 note，照实展示给访客。
    const why = (j && j.note)
      ? j.note + (j.error === 'bad-passcode' ? '（没有口令也能继续学：阅读与决策不受影响，只影响这次的机器判定。）' : '')
      : nfxServerWhy(j, r.status);
    const parsed = j && j.ok
      ? nfxValidate(JSON.stringify({ criteria: j.criteria, nextPrompt: j.nextPrompt }), ids)
      : { notJudged: why, raw: String((j && j.raw) || '') };
    if (parsed.notJudged) land(nfxNotJudgedRound(a, { ...meta, raw: parsed.raw }, parsed.notJudged));
    else land(nfxMakeRound(a, parsed, meta));
  } catch (e) {
    if (stale()) return;
    meta.ms = Date.now() - t0;
    land(nfxNotJudgedRound(a, meta, e.name === 'AbortError' ? '判定超时（20 秒），按未判定记录' : '请求失败：' + e.message));
  } finally {
    clearTimeout(timer); nfxBusy = false;
    const b = document.getElementById('nfx-submit'); if (b) b.disabled = false;
    const bx = document.getElementById('nfx-said'); if (bx) bx.disabled = false;
  }
}
window.nfxSubmit = nfxSubmit;

  const concepts = (d.concepts || []).length ? `<div class="nei-card"><h5>这一篇的三个概念</h5>

  const reading = `<div class="nei-card" id="${nfxMatId('reading')}"><h5>阅读梯度（读完这一段就能提交复述）</h5>
    <p>${esc(r.hook || '')}</p>${ladder}</div>`;
  const fey = tm
    ? nfxCardHtml(a)
    : `<div class="nei-card"><h5>阅读中的即时费曼</h5><div class="mut">这一篇还没有判据映射，因此不开即时判定（本轮试点只有 <code>agent-skills-api</code>）；不拿通用模板冒充这一篇的判据。</div></div>`;
  const decisions = (d.decisions || []).length ? `<details class="nfx-fold" id="nfx-fold-decisions">
    <summary>决策题（${(d.decisions || []).length} 道 · 参考材料 · 不必先答，即时费曼不要求答完）</summary>
    ${(d.decisions || []).map((x, i) => `<div class="fybox" id="${nfxMatId('decisions[' + i + ']')}">
      <div class="k">决策 ${i + 1} · ${esc(x.situation || '')}</div>
      <div><b>做法</b>：${esc(x.choice || '')}</div>
      <div class="mut" style="margin-top:6px"><b>适用条件</b>：${esc(x.condition || '')}</div></div>`).join('')}
    ${d.trapNote ? `<div class="mut">${esc(d.trapNote)}</div>` : ''}</details>` : '';
  return [head, concepts, reading, fey, decisions].join('');

window.neiDimBody = neiDimBody;

/* ══ 独立学习空间（Agent Loop 六章）══════════════════════════════
   数据：evidence/agent-loop-260913/chapters.json（build-learning-materials.mjs 装配）
   规则（来自 docs/企划书-135-MVP到DeepSeek执行-20260913.md §2–§3 与交接件 §3）：
     · 一题一判：答错留在当前题，答对才放下一题；三题按顺序全过才出现费曼；
     · 费曼只允许 通过／未通过／待人工复核；请求失败、格式不对、来源缺失都不能算通过；
     · 费曼未通过或待复核 → 不解锁下一章；
     · 重新编辑复述 → 立刻清掉旧的通过状态（含下一章解锁）；
     · 学习时隐藏全量图谱与主题列表，返回知识体系时恢复原路线、原步骤、原概念。 */
const LEARN_CFG = DATA.learning || { chapters: [], caseReview: {}, gaps: [] };
const LEARN = LEARN_CFG.chapters || [];          // Agent Loop 六章：顺序课程，长度仍是 6
/* 批量装配单元的阅读器载荷（76 份编译、除 superseded 外全部装进来）。
   它们是**并列的独立卡片单元**，不是一条课：所以另放一张表，不混进 LEARN
   （`LEARN.length === 6` 与六章顺序的语义一个字没动）。阅读器排版两者共用。 */
const LEARN_BATCH = LEARN_CFG.batch || [];
const LEARN_STATS = LEARN_CFG.batchStats || {};
const chapterIdx = (id) => LEARN.findIndex(c => c.chapterId === id);
/* 阅读器按 id 查单元：先查六章，再查批量。批量单元的 chapterId 是 unitId（batch-*），不会撞名。 */
const chapterById = (id) => LEARN.find(c => c.chapterId === id) || LEARN_BATCH.find(c => c.chapterId === id) || null;
const LEARN_KEY = 'zss135.learn.v1';
/* 两种费曼提交＝两份独立状态（交接件 §3 L81/L85 的分工）：
     · 读中即时费曼（lin* 系列）→ LEARN_INLINE_KEY：读完就讲，只给「这一轮讲到哪几条 ＋
       一处重点补讲」，**不写 LEARN_KEY、不解锁任何一章、不碰倒逼记录 marks**；
     · 章末验收（learnFeynman）→ LEARN_KEY：解锁规则一个字没改——feynman === 'ok' 才解锁
       下一章，未通过／待复核都锁着，改复述立刻清状态。
   两份状态各存各的键，互相不读不写（页面测试逐条断言）。 */
const LEARN_INLINE_KEY = 'zss135.learn.inline.v1';
const LEARN_INLINE_STD = '六章费曼要点 v1（稳定 ID ＋ 成立条件 ＋ 常见误解 · 2026-09-14）';
const LEARN_STATUS = { ok: '章末验收通过', fail: '章末验收未通过', wait: '待人工复核' };
let learnState = {}, learnCur = null, learnQ = 0, learnReturn = null, learnReq = 0;
const learnBusyOf = Object.create(null);   // 判定请求按章各管各的：切章不会把新章的提交吞掉
function loadLearnState() { try { learnState = JSON.parse(localStorage.getItem(LEARN_KEY) || '{}') || {}; } catch (e) { learnState = {}; } }
function saveLearnState() { try { localStorage.setItem(LEARN_KEY, JSON.stringify(learnState)); } catch (e) {} }
function stOf(id) {
  if (!learnState[id] || !Array.isArray(learnState[id].decisions)) learnState[id] = { decisions: [false, false, false], picked: [null, null, null], feynman: null, said: '', verdict: '', at: '' };
  return learnState[id];
}
const chapterOf = (cmId) => LEARN.find(c => c.cm.id === cmId) || null;
const chapterCleared = (id) => { const s = learnState[id]; return !!(s && s.feynman === 'ok'); };
/* 解锁门分两类，**不是放宽**（六章顺序一个字没改）：
   · kind === 'batch' 的批量单元是**独立卡片单元**，彼此没有先修顺序（76 个 CON 是并列的概念卡，
     不是一条课），所以它自己一进去就是开的；它也不参与"解锁下一章"（下一章是六章的下一章）。
   · 六章照旧：i === 0 或上一章章末验收通过。 */
const chapterUnlocked = (i) => {
  const c = LEARN[i];
  if (c && c.kind === 'batch') return true;
  return i === 0 || chapterCleared(LEARN[i - 1].chapterId);
};
function learnDots() {
  const el = document.getElementById('learn-dots');
  if (!el) return;
  const cur = chapterById(learnCur);
  /* 点只标六章的进度（六步课）；批量单元是并列的独立卡片，不在这条进度线上。 */
  el.innerHTML = LEARN.map((c, i) => {
    const s = learnState[c.chapterId] || {};
    const cls = s.feynman === 'ok' ? 'ok' : (chapterUnlocked(i) ? (i === chapterIdx(learnCur) ? 'on' : '') : 'lock');
    return `<i class="${cls}" title="第 ${c.order} 章 ${esc(c.title)}"></i>`;
  }).join('');
  const st = document.getElementById('learn-step');
  if (st && cur) st.textContent = cur.kind === 'batch' ? `单元 · ${esc(cur.title)}` : `第 ${cur.order} / ${LEARN.length} 章`;
}
function openLearnFor(cmId) { const c = chapterOf(cmId); return c ? openLearn(c.chapterId, { from: cmId }) : openLearnIndex(); }
function openLearnIndex() {
  if (!LEARN.length) return false;
  const first = LEARN.findIndex(c => !chapterCleared(c.chapterId));
  return openLearn(LEARN[first < 0 ? LEARN.length - 1 : first].chapterId);
}
function captureLearnReturn(cmId) {
  const id = cmId || selected;
  /* view：从哪儿进来的就回哪儿去。路径条 / 概念卡进来是 graph（老的返回行为一个字不改）；
     实践空间进来记 practice，返回时回六章列表，而不是把人丢进知识体系。 */
  const ch = chapterById(id) || chapterById(learnCur) || null;
  learnReturn = { routeId, stepIdx: id ? routeIndexOf(id) : routeStepIdx, conceptId: id && byId.has(id) ? id : null,
    view: (ch && ch.kind === 'batch') ? 'practice' : currentView };
}
function openLearn(chapterId, opts = {}) {
  const i = chapterIdx(chapterId);
  const isBatch = (chapterById(chapterId) || {}).kind === 'batch';
  if (i < 0 && !isBatch) return false;          // 既不是六章、也不是批量单元 → 真的没有
  const entering = !document.getElementById('learn').classList.contains('on');
  if (entering) captureLearnReturn(opts.from || (byId.has(chapterId) ? chapterId : null));
  /* 返回条照实说回哪：从实践空间进来的就写「返回实践空间」（同一套阅读器，两个入口）。 */
  const backBtn = document.getElementById('learn-back');
  if (backBtn) backBtn.textContent = ((learnReturn && learnReturn.view === 'practice') || isBatch) ? '← 返回实践空间' : '← 返回知识体系';
  if (!isBatch && !chapterUnlocked(i) && !opts.force) {
    // 上一章没通过就不解锁：送到上一章的费曼，并说明原因
    const prev = LEARN[i - 1];
    learnCur = prev.chapterId;
    learnQ = Math.max(0, stOf(prev.chapterId).decisions.findIndex(d => !d));
    document.body.classList.add('learning');
    document.getElementById('learn').classList.add('on');
    renderLearn(`第 ${LEARN[i].order} 章还没解锁：先把第 ${prev.order} 章「${esc(prev.title)}」的费曼复述讲通过。`);
    return false;
  }
  learnCur = chapterId;
  lgStart(chapterId);                       // 每次进这一章都从"阅读"起一个真实会话
  const firstOpen = stOf(chapterId).decisions.findIndex(d => !d);
  learnQ = firstOpen < 0 ? LEARN[i].questions.length - 1 : firstOpen;
  document.body.classList.add('learning');
  document.getElementById('learn').classList.add('on');
  renderLearn(opts.notice || '');
  const box = document.getElementById('learn');
  if (box) box.scrollTop = 0;
  return true;
}
window.openLearn = openLearn; window.openLearnFor = openLearnFor; window.openLearnIndex = openLearnIndex;
function exitLearn() {
  document.body.classList.remove('learning');
  document.getElementById('learn').classList.remove('on');
  const ret = learnReturn || {};
  const fromPractice = ret.view === 'practice';
  learnCur = null;
  if (ret.routeId) routeId = ret.routeId;
  if (typeof ret.stepIdx === 'number' && ret.stepIdx >= 0) routeStepIdx = ret.stepIdx;
  currentView = 'graph'; themeId = null; filter = null;
  document.querySelectorAll('.r-item').forEach(b => b.classList.toggle('on', b.dataset.view === (fromPractice ? 'practice' : 'graph')));
  resize(); computeLayout();
  if (ret.conceptId) { try { location.hash = ret.conceptId; } catch (e) {} }
  setMode('path');
  syncQueryInput(); renderList(); syncPath();
  if (fromPractice) { openPractice(ret.conceptId || null); learnReturn = null; return; }   // 从实践空间进来 → 回实践空间
  if (ret.conceptId) openPanel(ret.conceptId);
  learnReturn = null;
}
window.exitLearn = exitLearn;

/* 「学习这个」在路径条上的落点已撤（2026-09-15：知识体系只浏览，学习入口收敛到实践空间——CONTEXT.md 口径）；
   openLearnFor 保留给实践空间 origin 卡使用。 */

/* 课题单元列表（右栏）：费曼通过后立刻刷新解锁状态（不必整页重渲染） */
function learnChipsHtml() {
  const curCh = chapterById(learnCur);
  /* 右栏「本次课题」：读六章时列六章；读批量单元时列**它自己**（76 个并列单元全列出来是噪声，
     它们之间本来就没有先后），号码照单元自己的 order 显示，不重排成 1..76。 */
  const list = (curCh && curCh.kind === 'batch') ? [curCh] : LEARN;
  return list.map((x) => {
    const i = chapterIdx(x.chapterId);
    /* 批量单元不在六章数组里（chapterIdx 返回 -1）：它自己就是开的，不走六章的解锁门。 */
    const un = x.kind === 'batch' ? true : chapterUnlocked(i);
    const done = chapterCleared(x.chapterId), cur = x.chapterId === learnCur;
    const no = x.kind === 'batch' ? x.order : i + 1;
    return `<li class="${cur ? 'on' : ''}${un ? '' : ' lock'}"><button class="lchip ${cur ? 'on' : ''} ${un ? '' : 'lock'}" ${un ? '' : 'disabled'} onclick="openLearn('${x.chapterId}')"><b>${no}</b><span>${esc(x.title)}</span>${done ? '<i>✓</i>' : (un ? '' : '<i>🔒</i>')}</button></li>`;
  }).join('');
}
function learnChips() {
  const el = document.querySelector('#learn-wrap .lrail-steps') || document.querySelector('#learn-wrap .lchips');
  if (el) el.innerHTML = learnChipsHtml();
}

/* ── 读中即时费曼（与章末验收分开的那一份）─────────────────────────────
   判据＝本章 feynman.checks（稳定 ID ＋ 成立条件 ＋ 常见误解，见 evidence/agent-loop-260913/authored.json）。
   协议＝逐要点状态 {"checks":[{id,status,evidence}],"teaching":{focusId,text,question}}；
   解析失败／要点不全／未知 ID／超时／太短 → 未判定：不当通过，也不算空缺口。
   落盘只在 LEARN_INLINE_KEY，**从不写 LEARN_KEY**：即时反馈不解锁任何一章。 */
let linReq = 0;
const linBusyOf = Object.create(null);
function linAll() { try { return JSON.parse(localStorage.getItem(LEARN_INLINE_KEY) || '{}') || {}; } catch (e) { return {}; } }
function linSave(all) { try { localStorage.setItem(LEARN_INLINE_KEY, JSON.stringify(all)); } catch (e) {} }
function linState(id) {
  const s = linAll()[id];
  return (s && Array.isArray(s.rounds)) ? s : { draft: '', draftVer: 0, rounds: [] };
}
function linPut(id, st) { const all = linAll(); all[id] = st; linSave(all); }
/* 方案丙：并入本章的机器派生补充判据。它们**不参与通过判定**（不是本章要点、不进 parseLearnVerdict 的 required），
   页面照实标出来源与复核结论，让"哪些是人写的、哪些是机器转述的"一眼分得开。 */
function machineChecksHtml(c) {

/* 选项顺序：按「章 + 题号」做稳定洗牌 —— 同一题每次渲染顺序一致（已选中的高亮不会错位），
   但不再沿用 authored.json 里的数组顺序，避免「正解总在同一位置／总在最长的那个」被当线索用。
   返回值是渲染顺序上的**源下标**；点击与判分仍用源下标。 */
function learnPerm(chapterId, qi) {
  let h = 2166136261;
  const seed = chapterId + '#' + qi;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const perm = [0, 1, 2];
  for (let i = perm.length - 1; i > 0; i--) {
    h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13;
    const j = Math.abs(h) % (i + 1);
    const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
  }
  return perm;
}
window.learnPerm = learnPerm;

function learnRenderQ() {

    : `<div class="lgap" style="margin:2px 0 8px">人工撰写题（<code>evidence/agent-loop-260913/authored.json</code>）。</div>`;
  document.getElementById('learn-q').innerHTML = `<div class="lq">${qTag}<h3>${learnQ + 1}. ${esc(q.prompt)}</h3>`

function learnFeedback(q, j) {

    const basis = (o.basis || []).length ? `依据：<span data-basis="${esc(o.basis.join('、'))}">源材料（登记在案）</span>` : '';
