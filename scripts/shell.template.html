/* ══ 学习空间 × 全链路 Graph ══════════════════════════════════════════
   这一页不是"旁边再画一张图"：学生在这一页做的每一次复述、每一次作答，
   都通过 GRAPH_RUNNER 走真实流程边，证据账本与解锁判定都由运行器出。
   运行器是同一份文件——Node 里的 scripts/test-graph.mjs 验的就是它。 */
let LEARN_SESSION = null;
function lgUnitId(chapterId) { return `unit:chapter-${chapterId}`; }
function lgStart(chapterId) {
  if (!GV.graph) { gvLoadGraph().catch(() => {}); LEARN_SESSION = null; return null; }
  if (!window.GRAPH_RUNNER) { LEARN_SESSION = null; return null; }
  try {
    LEARN_SESSION = window.GRAPH_RUNNER.createSession({
      graph: GV.graph, entry: { ref: `activity:${lgUnitId(chapterId)}:reading` }, modelMode: 'real',
    });
    lgPaintTrace();
    if (GV.state === 'ready') { try { gvMount(document.getElementById('gv-host')); } catch (e) {} }
    return LEARN_SESSION;
  } catch (e) { LEARN_SESSION = null; return null; }
}
/* 页面是"一页装阅读＋三题"的，运行器是"一个活动一步"的。这里只做一件老实事：
   把学生**真的做过**的事按顺序补进会话，绝不替学生造作答。没答的题就停在原地。 */
function lgAdvanceTo(target) {
  const s = LEARN_SESSION; if (!s) return false;
  for (let guard = 0; guard < 40; guard++) {
    const cur = s.current().nodeId;
    if (cur === target) return true;
    if (/decision:\d+$/.test(cur)) return false;                 // 停在某道题上就等学生真答
    if (/review:\d+$/.test(cur)) { if (!s.fire('reviewed', { status: 'met', gap: false }).ok) return false; continue; }
    // 上一步答错 → 会话停在补讲；学生重答同一题就等于把那一处补上了
    if (/support$/.test(cur)) { if (!s.fire('replied', { text: '（页面上重答同一题）' }).ok) return false; continue; }
    if (/reading$/.test(cur)) { if (!s.fire('proceed', {}).ok) return false; continue; }
    if (/formative$/.test(cur)) { if (!s.fire('returned', {}).ok) return false; continue; }
    if (/return$/.test(cur)) { if (!s.fire('returned', {}).ok) return false; continue; }
    return false;
  }
  return false;
}
/* 学生真答了一道题 → 走 answered／reviewed 两条真边 */
function lgDecision(c, qi, correct, picked) {
  const s = LEARN_SESSION; if (!s) return;
  const want = `activity:${lgUnitId(c.chapterId)}:decision:${qi + 1}`;
  if (!lgAdvanceTo(want)) return;
  const crit = (c.feynman.checks[qi] || {}).id || null;
  const chosen = (c.questions[qi].options[picked] || {});
  s.setFocus(crit);
  s.fire('answered', {
    activityId: want, choice: picked, correct: !!correct, criterionId: crit,
    status: correct ? 'met' : 'missing',
    recorded: crit ? [{ id: crit, status: correct ? 'met' : 'missing', evidence: String(chosen.text || '').slice(0, 80) }] : null,
  });
  s.fire('reviewed', { status: correct ? 'met' : 'missing', gap: !correct });
  lgPaintTrace();
}
/* 读中即时费曼的一轮结果 → 走 explain／evaluated（或补讲后的 replied／returned）真边 */
function lgInlineRound(c, criteria) {
  const s = LEARN_SESSION; if (!s) return;
  if (!criteria || !criteria.length) return;
  const cur = s.current().nodeId;
  const focused = criteria[0];
  s.setFocus(focused.id);
  const worst = criteria.some(x => x.status === 'met') && criteria.every(x => x.status === 'met') ? 'met'
    : criteria.some(x => x.status === 'contradicted') ? 'contradicted'
    : criteria.some(x => x.status === 'missing') ? 'missing'
    : criteria.some(x => x.status === 'partial') ? 'partial' : 'uncertain';
  if (/support$/.test(cur)) {
    s.fire('replied', { text: '（读中补答）', criteria });
    s.fire('returned', {});
  } else {
    s.fire('explain', { text: '（读中一次复述）' });
    s.fire('evaluated', { criterionId: focused.id, status: worst, criteria });
    if (/support$/.test(s.current().nodeId)) { /* 停在补讲，等学生下一轮 */ }
  }
  lgPaintTrace();
}
/* 章末验收：只有走完真实练习、拿到独立验收记录、并由应用核对了正式条件，才写解锁 */
/* 还没到章末就重放：从页面上真实的作答记录把会话推到章末。
   没作答的题一律不补——不替学生造作答，到不了就是到不了。 */
function lgReplay(chapterId) {
  const c = chapterById(chapterId); if (!c) return false;
  const st = stOf(chapterId);
  const prev = LEARN_SESSION ? JSON.parse(JSON.stringify(LEARN_SESSION.state.evidenceByCriterion || {})) : {};
  lgStart(chapterId);                       // 新一次独立验收 = 新会话（旧记录不清空，带过来）
  const s = LEARN_SESSION; if (!s) return false;
  for (let i = 0; i < c.questions.length; i++) {
    if (!st.decisions[i]) return false;                 // 有没答的题 → 到不了章末
    lgDecision(c, i, !!st.decisions[i], st.picked[i] == null ? 0 : st.picked[i]);
  }
  s.state.evidenceByCriterion = Object.assign(prev, s.state.evidenceByCriterion);
  return lgAdvanceTo(`activity:${lgUnitId(chapterId)}:summative`);
}
async function lgSummative(c, v) {
  if (!LEARN_SESSION) { try { await gvLoadGraph(); } catch (e) {} lgStart(c.chapterId); }
  const s = LEARN_SESSION; if (!s) return { reached: false, passed: false, why: '总图索引读不到，正式门控无法执行（不是学习缺口）' };
  if (!lgAdvanceTo(`activity:${lgUnitId(c.chapterId)}:summative`) && !lgReplay(c.chapterId)) {
    return { reached: false, passed: false, why: '还有练习没作答，按正式规则不能到章末验收' };
  }
  const s2 = LEARN_SESSION;   // 重放过就是新会话了，后面必须用新的这一份
  const verdicts = {}, quotes = {};
  c.feynman.checks.forEach((ck, i) => {
    const point = c.feynman.required[i];
    const met = (v.covered || []).indexOf(point) >= 0 && (v.missing || []).indexOf(point) < 0;
    verdicts[ck.id] = met ? 'met' : 'partial';
    quotes[ck.id] = point + (met ? '（这轮讲到了）' : '（这轮没讲到）');
  });
  const allMet = Object.keys(verdicts).length > 0 && Object.keys(verdicts).every(k => verdicts[k] === 'met');
  s2.fire('assessed', { status: allMet ? 'met' : 'partial', verdicts, quotes, attempt: { passed: allMet }, note: '章末独立验收（本地模型判定）' });
  const applied = allMet ? s2.fire('applied', {}) : { ok: false, reason: '验收没有全过' };
  lgPaintTrace();
  return { reached: true, passed: !!applied.ok, why: applied.ok ? '应用核对正式通过条件通过' : (applied.reason || '未通过') };
}
/* 链路条：读真实运行状态，不是复述页面自己的状态 */
function lgPaintTrace() {
  const el = document.getElementById('lg-trace');
  if (!el) return;
  const s = LEARN_SESSION;
  if (!s) { el.innerHTML = '<span class="lgk">链路</span><span class="lgv mut">没有会话（总图索引没读到，先跑 build-graph.mjs 并重启服务）</span>'; return; }
  const t = s.trace();
  const ev = Object.values(s.state.evidenceByCriterion || {});
  const met = ev.filter(e => e.status === 'met').length;
  const row = (k, v) => `<span class="lgk">${k}</span><span class="lgv">${esc(v)}</span>`;
  el.innerHTML = row('当前活动', t.currentNode ? `${t.currentNode.label}（${t.currentNode.kind}）` : s.current().nodeId)
    + row('核对过', `${met}/${ev.length} 项理解有 met 证据`)
    + row('上一步', t.edge ? `${t.edge.event} → ${t.edge.why}` : '还没走过流程边')
    + row('回到哪', t.returnedTo ? String(t.returnedTo.returnTo).replace('activity:', '') : '—')
    + (s.state.notJudged.length ? row('系统未判定', `${s.state.notJudged.length} 次（不是学生不会）`) : '')
    + `<button class="lbtn ghost" onclick="setMode('graph');GV.tab='trace';mountGraphView().then(()=>{try{GRAPH_VIEW.setTab('trace')}catch(e){}})" style="margin-left:auto">在总图里看这条链路 →</button>`;
}
window.lgPaintTrace = lgPaintTrace;
Object.defineProperty(window, 'LEARN_SESSION', { get: () => LEARN_SESSION, configurable: true });

function learnChoose(j) {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  if (s.decisions[learnQ]) return;                 // 已通过的题不再改
  const q = c.questions[learnQ];
  s.picked[learnQ] = j;
  s.decisions[learnQ] = !!q.options[j].correct;    // 只有选对才记为通过
  if (!s.decisions[learnQ]) { s.feynman = null; s.verdict = ''; }   // 决策没全过，费曼的旧状态一律作废
  saveLearnState();
  lgDecision(c, learnQ, s.decisions[learnQ], j);   // 真作答 → 走 graph 的 answered／reviewed 两条边
  learnRenderQ(); learnDots();
}
function learnNext() {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  if (!s.decisions[learnQ]) return;
  if (learnQ < c.questions.length - 1) { learnQ++; learnRenderQ(); }
  else renderLearn();
  const box = document.getElementById('learn');
  if (box) box.scrollTop = 0;
}
window.learnChoose = learnChoose; window.learnNext = learnNext;

/* 章末验收：重新编辑复述 = 旧的通过状态作废（下一章随之重新锁上）。
   只读 #learn-final-said；读中即时费曼那份草稿在 zss135.learn.inline.v1，改它不动这里。 */
function learnSaidChanged() {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  const box = document.getElementById('learn-final-said');
  if (box) s.said = box.value;
  learnReq++;                       // 复述一改，进行中的那次判定立刻作废（返回了也不写状态）
  const had = s.feynman;
  if (had) {
    s.feynman = null; s.verdict = '';
    const res = document.getElementById('learn-fres');
    if (res) { res.className = 'lres'; res.textContent = ''; }
    const st = document.getElementById('learn-fstatus');
    if (st) st.textContent = had === 'ok' ? '已修改复述 —— 旧的章末验收通过状态已清除，请重新提交判定。' : '当前状态：还没提交';
    learnDots();
  }
  saveLearnState();                 // 草稿也落盘：没提交就刷新不该丢
}
window.learnSaidChanged = learnSaidChanged;

function parseLearnVerdict(raw, required) {
  if (typeof raw !== 'string') return null;
  const text = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
  let value;
  try { value = JSON.parse(text); } catch (e) { return null; }
  if (!Array.isArray(value.covered) || !Array.isArray(value.missing)) return null;
  const covered = value.covered.map(String), missing = value.missing.map(String);
  const has = (key) => covered.some(x => x.includes(key));
  return { covered, missing, next: String(value.next || ''), pass: required.every(has) && missing.length === 0 };
}
window.parseLearnVerdict = parseLearnVerdict;

/* 章末验收提交：解锁规则与拆分前完全一致（写 zss135.learn.v1，feynman === 'ok' 才解锁下一章）。
   读中即时费曼（linSubmit）走另一个键、另一条路径，两边互不影响。 */
async function learnFeynman() {
  const c = chapterById(learnCur), out = document.getElementById('learn-fres');
  const box = document.getElementById('learn-final-said');
  const s = stOf(c.chapterId);
  if (learnBusyOf[c.chapterId]) return;             // 同一章不许并发提交；别的章不受影响
  const said = (box ? box.value : '').trim();
  s.said = said;
  const seq = ++learnReq;                           // 本次判定的代次
  const stale = () => seq !== learnReq;             // 复述被改过／又提过一次 → 旧结果作废
  const show = (status, title, body) => {
    if (stale()) return;
    s.feynman = status; s.verdict = title + '\n' + body; s.at = new Date().toISOString();
    saveLearnState();
    if (out && document.contains(out)) { out.className = 'lres on ' + status; out.textContent = title + '\n' + body; }
    const st = document.getElementById('learn-fstatus');
    if (st && learnCur === c.chapterId) st.textContent = '当前状态：' + LEARN_STATUS[status];
    learnDots(); learnChips();
  };
  if (said.length < 30) { show('wait', '还不能判定', '请再具体一些：至少说清 ' + c.feynman.required.join('、') + '。'); return; }
  const local = /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);
  if (!local) { show('wait', '待人工复核', '公网静态版不调用模型，也不把提交当作通过。'); return; }
  learnBusyOf[c.chapterId] = true;
  const btn = document.getElementById('learn-submit');
  if (btn) btn.disabled = true;
  if (box) box.disabled = true;                     // 提交中锁住复述：判定结果必须对应这一版文本
  show('wait', '复述已提交', '正在尝试本地判定（不调用知乎）。');
  try {
    const material = [
      `概念：${c.cm.name}（${c.cm.description}）`,
      `定义：${c.reading.explain.text}`,
      `机制：${c.reading.mechanism.text}`,
      `边界：${c.reading.boundary.items.join('；')}`,
    ].join('\n');
    const r = await fetch('/api/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ json: false, messages: [
      { role: 'system', content: '你是一个学习单元的费曼复述检查器。只根据给定材料判断，不调用外部资料，不引用知乎。必须只输出 JSON，格式为 {"covered":["要点"],"missing":[],"next":"一句下一步"}。covered 只填复述中确实说到的要点，取值必须从给定要点列表里原样挑选；missing 填漏掉的要点；两者都只能用要点列表里的原词。' },
      { role: 'user', content: `要点列表：${c.feynman.required.join('、')}\n材料：\n${material}\n复述：${said}` },
    ] }) });
    if (stale()) return;
    if (!r.ok) throw new Error('llm-http-' + r.status);
    const j = await r.json();
    if (stale()) return;
    const v = parseLearnVerdict(j.content, c.feynman.required);
    if (!v) { show('wait', '待人工复核', '本地模型返回的格式不符合判定协议，没有把它当作通过。\n原始返回：' + String(j.content || '').slice(0, 400)); return; }
    const body = `讲到了：${v.covered.join('、') || '无'}\n漏点：${v.missing.join('、') || '无'}\n下一步：${v.next || '无'}`;
    if (v.pass) {
      // 正式门控由应用（运行器）执行：走完真实练习 → 独立验收记录 → 应用核对 → 才写解锁
      const gate = await lgSummative(c, v);
      if (gate.passed) show('ok', '章末验收通过 · 判定等级：本地模型', body + '\n应用核对：' + gate.why + '；下一章已解锁。');
      else show('wait', '章末验收待复核', body + '\n应用核对没通过：' + gate.why + '；下一章保持锁定，且没有把它当作学习缺口。');
    } else show('fail', '章末验收未通过 · 判定等级：本地模型', body + '\n请补齐漏点后重新提交；下一章保持锁定。');
  } catch (e) {
    show('wait', '待人工复核', '本地模型暂不可用或请求失败，没有把它当作通过。\n' + e.message);
  } finally { learnBusyOf[c.chapterId] = false; if (btn) btn.disabled = false; if (box) box.disabled = false; }
}
window.learnFeynman = learnFeynman;
loadLearnState();

function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

refreshRail();
