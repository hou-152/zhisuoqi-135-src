/* ══ 独立学习空间（Agent Loop 六章）══════════════════════════════
   数据：evidence/agent-loop-260913/chapters.json（build-learning-materials.mjs 装配）
   规则（来自 docs/企划书-135-MVP到DeepSeek执行-20260913.md §2–§3 与交接件 §3）：
     · 一题一判：答错留在当前题，答对才放下一题；三题按顺序全过才出现费曼；
     · 费曼只允许 通过／未通过／待人工复核；请求失败、格式不对、来源缺失都不能算通过；
     · 费曼未通过或待复核 → 不解锁下一章；
     · 重新编辑复述 → 立刻清掉旧的通过状态（含下一章解锁）；
     · 学习时隐藏全量图谱与主题列表，返回知识体系时恢复原路线、原步骤、原概念。 */
const LEARN_CFG = DATA.learning || { chapters: [], caseReview: {}, gaps: [] };
const LEARN = LEARN_CFG.chapters || [];
const LEARN_KEY = 'zss135.learn.v1';
const LEARN_STATUS = { ok: '费曼通过', fail: '费曼未通过', wait: '待人工复核' };
let learnState = {}, learnCur = null, learnQ = 0, learnBusy = false, learnReturn = null;
function loadLearnState() { try { learnState = JSON.parse(localStorage.getItem(LEARN_KEY) || '{}') || {}; } catch (e) { learnState = {}; } }
function saveLearnState() { try { localStorage.setItem(LEARN_KEY, JSON.stringify(learnState)); } catch (e) {} }
function stOf(id) {
  if (!learnState[id] || !Array.isArray(learnState[id].decisions)) learnState[id] = { decisions: [false, false, false], picked: [null, null, null], feynman: null, said: '', verdict: '', at: '' };
  return learnState[id];
}
const chapterOf = (cmId) => LEARN.find(c => c.cm.id === cmId) || null;
const chapterById = (id) => LEARN.find(c => c.chapterId === id) || null;
const chapterCleared = (id) => { const s = learnState[id]; return !!(s && s.feynman === 'ok'); };
const chapterUnlocked = (i) => i === 0 || chapterCleared(LEARN[i - 1].chapterId);
const chapterIdx = (id) => LEARN.findIndex(c => c.chapterId === id);
function learnDots() {
  const el = document.getElementById('learn-dots');
  if (!el) return;
  el.innerHTML = LEARN.map((c, i) => {
    const s = learnState[c.chapterId] || {};
    const cls = s.feynman === 'ok' ? 'ok' : (chapterUnlocked(i) ? (i === chapterIdx(learnCur) ? 'on' : '') : 'lock');
    return `<i class="${cls}" title="第 ${c.order} 章 ${esc(c.title)}"></i>`;
  }).join('');
  const st = document.getElementById('learn-step');
  if (st && learnCur) st.textContent = `第 ${chapterById(learnCur).order} / ${LEARN.length} 章`;
}
function openLearnFor(cmId) { const c = chapterOf(cmId); return c ? openLearn(c.chapterId, { from: cmId }) : openLearnIndex(); }
function openLearnIndex() {
  if (!LEARN.length) return false;
  const first = LEARN.findIndex(c => !chapterCleared(c.chapterId));
  return openLearn(LEARN[first < 0 ? LEARN.length - 1 : first].chapterId);
}
function captureLearnReturn(cmId) {
  const id = cmId || selected;
  learnReturn = { routeId, stepIdx: id ? routeIndexOf(id) : routeStepIdx, conceptId: id && byId.has(id) ? id : null };
}
function openLearn(chapterId, opts = {}) {
  const i = chapterIdx(chapterId);
  if (i < 0) return false;
  const entering = !document.getElementById('learn').classList.contains('on');
  if (entering) captureLearnReturn(opts.from || (byId.has(chapterId) ? chapterId : null));
  if (!chapterUnlocked(i) && !opts.force) {
    // 上一章没通过就不解锁：送到上一章的费曼，并说明原因
    const prev = LEARN[i - 1];
    learnCur = prev.chapterId;
    learnQ = Math.max(0, stOf(prev.chapterId).decisions.findIndex(d => !d));
    document.body.classList.add('learning');
    document.getElementById('learn').classList.add('on');
    renderLearn(`第 ${LEARN[i].order} 章还没解锁：先把第 ${prev.order} 章「${esc(prev.title)}」的费曼复述讲通过。`);
    return false;
  }
  learnCur = chapterId;
  const firstOpen = stOf(chapterId).decisions.findIndex(d => !d);
  learnQ = firstOpen < 0 ? LEARN[i].questions.length - 1 : firstOpen;
  document.body.classList.add('learning');
  document.getElementById('learn').classList.add('on');
  renderLearn(opts.notice || '');
  const box = document.getElementById('learn');
  if (box) box.scrollTop = 0;
  return true;
}
window.openLearn = openLearn; window.openLearnFor = openLearnFor; window.openLearnIndex = openLearnIndex;
function exitLearn() {
  document.body.classList.remove('learning');
  document.getElementById('learn').classList.remove('on');
  const ret = learnReturn || {};
  learnCur = null;
  if (ret.routeId) routeId = ret.routeId;
  if (typeof ret.stepIdx === 'number' && ret.stepIdx >= 0) routeStepIdx = ret.stepIdx;
  currentView = 'graph'; themeId = null; filter = null;
  document.querySelectorAll('.r-item').forEach(b => b.classList.toggle('on', b.dataset.view === 'graph'));
  resize(); computeLayout();
  if (ret.conceptId) { try { location.hash = ret.conceptId; } catch (e) {} }
  setMode('path');
  renderList(); syncPath();
  if (ret.conceptId) openPanel(ret.conceptId);
  learnReturn = null;
}
window.exitLearn = exitLearn;

/* 「学习这个」在路径条上的落点：有章节就进独立学习空间，没有章节才回落到原来的交卷框 */
function learnEntryLabel(cmId) { const c = chapterOf(cmId); return c ? `学习这个 · 第 ${c.order} 章` : '学习这个'; }
window.learnEntryLabel = learnEntryLabel;

function renderLearn(notice) {
  const c = chapterById(learnCur);
  if (!c) return;
  const s = stOf(c.chapterId);
  const wrap = document.getElementById('learn-wrap');
  document.getElementById('learn-title').textContent = `学习空间 · ${c.title}`;
  const read = (label, text, from) => text ? `<div class="quote"><b>${esc(label)}${from ? ` <code>${esc(from)}</code>` : ''}</b><br>${esc(text)}</div>` : '';
  const pair = [
    ['QST', c.qst.title, c.qst.id], ['CON', c.concept.title, c.concept.id],
    ['CAS', c.case.type || '案例', c.case.id],
    ['OPI', c.opinions.length ? `${c.opinions.length} 条判断依据` : '本章没有 OPI 直连', c.opinions.map(o => o.id).join(' / ') || '—'],
    ['SOL', '行动说明', c.solution.id],
  ];
  const decisionsDone = s.decisions.every(Boolean);
  const chips = LEARN.map((x, i) => {
    const un = chapterUnlocked(i), done = chapterCleared(x.chapterId);
    return `<button class="lchip ${x.chapterId === learnCur ? 'on' : ''} ${un ? '' : 'lock'}" ${un ? '' : 'disabled'} onclick="openLearn('${x.chapterId}')">${i + 1}. ${esc(x.title)}${done ? ' ✓' : ''}${un ? '' : ' 🔒'}</button>`;
  }).join('');
  const reviewLine = c.review.caseState === 'pending-owner-confirmation'
    ? `<div class="lgap" style="color:#e0a94a">审核状态：主案例是<b>候选</b>（${esc(c.case.type)}），负责人尚未确认 —— 本页只作候选装配稿，不当已审核材料。</div>` : '';

  wrap.innerHTML = `
    <h1>${esc(c.title)}</h1>
    <div class="sub">路线：${esc(c.routeTitle)} · 第 ${c.routeStep} / ${c.routeSteps} 步 · ${esc(c.cm.domain || '')}<br>${esc(c.why)}</div>
    <div class="lchips">${chips}</div>
    ${notice ? `<div class="lcard" style="border-color:#5a4a24;background:#1b1710"><b style="color:#e0a94a">${notice}</b></div>` : ''}

    <div class="lcard">
      <span class="lb">1 · 阅读</span>
      <h2>概念地图打的是这张卡</h2>
      <div class="quote"><b>${esc(c.cm.name)}</b> <code>${esc(c.cm.id)}</code><br>${esc(c.cm.description)}</div>
      ${read('原文 context', c.reading.original.text)}
      ${read('定义', c.reading.explain.text, c.reading.explain.from)}
      ${read('直觉', c.reading.intuition.text, c.reading.intuition.from)}
      ${read('机制', c.reading.mechanism.text, c.reading.mechanism.from)}
      <div class="quote"><b>边界 ${c.reading.boundary.from ? `<code>${esc(c.reading.boundary.from)}</code>` : ''}</b><ul>${c.reading.boundary.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      ${c.framingNote ? `<div class="lcase"><b>口径注（两处来源不同，已登记不合并）</b><br>${esc(c.framingNote)}</div>` : ''}
      <div class="lpair">${pair.map(([k, v, id]) => `<div><b>${k}</b><span>${esc(v)}</span><code>${esc(id)}</code></div>`).join('')}</div>
      ${reviewLine}
      <div class="lgap">迁移问题：${esc(c.concept.transferQuestion)}<br>分类问题：${esc(c.concept.categoryQuestion)}<br>来源：${esc(c.concept.sources.join(' · '))}（CON）／${esc(c.case.sources.join(' · '))}（CAS）／${esc(c.solution.sources.join(' · '))}（SOL）</div>
    </div>

    <div class="lcase">
      <b>主案例 · ${esc(c.case.type)}${c.review.caseState === 'pending-owner-confirmation' ? ' · 候选（未经负责人确认）' : ''}</b><br>
      ${esc(c.case.summary)}
      <div class="lgap" style="margin-top:8px">${esc(c.case.id)} · 候选案例 ${c.case.candidates.length} 个（${esc(c.case.candidates.join('、'))}）· 本章主案例 ${esc(c.case.primaryCaseId)}<br>来源依据：${esc(c.case.evidence)}</div>
    </div>

    <div class="lcard">
      <span class="lb">2 · 一题一判</span>
      <h2>三道决策，按顺序通过</h2>
      <div class="sub" id="learn-qhint"></div>
      <div id="learn-q"></div>
      <div class="lrow"><button class="lbtn" id="learn-next" onclick="learnNext()" disabled>选对后进入下一题</button><span class="lgap" id="learn-qstatus"></span></div>
    </div>

    ${decisionsDone ? `<div class="lcard" id="learn-fey">
      <span class="lb">3 · 费曼收尾</span>
      <h2>用自己的话讲清楚</h2>
      <div class="sub">${esc(c.feynman.prompt)}<br>要点：${c.feynman.required.map(esc).join(' · ')}</div>
      <textarea id="learn-said" placeholder="我会这样解释……" oninput="learnSaidChanged()">${esc(s.said || '')}</textarea>
      <div class="lrow"><button class="lbtn" id="learn-submit" onclick="learnFeynman()">提交复述</button><button class="lbtn ghost" onclick="learnQ=0;renderLearn()">回看决策</button><span class="lgap" id="learn-fstatus">${s.feynman ? '当前状态：' + LEARN_STATUS[s.feynman] : ''}</span></div>
      <div class="lres ${s.feynman || ''} ${s.feynman ? 'on' : ''}" id="learn-fres">${s.feynman ? esc(s.verdict || '') : ''}</div>
    </div>` : '<div class="lcard" id="learn-fey" style="opacity:.6"><span class="lb warn">3 · 费曼收尾</span><h2>三题按顺序全对后才会出现</h2><div class="sub">费曼是限速器：没过就不解锁下一章。</div></div>'}

    <div class="lcard">
      <span class="lb">材料缺口（照实登记，不补齐）</span>
      <ul>${(LEARN_CFG.gaps || []).map(g => `<li>${esc(g)}</li>`).join('')}</ul>
      <div class="lgap">本页不调用知乎。装配状态：${esc(c.review.statusNote)}</div>
    </div>`;
  learnRenderQ();
  learnDots();
}
window.renderLearn = renderLearn;

function learnRenderQ() {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  const q = c.questions[learnQ];
  const picked = s.picked[learnQ];
  const passed = !!s.decisions[learnQ];
  document.getElementById('learn-qhint').textContent = `第 ${learnQ + 1} / ${c.questions.length} 题 · ${q.judgment}（每题 3 个选项，只有 1 个正确）`;
  document.getElementById('learn-q').innerHTML = `<div class="lq"><h3>${learnQ + 1}. ${esc(q.prompt)}</h3>`
    + q.options.map((o, j) => {
      const cls = picked === j ? (o.correct ? 'ok' : 'bad') : '';
      return `<button class="lopt ${cls}" ${passed ? 'disabled' : ''} onclick="learnChoose(${j})"><b>${'ABC'[j]}.</b> ${esc(o.text)}</button>`;
    }).join('')
    + (picked === null || picked === undefined ? '' : `<div class="lfb">${learnFeedback(q, picked)}</div>`)
    + '</div>';
  const btn = document.getElementById('learn-next');
  btn.disabled = !passed;
  btn.textContent = learnQ === c.questions.length - 1 ? '三题通过，进入费曼' : '选对后进入下一题';
  document.getElementById('learn-qstatus').textContent = passed ? `${learnQ + 1} / ${c.questions.length} 题通过` : '本题尚未通过；可以重选';
}
function learnFeedback(q, j) {
  const o = q.options[j];
  if (o.correct) {
    const basis = (o.basis || []).length ? `依据：${o.basis.join('、')}` : '';
    const quote = o.basisQuote ? `<br>原文：${esc(o.basisQuote)}` : '';
    return `<b>对。</b>${esc(o.why || '')}${o.why ? '<br>' : ''}${esc(basis)}${quote}`;
  }
  return `<b>这一步不对。</b>${esc(o.why || '')} 留在本题，可以重选。`;
}
function learnChoose(j) {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  if (s.decisions[learnQ]) return;                 // 已通过的题不再改
  const q = c.questions[learnQ];
  s.picked[learnQ] = j;
  s.decisions[learnQ] = !!q.options[j].correct;    // 只有选对才记为通过
  if (!s.decisions[learnQ]) { s.feynman = null; s.verdict = ''; }   // 决策没全过，费曼的旧状态一律作废
  saveLearnState();
  learnRenderQ(); learnDots();
}
function learnNext() {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  if (!s.decisions[learnQ]) return;
  if (learnQ < c.questions.length - 1) { learnQ++; learnRenderQ(); }
  else renderLearn();
  const box = document.getElementById('learn');
  if (box) box.scrollTop = 0;
}
window.learnChoose = learnChoose; window.learnNext = learnNext;

/* 重新编辑复述 = 旧的通过状态作废（下一章随之重新锁上） */
function learnSaidChanged() {
  const c = chapterById(learnCur); if (!c) return;
  const s = stOf(c.chapterId);
  const box = document.getElementById('learn-said');
  s.said = box ? box.value : '';
  const had = s.feynman;
  if (had) {
    s.feynman = null; s.verdict = '';
    const res = document.getElementById('learn-fres');
    if (res) { res.className = 'lres'; res.textContent = ''; }
    const st = document.getElementById('learn-fstatus');
    if (st) st.textContent = had === 'ok' ? '已修改复述 —— 旧的通过状态已清除，请重新提交判定。' : '当前状态：还没提交';
    learnDots();
    saveLearnState();
  }
}
window.learnSaidChanged = learnSaidChanged;

function parseLearnVerdict(raw, required) {
  if (typeof raw !== 'string') return null;
  const text = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
  let value;
  try { value = JSON.parse(text); } catch (e) { return null; }
  if (!Array.isArray(value.covered) || !Array.isArray(value.missing)) return null;
  const covered = value.covered.map(String), missing = value.missing.map(String);
  const has = (key) => covered.some(x => x.includes(key));
  return { covered, missing, next: String(value.next || ''), pass: required.every(has) && missing.length === 0 };
}
window.parseLearnVerdict = parseLearnVerdict;

async function learnFeynman() {
  const c = chapterById(learnCur), out = document.getElementById('learn-fres');
  const box = document.getElementById('learn-said');
  const s = stOf(c.chapterId);
  if (learnBusy) return;
  const said = (box ? box.value : '').trim();
  s.said = said;
  const show = (status, title, body) => {
    s.feynman = status; s.verdict = title + '\n' + body; s.at = new Date().toISOString();
    saveLearnState();
    out.className = 'lres on ' + status; out.textContent = title + '\n' + body;
    const st = document.getElementById('learn-fstatus'); if (st) st.textContent = '当前状态：' + LEARN_STATUS[status];
    learnDots();
  };
  if (said.length < 30) { show('wait', '还不能判定', '请再具体一些：至少说清 ' + c.feynman.required.join('、') + '。'); return; }
  const local = /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);
  if (!local) { show('wait', '待人工复核', '公网静态版不调用模型，也不把提交当作通过。'); return; }
  learnBusy = true;
  const btn = document.getElementById('learn-submit');
  if (btn) btn.disabled = true;
  show('wait', '复述已提交', '正在尝试本地判定（不调用知乎）。');
  try {
    const material = [
      `概念：${c.cm.name}（${c.cm.description}）`,
      `定义：${c.reading.explain.text}`,
      `机制：${c.reading.mechanism.text}`,
      `边界：${c.reading.boundary.items.join('；')}`,
    ].join('\n');
    const r = await fetch('/api/llm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ json: false, messages: [
      { role: 'system', content: '你是一个学习单元的费曼复述检查器。只根据给定材料判断，不调用外部资料，不引用知乎。必须只输出 JSON，格式为 {"covered":["要点"],"missing":[],"next":"一句下一步"}。covered 只填复述中确实说到的要点，取值必须从给定要点列表里原样挑选；missing 填漏掉的要点；两者都只能用要点列表里的原词。' },
      { role: 'user', content: `要点列表：${c.feynman.required.join('、')}\n材料：\n${material}\n复述：${said}` },
    ] }) });
    if (!r.ok) throw new Error('llm-http-' + r.status);
    const j = await r.json();
    const v = parseLearnVerdict(j.content, c.feynman.required);
    if (!v) { show('wait', '待人工复核', '本地模型返回的格式不符合判定协议，没有把它当作通过。\n原始返回：' + String(j.content || '').slice(0, 400)); return; }
    const body = `讲到了：${v.covered.join('、') || '无'}\n漏点：${v.missing.join('、') || '无'}\n下一步：${v.next || '无'}`;
    if (v.pass) show('ok', '费曼通过 · 判定等级：本地模型', body + '\n下一章已解锁。');
    else show('fail', '费曼未通过 · 判定等级：本地模型', body + '\n请补齐漏点后重新提交；下一章保持锁定。');
  } catch (e) {
    show('wait', '待人工复核', '本地模型暂不可用或请求失败，没有把它当作通过。\n' + e.message);
  } finally { learnBusy = false; if (btn) btn.disabled = false; }
}
window.learnFeynman = learnFeynman;
loadLearnState();

/* 一条候选边的详情（列表里点进来） */



function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

refreshRail();
