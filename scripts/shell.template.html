<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知所栖 135 · AI 时代要学的每一件事</title>
<style>
/* ══ 知所栖 135 · Linear 式三栏外壳 ══════════════════════════════
   参考：所有者 09-12 05:03–05:38 提供的 Linear Agent 页截图。
   Linear 的骨架是**三栏**：导航栏 | 列表栏 | 详情栏。
   之前那版是「全屏画布 + 滑出抽屉」——中间那一栏没有，所以没有 Linear 的味道。
   配色也按 Linear 收：近黑、低对比边、无光晕、无渐变。 */
:root{
  --bg:#08090a; --panel:#0e0f10; --panel2:#0b0c0d; --line:#1b1c1e; --line2:#232426;
  --fg:#f7f8f8; --fg2:#8a8f98; --fg3:#62666d; --fg4:#3c3f44;
  --accent:#5e6ad2; --accent2:#7c86e8;
  --ok:#4cb782; --bad:#eb5757; --warn:#f2c94c; --read:#9b7fe8;
  --row:30px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── 顶栏 + 两栏（2026-09-15：一级导航搬到顶端）────────────────────
   所有者：「左边的这个一级页面、一级功能栏，内参、知识体系、实践空间，应该放到顶端」。
   左栏整条撤掉（品牌 + 搜索 + 三个一级导航都进顶栏），主区分列从
   「224 导航 | 302 列表 | 1fr」变成「302 列表 | 1fr」——画布顺带白捡 224px。
   二级的「视图 tab 板」（09-15 v3 起＝我的树｜路径＋右侧「系统视图」小入口；
   关系/星球撤入口）仍长在知识树**里面**的主区顶部：一级在顶栏、二级在主区，层级不混。 */
#app{display:grid;grid-template-columns:302px 1fr;grid-template-rows:46px 1fr;height:100vh;overflow:hidden}

/* 顶栏（一级）：品牌 + 内参 / 知识树 / 实践空间 + 搜索 */
#topbar{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:18px;min-width:0;
  padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.r-brand{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  letter-spacing:.01em;flex:0 0 auto}
.r-brand span{font-size:10.5px;font-weight:500;color:var(--fg3);border:1px solid var(--line2);
  border-radius:5px;padding:0 5px;line-height:16px}
.r-brand .pubtag{border-color:#2b3a5c;color:#7c93c9}
.r-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;width:230px;
  flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--fg3);font-size:12.5px}
.r-search input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-size:12.5px;
  font-family:inherit;min-width:0}
.r-search input::placeholder{color:var(--fg4)}
.r-list{display:flex;flex-direction:row;align-items:center;gap:2px;flex:0 0 auto}
.r-item{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;
  background:none;border:0;border-radius:6px;cursor:pointer;color:var(--fg2);
  text-align:left;font-size:13px;white-space:nowrap}
.r-item:hover{background:#161719;color:var(--fg)}
.r-item.on{background:#1d1e21;color:var(--fg)}
.r-item .ic{width:14px;text-align:center;font-size:12px;opacity:.75;flex:0 0 14px}
.r-item b{font-weight:450;white-space:nowrap}
.r-item i{font-style:normal;font-size:11px;color:var(--fg4);white-space:nowrap}
.r-item.on i{color:var(--fg3)}

/* 列表栏 */
#list{grid-column:1;grid-row:2;background:var(--panel2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0}
.lp-head{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;
  border-bottom:1px solid var(--line);flex:0 0 44px}
.lp-head b{font-size:13px;font-weight:550}
.lp-head .cnt{font-size:11.5px;color:var(--fg4)}
.lp-head .spacer{flex:1}
.lp-head button{background:none;border:0;color:var(--fg4);cursor:pointer;font-size:12px;
  padding:3px 5px;border-radius:5px}
.lp-head button:hover{background:#1a1b1e;color:var(--fg2)}
.lp-body{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 6px 12px;scrollbar-width:thin}
.lp-body::-webkit-scrollbar{width:8px}
.lp-body::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
.row{display:flex;align-items:center;gap:8px;height:var(--row);padding:0 8px;border-radius:6px;
  cursor:pointer;color:var(--fg2);font-size:12.5px}
.row:hover{background:#161719;color:var(--fg)}
.row.on{background:#1d1e21;color:var(--fg)}
.row .rd{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.row .rn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:11px;color:var(--fg4);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .st{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.lp-empty{color:var(--fg4);font-size:12px;padding:22px 10px;text-align:center;line-height:1.9}

/* 主区 */
#main{grid-column:2;grid-row:2;position:relative;background:var(--bg);overflow:hidden;min-width:0}
/* 详情打开时主区让出 412px，画布跟着缩——盖住图就不是 Linear 了 */
#main.pinned #c{right:412px}
#main.pinned .mtools{right:412px}
#c{position:absolute;inset:0;display:block;cursor:grab;touch-action:none;transition:right .14s}
#c.drag{cursor:grabbing}
#c.nodedrag{cursor:grabbing}
/* tab 板（图谱 / 星球）：**知识体系这个页面内的视图切换**，长在主区顶部。
   09-13 曾提到三栏之上当全局顶栏，所有者 04:0x 改口：「它不应该在顶栏，
   而是它在知识体系下面的那个 tab」——层级归位，位置回主区。 */
.mtools{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
  gap:6px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);z-index:4;
  background:linear-gradient(180deg,rgba(8,9,10,.92),rgba(8,9,10,.55));backdrop-filter:blur(6px)}
.mtools .spacer{flex:1}
/* 按钮不许压缩换行：详情卡打开时 tab 板只剩 ~500px，「布局归位」被挤成竖排过一次 */
.mtools>*{flex:0 0 auto}
.mtools .spacer{flex:1 1 auto}
.tab{background:none;border:1px solid var(--line);color:var(--fg3);font-size:11.5px;height:24px;
  padding:0 11px;border-radius:5px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg2);border-color:var(--line2)}
.tab.on{background:#1d1e21;color:var(--fg);border-color:var(--line2)}
.rel-legend{display:none;align-items:center;gap:8px;color:var(--fg4);font-size:10.5px;white-space:nowrap}
.rel-legend.on{display:flex}
.rel-legend span{display:inline-flex;align-items:center;gap:3px}
.rel-legend i{display:inline-block;width:7px;height:7px;border-radius:50%}
.mtools .mm{font-size:11.5px;color:var(--fg4);flex:0 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* 视图工具（全览 / 归位）：不是视图 tab，别给 .tab 类——验收脚本按 .tab 数视图 */
.tbtn{background:none;border:1px solid var(--line);color:var(--fg4);font-size:11px;height:22px;
  padding:0 9px;border-radius:5px;cursor:pointer;margin-left:2px;white-space:nowrap}
.tbtn:hover{color:var(--fg2);border-color:var(--line2)}
.tbtn[hidden]{display:none}

/* ── 路径视图（09-13 加）──────────────────────────────────────
   路径 = 主区第四种观察方式，也是默认。它**不改图谱数据**，只在同一张画布上做取舍：
   路线上的点亮、当前步加环、其余降噪；左上方那条是「导师」说话的地方（方案 B），
   画布上的高亮是「路径地图」（方案 C）。
   条宽 262px：路径模式下图谱整体右移（layoutGrid 的 x0 从 0.29 挪到 0.37），
   不让任何一个点躲在条下面——否则画布点击会被这条吃掉。 */
#pathrail{position:absolute;left:0;top:44px;bottom:0;width:262px;z-index:5;padding:13px 10px 20px 14px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;display:none;
  background:linear-gradient(100deg,rgba(8,9,10,.97) 66%,rgba(8,9,10,0));
  pointer-events:none}
#pathrail.on{display:block}
#pathrail>*{pointer-events:auto}
#main.pinned #pathrail{display:none}   /* 卡片已经写着同一套上下文，不再占画布 */
#pathrail::-webkit-scrollbar{width:8px}
#pathrail::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
/* ── 树头（v3-knowledge-tree）：slogan + 绝对数统计 + 四态图例 ─────
   只在「我的树」模式出现（#main.treeon）。统计只报绝对数——
   09-12 路演红线：不报「占全树百分比」（目录越长比例越误导）。
   不挡点击：pointer-events:none，图例也只是说明，不是控件。 */
#tree-head{position:absolute;left:14px;top:54px;z-index:4;pointer-events:none;display:none;max-width:430px}
#main.treeon #tree-head{display:block}
#main.pinned #tree-head{display:none}      /* 卡片打开时让位（卡片里写着同一批数字的来源） */
#tree-head .th-slogan{font-size:16.5px;font-weight:650;letter-spacing:.4px;color:var(--fg);
  text-shadow:0 1px 10px rgba(8,9,10,.9)}
#tree-head .th-slogan span{color:#5ee0c0}
#tree-head .th-stat{margin-top:5px;font-size:11.5px;color:var(--fg3);line-height:1.7;
  text-shadow:0 1px 8px rgba(8,9,10,.9)}
#tree-head .th-stat b{color:var(--fg)}
#tree-head .th-legend{margin-top:6px;display:flex;gap:10px;font-size:10.5px;color:var(--fg4)}
#tree-head .th-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;
  border:1.6px solid #fff;margin-right:4px;vertical-align:-1px;background:transparent}
.pr-kicker{font-size:10.5px;color:var(--fg4);letter-spacing:.04em}
.pr-title{font-size:15px;font-weight:550;margin:5px 0 4px;letter-spacing:-.01em;line-height:1.35}
.pr-q{font-size:11.5px;color:var(--fg3);line-height:1.7;margin-bottom:8px}
.pr-target{font-size:10.5px;color:var(--fg4);line-height:1.6;border-left:2px solid var(--line2);
  padding-left:8px;margin-bottom:11px}
.pr-steps{list-style:none;margin:0;padding:0}
.pr-step{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  border-left:2px solid var(--line);padding:5px 6px 5px 9px;cursor:pointer;color:var(--fg3);
  font-family:inherit;font-size:12.5px;text-align:left;line-height:1.4}
.pr-step:hover{background:#161719;color:var(--fg)}
.pr-step .no{flex:0 0 12px;font-size:10px;color:var(--fg4);font-variant-numeric:tabular-nums}
.pr-step .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-step .tag{font-size:9.5px;color:var(--fg4);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.pr-step.done{border-left-color:#2b4a37;color:var(--fg2)}
.pr-step.done .no{color:#4cb782}
.pr-step.next{border-left-color:#39406b;color:var(--fg2)}
.pr-step.cur{border-left-color:var(--accent);color:var(--fg);background:#14151a}
.pr-step .st{font-size:10px;color:var(--fg4)}
.pr-block{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.pr-why{font-size:11.5px;color:var(--fg2);line-height:1.75}
.pr-why b{color:var(--fg4);font-weight:500;display:block;font-size:10px;margin-bottom:3px;letter-spacing:.03em}
.pr-nav{margin-top:9px;font-size:11.5px;color:var(--fg3);line-height:2}
.pr-nav button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0 2px;
  border-bottom:1px dashed var(--line2)}
.pr-nav button:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
.pr-nav i{font-style:normal;color:#4cb782}
.pr-back{margin-top:8px;width:100%;text-align:left;background:#241715;border:1px solid #57302a;
  border-radius:6px;color:#e8bdb6;font-size:11.5px;padding:6px 9px;cursor:pointer;font-family:inherit;line-height:1.5}
.pr-back:hover{background:#2e1c19}
.pr-bq{font-size:11px;color:var(--fg4);margin-bottom:6px}
.pr-opt{display:block;width:100%;text-align:left;background:#101113;border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;margin-bottom:5px;cursor:pointer;color:var(--fg2);
  font-family:inherit;font-size:12px;line-height:1.5}
.pr-opt:hover{border-color:var(--line2);color:var(--fg)}
.pr-opt em{font-style:normal;font-size:9.5px;color:#b9c0f0;border:1px solid #39406b;background:#20263f;
  border-radius:4px;padding:0 4px;margin-left:5px}
.pr-opt span{display:block;color:var(--fg4);font-size:10.5px;margin-top:2px}
.pr-foot{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pr-foot button{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11px;height:24px;padding:0 9px;cursor:pointer;font-family:inherit}
.pr-foot button:hover{background:#1d1e21;color:var(--fg)}
.pr-empty{font-size:11.5px;color:var(--fg4);line-height:1.9}

/* 概念卡顶部的路径上下文 */
.pctx{border:1px solid #2a2f4a;background:#11131c;border-radius:8px;padding:11px 12px;margin-bottom:14px}
.pctx .k{font-size:10.5px;color:#8f9ad0;letter-spacing:.03em}
.pctx h4{font-size:13px;font-weight:550;margin:5px 0 7px;color:var(--fg)}
.pctx .why{font-size:12px;color:var(--fg2);line-height:1.8}
.pctx .why b{color:var(--fg4);font-weight:500}
.pctx .nav{margin-top:9px;font-size:12px;color:var(--fg3);line-height:2.1}
.pctx .nav button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0 2px;
  border-bottom:1px dashed var(--line2)}
.pctx .nav button:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
.pctx .nav i{font-style:normal;color:#4cb782}
.pctx .nav u{text-decoration:none;color:var(--fg4);font-size:11px}
.pctx .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pctx .loop-note{margin-top:9px;padding:7px 8px;border-left:2px solid #d9a84e;background:rgba(217,168,78,.08);font-size:11.5px;line-height:1.65;color:var(--fg2)}
.pctx .loop-note b{color:#e4bd72;font-weight:500}
.pctx.off{border-color:var(--line2);background:#101113;font-size:11.5px;color:var(--fg4);line-height:1.8}
.pctx.off button{background:#17181b;border:1px solid var(--line2);border-radius:5px;color:var(--fg2);
  font-size:11px;height:22px;padding:0 8px;cursor:pointer;font-family:inherit;margin-left:6px}
.pctx details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.pctx summary{cursor:pointer;font-size:11px;color:var(--fg4);outline:none}
.pctx h5{margin:10px 0 4px;font-size:10.5px;color:var(--fg4);font-weight:500}
.pctx ul{list-style:none}
.pctx li{display:block;padding:4px 0;font-size:11.5px;color:var(--fg2);line-height:1.6;cursor:default}
.pctx li b{color:#a8b5ee;font-weight:500}
.pctx li em{font-style:normal;color:var(--fg4);display:block;font-size:10.5px;margin-top:2px}
.pctx li.soft b{color:#8b7de8}
.pctx li.rel b{color:#7c86e8}
.pctx li.pick{cursor:pointer}
.pctx li.pick:hover{color:var(--fg)}
.pctx .none{font-size:11px;color:var(--fg4);line-height:1.75}

/* 列表栏里的路径入口（与概念行分开的类：.row 是概念/主题行，.prow 是路径行） */
.lp-sec{font-size:10.5px;color:var(--fg4);padding:9px 8px 4px;letter-spacing:.03em}
.prow{display:flex;align-items:center;gap:8px;height:auto;min-height:32px;padding:5px 8px;border-radius:6px;
  cursor:pointer;color:var(--fg2);font-size:12.5px;background:#101113;border:1px solid var(--line);margin:0 0 4px}
.prow:hover{border-color:var(--line2);color:var(--fg)}
.prow.on{border-color:#39406b;background:#14151a;color:var(--fg)}
.prow .rd{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--accent)}
.prow .rn{flex:1;line-height:1.4}
.prow .rn i{font-style:normal;display:block;font-size:10.5px;color:var(--fg4);margin-top:1px}
.prow .rm{font-size:11px;color:var(--fg4);white-space:nowrap}

/* 09-15 所有者：画布左上那块元信息小字（#hero-mini）「可有可无」→ 整块拿掉。
   同一批数字顶栏右侧那份（#main-meta）还在，信息没丢。 */

/* 详情栏：停靠在主区右侧，不再滑出全屏 */
#panel{position:absolute;top:0;right:0;bottom:0;width:412px;background:var(--panel);
  border-left:1px solid var(--line);padding:20px 20px 28px;z-index:6;overflow-y:auto;
  transform:translateX(6px);opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;
  scrollbar-width:thin}
#panel.on{transform:none;opacity:1;pointer-events:auto}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#232426;border-radius:4px}
#panel .close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:6px;
  background:none;border:0;color:var(--fg4);cursor:pointer;font-size:13px;line-height:1}
#panel .close:hover{background:#1a1b1e;color:var(--fg2)}
#panel .src{font-size:11px;color:var(--fg3);margin-bottom:9px;padding-right:32px;line-height:1.7}
#panel h2{font-size:19px;font-weight:550;line-height:1.35;margin-bottom:12px;letter-spacing:-.01em}
#panel .kbadge{display:inline-block;margin-left:8px;border:1px solid var(--line2);border-radius:5px;padding:1px 8px;font-size:10.5px;vertical-align:3px;font-weight:500}
.pbody-meta{display:none}
.proven{border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:9px 12px;font-size:12.5px;color:var(--fg2);margin:10px 0}
.proven b{color:var(--fg)}
.gloss{font-size:13px;line-height:1.85;color:var(--fg2);margin-bottom:20px}
#panel .deep{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 18px;background:#141518}
#panel .deep summary{cursor:pointer;font-size:11.5px;color:var(--fg4);outline:none}
#panel .deep h5{margin-top:12px}
#panel .deep .mut{font-size:12px;line-height:1.8;color:var(--fg3);white-space:pre-wrap}
#panel .deep ul{margin:6px 0 0;padding-left:16px}
#panel .deep li{font-size:12px;line-height:1.75;color:var(--fg3);margin:3px 0}
#nei-body .nm .tomap{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-align:left;border-bottom:1px dashed var(--line2)}
#nei-body .nm .tomap:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
#nei-body .nm .tomap i{font-style:normal;font-size:10.5px;color:var(--fg4);margin-left:4px}
#panel .metrics{display:flex;gap:20px;padding:12px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:18px}
#panel .m{flex:1}
#panel .m b{display:block;font-size:17px;font-weight:500;color:var(--fg);line-height:1.2}
#panel .m span{font-size:10.5px;color:var(--fg4)}
#panel h5{font-size:11px;color:var(--fg4);margin:18px 0 8px;font-weight:500}
#panel ul{list-style:none}
#panel li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);
  padding:5px 7px;border-radius:5px;cursor:pointer}
#panel li:hover{background:#161719;color:var(--fg)}
#panel li em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--fg4)}
.rel-list li{display:block;padding:7px;border:1px solid var(--line);margin:4px 0;background:#101113}
.rel-list li:hover{border-color:var(--line2)}
.rel-list .rel-name{display:flex;align-items:center;gap:6px;color:var(--fg2)}
.rel-list .rel-name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-list .rel-name i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.rel-list .rel-note{margin-top:3px;color:var(--fg4);font-size:10.5px;line-height:1.55}
.srclist{list-style:none;margin:6px 0 0;padding:0}
.srclist li{padding:7px 0;border-top:1px solid var(--line)}
.srclist li:first-child{border-top:0;padding-top:2px}
.srclist a{color:var(--accent2);text-decoration:none;font-size:12px;line-height:1.5}
.srclist a:hover{text-decoration:underline}
.srclist a i{font-style:normal;opacity:.7}
.srclist em{font-style:normal;color:var(--fg4);font-size:10.5px;margin-left:6px}
.srclist .sib{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.srclist .sib button{background:#17181b;border:1px solid var(--line2);border-radius:5px;color:var(--fg2);
  font-size:10.5px;padding:2px 7px;cursor:pointer;font-family:inherit}
.srclist .sib button:hover{border-color:var(--accent);color:var(--fg)}
.mut{color:var(--fg3);font-size:12px;line-height:1.8}
.markrow{display:flex;gap:6px;flex-wrap:wrap}
.mk{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11.5px;height:26px;padding:0 10px;cursor:pointer}
.mk:hover{background:#1d1e21;color:var(--fg)}
.mk.on{background:#20263f;border-color:#39406b;color:#b9c0f0}
.mk.quiet{color:var(--fg4)}

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

/* 倒逼区 */
.dpane{background:#101113;border:1px solid var(--line2);border-radius:8px;padding:13px 14px;margin:16px 0}
.dpane h5{margin:0 0 7px}
.dpane textarea{width:100%;min-height:84px;background:#0a0b0c;border:1px solid var(--line2);
  border-radius:6px;padding:9px 10px;color:var(--fg);font-size:12.5px;line-height:1.75;
  outline:none;font-family:inherit;resize:vertical;margin-top:8px}
.dpane textarea:focus{border-color:#3a4058}
.dpane.quiet{background:#131020;border-color:#2c2545}
.jrow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.jbtn{background:var(--accent);border:0;border-radius:6px;color:#fff;font-size:12px;height:28px;
  padding:0 13px;cursor:pointer;font-weight:500}
.jbtn:hover{background:var(--accent2)}
.jbtn.ghost{background:#17181b;border:1px solid var(--line2);color:var(--fg2);font-weight:400}
.jbtn.ghost:hover{background:#1d1e21;color:var(--fg)}
.jerr{font-size:11px;color:var(--warn)}
.jverdict{border-radius:7px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.75}
.jverdict.ok{background:#0e1a14;border:1px solid #2b4a37;color:#b6e3ca}
.jverdict.mech{background:#1c1810;border:1px solid #5c4a26;color:#e2cf9e}
.jverdict.bad{background:#1c1110;border:1px solid #5c2f2b;color:#efc3bf}
.jverdict.read{background:#151228;border:1px solid #3b3163;color:#c3b8ea}
.jmiss{margin-top:6px;font-size:12px}
.backto{margin-top:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.backto button{background:#241715;border:1px solid #57302a;border-radius:5px;color:#e8bdb6;
  font-size:11.5px;height:24px;padding:0 9px;cursor:pointer}
.backto button:hover{background:#2e1c19}
.nexthint{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;
  color:var(--fg3);line-height:2.1}

.keyrow{display:flex;gap:6px;margin:8px 0 4px}
.keyrow input{flex:1;background:#0a0b0c;border:1px solid var(--line2);border-radius:6px;
  padding:7px 10px;color:var(--fg);font-size:11.5px;outline:none;font-family:inherit;min-width:0}
.keyrow button{background:#17181b;border:1px solid var(--line2);border-radius:6px;color:var(--fg2);
  font-size:11px;padding:0 11px;cursor:pointer;white-space:nowrap}
.keyrow button:hover{background:#1d1e21;color:var(--fg)}
code{background:#161719;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--fg2)}


#tip{position:fixed;padding:6px 10px;background:#161719;border:1px solid var(--line2);
  border-radius:6px;font-size:11.5px;color:var(--fg);pointer-events:none;opacity:0;
  transition:opacity .1s;z-index:9;max-width:280px;line-height:1.6;
  box-shadow:0 8px 24px rgba(0,0,0,.32)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);
  color:var(--fg4);font-size:12.5px;z-index:20;transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#app{height:100vh}

.burger{display:none;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);
  border-radius:7px;background:#141518;color:var(--fg2);font-size:14px;cursor:pointer;flex:0 0 auto}
.burger:hover{color:var(--fg)}
@media (max-width:1100px){
  #app{grid-template-columns:1fr}
  #main{grid-column:1}
  #panel{width:100%}
  /* 左栏＝抽屉（v6-responsive）：旧写法直接 #list{display:none}，把主题列表/内参月历整块吞掉
     （审计实锤：375 下已选行宽 0、700–1100 的桌面小窗同样丢列表）。抽屉是唯一下档形态。 */
  #list{position:fixed;left:0;top:46px;bottom:0;width:min(320px,86vw);z-index:70;
    transform:translateX(-105%);transition:transform .26s ease}
  body.list-open #list{transform:none;box-shadow:14px 0 44px rgba(0,0,0,.5)}
  #list-backdrop{position:fixed;inset:46px 0 0 0;z-index:69;background:rgba(4,5,6,.55);
    opacity:0;pointer-events:none;transition:opacity .26s ease}
  body.list-open #list-backdrop{opacity:1;pointer-events:auto}
  .burger{display:flex}
  #topbar{gap:10px}
  .r-list{overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;-webkit-overflow-scrolling:touch}
  .r-list::-webkit-scrollbar{display:none}
}

/* ── 内参（第六格）：AI 内参图文格式的阅读区 ─────────────────────────
   主区原来只有画布。内参是「读」的界面，所以它盖在画布上，不影响图谱布局。 */
#reader{position:absolute;inset:0;z-index:18;background:var(--bg);overflow:auto;display:none}
/* 总图（全链路 Graph）：主区第五个视图。它读 /api/graph 的真实索引，不画静态示意图。 */
/* 学习空间里的链路条：读真实运行状态（GRAPH_RUNNER 的会话），不是页面的自我复述 */
.lg-trace{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 22px;
  border-bottom:1px solid var(--line);background:#0c0d0f;font-size:11.5px;color:var(--fg2)}
.lg-trace .lgk{color:var(--fg4)}
.lg-trace .lgv{color:var(--fg2)}
.lg-trace .lgv.mut{color:var(--fg4)}
#graphview{position:absolute;inset:0;z-index:16;background:var(--bg);overflow:auto;display:none;padding:56px 0 0}
#graphview.on{display:block}
#graphview .gv-host{min-height:100%}
#graphview .gv-load,#graphview .gv-err{padding:28px 20px;color:var(--fg3);font-size:12.5px;line-height:1.9}
#graphview .gv-err b{color:var(--fg)}
#graphview .gv-err code{background:#141517;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg2)}
#graphview .gv-note{color:var(--fg4)}
#main.graphon #c,#main.graphon #pathrail{display:none}
#reader.on{display:block}
.nei{max-width:768px;margin:0 auto;padding:20px 30px 90px}
/* 实践空间的状态看板是四列表格（单元｜链路就绪度｜结论｜缺什么），768px 会把「结论」挤出屏幕，
   所以只给实践空间这一处放宽到 1100（正文流那套排版一个字没动）。 */
.nei.practice{max-width:1100px}
.pboard-wrap{overflow-x:auto}
.nei-crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg3)}
.nei-crumb b{color:var(--fg2);font-weight:500}
.nei-crumb .sp{flex:1}
/* 内参 · 上方日期条 ＋ 中间「内参日报集合」（2026-09-14 加） */
.nei-dates{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 0 12px;margin:-20px 0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.nei-dates .sep{width:1px;height:16px;background:var(--line);margin:0 2px}
.nei-when{color:var(--fg2);font-size:12px}
.nei-home{border:1px solid var(--line);background:var(--panel2);border-radius:7px;color:var(--fg2);
  font-size:12px;padding:4px 10px;cursor:pointer}
.nei-home:hover{color:var(--fg);border-color:var(--accent2)}
/* 月历（2026-09-14 第二版）：有内参的日子暖色点亮，选中的一天 accent，没内参的灰掉 */
/* 侧栏住在中间那一栏（#list）里：宽度跟着栏宽走，不再是自己一列 */
.nei-side{padding:10px 10px 14px}
.nei-side .nei-cal{width:100%}
.lp-body .nei-facets{margin:10px 0 0}
/* 分类 / 标签 / 策展：三组可折叠筛选（Reader 侧栏的顺序） */
.nei-facets{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:4px 10px 8px}
.nei-facets .fhead{font-size:10.5px;color:var(--fg4);padding:7px 2px 6px;border-bottom:1px solid var(--line)}
.nei-facets .fhead b{color:var(--accent2)}
.nei-facets .fclear{margin-left:6px;border:1px solid var(--line);background:none;color:var(--fg2);
  border-radius:6px;font-size:10.5px;padding:1px 6px;cursor:pointer}
.nei-facets .fclear:hover{color:var(--fg);border-color:var(--accent2)}
.nei-facets .fg{border-top:1px solid var(--line)}
.nei-facets .fg:first-of-type{border-top:0}
.nei-facets .fh{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;
  color:var(--fg);font:inherit;font-size:12px;font-weight:600;padding:8px 2px;cursor:pointer}
.nei-facets .fh i{font-style:normal;color:var(--fg3);font-size:10px;width:9px}
.nei-facets .fh:hover{color:var(--accent2)}
.nei-facets .fb{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 9px}
.nei-facets .fchip{border:1px solid var(--line);background:none;color:var(--fg3);border-radius:999px;
  font-size:10.5px;padding:2px 8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nei-facets .fchip:hover{border-color:var(--line2);color:var(--fg)}
.nei-facets .fchip.on{border-color:var(--accent2);background:#241d20;color:var(--accent2)}
.nei-cal{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px 11px 9px}
.nei-cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.nei-cal .ch b{font-size:12.5px;font-weight:600;color:var(--fg)}
.nei-cal .ch button{border:0;background:none;color:var(--fg2);font-size:15px;line-height:1;cursor:pointer;
  padding:2px 9px;border-radius:6px}
.nei-cal .ch button:hover{background:#1b1d22;color:var(--fg)}
.nei-cal .cw{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;
  color:var(--fg4);font-size:10.5px;margin-bottom:4px}
.nei-cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.nei-cal .cd{height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;
  border-radius:7px;background:none;color:var(--fg4);font:inherit;font-size:12px;padding:0}
.nei-cal .cd.has{background:#2b2317;border-color:#4b3a20;color:#e2bd8c;font-weight:600;cursor:pointer}
.nei-cal .cd.has:hover{border-color:var(--accent2);color:#fff}
.nei-cal .cd.has.on{background:var(--accent2);border-color:var(--accent2);color:#1a1310}
.nei-cal .cd.today{box-shadow:0 0 0 1px #6d5c3c inset}
.nei-cal .cf{display:flex;flex-direction:column;align-items:stretch;gap:3px;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--line)}
.nei-cal .allbtn{border:1px solid var(--line);background:none;color:var(--fg2);border-radius:7px;
  font-size:11px;padding:3px 8px;cursor:pointer}
.nei-cal .allbtn.on{border-color:var(--accent2);color:var(--accent2)}
.nei-cal .hint{color:var(--fg4);font-size:10.5px;text-align:left;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nei-day .ih-nav{border:0;background:none;color:var(--fg3);font-size:14px;line-height:1;cursor:pointer;border-radius:5px;padding:1px 6px}
.nei-day .ih-nav:hover{background:#1b1d22;color:var(--fg)}
.nei-day .ih-nav:disabled{opacity:.28;cursor:default;background:none;color:var(--fg4)}
.pr-fit{float:right;border:1px solid var(--line);background:#141518;color:var(--fg3);font-size:10.5px;
  border-radius:6px;padding:1px 8px;cursor:pointer}
.pr-fit:hover{color:var(--fg);border-color:#5e6ad2}
/* ── 顶栏「更新」面板（v4-unify）：隐性 changelog ── */
.upd-btn{border:0;background:none;color:var(--fg4);font-size:11px;cursor:pointer;white-space:nowrap;padding:2px 4px}
.upd-btn:hover{color:var(--fg)}
#upd-panel{position:fixed;top:46px;right:10px;width:340px;max-height:70vh;overflow:auto;z-index:80;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:12px}
#upd-panel h4{margin:0 0 8px;font-size:12.5px;color:var(--fg)}
#upd-panel .u-item{margin:0 0 10px}
#upd-panel .u-item b{color:var(--fg)}
#upd-panel .u-item .u-date{color:var(--fg4);font-size:10.5px;margin-left:6px}
#upd-panel .u-item p{margin:2px 0 0;color:var(--fg3);font-size:11.5px;line-height:1.6}
#upd-panel .u-sys{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
#upd-panel .u-sys a,#upd-panel .u-sys button{background:none;border:0;color:var(--fg4);font-size:11px;cursor:pointer;padding:0}
#upd-panel .u-sys .u-repo{color:var(--fg4);font-size:10.5px;display:block;margin-top:2px}
/* ── 探索 / AI 内嵌首页（v4-unify）：三步引导 + 模块卡 ── */
.explore{min-height:100%;padding:46px 40px 60px;max-width:880px;margin:0 auto}
.exp-onboard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78vh;gap:16px}
.exo-card{width:460px;max-width:92vw;background:var(--panel2);border:1px solid var(--line);border-radius:16px;
  padding:34px 36px 26px;text-align:center}
.exo-ico{width:54px;height:54px;margin:0 auto 14px;border-radius:14px;background:#17181d;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:#c3caff}
.exo-card h3{margin:0 0 4px;font-size:19px;color:var(--fg)}
.exo-title{font-size:13px;color:#c3caff;margin-bottom:12px}
.exo-card p{margin:0 0 18px;font-size:12.5px;color:var(--fg3);line-height:1.9}
.exo-dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.exo-dots i{width:7px;height:7px;border-radius:50%;background:#2a2c33}
.exo-dots i.on{background:#c3caff}
.exo-acts{display:flex;justify-content:center;gap:10px}
.exo-acts button{border-radius:8px;padding:7px 20px;font-size:12.5px;cursor:pointer}
.exo-ghost{border:0;background:none;color:var(--fg4)}
.exo-ghost:hover{color:var(--fg)}
.exo-next{border:0;background:#5e6ad2;color:#fff;font-weight:600}
.exo-next:hover{background:#6f7be0}
.exo-note{font-size:11px;color:var(--fg4)}
.exp-home .exp-hero{margin:8px 0 22px}
.exp-starlink{position:relative;overflow:hidden;background:radial-gradient(circle at 75% 20%,rgba(95,104,223,.18),transparent 38%)}.exp-starlink .exp-kicker{color:#aab0ff;font-size:13px;letter-spacing:.08em;margin-bottom:12px}.exp-starlink .exp-orbit{position:absolute;inset:-35%;pointer-events:none;opacity:.65}.exp-starlink .exp-orbit:before,.exp-starlink .exp-orbit:after,.exp-starlink .exp-orbit i{content:"";position:absolute;border:1px solid rgba(112,120,235,.16);border-radius:50%;inset:15%;transform:rotate(22deg)}.exp-starlink .exp-orbit:after{inset:27%;transform:rotate(-38deg)}.exp-starlink .exp-orbit i{inset:auto;width:7px;height:7px;background:#7882ff;border:0;top:30%;left:66%;box-shadow:0 0 18px #7882ff}.exp-starlink .exp-hero,.exp-starlink .exp-question,.exp-starlink .exp-mods,.exp-starlink .exp-note{position:relative;z-index:1}
.starlink-home-frame{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0;background:#000}.exp-overlay{position:relative;z-index:2;pointer-events:none}.exp-overlay>*{pointer-events:auto}.starlink-frame-note{position:absolute;z-index:3;right:18px;bottom:12px;color:#888;font-size:11px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px}.app-explore #topbar,.app-explore #list,.app-explore #list-backdrop{display:none}.app-explore #main{position:fixed;inset:0}.app-explore #reader{height:100vh}.app-explore .explore{max-width:none;padding:0;height:100vh}.app-explore .starlink-home-frame{position:fixed}.app-explore .exp-overlay{padding:9vh 7vw}
.app-explore .exp-overlay .exp-hero,.app-explore .exp-overlay .exp-question,.app-explore .exp-overlay .exp-note{display:none}.app-explore .exp-overlay .exp-mods{position:fixed;top:18vh;right:5vw;width:min(420px,38vw);grid-template-columns:1fr;gap:10px}.app-explore .exp-overlay .exp-mod{background:rgba(10,11,16,.78);backdrop-filter:blur(8px)}
.exp-question{display:flex;gap:8px;margin:0 0 22px;max-width:640px}.exp-question input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--fg);font:inherit}.exp-question button{border:0;border-radius:9px;padding:0 16px;background:#5e6ad2;color:#fff;cursor:pointer}
.route-crosswalk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0;color:#aeb4ff;font-size:12px}.route-crosswalk-grid span{border:1px solid #2b2f4d;border-radius:8px;padding:8px 10px;background:#11131c}
.exp-hero h2{margin:0 0 8px;font-size:24px;color:var(--fg)}
.exp-hero p{margin:0;font-size:13px;color:var(--fg3);line-height:1.9;max-width:640px}
.exp-mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.exp-mod{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:20px 18px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.exp-mod:hover{border-color:#5e6ad2}
.exp-mod .em-ico{width:38px;height:38px;border-radius:10px;background:#17181d;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#c3caff;margin-bottom:4px}
.exp-mod b{color:var(--fg);font-size:14px}
.exp-mod span{color:var(--fg3);font-size:11.5px;line-height:1.6}
.exp-note{margin-top:18px;font-size:11px;color:var(--fg4)}
.nei-topside{flex:1;min-width:220px;padding-top:2px}
.nei-topside-n{color:var(--fg3);font-size:12px;margin-top:10px}
.nei-back{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.nei-back button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;color:var(--fg2);
  font-size:12px;padding:4px 10px;cursor:pointer}
.nei-back button:hover{color:var(--fg);border-color:var(--line2)}
.nei-back .mut{color:var(--fg3);font-size:11.5px}
.nei-homehint{color:var(--fg3);font-size:12px;margin:10px 0 16px;line-height:1.7}
.nei-day{border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin:0 0 16px;overflow:hidden}
.nei-day .dh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--fg3)}
.nei-day .dh b{color:var(--fg);font-size:13px}
.nei-day .dh .sp{flex:1}
.nei-day .dl{display:flex;flex-direction:column}
.drow{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:11px 14px;color:var(--fg);cursor:pointer;font:inherit}
.drow:first-child{border-top:0}
.drow:hover{background:#1b1d22}
.drow .no{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--accent2);flex:none;padding-top:2px}
.drow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drow .tt b{font-size:13px;font-weight:600}
.drow .tt i{font-style:normal;color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .tt em{font-style:normal;color:var(--fg2);font-size:12px;line-height:1.65;margin-top:3px}
.drow .st{color:#f2c94c;font-size:11px;flex:none;letter-spacing:1px;padding-top:2px}
.drow .go{color:var(--fg4);font-size:11px;flex:none;padding-top:2px}
.drow:hover .go{color:var(--accent2)}
.nei-day .dfoot{padding:9px 14px;border-top:1px solid var(--line);color:var(--fg4);font-size:11px;line-height:1.6}
.nei-title{font-size:26px;line-height:1.3;font-weight:600;margin:12px 0 10px;letter-spacing:-.01em}
.nei-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--fg2);font-size:12.5px}
.nei-meta .stars{color:#f2c94c;letter-spacing:1.5px}
.nei-meta .tag{border:1px solid var(--line2);border-radius:5px;padding:1px 7px;color:var(--fg2);font-size:11.5px}
.nei-meta .why{color:var(--fg4)}
.nei-hero{margin:16px 0 8px;border-radius:9px;overflow:hidden;border:1px solid var(--line);height:296px}
.nei-hero svg{display:block;width:100%;height:100%}
.nei-cap{color:var(--fg3);font-size:11.5px}
.nei-card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px 14px;margin:14px 0}
.nei-card h5{margin-bottom:6px}
.nei-card p{color:var(--fg2);line-height:1.7}
.nei-link{margin:14px 0 0;font-size:12.5px;color:var(--fg2)}
.nei-link a{color:var(--accent2);text-decoration:none}
.nei-link a:hover{text-decoration:underline}
.nei-tabs{display:flex;gap:2px;margin:20px 0 0;border-bottom:1px solid var(--line)}
.nei-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);
  font-size:12.5px;padding:8px 11px;cursor:pointer;margin-bottom:-1px}
.nei-tabs button:hover{color:var(--fg)}
.nei-tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.nei-body{padding-top:14px;font-size:13.5px;line-height:1.78}
.nei-body h2,.nei-body h3{font-size:15px;margin:20px 0 8px;color:var(--fg)}
.nei-body h4,.nei-body h5,.nei-body h6{font-size:13px;margin:16px 0 6px;color:var(--fg2)}
.nei-body p{margin:8px 0}
.nei-body ul{margin:6px 0 10px 18px}
.nei-body li{margin:3px 0}
.nei-body li.s{margin-left:14px;color:var(--fg2)}
.nei-body blockquote{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:8px 0;color:var(--fg2)}
.nei-body hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.nei-body code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.nei-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;overflow:auto;margin:10px 0}
.nei-body pre code{border:0;background:none;padding:0}
.concept{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:12px 0;background:var(--panel2)}
.concept .nm{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.concept .q{border-left:2px solid var(--line2);padding-left:10px;color:var(--fg2);margin:7px 0;font-size:12.5px;line-height:1.7}
.concept .fy{margin-top:9px;font-size:13px;line-height:1.75}
.concept .fy i{color:var(--accent2);font-style:normal;font-size:11.5px;margin-right:6px}
.concept .also{margin-top:9px;font-size:11.5px;color:var(--fg3);line-height:1.9}
.concept .also .chip{background:none;border:1px solid var(--line2);border-radius:999px;color:var(--fg3);font:inherit;font-size:11px;padding:1px 8px;margin-right:6px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.concept .also .chip:hover{color:var(--accent2);border-color:var(--accent2)}
/* ── 概念网络图（concept-net-view.js · 2026-09-15）──
   结构：.cn-fig > .cn-head + .cn-canvas(svg) + .cn-legend + .cn-detail。
   颜色基调跟层走（层色由渲染器内联），这里只管边/标签/文本/交互态。 */
.cn-fig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px 16px 10px;margin:14px 0}
.cn-head{font-size:13px;font-weight:600;margin-bottom:6px}
.cn-head .cn-eq{margin-left:10px;color:var(--fg3);font-weight:400;font-size:11.5px}
.cn-canvas{overflow:auto;border-radius:8px}
.cn-svg{display:block;min-width:100%}
.cn-layer{font-size:11px;font-weight:700;fill:var(--fg2)}
.cn-edge{stroke:#3a3d44;stroke-width:1.4}
.cn-elabel rect{fill:#0b0c0d;stroke:var(--line)}
.cn-elabel text{font-size:10.5px;fill:var(--fg2)}
.cn-elabel-warn text{fill:#e0a94a}
.cn-node{cursor:pointer}
.cn-node text{font-size:12px;fill:var(--fg);pointer-events:none}
.cn-node.cn-core text{font-weight:700}
.cn-fig.cn-focusing .cn-edge,.cn-fig.cn-focusing .cn-elabel{opacity:.16}
.cn-fig.cn-focusing .cn-edge.cn-hot,.cn-fig.cn-focusing .cn-elabel.cn-hot{opacity:1}
.cn-edge.cn-hot{stroke:#e07a2f;stroke-width:2}
.cn-elabel.cn-hot rect{stroke:#e07a2f}
.cn-node.cn-dim{opacity:.22}
.cn-legend{font-size:11.5px;color:var(--fg3);margin-top:8px}
.cn-legend b{color:var(--fg2)}
.cn-sep{margin:0 6px}
.cn-warn{color:#e0a94a}
.cn-detail{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.cn-dt-h{font-weight:700;font-size:13px;margin-bottom:6px}
.cn-dt-e{margin:8px 0;font-size:12.5px;line-height:1.7}
.cn-dt-e b{color:var(--fg)}
.cn-q{color:var(--fg2);border-left:2px solid var(--line2);padding-left:10px;margin-top:4px}
.cn-src{color:var(--fg3);font-size:11px;margin-left:8px}
.cn-sent{color:var(--fg3);font-size:11.5px;margin-top:3px}
.cn-jump{margin-top:8px;border:1px solid var(--line2);border-radius:7px;background:none;color:var(--accent2);font-size:12px;padding:4px 10px;cursor:pointer}
.cn-mut{color:var(--fg3);font-size:12px}
.cn-empty{color:var(--fg3);font-size:12.5px;padding:8px 0}
.concept.cn-card-hit{border-color:#e07a2f}
.fybox{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
.fybox .k{font-size:11.5px;color:var(--accent2);margin-bottom:7px}
.fybox .mut{color:var(--fg3);font-size:11.5px;margin-bottom:8px}
.fybox ul{margin:6px 0 0 18px}
.fybox li{margin:4px 0;line-height:1.7}
.fybox li b{color:var(--fg)}
.nei-foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:var(--fg3);font-size:11.5px}
.case-mvp{border:1px solid #d9c8a6;border-radius:9px;padding:13px 14px;margin:14px 0;background:#fffaf0}
.case-mvp h4{margin:0 0 6px;color:#8a5a13}.case-mvp .case-meta{font-size:11px;color:var(--fg3);margin-bottom:10px}
.case-mvp .case-option{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px;margin:7px 0;color:var(--fg);cursor:pointer}
.case-mvp .case-option:hover{border-color:#d9a84e}.case-mvp .case-option.ok{border-color:#4cb782;background:#f0faf5}.case-mvp .case-option.bad{border-color:#d99a9a;background:#fff5f5}
.case-mvp .case-result{margin-top:10px;line-height:1.65;font-size:12px}.case-mvp .case-back{margin-bottom:10px}
.practice-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel2);margin:12px 0}.practice-card h2{margin:0 0 6px}.practice-card .mut{margin:6px 0 12px}
/* ── 实践空间（第一版＝六章阅读器 ＋ 第二层状态看板）────────────────────
   阅读器本身不新造视觉：点「进入阅读」走的就是 #learn 那套正文流排版。
   这里只加两块自己的东西：① 单元行与四段就绪度；② 状态看板的表与筛选。 */
.pcard{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:14px 16px;margin:12px 0}
.pcard h2{margin:0 0 6px;font-size:16px}
.pcard h3{margin:14px 0 6px;font-size:13px;color:var(--fg3);font-weight:600}
.pcard .mut{color:var(--fg2);font-size:12.5px;line-height:1.75;margin:6px 0}
.pu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:9px 0}
.pu.first{border-top:0}
.pu .nm{font-weight:600;font-size:13px;color:var(--fg)}
.pu .meta{color:var(--fg3);font-size:11.5px}
.pu .sp{flex:1}
/* 七站路线行（v2-practice-space）：独立 .ru 类，不用 .pu——「.pu 一行=六章/单篇」的断言口径保持成立 */
.ru{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:7px 0 7px 12px}
.ru .nm{font-weight:600;font-size:12.5px;color:var(--fg)}
.ru .meta{color:var(--fg3);font-size:11px}
.ru .sp{flex:1}
.ru.anchor{opacity:.72}
.ru.cur,.pu.cur{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.cur-tag{display:inline-block;margin-left:6px;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:0 6px;font-size:10.5px;vertical-align:1px}
/* 七站铺开（phase 05）：每站一节，步骤卡片网格 */
.proute{padding:16px 18px}
.rstation-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.rs-no{font-size:34px;font-weight:700;color:var(--accent);line-height:1;min-width:46px}
.rs-main{flex:1}
.rs-title{font-size:17px;font-weight:700;color:var(--fg)}
.rs-q{font-size:13px;color:var(--fg2);margin-top:3px}
.rs-n{font-size:12px;color:var(--fg3);white-space:nowrap}
.rugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.rucard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rucard.cur{outline:2px solid var(--accent);outline-offset:1px}
.rucard.rsup{border-style:dashed;opacity:.75}
.ru-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ru-top b{font-size:13px;color:var(--fg)}
.rutag{font-size:10.5px;color:var(--fg3);border:1px solid var(--line2);border-radius:5px;padding:0 6px;white-space:nowrap}
.ru-line{font-size:12px;color:var(--fg2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.ru-act{display:flex;justify-content:flex-end}
/* 概念全书（v5-plain-open phase 02） */
.bk-bar{display:flex;gap:8px;margin:10px 0}
.bk-bar input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--fg);padding:7px 10px;font-family:inherit;font-size:12.5px}
.bk-bar select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--fg);padding:7px 8px;font-family:inherit;font-size:12px}
.bk-list{display:flex;flex-direction:column}
.bk-item{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer}
.bk-item:hover{background:var(--panel2)}
.bk-item b{font-size:13px;color:var(--fg);white-space:nowrap}
.bk-item span{flex:1;color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-item em{font-size:10.5px;color:var(--accent);font-style:normal;white-space:nowrap}
.rstation{margin:12px 0 2px;font-size:13px;color:var(--fg)}
.rstation .mut{margin:0 0 2px}
.rdraft{display:inline-block;border:1px dashed #8a6d1a;color:#c9a227;border-radius:6px;padding:1px 8px;font-size:11px;vertical-align:2px;margin-left:6px}
details.pfold{padding:10px 16px}
details.pfold summary{cursor:pointer;font-size:14px;color:var(--fg)}
.pbtn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.pbtn:hover{background:var(--accent2);border-color:var(--accent2)}
.pbtn.ghost{background:none;color:var(--fg2);border-color:var(--line2)}
.pbtn.ghost:hover{border-color:var(--accent2);color:var(--fg)}
.pbtn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--fg3);margin:1px 4px 1px 0;white-space:nowrap}
.seg b{font-weight:500;color:var(--fg2)}
.seg.green{border-color:#2c5a42;color:#7fd0a6}.seg.green b{color:#7fd0a6}
.seg.missing{border-color:#5a4a24;color:#e0a94a}.seg.missing b{color:#e0a94a}
.seg.unassembled{border-color:#5a2c2c;color:#eb5757}.seg.unassembled b{color:#eb5757}
.seg.blocked{border-color:#3a3d42;color:var(--fg3)}
.pboard{width:100%;border-collapse:collapse;font-size:12px}
.pboard th{text-align:left;color:var(--fg3);font-weight:500;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line)}
.pboard td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--fg2);line-height:1.6}
.pboard td.nm{color:var(--fg);font-weight:600;white-space:nowrap}
.pboard td.verdict{white-space:nowrap}
.pboard td.segs .seg{margin:1px 2px 1px 0}
.pboard tr.off td.nm{color:var(--fg2);font-weight:500}
.pfilter{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.pfilter button{border:1px solid var(--line2);background:none;color:var(--fg2);border-radius:6px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.pfilter button.on{border-color:var(--accent2);color:var(--fg)}
.pwhy{color:var(--fg3);font-size:11px;line-height:1.6}
.pnote{border-left:2px solid var(--line2);padding-left:9px;color:var(--fg3);font-size:11.5px;line-height:1.7;margin:6px 0}

/* ── 内参文章 · 阅读中的即时费曼（Issue 2 · B 层试点 agent-skills-api）──────
   位置固定在「阅读梯度」之后、「决策题」之前：读完就讲，不必先答决策题。
   即时反馈与章末验收分开存（zss135.neican.feynman.v1 ≠ zss135.learn.v1）。 */
.nfx{border:1px solid #2b3350;border-radius:11px;background:linear-gradient(180deg,#0f1219,#0c0e13);padding:15px 16px;margin:18px 0}
.nfx-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.nfx-h b{font-size:14px}.nfx-h span{color:var(--fg3);font-size:11.5px}
.nfx textarea{width:100%;min-height:104px;margin-top:8px;padding:10px 12px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:8px;color:var(--fg);font-family:inherit;font-size:13px;line-height:1.7;resize:vertical}
.nfx textarea:focus{outline:none;border-color:var(--accent)}
.nfx textarea:disabled{opacity:.6}
.nfx-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.nfx-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;
  padding:6px 14px;font-size:12.5px;cursor:pointer}
.nfx-btn:hover{background:var(--accent2);border-color:var(--accent2)}
.nfx-btn:disabled{opacity:.5;cursor:default}
.nfx-res{margin-top:12px;border-top:1px solid var(--line);padding-top:11px;font-size:12.5px;line-height:1.7;color:var(--fg2)}
.nfx-res.nj{border-top-color:#5a4a24}
.nfx-res.ok{border-top-color:#2c5a42}
.nfx-k{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:5px}
.nfx-k.ok{color:#7fd0a6}.nfx-k.nj{color:#e0a94a}
.nfx-status{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 9px}
.nfx-st{border:1px solid var(--line2);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--fg3)}
.nfx-st.met{border-color:#2c5a42;color:#7fd0a6}
.nfx-st.partial,.nfx-st.missing{border-color:#5a4a24;color:#e0a94a}
.nfx-st.contradicted{border-color:#5a2c2c;color:#eb5757}
.nfx-st.uncertain{border-color:#2b3350;color:#8f9bd8}
.nfx-focus{border:1px solid #2b3350;border-radius:9px;background:#0d1016;padding:12px 13px;margin:8px 0 4px}
.nfx-fh{font-size:13px;color:var(--fg);margin-bottom:6px}
.nfx-fh b{color:var(--accent2)}
.nfx-fh span{color:var(--fg2);font-weight:400}
.nfx-mi,.nfx-act,.nfx-clarify{margin:6px 0;line-height:1.7}
.nfx-mi b,.nfx-act b{display:inline-block;min-width:74px;color:var(--fg3);font-weight:500;font-size:11.5px}
.nfx-clarify{border-left:2px solid #2b3350;padding-left:10px;color:#8f9bd8}
.nfx-mat{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2)}
.nfx-go{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;color:var(--accent2);
  padding:2px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.nfx-go:hover{border-color:var(--accent2)}
.nfx-go i{font-style:normal;opacity:.7}
.nfx-quote{margin-top:6px;color:var(--fg3);font-size:11.5px;line-height:1.65;border-left:2px solid var(--line2);padding-left:9px}
.nfx-q{margin-top:9px;color:var(--fg2)}
.nfx-q b{display:inline-block;min-width:74px;color:var(--fg3);font-weight:500;font-size:11.5px}
.nfx-fold{border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin:12px 0;padding:10px 13px}
.nfx-fold>summary{cursor:pointer;color:var(--fg2);font-size:12.5px;list-style:none}
.nfx-fold>summary::-webkit-details-marker{display:none}
.nfx-fold>summary::before{content:'▸ ';color:var(--fg3)}
.nfx-fold[open]>summary::before{content:'▾ '}
.nfx-fold>summary:hover{color:var(--fg)}
.nfx-hit{border-color:var(--accent2)!important;box-shadow:0 0 0 2px rgba(124,134,232,.22)}

/* ── 独立学习空间（Agent Loop 六章）─────────────────────────────
   进入时 body 加 .learning：左栏导航、主题列表、画布全部 display:none——
   「隐藏全量图谱和主题列表」是 DOM 层面的事实，不是视觉遮挡。 */
body.learning #topbar,body.learning #list,body.learning #main{display:none}
#learn{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto}
#learn.on{display:block}
#learn-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;

<script>
const DATA = /*__DATA__*/;

/* ── 常量 ───────────────────────────────────────────── */
let   LEVEL_GAP = 88;      // 每层高度（boot 时按层数自适应）
const REPULSE   = 1650;    // 斥力
const SPRING    = 0.055;   // 边引力
const YSPRING   = 0.15;    // 层弹簧
const DAMP      = 0.86;
const ITERS     = 260;

const nodes = DATA.nodes, edges = DATA.edges, relations = DATA.relations || [], sources = DATA.sources, meta = DATA.meta;
const articles = DATA.articles || [];   // 来源索引：65 篇原文 ＋ 229 个 Notion 页（cm-wire 生成，节点用 n.sa 指过来）
const relationStats = DATA.relationStats || { visible: relations.length, hidden: 0, byKind: {} };
/* 依赖边的强度与理由（v3-knowledge-tree）：build-shell 从概念地图 dependencies.json 装进来，
   键＝"topicId>prerequisiteId"（**依赖方>前置**：谁依赖它，谁是前置）。概念卡「先懂这些」
   （当前卡是依赖方：查 id>x）与「懂了它才能懂这些」（对方是依赖方：查 x>id）用它给每条双链
   带 hard/soft＋理由（os-taxonomy 边口径；与路径视图 mapHard/mapSoft 同源）。 */
const edgeMeta = DATA.edgeMeta || {};
function edgeNote(fromId, toId) {
  const e = edgeMeta[fromId + '>' + toId];
  if (!e) return '';
  const s = e.s === 'hard' ? ' · 强' : e.s === 'soft' ? ' · 弱' : '';
  const r = e.r ? ' — ' + String(e.r).slice(0, 60) + (String(e.r).length > 60 ? '…' : '') : '';
  return s + r;
}
// 主题层：21 条主题线（知识体系现在只有这一个分组轴）
const CUR = DATA.curation || { tags: [], assign: {}, collections: [] };
// 内参一栏：AI 内参图文格式（主题 / 重要等级 / 地址 / 配图 / 原文子链接 / 简介 / 入选理由 / 三产物）
/* 内参 = **多期集合**：knowledge/内参-<期>/内参-页面数据.json 全部装进 DATA.neican.issues（新 → 旧）。
   NEI_ALL 是全部期；NEI() 是当前选中那一期（日期条切换）；neiScreen：home=日报集合 / article=单篇阅读。 */
const NEI_ALL = (() => {
  const n = DATA.neican || {};
  const list = Array.isArray(n.issues) && n.issues.length ? n.issues.slice() : (n.articles ? [n] : []);
  return list.sort((a, b) => String(b.period).localeCompare(String(a.period)));
})();
const NEI_TOTAL = NEI_ALL.reduce((s, i) => s + ((i.articles || []).length), 0);
/* 概念网络图（2026-09-15）：DATA.conceptNet.nets[<unitId>]。
   unitId：route-agent-loop（六章路线一张图）· neican-<期>-<slug>（内参单篇）。
   数据由 build-concept-net.mjs 产出、check-concept-net.mjs 体检（R1—R8：只有带逐字原文的边才进图），
   视图是 scripts/lib/concept-net-view.js（build-shell 内联 → window.CONCEPT_NET）。
   找不到数据的单元不硬造图，照实显示「还没有生成」。 */
const CN_NETS = (DATA.conceptNet || {}).nets || {};
function mountConceptNet(root) {
  if (!window.CONCEPT_NET) return;
  (root || document).querySelectorAll('.cn-host[data-unit]').forEach((h) => {
    if (h.dataset.cnMounted === '1') return;          // 重渲染会重建节点，防的是同一节点挂两次
    const net = CN_NETS[h.getAttribute('data-unit')];
    if (!net) { h.innerHTML = '<div class="cn-empty">这张概念网络图还没有生成（跑 node scripts/build-concept-net.mjs）。</div>'; return; }
    h.dataset.cnMounted = '1';
    const hi = h.getAttribute('data-hi');
    window.CONCEPT_NET.mount(h, net, hi ? { highlightLayer: hi } : {});
  });
}
/* 默认 = 「全部」：中间那一栏是**日报集合**（按期倒序的每日日报），日期条用来收窄到某一天。
   起因（2026-09-14 所有者口径）：「中间的阅读位置替换为内参日报集合」——落地时中间必须是集合本身。 */
let neiPeriod = '';
let neiScreen = 'home';
let neiCalYM = '';          // 月历显示的月份（YYYY-MM）；默认落在最新一期那个月
/* 日报集合的筛选：分类（条目类型）/ 策展（重要等级）。
   2026-09-14 所有者：「标签我不知道，分类吧」——「标签」那一组（当时接来源域名）**撤掉**，
   只留分类与策展；左栏搜索框仍然管这一栏。 */
let neiFilt = { tag: '', star: 0 };
let neiFold = { tag: true, star: false };
/* 一级 tab 各自保存搜索词；知识体系的 graph/theme 共用一个“知识体系”范围，
   探索、内参、实践空间互不读取它。切 tab 不再把上一个页面的词带进来。 */
const viewQueries = { explore: '', neican: '', knowledge: '', practice: '' };
function queryScope(v = currentView) { return (v === 'graph' || v === 'theme') ? 'knowledge' : v; }
function activeQuery(v = currentView) { return String(viewQueries[queryScope(v)] || '').trim().toLowerCase(); }
function syncQueryInput() {
  const input = document.getElementById('q-filter');
  if (input) input.value = viewQueries[queryScope()] || '';
}
function saveQueryInput() {
  const input = document.getElementById('q-filter');
  if (input) viewQueries[queryScope()] = String(input.value || '').trim();
}
const neiQ = () => activeQuery('neican');
const neiPass = (a) => {
  const q = neiQ();
  return (!neiFilt.tag || ((a.tag || a.topic || '文章')) === neiFilt.tag)
    && (!neiFilt.star || (a.stars || 0) >= neiFilt.star)
    && (!q || (String(a.title || '') + String(a.topic || '') + String(a.author || '')).toLowerCase().includes(q));  // 左栏搜索框也管这里
};
const neiFiltOn = () => !!(neiFilt.tag || neiFilt.star);
const NEI = () => NEI_ALL.find(i => i.period === neiPeriod) || NEI_ALL[0] || { articles: [] };
const issueOfArticle = slug => NEI_ALL.find(i => (i.articles || []).some(a => a.slug === slug)) || NEI_ALL[0] || null;
/* 路线层（09-13 加）：人工策展的前置路径，**独立于概念图谱**——顺序不写回
   topics.json / dependencies.json，图谱继续只管节点与关系（PLAN §7 / HANDOFF §六）。
   配置在 evidence/paths-260913/routes.json；cm-wire 已把真实概念名、真实 hard/soft 前置理由、
   真实相关关系解析好了，这里只渲染，不自己判定谁是谁的前置。 */
const ROUTES = (DATA.routes && DATA.routes.routes) || [];

/* ── 验收方式分类 ─────────────────────────────────────────────
   不问「这讲的是什么」（那是主题，任何模型都能吐），问
   「**这个概念该要求学习者做到什么，才算学会了**」。
   它决定的不只是分列，而是**系统对你做什么**：
     compute 能算的 → 复述机制
     judge   能判的 → 说出你自己的判据与代价
     use     能用的 → 给一个你真用过的例子
     accept  只能认的 → **不设验收**。世界观没有机制可复述，硬考就是假学习。
   这正是原版的真 bug：194 个概念用了同一个验收标准，把世界观也拉来考。 */
const KIND = {
  compute: { name: '能算的', color: '#5B8FF9',
    ask: '遮住上面那句，用自己的话说清它的机制。',
    rule: '判定口径：说清核心机制、不违反事实 → pass；漏机制、说错、照抄原文 → fail。' },
  judge:   { name: '能判的', color: '#F6BD16',
    ask: '遮住上面那句：它给的是什么判据？换成你的处境你会怎么用？代价是什么？',
    rule: '判定口径：必须写出**你自己的判据和你愿意付的代价**。只复述原文 → fail；'
        + '说「看情况」但不给出判据 → fail；没提代价 → fail。' },
  use:     { name: '能用的', color: '#61DDAA',
    ask: '遮住上面那句：它是什么？给一个你**真拿它做过**的具体例子（做了什么、结果如何）。',
    rule: '判定口径：说清它是什么 + 给了一个具体、可核对的用例 → pass；'
        + '只有定义没有用例 → fail；用例含糊或明显是编的 → fail。' },
  accept:  { name: '只能认的', color: '#9661BC', ask: null,
    rule: '这一类不设验收。' },
};
const kOf = n => (KIND[n.k] ? n.k : 'compute');
const byId = new Map(nodes.map(n => [n.id, n]));
const neighbors = new Map(nodes.map(n => [n.id, { pre: [], post: [] }]));
const relationNeighbors = new Map(nodes.map(n => [n.id, []]));
const RELATION_NAMES = {
  prerequisite: '前置', 'related-to': '相关', 'used-with': '一起使用',
  'part-of': '组成', contrast: '对照',
};
/* 默认不绘制的两类记录（口径见 scripts/lib/relation-kinds.mjs）。页面必须照实说它们没被画，
   不能再写「画布中已全部保留」——那句话以前是假的：2485 条（co-article 2419 + rejected 66）不在画布上。 */
const HIDDEN_RELATION_NAMES = { 'co-article': '同一篇里出现过（共现）', rejected: '已被判不成立' };
const RELATION_COLORS = {
  prerequisite: '#a8b5ee', 'related-to': '#8b7de8', 'used-with': '#5ec9b1',
  'part-of': '#e4a95f', contrast: '#e97b9b',
};

/* ── 状态 ───────────────────────────────────────────── */
// 09-15 v3-knowledge-tree：**我的树**是默认（slogan「将知识转化为属于你的知识树」落在产品上，
// 所有者拍板方案甲）。树＝分列坐标的渲染变体（路径同款做法）；图谱/关系/星球撤入口不删代码。
let mode = 'tree';
let rotX = -0.22, rotY = 0.5, zoom = 1.08, panX = 0, panY = 0;
let selected = null, hovered = null, filter = null;
// 当前路线与「走到第几步」：routeStepIdx 是 0 基下标；进路径时停在第一个没验过的步骤上
let routeId = ROUTES.length ? ROUTES[0].routeId : null;
let routeStepIdx = 0;
function activeRoute() { return ROUTES.find(r => r.routeId === routeId) || null; }
function routeIndexOf(id) {
  const r = activeRoute();
  return r ? r.steps.findIndex(s => s.conceptId === id) : -1;
}
function routeHas(id) { return routeIndexOf(id) >= 0; }
/* 第一步停在哪：看过/验过的都跳过，全验完就停在最后一步。
   「验过」只认 marks 里的证据（pass/read/mech 都算走过），不自己标。 */
function firstUnseenStep(r) {
  for (let i = 0; i < r.steps.length; i++) {
    const st = (marks[r.steps[i].conceptId] || {}).state;
    if (st !== 'pass' && st !== 'read' && st !== 'mech') return i;
  }
  return r.steps.length - 1;
}
/* 把视图对准路线（09-13 加）：路径默认打开时整张图是缩到 1.0 的，六个点挤在 L0/L1 那两行里，
   截图一看「当前节点高亮」其实埋在灰点堆里。这里按路线的包围盒定一次 zoom/pan，
   让路线占画布中间那块；之后用户自己拖/缩放不再动它。 */
/* v4-unify：路径默认「**当前步视角**」——整条路线横跨 8 列，整条入画必须缩到 ~0.3，
   看起来只有细细一条（所有者 09-15「路径只显示一点点」）。默认以当前步为中心的可读取景，
   「看整条」按钮切 full。routeFit：step（默认）| full。 */
let routeFit = 'step';
function focusRoute(opts) {
  const r = activeRoute();
  if (!r || !r.steps.length || mode !== 'path') return;
  const o = (opts && typeof opts === 'object') ? opts : {};
  if (o.fit) routeFit = o.fit;
  const ns = r.steps.map(s => byId.get(s.conceptId)).filter(Boolean);
  if (ns.length < 2) return;
  const left = 282;                                  // 让开路径条
  let t;
  if (routeFit === 'full') {
    const gxs = ns.map(n => n.gx), gys = ns.map(n => n.gy);
    const spanX = Math.max(90, Math.max(...gxs) - Math.min(...gxs));
    const spanY = Math.max(70, Math.max(...gys) - Math.min(...gys));
    // 09-15：列宽改成固定的 264 世界像素后，一条路线是真宽——实测这条跨 8 条主题
    // （2125 世界像素），整条进画面得缩到 ~0.22。渲染里路线点有 4.2px 下限，下限放到 0.16。
    const s = Math.max(0.16, Math.min(1.6, Math.min((W - left) * 0.74 / spanX, (H - 60) * 0.62 / spanY)));
    const gcx = (Math.min(...gxs) + Math.max(...gxs)) / 2, gcy = (Math.min(...gys) + Math.max(...gys)) / 2;
    const tx = left + (W - left) * 0.5, ty = 60 + (H - 60) * 0.5;
    t = { zoom: s, panX: (tx - CX) / s - gcx + CX, panY: (ty - CY) / s - gcy + CY };
  } else {
    const cur = byId.get(r.steps[Math.min(routeStepIdx, r.steps.length - 1)].conceptId);
    if (!cur) return;
    const s = Math.max(0.55, Math.min(1.2, (W - left) / 860));
    const tx = left + (W - left) * 0.5, ty = 60 + (H - 60) * 0.48;
    t = { zoom: s, panX: (tx - CX) / s - cur.gx + CX, panY: (ty - CY) / s - cur.gy + CY };
  }
  camApply(t, o.instant ? { instant: true } : null);
}
window.focusRoute = focusRoute;
function routeFitToggle() {
  focusRoute({ fit: routeFit === 'step' ? 'full' : 'step' });
  renderPathRail();
}
window.routeFitToggle = routeFitToggle;
function openRoute(id, keepStep) {
  const r = ROUTES.find(x => x.routeId === id);
  if (!r) return;
  routeId = id;
  if (!keepStep) routeStepIdx = firstUnseenStep(r);
  if (mode !== 'path') { mode = 'path'; syncTabs(); }
  filter = null;                                   // 路径横跨多个主题，别被单列筛掉
  selected = null;
  document.getElementById('panel').classList.remove('on');
  pinMain(false);
  computeLayout(); focusRoute(); refreshRail(); renderList(); syncPath();
}
window.openRoute = openRoute;
function gotoRouteStep(i) {
  const r = activeRoute(); if (!r) return;
  routeStepIdx = Math.max(0, Math.min(r.steps.length - 1, i));
  openPanel(r.steps[routeStepIdx].conceptId);
  focusRoute({ instant: true });   // 当前步视角跟着走（v4）
  syncPath();
}
window.gotoRouteStep = gotoRouteStep;
/* 点路线上的第 i 步：当前步原地展开卡片；点别的步＝把「当前步」挪过去 */
function pickRouteStep(i) {

}

/* ── 我的标记层：**不能自己标「学过」** ──────────────────────────
   所有者 09-12 08:47 的批评：「变成了一个摆设……这样子干你没法倒逼」
   原来自报——点一下「学过」就变绿，零证据。那就是摆设。
   现在：只有**写过一次复述、被判过**才可能有环。判定人不是学习者自己。
     pass = 复述过了（青环）
     fail = 验过、没过，正在倒回（红环）
     mech = 只过了机械覆盖检查，没经语义判定（琥珀环，不算学会）
     无环 = 没验过
   布局只由 nodes/edges 决定，标记不参与任何坐标计算。 */
const MARK_KEY = 'zss135.proof.v2';   // v1 是自报的，作废不迁移
let marks = {};   // { [id]: {state, said, missing:[], wrong:[], backTo:[], why, at} }
try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || '{}') || {}; } catch (e) { marks = {}; }
// 老版本存的是字符串 'learned'/'gap'，直接丢掉——那是自报，不是证据
for (const k of Object.keys(marks)) if (typeof marks[k] === 'string') delete marks[k];
function saveMarks() { try { localStorage.setItem(MARK_KEY, JSON.stringify(marks)); } catch (e) {} }

function refreshMarks() {
  if (window.refreshRail) refreshRail();
  if (window.renderTreeStat) renderTreeStat();
}
/* ── 树头统计（v3-knowledge-tree）────────────────────────
   只报绝对数：N 片叶子有判定（pass+mech+fail）· M 片过了费曼（pass）· K 片倒回中（fail）。
   read（读过）不算「有判定」——那一类不设验收（09-12 红线：不许自报；09-12 路演红线：不报占全树百分比）。 */
function treeStats() {
  let pass = 0, mech = 0, fail = 0;
  for (const k of Object.keys(marks)) {
    const s = marks[k] && marks[k].state;
    if (s === 'pass') pass++; else if (s === 'mech') mech++; else if (s === 'fail') fail++;
  }
  return { pass, mech, fail, judged: pass + mech + fail };
}
function renderTreeStat() {
  const el = document.getElementById('tree-stat');
  if (!el) return;
  const t = treeStats();
  el.innerHTML = t.judged
    ? `你的树 · <b>${t.judged}</b> 片叶子有判定 · <b>${t.pass}</b> 片过了费曼 · <b>${t.fail}</b> 片倒回中`
    : `你的树还是一棵苗——去内参读一篇，或进实践空间学一章，<b>叶子会长出来</b>`;
}
window.renderTreeStat = renderTreeStat; window.treeStats = treeStats;

/* ── 费曼验收：遮住原文，用自己的话说，系统挑漏，漏哪倒回哪 ────────
   判定口径写在提示词里：照抄不算过、只写几个词不算过、
   「意思差不多」不放过——因为判定器的工作是**挑漏**，不是发安慰分。 */
function judgeSys(kind) {
  const K = KIND[kind] || KIND.compute;
  return '你是学习验收的判定器。这个概念被判为「' + K.name + '」。\n'
    + '学习者的任务：' + K.ask + '\n'
    + K.rule + '\n'
    + '你的任务是**挑漏**，不是鼓励，不许给安慰分。\n'
    + '只输出 json：\n'
    + '{"verdict":"pass" 或 "fail",'
    + '"missing":["他漏掉的要点，每条 6-18 字，最多 3 条"],'
    + '"wrong":["他说错的地方，没有就空数组"],'
    + '"backTo":["先修概念 id，只能从下面给出的前置 id 里挑；漏的根在某个前置概念上就指向它，否则空数组"],'
    + '"why":"一句话 20-40 字，直接说他哪里没做到，不要客套"}\n'
    + '通用口径：只写了几个词、没成句 → fail；把原句换个说法照抄 → fail；拿不准就 fail。';
}

function judgeUserMsg(nd, said) {
  const pre = (neighbors.get(nd.id).pre || []).map(x => byId.get(x)).filter(Boolean);
  return '概念名：' + nd.name + '\n'
    + '验收类别：' + (KIND[kOf(nd)] || {}).name + '（' + (nd.kwhy || '') + '）\n'
    + '它讲的是什么（唯一判据）：' + nd.gloss + '\n'
    + '它的前置概念（backTo 只能指向这些 id）：\n'
    + (pre.length ? pre.map(x => '  ' + x.id + ' ｜ ' + x.name + ' ｜ ' + x.gloss).join('\n') : '  （没有前置）')
    + '\n\n学习者写的：' + said;
}

/* 机械兜底：没有模型可判时，只做**关键词覆盖检查**，并且如实标注它不是语义判定。
   它**不会**把概念标成 pass——只标 mech（琥珀环），因为过没过机器检查不等于懂没懂。 */
const STOP = new Set(['一个','这个','那个','的是','可以','就是','不是','或者','以及','通过','因为','所以','需要','没有','已经','什么','怎么','这样','那样','自己','我们','他们','这些','那些','但是','而且','如果','它们','也就是','指的是','一种','用来','能够','不会','会有','时候','东西','事情','问题','方式','方法','过程','情况','状态']);
function mechJudge(nd, said) {
  const raw = nd.gloss.match(/[A-Za-z][A-Za-z0-9+#.-]{1,}|[\u4e00-\u9fa5]{2,4}/g) || [];
  const key = [...new Set(raw)].filter(t => !STOP.has(t)).slice(0, 16);
  const miss = key.filter(t => !said.includes(t));
  const cover = key.length ? (key.length - miss.length) / key.length : 0;
  const k = kOf(nd);
  // judge 类要的是「你自己的判据与代价」，use 类要的是「一个真用过的例子」。
  // 关键词覆盖检查看不见这两样东西——所以这两类在没有模型时**只判 fail**，
  // 绝不给 mech 的琥珀环，免得把「词提到了」冒充成「判据给了 / 例子举了」。
  if (k === 'judge' || k === 'use') {
    return { verdict: 'fail', coverage: cover, missing: miss.slice(0, 5), wrong: [], backTo: [],
      why: '这一类要的是' + (k === 'judge' ? '你自己的判据与代价' : '一个你真用过的例子')
         + '，机械检查看不出来。本次没经语义判定 → 按没过记。', mechanical: true };
  }
  return {
    verdict: cover >= 0.5 ? 'mech' : 'fail',
    coverage: cover, missing: miss.slice(0, 5), wrong: [], backTo: [],
    why: '关键词覆盖 ' + Math.round(cover * 100) + '%（机械检查，不是语义判定）', mechanical: true,
  };
}

/* ══ 桌面版能力 ══════════════════════════════════════════════
   桌面版（app/main.js）跑的是**同一个服务**，但多了一个数据目录。
   /api/health 会回 {app:true, dataDir:"…"}；网页版永远是 false。
   多出来的只有一件事：**能写真文件**——
     · 自己的那棵树落成 学习记录.json（不是浏览器 localStorage，清一次就没了）
     · skill 产物落成 产物/<课题>.md（dbs-learning-beta 的 SKILL.md 写死的那条路径，
       网页版只能回一句「当前会话没有文件写入能力，先直接贴出」） */
let APP = { on: false, dir: null };
async function detectApp() {
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    APP = { on: !!j.app, dir: j.dataDir || null };
  } catch (e) { APP = { on: false, dir: null }; }
  const tag = document.getElementById('pubtag');
  if (tag && APP.on) { tag.textContent = '桌面版'; tag.title = '数据存在 ' + APP.dir; tag.style.display = ''; }
  return APP;
}
let judging = false;
async function judge(id) {
  const box = document.getElementById('said');
  const said = (box ? box.value : '').trim();
  const nd = byId.get(id);
  const err = document.getElementById('jerr');
  if (!nd || judging) return;
  if (said.length < 10) {
    if (err) err.textContent = said.length ? '太短了——至少写成一句话（10 字以上）。几个词不算复述。' : '先写点什么。遮住上面那句，用你自己的话说。';
    return;
  }
  if (kOf(nd) === 'accept') {
    if (err) err.textContent = '这一类不设验收——只记「读过」，不判过没过。';
    return;
  }
  judging = true;
  if (err) err.textContent = '判定中…';
  let v;
  try {
    v = await judgeCall(nd, said);
  } catch (e) {
    v = { verdict: 'fail', missing: [], wrong: [], backTo: [], why: '判定失败：' + (e.message || e) };
  }
  judging = false;
  marks[id] = {
    state: v.verdict, said, missing: v.missing || [], wrong: v.wrong || [],
    backTo: (v.backTo || []).filter(x => byId.has(x)), why: v.why || '',
    coverage: v.coverage, mechanical: !!v.mechanical, at: Date.now(),

/* ── 分组轴：只按主题分列 ───────────────────────────────────
