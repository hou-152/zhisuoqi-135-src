# 双轴星图场的概念定位（策展层视图）
#
# 数据合同：
# - scope: 工程范围轴（ADR-0001 轴 01），取 prompt / context / harness 三层之一，
#   表示该概念的工程实践主要发生在哪一层覆盖范围内。
# - responsibility: 系统职责轴（ADR-0001 轴 02），取 0-100 的策展定位值。
#   0 = 主要管理信息（Context 侧），100 = 主要管理运行（Harness 侧），
#   50 附近 = 运行时装配接缝。该值是策展定位，不是测量结果。
# - kind: 默认 practice（工程实践）；kind: model 表示被组织、被包裹的模型本体，
#   在图上以不同形状呈现，避免把"模型"误读成某层工程实践。
#
# 本文件是视图层数据：概念页为准，这里只负责定位与导航，不新增定义。

schema_version: 1

axis:
  scope:
    - id: prompt
      label: 01 Prompt Engineering
      hint: 把单次指令说清楚
    - id: context
      label: 02 Context Engineering
      hint: 动态装配模型所需的信息
    - id: harness
      label: 03 Harness Engineering
      hint: 把模型组织进可运行、可恢复、可验证的系统
  responsibility:
    left: 管理信息
    right: 管理运行
    seam: 运行时装配
  note: 本站采用的观察视图（ADR-0001）：范围通常逐级扩大，职责在运行时装配处交叉；不把包含关系当成唯一行业共识。

