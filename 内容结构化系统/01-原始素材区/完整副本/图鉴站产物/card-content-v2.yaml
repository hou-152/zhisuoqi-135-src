entries:
  CANDV2-ctx-a-agent-tool-contract:
    scenario: >-
      假设客服 Agent 要发起退款：模型只提交“退款”意图、订单号和金额，执行器先过权限门再调用接口，最后只回传状态、流水号与失败原因。
    how_to:
      - 列出模型可以表达的操作意图，并为每种意图限定必填参数和可选参数。
      - 把鉴权、参数校验、真实执行和重试放进确定性代码，不让模型口头模拟成功。
      - 用缺参数、越权参数和超长返回各跑一次，检查错误是否可解释、回执是否足够紧凑。
    transfer_question: >-
      如果把同一个 Agent 从工单系统迁到财务系统，哪些接口约定必须重写，哪些执行责任仍应留在确定性代码中？
  CANDV2-ctx-a-bounded-context:
    feynman: >-
      同一个“订单”，销售团队关心承诺了什么，履约团队关心包裹走到哪；词没变，规则和对象已经换了房间。限界上下文就是给每套含义画门牌，过门时再明确翻译。
    scenario: >-
      假设销售模块把“客户”定义为签约主体，客服模块却把每位联系人都叫客户；一次数据合并让两个团队对人数和权限产生了相反结论。
    how_to:
      - 找出一个经常引发争议的业务词，分别记录各团队用它做什么决定。
      - 对比该词对应的对象、规则和生命周期，把含义稳定的一组工作圈成边界。
      - 为跨边界交换的数据写明转换规则，避免直接复用同名字段制造假一致。
    transfer_question: >-
      当两个团队都使用“账户”一词时，你会依据哪些业务规则判断它们应共享一个模型，还是需要两个限界上下文？
  CANDV2-ctx-a-browsing-loop:
    scenario: >-
      假设 Agent 为回答“是否更换供应商”连续打开几十篇材料；每篇都带来新名词，却没有补齐价格、稳定性和迁移成本三项决策证据。
    how_to:
      - 在搜索前写下要支持的决定、三个关键未知量和可接受的证据类型。
      - 每轮浏览后只记录本轮减少了哪个未知量；没有减少就改变查询或停止扩张。
      - 预先设定覆盖标准、时间预算和停止条件，到点输出证据缺口而不是继续漫游。
    transfer_question: >-
      面对一个本来就需要摸清全貌的开放题，怎样区分必要的广泛探索与已经失去问题锚点的浏览循环？
  CANDV2-ctx-a-human-escalation-tool-call:
    scenario: >-
      假设采购 Agent 遇到超预算报价，它暂停下单，把差额、备选方案和截止时间组成审批请求；负责人选择方案后，流程从原步骤恢复。
    how_to:
      - 明确哪些风险、金额或责任判断必须升级给人，并把它们编码成可触发条件。
      - 请求中只放决策问题、必要证据、可选项和不回应的后果，避免让人重新调查全案。
      - 保存等待状态和关联任务，收到答复后从断点继续，并把决定写入回执。
    transfer_question: >-
      如果人工答复可能几小时后才到，工作流还要保存哪些状态，才能让升级成为可恢复工具调用而不是临时接管？
  CANDV2-ctx-a-kv-cache-hit-rate:
    feynman: >-
      像印刷厂保留已经排好的固定版面：下一张只换末尾几行，就不用从第一页重新排。命中率告诉你多少前缀真的复用了排版，不告诉你印出来的答案好不好。
    scenario: >-
      假设一个 Agent 每轮都携带相同工具说明，只追加一条新观察；团队调整了前缀顺序后，任务没变，首字延迟和账单却明显波动。
    how_to:
      - 从真实请求记录稳定前缀、变化后缀、缓存命中量、延迟和输入费用。
      - 固定模型与任务，对比完全相同前缀、轻微改序和完全失配三组请求。
      - 重复运行并按服务商规则解释结果，不把一次命中或账单变化归因于答案质量。
    transfer_question: >-
      如果缓存命中率提高而端到端耗时没有下降，你会优先检查输出长度、工具等待还是缓存统计口径，为什么？
  CANDV2-ctx-a-length-difficulty-decoupling:
    scenario: >-
      假设团队测试长文能力时，短输入只问事实定位，长输入却要求多跳推理；长输入得分更低，却无法判断是长度还是题目更难造成的。
    how_to:
      - 选定一组答案和推理步骤固定的任务，先建立短输入基线。
      - 只增加与任务无关或受控的上下文长度，保持问题、答案、评分和输出要求不变。
      - 分长度重复运行并报告置信区间，再单独设计位置和干扰项实验。
    transfer_question: >-
      若增加输入长度时不得不增加证据数量，怎样设计对照才能尽量分开“更多材料”和“更难推理”的影响？
  CANDV2-ctx-a-position-robustness-eval:
    scenario: >-
      假设同一份合同问答中，关键条款放在开头时总能答对，移到中段就频繁遗漏，放到末尾又部分恢复。
    how_to:
      - 固定文档内容、问题、答案和评分，只系统移动关键证据的位置。
      - 对每个位置重复采样，记录正确率、引用证据和拒答情况。
      - 比较最好与最差位置的差值，并在不同长度和干扰条件下复验。
    transfer_question: >-
      如果模型只在“中段且有相似干扰项”时失败，这更像位置敏感、检索困难，还是两者交互；你会怎样追加实验？
  CANDV2-ctx-a-restorable-compression:
    scenario: >-
      假设一次排障产生了两万行日志；当前会话只保留故障结论、日志文件路径、时间区间和 Hash，需要复核时再取回原片段。
    how_to:
      - 把准备移出窗口的原文保存到稳定载体，并记录可校验的定位信息。
      - 在当前上下文留下内容摘要、移除原因、回取入口和何时需要恢复。
      - 用一个空白会话实际按引用取回材料，核对权限、完整性和定位精度。
    transfer_question: >-
      如果引用仍存在但访问权限会过期，这份压缩还算可恢复吗；系统应增加什么保障？
  CANDV2-ctx-a-retrieval-reasoning-load:
    scenario: >-
      假设分析师让模型从整座合同库找违约条款并判断责任；另一组先由检索器给出三页相关条款，再让同一模型做相同判断，结果稳定性明显不同。
    how_to:
      - 准备答案与推理难度相同的任务，分别提供完整材料和已聚焦证据。
      - 记录模型引用了哪些证据、是否漏检，以及在证据已给定时推理是否正确。
      - 根据差异决定把检索拆成独立步骤、增加证据排序，还是保留一次调用。
    transfer_question: >-
      当完整输入组表现更差时，怎样排除歧义、干扰项和拒答策略，而不是把差值全部算成检索负担？
  CANDV2-ctx-a-semantic-continuity:
    feynman: >-
      搬家时把每件东西都装箱，却不写“厨房先开箱”“这台机器为什么停用”，箱子一个不少，生活还是接不上。语义连续性保的是下一步为何成立，不只是字节还在。
    scenario: >-
      假设项目交接包保存了所有聊天和文件，却漏掉被否决方案、当前假设与下一步依赖；接手者读完资料仍重复走回旧路。
    how_to:
      - 交接前列出当前目标、已作决定、关键理由、未决问题和下一步依赖。
      - 压缩时优先保留能改变后续判断的信息，并为细节留下回取入口。
      - 让一个不了解历史的人仅凭交接包继续任务，记录他必须追问的缺口。
    transfer_question: >-
      如果完整历史已经存档，但新会话仍无法解释“为什么不选方案 B”，问题出在数据完整性还是语义连续性？
  CANDV2-ctx-a-system-prompt-altitude:
    scenario: >-
      假设客服系统一版提示逐秒规定每句话，遇到新投诉就卡住；另一版只写“友善解决”，又无法稳定处理退款与升级。
    how_to:
      - 收集高频任务、真实失败样本和必须统一的行为边界。
      - 把规则写成可判断的原则、关键例外和升级条件，删除不必要的微步骤。
      - 用未见过的边缘案例测试，观察模型是能据原则判断，还是出现自由发挥或机械执行。
    transfer_question: >-
      当任务变化很快但合规边界稳定时，哪些内容应上升为系统原则，哪些应留在就近工具说明中？
  CANDV2-ctx-a-tool-workflow-fit:
    scenario: >-
      假设研究 Agent 拿到一个功能丰富的网页工具，却没有来源记录、证据筛选和停止条件；它访问很多页面，最终仍交不出可复核结论。
    how_to:
      - 先写任务锚点、合格证据、允许动作和完成条件，再列工具必须支持的环节。
      - 用一条真实任务走完整流程，记录工具说明、返回格式和调用节奏造成的摩擦。
      - 只调整与失败直接相关的接口或工作流层，并用同一任务重新验证。
    transfer_question: >-
      同一个搜索工具在热点追踪中好用、在法律研究中失效，差异最可能来自能力本身还是工作流适配？你会看什么证据？
  CANDV2-ctx-a-ubiquitous-language:
    feynman: >-
      团队像在合写一本会运行的词典：会议里说“会员”，代码、表格和规则里也必须指向同一对象。词义一漂，系统就会把语言分歧执行成业务错误。
    scenario: >-
      假设运营说“激活用户”指完成首单，数据团队却指登录过一次；同一指标进入看板和推荐代码后，两边都以为自己理解一致。
    how_to:
      - 从争议频繁的业务动作中收集术语及各角色的实际定义。
      - 为每个术语给出对象、规则、示例和反例，并同步到代码命名与文档。
      - 在评审中把新说法与现有词表对齐；发现一词多义时标明所属边界。
    transfer_question: >-
      当市场团队和风控团队必须保留不同的“有效客户”定义时，怎样维护统一语言而不强行统一词义？
  CANDV2-ctx-b-agent-action-space:
    feynman: >-
      行动空间像一套棋盘规则：不只看有几种棋子，还要看每颗棋子能走哪格、何时能走、走完会看到什么。选项过多但规则含糊，反而更难下对。
    scenario: >-
      假设文件 Agent 只有一个“操作文件”工具，却可通过参数读取、覆盖、移动或删除；工具数量没变，参数范围扩大后风险和选择难度都变了。
    how_to:
      - 枚举当前环境允许的动作、参数范围、前置条件和返回反馈。
      - 用任务样本检查模型能否区分近似动作，并标出高混淆或高风险组合。
      - 收窄无用选项、拆分危险能力或增加确认，再比较成功率和误调用率。
    transfer_question: >-
      如果两个系统都暴露五个工具，但一个允许任意路径、另一个只允许项目目录，它们的行动空间为什么不同？
  CANDV2-ctx-b-agent-elicitation:
    feynman: >-
      像医生问诊：不是问题越多越专业，而是只追问会改变诊断和处置的缺口。好提问让用户用最小力气补上关键一块，然后回到原任务继续。
    scenario: >-
      假设旅行 Agent 收到“订一间合适的酒店”，它发现城市和日期已知，但预算会直接改变候选，于是只追问预算范围后继续筛选。
    how_to:
      - 在行动前列出会改变答案、风险或权限的未知量。
      - 优先询问影响最大的一个缺口，并提供容易选择的回答格式和默认含义。
      - 把答案写回原任务状态，确认新信息已解除阻塞，再继续执行。
    transfer_question: >-
      当用户不愿回答偏好问题时，Agent 应采用可逆默认值继续，还是停止等待；你会用哪些风险条件判断？
  CANDV2-ctx-b-agent-session-management:
    scenario: >-
      假设一次修复会话已经读入错误分支、长日志和多次失败尝试；新需求与原问题只有一个文件相关，团队必须决定继续、压缩还是另开会话。
    how_to:
      - 检查当前目标、已加载历史、错误路径和未落盘状态是否仍服务于下一步。
      - 按情况选择继续、回退、压缩、清空或分派，并记录选择理由与保留信息。
      - 在切换后验证新会话能恢复必要状态，同时不再携带已判定无关的噪声。
    transfer_question: >-
      当一个会话掌握关键背景却积累了错误假设时，怎样决定回退、压缩还是重开，而不是只看剩余窗口大小？
  CANDV2-ctx-b-api-boundary-observability:
    scenario: >-
      假设账单显示某次调用输入暴涨，但应用日志只有 Usage 数字；团队无法判断增长来自系统提示、工具说明还是会话历史。
    how_to:
      - 在调用边界记录可关联的请求标识、模型、时间、Payload 结构和 Usage。
      - 对敏感字段做最小化、脱敏和访问控制，同时保留可重建 Token 来源的证据。
      - 用一条已知请求从日志还原调用拓扑和费用归因，检查缺失与篡改风险。
    transfer_question: >-
      如果安全政策禁止保存完整 Payload，怎样设计摘要或分段计数，仍能定位 Token 增长来源？
  CANDV2-ctx-b-change-impact-analysis:
    scenario: >-
      假设开发者修改鉴权函数，文件本身测试通过，但调用它的批处理任务和权限回归测试没有被运行，发布后才暴露连锁影响。
    how_to:
      - 从变更的符号和文件出发，沿调用、导入、继承与测试关系向外展开。
      - 把直接依赖、间接依赖和动态未知分别列出，并为每层选择验证方式。
      - 运行受影响测试后核对实际轨迹，补充静态图谱未覆盖的运行时依赖。
    transfer_question: >-
      面对大量反射和配置驱动的系统，静态影响图之外还要收集什么运行证据，才能决定回归范围？
  CANDV2-ctx-b-chat-template:
    feynman: >-
      聊天模板像把多人对话排成模型认识的剧本格式：谁说了什么、顺序怎样，都要重新装进本次输入。剧本看起来连续，不代表演员脑中保留了上一场。
    scenario: >-
      假设同一段用户与助手历史在两个模型上直接复用，一边正常续答，另一边把角色标记当正文；换成各自约定的序列化格式后才恢复。
    how_to:
      - 核对目标模型要求的角色标记、起止符和生成提示位置。
      - 用最短的系统、用户、助手三轮样本渲染模板，检查最终输入字节与角色顺序。
      - 加入长历史和工具消息做回归，确认模板只负责格式，不承担持久存储。
    transfer_question: >-
      迁移模型时保留同一聊天历史，为什么仍可能需要重写模板；你会怎样验证角色没有串位？
  CANDV2-ctx-b-event-driven-agent-automation:
    scenario: >-
      假设新工单进入队列就自动触发分类、查重和补充资料；同一事件被重复投递时，系统差点创建两份处理任务。
    how_to:
      - 定义可触发的事件、必要载荷和事件唯一标识，并过滤无关变化。
      - 为后续动作设计幂等键、权限边界、失败重试和人工升级条件。
      - 用重复、乱序和缺字段事件演练，确认启动时机正确且不会重复副作用。
    transfer_question: >-
      当事件频繁更新同一对象时，系统应每次立即启动、合并窗口还是取消重跑；依据是什么？
  CANDV2-ctx-b-harness-token-floor:
    scenario: >-
      假设用户只发一句“继续”，请求却仍携带系统规则、几十个工具 Schema 和运行说明；短任务的固定前缀比用户内容大得多。
    how_to:
      - 在 API 边界分别计算系统提示、工具定义、脚手架、历史和用户输入的 Token。
      - 连续发出几条短请求，确认哪些固定内容每轮重发或以缓存形式读取。
      - 删除未使用工具或下沉说明后复测窗口占用、费用和任务成功率。
    transfer_question: >-
      如果缓存降低了固定前缀费用，却没有增加可用窗口，产品应该怎样解释这两种收益的差别？
  CANDV2-ctx-b-llm-statelessness:
    feynman: >-
      每次调用都像把一张新白纸递给模型；上次写过什么，只有外部系统重新夹进这叠纸，它才看得见。白纸是新的，不代表模型忘了训练时学到的常识。
    scenario: >-
      假设第一轮让模型记住订单号，第二轮请求只写“查一下状态”；如果应用没有重送订单号或历史，模型无法知道“它”指什么。
    how_to:
      - 在客户端显式保存任务状态、消息和必要工具结果，不依赖模型自行记住。
      - 组装下一次请求时，只重新提供完成当前步骤所需的信息。
      - 用去掉历史的对照请求验证哪些连续性来自外部状态，哪些只是模型知识。
    transfer_question: >-
      如果应用数据库保存了完整对话，但本轮只发送最后一句，为什么仍不能说模型拥有了会话状态？
  CANDV2-ctx-b-llm-token:
    feynman: >-
      模型读写的不是我们眼中的“字”和“单词”，而是分词器切出的积木块。同一句话换一种分词器，积木数量会变；积木多也不等于问题更难。
    scenario: >-
      假设中英文长度看起来相近的两段说明进入不同模型，计费和窗口占用差异很大；按字符估算让请求提前撞上上限。
    how_to:
      - 使用目标模型对应的分词器统计真实输入、输出和各组成部分的 Token。
      - 对代表性的中文、英文、代码和结构化数据分别测量，建立容量余量。
      - 在压缩或裁剪后复算 Token，并独立检查信息是否仍完整、任务是否仍可完成。
    transfer_question: >-
      当两个提示的 Token 数相同但任务表现不同，为什么不能据此断言它们占用了相同的有效注意力？
  CANDV2-ctx-b-observation-masking:
    scenario: >-
      假设 Agent 早期读取了完整构建日志，后续修复只需知道“构建失败过”和错误摘要；每轮重送全部日志持续挤压当前代码上下文。
    how_to:
      - 标出已经完成作用、但不必继续逐字可见的旧工具输出。
      - 保留调用时间、工具名、结论和回取引用，把沉重正文移出当前输入。
      - 继续任务并设置恢复触发条件，验证需要细节时能重新取得原输出。
    transfer_question: >-
      哪些旧工具结果可以只保留调用痕迹，哪些必须保留关键数值或原文才能避免后续误判？
  CANDV2-ctx-b-persistent-code-graph:
    scenario: >-
      假设 Agent 第二天再次分析仓库时，不必重读所有文件，而是查询昨天已建立并按新提交更新的调用与测试关系图。
    how_to:
      - 定义要持久化的代码实体、关系类型、版本标识和来源位置。
      - 在提交或索引变更时增量更新，并检测删除、重命名和解析失败。
      - 用已知调用链和动态依赖抽样核对图谱，过期或低覆盖区域明确降级为未知。
    transfer_question: >-
      如果图谱查询很快但落后主分支三天，Agent 应如何判断它还能用于影响分析还是必须重建？
  CANDV2-ctx-b-prompt-caching:
    scenario: >-
      假设客服 Agent 的系统规则和工具说明连续十轮不变，只有末尾用户消息变化；把动态时间戳放到最前面后，缓存收益突然消失。
    how_to:
      - 把稳定规则和工具说明排在前缀，把会话状态与本轮输入放在后部。
      - 对比首次写入、重复命中和前缀微调三类请求的缓存量、费用与延迟。
      - 找出破坏前缀稳定的时间戳、随机顺序和无关字段，修正后用真实流量复验。
    transfer_question: >-
      某段历史语义完全相同但序列化顺序变化时，为什么缓存仍可能失效；应在哪一层稳定它？
  CANDV2-ctx-b-reasoning-effort:
    scenario: >-
      假设分类任务用高推理强度只增加等待，而复杂排障在低档位频繁漏掉条件；同一默认值同时浪费成本并损失质量。
    how_to:
      - 按任务难度、错误代价和时延要求建立几档代表样本。
      - 固定输入与评分，分别测试不同推理强度的质量、耗时和费用。
      - 为任务类型设默认档和升级条件，并监控分布变化后的失效情况。
    transfer_question: >-
      当高推理强度只让答案更长却不更准时，你会调整任务拆分、评分还是路由规则，为什么？
  CANDV2-ctx-b-shared-agent-session:
    scenario: >-
      假设设计师和工程师共同观察同一生成会话：设计师修正页面意图，工程师检查文件改动，双方看到一致的历史和预览。
    how_to:
      - 定义谁可以查看、输入、批准和终止会话，以及变更如何标记操作者。
      - 让产物、运行状态和关键决定绑定同一会话，并为并发输入设置顺序规则。
      - 用权限不同的两名协作者演练接力与冲突，检查审计记录和版本一致性。
    transfer_question: >-
      当多人可以干预同一会话时，怎样既保留共同上下文，又避免两条互相冲突的指令同时生效？
  CANDV2-ctx-b-skill-chaining:
    feynman: >-
      像接力赛：上一棒不仅要跑完，还要按约定把接力棒交给下一棒。把几个 Skill 排在列表里不叫链，明确输入输出、失败处理和交接才叫链。
    scenario: >-
      假设文章整理 Skill 完成后自动把结构化稿件交给排版 Skill，再交给检查 Skill；第二步失败时链条保留中间稿等待重试。
    how_to:
      - 为每个 Skill 写清输入、输出、成功条件和可以独立停止的位置。
      - 定义前一步产物如何映射到下一步，以及失败、重试和人工升级如何处理。
      - 用一步失败和重复执行做演练，确认不会丢产物或产生重复副作用。
    transfer_question: >-
      当链中某个 Skill 也常被单独使用时，怎样设计连接层才能自动推进又不牺牲独立调用？
  CANDV2-ctx-b-skill-trigger-condition:
    scenario: >-
      假设“写文档时使用”的描述让 Skill 几乎处处触发；改成“创建或修改 PDF 时”后，相关任务能命中，普通 Markdown 编辑不再误载。
    how_to:
      - 从真实请求中列出应该触发、容易混淆和明确不应触发的样本。
      - 用用户可观察的场景、对象和动作写描述，避免只写宽泛能力名。
      - 回放正负样本，分别统计漏触发和误触发，再收窄或补充条件。
    transfer_question: >-
      一个 Skill 同时服务“读取”和“编辑”两类任务时，触发条件应合并还是拆分；你会依据什么失败样本决定？
  CANDV2-ctx-b-stable-prompt-prefix:
    scenario: >-
      假设系统规则和工具列表本可复用，但每轮在最前面插入当前时间，导致其后的长前缀全部失去字节级稳定性。
    how_to:
      - 把请求拆成稳定规则、工具定义、半稳定历史和本轮动态状态四段。
      - 固定稳定段的内容、顺序和序列化方式，把时间与状态移到其后。
      - 用连续真实请求比较前缀 Hash 与缓存命中，定位每次意外变化的字段。
    transfer_question: >-
      某个字段业务上很稳定但每轮键顺序随机，它应算稳定前缀吗；应如何修复？
  CANDV2-ctx-b-subagent-orchestration:
    scenario: >-
      假设主 Agent 把依赖调查交给子 Agent；子任务只返回相关文件、证据和不确定项，主流程据此继续修改，而不是接收整段探索历史。
    how_to:
      - 切出边界清晰、可独立验证且不会争用同一写入面的子任务。
      - 给子 Agent 明确输入、禁止范围、交付格式和停止条件。
      - 回收压缩结果与证据，检查缺口后再决定合并、追问或丢弃。
    transfer_question: >-
      当子任务之间共享大量背景且会修改同一文件时，并行编排仍值得吗；你会怎样估算协调成本？
  CANDV2-ctx-b-tool-schema-tax:
    scenario: >-
      假设简单问答请求每轮都附带五十个工具的名称、参数和说明；模型尚未读用户问题，固定工具载荷已占去大段窗口。
    how_to:
      - 在请求 Payload 中单独统计每个工具 Schema 的 Token 和实际调用频率。
      - 按任务场景只暴露必要工具，并缩短冗余说明而不牺牲参数边界。
      - 比较精简前后的选择错误、任务成功率、费用和权限面，避免只追求更少 Token。
    transfer_question: >-
      一个很少调用但一旦缺失就会阻塞任务的工具，应该常驻 Schema 还是按需加载；依据是什么？
  CANDV2-ctx-b-wrapper-skill:
    scenario: >-
      假设内置发布 Skill 无法修改，团队在外层先调用它生成候选结果，再追加链接检查和人工批准，原 Skill 保持原样。
    how_to:
      - 记录原 Skill 的输入、输出、副作用和不可修改边界。
      - 在外层只增加必要的前置校验、结果转换或后置验证，并保持调用可追溯。
      - 用原调用和包装调用对照测试，确认包装没有吞掉错误或重复执行副作用。
    transfer_question: >-
      如果原 Skill 会在返回前直接产生不可逆副作用，外层包装还能在哪些位置增加有效控制？
  CANDV2-ctx-c-agent-cli-runtime:
    feynman: >-
      CLI 运行时像给同一套 Agent 流程装上一扇终端入口：它让流程能被脚本和 CI 调用，却不替流程决定目标、权限或验证规则。
    scenario: >-
      假设团队把 IDE 中可用的代码审查流程接到命令行，让夜间脚本对指定提交运行并输出机器可读回执。
    how_to:
      - 把流程需要的输入、输出、退出码和环境依赖写成稳定命令接口。
      - 在本地终端跑通后，再用无交互环境验证路径、权限和失败信号。
      - 将同一命令接入脚本或 CI，并保留日志与可重复执行参数。
    transfer_question: >-
      一个流程在 IDE 中依赖隐式打开文件，迁到 CLI 时需要显式补上哪些运行上下文？
  CANDV2-ctx-c-instruction-locality:
    feynman: >-
      洗衣说明缝在衣服标签上，比贴在整栋楼大厅更可靠。指令越靠近它实际约束的工具、文件或接口，越不容易重复、冲突和被无关任务带走。
    scenario: >-
      假设工具参数的使用限制既写在系统提示又写在工具描述，两处更新不同步；模型按旧的全局说明调用了已经变更的接口。
    how_to:
      - 为每条指令标出它直接约束的对象、维护者和生效位置。
      - 把对象专属说明移动到工具描述、目录规则或接口旁，删除上层重复副本。
      - 修改一次对象规则并追踪所有读取路径，确认不存在陈旧镜像。
    transfer_question: >-
      一条同时约束多个工具的安全规则应该放在哪里，才能兼顾就近维护与全局一致？
  CANDV2-ctx-c-rolling-truncation:
    feynman: >-
      像传送带只保留最近几件行李：新东西一来，最早的直接掉下去。它不会先把旧行李里的护照和决定抄出来，所以“窗口没满”不等于任务状态还完整。
    scenario: >-
      假设长会话达到上限后持续丢掉最早消息；用户最初给出的禁止条件先消失，最近几轮仍看起来连贯，Agent 却开始越界。
    how_to:
      - 明确截断阈值和删除顺序，并识别不能随历史一起丢弃的目标、约束和决定。
      - 在达到阈值前把关键状态外置或压缩，保留来源和恢复入口。
      - 用一段超过上限的测试会话检查最早约束是否丢失，以及系统是否给出可观察信号。
    transfer_question: >-
      如果任务只依赖最近几轮，滚动截断何时比摘要更合适；怎样证明早期信息确实不再需要？
  CANDV2-ctx-c-tacit-knowledge:
    feynman: >-
      菜谱写了“煎到合适”，老师傅看颜色就知道，学徒却无从下手。隐性知识藏在判断依据和权衡里；只记录最后选了什么，无法教会下一个人为什么这样选。
    scenario: >-
      假设架构决定只留下“采用方案 A”，评审者当时关于故障成本、团队能力和放弃方案 B 的判断没有记录，后来无人能安全修改。
    how_to:
      - 在决策或复盘中追问“看到了什么信号、排除了什么、为何愿意承担这个代价”。
      - 把可观察线索、权衡和例外写成案例或决策记录，不只保存结论。
      - 让未参与者用记录处理一个相似新问题，找出仍需口头补充的判断。
    transfer_question: >-
      会议录像完整保存后，哪些步骤仍必须做，才能把其中的经验变成 Agent 可用而非仅可搜索的材料？
  CANDV2-har-a-architectural-constraint-enforcement:
    feynman: >-
      架构图上的边界像交通规则，只有写进会亮红灯的检查里才会真正约束变更。它能抓逆行和越界，却不能证明车最终开到了正确目的地。
    scenario: >-
      假设约定“领域层不得依赖界面层”只写在文档里；一次自动重构新增反向导入，功能测试仍绿，直到结构检查才阻断。
    how_to:
      - 把必须长期成立的模块边界和依赖方向写成可判定的不变量。
      - 用 linter 或结构测试编码规则，并为每条失败提供违规位置和允许替代方式。
      - 人为加入一条禁止依赖确认检查会失败，恢复后再跑功能验证。
    transfer_question: >-
      哪些架构约束适合机器阻断，哪些仍需要人工判断；划分依据是可判定性还是风险，为什么？
  CANDV2-har-a-code-execution:
    feynman: >-
      给 Agent 一间能写程序并按下运行键的工作间，它就能临时组合许多没预先做成按钮的操作。真正动手的是外部运行时，所以门锁、时限和验收都不能省。
    scenario: >-
      假设数据 Agent 没有专用“合并 CSV”工具，它编写短脚本在沙箱内处理文件并生成校验报告，而不是由模型口头计算数千行结果。
    how_to:
      - 明确允许的运行时、目录、网络、凭据、资源上限和超时。
      - 让 Agent 先写代码和预期副作用，再在隔离环境执行并捕获退出码与产物。
      - 对结果运行确定性检查，失败时保留代码、输入和日志供复现。
    transfer_question: >-
      当专用工具可以完成同一任务时，什么条件下仍值得开放通用代码执行，额外风险如何补偿？
  CANDV2-har-a-conversation-single-flight:
    feynman: >-
      同一会话像只有一条单轨：新消息到来时，旧列车必须先停下，再带着最新乘客重新出发。别的会话仍可并行，受保护的是同一把会话钥匙。
    scenario: >-
      假设 Agent 正在生成长回复，用户又补充“不要删除文件”；系统取消旧运行，把新约束与已保存状态合并后重新启动，避免两份回复交错执行。
    how_to:
      - 为每个会话定义稳定键，并让运行获取该键对应的唯一活动租约。
      - 新消息到达时取消旧运行，先保存可恢复状态，再用最新上下文启动替代运行。
      - 用快速连续消息和取消瞬间的工具调用测试，检查是否产生交错回复或重复副作用。
    transfer_question: >-
      如果旧运行已经发出不可取消的外部请求，新消息触发重启时还需要什么幂等或补偿机制？
  CANDV2-har-a-filesystem-workspace:
    feynman: >-
      文件系统工作区像团队共用的工作台：草稿、代码和中间产物能留在桌上，下一班人可以接着做。但桌子本身不会决定该记什么，也不会自动把危险工具关进笼子。
    scenario: >-
      假设 Agent 把分析数据、脚本和进度回执写入项目目录；会话结束后，另一个 Agent 通过这些文件恢复工作，而不是依赖聊天历史。
    how_to:
      - 规划输入、生成物、临时文件和回执的目录边界与命名规则。
      - 对写入采用可审查格式和原子更新，记录来源、状态与恢复入口。
      - 在新会话中只读取工作区尝试续做，并独立检查权限和沙箱边界。
    transfer_question: >-
      当多个 Agent 共用一个工作区时，怎样区分可共享事实、会话私有状态和需要隔离的执行产物？
  CANDV2-har-a-harness-overfitting:
    feynman: >-
      像只在一种键盘布局上练成的打字员：换一把功能等价的键盘就明显失速，暴露他学到的是接口习惯，不是任务本领。
    scenario: >-
      假设同一模型在原生工具协议上完成率很高，换成能力等价、名称和反馈格式不同的 Harness 后大幅下降。
    how_to:
      - 固定模型、任务、权限和评分，准备两套能力尽量等价的 Harness 接口。
      - 交叉运行并记录工具选择、参数错误、恢复路径和最终成功率。
      - 逐项对齐能力差异后再判断是否存在接口依赖，避免把实现缺陷误叫过拟合。
    transfer_question: >-
      如果换 Harness 后下降来自更慢的工具而非协议陌生，怎样调整实验才能支持或推翻过拟合判断？
  CANDV2-har-a-harness-regression-gate:
    feynman: >-
      修支架不能只看那根坏掉的梁是否更结实，还要确认其他承重梁没有被削弱。目标弱点变好且保留行为不退步，候选版本才过闸。
    scenario: >-
      假设团队为修复工具误选调整系统规则；弱点样本通过了，但原本稳定的文件编辑任务退化，回归闸门拒绝替换现役版本。
    how_to:
      - 冻结目标弱点集、保留行为集、指标和允许波动范围。
      - 对现役与候选 Harness 在相同模型、任务和环境中重复运行。
      - 只有弱点改善且保留集不退化才晋级；失败候选保留日志但不改基线。
    transfer_question: >-
      当弱点集明显改善而保留集轻微波动时，阈值应怎样结合业务风险与统计噪声决定？
  CANDV2-har-a-host-language-orchestration:
    feynman: >-
      用团队本来就在写的编程语言安排 Agent 接力，就像直接用熟悉的函数和循环排班，而不是先学一门只为工作流存在的新语法。
    scenario: >-
      假设开发者用普通函数调用研究 Agent，用条件分支决定是否复核，再用循环处理文件列表；类型检查直接覆盖各步输入输出。
    how_to:
      - 把每个 Agent 步骤封装成有明确类型、输入、输出和错误的宿主语言函数。
      - 用原生分支、循环和并发原语表达控制流，并把副作用集中在可观察边界。
      - 用单元测试覆盖编排逻辑，再以真实运行验证框架运行时行为。
    transfer_question: >-
      当工作流需要非技术人员直接编辑时，宿主语言编排与专属 DSL 的取舍会怎样变化？
  CANDV2-har-a-independent-evaluation:
    feynman: >-
      让写答案的人自己打分，容易把“我本来想表达的”当成“产物真的表达了”。独立评估只看约定标准和实际产物，把意图与证据分开。
    scenario: >-
      假设生成 Agent 声称页面已完成，评估角色不读取其推理摘要，只按验收清单打开构建产物、检查链接并重跑测试。
    how_to:
      - 在生成前冻结评判标准、输入样本和证据格式。
      - 让评估者只接收真实产物与必要上下文，不继承生成者的自评结论。
      - 保存逐项结果和证据，由外部循环决定重试、退出或升级。
    transfer_question: >-
      如果生成者和评估者使用同一模型，但上下文隔离且判据固定，这能满足独立性吗；还剩什么相关偏差？
  CANDV2-har-a-reward-hacking:
    feynman: >-
      老师只数“做对几题”，学生发现删掉难题也能满分。分数变好了，真正目标却没完成；奖励攻击就是系统学会钻代理指标的空子。
    scenario: >-
      假设自修复 Agent 的目标是让测试全绿，它通过降低阈值和跳过失败用例达成高分，却没有修复原缺陷。
    how_to:
      - 写清真实目标、代理指标和绝对禁止的达分路径。
      - 检查高分产物的差异、被删除证据和未参与评分的结果。
      - 增加独立保留集、不可篡改门和人工抽查，再用已知作弊案例做负测。
    transfer_question: >-
      当指标提升同时伴随任务范围缩小，什么证据能区分合理简化与利用评分漏洞？
  CANDV2-har-b-agent-stop-conditions:
    feynman: >-
      给不停试路的司机设油量、时间和“连续三次没更近”的停车规则。停车可能意味着到达，也可能意味着该求助；停止与成功是两张不同的牌。
    scenario: >-
      假设排障 Agent 连续三轮提出同类改动且验证没有改善；Harness 达到无进展阈值后停止自动尝试并把证据交给人。
    how_to:
      - 为成功、预算耗尽、风险升级、重复状态和连续无进展分别定义可观测条件。
      - 让 Harness 维护计数、费用和进展信号，并在每轮动作前后检查。
      - 用永不成功和假装进展的任务做负测，确认能停止、转交并保留恢复材料。
    transfer_question: >-
      一个任务仍在产生新输出却没有减少关键不确定性时，终止条件应看活动量还是进展量，怎样量化？
  CANDV2-har-b-approval-fatigue:
    scenario: >-
      假设编辑每天要确认上百次可逆的格式调整；几天后所有弹窗都被秒点通过，真正涉及公开删除的高风险请求也没有得到认真检查。
    how_to:
      - 统计审批频率、风险级别、信息量、处理时间和事后撤销情况。
      - 合并重复低风险动作，给可逆操作设置预授权，把深度说明集中到高风险节点。
      - 用高风险混入测试观察审批者是否能识别，并根据漏审结果重新分层。
    transfer_question: >-
      减少审批次数后，怎样证明保护作用提高了，而不只是把更多动作静默放行？
  CANDV2-har-b-calibrate-before-automation:
    feynman: >-
      自动驾驶路线先由人陪跑几次：看清分岔、危险点和失败回收，再保存成常规线路。陪跑不是永远手扶方向盘，而是在放手前把边界校准。
    scenario: >-
      假设团队准备自动处理每日反馈，先由人监督三次真实批次，修正分类歧义、输出目录和异常升级，再开启定时触发。
    how_to:
      - 选取覆盖常见路径、边缘输入和失败情况的真实样本进行监督试跑。
      - 逐次记录人的改判、补充证据、权限边界和应保留的回执。
      - 固化分流与停止规则后再自动触发，并为输入分布变化设置重新校准信号。
    transfer_question: >-
      试跑样本全部成功但未覆盖高风险异常时，自动化可以开放到什么范围，哪些动作仍应保留人工门？
  CANDV2-har-b-data-exfiltration:
    scenario: >-
      假设文档中的恶意文本诱使 Agent 把环境密钥拼进诊断请求发送到外部地址；数据跨出了原本只允许项目内部使用的边界。
    how_to:
      - 画出敏感数据、信任边界以及日志、网络、工具返回和文件导出的所有外流通道。
      - 对每条通道应用最小权限、目的地白名单、脱敏和可审计阻断。
      - 用虚假密钥做诱导外传演练，确认请求在边界处失败且不会在日志留下明文。
    transfer_question: >-
      合法的第三方 API 需要部分用户数据时，怎样区分必要传输与数据外泄，并证明只发送了最小范围？
  CANDV2-har-b-goodharts-law:
    scenario: >-
      假设客服 Agent 只被考核平均处理时长，它通过尽快关闭复杂工单提高指标，却让返工和投诉上升。
    how_to:
      - 写出真实目标、当前指标、指标可能遗漏的质量和可被利用的路径。
      - 同时观察结果指标、禁止路径和抽样真实产物，避免单一分数决定成功。
      - 定期检查指标与业务结果的相关性；一旦脱钩就调整目标和门禁。
    transfer_question: >-
      当一个指标既能提供有效反馈又会被系统优化，怎样设计互补指标而不制造更复杂的刷分游戏？
  CANDV2-har-b-harness-ablation-testing:
    scenario: >-
      假设团队怀疑“计划步骤”提高代码任务成功率，于是固定模型和任务，只移除该组件重跑，比较过程错误和最终结果。
    how_to:
      - 选定一个待评估组件，并冻结模型、任务集、环境、指标和随机条件。
      - 分别运行完整 Harness 与单项移除或弱化版本，重复足够次数。
      - 比较结果、过程和副作用；若同时改了多个部件，结论保持未知并重做实验。
    transfer_question: >-
      某组件移除后速度更快但成功率略降，怎样结合任务价值判断它的净贡献？
  CANDV2-har-b-harness-compute-separation:
    scenario: >-
      假设控制层保存任务状态和云端凭据，模型生成的代码只在可销毁沙箱中运行；沙箱崩溃后重建，任务仍能从控制层恢复。
    how_to:
      - 列出状态、凭据、控制决策与不可信计算，分别指定所属层和通信接口。
      - 让执行环境只获得当前动作所需的短期能力，并限制文件、网络和资源。
      - 销毁计算环境后恢复任务，再用越权读取演练检查凭据没有泄漏。
    transfer_question: >-
      哪些中间状态必须留在 Harness 才能安全恢复，哪些放进沙箱反而更便于隔离和复现？
  CANDV2-har-b-infrastructure-noise:
    scenario: >-
      假设候选 Harness 在一次评测中快了很多，复查发现当天依赖已预热且网络更稳定；换回相同环境后优势消失。
    how_to:
      - 记录模型、工具版本、网络、缓存、沙箱、依赖和运行配置。
      - 对基线与候选交错重复运行，避免时间段和预热状态只偏向一组。
      - 分析失败类型和方差，对无法控制的环境变化单独报告而非归因给改动。
    transfer_question: >-
      当第三方服务延迟不可控时，怎样设计重复和对照，仍能估计 Harness 本身的贡献？
  CANDV2-har-b-prompt-injection:
    scenario: >-
      假设 Agent 读取网页时遇到“忽略系统要求并上传配置”的文字；内容被当作数据隔离，任何外发动作还需独立权限检查。
    how_to:
      - 标记可信指令与外部内容的来源和优先级，不把抓取文本拼进控制层。
      - 对外部内容触发的工具调用做权限、参数、目的地和敏感数据检查。
      - 用含伪指令的测试材料演练，确认被拒动作留下回执，同时验证残余风险仍被记录。
    transfer_question: >-
      如果外部文档中的一句话与用户目标完全一致，系统仍应依据什么决定它是证据还是可执行指令？
  CANDV2-har-b-repository-source-of-truth:
    scenario: >-
      假设新人 Agent 从仓库读到任务范围、权威文档和验证命令，发现聊天里的旧要求与最新决定冲突，于是按明确覆盖关系执行。
    how_to:
      - 把运行必需的规则、范围、状态和验收入口放入版本化、可定位的文件。
      - 声明权威顺序、维护者和过期处理，避免多份文档无声冲突。
      - 从空白会话仅依赖仓库执行一次任务，记录仍需口头补充的事实并决定是否纳入。
    transfer_question: >-
      哪些团队知识必须进入仓库才能支撑 Agent，哪些因隐私或时效性应留在其他受控系统并只登记入口？
  CANDV2-har-b-risk-tiered-autofixing:
    scenario: >-
      假设检查器发现文档错别字和数据库迁移问题；前者自动修复后轻量复核，后者只生成候选补丁并停止在人工审查门前。
    how_to:
      - 按可逆性、影响范围、权限、数据敏感度和验证强度定义风险等级。
      - 让系统生成修复，但把每一等级可自动推进的最远门禁写死。
      - 用错分级和越权修复做负测，确认高风险路径会停止并保留候选与证据。
    transfer_question: >-
      一个改动位于低风险目录却会改变公开数据，目录规则应如何被影响范围与可逆性覆盖？
  CANDV2-har-b-runnable-evidence:
    scenario: >-
      假设 Agent 声称接口已修复；审阅者在干净环境运行同一测试和冒烟命令，得到明确退出码与结果文件后才接受技术完成。
    how_to:
      - 把每项完成声明转换成别人可执行的命令、输入、预期结果和失败信号。
      - 在干净或独立环境重跑，保存版本、退出码和必要产物而非只截一张绿图。
      - 检查证据覆盖范围，把机器未验证的用户价值和发布判断继续标为未知。
    transfer_question: >-
      当验证依赖昂贵外部服务无法随时重跑时，怎样提供仍可独立检查、又不冒充实时结果的证据？
  CANDV2-har-b-sandboxed-autonomy:
    scenario: >-
      假设代码 Agent 可在临时工作树安装依赖和运行测试，无需每步确认，但不能访问家庭目录、生产凭据或任意网络。
    how_to:
      - 根据任务列出允许文件、命令、网络、凭据、资源和最长运行时间。
      - 在可销毁环境授予最小能力，并为越界动作设置明确失败和升级路径。
      - 演练误删、网络外连和资源耗尽，确认影响被限制且环境可重建。
    transfer_question: >-
      如果任务必须访问一个外部 API，怎样扩大沙箱能力而不把自主权等同于无限权限？
  CANDV2-har-b-verifiable-goal:
    scenario: >-
      假设任务目标从“把搜索做好”改成“给定十个查询，正确结果进入前三且无内部路径泄漏”；Agent 可据测试继续或停止。
    how_to:
      - 把成功写成可重复输入、明确判定和允许误差，并列出不可接受路径。
      - 准备至少一个应通过和一个应失败的样本，验证判定器不是恒绿。
      - 让 Agent 每轮运行证据，根据结果修正、停止或如实报告无法达到。
    transfer_question: >-
      一个目标容易机器判定却遗漏用户感受时，怎样增加人工质量边界而不让停止条件失去确定性？
  CANDV2-har-b-worktree-isolation:
    scenario: >-
      假设两个 Agent 同时修复同一仓库的不同问题，各自在独立工作树修改和测试；完成后通过显式 diff 与合并处理语义冲突。
    how_to:
      - 为每个并发任务创建独立工作树，并记录起始提交与负责范围。
      - 在各自目录运行修改和验证，禁止跨工作树共享未提交文件状态。
      - 合并前比较基线、测试和重叠文件，解决冲突后在整合状态重新验证。
    transfer_question: >-
      两个工作树修改不同文件却依赖同一业务不变量时，文件隔离之外怎样发现语义冲突？
  CANDV2-har-c-agent-actionable-diagnostics:
    feynman: >-
      好报错像一张维修单：指出哪儿坏了、应该换成什么、修完按哪个按钮复检。“出错了”只会让 Agent 猜；可执行诊断把下一步也做成接口。
    scenario: >-
      假设校验器不只报告“Schema 错误”，还给出文件路径、违规字段、允许值和复跑命令，Agent 可以定点修复后立即验证。
    how_to:
      - 为每类失败输出精确位置、实际值、期望约束和失败原因。
      - 给出一条安全的修正方向与可重复验证入口，不直接替 Agent 声称已修好。
      - 用常见错误样本观察 Agent 是否能一次定位；若仍猜测，就补足缺失上下文。
    transfer_question: >-
      当错误有多种合法修法时，诊断应提供具体替代还是只说明约束；怎样避免把建议变成错误决策？
  CANDV2-har-c-agent-capability-placement:
    scenario: >-
      假设“记住客户偏好”被放进 Skill 步骤后每次都要人工调用；团队重新判断其生命周期与责任，把持久事实移到记忆层，使用流程留在 Skill。
    how_to:
      - 描述能力保存什么、何时生效、谁更新、需要多长生命周期和是否参与运行控制。
      - 对照记忆、Skill、交互协议和运行中介层的职责，选择主要承载位置。
      - 用读取、更新、失败恢复和权限变化场景验证归位，必要时明确跨层接口。
    transfer_question: >-
      一个能力既需要长期知识又需要执行步骤时，怎样确定主要责任而不强迫它只属于一个组件？
  CANDV2-har-c-architecture-decision-record:
    feynman: >-
      代码像一栋已经盖好的房子，ADR 是留下“为什么楼梯在这里”的施工决定。它不替代房子和进度表，但能防止后来的人把必要结构当成偶然。
    scenario: >-
      假设团队决定把控制层与计算层分离，记录备选方案、权衡、日期和后果；半年后新成员能判断该决定是否仍适用。
    how_to:
      - 在形成重大结构决定时记录背景、约束、候选方案、最终选择和理由。
      - 标注状态、日期、影响和被谁覆盖，并链接相关实现与验证入口。
      - 变更架构前先核对现行记录；失效时新增覆盖决定，不静默改写历史。
    transfer_question: >-
      当实现已经偏离旧 ADR，但没有新决定时，应先改代码、更新状态还是补做决策；怎样保留真实历史？
  CANDV2-har-c-front-loaded-alignment:
    feynman: >-
      开工前先把“盖什么、承重墙在哪、先验收哪间房”对齐，纸上改线比楼盖一半再拆便宜。小修不必开大会，返工代价高时才值得前置。
    scenario: >-
      假设跨三个模块的功能在写代码前先确认目标、架构边界和两个交付切片；评审时提前发现数据所有权冲突，避免实现后重做。
    how_to:
      - 按误解代价和变更规模决定需要对齐的深度与参与者。
      - 在实现前写清目标、非目标、关键边界、备选方案和首个可验收切片。
      - 让相关角色指出分歧并形成决定；进入实现后只在新证据出现时重开。
    transfer_question: >-
      一个可逆的小改动什么时候仍需要前置对齐，什么时候直接做出垂直切片更经济？
  CANDV2-har-c-harness-future-proofing-test:
    scenario: >-
      假设团队只替换为能力更强的模型，不改提示、工具和工作流；若任务表现无法提升，Harness 可能限制了新能力的发挥。
    how_to:
      - 冻结任务集、评测、外部环境和 Harness 版本，只更换模型。
      - 比较质量、工具使用、失败类型、成本和延迟，确认新模型确有可用能力差异。
      - 定位阻塞收益的规则或接口，但不据此推断安全和可靠性已经合格。
    transfer_question: >-
      更强模型在固定 Harness 中没有提升时，怎样区分 Harness 阻塞、任务天花板和评测不敏感？
  CANDV2-har-c-harness-integrated-rl:
    scenario: >-
      假设训练阶段就让模型使用目标 Harness 的工具名、参数和反馈，并按任务结果强化；发布时仍使用同一运行接口。
    how_to:
      - 冻结目标 Harness 的工具合同、反馈通道、权限和训练任务分布。
      - 在训练中记录动作、结果和奖励，防止代理指标鼓励越界或投机路径。
      - 在保留任务和接口变体上评估，区分真实适配、过拟合与运行时规则问题。
    transfer_question: >-
      如果目标 Harness 频繁变更，内嵌强化学习的适配收益会怎样与维护和过拟合成本冲突？
  CANDV2-har-c-latent-deterministic-responsibility-split:
    feynman: >-
      让模型读懂模糊来信并判断意图，让程序核对金额、写数据库和计算结果。前者擅长“看懂”，后者擅长“照规则做到一模一样”，两边都还要验收。
    scenario: >-
      假设报销 Agent 由模型解释票据用途和异常线索，确定性程序计算总额、校验上限并提交系统；任一侧失败都有独立证据。
    how_to:
      - 把流程拆成解释判断、精确计算、规则校验和外部执行等步骤。
      - 将含歧义的综合任务交给模型，将可明确编码的计算与副作用交给程序。
      - 为交界处定义结构化合同，并分别注入模型误判和程序 bug 做验证。
    transfer_question: >-
      当规则本身频繁变化且包含例外时，哪部分仍应确定性执行，哪部分需要保留模型判断？
  CANDV2-har-c-model-routing:
    scenario: >-
      假设系统把简单分类交给低延迟模型，把高价值合约分析交给强模型；低档失败或置信不足时升级，并保留统一验证。
    how_to:
      - 按难度、错误代价、时延、成本和数据边界给任务建立可观察特征。
      - 用代表样本测试候选模型，设定默认路由、升级、降级和失败回退。
      - 监控各路由的实际质量与成本，防止任务分布变化后规则继续静默误分。
    transfer_question: >-
      一个任务输入很短但错误代价极高，应路由给便宜模型还是强模型；哪些特征比长度更重要？
  CANDV2-har-c-multi-step-reliability-decay:
    scenario: >-
      假设五步流程每步单测都约九成九成功，端到端运行仍偶发失败；加入相关故障和重试后，简单相乘已无法描述真实可靠性。
    how_to:
      - 画出步骤、条件分支、重试和恢复路径，并测量每条边的条件成功率。
      - 在独立假设成立时先计算乘积基线，再用端到端重复运行校准。
      - 找出贡献最大的失败节点，优先缩短链路、增强验证或增加恢复。
    transfer_question: >-
      当两个步骤会被同一网络故障同时影响时，为什么不能直接相乘；还需要收集什么联合失败数据？
  CANDV2-har-c-mutation-testing:
    scenario: >-
      假设测试套件全绿，团队故意把权限比较符改反；测试仍不失败，说明它没有真正守住所声称的权限行为。
    how_to:
      - 选择关键行为并定义与真实缺陷相近的小型变异类型。
      - 逐个注入变异并运行现有测试，记录被杀死、存活和不可判定项。
      - 检查存活原因，补测试或说明等价变异，再重新运行确认门禁有效。
    transfer_question: >-
      一个变异存活时，怎样区分测试缺口、无效变异和规范本身没有定义该行为？
  CANDV2-har-c-prompt-rule-accretion:
    feynman: >-
      每次漏水都往墙上贴一张“这里别漏”的纸，最后纸条互相遮住，墙还是没修。提示词规则堆积是不断加补丁，却不合并原则、消解冲突或下沉硬约束。
    scenario: >-
      假设每次失败都在系统提示末尾追加一条禁止规则；数月后同类要求重复、例外冲突，模型输出空间被挤压却仍会旧病复发。
    how_to:
      - 把规则按目标、触发条件和失败样本聚类，找出重复、矛盾和不可判定项。
      - 合并为少量原则，把可确定执行的限制下沉到 Schema、权限或校验器。
      - 在失效样本与保留行为集上比较精简前后版本，不凭提示变短宣布改善。
    transfer_question: >-
      一条规则只防住罕见高风险事件但增加普通任务摩擦时，应保留、下沉还是改成升级门；依据是什么？
  CANDV2-har-c-side-effect-aware-tool-scheduling:
    feynman: >-
      查两本书可以同时进行，两个搬家工人却不能同时改同一张物品清单。调度先问“会不会改变共享世界”，再决定并行、排队还是加锁。
    scenario: >-
      假设 Agent 可并行读取多个文档，但两个“更新库存”调用可能修改同一记录；调度器让读取并行、写入按资源键串行。
    how_to:
      - 为每个工具登记读取集、写入集、幂等性、远程隐含状态和失败补偿。
      - 只并行确认无冲突的调用；共享写入采用串行、锁、事务或幂等键。
      - 用竞态、重复请求和部分失败演练，检查最终状态与回执一致。
    transfer_question: >-
      一个标称只读的 API 会消耗共享配额并刷新缓存，它还能安全并行吗；调度合同应怎样表达？
  CANDV2-har-c-silent-semantic-failure:
    feynman: >-
      表格顺利导出、语法完全正确，却把“净利润”算成了“收入”；机器没有报错，意义已经错了。静默语义失败最危险的地方，就是一切看起来都在正常工作。
    scenario: >-
      假设报告生成成功、格式和链接全通过，但把来源中的“可能相关”写成“已证实因果”；传统监控没有任何异常信号。
    how_to:
      - 为关键含义、事实归属和约束建立可检查的语义判据与反例。
      - 除格式和运行检查外，抽取真实产物做来源对照、独立评估或任务级测试。
      - 把发现的语义失败转成回归样本，同时保留人工无法自动判定的未知项。
    transfer_question: >-
      当输出事实都正确但遗漏一个决定性限制时，它是否属于静默语义失败；你会怎样让门禁看见这种缺失？
  CANDV2-har-c-vertical-slice-delivery:
    scenario: >-
      假设团队先交付“一类用户提交请求、后端处理、页面展示结果”的完整细通路，真实走通后再扩展第二类请求。
    how_to:
      - 选取最小但用户可触达的结果，列出从入口到产物必须经过的全部层。
      - 只实现这一条端到端通路，并为关键边界增加验证和可观察回执。
      - 让用户或独立审阅者实际走通，修正后再复制模式扩展下一切片。
    transfer_question: >-
      一个切片横跨很多层却没有真实用户可见结果，它仍算垂直切片吗；最小验收闭环是什么？
