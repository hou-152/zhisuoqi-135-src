  axis: workflow
  note: 上下文选择应收窄与当前问题相关的证据，浏览循环则让每次新内容继续扩大候选范围。
- from: human-escalation-tool-call
  to: permission-boundary
  kind: used-with
  axis: system-responsibility
  note: 当权限边界要求人工裁决时，Agent 可发起显式人类调用并等待决定；该调用本身不授予越权能力。
- from: human-escalation-tool-call
  to: durable-execution
  kind: used-with
  axis: workflow
  note: 等待人类回复的工作流需要持久保存状态并在结果到达后恢复。
- from: restorable-compression
  to: context-compaction
  kind: contrast
  axis: concept-boundary
  note: 上下文压缩常用摘要承接历史，可恢复压缩则强调被省略原内容仍有回取路径。
- from: restorable-compression
  to: just-in-time-retrieval
  kind: used-with
  axis: runtime-composition
  note: 保留下来的引用需要在运行时按需取回原内容。
- from: retrieval-reasoning-dual-task-load
  to: context-selection
  kind: used-with
  axis: workflow
  note: 先做上下文选择可把资料定位与基于证据的推理拆开。
- from: retrieval-reasoning-dual-task-load
  to: minimal-sufficient-context
  kind: used-with
  axis: runtime-composition
  note: 提供聚焦的最小充分证据可以减少同一调用中的检索负担。
- from: system-prompt-altitude
  to: system-prompt
  kind: part-of
  axis: concept-boundary
  note: 抽象高度是设计系统提示时需要校准的一个属性。
- from: system-prompt-altitude
  to: guardrails
  kind: contrast
  axis: system-responsibility
  note: 系统提示提供行为启发式，护栏负责不可越过的运行边界，不能靠提高提示具体度替代。
- from: ubiquitous-language
  to: bounded-context
  kind: used-with
  axis: concept-boundary
  note: 统一语言只有在声明的领域边界内才能保持稳定含义。
- from: ubiquitous-language
  to: context-engineering
  kind: used-with
  axis: workflow
  note: 把领域语言沉淀为可读取资产，可减少跨会话重复解释并改善上下文对齐。
- from: change-impact-analysis
  to: context-selection
  kind: used-with
  axis: workflow
  note: 影响范围用于选择评审任务真正需要读取的代码与测试上下文。
- from: change-impact-analysis
  to: verification-loop
  kind: used-with
  axis: workflow
  note: 受影响范围可决定验证循环应运行哪些测试与检查。
- from: change-impact-analysis
  to: trace-based-evals
  kind: contrast
  axis: concept-boundary
  note: 变更影响分析沿代码结构预测受影响范围，基于轨迹的评测依据实际运行轨迹评价 Agent 行为。
- from: chat-template
  to: prompt
  kind: used-with
  axis: runtime-composition
  note: 聊天模板把角色化消息序列化为模型实际接收的 Prompt 格式。
- from: chat-template
  to: system-prompt
  kind: used-with
  axis: runtime-composition
  note: 系统提示通常作为特定角色消息被聊天模板纳入最终输入。
- from: event-driven-agent-automation
  to: agent-loop
  kind: used-with
  axis: workflow
  note: 事件负责触发运行，Agent 循环负责在触发后持续观察、行动与更新状态。
- from: event-driven-agent-automation
  to: dynamic-context-assembly
  kind: used-with
  axis: workflow
  note: 新事件进入时通常需要围绕该事件装配当次运行所需上下文。
- from: llm-token
  to: context-window
  kind: used-with
  axis: runtime-composition
  note: 上下文窗口容量通常按可容纳的 Token 数表示。
- from: llm-token
  to: attention-budget
  kind: contrast
  axis: concept-boundary
  note: Token 计数描述输入规模，注意力预算描述有限处理能力在内容之间的分配。
- from: observation-masking
  to: context-compaction
  kind: contrast
  axis: concept-boundary
  note: 观察掩码隐藏旧工具输出细节，Context Compaction 通常把较长历史总结成更短表示。
- from: observation-masking
  to: just-in-time-retrieval
  kind: used-with
  axis: workflow
  note: 被移出窗口的旧观察可保留轻量线索，并在再次需要时按需取回。
- from: observation-masking
  to: context-rot
  kind: used-with
  axis: workflow
  note: 掩码旧工具输出用于降低低信号历史对当前推理的干扰。
- from: persistent-code-graph
  to: just-in-time-retrieval
  kind: used-with
  axis: workflow
  note: Agent 可先查询图谱，再按需读取真正相关的文件与结构信息。
- from: persistent-code-graph
  to: memory
  kind: contrast
  axis: concept-boundary
  note: 持久化代码图谱保存可查询的代码结构关系，Memory 是更广义的跨步骤或跨会话信息层。
- from: persistent-code-graph
  to: model-context-protocol
  kind: used-with
  axis: runtime-composition
  note: 来源通过 MCP 工具把图谱查询能力暴露给 Claude。
- from: reasoning-effort
  to: large-language-model
  kind: used-with
  axis: runtime-composition
  note: 推理强度控制一次模型运行中分配给推理过程的额外计算预算。
- from: reasoning-effort
  to: attention-budget
  kind: contrast
  axis: concept-boundary
  note: 推理强度调节计算投入，注意力预算描述模型处理当前上下文信息的有限能力。
- from: skill-chaining
  to: skill
  kind: used-with
  axis: runtime-composition
  note: 链式调用以多个可独立运行的 Skill 为组成单元。
- from: skill-chaining
  to: verification-loop
  kind: used-with
  axis: workflow
  note: 来源用 Skill 链把产出、清理与验证步骤固化成端到端验证流。
- from: skill-chaining
  to: error-handling
  kind: used-with
  axis: workflow
  note: 自动调用链需要在中间步骤失败时决定停止、修复或升级。
- from: skill-trigger-condition
  to: skill
  kind: part-of
  axis: runtime-composition
  note: 触发条件是 Skill 元数据的一部分，用于决定该 Skill 的自动加载时机。
- from: skill-trigger-condition
  to: context-selection
  kind: used-with
  axis: workflow
  note: 触发条件把任务场景与是否选择该 Skill 进入上下文连接起来。
- from: tool-schema-tax
  to: harness-token-floor
  kind: part-of
  axis: runtime-composition
  note: 工具 Schema 的固定载荷是 Harness Token 底座中可单独测量的一部分。
- from: tool-schema-tax
  to: tool-scoping
  kind: used-with
  axis: workflow
  note: 只暴露当前步骤必要工具可同时降低选择噪声与工具 Schema 静态载荷。
- from: tool-schema-tax
  to: attention-budget
  kind: used-with
  axis: runtime-composition
  note: 大量工具说明会占用窗口并与任务信息争夺模型处理能力。
- from: agent-cli-runtime
  to: agent-harness
  kind: used-with
  axis: runtime-composition
  note: CLI runtime 可作为 Harness 暴露 Agent 工作流执行能力的一种入口，但不承担 Harness 的全部职责。
- from: agent-cli-runtime
  to: durable-execution
  kind: used-with
  axis: workflow
  note: 进入脚本与 CI/CD 后，长任务仍需持久化执行机制处理恢复和重试。
- from: instruction-locality
  to: tool
  kind: used-with
  axis: runtime-composition
  note: 来源用工具说明举例，要求把工具用法放在对应 tool description 中。
- from: instruction-locality
  to: system-prompt
  kind: contrast
  axis: concept-boundary
  note: 工具专属说明应靠近工具，而不是在系统提示中重复；系统提示仍承担更通用的产品级语境。
- from: tacit-knowledge
  to: context-engineering
  kind: used-with
  axis: workflow
  note: Context Engineering 需要识别并外化任务所需的隐性推理与权衡，才能让其进入后续选择和装配流程。
- from: tacit-knowledge
  to: context
  kind: contrast
  axis: concept-boundary
  note: 隐性知识在未被外化、选择并提供给模型之前，还不是模型当前可见的 Context。
- from: code-execution
  to: tool
  kind: part-of
  axis: runtime-composition
  note: 代码执行是 Harness 向 Agent 暴露的一类通用工具能力。
- from: code-execution
  to: sandbox
  kind: used-with
  axis: workflow
  note: 执行模型生成的代码通常需要隔离环境来限制影响范围。
- from: filesystem-workspace
  to: agent-harness
  kind: part-of
  axis: runtime-composition
  note: 文件系统工作区是 Harness 可提供的基础运行载体。
- from: filesystem-workspace
  to: sandbox
  kind: contrast
  axis: concept-boundary
  note: 文件系统工作区提供持久协作面，Sandbox 主要限制执行位置与影响范围。
- from: harness-overfitting
  to: harness-engineering
  kind: used-with
  axis: workflow
  note: Harness Engineering 需要用真实任务比较原生与替代接口，而不是假设官方配置恒优。
- from: harness-overfitting
  to: trace-based-evals
  kind: used-with
  axis: workflow
  note: 固定模型、任务与评测条件的跨 Harness 轨迹比较可检验泛化下降。
- from: repository-source-of-truth
  to: state-management
  kind: used-with
  axis: workflow
  note: 版本化仓库为进度、任务范围和交接状态提供可持续读取的载体。
- from: repository-source-of-truth
  to: context
  kind: used-with
  axis: runtime-composition
  note: 仓库是真源入口，具体任务仍需从中选择并装配当前所需 Context。
- from: risk-tiered-autofixing
  to: error-handling
  kind: part-of
  axis: engineering-scope
  note: 风险分级自动修复是系统发现错误后生成并路由修复的一类处理机制。
- from: risk-tiered-autofixing
  to: verification-loop
  kind: used-with
  axis: workflow
  note: 自动生成的修复仍需通过测试、审查或其他可复验检查后才能继续推进。
- from: risk-tiered-autofixing
  to: permission-boundary
  kind: used-with
  axis: system-responsibility
  note: 风险等级需要限制 Agent 能修改的范围以及修复候选可自动推进到的状态。
