schema_version: 1
record_kind: canonical_concept
id: model-context-protocol
slug: model-context-protocol
name_zh: 模型上下文协议
name_en: Model Context Protocol
aliases:
  - MCP
category_id: external-access
learning_stage: when-needed
definition_status: evolving
remember: MCP 是让 AI 应用以标准方式连接外部能力的协议；这些能力不只包括工具，也包括资源和提示。
feynman: 把 AI 应用想成一台设备，把外部能力想成不同厂商提供的配件。MCP 像统一的插接与通信规范：应用不用为每个配件重新发明接法，就能发现并使用工具、读取资源或取得提示内容；能力本身仍在协议两端，协议不替它们做事。
scenario:
  type: hypothetical
  text: 一个 AI 应用连接某个 MCP server 后，可以通过同一协议发现可调用工具、可读取资源和可取得的提示模板，再把请求送出并接收结果或内容。
image_mnemonic: AI 应用通过中央标准协议连接工具、资源、提示三类能力；实线向外表示请求或发现，虚线返回表示结果或内容回到应用。
source_context: 当前项目证据把 MCP 作为外部能力标准化接入 Harness 的方式，并用它区分框架内置工具与外部能力；本站据项目已有证据保留 tools、resources、prompts 三类协议能力，避免把 MCP 窄化为工具调用。官网协议边界由正式 sources 登记校准，具体版本能力以届时登记的官方规范为准。
boundaries:
  - MCP 是通信与接入协议，不是某个具体 Tool，也不保证已连接能力一定可用。
  - MCP 的范围不只等于工具调用；资源与提示也是当前项目采用口径中的独立能力类型。
  - 连接成功不等于能力已经投影到当前 Agent 会话；还要检查客户端、server、授权、会话工具面与运行策略。
  - MCP 不负责 Agent 是否选对能力、是否遵守权限或是否正确理解返回内容。
how_to:
  - 集成时分别验证 server 可连接、能力可发现、授权有效、当前会话实际可见，以及一次真实调用或读取能返回预期结果。
  - 讨论 MCP 时说明具体客户端、server、协议能力类型与版本，避免把“支持 MCP”当作完整能力证明。
  - 排错时先区分协议连接问题、能力实现问题、权限问题和 Agent 选择问题。
transfer_question: 一个 MCP server 探测成功，但 Agent 当前会话里看不到对应能力，这证明协议坏了，还是还需要检查会话投影与权限？
