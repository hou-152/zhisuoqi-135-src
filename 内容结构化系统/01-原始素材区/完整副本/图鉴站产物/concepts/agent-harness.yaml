schema_version: 1
record_kind: canonical_concept
id: agent-harness
slug: agent-harness
name_zh: Agent Harness
name_en: Agent Harness
aliases:
  - 智能体运行系统
category_id: continuous-action
learning_stage: now
definition_status: evolving
remember: Agent Harness 是包裹模型、组织循环并落实工具、状态、权限和错误处理的模型外运行系统；它让模型能够持续且受控地行动。
feynman: 模型像只负责判断下一步的核心，Harness 像围在外面的运行机器。它把任务和当前状态送给模型，执行模型请求的工具，把观察结果送回去，并在每一步检查权限、错误与停止条件。用户看到的是 Agent 在行动，背后让动作真正发生并受到约束的是 Harness。
scenario:
  type: hypothetical
  text: 同一个模型接入两套代码 Agent 系统：一套只能偶尔运行命令，另一套能保存进度、限制写入范围、处理工具失败并验证结果。即使模型权重不变，最终表现也会因 Harness 不同而明显不同。
image_mnemonic: 一个不变的中央模型，被循环、工具、状态和权限组成的运行壳包围；重点是模型外系统如何把一次判断变成受控行动。
source_context: Akshay 将 Harness 描述为包裹 LLM 的完整软件基础设施，并用循环、工具、记忆、上下文管理、状态持久化、错误处理和护栏说明其广义范围。本站采用“模型外运行系统”作为主口径，同时承认不同团队会把 Harness 说得更广或更薄。
boundaries:
  - Agent Harness 不等于模型；模型负责生成判断或工具请求，Harness 负责执行、回灌、状态与控制。
  - Agent Harness 也不等于用户感知到的 Agent；本站用 Agent 描述围绕目标持续行动的系统表现，用 Harness 描述产生并治理这种表现的运行机器。
  - “模型外一切”是便于划界的广义口径；工程实践中也有只把循环、工具分发与状态处理称为 Harness 的薄口径，讨论时要先声明范围。
  - Harness 会与 Context Engineering 交叉，因为它必须在运行时装配信息；但 Context 负责“模型看到什么”，Harness 负责“系统怎样持续、受控地运行”，不能静默压成一条轴。
how_to:
  - 排查 Agent 失败时，分别检查模型判断、循环、工具、状态、Context、权限、错误处理和验证，避免把所有问题都归因于模型能力。
  - 更换 Harness 组件时固定模型、任务和输入，再比较轨迹与结果，才能判断改动实际影响了什么。
  - 先定义 Harness 在当前系统中的边界，再讨论厚薄；不要让同一个词一会儿指完整非模型架构，一会儿只指 while 循环。
transfer_question: 如果模型完全没变，只因换了工具执行、状态和验证机制就能完成长任务，能力提升主要发生在哪一层？
