schema_version: 1
record_kind: canonical_concept
id: browsing-loop
slug: browsing-loop
name_zh: 浏览循环
name_en: Browsing Loop
aliases:
  - 探索扩散循环
category_id: continuous-action
learning_stage: when-needed
definition_status: evolving
remember: Agent 从一次广泛搜索或读取中不断发现新线索并继续扩张探索范围，却没有围绕具体问题收窄证据或形成停止判断的循环性反模式。
feynman: 每次搜索都发现一点新东西，于是 agent 永远觉得还该再看一点。它一直在移动，却没有更接近要回答的问题。
scenario:
  type: hypothetical
  text: 假设 Agent 为回答“是否更换供应商”连续打开几十篇材料；每篇都带来新名词，却没有补齐价格、稳定性和迁移成本三项决策证据。
image_mnemonic: 一张只表达「浏览循环」的纸面机制图：中心呈现「Agent 从一次广泛搜索或读取中不断发现新线索并继续扩张探索范围，却没有围绕具体问题收窄证据或形成停止判断的循环性反模式」，边缘用明确界线排除「它不是所有广泛探索；开放式规划任务可能确实需要先建立较宽的区域理解」；不画候选关系。
source_context: 本卡只采用以下来源范围：《工具更多反而让 Copilot 代码审查变差，GitHub 如何修正》：原文明确命名一种搜索不断扩散、却没有逼近任务证据的 Agent 失败循环。未被来源直接支持的产品结论、普遍因果或关系身份不写入本卡。
boundaries:
  - 它不是所有广泛探索；开放式规划任务可能确实需要先建立较宽的区域理解。
  - 判断重点是每一轮是否减少关键不确定性，而不只是工具调用次数是否增加。
  - 「浏览循环」只表示候选定义覆盖的机制；它不单独证明某个产品已经正确实现该机制或因此获得结果保证。
how_to:
  - 在搜索前写下要支持的决定、三个关键未知量和可接受的证据类型。
  - 每轮浏览后只记录本轮减少了哪个未知量；没有减少就改变查询或停止扩张。
  - 预先设定覆盖标准、时间预算和停止条件，到点输出证据缺口而不是继续漫游。
transfer_question: 面对一个本来就需要摸清全貌的开放题，怎样区分必要的广泛探索与已经失去问题锚点的浏览循环？
