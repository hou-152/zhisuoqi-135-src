schema_version: 1
record_kind: canonical_concept
id: durable-execution
slug: durable-execution
name_zh: 持久化执行
name_en: Durable Execution
aliases:
  - 耐久执行
category_id: continuous-action
learning_stage: when-needed
definition_status: evolving
remember: 持久化执行让长任务在进程或计算环境中断后，能依据外置状态重放并继续，同时避免已经发生的外部副作用被无意重复。
feynman: 它不只是给游戏存一张档。真正恢复时，系统还要知道哪些步骤可以安全重放、哪些付款或消息已经真的发出、再次执行会不会重复扣款。只有把状态、重放规则和副作用处理一起设计，任务才算能可靠续跑。
scenario:
  type: hypothetical
  text: Agent 在创建工单后容器崩溃。新容器读取外置状态，确认工单已经创建，只重放尚未完成的后续步骤，并用幂等键避免再创建一张重复工单。
image_mnemonic: 执行流在中断处断开，外置状态保存进度；新执行环境重放必要步骤后接续向前，而已经发生的副作用被去重闸门挡住。
source_context: OpenAI 的 Agents SDK 更新以 Harness 与 Compute 分离支撑长任务：状态外置后，原沙箱失效可在新环境中通过 snapshotting 与 rehydration 从 checkpoint 继续。本站进一步明确，checkpoint 只回答“从哪里恢复”，完整 Durable Execution 还要定义重放、幂等和外部副作用的恢复语义。
boundaries:
  - Durable Execution 不等于 checkpoint；保存恢复点是必要部件之一，却不能单独保证续跑正确。
  - 重放必须区分纯计算、可幂等调用和不可安全重复的外部副作用；不能假设所有步骤都能再跑一次。
  - “状态已恢复”不代表外部世界回到旧状态；工单、付款、邮件、文件写入等副作用要靠幂等键、事务、补偿或人工确认处理。
how_to:
  - 把长任务拆成有明确输入、输出和提交边界的步骤，并把运行状态存到短命计算环境之外。
  - 为每一步声明重放策略、幂等键与已提交证据；恢复时先对账，再决定跳过、重试、补偿或暂停。
  - 用故障注入验证进程退出、容器过期和网络超时后，任务既能继续，也不会重复产生副作用。
transfer_question: 一个工作流能从 checkpoint 启动，却在恢复后重复发送邮件，为什么它仍不能称为可靠的 Durable Execution？
