schema_version: 1
record_kind: canonical_concept
id: agent-stop-conditions
slug: agent-stop-conditions
name_zh: Agent 终止条件
name_en: Agent Stop Conditions
aliases:
  - Loop Hard Stops
category_id: human-control
learning_stage: when-needed
definition_status: evolving
remember: 为持续运行的 Agent 或循环预先定义必须停止、转交或重新规划的条件，例如达到迭代上限、连续无进展或耗尽 token 与费用预算。
feynman: 给不停试路的司机设油量、时间和“连续三次没更近”的停车规则。停车可能意味着到达，也可能意味着该求助；停止与成功是两张不同的牌。
scenario:
  type: hypothetical
  text: 假设排障 Agent 连续三轮提出同类改动且验证没有改善；Harness 达到无进展阈值后停止自动尝试并把证据交给人。
image_mnemonic: 一张只表达「Agent 终止条件」的纸面机制图：中心呈现「为持续运行的 Agent 或循环预先定义必须停止、转交或重新规划的条件，例如达到迭代上限、连续无进展或耗尽 token 与费用预算」，边缘用明确界线排除「它不是任务成功判定的同义词；循环可能因预算、风险或无进展而在未成功时停止」；不画候选关系。
source_context: 本卡只采用以下来源范围：《一次关于 Loop 的工程争论》：这段把最大迭代、无进展检测与成本上限并列为生产循环必须显式设计的终止边界。未被来源直接支持的产品结论、普遍因果或关系身份不写入本卡。
boundaries:
  - 它不是任务成功判定的同义词；循环可能因预算、风险或无进展而在未成功时停止。
  - 终止条件应由 Harness 执行，不能只依赖模型自行承诺停止。
  - 具体阈值取决于任务风险、成本和可恢复性，不存在通用固定数值。
  - 当前证据缺口：需要补充停止后转交、恢复和告警的标准处理路径。
how_to:
  - 为成功、预算耗尽、风险升级、重复状态和连续无进展分别定义可观测条件。
  - 让 Harness 维护计数、费用和进展信号，并在每轮动作前后检查。
  - 用永不成功和假装进展的任务做负测，确认能停止、转交并保留恢复材料。
transfer_question: 一个任务仍在产生新输出却没有减少关键不确定性时，终止条件应看活动量还是进展量，怎样量化？
