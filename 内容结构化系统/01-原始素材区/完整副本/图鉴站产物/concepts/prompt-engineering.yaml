schema_version: 1
record_kind: canonical_concept
id: prompt-engineering
slug: prompt-engineering
name_zh: 提示词工程
name_en: Prompt Engineering
aliases:
  - 提示工程
category_id: human-control
learning_stage: now
definition_status: industry-common
remember: 提示词工程是设计、组织和测试模型指令，让当前任务更容易被正确理解和完成的实践。
feynman: 如果 Prompt 是递给模型的一张输入纸，提示词工程就是动手整理这张纸：把目标说清楚，补上必要条件，安排示例和输出要求，再用实际结果检验措辞是否有效。它主要解决“怎么说”，不独自负责长期记忆、工具执行和整个运行系统。
scenario:
  type: hypothetical
  text: 你要模型把客服记录分类，于是明确类别定义、提供少量示例、规定输出格式，并用一组未见样本检查结果；这属于提示词工程。
image_mnemonic: 两只手正在整理一张散乱的指令纸，把目标、条件和输出要求收拢成清楚的一份输入。
source_context: Anthropic 将 prompt engineering 描述为编写与组织指令的离散任务，并把它与每轮持续策展整体信息状态的 context engineering 区分。其文章称后者为自然演进，而不是宣布前者被淘汰。
boundaries:
  - 提示词工程不等于 Context Engineering；前者主要处理指令表达，后者管理模型在每轮能看到的整体信息。
  - 它也不等于 Harness Engineering；工具执行、状态、权限、错误处理和生命周期属于更外层的运行系统。
  - 好措辞能提高期望结果的概率，但不能保证模型每次正确，也不能替代验证。
how_to:
  - 先写清目标、必要背景、约束与期望输出，再删除与当前任务无关的内容。
  - 用代表性样本测试提示，并记录失败类型；不要只凭一次满意回答判断提示已经稳定。
  - 当问题来自缺资料、工具失败或状态丢失时，转去修 Context 或 Harness，而不是无限润色措辞。
transfer_question: 如果模型已经听懂要求，却因为缺少最新资料而答错，继续改措辞还是改 Context，哪个更对症？
