id: risk-tiered-autofixing
slug: risk-tiered-autofixing
name_zh: 风险分级自动修复
name_en: Risk-Tiered Autofixing
aliases:
  - Autofixing
category_id: result-trust
learning_stage: when-needed
definition_status: evolving
remember: 系统在检测到问题后自动生成修复，并依据改动范围与风险等级决定轻量复核、深度人工审查或停止自动推进的修复机制。
feynman: 系统不只是告诉你哪里坏了，还会先修一版。如果问题在低风险区域，人看一眼确认就能上线；高风险区域才交给更资深的人深审。
scenario:
  type: hypothetical
  text: 假设检查器发现文档错别字和数据库迁移问题；前者自动修复后轻量复核，后者只生成候选补丁并停止在人工审查门前。
image_mnemonic: 一张只表达「风险分级自动修复」的纸面机制图：中心呈现「系统在检测到问题后自动生成修复，并依据改动范围与风险等级决定轻量复核、深度人工审查或停止自动推进的修复机制」，边缘用明确界线排除「它不是让 Agent 无条件修复并上线；风险分级决定自动化可以推进到哪一层门禁」；不画候选关系。
source_context: 本卡只采用以下来源范围：《Harness Engineering：AI-First 组织的信任机制重构》：这段呈现了按改动风险决定自动修复后的审查深度，使自动修复与人类门禁形成分级机制。未被来源直接支持的产品结论、普遍因果或关系身份不写入本卡。
boundaries:
  - 它不是让 Agent 无条件修复并上线；风险分级决定自动化可以推进到哪一层门禁。
  - 按目录判断风险只是来源中的一种实现，实际分级还可能依赖权限、数据敏感度、可逆性与影响范围。
  - 自动提交修复候选不等于修复正确、获准合并或已经部署，仍需独立验证与发布授权。
  - 当前证据缺口：需要另一套系统的风险分类、误修复处置和人工升级证据。
how_to:
  - 按可逆性、影响范围、权限、数据敏感度和验证强度定义风险等级。
  - 让系统生成修复，但把每一等级可自动推进的最远门禁写死。
  - 用错分级和越权修复做负测，确认高风险路径会停止并保留候选与证据。
transfer_question: 一个改动位于低风险目录却会改变公开数据，目录规则应如何被影响范围与可逆性覆盖？
