id: llm-token
slug: llm-token
name_zh: 模型词元
name_en: LLM Token
aliases: []
category_id: current-view
learning_stage: now
definition_status: evolving
remember: 大语言模型实际接收和生成的离散编码单位；输入长度、输出长度、上下文容量与常见计费都以它而非自然语言词数衡量。
feynman: 模型读写的不是我们眼中的“字”和“单词”，而是分词器切出的积木块。同一句话换一种分词器，积木数量会变；积木多也不等于问题更难。
scenario:
  type: hypothetical
  text: 假设中英文长度看起来相近的两段说明进入不同模型，计费和窗口占用差异很大；按字符估算让请求提前撞上上限。
image_mnemonic: 一个只表达「模型词元」的单一纸片隐喻：主体对应「大语言模型实际接收和生成的离散编码单位；输入长度、输出长度、上下文容量与常见计费都以它而非自然语言词数衡量」，留出一处明确界线排除「Token 不等同于汉字、英文单词或字符；同一文本在不同分词器下可产生不同数量」；不画候选关系。
source_context: 本卡只采用以下来源范围：《Coding Agent 如何工作：工具循环与上下文工程》：逐字说明 Token 是模型实际消费和生成的输入单位，并连接计费与上下文窗口约束。未被来源直接支持的产品结论、普遍因果或关系身份不写入本卡。
boundaries:
  - Token 不等同于汉字、英文单词或字符；同一文本在不同分词器下可产生不同数量。
  - Token 数量描述输入输出规模，不直接代表信息质量、任务难度或模型注意力是否有效。
  - 当前证据缺口：当前摘录没有展开分词器差异与多模态输入如何映射为 Token。
how_to:
  - 使用目标模型对应的分词器统计真实输入、输出和各组成部分的 Token。
  - 对代表性的中文、英文、代码和结构化数据分别测量，建立容量余量。
  - 在压缩或裁剪后复算 Token，并独立检查信息是否仍完整、任务是否仍可完成。
transfer_question: 当两个提示的 Token 数相同但任务表现不同，为什么不能据此断言它们占用了相同的有效注意力？
source_ids:
